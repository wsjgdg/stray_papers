  else if(kind==='ecosystem'){ for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j)m[i][j]=-0.3;else{const d=(j-i+n)%n;m[i][j]=d===1?0.8:d===n-1?0.5:(Math.random()<0.4?+(Math.random()*1.2-0.4).toFixed(2):-0.2);}} }
  else if(kind==='crystal'){ for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=Math.cos(2*Math.PI*(i-j)/n);m[i][j]=+(a*0.8).toFixed(2);} }
  else if(kind==='cyclic'){   // 单向环：吸后继、斥前驱、自弱斥，其余中性 → 干净循环流
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const d=(j-i+n)%n; m[i][j]= d===1?0.9 : (d===n-1? -0.9 : (i===j? -0.3 : (Math.random()<0.5?0.18:-0.18))); }
  }
  else if(kind==='amoeba'){    // 自吸他斥 → 团块状变形虫
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ m[i][j] = (i===j)? 0.32 : -(0.18+Math.random()*0.18); }
  }
  else if(kind==='flowers'){   // 棋盘吸引/排斥 → 花瓣状结构
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ m[i][j] = ((i+j)%2===0)? 0.62 : -0.62; }
  }
  else if(kind==='band'){      // 三段式色带：同带相吸、邻带弱吸、异带强斥
    const w=Math.ceil(n/3);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const g=Math.floor(i/w), h=Math.floor(j/w); m[i][j]= (g===h)?0.5 : (Math.abs(g-h)===1?0.3:-0.6); }
  }
  else if(kind==='war'){       // 两阵营：内部相吸、外阵营强斥
    const half=Math.ceil(n/2);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const ia=i<half, ja=j<half; m[i][j]= (ia===ja)?0.42 : -0.82; }
  }
  else if(kind==='predator'){  // 延伸食物链：吃后继、被前驱吃，其余随机
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const d=(j-i+n)%n; m[i][j]= d===1?0.85 : (d===n-1? -0.6 : (Math.random()<0.35?0.4:-0.3)); }
  }
  else if(kind==='swirl'){     // 旋转相位 → 漩涡/涡旋
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ m[i][j]= +((Math.cos((i-j)/n*Math.PI*2))*0.7).toFixed(2); }
  }
  else if(kind==='wave'){      // 正弦干涉 → 波纹/涟漪
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ m[i][j]= +((Math.sin((i-j)/n*Math.PI*2))*0.7).toFixed(2); }
  }
  else if(kind==='purple'){    // 双频干涉 → 斑驳晶簇
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){ m[i][j]= +((Math.sin(i*0.7+j*1.3))*0.7).toFixed(2); }
  }
  else { for(let i=0;i<n;i++)for(let j=0;j<n;j++)m[i][j]=+(Math.random()*2-1).toFixed(2); }
  return m;
}
function resizeMatrix(m,newN){
  const old=m.length, nm=[];
  for(let i=0;i<newN;i++){ nm[i]=[]; for(let j=0;j<newN;j++) nm[i][j]= (i<old&&j<old)? m[i][j] : +(Math.random()*2-1).toFixed(2); }
  return nm;
}
function defaultParams(type){
  switch(type){
    case "particles": return {count:3000, species:5};
    case "matrix": return {preset:"cluster", n:5, radius:90, m:makeMatrix("cluster",5)};
    case "damping": return {friction:0.10};
    case "noise": return {amp:0.0, scale:0.004, speed:0.15};
    case "mouse": return {mode:"attract", radius:140, strength:0.9};
    case "repel": return {radius:18, strength:1.6};
    case "align": return {radius:60, strength:0.5};
    case "cohere": return {radius:70, strength:0.4};
    case "render": return {tail:0.88, size:2.4, bloom:0.5, glow:0.6, theme:"Neon", chroma:1, hue:0, vignette:1, minN:1200};

}
function addNode(type,x,y,wire){
  const n={id:"n"+(++nid),type,x:(x==null?60:x|0),y:(y==null?60:y|0),params:defaultParams(type)};
  nodes.push(n);
  if(wire!==false){
    const src=nodes.find(z=>z.type==="particles");
    const snk=nodes.find(z=>z.type==="render");
    if(src && type!=="particles") edges.push({from:src.id,to:n.id});
    if(snk && type!=="render" && type!=="particles") edges.push({from:n.id,to:snk.id});

}
function removeNode(id){

}
function reaches(a,b){
  const seen=new Set([a]); const st=[a];
  while(st.length){ const c=st.pop();
    for(const e of edges){ if(e.from===c && !seen.has(e.to)){ if(e.to===b)return true; seen.add(e.to); st.push(e.to);} } }
  return false;
}
function addEdge(from,to){
  if(from===to) return;
  const tf=nodeById(from), tt=nodeById(to);
  if(!tf||!tt) return;
  if(tt.type==="particles") return;   // 粒子源只能作为起点
  if(tf.type==="render") return;      // 渲染节点只能作为终点
  if(edges.some(e=>e.from===from && e.to===to)) return;
  if(reaches(to,from)) return; // 防环
  edges.push({from,to});
  if(tt.enabled===false){ tt.enabled=true; }  // 连线即激活，与简单模式开关状态一致
  rebuildGraphUI(); if(_booted)onCommit();
}
function reachableSet(){
  const src=nodes.find(z=>z.type==="particles");
  const seen=new Set();
  if(!src) return seen;
  seen.add(src.id); const st=[src.id];
  while(st.length){ const c=st.pop();
    for(const e of edges){ if(e.from===c && !seen.has(e.to)){ seen.add(e.to); st.push(e.to);} } }
  return seen;
}
// 统一门控：行为激活 = 从粒子源可达(reachable) 且 未手动禁用(enabled!==false)
// 简单模式与高级模式共用同一判定，保证两套 UI 的激活集一致、效果对应
function activeBehaviors(){
  const seen=reachableSet();
  const set=new Set();
  for(const n of nodes){ if(n.type!=="particles" && n.type!=="render" && seen.has(n.id) && n.enabled!==false) set.add(n.id); }
  return set;
}

/* ===== 2. 粒子数据（CPU / GPU 物理共享） ===== */
const MAXN=12000;
const GRID_TEX_MAX=256;
const NP=16384;                 // B：bitonic 排序长度 = ≥MAXN 的最小 2 次幂（填充粒子排到末尾）
let px,py,vx,vy,sp;
function allocParticles(){ px=new Float32Array(MAXN); py=new Float32Array(MAXN); vx=new Float32Array(MAXN); vy=new Float32Array(MAXN); sp=new Int8Array(MAXN); }
function initParticles(){
  const n=Math.min(G.count,MAXN);
  for(let i=0;i<n;i++){ px[i]=Math.random()*W; py[i]=Math.random()*H; vx[i]=(Math.random()*2-1)*0.4; vy[i]=(Math.random()*2-1)*0.4; sp[i]=(Math.random()*G.species)|0; }
}
// 速度钳制 / 亮度归一化的参考半径，与网格尺寸解耦（B：网格按各行为实际半径收缩，不改变动力学尺度）
let curCapVal=5.4;
const grid={cols:0,rows:0,cell:0,buckets:null};

let gridStart=null, gridCursor=null, gridIdx=null, gridNCols=-1, gridNRows=-1;

// 收集当前行为图里“激活”的行为及其参数（CPU/GPU 步进共用）
function collectBehaviors(){
  const active=activeBehaviors();
  const act={};
  for(const id of active){ const z=nodes.find(z=>z.id===id); if(z)act[z.type]=z; }
  const has=k=>!!act[k];
  return {
    hasMatrix:has("matrix"), mat:act.matrix?act.matrix.params.m:null, mR:act.matrix?act.matrix.params.radius:90,
    hasDamp:has("damping"), fr:act.damping?act.damping.params.friction:0,
    hasNoise:has("noise"), nAmp:act.noise?act.noise.params.amp:0, nSc:act.noise?act.noise.params.scale:0.004, nSp:act.noise?act.noise.params.speed:0.15,
    hasMouse:has("mouse"), moMode:act.mouse?act.mouse.params.mode:"none", moR:act.mouse?act.mouse.params.radius:0, moS:act.mouse?act.mouse.params.strength:0,
    hasRepel:has("repel"), rR:act.repel?act.repel.params.radius:0, rS:act.repel?act.repel.params.strength:0,
    hasAlign:has("align"), aR:act.align?act.align.params.radius:0, aS:act.align?act.align.params.strength:0,
    hasCohere:has("cohere"), cR:act.cohere?act.cohere.params.radius:0, cS:act.cohere?act.cohere.params.strength:0,
    species:G.species,
  };
}
// 网格尺寸 = 所有参与邻居查询的行为的最大作用半径（matrix/align/cohere/mouse/repel）；
// 必须覆盖全部半径，否则 3×3 邻格无法兜住最远作用距离，导致漏算。再夹到 GPU 网格纹理上限内。
function activeRadii(b){
  let cs=30;
  if(b.hasMatrix) cs=Math.max(cs,b.mR);
  if(b.hasAlign) cs=Math.max(cs,b.aR);
  if(b.hasCohere) cs=Math.max(cs,b.cR);
  if(b.hasRepel) cs=Math.max(cs,b.rR);
  if(b.hasMouse) cs=Math.max(cs,b.moR);
  const cmin=Math.max(1,Math.max(W,H)/(GRID_TEX_MAX-1));
  if(cs<cmin) cs=cmin;
  return cs;
}
function buildGrid(){
  const b=collectBehaviors();
  const cs=activeRadii(b);
  const cols=Math.max(1,Math.ceil(W/cs)), rows=Math.max(1,Math.ceil(H/cs));
  const nCells=cols*rows;
  if(gridStart===null || gridNCols!==cols || gridNRows!==rows){
    gridStart=new Int32Array(nCells+1);
    gridCursor=new Int32Array(nCells);
    gridIdx=new Int32Array(MAXN);
    gridNCols=cols; gridNRows=rows;
  }
  grid.cols=cols; grid.rows=rows; grid.cell=cs;
  const n=Math.min(G.count,MAXN);
  gridStart.fill(0);
  for(let i=0;i<n;i++){
    let cx=(px[i]/cs)|0, cy=(py[i]/cs)|0;
    if(cx<0)cx=0;else if(cx>=cols)cx=cols-1;
    if(cy<0)cy=0;else if(cy>=rows)cy=rows-1;
    gridStart[cy*cols+cx+1]++;          // 计数写入 [c+1]，为前缀和让位
  }
  for(let c=1;c<=nCells;c++) gridStart[c]+=gridStart[c-1];   // 前缀和 → 每格 [start,end)
  gridCursor.set(gridStart.subarray(0,nCells));
  for(let i=0;i<n;i++){                  // 实际落桶（CSR 紧凑存放）
    let cx=(px[i]/cs)|0, cy=(py[i]/cs)|0;
    if(cx<0)cx=0;else if(cx>=cols)cx=cols-1;
    if(cy<0)cy=0;else if(cy>=rows)cy=rows-1;
    const c=cy*cols+cx; gridIdx[gridCursor[c]++]=i;
  }
}

/* ===== 3. CPU 仿真步进（per-behavior 半径，O(N·邻居)） ===== */
function cpuStep(){
  const b=collectBehaviors();
  const mat=b.mat, fr=b.fr;
  const n=Math.min(G.count,MAXN);
  const cs=grid.cell, cols=grid.cols, rows=grid.rows;
  const mR2=b.mR*b.mR, aR2=b.aR*b.aR, cR2=b.cR*b.cR, rR2=b.rR*b.rR;
  const maxR=cs, maxR2=maxR*maxR;
  curCapVal=Math.max(30,Math.max(b.mR,b.aR,b.cR))*0.06;
  const moActive=b.hasMouse && mouse.inside;
  const mx=mouse.x, my=mouse.y;
  const t=G.simTime*b.nSp;
  function curl(x,y){
    const a=Math.sin(x*b.nSc+t)*Math.cos(y*b.nSc*1.3 - t*0.7) + Math.sin((x+y)*b.nSc*0.6 + t*0.5);
    return a*Math.PI;
  }
  let avx,avy,acx,acy;
  if(b.hasAlign||b.hasCohere){
    if(!window._avx){window._avx=new Float32Array(MAXN);window._avy=new Float32Array(MAXN);window._acx=new Float32Array(MAXN);window._acy=new Float32Array(MAXN);}
    avx=window._avx;avy=window._avy;acx=window._acx;acy=window._acy;
    avx.fill(0);avy.fill(0);acx.fill(0);acy.fill(0);
  }
  const cntA=new Int32Array(n), cntC=new Int32Array(n);
  for(let i=0;i<n;i++){
    const xi=px[i], yi=py[i], ti=sp[i];
    let fxc=0, fyc=0;
    const cx=(xi/cs)|0, cy=(yi/cs)|0;
    for(let gy=cy-1;gy<=cy+1;gy++){
      if(gy<0||gy>=rows)continue;
      for(let gx=cx-1;gx<=cx+1;gx++){
        if(gx<0||gx>=cols)continue;
        const c0=gy*cols+gx, s=gridStart[c0], e=gridStart[c0+1];
        for(let bk=s;bk<e;bk++){
          const j=gridIdx[bk]; if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, d2=dx*dx+dy*dy;
          if(d2<1e-6||d2>maxR2)continue;
          const d=Math.sqrt(d2), ux=dx/d, uy=dy/d;
          if(b.hasMatrix && mat){
            const f=mat[ti][sp[j]];
            if(f!==0){
              let a;
              if(f>0){ a = d<b.mR*0.5 ? f*(d/(b.mR*0.5)) : f*((b.mR-d)/b.mR); }
              else { const f0=b.mR*0.2; a = d<f0 ? f*0.8 : f*((f0-d)/(b.mR-f0)); }
              fxc+=ux*a; fyc+=uy*a;
            }
          }
          if(b.hasRepel && d2<=rR2){ const a=(b.rR-d)/b.rR*b.rS; fxc-=ux*a; fyc-=uy*a; }
          if(b.hasAlign && d2<=aR2){ avx[i]+=vx[j]; avy[i]+=vy[j]; cntA[i]++; }
          if(b.hasCohere && d2<=cR2){ acx[i]+=px[j]; acy[i]+=py[j]; cntC[i]++; }
        }
      }
    }
    if(b.hasAlign && cntA[i]>0){ const dvx=avx[i]/cntA[i]-vx[i], dvy=avy[i]/cntA[i]-vy[i], m=Math.hypot(dvx,dvy)||1; fxc+=dvx/m*b.aS; fyc+=dvy/m*b.aS; }
    if(b.hasCohere && cntC[i]>0){ const dxc=acx[i]/cntC[i]-xi, dyc=acy[i]/cntC[i]-yi, m=Math.hypot(dxc,dyc)||1; fxc+=dxc/m*b.cS; fyc+=dyc/m*b.cS; }
    if(b.hasNoise && b.nAmp>0){ const ang=curl(xi,yi); fxc+=Math.cos(ang)*b.nAmp; fyc+=Math.sin(ang)*b.nAmp; }
    if(moActive){
      const dx=mx-xi, dy=my-yi, d=Math.hypot(dx,dy);
      if(d<b.moR && d>0.5){
        const ux=dx/d, uy=dy/d, w=(1-d/b.moR);
        if(b.moMode==="attract"){ fxc+=ux*b.moS*w; fyc+=uy*b.moS*w; }
        else if(b.moMode==="repel"){ fxc-=ux*b.moS*w; fyc-=uy*b.moS*w; }
        else { fxc+=-uy*b.moS*w; fyc+=ux*b.moS*w; }
      }
    }
    let nvx=vx[i]+fxc, nvy=vy[i]+fyc;
    const damp=1-fr; nvx*=damp; nvy*=damp;
    const sp2=nvx*nvx+nvy*nvy;
    if(sp2>curCapVal*curCapVal){ const s=curCapVal/Math.sqrt(sp2); nvx*=s; nvy*=s; }

  }
  for(let i=0;i<n;i++){
    let x=px[i]+vx[i], y=py[i]+vy[i];
    if(x<0)x+=W;else if(x>=W)x-=W; if(y<0)y+=H;else if(y>=H)y-=H;
    px[i]=x; py[i]=y;
  }

}

precision highp float;
uniform int u_N;

const FS_CELLKEY=`#version 300 es
precision highp float;
uniform int u_N,u_cols,u_rows; uniform float u_cs; uniform sampler2D u_pos;
out vec4 o;
void main(){
  int i=int(gl_FragCoord.x+0.5);
  float key,oi;
  if(i<u_N){ vec4 me=texelFetch(u_pos,ivec2(i,0),0);
    float cx=clamp(floor(me.x/u_cs),0.0,float(u_cols-1));
    float cy=clamp(floor(me.y/u_cs),0.0,float(u_rows-1));
    key=cy*float(u_cols)+cx; oi=float(i);
  } else { key=4000000.0; oi=float(i); }
  o=vec4(key,oi,0.0,0.0);
}`;
// 2) bitonic 比较-交换：i 与 p=i^j 比较。方向由「低位 lo=min(i,p)」的 (lo&k) 决定（标准 bitonic 网络：
//    同块内低位升序、高位降序；必须用 lo 判定，不可用 fragment 自身 i，否则同块高低位都判升序导致交换错乱）。
//    低位取 min(升序)/max(降序)，高位取 max(升序)/min(降序)。texelFetch 读 (key,origIndex) 于 .x/.y
const FS_BITONIC=`#version 300 es
precision highp float;
uniform int u_N,u_k,u_j; uniform sampler2D u_arr;
out vec4 o;
void main(){
  int i=int(gl_FragCoord.x+0.5);
  int p=i^u_j;
  vec4 a=texelFetch(u_arr,ivec2(i,0),0);
  vec4 b=texelFetch(u_arr,ivec2(p,0),0);
  int lo = (i<p)? i : p;
  int asc = ((lo & u_k)==0)?1:0;
  bool takeA;
  if(i==lo) takeA = (asc==1)? (a.x<=b.x) : (a.x>=b.x);   // 低位：升序取小 / 降序取大
  else      takeA = (asc==1)? (a.x>=b.x) : (a.x<=b.x);   // 高位：升序取大 / 降序取小
  o = takeA ? a : b;
}`;

uniform int u_N,u_loopN; uniform sampler2D u_arr,u_pos,u_sp;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oSp;

  int i=int(gl_FragCoord.x+0.5);
  vec4 e=texelFetch(u_arr,ivec2(i,0),0);

// 4) gridInfo：对每个 cell c，单 pass 扫 sortedPos（长度 N）累计 start/count（O(N·cells)，cells 通常 <4096）

const VS_GRIDINFO=`#version 300 es
precision highp float;
uniform int u_cols,u_rows;

const FS_GRIDINFO=`#version 300 es

uniform int u_loopN,u_cols,u_rows; uniform float u_cs; uniform sampler2D u_sortedPos;

let _pboList=null, _pboFence=[null,null], _pboWrite=0, _pboReady=false, gpuReadbackMode="无";

const FS_SCENE=`#version 300 es
precision highp float;
in vec2 v_local; in vec3 v_color; in float v_bri;
out vec4 o;
void main(){
  float d=length(v_local);
  float a=smoothstep(1.0,0.0,d);
  float glow=a*a;
  vec3 col=v_color*glow*(0.6+v_bri*0.9);
  float hot=pow(v_bri,2.0);            // 速度越快 → 白热星核，呈彗星/星尘感
  col+=vec3(1.0)*hot*0.7;
  o=vec4(col*glow*0.55, glow*0.55);   // 单颗更透：密集区靠加色叠加显色，避免整团过曝白
}`;
const VS_QUAD=`#version 300 es
layout(location=0) in vec2 a_pos;
out vec2 v_uv;
void main(){ v_uv=a_pos*0.5+0.5; gl_Position=vec4(a_pos,0.0,1.0); }`;
const FS_FADE=`#version 300 es
precision highp float;
out vec4 o;
uniform float u_fade;
void main(){ o=vec4(0.0,0.0,0.0,u_fade); }`;
const FS_BLUR=`#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_dir; uniform vec2 u_res;
void main(){
  vec2 px=u_dir/u_res;
  float w[5]=float[](0.227,0.194,0.121,0.054,0.016);
  vec4 c=texture(u_tex,v_uv)*w[0];
  for(int i=1;i<5;i++){ c+=texture(u_tex,v_uv+px*float(i))*w[i]; c+=texture(u_tex,v_uv-px*float(i))*w[i]; }
  o=c;
}`;
const FS_COMP=`#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_scene; uniform sampler2D u_bloom;
uniform float u_bloomStr; uniform float u_glow;
uniform float u_exposure; uniform float u_core; uniform float u_bloomThresh;
uniform float u_chroma; uniform float u_hue; uniform float u_vignette;
vec3 hueRotate(vec3 c, float a){
  const vec3 k=vec3(0.57735026);
  float ca=cos(a);
  return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.0-ca);
}
void main(){
  // 径向色散（棱镜边光）：中心无色偏，边角按半径拉伸 RGB；u_chroma=0 时完全关闭
  vec2 dir=v_uv-0.5; float rr=length(dir);
  vec2 off=dir*(0.0024*u_chroma*rr);
  vec3 s;
  s.r=texture(u_scene,v_uv+off).r;
  s.g=texture(u_scene,v_uv).g;
  s.b=texture(u_scene,v_uv-off).b;
  vec3 b=texture(u_bloom,v_uv).rgb;
  vec3 bSoft=max(b-u_bloomThresh,vec3(0.0));        // 软阈值：只有亮处才泛光，避免整团泛白
  vec3 base=s*(1.0+u_glow*0.3)+bSoft*u_bloomStr;
  float l=max(base.r,max(base.g,base.b));
  vec3 hue=(l>1e-4)? base/l : vec3(0.0);            // 色相保留：密集区保持颜色方向
  float v=1.0-exp(-l*u_exposure);                    // 仅对亮度压缩，不冲掉颜色
  vec3 col=hue*v;
  col+=vec3(1.0-v)*u_core*smoothstep(1.5,6.0,l);    // 仅极高密度加白核高光，呈星核感
  col=pow(col,vec3(0.9));
  col=hueRotate(col, u_hue);                          // P2：全局色相旋转（弧度）
  // 暗角：u_vignette=0 时关闭，避免不需要时压暗边角
  vec2 q=v_uv*2.0-1.0;
  float vig=smoothstep(1.45,0.25,length(q));
  col*=mix(mix(1.0,0.5,u_vignette),1.0,vig);
  // 暗区透明，透出底层星云背景
  float a=clamp(max(col.r,max(col.g,col.b))*1.25,0.0,1.0);
  o=vec4(col,a);
}`;

const VS_LINK=`#version 300 es
layout(location=0) in vec2 a_pos; layout(location=1) in vec3 a_col;
uniform vec2 u_res; out vec3 v_col;
void main(){ vec2 c=a_pos/u_res*2.0-1.0; c.y=-c.y; gl_Position=vec4(c,0.0,1.0); v_col=a_col; }`;
const FS_LINK=`#version 300 es
precision highp float; in vec3 v_col; out vec4 o; uniform float u_alpha;
void main(){ o=vec4(v_col*u_alpha, u_alpha); }`;
function makeFBO(w,h){
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  const ifmt=GL_FLOAT?gl.RGBA16F:gl.RGBA8, typ=GL_FLOAT?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
  gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,gl.RGBA,typ,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fbo,tex,w,h};
}
function setupGL(){
  if(!GL_OK) return;
  try{
    GL_FLOAT=!!gl.getExtension('EXT_color_buffer_float');
    progScene=linkP(VS_SCENE,FS_SCENE);
    locS_pos=gl.getUniformLocation(progScene,"u_pos");
    locS_sp=gl.getUniformLocation(progScene,"u_sp");
    locS_res=gl.getUniformLocation(progScene,"u_res");
    locS_baseSize=gl.getUniformLocation(progScene,"u_baseSize");
    locS_cap=gl.getUniformLocation(progScene,"u_cap");
    locS_palette=gl.getUniformLocation(progScene,"u_palette");
    locS_chroma=gl.getUniformLocation(progScene,"u_chroma");
    locS_hue=gl.getUniformLocation(progScene,"u_hue");
    locS_vignette=gl.getUniformLocation(progScene,"u_vignette");
    progFade=linkP(VS_QUAD,FS_FADE);
    progBlur=linkP(VS_QUAD,FS_BLUR);
    progComp=linkP(VS_QUAD,FS_COMP);
    progLink=linkP(VS_LINK,FS_LINK);
    linkVBO=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,linkVBO); gl.bufferData(gl.ARRAY_BUFFER,LINK_CAP*5*4,gl.DYNAMIC_DRAW);
    linkVAO=gl.createVertexArray(); gl.bindVertexArray(linkVAO);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,20,0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,20,8);
    gl.bindVertexArray(null); gl.bindBuffer(gl.ARRAY_BUFFER,null);
  }catch(e){ GL_OK=false; errEl.style.display="flex"; errEl.textContent="着色器编译失败："+e.message; return; }
  const qb=new Float32Array([-1,-1,1,-1,-1,1,1,1]);
  quadVAO=gl.createVertexArray(); gl.bindVertexArray(quadVAO);
  const qvbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,qvbo);
  gl.bufferData(gl.ARRAY_BUFFER,qb,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  instVAO=gl.createVertexArray(); gl.bindVertexArray(instVAO);
  // 单位四边形角点（location 0）挂到 instVAO；粒子状态改由 VS_SCENE 直接从 GPU 状态纹理采样，不再需要实例属性缓冲
  gl.bindBuffer(gl.ARRAY_BUFFER,qvbo);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(0,0);
  gl.bindVertexArray(null); gl.bindBuffer(gl.ARRAY_BUFFER,null);
  resizeGL();
}
function resizeGL(){
  if(appEl.classList.contains("stage-hidden")) return;  // 展示台收起时不重置画布尺寸，避免 0 尺寸缓冲
  W=Math.floor(stage.clientWidth); H=Math.floor(stage.clientHeight);
  if(!GL_OK){ if(CTX2D){ gl2d.width=W; gl2d.height=H; gl2d.style.width=W+"px"; gl2d.style.height=H+"px"; } return; }
  const baseDpr=Math.min(window.devicePixelRatio||1,2);
  const eff=baseDpr*renderScale;
  canvas.width=Math.max(1,Math.round(W*eff)); canvas.height=Math.max(1,Math.round(H*eff)); canvas.style.width=W+"px"; canvas.style.height=H+"px";
  try{
    if(texScene){ gl.deleteTexture(texScene); gl.deleteFramebuffer(fboScene.fbo); }
    if(texA){ gl.deleteTexture(texA); gl.deleteFramebuffer(fboA.fbo); }
    if(texB){ gl.deleteTexture(texB); gl.deleteFramebuffer(fboB.fbo); }
    fboScene=makeFBO(canvas.width,canvas.height); texScene=fboScene.tex;
    fboA=makeFBO(canvas.width>>1,canvas.height>>1); texA=fboA.tex;
    fboB=makeFBO(canvas.width>>1,canvas.height>>1); texB=fboB.tex;
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboScene.fbo); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }catch(e){ GL_OK=false; errEl.style.display="flex"; errEl.textContent="帧缓冲创建失败："+e.message; }
}
// 一次性把 CPU 初始状态上传到 GPU 状态纹理（仅 reset / setCount / boot 时调用，热路径零上传）
function uploadStateToGPU(){
  if(!gpuPhysicsReady) return;
  const n=Math.min(G.count,MAXN);
  for(let i=0;i<n;i++){ const o=i*4; gpuUploadPos[o]=px[i]; gpuUploadPos[o+1]=py[i]; gpuUploadPos[o+2]=vx[i]; gpuUploadPos[o+3]=vy[i]; gpuUploadSp[i]=sp[i]; }
  gl.bindTexture(gl.TEXTURE_2D,posTexSrc); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,n,1,gl.RGBA,gl.FLOAT,gpuUploadPos);
  gl.bindTexture(gl.TEXTURE_2D,spTex); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,n,1,gl.RED,gl.FLOAT,gpuUploadSp);
}
function renderScene(){
  if(!GL_OK) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fboScene.fbo);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progFade);
  gl.uniform1f(gl.getUniformLocation(progFade,"u_fade"),1.0-G.tail);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(progScene);
  gl.uniform1i(locS_pos,0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,posTexSrc);
  gl.uniform1i(locS_sp,1); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,spTex);
  gl.uniform2f(locS_res,W,H);
  gl.uniform1f(locS_baseSize,G.size);
  gl.uniform1f(locS_cap,curCapVal);
  if(_paletteTheme!==G.theme) buildPaletteFlat();
  gl.uniform3fv(locS_palette, paletteFlat);
  const n=Math.min(G.count,MAXN);
  gl.bindVertexArray(instVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,n);
  gl.bindVertexArray(null);
  if(G.links){ const vc=collectLinks(); if(vc>0) drawLinksGL(vc); }   // 连线网绘入场景，随 bloom 泛光
  gl.disable(gl.BLEND);
  if(G.bloom>0.02){   // C：辉光≈0 时跳过整条 bloom 模糊 pass，省两次全屏绘制（comp 端 u_bloomStr=0 仍归零，无视觉差异）
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboA.fbo); gl.viewport(0,0,fboA.w,fboA.h);
    gl.useProgram(progBlur);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texScene);
    gl.uniform1i(gl.getUniformLocation(progBlur,"u_tex"),0);
    gl.uniform2f(gl.getUniformLocation(progBlur,"u_res"),fboA.w,fboA.h);
    gl.uniform2f(gl.getUniformLocation(progBlur,"u_dir"),1,0);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fboB.fbo); gl.viewport(0,0,fboB.w,fboB.h);
    gl.bindTexture(gl.TEXTURE_2D,texA);
    gl.uniform2f(gl.getUniformLocation(progBlur,"u_dir"),0,1);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);   // 默认帧缓冲透明，暗区透出星云
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texScene);
  gl.uniform1i(gl.getUniformLocation(progComp,"u_scene"),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texB);
  gl.uniform1i(gl.getUniformLocation(progComp,"u_bloom"),1);
  gl.uniform1f(gl.getUniformLocation(progComp,"u_bloomStr"),G.bloom);
  gl.uniform1f(gl.getUniformLocation(progComp,"u_glow"),G.glow);
  gl.uniform1f(gl.getUniformLocation(progComp,"u_exposure"),1.0);
  gl.uniform1f(gl.getUniformLocation(progComp,"u_core"),0.32);
  gl.uniform1f(gl.getUniformLocation(progComp,"u_bloomThresh"),0.22);
  gl.uniform1f(locS_chroma,G.chroma);                 // P2：色散强度（0=关）
  gl.uniform1f(locS_hue,G.hue*Math.PI/180.0);         // P2：色相旋转（度→弧度）
  gl.uniform1f(locS_vignette,G.vignette);             // P2：暗角开关
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindVertexArray(null);
}

/* 2D 兜底渲染：WebGL2 不可用 / 着色器失败时启用，保证任何环境都能看到粒子 */
function setup2D(){
  gl2d=document.getElementById("gl2d");
  try{ ctx2=gl2d.getContext("2d"); }catch(e){ ctx2=null; }
  if(!ctx2){ errEl.style.display="flex"; errEl.textContent="当前环境既不支持 WebGL2 也无 2D 画布，无法渲染。"; return false; }
  canvas.style.display="none";        // WebGL 画布隐藏，避免透明层遮挡 2D 路径
  gl2d.style.display="block";
  CTX2D=true; errEl.style.display="none";
  return true;
}
let _spriteTheme=null, _sprites=[], _cores=null;
// 每个物种预渲染一张发光贴图（离屏 canvas 缓存），渲染时纯 drawImage 混合，
// 避免每粒子每帧 createRadialGradient 造成的 GC 抖动与卡顿
function buildSprites(){
  const pal=THEMES[G.theme]||THEMES.Neon;
  const S=64;
  _sprites=pal.map(col=>{
    const cv=document.createElement("canvas"); cv.width=S; cv.height=S;
    const c=cv.getContext("2d");
    const R=(col[0]*255)|0, gc=(col[1]*255)|0, B=(col[2]*255)|0;
    const g=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    g.addColorStop(0,`rgba(${R},${gc},${B},0.85)`);
    g.addColorStop(0.18,`rgba(${R},${gc},${B},0.42)`);
    g.addColorStop(0.5,`rgba(${R},${gc},${B},0.12)`);
    g.addColorStop(1,`rgba(${R},${gc},${B},0)`);
    c.fillStyle=g; c.fillRect(0,0,S,S);
    return cv;
  });
  if(!_cores){   // 速度越快越白热的星核（主题无关）
    const cv=document.createElement("canvas"); cv.width=S; cv.height=S;
    const c=cv.getContext("2d");
    const g=c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    g.addColorStop(0,"rgba(255,255,255,0.95)");
    g.addColorStop(0.4,"rgba(255,255,255,0.32)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    c.fillStyle=g; c.fillRect(0,0,S,S);
    _cores=cv;
  }
  _spriteTheme=G.theme;
}
function renderScene2D(){
  const n=Math.min(G.count,MAXN);
  if(_spriteTheme!==G.theme) buildSprites();
  const cap=curCapVal;
  // 透明拖尾：用 destination-out 削减旧像素 alpha，使轨迹随时间淡入底层星云（而非涂黑）
  ctx2.globalCompositeOperation="destination-out";
  ctx2.fillStyle=`rgba(0,0,0,${1-G.tail})`;
  ctx2.fillRect(0,0,gl2d.width,gl2d.height);
  ctx2.globalCompositeOperation="lighter";
  if(G.links){   // 近邻连线网（constellation）：画在粒子下层，一次性 Path 批量描边
    const vc=collectLinks();
    if(vc>0){
      ctx2.globalAlpha=1;
      ctx2.beginPath();
      for(let v=0; v<vc; v+=2){ const o=v*5; ctx2.moveTo(linkData[o],linkData[o+1]); ctx2.lineTo(linkData[(v+1)*5],linkData[(v+1)*5+1]); }
      ctx2.strokeStyle=`rgba(150,205,255,${G.linkAlpha})`; ctx2.lineWidth=1; ctx2.stroke();
    }
  }
  const ns=_sprites.length;
  for(let i=0;i<n;i++){
    const spd=Math.min(1,Math.hypot(vx[i],vy[i])/cap);
    const r=Math.max(2, G.size*(0.7+spd*0.9)*2.6);
    ctx2.globalAlpha=0.10+spd*0.24;
    ctx2.drawImage(_sprites[sp[i]%ns], px[i]-r, py[i]-r, r*2, r*2);
    if(spd>0.2){   // 高速粒子叠加白热星核，呈彗星/星尘感
      const cr=r*0.7, ca=(spd-0.2)*0.6;
      ctx2.globalAlpha=Math.min(0.9,ca);
      ctx2.drawImage(_cores, px[i]-cr, py[i]-cr, cr*2, cr*2);
    }
  }
  ctx2.globalAlpha=1;
  ctx2.globalCompositeOperation="source-over";
}

/* ===== 4b. 近邻连线网（constellation）===== */
let linkBuckets=null, linkCols=0, linkRows=0, linkData=null;
function buildLinkGrid(){
  const lr=G.linkR;
  const cols=Math.max(1,Math.ceil(W/lr)), rows=Math.max(1,Math.ceil(H/lr));
  if(!linkBuckets||linkCols!==cols||linkRows!==rows){
    linkBuckets=new Array(cols*rows); for(let k=0;k<cols*rows;k++)linkBuckets[k]=[];
  } else { for(let k=0;k<linkBuckets.length;k++)linkBuckets[k].length=0; }
  linkCols=cols; linkRows=rows;
  const n=Math.min(G.count,MAXN);
  for(let i=0;i<n;i++){ let cx=(px[i]/lr)|0, cy=(py[i]/lr)|0;
    if(cx<0)cx=0; else if(cx>=cols)cx=cols-1;
    if(cy<0)cy=0; else if(cy>=rows)cy=rows-1;
    linkBuckets[cy*cols+cx].push(i); }
}
// 填充 linkData（每顶点 x,y,r,g,b），返回顶点数；按 j>i 去重，超 LINK_CAP 截断
function collectLinks(){
  if(!linkData) linkData=new Float32Array(LINK_CAP*5);
  buildLinkGrid();
  const lr=G.linkR, lr2=lr*lr, n=Math.min(G.count,MAXN);
  const pal=THEMES[G.theme]||THEMES.Neon;
  let vc=0;
  for(let i=0;i<n && vc+2<=LINK_CAP;i++){
    const xi=px[i], yi=py[i], ci=pal[sp[i]%pal.length];
    const cx=(xi/lr)|0, cy=(yi/lr)|0;
    for(let gy=cy-1;gy<=cy+1;gy++){ if(gy<0||gy>=linkRows)continue;
      for(let gx=cx-1;gx<=cx+1;gx++){ if(gx<0||gx>=linkCols)continue;
        const bk=linkBuckets[gy*linkCols+gx];
        for(let k=0;k<bk.length;k++){ const j=bk[k]; if(j<=i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, d2=dx*dx+dy*dy; if(d2>lr2)continue;
          const cj=pal[sp[j]%pal.length];
          let o=vc*5; linkData[o]=xi; linkData[o+1]=yi; linkData[o+2]=ci[0]; linkData[o+3]=ci[1]; linkData[o+4]=ci[2]; vc++;
          o=vc*5; linkData[o]=px[j]; linkData[o+1]=py[j]; linkData[o+2]=cj[0]; linkData[o+3]=cj[1]; linkData[o+4]=cj[2]; vc++;
          if(vc>=LINK_CAP) return LINK_CAP;   // 单粒子邻居众多时会越界，及早截断
        }
      }
    }
  }
  return vc>LINK_CAP?LINK_CAP:vc;
}
function drawLinksGL(vc){
  gl.useProgram(progLink);
  gl.bindBuffer(gl.ARRAY_BUFFER,linkVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,linkData.subarray(0,vc*5));
  gl.uniform2f(gl.getUniformLocation(progLink,"u_res"),W,H);
  gl.uniform1f(gl.getUniformLocation(progLink,"u_alpha"),G.linkAlpha);
  gl.bindVertexArray(linkVAO);
  gl.drawArrays(gl.LINES,0,vc);
  gl.bindVertexArray(null);
}

/* ===== 5. 主循环 ===== */
let lastT=performance.now(), fpsAcc=0, fpsCnt=0, fpsEMA=0, adaptOn=true;
// C2：固定步长累加器 —— 物理按真实时间以 FIXED_DT 定步推进，与渲染帧率解耦
// （此前每帧一步：20fps 下演化速度只有 60fps 的 1/3，不同机器行为不一致）
const FIXED_DT=1/60, MAX_STEPS=3;
let physAcc=0, lastFrameT=performance.now(), diagSteps=0, cpuStepMsEMA=0, gpuStepMsEMA=0;
let forceBackend="auto";   // auto | gpu | cpu —— 诊断用：强制后端以 A/B 对比真实耗时

    if(b.hasAlign&&cntA[i]>0){const dvx=_avx[i]/cntA[i]-vx[i],dvy=_avy[i]/cntA[i]-vy[i],m=Math.hypot(dvx,dvy)||1;fxc+=dvx/m*b.aS;fyc+=dvy/m*b.aS;}
    if(b.hasCohere&&cntC[i]>0){const dxc=_acx[i]/cntC[i]-xi,dyc=_acy[i]/cntC[i]-yi,m=Math.hypot(dxc,dyc)||1;fxc+=dxc/m*b.cS;fyc+=dyc/m*b.cS;}

function tick(){ if(!running)return; for(let s=0;s<MAX_STEPS;s++){ buildGrid(); stepOnce(); } if(N>0){ const buf=new Float32Array(N*5); for(let i=0;i<N;i++){buf[i*5]=px[i];buf[i*5+1]=py[i];buf[i*5+2]=vx[i];buf[i*5+3]=vy[i];buf[i*5+4]=sp[i];} self.postMessage({type:'state',buf:buf,simTime:P?P.simTime:0},[buf.buffer]); } }

function tickStop(){ if(timer){clearInterval(timer);timer=null;} }
self.onmessage=(e)=>{ const m=e.data;
  if(m.type==='init'){ N=m.N;W=m.W;H=m.H;px=m.px;py=m.py;vx=m.vx;vy=m.vy;sp=m.sp;P=m.P;P.simTime=m.simTime;running=m.running; if(running)tickStart(); }

function ensureWorker(){
  if(cpuWorker||!workerEnabled) return;
  try{
    const blob=new Blob([workerSrc],{type:"application/javascript"});
    cpuWorker=new Worker(URL.createObjectURL(blob));
    cpuWorker.onmessage=(e)=>{
      const m=e.data;
      if(m.type==="state"){
        const n=Math.min(m.buf.length/5|0, MAXN);
        for(let i=0;i<n;i++){ const o=i*5; px[i]=m.buf[o]; py[i]=m.buf[o+1]; vx[i]=m.buf[o+2]; vy[i]=m.buf[o+3]; sp[i]=m.buf[o+4]; }
        if(m.simTime!=null) G.simTime=m.simTime;
        workerHasState=true;
      }
    };
    cpuWorker.onerror=()=>{ cpuWorker=null; workerReady=false; workerHasState=false; };
    workerReady=true;
  }catch(e){ cpuWorker=null; workerReady=false; workerHasState=false; }
}
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  fpsAcc+=dt; fpsCnt++;
  if(fpsAcc>=0.5){
    const fps=Math.round(fpsCnt/fpsAcc);
    document.getElementById("sFps").textContent=fps;
    fpsEMA = fpsEMA? fpsEMA*0.85+fps*0.15 : fps;
    fpsAcc=0; fpsCnt=0;
  }
  // C2：固定步长 —— 复用本帧 dt（已钳制 0.05s），定步推进物理；渲染仍每帧一次
  // 0.05s 钳制 ÷ (1/60)s = 3 步，与 MAX_STEPS 自洽，天然防追帧螺旋
  diagSteps=0;
  if(G.running){
    // 后端判定：forceBackend 可强制 A/B 对比（用于量出 GPU O(N²) 与 CPU 网格的真实差距）
    let want = gpuPhysicsReady && GL_OK && G.count>=3000;
    if(forceBackend==="cpu") want=false;
    else if(forceBackend==="gpu") want = gpuPhysicsReady && GL_OK;  // 忽略粒子数阈值
    // 后端切换时同步粒子状态，避免两套状态不一致导致跳变
    if(want!==gpuActive){

      else if(want && gpuPhysicsReady) uploadStateToGPU();  // CPU → GPU

      if(workerEnabled){

          ensureWorker();

          _lastWorkerRunning=G.running;
        } else if(cpuWorker){
          cpuWorker.postMessage({type:"running",running:false});
          _lastWorkerRunning=null;
        }
      }
    }

    // B：首次进入 GPU 模式且 ?gpuGrid=1 时，跑一次 bitonic 排序并读回校验（合法排列 + cellKey 升序）。
    // 确定性算法，一次通过即永久信任；单元过多(>4096)或过校验失败 → gpuGridUse=false，回退 CPU 建桶(=21.7)。

      }catch(e){ gpuGridUse=false; }
    }
    if(!gpuActive) gpuGridUse=false;

    if(workerEnabled && cpuWorker && !gpuActive){
      if(G.running!==_lastWorkerRunning){ cpuWorker.postMessage({type:"running",running:G.running}); _lastWorkerRunning=G.running; }
      cpuWorker.postMessage({type:"params",P:gatherWorkerParams(),W,H});

      const workerActive = workerEnabled && cpuWorker && !gpuActive && workerHasState;

      else { buildGrid(); cpuStep(); }

    }

  if(!appEl.classList.contains("stage-hidden")){
  if(GL_OK){ renderScene();
    glFrames++;

    }

  else if(CTX2D){ renderScene2D(); }
  }

  // 物理后端诊断：明确区分 2D兜底 / GPU init 失败 / CPU 步进，让"为什么卡/为什么CPU"可见
  const sPhysEl=document.getElementById("sPhys");
  if(gpuActive) sPhysEl.textContent="GPU";
  else if(GL_OK) sPhysEl.textContent = gpuPhysicsReady? "CPU" : "CPU·GPU失败";
  else sPhysEl.textContent="2D兜底";

  //   CPU 模式 —— 分级平滑降载（目标 55fps，下限 G.minN），回升时温和恢复。
  //   GPU 模式 —— 锁定用户显式粒子数，绝不自动降载（用户要求 12000 不降数；墙是 O(N·k) 算力，降数亦非真解）。
  if(adaptOn && G.running && fpsEMA>0){
    if(gpuActive){
      // 不降粒子数：保持 G.count 不变（B 排序优化在 GPU 内完成，不靠降数提 FPS）
    }else{
      const target=55, floor=G.minN;
      if(fpsEMA<target){
        const ratio=Math.min(1,fpsEMA/target);          // 20fps→0.36，50fps→0.91
        const factor=1-(1-ratio)*0.35;                  // 缺口越大降得越狠（最多约 22%/次）
        if(G.count>floor) setCount(Math.max(floor, Math.round(G.count*factor)));
      }else if(fpsEMA>target+6 && G.count<MAXN){
        setCount(Math.min(MAXN, G.count*1.01));         // 富余帧率时缓慢回升
      }
    }

  if(dynResOn && G.running && fpsEMA>0){
    if(fpsEMA<28 && renderScale>MIN_SCALE){ renderScale=Math.max(MIN_SCALE,+(renderScale-0.15).toFixed(2)); resizeGL(); }
    else if(fpsEMA>52 && renderScale<1){ renderScale=Math.min(1,+(renderScale+0.08).toFixed(2)); resizeGL(); }
  }
  requestAnimationFrame(frame);
}

/* ===== 6. 管线面板 UI ===== */
const graphEl=document.getElementById("graph");

function rebuildGraphUI(){
  graphEl.className = advancedMode ? "adv" : "";
  graphEl.innerHTML="";
  if(advancedMode) rebuildAdvanced();
  else rebuildSimple();
  updateHint();
}

function rebuildSimple(){
  const order=["particles",...BEHAVIOR_TYPES,"render"];
  const byType={}; for(const n of nodes)(byType[n.type]=byType[n.type]||[]).push(n);
  let first=true;
  for(const t of order){
    const list=byType[t]; if(!list)continue;
    for(const n of list){
      if(!first){ const c=document.createElement("div"); c.className="connector"; graphEl.appendChild(c); }
      first=false;
      const el=document.createElement("div");
      el.className="node"+(n.open?" open":" collapsed")+(n.enabled===false?" off":"");
      el.dataset.id=n.id;
      const head=document.createElement("div"); head.className="node-head";
      const isTop=(t==="particles"||t==="render");
      head.innerHTML=`<span class="ic" style="background:${TYPE_COLOR[n.type]||'#5cc8ff'}"></span>
        <span class="nm">${TYPE_LABEL[n.type]||n.type}</span>
        ${isTop?'':'<span class="sw'+(n.enabled!==false?' on':'')+'"></span>'}
        <span class="chev">▶</span>`;
      el.appendChild(head);
      const body=document.createElement("div"); body.className="node-body"; body.appendChild(buildNodeBody(n));
      el.appendChild(body);
      graphEl.appendChild(el);
      const sw=head.querySelector(".sw");
      if(sw) sw.addEventListener("click",e=>{ e.stopPropagation(); n.enabled=(n.enabled===false); syncEngine(); sw.classList.toggle("on",n.enabled!==false); el.classList.toggle("off",n.enabled===false); const body=el.querySelector(".node-body"); body.innerHTML=""; body.appendChild(buildNodeBody(n)); });
      head.addEventListener("click",()=>{ n.open=!n.open; el.classList.toggle("open",n.open); el.classList.toggle("collapsed",!n.open); });
    }
  }
  syncEngine();
}

            [...mseg.children].forEach(x=>x.classList.toggle("on",x===b)); syncEngine(); if(_booted)onCommit(); });

    case "damping": frag.appendChild(slider("摩擦","friction",0,0.4,0.01,2)); break;

    case "repel": frag.appendChild(slider("半径","radius",5,60,1,0)); frag.appendChild(slider("强度","strength",0,4,0.05,2)); break;
    case "align": frag.appendChild(slider("半径","radius",20,120,1,0)); frag.appendChild(slider("强度","strength",0,2,0.05,2)); break;
    case "cohere": frag.appendChild(slider("半径","radius",20,140,1,0)); frag.appendChild(slider("强度","strength",0,2,0.05,2)); break;

const SVGNS="http://www.w3.org/2000/svg";
let canvasGraphEl=null, edgesSvg=null, edgesHit=null, tempEdge=null, addMenuEl=null;
function nodeById(id){ return nodes.find(z=>z.id===id); }
function updateHint(){
  const h=document.getElementById("hint");
  if(advancedMode){
    h.innerHTML=`<b>节点图</b>：拖标题=移动 · 拖右端口→节点=连线<br>点连线=删除 · 悬停×=删节点<br><b>＋</b>=新增行为 · 画布拖动=扰动`;
  } else {

  }

function portPos(node,dir){
  if(!canvasGraphEl)return null;
  const el=canvasGraphEl.querySelector(`.node[data-id="${node.id}"]`); if(!el)return null;
  const p=el.querySelector(`.port.${dir}`); if(!p)return null;
  const cr=canvasGraphEl.getBoundingClientRect(); const pr=p.getBoundingClientRect();
  return {x:pr.left+pr.width/2-cr.left, y:pr.top+pr.height/2-cr.top};
}
function edgeD(a,b){ const mx=(a.x+b.x)/2; return `M ${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`; }
function drawEdges(){
  if(!edgesSvg)return;
  edgesSvg.querySelectorAll(".edge").forEach(e=>e.remove());
  if(edgesHit) edgesHit.querySelectorAll(".edge-hit").forEach(e=>e.remove());
  for(const e of edges){
    const a=portPos(nodeById(e.from),"out"), b=portPos(nodeById(e.to),"in");
    if(!a||!b)continue;
    const d=edgeD(a,b);
    const vis=document.createElementNS(SVGNS,"path"); vis.setAttribute("class","edge"); vis.setAttribute("d",d);
    edgesSvg.appendChild(vis);
    const hit=document.createElementNS(SVGNS,"path"); hit.setAttribute("class","edge-hit"); hit.setAttribute("d",d);
    hit.addEventListener("click",ev=>{ ev.stopPropagation(); removeEdge(e); });
    if(edgesHit) edgesHit.appendChild(hit);
  }
}
function removeEdge(e){ const i=edges.indexOf(e); if(i>=0){ edges.splice(i,1); syncEnabledToReachability(); if(_booted)onCommit(); } }
function syncEnabledToReachability(){
  const seen=reachableSet();
  for(const n of nodes){ if(n.type!=="particles"&&n.type!=="render" && !seen.has(n.id)) n.enabled=false; }
  rebuildGraphUI();
}
function rebuildAdvanced(){

  const hit=document.createElementNS(SVGNS,"svg"); hit.id="edgesHit"; hit.setAttribute("width",920); hit.setAttribute("height",760);

}
function dragNode(node,ev){
  const el=canvasGraphEl.querySelector(`.node[data-id="${node.id}"]`);
  if(!el)return;
  const sx=ev.clientX, sy=ev.clientY, ox=node.x||0, oy=node.y||0;
  function mv(e){ node.x=Math.max(0,ox+(e.clientX-sx)); node.y=Math.max(0,oy+(e.clientY-sy)); el.style.left=node.x+"px"; el.style.top=node.y+"px"; drawEdges(); }
  function up(){ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); }
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}
function startConnect(node,ev){
  const a=portPos(node,"out"); if(!a)return;
  const line=document.createElementNS(SVGNS,"path"); line.setAttribute("class","tmp");
  edgesSvg.appendChild(line); tempEdge=line; line.setAttribute("d",edgeD(a,a));
  function mv(e){ const gr=canvasGraphEl.getBoundingClientRect(); line.setAttribute("d",edgeD(a,{x:e.clientX-gr.left,y:e.clientY-gr.top})); }
  function up(e){
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    if(tempEdge){ tempEdge.remove(); tempEdge=null; }
    const tgt=document.elementFromPoint(e.clientX,e.clientY);
    const tnodeEl=tgt&&tgt.closest?tgt.closest(".node"):null;
    if(tnodeEl){ const tid=tnodeEl.dataset.id; if(tid!==node.id) addEdge(node.id,tid); }
    else drawEdges();
  }
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}

function syncEngine(){
  const find=t=>nodes.find(z=>z.type===t);
  const P=find("particles"); if(P){ G.count=Math.min(MAXN,P.params.count|0); G.species=P.params.species|0; }
  const M=find("matrix"); if(M){ G.matrix=M.params.m; G.preset=M.params.preset;
    if(G.species!==M.params.m.length){ M.params.m=resizeMatrix(M.params.m,G.species); M.params.n=G.species; rebuildGraphUI(); return; } }
  const D=find("damping"); if(D)G.friction=D.params.friction;
  const N=find("noise"); if(N){ G.noiseAmp=N.params.amp; G.noiseScale=N.params.scale; G.noiseSpeed=N.params.speed; }
  const MO=find("mouse"); if(MO){ G.mouseMode=MO.params.mode; G.mouseR=MO.params.radius; G.mouseStr=MO.params.strength; }
  const R=find("repel"); if(R){ G.repelR=R.params.radius; G.repelStr=R.params.strength; }
  const A=find("align"); if(A){ G.alignR=A.params.radius; G.alignStr=A.params.strength; }
  const C=find("cohere"); if(C){ G.cohereR=C.params.radius; G.cohereStr=C.params.strength; }
  const RN=find("render"); if(RN){ G.tail=RN.params.tail; G.size=RN.params.size; G.bloom=RN.params.bloom; G.glow=RN.params.glow; G.theme=RN.params.theme;
    G.chroma=RN.params.chroma; G.hue=RN.params.hue; G.vignette=RN.params.vignette; G.minN=RN.params.minN; }
  // 2D 兜底：色相走 canvas CSS filter（GPU 端由着色器统一处理）；暗角走 DOM 遮罩开关
  const vig=document.getElementById("vignette"); if(vig) vig.style.display=G.vignette?"block":"none";
  if(CTX2D) gl2d.style.filter = G.hue? "hue-rotate("+G.hue+"deg)" : "none";
  else if(canvas) canvas.style.filter="none";
  const ab=activeBehaviors(); const types=[...ab].map(id=>nodes.find(z=>z.id===id).type);
  document.getElementById("sBeh").textContent=types.length?types.map(t=>TYPE_LABEL[t]||t).join("·"):"无";
  document.getElementById("sMode").textContent=types.includes("matrix")?"matrix":(types[0]||"–");
}

// 单步：仅在暂停时有效，推进恰好一个固定步长（GPU/CPU 主线程直接步进；worker 模式转发给 worker）
function stepPhysicsOnce(){
  const t0=performance.now();
  if(gpuActive) gpuStep();
  else { buildGrid(); cpuStep(); }
  const el=performance.now()-t0;
  if(gpuActive) gpuStepMsEMA = gpuStepMsEMA? gpuStepMsEMA*0.85+el*0.15 : el;
  else cpuStepMsEMA = cpuStepMsEMA? cpuStepMsEMA*0.85+el*0.15 : el;
}
function doStep(){
  if(G.running) return;
  const workerActive = workerEnabled && cpuWorker && !gpuActive && workerHasState;
  if(workerActive) cpuWorker.postMessage({type:"step"});
  else stepPhysicsOnce();
  if(GL_OK) renderScene();      // 立即重绘，单步结果当帧可见
}

// 导出：序列化节点图+全局参数+精确粒子坐标（GPU 模式先回读坐标到 CPU），下载为 .json
function exportScene(){
  if(gpuActive && gpuPhysicsReady && GL_OK) readbackGPUState();
  const n=Math.min(G.count,MAXN);
  const data={
    app:"particle-life", version:2, w0:W, h0:H,
    scene: serializeState(),
    particles:{ count:n, species:G.species,
      px:Array.from(px.subarray(0,n)), py:Array.from(py.subarray(0,n)),
      vx:Array.from(vx.subarray(0,n)), vy:Array.from(vy.subarray(0,n)),
      sp:Array.from(sp.subarray(0,n)) }
  };
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a"); a.download="particle-life-scene.json"; a.href=URL.createObjectURL(blob); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  flashStatus("已导出场景（"+n+" 粒子）");
}
// 导入：解析 .json → 还原节点图/参数 → 覆盖精确粒子坐标（按当前画布尺寸等比缩放），推送到 GPU
function importScene(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||data.app!=="particle-life"||!data.scene) throw new Error("文件格式不符");
      if(!data.particles) throw new Error("缺少粒子数据");
      applyState(data.scene);
      const P=nodes.find(z=>z.type==="particles");
      const wantSp=Math.max(1,(data.particles.species|0)||(P?P.params.species|0:5));
      G.species=wantSp; if(P){ P.params.species=wantSp; P.params.count=data.particles.count; }
      const n=Math.max(1,Math.min(data.particles.count|0,MAXN)); G.count=n;
      const sx=(data.w0>0)? W/data.w0 : 1, sy=(data.h0>0)? H/data.h0 : 1;
      const p=data.particles;
      for(let i=0;i<n;i++){ px[i]=p.px[i]*sx; py[i]=p.py[i]*sy; vx[i]=p.vx[i]; vy[i]=p.vy[i]; sp[i]=p.sp[i]|0; }
      for(let i=n;i<MAXN;i++){ px[i]=py[i]=vx[i]=vy[i]=0; sp[i]=0; }
      if(gpuPhysicsReady) uploadStateToGPU();
      pushHistory(); scheduleSave();
      flashStatus("已导入场景（"+n+" 粒子 · 物种"+wantSp+"）");
    }catch(e){ flashStatus("导入失败："+e.message); }
  };
  r.readAsText(file);
}

function flashStatus(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:999;background:rgba(8,18,28,.92);border:1px solid var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;font-size:12px;letter-spacing:.4px;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 4px 18px rgba(0,0,0,.4)"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(flashStatus._t); flashStatus._t=setTimeout(()=>{ t.style.opacity="0"; },1500);
}

/* ===== D. GPU/性能自检诊断 ===== */
// 目的：把沙箱看不见的 WebGL 分支变成可观测，便于一键反馈真实机器上的后端与耗时
function collectDiag(){
  const d={};
  d["01_后端"] = gpuActive?"GPU 着色器物理":(GL_OK?(gpuPhysicsReady?"CPU 网格":"CPU（GPU 物理初始化失败）"):"2D 兜底");
  d["02_粒子数"] = Math.min(G.count,MAXN);
  d["03_FPS均值"] = +fpsEMA.toFixed(1);
  d["04_本帧物理步数"] = diagSteps+" / 上限 "+MAX_STEPS;
  d["05_固定步长"] = FIXED_DT.toFixed(4)+"s";
  d["06_WebGL2"] = !!GL_OK;
  d["07_GPU物理就绪"] = !!gpuPhysicsReady;
  d["08_GPU物理错误"] = gpuErr||"无";
  if(gl){
    const dbg=gl.getExtension("WEBGL_debug_renderer_info");
    d["09_显卡"] = dbg? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)):"n/a";
    d["10_厂商"] = dbg? String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)):"n/a";
    d["11_浮点渲染EXT"] = !!gl.getExtension("EXT_color_buffer_float");
    d["12_浮点混合EXT"] = !!gl.getExtension("EXT_float_blend");
    d["13_最大纹理"] = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }
  d["14_CPU步进ms"] = cpuStepMsEMA? +cpuStepMsEMA.toFixed(2):null;
  // 注意：GPU 为异步提交，此值仅是 CPU 侧提交耗时，不等于 GPU 实际执行耗时
  d["15_GPU提交ms*"] = gpuStepMsEMA? +gpuStepMsEMA.toFixed(2):null;
  d["16_坐标回读"] = (!gpuActive)? "关/不适用" : (gpuGridUse? "GPU内建(免建桶上传)" : (G.links? (gpuReadbackMode+(PHYS_16F?" ·16F":"")) : "免回读(连线关)"));
  d["17_自适应"] = adaptOn?"开":"关";
  d["18_强制后端"] = forceBackend;
  // GPU 物理已改为混合空间网格 O(N·k)：量化每帧候选邻居遍历规模（含 3×3 邻格候选上限）
  const nn=Math.min(G.count,MAXN);
  const gc=gpuGridCols||0, gr=gpuGridRows||0;
  const perCell = gc>0&&gr>0 ? Math.ceil(nn/(gc*gr)) : 0;
  d["19_GPU迭代规模"] = gpuActive
    ? ("网格 "+gc+"×"+gr+" 格，单格约 "+perCell+" 粒子；每帧 gather ≈ "+(nn*perCell).toLocaleString("en-US")+" 次（网格 O(N·k)，已替 O(N²)="+(nn*nn).toLocaleString("en-US")+"）")
    : "不适用(非GPU后端)";
  // 20：网格建桶后端（B：GPU 内建计数排序免 CPU 建桶；默认关，?gpuGrid=1 开启，失败回退 CPU）
  d["20_GPU网格"] = gpuActive
    ? (gpuGridUse ? "GPU内建排序(bitonic,免CPU建桶)"
        : (!gpuGridEnabled ? "CPU建桶(异步PBO回读)"
            : (gpuGridReady ? "B校验失败→回退CPU建桶" : "B初始化失败→回退CPU建桶("+gpuGridErr.slice(0,40)+")")))
    : "不适用(非GPU后端)";
  // 21：动态分辨率（H）——仅渲染缩放，不影响物理迭代规模
  d["21_动态分辨率"] = dynResOn ? ("×"+renderScale.toFixed(2)+(renderScale<1?" (动态降载)":"")) : "关(锁定×1.00)";
  // 22：物理执行线程（G）——GPU 模式不搬运；CPU 模式默认主线程，?worker=1 且 worker 存活时改 Worker 异步搬运
  d["22_物理线程"] = gpuActive ? "GPU(不搬运)"
    : (workerEnabled && cpuWorker ? "Worker(异步搬运)" : (workerEnabled? "Worker启动失败→主线程" : "主线程"));
  return d;
}
const diagEl=document.getElementById("diag"), diagTextEl=document.getElementById("diagText");
function diagString(){
  const d=collectDiag();
  return Object.keys(d).map(k=>k.padEnd(16," ")+": "+d[k]).join("\n");
}
document.getElementById("btnDiag").addEventListener("click",()=>{
  diagTextEl.textContent=diagString(); diagEl.classList.add("on");
});
document.getElementById("btnDiagClose").addEventListener("click",()=>diagEl.classList.remove("on"));
diagEl.addEventListener("click",e=>{ if(e.target===diagEl) diagEl.classList.remove("on"); });
document.getElementById("selBackend").addEventListener("change",e=>{
  forceBackend=e.target.value;
  if(diagEl.classList.contains("on")) diagTextEl.textContent=diagString();  // 切换后立即刷新读数
});
document.getElementById("btnDiagCopy").addEventListener("click",async()=>{
  const t=diagString();
  try{ await navigator.clipboard.writeText(t); }catch(e){}
  const b=document.getElementById("btnDiagCopy"); b.textContent="已复制"; setTimeout(()=>b.textContent="复制",1200);
});

const PRESETS={
  "聚团矩阵":{matrix:"cluster"}, "链状":{matrix:"chain"}, "对称":{matrix:"sym"},
  "生态循环":{matrix:"ecosystem"}, "晶格":{matrix:"crystal"}, "全吸引":{matrix:"allatt"},
  "全排斥":{matrix:"allrep"}, "随机":{matrix:"rand"},
  // —— 新增矩阵预设 ——
  "环流矩阵":{matrix:"cyclic"}, "变形虫矩阵":{matrix:"amoeba"}, "花朵矩阵":{matrix:"flowers"},
  "色带矩阵":{matrix:"band"}, "阵营矩阵":{matrix:"war"}, "捕食链":{matrix:"predator"},
  "漩涡矩阵":{matrix:"swirl"}, "波纹矩阵":{matrix:"wave"}, "斑斓矩阵":{matrix:"purple"},
  // —— 行为组合 ——
  "类鸟群boids":{behaviors:["align","cohere","damping"]},
  "流体噪声":{behaviors:["noise","damping"]}, "混沌":{behaviors:["repel","matrix","damping"]},
  "捕食+噪声":{matrix:"predator",behaviors:["noise","damping"]}, "漩涡+对齐":{matrix:"swirl",behaviors:["align","cohere","damping"]},
};
const selP=document.getElementById("selPreset");
selP.innerHTML=Object.keys(PRESETS).map(k=>`<option value="${k}">${k}</option>`).join("");
selP.addEventListener("change",()=>applyPreset(selP.value));
function applyPreset(name){
  const cfg=PRESETS[name]; if(!cfg)return;
  const M=nodes.find(z=>z.type==="matrix");
  if(cfg.matrix && M){ M.params.m=makeMatrix(cfg.matrix,G.species); M.params.preset=cfg.matrix; }
  if(cfg.behaviors){
    const keep=new Set(cfg.behaviors);
    const src=nodes.find(z=>z.type==="particles"), snk=nodes.find(z=>z.type==="render");
    for(const n of nodes){
      if(n.type==="particles"||n.type==="render") continue;
      // 仅启用预设列出的行为；绝不关闭用户已开启的其他行为（如鼠标力），
      // 否则切换预设会静默干掉鼠标力等独立开关（此前 n.enabled=keep.has(n.type) 的锅）
      if(keep.has(n.type)) n.enabled=true;
      // C1：预设要求启用的行为，若在高级模式被断开则补回连线，保证可达
      if(keep.has(n.type) && src && snk){
        if(!edges.some(e=>e.from===src.id&&e.to===n.id)) edges.push({from:src.id,to:n.id});
        if(!edges.some(e=>e.from===n.id&&e.to===snk.id)) edges.push({from:n.id,to:snk.id});
      }
    }
  }
  rebuildGraphUI(); if(_booted)onCommit();
}
const selT=document.getElementById("selTheme");
selT.innerHTML=Object.keys(THEMES).map(k=>`<option value="${k}">${k}</option>`).join("");
selT.value=G.theme;
selT.addEventListener("change",()=>{ G.theme=selT.value; const RN=nodes.find(z=>z.type==="render"); if(RN)RN.params.theme=G.theme; if(_booted)onCommit(); });
const rngC=document.getElementById("rngCount"), lblC=document.getElementById("lblCount");
// A：N 滑块直接驱动 G.count（经 setCount 保持图节点/滑块/标签一致）
function setCount(v){
  // 2D 兜底模式下软件渲染极慢，封顶 N 避免无意义卡死（仅 WebGL2 不可用才走此路）
  const cap=GL_OK?MAXN:4000;
  v=Math.max(1200,Math.min(cap,Math.round(v/100)*100));
  G.count=v;
  if(gpuPhysicsReady) uploadStateToGPU();
  const P=nodes.find(z=>z.type==="particles"); if(P)P.params.count=v;
  rngC.value=v; lblC.textContent=v;
}
rngC.addEventListener("input",()=>setCount(parseInt(rngC.value)));
rngC.value=G.count; lblC.textContent=G.count;

chkAdapt.addEventListener("change",()=>{ adaptOn=chkAdapt.checked; });

/* ===== 9b. 持久化 + 撤销/重做 + 键盘快捷键 ===== */
const LS_KEY="particle-life-state";
let history=[], histIndex=-1, _suspendHist=false, _saveT=0, _booted=false;
// 序列化当前场景（节点/连线/渲染参数/全局开关）；粒子坐标不持久化（重置即随机）
function serializeState(){
  return {
    v:1,
    nodes:nodes.map(n=>({id:n.id,type:n.type,x:n.x,y:n.y,enabled:n.enabled,open:n.open,params:JSON.parse(JSON.stringify(n.params))})),
    edges:edges.map(e=>({from:e.from,to:e.to})),
    advancedMode,
    G:{links:G.links,linkR:G.linkR,linkAlpha:G.linkAlpha,autoMorph:G.autoMorph,timeScale:G.timeScale,adaptOn,forceBackend,minN:G.minN}
  };
}
function applyState(obj){
  if(!obj||obj.v!==1) return false;
  _suspendHist=true;
  nodes=obj.nodes.map(n=>({id:n.id,type:n.type,x:n.x,y:n.y,enabled:n.enabled,open:n.open,params:n.params}));
  edges=obj.edges.map(e=>({from:e.from,to:e.to}));
  nid=nodes.length? Math.max(...nodes.map(n=>(+n.id.slice(1)||0))) : 0;
  advancedMode=!!obj.advancedMode;
  btnAdv.classList.toggle("primary",advancedMode);
  btnAdv.textContent=advancedMode?"⬡ 简化":"⬡ 高级";
  btnAdd.style.display=advancedMode?"block":"none";
  document.getElementById("graphPanel").classList.toggle("adv-panel",advancedMode);
  const g=obj.G||{};
  G.links=!!g.links; G.linkR=g.linkR||28; G.linkAlpha=g.linkAlpha==null?0.22:g.linkAlpha;
  G.autoMorph=!!g.autoMorph; G.timeScale=g.timeScale==null?1:g.timeScale;
  adaptOn=g.adaptOn!==false; G.minN=g.minN||1200;
  forceBackend=g.forceBackend||"auto";
  const fp=document.getElementById("selBackend"); if(fp) fp.value=forceBackend;
  const ca=document.getElementById("chkAdapt"); if(ca) ca.checked=adaptOn;
  const cl=document.getElementById("chkLinks"); if(cl){ cl.checked=G.links; if(typeof linkCtl!=="undefined") linkCtl.style.display=G.links?"flex":"none"; }
  // 还原粒子数（持久化于粒子节点 params.count；2D 兜底经 setCount 自动封顶）
  { const _P=nodes.find(z=>z.type==="particles");
    if(_P && _P.params && _P.params.count){ setCount(_P.params.count); } }
  rebuildGraphUI();
  initParticles();
  if(gpuPhysicsReady) uploadStateToGPU();
  _suspendHist=false;
  return true;
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(serializeState())); }catch(e){} }
function scheduleSave(){ clearTimeout(_saveT); _saveT=setTimeout(saveState,700); }
function loadPersisted(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return false; return applyState(JSON.parse(raw)); }catch(e){ return false; } }
// 撤销/重做：快照式历史栈（最多 80 步），提交点入栈，_suspendHist 防止撤销/重载时递归入栈
function pushHistory(){
  if(_suspendHist) return;
  if(histIndex<history.length-1) history=history.slice(0,histIndex+1);
  history.push(serializeState());
  if(history.length>80) history.shift();
  histIndex=history.length-1;
}
function undo(){ if(histIndex<=0) return; histIndex--; _suspendHist=true; applyState(history[histIndex]); _suspendHist=false; }
function redo(){ if(histIndex>=history.length-1) return; histIndex++; _suspendHist=true; applyState(history[histIndex]); _suspendHist=false; }
function clearHistory(){ history=[]; histIndex=-1; }
function onCommit(){ if(!_booted) return; pushHistory(); scheduleSave(); }
// 键盘快捷键：空格 播放/暂停 · R 重置 · P 截图 · L 连线 · A 高级 · ? 诊断 · Ctrl+Z/Y 撤销重做
function isTyping(e){ const t=e.target; return t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"); }
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||e.key==="Y")){ e.preventDefault(); redo(); return; }
  if(isTyping(e)) return;
  switch(e.key){
    case " ": e.preventDefault(); setRunning(!G.running); break;
    case ".": e.preventDefault(); doStep(); break;                         // 单步（暂停时）
    case "e": case "E": e.preventDefault(); exportScene(); break;          // 导出场景
    case "i": case "I": e.preventDefault(); document.getElementById("btnImport").click(); break; // 导入场景
    case "r": case "R": document.getElementById("btnReset").click(); break;
    case "p": case "P": document.getElementById("btnShot").click(); break;
    case "l": case "L": chkLinks.click(); break;
    case "a": case "A": btnAdv.click(); break;
    case "?": document.getElementById("btnDiag").click(); break;
  }
});
// 恢复默认：清除本地存档并重建初始场景
document.getElementById("btnDefault").addEventListener("click",()=>{
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  initGraph(); initParticles(); if(gpuPhysicsReady) uploadStateToGPU();
  clearHistory(); pushHistory(); scheduleSave();
});

/* ===== 9. 初始化 ===== */
function initGraph(){
  nodes=[]; edges=[]; nid=0;
  const src=addNode("particles",0,0,false);
  const m=addNode("matrix",0,0,false); m.params.m=makeMatrix("cluster",G.species); m.params.n=G.species;
  addNode("damping",0,0,false);
  const ns=addNode("noise",0,0,false); ns.params.amp=0.5;
  addNode("mouse",0,0,false);
  addNode("repel",0,0,false);
  addNode("align",0,0,false);
  addNode("cohere",0,0,false);
  const snk=addNode("render",0,0,false);
  // 所有行为节点都接入管线（src→behavior→snk）；激活与否由每节点的 enabled 开关控制
  for(const n of nodes){ if(n.type!=="particles"&&n.type!=="render"){ edges.push({from:src.id,to:n.id}); edges.push({from:n.id,to:snk.id}); } }
  // 默认启用 matrix + damping + mouse（聚团核心 + 画布拖动扰动；其余可选行为默认关闭）
  for(const n of nodes){
    n.enabled=(n.type==="matrix"||n.type==="damping"||n.type==="mouse");
    if(n.type==="particles"||n.type==="render") n.enabled=true;  // 源/渲染始终启用，不被列为“未启用”
    n.open=(n.type==="matrix");
  }
  // 高级模式节点图布局（固定栅格，进入高级模式立即可用；拖动后位置持久化）
  const LAY={particles:[12,40],matrix:[200,18],damping:[200,150],noise:[200,280],mouse:[200,410],
            repel:[380,18],align:[380,150],cohere:[380,280],render:[560,120]};
  for(const n of nodes){ const p=LAY[n.type]; if(p){ n.x=p[0]; n.y=p[1]; } }
  rebuildGraphUI();
}
function boot(){
  allocParticles();
  if(!loadPersisted()) initGraph();        // 有本地存档则恢复场景，否则建默认图
  initParticles();
  setupGL();
  if(!GL_OK){ if(setup2D()){ resizeGL(); } else { return; } }
  else { resizeGL(); setupGPU(); if(gpuPhysicsReady) uploadStateToGPU(); }   // C：WebGL2 可用则尝试初始化 GPU 物理，失败自动回退 CPU
  setCount(parseInt(rngC.value));          // setCount 统一处理 2D 封顶 / GPU 上限
  document.getElementById("sPhys").textContent=GL_OK?"CPU":"2D兜底";
  let _resizeT=null;
  function resizeGLDebounced(){ if(_resizeT)clearTimeout(_resizeT); _resizeT=setTimeout(()=>{ _resizeT=null; resizeGL(); },150); }   // F：窗口拖拽时防抖，避免反复重建 FBO/纹理
  window.addEventListener("resize",resizeGLDebounced);
  _booted=true;
  pushHistory();                            // 基线快照，供撤销回到初始
  setRunning(true); requestAnimationFrame(frame);
}
boot();

})();
