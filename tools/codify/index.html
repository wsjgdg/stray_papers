<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人私有化会议纪要工作台：粘贴转写文本，自动生成摘要、行动项与决议，数据只存在你的浏览器里" />
    <title>会议纪要工作台</title>
    <script>
      // 首帧前应用主题，避免刷新时闪白/闪黑（与 useTheme 共用同一个 key）
      (function () {
        try {
          var t = localStorage.getItem("meeting-notes-theme-v1");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#9aa7bd;font-family:system-ui,-apple-system,sans-serif;background:#0f1626;">加载中…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
