# E5 依赖自动更新：每月一批次，minor/patch 归组避免 PR 噪音（major 保持逐个审阅）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
