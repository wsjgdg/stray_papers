<script>
/*
 * audio.js — zero-asset procedural audio for the visual novel.
 * Vanilla JS, single IIFE, no audio files, no fetch.
 * Defines exactly one global: window.VN_AUDIO
 *
 *   scene(bgId)        crossfade the ambient bed matching a background id
 *                      (null / unknown id -> fade to silence)
 *   type()             typewriter tick, self-throttled (~45 ms min gap)
 *   ui(kind)           one-shot UI sound: "start" | "select" | "save" | "load"
 *   swell()            one-shot cinematic swell (dolly reveal cue): two
 *                      detuned oscillators glide 180 -> 55 Hz over a noise
 *                      presence band, ~0.12 peak, gone by ~2.4 s; self-
 *                      throttled (~3 s min gap)
 *   enabled()          -> bool
 *   setEnabled(bool)   -> bool (new state); false ramps master to 0 in 0.3 s,
 *                         kills scheduled nodes, then suspends the context
 *   setVolume(v)       -> clamped number (0..1); master gain target becomes
 *                         0.8*v via setTargetAtTime (smooth slider response).
 *                         Before the context exists it only records the value
 *                         — the first activation applies it. Persisted under
 *                         "vn-settings" as JSON {volume}
 *   volume()           -> current volume number (default 1)
 *
 * The AudioContext is created lazily inside the first scene()/ui()/type()
 * /swell() call that happens after a real user gesture (pointerdown / touchend /
 * keydown / click). Earlier calls only record intent. Enabled state is
 * persisted in localStorage under "vn-audio" (default: ON); the volume lives
 * in the shared "vn-settings" JSON (key "volume") written by the settings
 * panel in engine.js — writes here merge so "autoDelay" is never clobbered.
 *
 * One-shot bed events (droplets, crickets, thunder, heartbeat, chimes...)
 * run on a Web Audio-clock lookahead scheduler: one 25 ms timer per module
 * walks each live bed's event queue and start(time)-schedules due events
 * 0.1 s ahead of ctx.currentTime, never via per-event setTimeout chains.
 */

(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   *  Tunables
   * ------------------------------------------------------------------ */

  var MASTER_LEVEL = 0.8;
  var TYPE_GAP_MS = 45; // typewriter min gap
  var SWELL_GAP_MS = 3000; // swell cue min gap (self-throttle)
  var FADE_OUT_S = 1.2; // old bed fade
  var FADE_IN_S = 1.5; // new bed fade
  var KILL_RAMP_S = 0.3; // setEnabled(false) master ramp
  var SUSPEND_MS = 380; // suspend context after the kill ramp
  var MAX_LIVE_BEDS = 2; // current bed + at most one fading
  var SCHED_TICK_MS = 25; // lookahead scheduler tick
  var SCHED_AHEAD_S = 0.1; // schedule events this far ahead of the audio clock
  var SCHED_LEAD_S = 0.05; // first-event anchor lead on bed activation
  var SCHED_MAX_CATCHUP = 32; // max events per bed per tick (time-jump guard)
  var STORE_KEY = "vn-audio";
  var SETTINGS_KEY = "vn-settings"; // shared with engine.js settings panel
  var VOL_TAU_S = 0.05; // setTargetAtTime smoothing for slider moves

  /* ------------------------------------------------------------------ *
   *  Environment / state
   * ------------------------------------------------------------------ */

  var target =
    typeof window !== "undefined" && window
      ? window
      : typeof globalThis !== "undefined"
        ? globalThis
        : null;
  if (!target) return;

  var supported = getAudioCtor() != null; // no Web Audio -> enabled() stays false
  var broken = false; // context creation failed permanently
  var on = readPref(); // user preference (persisted, default ON)
  var vol = readVolume(); // user volume 0..1 (persisted, default 1)
  var gestureSeen = false;
  var ctx = null;
  var master = null;
  var sfxBus = null;
  var desiredBg = null; // recorded scene intent before the context exists
  var allBeds = []; // bed instances (including ones still fading out)
  var liveSources = []; // one-shot sources, hard-killed on disable
  var lastTypeAt = 0;
  var lastSwellAt = 0;
  var suspTimer = 0;
  var schedTimer = 0; // lookahead scheduler tick handle (0 = not running)
  var warned = false;
  var bornSeq = 0;

  var noiseWhite = null;
  var noisePink = null;
  var noiseBrown = null;

  /* ------------------------------------------------------------------ *
   *  Small utilities
   * ------------------------------------------------------------------ */

  function rnd(a, b) {
    return a + Math.random() * (b - a);
  }

  function warnOnce(msg) {
    if (warned) return;
    warned = true;
    try {
      console.warn(msg);
    } catch (e) {}
  }

  function getAudioCtor() {
    try {
      if (typeof window !== "undefined" && window) {
        if (window.AudioContext) return window.AudioContext;
        if (window.webkitAudioContext) return window.webkitAudioContext;
      }
      if (typeof AudioContext !== "undefined" && AudioContext) return AudioContext;
    } catch (e) {}
    return null;
  }

  function storage() {
    try {
      if (typeof window !== "undefined" && window && window.localStorage) {
        return window.localStorage;
      }
    } catch (e) {}
    return null;
  }

  function readPref() {
    var s = storage();
    if (!s) return true;
    try {
      return s.getItem(STORE_KEY) !== "0";
    } catch (e) {
      return true;
    }
  }

  function writePref(v) {
    var s = storage();
    if (!s) return;
    try {
      s.setItem(STORE_KEY, v ? "1" : "0");
    } catch (e) {}
  }

  // Volume lives in the shared "vn-settings" JSON next to the engine's
  // autoDelay. Reads are defensive: anything but a finite number -> default 1.
  function readVolume() {
    var s = storage();
    if (!s) return 1;
    try {
      var data = JSON.parse(s.getItem(SETTINGS_KEY));
      if (data && typeof data === "object") {
        var v = data.volume;
        if (typeof v === "number" && isFinite(v)) {
          if (v < 0) v = 0;
          if (v > 1) v = 1;
          return v;
        }
      }
    } catch (e) {}
    return 1;
  }

  // Merge-write: keep any sibling keys (engine's autoDelay) intact.
  function writeVolume() {
    var s = storage();
    if (!s) return;
    var data = {};
    try {
      var raw = s.getItem(SETTINGS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") data = parsed;
      }
    } catch (e) {
      data = {}; // corrupt payload: start a fresh object
    }
    if (typeof data !== "object" || data === null) data = {};
    data.volume = vol;
    try {
      s.setItem(SETTINGS_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function now() {
    return ctx ? ctx.currentTime || 0 : 0;
  }

  function link(a, b) {
    try {
      a.connect(b);
    } catch (e) {}
  }

  function mkGain(v) {
    var g = ctx.createGain();
    try {
      g.gain.value = v;
    } catch (e) {}
    return g;
  }

  function mkOsc(type, freq) {
    var o = ctx.createOscillator();
    try {
      o.type = type;
      o.frequency.value = freq;
    } catch (e) {}
    return o;
  }

  function mkFilter(type, freq, q) {
    var f = ctx.createBiquadFilter();
    try {
      f.type = type;
      f.frequency.value = freq;
      if (q != null && f.Q) f.Q.value = q;
    } catch (e) {}
    return f;
  }

  function startAt(src, when, offset, dur) {
    try {
      if (offset != null) src.start(when, offset, dur);
      else src.start(when);
    } catch (e) {}
  }

  function stopAt(src, when) {
    try {
      src.stop(when);
    } catch (e) {}
  }

  // Cancel-then-ramp with a direct-assignment fallback (stub safety).
  function rampParam(param, value, t0, dur) {
    try {
      param.cancelScheduledValues(t0);
      param.setValueAtTime(param.value, t0);
      param.linearRampToValueAtTime(value, t0 + dur);
    } catch (e) {
      try {
        param.value = value;
      } catch (e2) {}
    }
  }

  function trackOne(src) {
    liveSources.push(src);
    try {
      src.onended = function () {
        var i = liveSources.indexOf(src);
        if (i >= 0) liveSources.splice(i, 1);
      };
    } catch (e) {}
  }

  function track(bed, src) {
    bed.sources.push(src);
    trackOne(src);
  }

  // Queue a one-shot generator on a bed's audio-clock event list:
  // makeEvent(time) schedules its nodes at exactly `time`; nextGap() returns
  // the seconds until the following event, or a non-positive value to retire
  // the entry (e.g. an evolving pattern that has finished).
  function addBedEvent(bed, firstS, makeEvent, nextGap) {
    if (bed.stopped || bed.done) return;
    bed.events.push({
      nextTime: now() + SCHED_LEAD_S + (firstS > 0 ? firstS : 0),
      makeEvent: makeEvent,
      nextGap: nextGap
    });
    schedKick();
  }

  // Repeating one-shot events on the scheduler: fn(time) fires at an exact
  // ctx.currentTime-derived time, gaps random between minMs/maxMs.
  function loopEvents(bed, minMs, maxMs, fn, firstMs) {
    addBedEvent(
      bed,
      firstMs == null ? 0 : firstMs / 1000,
      fn,
      function () {
        return rnd(minMs, maxMs) / 1000;
      }
    );
  }

  // True while at least one live bed still has queued one-shot events.
  function schedHasWork() {
    for (var i = 0; i < allBeds.length; i++) {
      var b = allBeds[i];
      if (!b.stopped && !b.done && b.events.length) return true;
    }
    return false;
  }

  // The lookahead scheduler: one timer for the whole module. Each tick it
  // walks every live bed's queue and schedules each event due within
  // SCHED_AHEAD_S of ctx.currentTime at its exact audio-clock time, so
  // one-shots never jitter with main-thread delays.
  function schedPump() {
    schedTimer = 0;
    try {
      var suspended = false;
      try {
        suspended = !!ctx && ctx.state === "suspended";
      } catch (e) {}
      if (ctx && !suspended) {
        var t = now();
        for (var i = 0; i < allBeds.length; i++) {
          var bed = allBeds[i];
          if (bed.stopped || bed.done) {
            bed.events.length = 0; // crossfaded out: queued events never started
            continue;
          }
          if (!bed.events.length) continue;
          var budget = SCHED_MAX_CATCHUP;
          for (var j = 0; j < bed.events.length && budget > 0; j++) {
            var e = bed.events[j];
            while (e.nextTime < t + SCHED_AHEAD_S) {
              try {
                e.makeEvent(e.nextTime);
              } catch (err) {}
              budget--;
              var gap = 0;
              try {
                gap = e.nextGap();
              } catch (err2) {
                gap = 0;
              }
              if (!(gap > 0)) {
                e.retired = true;
                break;
              }
              e.nextTime += gap;
              if (budget <= 0) {
                // Catch-up overflow after a suspend/resume time jump: drop
                // the backlog and re-anchor instead of bursting every tick.
                if (e.nextTime < t) e.nextTime = t + SCHED_LEAD_S;
                break;
              }
            }
          }
          for (var k = bed.events.length - 1; k >= 0; k--) {
            if (bed.events[k].retired) bed.events.splice(k, 1);
          }
        }
      }
    } catch (e3) {}
    if (schedHasWork()) {
      try {
        schedTimer = setTimeout(schedPump, SCHED_TICK_MS);
      } catch (e4) {}
    }
  }

  // Start the scheduler timer if it is not already running.
  function schedKick() {
    if (schedTimer) return;
    try {
      schedTimer = setTimeout(schedPump, SCHED_TICK_MS);
    } catch (e) {}
  }

  // Slow LFO: sine oscillator -> depth gain -> target AudioParam.
  function addLfo(bed, freq, depth, param) {
    var o = mkOsc("sine", freq);
    var g = mkGain(depth);
    link(o, g);
    link(g, param);
    startAt(o, now());
    track(bed, o);
    return o;
  }

  function killOneShots() {
    var list = liveSources.slice();
    liveSources.length = 0;
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      try {
        if (s.stop) s.stop(now());
      } catch (e) {}
      try {
        s.onended = null;
      } catch (e) {}
      try {
        s.disconnect();
      } catch (e) {}
    }
  }

  /* ------------------------------------------------------------------ *
   *  Noise buffers (built once): white / pink / brown, 2 s each
   * ------------------------------------------------------------------ */

  function clamp1(x) {
    return x > 1 ? 1 : x < -1 ? -1 : x;
  }

  function makeNoiseBuffers() {
    if (noiseWhite || !ctx.createBuffer) return;
    var sr = ctx.sampleRate || 44100;
    var len = Math.max(1, Math.floor(sr * 2));
    var wb = ctx.createBuffer(1, len, sr);
    var pb = ctx.createBuffer(1, len, sr);
    var bb = ctx.createBuffer(1, len, sr);
    var w = wb.getChannelData(0);
    var p = pb.getChannelData(0);
    var b = bb.getChannelData(0);
    var b0 = 0,
      b1 = 0,
      b2 = 0,
      b3 = 0,
      b4 = 0,
      b5 = 0,
      b6 = 0,
      br = 0,
      i,
      wht;
    for (i = 0; i < len; i++) {
      wht = Math.random() * 2 - 1;
      w[i] = wht;
      // Pink noise via the Paul Kellet approximate filter.
      b0 = 0.99886 * b0 + wht * 0.0555179;
      b1 = 0.99332 * b1 + wht * 0.0750759;
      b2 = 0.969 * b2 + wht * 0.153852;
      b3 = 0.8665 * b3 + wht * 0.3104856;
      b4 = 0.55 * b4 + wht * 0.5329522;
      b5 = -0.7616 * b5 - wht * 0.016898;
      p[i] = clamp1((b0 + b1 + b2 + b3 + b4 + b5 + b6 + wht * 0.5362) * 0.11);
      b6 = wht * 0.115926;
      // Brown noise via a leaky integrator.
      br = (br + 0.02 * wht) / 1.02;
      b[i] = clamp1(br * 3.5);
    }
    noiseWhite = wb;
    noisePink = pb;
    noiseBrown = bb;
  }

  function noiseSrc(kind, loop) {
    if (!ctx || !ctx.createBufferSource) return null;
    var buf = kind === "pink" ? noisePink : kind === "brown" ? noiseBrown : noiseWhite;
    if (!buf) return null;
    try {
      var s = ctx.createBufferSource();
      s.buffer = buf;
      s.loop = loop !== false;
      return s;
    } catch (e) {
      return null;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Bed lifecycle: build / fade / stop / disconnect
   * ------------------------------------------------------------------ */

  function buildBed(id) {
    var def = BED_DEFS[id];
    if (!def || !ctx || !ctx.createGain) return null;
    var bed = {
      id: id,
      level: def.level,
      gain: null,
      sources: [],
      events: [], // one-shot event queue entries for the scheduler
      stopped: false,
      done: false,
      teardownTimer: 0,
      born: bornSeq++
    };
    try {
      bed.gain = ctx.createGain();
      bed.gain.gain.value = 0;
      bed.gain.connect(master);
    } catch (e) {
      return null;
    }
    try {
      def.build(bed);
    } catch (e) {
      stopBed(bed, 0.05);
      return null;
    }
    return bed;
  }

  function stopBed(bed, fadeSec) {
    if (!bed || bed.done) return;
    bed.stopped = true;
    bed.events.length = 0; // queued one-shots were never started: drop them
    var i;
    try {
      rampParam(bed.gain.gain, 0, now(), fadeSec);
    } catch (e) {}
    var t = now() + fadeSec + 0.05;
    for (i = 0; i < bed.sources.length; i++) stopAt(bed.sources[i], t);
    if (bed.teardownTimer) {
      try {
        clearTimeout(bed.teardownTimer);
      } catch (e) {}
    }
    try {
      bed.teardownTimer = setTimeout(function () {
        finishTeardown(bed);
      }, Math.max(80, (fadeSec + 0.4) * 1000));
    } catch (e) {
      finishTeardown(bed);
    }
  }

  function hardStopBed(bed) {
    if (!bed || bed.done) return;
    if (!bed.stopped) {
      stopBed(bed, 0.08);
      return;
    }
    if (bed.teardownTimer) {
      try {
        clearTimeout(bed.teardownTimer);
      } catch (e) {}
      bed.teardownTimer = 0;
    }
    finishTeardown(bed);
  }

  function finishTeardown(bed) {
    if (!bed || bed.done) return;
    bed.done = true;
    bed.stopped = true;
    bed.events.length = 0;
    var i;
    if (bed.teardownTimer) {
      try {
        clearTimeout(bed.teardownTimer);
      } catch (e) {}
      bed.teardownTimer = 0;
    }
    for (i = 0; i < bed.sources.length; i++) {
      var s = bed.sources[i];
      stopAt(s, now());
      try {
        s.disconnect();
      } catch (e) {}
    }
    bed.sources.length = 0;
    try {
      bed.gain.disconnect();
    } catch (e) {}
    var k = allBeds.indexOf(bed);
    if (k >= 0) allBeds.splice(k, 1);
  }

  // Never keep more than MAX_LIVE_BEDS connected bed graphs.
  function capBeds(keep) {
    var guard = 0;
    while (guard++ < 8) {
      var live = [];
      var i;
      for (i = 0; i < allBeds.length; i++) {
        if (!allBeds[i].done) live.push(allBeds[i]);
      }
      if (live.length <= MAX_LIVE_BEDS) return;
      var victim = null;
      for (i = 0; i < live.length; i++) {
        if (live[i] !== keep && (victim === null || live[i].born < victim.born)) {
          victim = live[i];
        }
      }
      if (victim === null) return;
      hardStopBed(victim);
    }
  }

  function applyScene() {
    if (!ctx || !master) return;
    var want = desiredBg && BED_DEFS[desiredBg] ? desiredBg : null;
    var keep = null;
    var i, b;
    for (i = 0; i < allBeds.length; i++) {
      b = allBeds[i];
      if (!b.stopped && !b.done && want && b.id === want) keep = b;
    }
    for (i = allBeds.length - 1; i >= 0; i--) {
      b = allBeds[i];
      if (b !== keep && !b.stopped) stopBed(b, FADE_OUT_S);
    }
    capBeds(keep);
    if (want && !keep) {
      var bed = buildBed(want);
      if (bed) {
        allBeds.push(bed);
        rampParam(bed.gain.gain, bed.level, now(), FADE_IN_S);
        capBeds(bed);
      }
    }
  }

  /* ------------------------------------------------------------------ *
   *  Ambient bed builders (one per background id)
   * ------------------------------------------------------------------ */

  function bedTone(bed, freq, at, dur, peak, glideTo) {
    var o = mkOsc("sine", freq);
    var g = mkGain(0.0001);
    link(o, g);
    link(g, bed.gain);
    try {
      if (glideTo) {
        o.frequency.setValueAtTime(freq, at);
        o.frequency.exponentialRampToValueAtTime(glideTo, at + dur);
      }
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(peak, at + Math.min(0.012, dur * 0.3));
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    } catch (e) {
      try {
        g.gain.value = peak;
      } catch (e2) {}
    }
    startAt(o, at);
    stopAt(o, at + dur + 0.03);
    track(bed, o);
  }

  // streets_rain: pink noise wall + sparse droplet ticks + very low rumble
  function buildStreetsRain(bed) {
    var wall = noiseSrc("pink");
    if (wall) {
      var lp = mkFilter("lowpass", 1200, 0.4);
      var g = mkGain(0.55);
      link(wall, lp);
      link(lp, g);
      link(g, bed.gain);
      startAt(wall, now());
      track(bed, wall);
      addLfo(bed, 0.11, 250, lp.frequency);
    }
    var rum = noiseSrc("brown");
    if (rum) {
      var rlp = mkFilter("lowpass", 110, 0.5);
      var rg = mkGain(0.25);
      link(rum, rlp);
      link(rlp, rg);
      link(rg, bed.gain);
      startAt(rum, now());
      track(bed, rum);
      addLfo(bed, 0.06, 0.1, rg.gain);
    }
    // droplets: short bandpass noise bursts, random 0.1-0.4 s gaps
    loopEvents(
      bed,
      100,
      400,
      function (t) {
        droplet(bed, t);
      },
      rnd(50, 150)
    );
  }

  function droplet(bed, t) {
    var s = noiseSrc("white", false);
    if (!s) return;
    var bp = mkFilter("bandpass", rnd(2500, 6500), rnd(7, 14));
    var g = mkGain(0.0001);
    link(s, bp);
    link(bp, g);
    link(g, bed.gain);
    var peak = rnd(0.02, 0.055);
    try {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + rnd(0.03, 0.07));
    } catch (e) {
      try {
        g.gain.value = peak;
      } catch (e2) {}
    }
    startAt(s, t, Math.random() * 1.5, 0.12);
    track(bed, s);
  }

  // observatory_night: quiet wind + sparse cricket trills + faint shimmer
  function buildObservatoryNight(bed) {
    var wind = noiseSrc("brown");
    if (wind) {
      var lp = mkFilter("lowpass", 400, 0.6);
      var g = mkGain(0.16);
      link(wind, lp);
      link(lp, g);
      link(g, bed.gain);
      startAt(wind, now());
      track(bed, wind);
      addLfo(bed, 0.07, 160, lp.frequency);
      addLfo(bed, 0.045, 0.07, g.gain);
    }
    // faint high shimmer pad: two detuned sines, very low gain, 8 s LFO
    var sg = mkGain(0.006);
    link(sg, bed.gain);
    var o1 = mkOsc("sine", 1975);
    var o2 = mkOsc("sine", 1981.5);
    link(o1, sg);
    link(o2, sg);
    startAt(o1, now());
    startAt(o2, now());
    track(bed, o1);
    track(bed, o2);
    addLfo(bed, 0.125, 0.004, sg.gain);
    // crickets: 4-6 kHz sine trills, 30 ms x 3 bursts, rare
    loopEvents(
      bed,
      3500,
      9000,
      function (t) {
        cricketTrill(bed, t);
      },
      rnd(1500, 4000)
    );
  }

  function cricketTrill(bed, t) {
    var f = rnd(4200, 5600);
    for (var i = 0; i < 3; i++) {
      bedTone(bed, f + rnd(-150, 150), t + i * 0.07, 0.03, 0.02);
    }
  }

  // server_room: 55/110 Hz hum + 0.5 Hz AM fan noise + rare pentatonic blips
  function buildServerRoom(bed) {
    var lp = mkFilter("lowpass", 170, 0.4);
    var hg = mkGain(0.07);
    link(lp, hg);
    link(hg, bed.gain);
    var h1 = mkOsc("sawtooth", 55);
    var h2 = mkOsc("sawtooth", 110.5);
    link(h1, lp);
    link(h2, lp);
    startAt(h1, now());
    startAt(h2, now());
    track(bed, h1);
    track(bed, h2);
    var fan = noiseSrc("white");
    if (fan) {
      var flp = mkFilter("lowpass", 900, 0.5);
      var am = mkGain(0.018);
      link(fan, flp);
      link(flp, am);
      link(am, bed.gain);
      startAt(fan, now());
      track(bed, fan);
      addLfo(bed, 0.5, 0.016, am.gain);
    }
    loopEvents(
      bed,
      7000,
      16000,
      function (t) {
        dataBlip(bed, t);
      },
      rnd(2500, 6000)
    );
  }

  var PENTA = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];

  function dataBlip(bed, t) {
    var f = PENTA[Math.floor(Math.random() * PENTA.length)];
    var o = mkOsc("square", f);
    var lp = mkFilter("lowpass", 1600, 1);
    var g = mkGain(0.0001);
    link(o, lp);
    link(lp, g);
    link(g, bed.gain);
    try {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.018, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    } catch (e) {
      try {
        g.gain.value = 0.018;
      } catch (e2) {}
    }
    startAt(o, t);
    stopAt(o, t + 0.15);
    track(bed, o);
  }

  // apartment_night: muffled rain + rare muffled thunder + room tone
  function buildApartmentNight(bed) {
    var rain = noiseSrc("pink");
    if (rain) {
      var lp = mkFilter("lowpass", 600, 0.4);
      var g = mkGain(0.4);
      link(rain, lp);
      link(lp, g);
      link(g, bed.gain);
      startAt(rain, now());
      track(bed, rain);
      addLfo(bed, 0.09, 0.06, g.gain);
    }
    var h1 = mkOsc("sine", 60);
    var hg1 = mkGain(0.014);
    link(h1, hg1);
    link(hg1, bed.gain);
    startAt(h1, now());
    track(bed, h1);
    var h2 = mkOsc("sine", 120);
    var hg2 = mkGain(0.007);
    link(h2, hg2);
    link(hg2, bed.gain);
    startAt(h2, now());
    track(bed, h2);
    // thunder: filtered noise burst, ~1.5 s decay, every 25-45 s
    loopEvents(
      bed,
      25000,
      45000,
      function (t) {
        thunder(bed, t);
      },
      rnd(12000, 25000)
    );
  }

  function thunder(bed, t) {
    var s = noiseSrc("brown", false);
    if (!s) return;
    var lp = mkFilter("lowpass", 200, 0.7);
    var g = mkGain(0.0001);
    link(s, lp);
    link(lp, g);
    link(g, bed.gain);
    try {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.32, t + 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.68);
    } catch (e) {
      try {
        g.gain.value = 0.32;
      } catch (e2) {}
    }
    startAt(s, t, Math.random() * 0.1, 1.9);
    track(bed, s);
  }

  // email_screen: 120 Hz hum + rare two-tone blip + light noise floor
  function buildEmailScreen(bed) {
    var hum = mkOsc("sine", 120);
    var hg = mkGain(0.02);
    link(hum, hg);
    link(hg, bed.gain);
    startAt(hum, now());
    track(bed, hum);
    var floor = noiseSrc("white");
    if (floor) {
      var lp = mkFilter("lowpass", 2800, 0.3);
      var g = mkGain(0.007);
      link(floor, lp);
      link(lp, g);
      link(g, bed.gain);
      startAt(floor, now());
      track(bed, floor);
    }
    loopEvents(
      bed,
      16000,
      34000,
      function (t) {
        bedTone(bed, 880, t, 0.07, 0.028);
        bedTone(bed, 1174.66, t + 0.11, 0.09, 0.028);
      },
      rnd(8000, 15000)
    );
  }

  // memory_white: 3 detuned sines, slow tremolo + swells, highpassed air
  function buildMemoryWhite(bed) {
    var trem = mkGain(0.85);
    link(trem, bed.gain);
    var swell = mkGain(0.75);
    link(swell, trem);
    var voices = [220, 277.18, 329.63];
    for (var i = 0; i < voices.length; i++) {
      var o1 = mkOsc("sine", voices[i] * 0.9995);
      var o2 = mkOsc("sine", voices[i] * 1.0005);
      var vg = mkGain(0.018);
      link(o1, vg);
      link(o2, vg);
      link(vg, swell);
      startAt(o1, now());
      startAt(o2, now());
      track(bed, o1);
      track(bed, o2);
    }
    addLfo(bed, 0.14, 0.3, trem.gain); // slow tremolo
    addLfo(bed, 0.1, 0.3, swell.gain); // ~10 s swells
    var airy = noiseSrc("white");
    if (airy) {
      var hp = mkFilter("highpass", 2000, 0.5);
      var ag = mkGain(0.006);
      link(airy, hp);
      link(hp, ag);
      link(ag, trem);
      startAt(airy, now());
      track(bed, airy);
    }
  }

  // dawn_ending: warm triad pad with slow attack + breeze + rare birdsong
  function buildDawnEnding(bed) {
    var pad = mkGain(0.0001);
    var padTrem = mkGain(0.9);
    link(pad, padTrem);
    link(padTrem, bed.gain);
    var notes = [
      [261.63, 0.02],
      [329.63, 0.016],
      [392, 0.014],
      [523.25, 0.008]
    ];
    for (var i = 0; i < notes.length; i++) {
      var o = mkOsc("sine", notes[i][0]);
      var g = mkGain(notes[i][1]);
      link(o, g);
      link(g, pad);
      startAt(o, now());
      track(bed, o);
    }
    try {
      pad.gain.setValueAtTime(0.0001, now());
      pad.gain.linearRampToValueAtTime(1, now() + 4); // slow attack
    } catch (e) {
      try {
        pad.gain.value = 1;
      } catch (e2) {}
    }
    addLfo(bed, 0.08, 0.18, padTrem.gain);
    var breeze = noiseSrc("pink");
    if (breeze) {
      var lp = mkFilter("lowpass", 500, 0.4);
      var bg = mkGain(0.06);
      link(breeze, lp);
      link(lp, bg);
      link(bg, bed.gain);
      startAt(breeze, now());
      track(bed, breeze);
      addLfo(bed, 0.06, 0.03, bg.gain);
    }
    // birdsong: descending 2-4 kHz sine glides, rare
    loopEvents(
      bed,
      6000,
      13000,
      function (t) {
        birdsong(bed, t);
      },
      rnd(3000, 7000)
    );
  }

  function birdsong(bed, t) {
    var n = 2 + Math.floor(Math.random() * 2); // 2-3 chirps
    for (var i = 0; i < n; i++) {
      var f = rnd(2600, 4000);
      bedTone(bed, f, t + i * rnd(0.16, 0.24), rnd(0.1, 0.16), 0.022, f * rnd(0.55, 0.7));
    }
  }

  // finale_star: suspended pad resolving to major + settling sub heartbeat
  // + sparse starlight chimes + highpassed air
  function buildFinaleStar(bed) {
    // warm pad: detuned Asus4 voicing (4 sines) that resolves to A major
    var pad = mkGain(0.0001);
    var padTrem = mkGain(0.9);
    var lp = mkFilter("lowpass", 900, 0.4);
    link(pad, lp);
    link(lp, padTrem);
    link(padTrem, bed.gain);
    var t0 = now();
    var padNotes = [
      [220 * 0.9995, 0.02], // A3 root
      [329.63 * 1.0005, 0.013], // E4 fifth
      [440 * 0.9995, 0.009] // A4 octave
    ];
    for (var i = 0; i < padNotes.length; i++) {
      var po = mkOsc("sine", padNotes[i][0]);
      var pg = mkGain(padNotes[i][1]);
      link(po, pg);
      link(pg, pad);
      startAt(po, now());
      track(bed, po);
    }
    var susO = mkOsc("sine", 293.66); // D4 suspended 4th
    var susG = mkGain(0.015);
    link(susO, susG);
    link(susG, pad);
    startAt(susO, now());
    track(bed, susO);
    var resO = mkOsc("sine", 277.18 * 1.0005); // C#4 major 3rd, resolution voice
    var resG = mkGain(0.0001);
    link(resO, resG);
    link(resG, pad);
    startAt(resO, now());
    track(bed, resO);
    try {
      pad.gain.setValueAtTime(0.0001, t0);
      pad.gain.linearRampToValueAtTime(1, t0 + 6); // slow bloom
    } catch (e) {
      try {
        pad.gain.value = 1;
      } catch (e2) {}
    }
    try {
      // one-way resolution, scheduled once: 4th recedes as the 3rd arrives
      susG.gain.setValueAtTime(0.015, t0);
      susG.gain.linearRampToValueAtTime(0.004, t0 + 20);
      resG.gain.setValueAtTime(0.0001, t0);
      resG.gain.linearRampToValueAtTime(0.014, t0 + 20);
    } catch (e) {
      try {
        susG.gain.value = 0.004;
        resG.gain.value = 0.014;
      } catch (e2) {}
    }
    addLfo(bed, 0.05, 180, lp.frequency); // very slow filter drift
    addLfo(bed, 0.08, 0.15, padTrem.gain);
    // sub heartbeat: 55 Hz pulse at ~50 bpm, slowing + widening, gone by ~45 s
    // (one scheduler entry whose gap evolves; retires itself at 45 s)
    var hbBeatMs = 1200;
    var hbElapsedMs = 0;
    addBedEvent(
      bed,
      1.5,
      function (t) {
        subPulse(bed, hbBeatMs, 1 - hbElapsedMs / 45000, t);
      },
      function () {
        hbElapsedMs += hbBeatMs;
        if (hbElapsedMs >= 45000) return 0; // evolution complete: retire
        hbBeatMs = Math.min(3000, hbBeatMs * 1.07);
        return hbBeatMs / 1000;
      }
    );
    // starlight: tiny chime partials, 6-14 s apart, very quiet
    loopEvents(
      bed,
      6000,
      14000,
      function (t) {
        starChime(bed, t);
      },
      rnd(3000, 7000)
    );
    // air: highpassed pink noise, very low gain, 10-14 s swell
    var airy = noiseSrc("pink");
    if (airy) {
      var hp = mkFilter("highpass", 2400, 0.5);
      var ag = mkGain(0.004);
      link(airy, hp);
      link(hp, ag);
      link(ag, bed.gain);
      startAt(airy, now());
      track(bed, airy);
      addLfo(bed, 0.075, 0.003, ag.gain);
    }
  }

  // one soft 55 Hz sub pulse at exact audio-clock time `t`;
  // peakScale carries the ~45 s fade-out
  function subPulse(bed, beatMs, peakScale, t) {
    if (peakScale <= 0.03) return;
    var o = mkOsc("sine", 55);
    var g = mkGain(0.0001);
    link(o, g);
    link(g, bed.gain);
    var peak = 0.045 * peakScale;
    var dur = 0.4 + (beatMs / 1000) * 0.28; // envelope widens as it slows
    try {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } catch (e) {
      try {
        g.gain.value = peak;
      } catch (e2) {}
    }
    startAt(o, t);
    stopAt(o, t + dur + 0.03);
    track(bed, o);
  }

  var STAR_CHIME = [2217.46, 2637.02, 2959.96, 3520, 3951.07]; // A-major pentatonic, 2-4 kHz

  function starChime(bed, t) {
    var f = STAR_CHIME[Math.floor(Math.random() * STAR_CHIME.length)];
    bedTone(bed, f, t, rnd(0.28, 0.45), 0.012);
    bedTone(bed, f * 2.01, t + 0.012, rnd(0.18, 0.3), 0.004); // faint upper partial
  }

  var BED_DEFS = {
    streets_rain: { level: 0.5, build: buildStreetsRain },
    observatory_night: { level: 0.4, build: buildObservatoryNight },
    server_room: { level: 0.45, build: buildServerRoom },
    apartment_night: { level: 0.5, build: buildApartmentNight },
    email_screen: { level: 0.35, build: buildEmailScreen },
    memory_white: { level: 0.4, build: buildMemoryWhite },
    dawn_ending: { level: 0.45, build: buildDawnEnding },
    finale_star: { level: 0.4, build: buildFinaleStar }
  };

  /* ------------------------------------------------------------------ *
   *  SFX synthesis (one-shots: ticks/ui <= 0.4 s, peaks ~0.05-0.1;
   *  swell() is the long-form exception at ~2.4 s)
   * ------------------------------------------------------------------ */

  // Typewriter tick: ~1800 Hz blip with a 25 ms decay (+ 2 ms noise transient).
  function playTypeTick() {
    var t = now();
    var o = mkOsc("sine", rnd(1700, 1900));
    var g = mkGain(0.0001);
    link(o, g);
    link(g, sfxBus);
    try {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
    } catch (e) {
      try {
        g.gain.value = 0.07;
      } catch (e2) {}
    }
    startAt(o, t);
    stopAt(o, t + 0.04);
    trackOne(o);
    if (Math.random() < 0.5) {
      var s = noiseSrc("white", false);
      if (s) {
        var hp = mkFilter("highpass", 3000, 0.7);
        var ng = mkGain(0.0001);
        link(s, hp);
        link(hp, ng);
        link(ng, sfxBus);
        try {
          ng.gain.setValueAtTime(0.05, t);
          ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
        } catch (e) {
          try {
            ng.gain.value = 0.05;
          } catch (e2) {}
        }
        startAt(s, t, Math.random(), 0.03);
        trackOne(s);
      }
    }
  }

  // "start": soft swell (three sines rising 0.22 s, falling by 0.4 s).
  function uiStart() {
    var t = now();
    var notes = [
      [261.63, 0.1],
      [329.63, 0.08],
      [392, 0.07]
    ];
    for (var i = 0; i < notes.length; i++) {
      var o = mkOsc("sine", notes[i][0]);
      var g = mkGain(0.0001);
      link(o, g);
      link(g, sfxBus);
      try {
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(notes[i][1], t + 0.22);
        g.gain.linearRampToValueAtTime(0.0001, t + 0.4);
      } catch (e) {
        try {
          g.gain.value = notes[i][1];
        } catch (e2) {}
      }
      startAt(o, t);
      stopAt(o, t + 0.45);
      trackOne(o);
    }
  }

  // "select": click (highpassed noise burst) + quick up-chirp.
  function uiSelect() {
    var t = now();
    var s = noiseSrc("white", false);
    if (s) {
      var hp = mkFilter("highpass", 2500, 0.7);
      var g = mkGain(0.0001);
      link(s, hp);
      link(hp, g);
      link(g, sfxBus);
      try {
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      } catch (e) {
        try {
          g.gain.value = 0.09;
        } catch (e2) {}
      }
      startAt(s, t, Math.random(), 0.05);
      trackOne(s);
    }
    var o = mkOsc("sine", 1250);
    var og = mkGain(0.0001);
    link(o, og);
    link(og, sfxBus);
    try {
      o.frequency.setValueAtTime(1250, t + 0.01);
      o.frequency.exponentialRampToValueAtTime(1900, t + 0.08);
      og.gain.setValueAtTime(0.0001, t + 0.01);
      og.gain.linearRampToValueAtTime(0.07, t + 0.03);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    } catch (e) {

        og.gain.value = 0.07;
      } catch (e2) {}

    startAt(o, t + 0.01);

  function uiNote(freq, at, dur) {
    var o = mkOsc("sine", freq);
    var g = mkGain(0.0001);
    link(o, g);
    link(g, sfxBus);
    try {
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.09, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    } catch (e) {
      try {
        g.gain.value = 0.09;
      } catch (e2) {}
    }
    startAt(o, at);
    stopAt(o, at + dur + 0.03);
    trackOne(o);
  }

  // "save": two notes up. "load": two notes down.
  function uiTwoNotes(f1, f2) {
    var t = now();
    uiNote(f1, t, 0.1);
    uiNote(f2, t + 0.13, 0.12);
  }

  // "swell": cinematic emotional-reveal cue paired with the dolly line fx.
  // Layer A (weight): two detuned oscillators (sine + sawtooth) gliding
  // 180 -> 55 Hz through a lowpass over ~1.6 s. Layer B (presence, so laptop
  // speakers hear the move): a bandpassed noise burst centered ~300 Hz with a
  // gentle 0.8 s attack. One quiet shared dynamic: swell to peak over 0.9 s,
  // short hold, decayed to silence by ~2.4 s.
  function playSwell() {
    var t = now();
    var lp = mkFilter("lowpass", 240, 0.5);
    var env = mkGain(0.0001);
    link(lp, env);
    link(env, sfxBus);
    var oSine = mkOsc("sine", 180);
    var oSaw = mkOsc("sawtooth", 180.9); // slight detune -> slow beating
    link(oSine, lp);
    link(oSaw, lp);
    try {
      oSine.frequency.setValueAtTime(180, t);
      oSine.frequency.exponentialRampToValueAtTime(55, t + 1.6);
      oSaw.frequency.setValueAtTime(180.9, t);
      oSaw.frequency.exponentialRampToValueAtTime(55.2, t + 1.6);
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(0.12, t + 0.9);
      env.gain.linearRampToValueAtTime(0.12, t + 1.25); // hold
      env.gain.linearRampToValueAtTime(0, t + 2.4);
    } catch (e) {
      try {
        env.gain.value = 0.12;
      } catch (e2) {}
    }
    startAt(oSine, t);
    startAt(oSaw, t);
    stopAt(oSine, t + 2.45);
    stopAt(oSaw, t + 2.45);
    trackOne(oSine);
    trackOne(oSaw);
    // Layer B: bandpassed noise presence, gentle attack, fades with layer A.
    var s = noiseSrc("white");
    if (s) {
      var bp = mkFilter("bandpass", 300, 0.9);
      var ng = mkGain(0.0001);
      link(s, bp);
      link(bp, ng);
      link(ng, sfxBus);
      try {
        ng.gain.setValueAtTime(0.0001, t);
        ng.gain.linearRampToValueAtTime(0.05, t + 0.8);
        ng.gain.linearRampToValueAtTime(0.05, t + 1.1);
        ng.gain.linearRampToValueAtTime(0, t + 2.3);
      } catch (e) {
        try {
          ng.gain.value = 0.05;
        } catch (e2) {}
      }
      startAt(s, t);
      stopAt(s, t + 2.35);
      trackOne(s);
    }
  }

  /* ------------------------------------------------------------------ *
   *  Context / master chain / enable-disable
   * ------------------------------------------------------------------ */

  function buildMaster() {
    master = ctx.createGain();
    try {
      master.gain.value = MASTER_LEVEL * vol;
    } catch (e) {}
    var out = ctx.destination;
    var routed = false;
    try {
      var comp = ctx.createDynamicsCompressor();
      try {
        comp.threshold.value = -18;
        comp.knee.value = 24;
        comp.ratio.value = 3;
        comp.attack.value = 0.01;
        comp.release.value = 0.25;
      } catch (e) {}
      master.connect(comp);
      comp.connect(out);
      routed = true;
    } catch (e) {
      routed = false;
    }
    if (!routed) {
      try {
        master.connect(out);
      } catch (e) {}
    }
    sfxBus = ctx.createGain();
    try {
      sfxBus.gain.value = 1;
    } catch (e) {}
    link(sfxBus, master);
  }

  function tryResume() {
    if (!ctx || !on) return;
    try {
      if (ctx.state === "suspended" && ctx.resume) {
        var r = ctx.resume();
        if (r && typeof r.catch === "function") r.catch(function () {});
      }
    } catch (e) {}
  }

  // Returns the context only when supported, enabled and post-gesture;
  // otherwise null (callers no-op, the scene intent stays recorded).
  function ensureCtx() {
    if (!supported || broken || !on || !gestureSeen) return null;
    if (ctx) {
      tryResume();
      return ctx;
    }
    var AC = getAudioCtor();
    if (!AC) {
      broken = true;
      warnOnce("VN_AUDIO: Web Audio API is not available");
      return null;
    }
    try {
      ctx = new AC();
    } catch (e) {
      ctx = null;
      broken = true;
      warnOnce("VN_AUDIO: AudioContext creation failed");
      return null;
    }
    try {
      buildMaster();
    } catch (e) {
      master = null;
      broken = true;
      return null;
    }
    try {
      makeNoiseBuffers();
    } catch (e) {}
    tryResume();
    if (desiredBg) {
      try {
        applyScene();
      } catch (e) {}
    }
    return ctx;
  }

  function disableAudio() {
    // Audible fast kill: master ramp + stop every scheduled/looping node.
    try {
      rampParam(master.gain, 0, now(), KILL_RAMP_S);
    } catch (e) {
      try {
        master.gain.value = 0;
      } catch (e2) {}
    }
    try {
      killOneShots();
    } catch (e) {}
    try {
      for (var i = allBeds.length - 1; i >= 0; i--) stopBed(allBeds[i], 0.25);
    } catch (e) {}
    try {
      if (suspTimer) {
        clearTimeout(suspTimer);
        suspTimer = 0;
      }
      suspTimer = setTimeout(function () {
        suspTimer = 0;
        if (on || !ctx) return;
        try {
          if (ctx.state === "running" && ctx.suspend) {
            var r = ctx.suspend();
            if (r && typeof r.catch === "function") r.catch(function () {});
          }
        } catch (e) {}
      }, SUSPEND_MS);
    } catch (e) {}
  }

  function apiEnabled() {
    return supported && !broken && !!on;
  }

  function apiSetEnabled(v) {
    try {
      v = !!v;
      if (!supported || broken) return false;
      on = v;
      writePref(on);
      if (!ctx) {
        if (on) ensureCtx(); // still gated on gestureSeen inside
        return apiEnabled();
      }
      if (suspTimer) {
        clearTimeout(suspTimer);
        suspTimer = 0;
      }
      if (on) {
        tryResume();
        rampParam(master.gain, MASTER_LEVEL * vol, now(), KILL_RAMP_S);
        if (desiredBg) applyScene();
      } else {
        disableAudio();
      }
      return apiEnabled();
    } catch (e) {
      return apiEnabled();
    }
  }

  // Smooth slider move: exponential-approach toward the new master level.
  // Only touches the graph while enabled — a disabled context stays silent
  // (setEnabled(false) ramps to 0; re-enable returns to MASTER_LEVEL * vol).
  function applyVolumeGain() {
    if (!ctx || !master) return;
    var v = MASTER_LEVEL * vol;
    try {
      master.gain.cancelScheduledValues(now());
      master.gain.setTargetAtTime(v, now(), VOL_TAU_S);
    } catch (e) {
      try {
        master.gain.value = v;
      } catch (e2) {}
    }
  }

  function apiVolume() {
    try {
      return vol;
    } catch (e) {
      return 1;
    }
  }

  function apiSetVolume(v) {
    try {
      if (typeof v !== "number" || !isFinite(v)) return vol;
      if (v < 0) v = 0;
      if (v > 1) v = 1;
      vol = v;
      writeVolume();
      if (on) applyVolumeGain();
      return vol;
    } catch (e) {
      return vol;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Gesture watching + public API
   * ------------------------------------------------------------------ */

  function onGesture() {
    gestureSeen = true;
    tryResume(); // wake a policy-suspended context on real interaction
  }

  function watchGestures() {
    if (!target.addEventListener) return;
    var evs = ["pointerdown", "touchend", "keydown", "click"];
    for (var i = 0; i < evs.length; i++) {
      try {
        target.addEventListener(evs[i], onGesture, true);
      } catch (e) {}
    }
  }

  function apiScene(bgId) {
    try {
      desiredBg = bgId && BED_DEFS[bgId] ? String(bgId) : null;
      if (!ensureCtx()) return;
      applyScene();
    } catch (e) {}
  }

  function apiType() {
    try {
      var t = Date.now();
      if (t - lastTypeAt < TYPE_GAP_MS) return;
      lastTypeAt = t;
      if (!ensureCtx()) return;
      playTypeTick();
    } catch (e) {}
  }

  function apiUi(kind) {
    try {
      if (!ensureCtx()) return;
      if (kind === "start") uiStart();
      else if (kind === "select") uiSelect();
      else if (kind === "save") uiTwoNotes(587.33, 880);
      else if (kind === "load") uiTwoNotes(880, 587.33);
    } catch (e) {}
  }

  // Self-throttled one-shot: ignores calls within SWELL_GAP_MS of the
  // previous swell (mirrors the type() throttle-then-gate order).
  function apiSwell() {
    try {
      var t = Date.now();
      if (t - lastSwellAt < SWELL_GAP_MS) return;

  }

    target.VN_AUDIO = {
      scene: apiScene,
      type: apiType,
      ui: apiUi,
      swell: apiSwell,
      enabled: apiEnabled,
      setEnabled: apiSetEnabled,
      setVolume: apiSetVolume,
      volume: apiVolume
    };
  } catch (e) {}

  try {
    watchGestures();
  } catch (e) {}

<script>
/*
 * engine.js — vanilla JS visual novel runtime. No dependencies, no frameworks.
 *
 * Exposes a single entry point:
 *
 *   VN.start(scenario)   // falls back to window.SCENARIO when omitted;
 *                        // scenario.js is expected to be loaded before engine.js
 *
 * The engine builds its entire DOM inside document.body:
 *
 *   #vn-app
 *     .vn-bg > .vn-bg-fx           background layer (.vn-fade / .vn-fading
 *                                  toggled around swaps) + animated-fx child +
 *                                  optional .vn-bg-canvas (window.VN_SCENES)
 *     .vn-vignette, .vn-grain      always-present cinematic layers (created
 *                                  empty here; styling lives in style.css)
 *     .vn-sprites > .vn-sprite     one element per on-screen character (max 2);
 *                                  slot 0 = .vn-pos-left, slot 1 = .vn-pos-right
 *                                  (data-slot, stable per character; .vn-solo on
 *                                  a lone sprite); entrance/exit/feel-swap via
 *                                  .vn-enter / .vn-leave / .vn-swap;
 *                                  window.CHAR_ART[id] inline SVG when available,
 *                                  otherwise the initial-letter fallback
 *     .vn-dialog > .vn-name / .vn-text
 *     .vn-choices > button.vn-choice
 *     .vn-topbar > button.vn-btn[data-act=backlog|save|load|auto|speed|
 *                                  title|settings|audio]
 *     .vn-backlog > .vn-backlog-list > .vn-backlog-line > b.vn-backlog-name + span.vn-backlog-text
 *     .vn-menu > .vn-menu-title + button.vn-slot > .vn-slot-thumb? +
 *                                  .vn-slot-info + button.vn-close
 *       (.vn-slot-thumb = optional <img> from the save payload's thumb data
 *        URL, load-mode slots only, rebuilt on every refreshSlots)
 *     .vn-settings > .vn-settings-title + .vn-setting-row (label + input.vn-range
 *                                  + span.vn-range-val) x2 + button.vn-close
 *     .vn-title > .vn-title-name + .vn-title-sub + .vn-endings +
 *                                  button#vn-start + button#vn-continue +
 *                                  button#vn-bonus
 *       (.vn-endings = .vn-endings-count + .vn-endings-marks >
 *        span.vn-ending-mark[data-ending="ending_*"], the 结局收集 readout;
 *        #vn-continue 继续游戏 = loads the most recent vn-save-1..3 slot,
 *        hidden via .vn-hidden unless some slot holds parseable JSON;
 *        #vn-bonus 星语 · 后日谈 = 100%-completion bonus episode, hidden via
 *        .vn-hidden unless titleBonusActive())
 *     .vn-toast
 *
 * Overlay visibility is toggled exclusively via the .vn-hidden utility class
 * (style.css defines it as display:none !important). All story text is written
 * through textContent — story data never touches innerHTML. The only innerHTML
 * uses are trusted engine-authored data: backgrounds[id].html fx markup and
 * window.CHAR_ART portrait SVG.
 *
 * Optional, backward-compatible scenario extensions:
 *   backgrounds[id].html — fx layer synced into .vn-bg-fx on every bg change
 *   line.fx              — "glitch" (.vn-glitch on .vn-text while the line
 *                          displays) or "shake" (.vn-shake on #vn-app for
 *                          SHAKE_MS); unknown values warn once and are ignored
 *
 * Optional parallel module (loaded before engine.js):
 *   window.VN_SCENES     — background id -> { init(ctx, w, h),
 *                          draw(ctx, w, h, t, dt) }. When the active bg has an
 *                          entry, a <canvas class="vn-bg-canvas"> is appended

  function audioHook(name, arg) {
    var mod = typeof window !== "undefined" ? window.VN_AUDIO : null;
    if (!mod || typeof mod !== "object") return;
    var fn = mod[name];
    if (typeof fn !== "function") return;
    try {
      fn.call(mod, arg);
    } catch (err) {
      /* audio failed: ignore, the game goes on */
    }
  }

  // Topbar 音效 label, reflecting the module's state at render time. Default
  // label 音效:开 when the module is absent (or its enabled() throws).
  function audioLabel() {
    var mod = typeof window !== "undefined" ? window.VN_AUDIO : null;
    if (mod && typeof mod.enabled === "function") {
      try {
        return mod.enabled() ? "音效:开" : "音效:关";
      } catch (err) {
        /* fall through to the default label */
      }
    }
    return "音效:开";
  }

  // Topbar 音效 button: flips the module's enabled state, updates the label
  // and toasts the new state. Without the module (or its API): a plain
  // explanation toast. A throwing module changes nothing and never throws.
  function toggleAudio() {
    var mod = typeof window !== "undefined" ? window.VN_AUDIO : null;
    if (
      !mod ||
      typeof mod !== "object" ||
      typeof mod.setEnabled !== "function" ||
      typeof mod.enabled !== "function"
    ) {
      toast("无音频模块");
      return;
    }
    var on = false;
    try {
      on = !!mod.setEnabled(!mod.enabled());
    } catch (err) {
      return; // broken module: keep the current label, no crash
    }
    els.btns.audio.textContent = on ? "音效:开" : "音效:关";
    toast(on ? "音效已开启" : "音效已关闭");
  }

  /* -------------------------------------------------------------- typewriter */

  function speedMs() {
    return SPEEDS[state.speedIdx].ms;
  }

  function startTyping(text) {
    clearTimeout(timers.type);
    state.typing = true;
    state.typeFull = String(text);
    state.typePos = 0;
    els.text.textContent = "";
    els.text.classList.add("vn-typing"); // blinking caret while chars reveal
    hideNextIndicator();
    timers.type = setTimeout(typeStep, speedMs());
  }

  function typeStep() {
    if (!state.typing) return;
    state.typePos += 1;
    els.text.textContent = state.typeFull.slice(0, state.typePos);
    // Coarse engine-side throttle: one tick per 2nd revealed character. The
    // module does its own enabled-check (and any fine throttling) itself.
    if (state.typePos % 2 === 0) audioHook("type");
    if (state.typePos >= state.typeFull.length) {
      finishTyping();
      return;
    }
    timers.type = setTimeout(typeStep, speedMs());
  }

  function finishTyping() {
    clearTimeout(timers.type);
    timers.type = null;
    state.typing = false;
    els.text.textContent = state.typeFull;
    els.text.classList.remove("vn-typing");
    showNextIndicator();
    scheduleAuto();
  }

  // Advance indicator (▼): appears once the line is fully typed — the
  // classic VN "click to continue" cue; hidden while typing or mid-fx.
  function showNextIndicator() {
    if (els && els.nextInd) els.nextInd.classList.remove("vn-hidden");
  }

  function hideNextIndicator() {
    if (els && els.nextInd) els.nextInd.classList.add("vn-hidden");
  }

  function completeTyping() {
    if (state.typing) finishTyping();
  }

  /* --------------------------------------------------------------- auto mode */

  // Decorative auto-mode progress line: fills over the auto-advance delay
  // while the current line waits, resets whenever auto pauses or turns off.
  function runAutoBar() {
    if (!els || !els.autoBarFill) return;
    var fill = els.autoBarFill;
    fill.style.animationDuration = state.autoDelayMs + "ms";
    fill.classList.remove("vn-auto-run");
    void els.autoBar.offsetWidth; // force reflow so the animation restarts
    fill.classList.add("vn-auto-run");
  }

  function resetAutoBar() {
    if (!els || !els.autoBarFill) return;
    els.autoBarFill.classList.remove("vn-auto-run");
  }

  function scheduleAuto() {
    clearTimeout(timers.auto);
    timers.auto = null;
    if (!state.auto || state.mode !== "line" || state.typing) return;
    runAutoBar();
    timers.auto = setTimeout(autoTick, state.autoDelayMs);
  }

  function autoTick() {
    timers.auto = null;
    // If the player opened an overlay, hold the game until it closes.
    if (overlaysOpen()) {
      resetAutoBar();
      timers.auto = setTimeout(autoTick, state.autoDelayMs);
      return;
    }
    advance();
  }

  function clearAuto() {
    clearTimeout(timers.auto);
    timers.auto = null;
    resetAutoBar();
  }

  function overlaysOpen() {
    if (!els) return true;
    return (
      state.mode !== "line" ||
      !els.menu.classList.contains("vn-hidden") ||
      !els.backlog.classList.contains("vn-hidden") ||
      !els.settings.classList.contains("vn-hidden") ||
      galleryVisible()
    );
  }

  function toggleAuto() {
    state.auto = !state.auto;
    els.btns.auto.classList.toggle("vn-active", state.auto);
    if (state.auto) {
      setSkip(false, false); // auto and skip are mutually exclusive
      scheduleAuto();
    } else clearAuto();
  }

  /* ---------------------------------------------------------------- skip */

  // Skip mode: steps lines at SKIP_DELAY_MS until a choice/overlay stops it
  // (unconditional skip — the script is short, no seen-text store). Held S
  // temporarily skips without latching the topbar button.
  var skipOn = false;
  var skipHeld = false;

  function setSkip(on, latch) {
    if (latch) skipOn = on;
    else skipOn = skipOn && on;
    if (!skipOn) {
      clearTimeout(timers.skip);
      timers.skip = null;
    }
    if (els && els.btns.skip) {
      els.btns.skip.classList.toggle("vn-active", skipOn);
    }
    if (skipOn) {
      clearAuto();
      scheduleSkip();
    }
  }

  function toggleSkip() {
    setSkip(!skipOn, true);
  }

  function scheduleSkip() {
    clearTimeout(timers.skip);
    timers.skip = null;
    if ((!skipOn && !skipHeld) || !els) return;
    if (state.mode !== "line") {
      setSkip(false, true); // reached choices/ending: skip stops itself
      return;
    }
    // typing line: complete it instantly, then keep stepping
    if (state.typing) finishTyping();
    timers.skip = setTimeout(skipTick, SKIP_DELAY_MS);
  }

  function skipTick() {
    timers.skip = null;
    if (!skipOn && !skipHeld) return;
    if (overlaysOpen()) {
      setSkip(false, true); // choices / ending: skip stops itself
      return;
    }
    if (!els.choices.classList.contains("vn-hidden")) {
      setSkip(false, true);
      return;
    }
    advance();
    scheduleSkip();
  }

  function clearSkip() {
    skipHeld = false;
    setSkip(false, true);
  }

  function cycleSpeed() {
    state.speedIdx = (state.speedIdx + 1) % SPEEDS.length;
    els.btns.speed.textContent = speedLabel();
  }

  /* ----------------------------------------------------------------- sprites */

  // Resolves the trusted inline-SVG portrait for a character+feel from the
  // optional global window.CHAR_ART map (charId -> { normal, happy, sad,
  // surprised, angry }). Falls back from art[feel] to art.normal; returns
  // null when no usable art exists so callers keep the letter fallback.
  function charArtFor(charId, feel) {
    var map =
      typeof window !== "undefined" && window.CHAR_ART ? window.CHAR_ART : null;
    if (!map || typeof map !== "object") return null;
    var entry = map[charId];
    if (!entry || typeof entry !== "object") return null;
    if (typeof entry[feel] === "string" && entry[feel]) return entry[feel];
    if (typeof entry.normal === "string" && entry.normal) return entry.normal;
    return null;
  }

  // Paints a sprite's portrait: CHAR_ART svg (replaces the initial letter)
  // when available, else the original initial-letter circle fallback.
  function applySpriteArt(sp, charId, feel, ch) {
    var art = charArtFor(charId, feel);
    if (art != null) {
      sp.innerHTML = art; // trusted, authored inline SVG
    } else {
      sp.textContent = String(ch.name || charId).charAt(0);
    }
  }

  function showSprite(charId, feel) {
    var ch = S.characters && S.characters[charId];
    if (!ch) {
      console.warn("[VN] unknown character: " + charId);
      return;
    }
    var arr = state.recent;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === charId) {
        arr.splice(i, 1);
        break;
      }
    }
    arr.unshift({
      id: charId,
      feel: typeof feel === "string" && feel ? feel : "normal",
    });
    if (arr.length > 2) arr.length = 2; // keep only the latest two speakers
    renderSprites();
  }

  // Entrance: slide up + fade in (.vn-enter); the class removes itself after
  // SPRITE_ENTER_MS so the element settles into its normal transitioned state.
  function spriteEnter(sp) {
    sp.classList.add("vn-enter");
    clearTimeout(sp._vnEnterTimer);
    sp._vnEnterTimer = setTimeout(function () {
      sp._vnEnterTimer = null;
      if (sp.parentNode) sp.classList.remove("vn-enter");
    }, SPRITE_ENTER_MS);
  }

  // Cancels a pending .vn-leave removal (re-entry inside the leave window).
  // Returns true when a leave was actually canceled.
  function spriteCancelLeave(sp) {
    if (!sp._vnLeaveTimer) return false;
    clearTimeout(sp._vnLeaveTimer);
    sp._vnLeaveTimer = null;
    sp.classList.remove("vn-leave");
    return true;
  }

  // Exit: slide down + fade (.vn-leave); the element stays in the layer during
  // the window (so a fast re-entry can reuse it) and is dropped after
  // SPRITE_LEAVE_MS. Focus/dim/solo treatment is stripped while it slides.
  function spriteBeginLeave(sp) {
    if (sp._vnLeaveTimer) return; // already leaving
    clearTimeout(sp._vnEnterTimer);
    sp._vnEnterTimer = null;
    sp.classList.remove("vn-enter", "vn-focus", "vn-dim", "vn-solo");
    sp.classList.add("vn-leave");
    sp._vnLeaveTimer = setTimeout(function () {
      sp._vnLeaveTimer = null;
      if (sp.parentNode) sp.parentNode.removeChild(sp);
    }, SPRITE_LEAVE_MS);
  }

  // Immediate stage wipe (title screen): no exit animation, sprites vanish
  // with the rest of the game state, all per-sprite timers canceled.
  function clearSpritesNow() {
    if (!els) return;
    Array.prototype.forEach.call(els.sprites.children, function (sp) {
      clearTimeout(sp._vnEnterTimer);
      clearTimeout(sp._vnLeaveTimer);
      clearTimeout(sp._vnSwapTimer);
      sp._vnEnterTimer = null;
      sp._vnLeaveTimer = null;
      sp._vnSwapTimer = null;
      if (sp.parentNode) sp.parentNode.removeChild(sp);
    });
  }

  // Diffs the sprite layer against state.recent so existing elements (and any
  // CSS transitions on them) survive when a character stays on screen.
  //
  // Stage layout: slot 0 stands LEFT (.vn-pos-left), slot 1 RIGHT
  // (.vn-pos-right). The slot is stored on the element when it is created and
  // is never reassigned while the same characters stay on stage; a newcomer
  // takes the lowest free (vacated) slot. A lone character is always slot 0,
  // with .vn-solo nudging it toward center (styling in style.css).
  function renderSprites() {
    var layer = els.sprites;
    var existing = {};
    Array.prototype.forEach.call(layer.children, function (node) {
      existing[node.getAttribute("data-char")] = node;
    });

    // Desired DOM order: oldest speaker first, most recent last (gets .vn-focus).
    var desired = state.recent.slice().reverse();
    var kept = {};
    desired.forEach(function (item) {
      var sp = existing[item.id];
      var feel = item.feel || "normal";
      if (!sp) {
        var ch = S.characters && S.characters[item.id];
        if (!ch) return; // already warned when the character was used
        sp = document.createElement("div");
        sp.className = "vn-sprite";
        sp.setAttribute("data-char", item.id);
        sp.style.setProperty("--vn-color", charColor(ch));
        applySpriteArt(sp, item.id, feel, ch);
        layer.appendChild(sp);
        spriteEnter(sp); // slide up + fade in; class self-removes
      } else {
        // Same character back on stage inside the leave window: cancel the
        // pending removal and replay the entrance on the kept element.
        if (spriteCancelLeave(sp)) spriteEnter(sp);
        if (sp.getAttribute("data-feel") !== feel) {
          // Feel changed on an on-screen sprite: swap to the new feel's art
          // (falls back to normal art, then to the initial letter) under a
          // quick .vn-swap crossfade/scale pulse.
          var ch2 = S.characters && S.characters[item.id];
          if (ch2) {
            applySpriteArt(sp, item.id, feel, ch2);
            sp.classList.add("vn-swap");
            clearTimeout(sp._vnSwapTimer);
            sp._vnSwapTimer = setTimeout(function () {
              sp._vnSwapTimer = null;
              if (sp.parentNode) sp.classList.remove("vn-swap");
            }, SPRITE_SWAP_MS);
          }
        }
      }
      sp.setAttribute("data-feel", feel);
      kept[item.id] = sp;
    });

    // Characters no longer on stage slide out; their elements linger in the
    // layer during the leave window so a fast re-entry reuses them.
    Object.keys(existing).forEach(function (id) {
      if (!kept[id] && existing[id].parentNode) spriteBeginLeave(existing[id]);
    });

    // Slot assignment: stable while the same characters remain; a new or
    // returning sprite takes the lowest slot not held by a staying sprite.
    var used = {};
    desired.forEach(function (item) {
      var sp = kept[item.id];
      if (!sp) return;
      var slot;
      if (desired.length === 1) {
        slot = 0; // solo characters always stand left-of-center
      } else if (typeof sp._vnSlot === "number" && !used[sp._vnSlot]) {
        slot = sp._vnSlot; // unchanged cast: keep the established slot
      } else {
        slot = used[0] ? 1 : 0;
      }
      used[slot] = true;
      if (sp._vnSlot !== slot) {
        sp._vnSlot = slot;
        sp.setAttribute("data-slot", String(slot));
      }
    });

    var last = desired.length - 1;
    desired.forEach(function (item, i) {
      var sp = kept[item.id];
      if (!sp) return;
      layer.appendChild(sp); // re-append to enforce order without recreating
      sp.classList.toggle(SPRITE_POS[0], sp._vnSlot === 0);
      sp.classList.toggle(SPRITE_POS[1], sp._vnSlot === 1);
      sp.classList.toggle("vn-solo", desired.length === 1);
      sp.classList.toggle("vn-focus", i === last);
      sp.classList.toggle("vn-dim", i !== last);
    });
  }

  /* --------------------------------------------------------------- bg layer */

  // Syncs a background entry's trusted fx markup into .vn-bg-fx. Assigning
  // innerHTML replaces the previous content, restarting any CSS animations
  // authored inside the fx html; entries without html clear the layer.
  // bgId is passed through so the optional canvas scene layer (below) can
  // reconcile itself right after the wipe.
  function syncBgFx(bg, bgId) {
    if (!els || !els.bgFx) return;
    els.bgFx.innerHTML = typeof bg.html === "string" ? bg.html : "";
    syncProps(bg, bgId);
    updateCanvasScene(bgId);
  }

  // 3D prop sprites: scene declares props: [{ id, left, bottom, width }]
  // (percent strings). Images come from window.VN_PROPS (webp data-URIs);
  // layer sits inside .vn-bg so grade/dolly grade it together with the scene.
  function syncProps(bg, bgId) {
    if (!els || !els.propsLayer) return;
    els.propsLayer.textContent = "";
    var list = bg && Array.isArray(bg.props) ? bg.props : [];
    var store = typeof window !== "undefined" ? window.VN_PROPS : null;
    list.forEach(function (p) {
      if (
        !p ||
        typeof p.id !== "string" ||
        !store ||
        typeof store[p.id] !== "string"
      ) {
        if (p && typeof p.id === "string") {
          console.warn("[VN] unknown prop: " + p.id);
        }
        return;
      }
      var img = document.createElement("img");
      img.className = "vn-prop vn-prop-" + p.id;
      img.src = store[p.id];
      img.alt = "";
      img.style.left = typeof p.left === "string" ? p.left : "50%";
      img.style.bottom = typeof p.bottom === "string" ? p.bottom : "8%";
      img.style.width = typeof p.width === "string" ? p.width : "30vw";
      if (p.flip) img.style.transform = "scaleX(-1)";
      if (typeof p.opacity === "number") img.style.opacity = String(p.opacity);
      els.propsLayer.appendChild(img);
    });
  }

  function applyBg(bgId) {
    if (!bgId || bgId === state.bg) return; // bg persists when omitted / unchanged
    var bg = S.backgrounds && S.backgrounds[bgId];
    if (!bg || typeof bg.css !== "string") {
      console.warn("[VN] unknown background: " + bgId);
      return;
    }
    state.bg = bgId;
    clearTimeout(timers.bg);
    els.bg.classList.add("vn-fade");
    // Fade through black while the background swaps (styling in style.css).
    els.bg.classList.add("vn-fading");
    clearTimeout(timers.fading);
    timers.fading = setTimeout(function () {
      timers.fading = null;
      els.bg.classList.remove("vn-fading");
    }, BG_FADING_MS);
    timers.bg = setTimeout(function () {
      els.bg.style.background = bg.css;
      syncBgFx(bg, bgId);
      recordSeen(bgId); // gallery unlock: this scene has now been visited
      audioHook("scene", bgId); // bg now active: switch the ambient loop
      els.bg.classList.remove("vn-fade");
    }, BG_FADE_MS);
  }

  // Instant bg reconstruction used when loading a save (no fade).
  function restoreBg(bgId) {
    clearTimeout(timers.bg);
    els.bg.classList.remove("vn-fade");
    if (!bgId) return;
    var bg = S.backgrounds && S.backgrounds[bgId];
    if (!bg || typeof bg.css !== "string") {
      console.warn("[VN] unknown background in save: " + bgId);
      return;
    }
    state.bg = bgId;
    els.bg.style.background = bg.css;
    syncBgFx(bg, bgId); // re-apply the restored bg's fx html + canvas scene
    recordSeen(bgId);
    audioHook("scene", bgId); // restored bg now active: ambient loop follows
  }

  /* ------------------------------------------------------ canvas scenes */

  // Parallel-authored canvas scenes: window.VN_SCENES (a module loaded before
  // engine.js) maps background id -> { init(ctx, w, h), draw(ctx, w, h, t, dt) }
  // where t = seconds since activation and dt = seconds since the previous
  // frame; both callbacks are optional. While a bg with a scene entry is
  // active, a <canvas class="vn-bg-canvas"> is the last child of .vn-bg-fx
  // (painted above the fx html layer) and .vn-bg-fx carries .vn-has-canvas so
  // CSS can hide the html layer for scenes wanting full control.
  // Everything is defensive: a missing global, a non-object entry, missing
  // callbacks, a null 2d context or a throwing scene falls back silently to
  // the existing html/css behavior. This code never throws.
  var canvasScene = {
    active: false,
    id: null, // background id the scene was activated for
    scene: null, // the VN_SCENES entry
    canvas: null,
    ctx: null,
    raf: null, // pending requestAnimationFrame handle
    ro: null, // ResizeObserver (static frames only; loops check per frame)
    reduced: false, // prefers-reduced-motion: one static frame, no loop
    everFired: false, // has the frame loop run at least once
    fallback: null, // interval id driving frames when rAF never fires
    watchdog: null, // timer that decides whether the fallback is needed
    t: 0, // seconds since activation
    last: null, // previous frame timestamp (ms)
    w: 0, // css width the canvas was last sized to
    h: 0, // css height the canvas was last sized to
    dpr: 1,
    dprCap: 2, // adaptive ceiling: sustained slow frames drop it to 1
    slow: 0, // consecutive over-budget frames (adaptive-quality counter)
  };
  var canvasSceneWarned = {}; // scene ids that already logged a runtime error

  function prefersReducedMotion() {
    try {
      if (
        typeof window !== "undefined" &&
        typeof window.matchMedia === "function"
      ) {
        return !!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
    } catch (err) {
      /* media queries unavailable: assume motion is fine */
    }
    return false;
  }

  function nextFrame(cb) {
    if (typeof requestAnimationFrame === "function") {
      try {
        return requestAnimationFrame(cb);
      } catch (err) {
        return null;
      }
    }
    if (
      typeof window !== "undefined" &&
      typeof window.requestAnimationFrame === "function"
    ) {
      try {
        return window.requestAnimationFrame(cb);
      } catch (err) {
        return null;
      }
    }
    return null;
  }

  function cancelFrame(id) {
    if (id == null) return;
    if (typeof cancelAnimationFrame === "function") {
      try {
        cancelAnimationFrame(id);
      } catch (err) {
        /* ignore */
      }
      return;
    }
    if (
      typeof window !== "undefined" &&
      typeof window.cancelAnimationFrame === "function"
    ) {
      try {
        window.cancelAnimationFrame(id);
      } catch (err) {
        /* ignore */
      }
    }
  }

  function warnCanvasSceneOnce(id, what) {
    if (canvasSceneWarned[id]) return;
    canvasSceneWarned[id] = true;
    console.warn(
      "[VN] canvas scene " + what + " for bg " + id + " — using html layer",
    );
  }

  // Sizes the canvas to .vn-bg-fx's css box x devicePixelRatio (capped at 2).
  // Runs on activation and cheaply every frame; a no-op while nothing changed.
  // Re-init on resize is intentionally NOT done — only the buffer and the
  // context transform update.
  function sizeCanvasScene() {
    var cs = canvasScene;
    if (!cs.canvas || !cs.ctx || !els || !els.bgFx) return;
    var cssW = els.bgFx.clientWidth;
    var cssH = els.bgFx.clientHeight;
    if (
      typeof cssW !== "number" ||
      typeof cssH !== "number" ||
      !isFinite(cssW) ||
      !isFinite(cssH) ||
      cssW <= 0 ||
      cssH <= 0
    ) {
      return;
    }
    var dpr = 1;
    try {
      dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1;
    } catch (err) {
      dpr = 1;
    }
    if (typeof dpr !== "number" || !isFinite(dpr) || dpr <= 0) dpr = 1;
    if (dpr > cs.dprCap) dpr = cs.dprCap;
    if (cssW === cs.w && cssH === cs.h && dpr === cs.dpr) return;
    cs.w = cssW;
    cs.h = cssH;
    cs.dpr = dpr;
    try {
      // Assigning width/height resets the buffer and the transform, so the
      // scale is (re)applied right after — it never compounds across resizes.
      cs.canvas.width = Math.max(1, Math.round(cssW * dpr));
      cs.canvas.height = Math.max(1, Math.round(cssH * dpr));
      if (typeof cs.ctx.setTransform === "function") {
        cs.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      } else if (typeof cs.ctx.scale === "function") {
        cs.ctx.scale(dpr, dpr);
      }
    } catch (err) {
      /* sizing failed: keep whatever buffer exists */
    }
  }

  // One rendered frame: cheap resize check, clear, scene.draw. Returns false
  // when the scene failed and the engine fell back to the html/css layer.
  function drawCanvasFrame(t, dt) {
    var cs = canvasScene;
    if (
      !cs.active ||
      !cs.ctx ||
      !cs.scene ||
      typeof cs.scene.draw !== "function"
    ) {
      return false;
    }
    sizeCanvasScene();
    try {
      cs.ctx.clearRect(0, 0, cs.w, cs.h);
      cs.scene.draw(cs.ctx, cs.w, cs.h, t, dt);
      return true;
    } catch (err) {
      warnCanvasSceneOnce(cs.id, "draw failed");
      deactivateCanvasScene(); // silent fallback: canvas out, html layer back
      return false;
    }
  }

  function canvasSceneLoop(ts) {
    var cs = canvasScene;
    cs.raf = null;
    if (!cs.active || !cs.ctx) return;
    cs.everFired = true;
    var dt = 0;
    if (typeof ts === "number" && typeof cs.last === "number") {
      dt = (ts - cs.last) / 1000;
    }
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (typeof ts === "number") cs.last = ts;
    cs.t += dt;
    // adaptive quality: sustained slow frames drop the canvas DPR to 1
    // (once per scene activation; scenes re-render fine at any resolution)
    if (dt > 0.024 && cs.dpr > 1) {
      cs.slow += 1;
      if (cs.slow >= 50) {
        cs.dprCap = 1;
        cs.slow = 0;
        cs.dpr = 0; // force sizeCanvasScene to rebuild the buffer
      }
    } else if (cs.slow > 0) {
      cs.slow -= 1;
    }
    if (!drawCanvasFrame(cs.t, dt)) return; // scene failed: do not reschedule
    if (!cs.fallback) cs.raf = nextFrame(canvasSceneLoop);
  }

  // Static frames (reduced motion / no rAF) have no loop to check sizing, so
  // a ResizeObserver redraws the single frame when .vn-bg-fx actually changes
  // size. The observer's initial callback reports the already-applied size
  // and is ignored.
  function observeCanvasSceneResize() {
    var cs = canvasScene;
    if (cs.ro || typeof ResizeObserver !== "function" || !els || !els.bgFx) {
      return;
    }
    try {
      cs.ro = new ResizeObserver(function (entries) {
        var size =
          entries && entries.length && entries[0] && entries[0].contentRect
            ? entries[0].contentRect
            : null;
        if (!canvasScene.active || !size) return;
        if (
          Math.round(size.width) === canvasScene.w &&
          Math.round(size.height) === canvasScene.h
        ) {
          return;
        }
        sizeCanvasScene();
        if (canvasScene.reduced) drawCanvasFrame(1.5, 0);
      });
      cs.ro.observe(els.bgFx);
    } catch (err) {
      cs.ro = null;
    }
  }

  function activateCanvasScene(bgId, entry) {
    var canvas = document.createElement("canvas");
    var ctx = null;
    try {
      ctx = canvas.getContext("2d");
    } catch (err) {
      ctx = null;
    }
    if (!ctx) return; // no 2d context: silent html/css fallback, no canvas
    canvas.className = "vn-bg-canvas";
    canvas.style.position = "absolute";
    canvas.style.top = "0";
    canvas.style.left = "0";
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    canvas.style.pointerEvents = "none"; // purely visual: clicks pass through

    var cs = canvasScene;
    cs.active = true;
    cs.id = bgId;
    cs.scene = entry;
    cs.canvas = canvas;
    cs.ctx = ctx;
    cs.t = 0;
    cs.last = null;
    cs.raf = null;
    cs.reduced = prefersReducedMotion();
    els.bgFx.appendChild(canvas); // last child of .vn-bg-fx, above the html
    els.bgFx.classList.add("vn-has-canvas");
    sizeCanvasScene();

    // init runs once per activation, inside save/restore so a scene cannot
    // leak transform/clip state into anything else using the context.
    var initOk = true;
    try {
      ctx.save();
      if (typeof entry.init === "function") entry.init(ctx, cs.w, cs.h);
    } catch (err) {
      initOk = false;
    }
    try {
      ctx.restore();
    } catch (err) {
      /* restore cannot realistically fail after save() */
    }
    if (!initOk) {
      warnCanvasSceneOnce(bgId, "init failed");
      deactivateCanvasScene();
      return;
    }

    if (typeof entry.draw !== "function") return; // init-only scene: static
    if (cs.reduced) {
      drawCanvasFrame(1.5, 0); // exactly one static frame at t = 1.5, no loop
    } else {
      cs.everFired = false;
      cs.raf = nextFrame(canvasSceneLoop);
      if (cs.raf == null) drawCanvasFrame(0, 0); // no rAF: single frame
      // Watchdog: some embedded preview surfaces never fire rAF (the tab is
      // not composited). If the first frame hasn't run shortly after
      // activation, drive frames from a timer so scenes still animate.
      cs.watchdog = setTimeout(function () {
        cs.watchdog = null;
        if (cs.active && !cs.everFired && !cs.fallback) {
          cs.fallback = setInterval(function () {
            canvasSceneLoop(
              typeof performance === "object" && performance.now
                ? performance.now()
                : Date.now(),
            );
          }, 66);
        }
      }, 400);
    }
    if (cs.reduced || cs.raf == null) observeCanvasSceneResize();
  }

  function deactivateCanvasScene() {
    var cs = canvasScene;
    cancelFrame(cs.raf);
    if (cs.watchdog) {
      clearTimeout(cs.watchdog);
      cs.watchdog = null;
    }
    if (cs.fallback) {
      clearInterval(cs.fallback);
      cs.fallback = null;
    }
    if (cs.ro) {
      try {
        cs.ro.disconnect();
      } catch (err) {
        /* ignore */
      }
      cs.ro = null;
    }
    if (cs.canvas && cs.canvas.parentNode) {
      try {
        cs.canvas.parentNode.removeChild(cs.canvas);
      } catch (err) {
        /* ignore */
      }
    }
    if (els && els.bgFx) els.bgFx.classList.remove("vn-has-canvas");
    cs.active = false;
    cs.id = null;
    cs.scene = null;
    cs.canvas = null;
    cs.ctx = null;
    cs.raf = null;
    cs.reduced = false;
    cs.everFired = false;
    cs.t = 0;
    cs.last = null;
    cs.w = 0;
    cs.h = 0;
    cs.dpr = 1;
    cs.dprCap = 2; // each scene starts at full quality again
    cs.slow = 0;
  }

  // Reconciles the canvas layer with the bg whose html just synced into
  // .vn-bg-fx. Called after every syncBgFx: activates a scene for bg ids
  // present in window.VN_SCENES, deactivates for everything else. Loading a
  // save onto the SAME canvas bg re-attaches the existing canvas untouched
  // and keeps the running loop — only an actual id change restarts it.
  function updateCanvasScene(bgId) {
    if (!els || !els.bgFx) return;
    var scenes = typeof window !== "undefined" ? window.VN_SCENES : null;
    var entry =
      scenes && typeof scenes === "object" && typeof bgId === "string"
        ? scenes[bgId]
        : null;
    var valid = !!(entry && typeof entry === "object");

    if (canvasScene.active) {
      if (valid && canvasScene.id === bgId && canvasScene.canvas) {
        // Same scene still active: the innerHTML wipe detached our canvas —
        // re-attach it as-is (loop, t and bitmap stay untouched).
        if (canvasScene.canvas.parentNode !== els.bgFx) {
          els.bgFx.appendChild(canvasScene.canvas);
        }
        els.bgFx.classList.add("vn-has-canvas");
        return;
      }
      deactivateCanvasScene();
    }
    if (!valid) return;
    activateCanvasScene(bgId, entry);
  }

  /* --------------------------------------------------------------- line fx */

  var fxWarned = {}; // unknown fx values already warned about (warn once)

  // Applies a line's optional fx. Glitch lasts while the line displays
  // (cleared by clearGlitch); shake is a fixed-duration screen effect that
  // removes itself.
  function applyLineFx(line) {
    var fx = line ? line.fx : null;
    if (fx == null || fx === "") return;
    if (fx === "glitch") {
      els.text.classList.add("vn-glitch");
      return;
    }
    if (fx === "shake") {
      els.app.classList.add("vn-shake");
      clearTimeout(timers.shake);
      timers.shake = setTimeout(function () {
        timers.shake = null;
        if (els) els.app.classList.remove("vn-shake");
      }, SHAKE_MS);
      return;
    }
    if (fx === "grade") {
      // scene color grade: cools and deepens the whole frame while the
      // line displays (mood shift without a scene change); cleared on
      // advance like dolly/glitch
      els.app.classList.add("vn-grade");
      return;
    }
    if (fx === "dolly") {
      // emotional peak: push the camera in — the background scales up and
      // softens while the focus sprite leans closer; lasts while the line
      // displays and clears on advance (see clearLineFx). The paired swell
      // cue is self-throttled inside the audio module.
      els.app.classList.add("vn-dolly");
      audioHook("swell");
      return;
    }
    if (!fxWarned[fx]) {
      fxWarned[fx] = true;
      console.warn("[VN] unknown line fx: " + fx);
    }
  }
