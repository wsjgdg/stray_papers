<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>prop render harness</title>
<style>
  body { margin: 0; background: #202020; color: #ddd; font: 13px monospace; }
  #log { white-space: pre-wrap; padding: 8px; }
  img.out { display: block; width: 256px; border: 1px solid #555; margin: 4px; }
</style>
</head>
<body>
<div id="log">booting…</div>
<div id="out"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const out = document.getElementById('out');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(640, 640);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.display = 'none';

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function makeScene() {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  const key = new THREE.DirectionalLight(0xdfe8ff, 2.4);
  key.position.set(3, 5, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb4ff, 1.1);
  rim.position.set(-4, 2, -3);
  scene.add(rim);
  return scene;
}

function fitCamera(camera, box, dir) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.15;
  camera.position.copy(center).add(dir.clone().normalize().multiplyScalar(dist));
  camera.lookAt(center);
}

const M = {
  brass: new THREE.MeshStandardMaterial({ color: 0xc9a15a, metalness: 0.85, roughness: 0.35 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x2a2e38, metalness: 0.7, roughness: 0.45 }),
  tube: new THREE.MeshStandardMaterial({ color: 0x1d2733, metalness: 0.55, roughness: 0.4 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9fd8ff, metalness: 0.1, roughness: 0.05, emissive: 0x3d7ab8, emissiveIntensity: 0.8, transparent: true, opacity: 0.9 }),
  crtShell: new THREE.MeshStandardMaterial({ color: 0x3a3f4a, metalness: 0.3, roughness: 0.6 }),
  crtScreen: new THREE.MeshStandardMaterial({ color: 0x0a1420, emissive: 0x6fc3ff, emissiveIntensity: 1.6, roughness: 0.2 }),
  fabricRed: new THREE.MeshStandardMaterial({ color: 0x8a2f2f, metalness: 0.05, roughness: 0.85, side: THREE.DoubleSide }),
  wood: new THREE.MeshStandardMaterial({ color: 0x4a3220, metalness: 0.05, roughness: 0.7 }),
};

/* ---------- prop 1: refractor telescope ---------- */
function buildTelescope() {
  const g = new THREE.Group();
  const tubeProfile = [];
  for (let i = 0; i <= 8; i++) {
    const t = i / 8;
    tubeProfile.push(new THREE.Vector2(0.34 - t * 0.12, t * 3.2));
  }
  tubeProfile.push(new THREE.Vector2(0.2, 3.3));
  const mainTube = new THREE.Mesh(new THREE.LatheGeometry(tubeProfile, 28), M.tube);
  mainTube.rotation.z = Math.PI / 2 - 0.42;
  mainTube.position.y = 2.1;
  g.add(mainTube);
  const objective = new THREE.Mesh(new THREE.CylinderGeometry(0.345, 0.345, 0.06, 28), M.brass);
  objective.rotation.z = Math.PI / 2 - 0.42;
  objective.position.set(-1.42, 1.45, 0);
  g.add(objective);
  const finder = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.1, 16), M.brass);
  finder.rotation.z = Math.PI / 2 - 0.42;
  finder.position.set(0.35, 2.75, 0.3);
  g.add(finder);
  const eyepiece = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.42, 16), M.brass);
  eyepiece.rotation.z = Math.PI / 2 - 0.42;
  eyepiece.position.set(1.72, 2.72, 0);
  g.add(eyepiece);
  const cradle = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.5, 16), M.darkMetal);
  cradle.rotation.x = Math.PI / 2;
  cradle.position.y = 2.05;
  g.add(cradle);
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + 0.5;
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 3.6, 10), M.wood);
    leg.position.set(Math.cos(a) * 0.85, 1.62, Math.sin(a) * 0.85);
    leg.rotation.z = Math.cos(a) * 0.42;
    leg.rotation.x = -Math.sin(a) * 0.42;
    g.add(leg);
  }
  g.position.y = -1.9;
  return g;
}

/* ---------- prop 2: CRT terminal ---------- */
function buildCRT() {
  const g = new THREE.Group();
  const shellPts = [
    new THREE.Vector2(0.05, 0), new THREE.Vector2(1.5, 0), new THREE.Vector2(1.55, 0.12),
    new THREE.Vector2(1.55, 1.5), new THREE.Vector2(1.15, 1.85), new THREE.Vector2(0.35, 1.85), new THREE.Vector2(0.05, 1.7),
  ];
  const shell = new THREE.Mesh(new THREE.LatheGeometry(shellPts, 4).toNonIndexed(), M.crtShell);
  shell.rotation.y = Math.PI / 4;
  shell.scale.set(0.9, 1, 0.85);
  shell.position.y = -0.9;
  g.add(shell);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.28), M.crtScreen);
  screen.position.set(0, 0.28, 1.06);
  screen.rotation.x = -0.06;
  g.add(screen);
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.95, 1.52, 0.08), M.crtShell);
  bezel.position.set(0, 0.28, 1.0);
  g.add(bezel);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.16, 1.5), M.darkMetal);
  base.position.y = -0.98;
  g.add(base);
  const kb = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.14, 0.85), M.crtShell);
  kb.position.set(0.1, -1.12, 1.55);
  kb.rotation.x = 0.06;
  g.add(kb);
  const keyMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.55 });
  for (let r = 0; r < 3; r++)
    for (let k = 0; k < 12; k++) {
      const key = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.06, 0.13), keyMat);
      key.position.set(0.1 - 1.05 + k * 0.19, -1.02 - r * 0.001, 1.32 + r * 0.24);
      g.add(key);
    }
  const cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.6, -1.05, 0.6), new THREE.Vector3(1.1, -1.25, 0.3), new THREE.Vector3(1.0, -1.15, 1.3),
  ]), 20, 0.035, 8), M.darkMetal);
  g.add(cable);
  g.position.y = 0.9;
  return g;
}

/* ---------- prop 3: umbrella ---------- */
function buildUmbrella() {
  const g = new THREE.Group();
  const canopyProfile = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    canopyProfile.push(new THREE.Vector2(0.06 + Math.sin(t * Math.PI * 0.62) * 1.55, 1.15 - Math.pow(t, 1.35) * 0.62));
  }
  canopyProfile.push(new THREE.Vector2(0.02, 1.15));
  const canopy = new THREE.Mesh(new THREE.LatheGeometry(canopyProfile, 10), M.fabricRed);
  canopy.position.y = 1.2;
  g.add(canopy);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const rib = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.02, 2.35, 0),
      new THREE.Vector3(Math.cos(a) * 0.9, 1.85, Math.sin(a) * 0.9),
      new THREE.Vector3(Math.cos(a) * 1.56, 1.56, Math.sin(a) * 1.56),
    ]), 12, 0.018, 6), M.brass);
    g.add(rib);
  }
  const finial = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 0.24, 8), M.brass);
  finial.position.y = 2.42;
  g.add(finial);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 2.5, 10), M.darkMetal);
  shaft.position.y = 1.1;
  g.add(shaft);
  const handle = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.16, 0), new THREE.Vector3(0.02, -0.42, 0.02),
    new THREE.Vector3(0.26, -0.52, 0.05), new THREE.Vector3(0.42, -0.4, 0.05),
  ]), 16, 0.05, 10), M.wood);
  g.add(handle);
  g.position.y = -0.6;
  return g;
}

/* ---------- render all ---------- */
const PROPS = [
  { id: 'telescope', build: buildTelescope, dir: new THREE.Vector3(3.2, 1.6, 4.2) },
  { id: 'crt', build: buildCRT, dir: new THREE.Vector3(2.2, 1.2, 5.2) },
  { id: 'umbrella', build: buildUmbrella, dir: new THREE.Vector3(2.6, 1.4, 4.4) },
];

const results = {};
let idx = 0;
function renderNext() {
  if (idx >= PROPS.length) {
    log('ALL DONE');
    window.__PROPS_READY = JSON.stringify(results);
    return;
  }
  const p = PROPS[idx];
  try {
    const scene = makeScene();
    const group = p.build();
    scene.add(group);
    const box = new THREE.Box3().setFromObject(group);
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    fitCamera(camera, box, p.dir);
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/webp', 0.85);
    results[p.id] = url;
    const img = document.createElement('img');
    img.className = 'out';
    img.src = url;
    out.appendChild(img);
    log(p.id + ' rendered, ' + Math.round(url.length / 1024) + 'KB');
  } catch (e) {
    results[p.id] = 'ERR ' + e.message;
    log(p.id + ' ERR ' + e.message);
  }
  idx += 1;
  setTimeout(renderNext, 120);
}
log('renderer ready, rendering ' + PROPS.length + ' props…');
renderNext();
</script>
</body>
</html>
