name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Windows 安装包：仅在打 v* tag 时触发（手工发版流程）。
  # 复用 electron:build（tsc + vite 代码分割 + esbuild server + icon + nsis），
  # 产物上传为 artifact（Setup/blockmap/latest.yml），供后续发版步骤消费。
  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 缓存 electron-builder 下载的 NSIS / electron 等工具链，加速重复构建
      - name: Cache electron-builder toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: eb-cache-${{ runner.os }}
      - run: npm ci
      - name: Build Windows installer (NSIS)
        run: npm run electron:build
        env:
          CI: 'true'
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-workbench-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
