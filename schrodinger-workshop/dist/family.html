<body>

/* ===== src/core/styles.js ===== */
/* 组件样式：挂载时注入 <style id="qf-styles">（多实例只注入一次）。
   R43 修复：本字符串此前**以字面 `<style>` 开头**（自初版 9c397d0 起），
   注入用 textContent ⟹ CSS 解析器把 `<style>` 当 selector 前缀，紧接的
   `:root{…}` 被解析为「`<style> :root`」这一永不匹配的后代选择器的声明块
   ⟹ **:root 内所有 CSS 变量失效**（--txt/--dim/--mono/--panel 全空），
   于是全部 `color:var(--dim)` 等退化为浏览器默认（黑字 + Times New Roman），
   在深色半透明面板上几乎不可读——而 font-size/letter-spacing 等字面值声明
   仍生效，故长期未被察觉（旧注释「视觉零回归」的自评有误）。
   R43 CDP 实测（getComputedStyle 读 CSS 变量全为空 + h3 color=rgb(0,0,0)
   / fontFamily=Times New Roman）定位并删除该标签后，变量与字体恢复。 */
const CSS = `
  :root{
    --bg:#04060c; --panel:rgba(8,12,22,.74); --line:rgba(120,160,220,.14);
    --txt:#e6edf3; --dim:#9aa7bd; --cyan:#67e8f9; --mag:#f0abfc; --amber:#fbbf24;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
  /* ---------- 顶栏 ---------- */
  /* 布局与子元素规则已收编 core/responsive.js 的 .qtop 族；主页差异值保留： */
  .qtop[id="topbar"]{gap:14px;padding:10px 20px}
  .qtop[id="topbar"] .logo{font-size:15px}
  .qtop[id="topbar"] .eq{font-size:12.5px;letter-spacing:.02em}
  #status{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
  /* R72：双粒子构型空间页入口（与 status 同排，flex:none 防被 eq 压缩） */
  #topbar .navlink{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;flex:none;transition:all .15s;letter-spacing:.05em}
  #topbar .navlink:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  /* ---------- 左侧控制面板 ---------- */
  /* R43 修复①：原 max-height:calc(100vh−120px) ⟹ 面板底 = 100vh−44，而左下
     #desc（bottom:52px）顶部随预设描述长度变化（实测 82px 文本 ⟹ 顶 100vh−132；
     GP/Pauli 长文本 177px ⟹ 顶 100vh−229）⟹ 两者在左列重叠（最大 238×80 px）。
     修复：#desc 限高 120px + 内部滚动（高度可控），面板按最坏情况预留
     (76 顶距 + 120 desc + 52 底距 + 8 间隙 = 256) ⟹ 面板底 100vh−180 ≤ desc 顶
     100vh−172，四 viewport × 五内核实测无重叠。 */
  #panel{top:76px;left:14px;width:238px;padding:14px;z-index:10;max-height:calc(100vh - 256px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:2px}
  .sec{margin-bottom:14px}
  .sec:last-child{margin-bottom:0}
  .sec>h3{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  /* R60 势刷轴比三连同控（grid3 单元格内的迷你标签行：名称 + 实时值） */
  .mini{font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between;gap:4px;margin:3px 0 1px;white-space:nowrap}
  .mini b{color:var(--cyan);font-weight:600;font-family:var(--mono)}
  button{font-family:var(--sans);font-size:12px;color:var(--txt);background:rgba(255,255,255,.045);
    border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;transition:all .15s;text-align:center}
  button:hover{background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.4)}
  button.on{background:rgba(103,232,249,.16);border-color:var(--cyan);color:var(--cyan)}
  button.wide{width:100%}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{font-size:11px;color:var(--dim);width:64px;flex:none}
  .row output{font-family:var(--mono);font-size:11px;color:var(--cyan);width:44px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(120,160,220,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 8px rgba(103,232,249,.7);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--cyan);cursor:pointer}
  select{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;outline:none}
  /* ---------- 右侧 HUD ---------- */
  #hud{top:76px;right:14px;padding:12px 14px;z-index:10;min-width:196px;font-family:var(--mono)}
  #hud .hrow{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:3px 0}
  #hud .hrow span:first-child{color:var(--dim)}
  #hud .hrow span:last-child{color:var(--txt)}
  #hud .hrow .ok{color:#4ade80}#hud .hrow .warn{color:var(--amber)}
  #hud hr{border:none;border-top:1px solid var(--line);margin:7px 0}
  /* ---------- 相位图例 ---------- */
  #legend{right:14px;bottom:52px;padding:10px 12px;z-index:10;display:flex;align-items:center;gap:12px}
  #wheel{width:84px;height:84px;border-radius:50%;border:1px solid var(--line)}
  #legend .cap{font-size:10.5px;color:var(--dim);line-height:1.7;max-width:130px}
  #legend .cap b{color:var(--cyan);font-weight:600}
  /* ---------- 底部提示 ---------- */
  #hint{left:50%;bottom:14px;transform:translateX(-50%);padding:8px 18px;z-index:10;
    font-size:11.5px;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
  #hint b{color:var(--txt);font-weight:600}
  #hint .k{font-family:var(--mono);color:var(--cyan);background:rgba(103,232,249,.1);
    border:1px solid rgba(103,232,249,.25);border-radius:4px;padding:0 5px;font-size:10.5px}
  /* ---------- 预设描述 ---------- */
  /* R43 修复②：描述文本长度随内核/预设变化（实测 82–177px 高），高度不可控会
     顶进 #panel 区域 ⟹ 限高 120px + 内部滚动：既压住几何冲突，又保留全文
     （长描述可滚动查看）。 */
  #desc{left:14px;bottom:52px;z-index:10;padding:10px 14px;max-width:340px;font-size:11.5px;
    color:var(--dim);line-height:1.65;max-height:120px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #desc b{color:var(--amber);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
  /* ---------- toast ---------- */
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
    font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.2em;opacity:0;transition:opacity .4s;
    text-shadow:0 0 18px rgba(103,232,249,.8)}
  /* ---------- 笔刷光标预览环 ---------- */
  #brushcursor{position:fixed;border:1px solid rgba(140,190,255,.85);border-radius:50%;pointer-events:none;
    display:none;z-index:15;box-shadow:0 0 10px rgba(80,140,255,.35),inset 0 0 10px rgba(80,140,255,.18)}
  /* ---------- 准星瞄准线 ---------- */
  #aim{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;pointer-events:none;display:none}
  #aim line{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4;filter:drop-shadow(0 0 4px rgba(251,191,36,.8))}
  #aim circle{fill:none;stroke:var(--amber);stroke-width:1;opacity:.7}
  #aim text{fill:var(--amber);font-family:var(--mono);font-size:11px}
  /* ---------- 角标 ---------- */
  .corner{position:fixed;width:22px;height:22px;z-index:4;pointer-events:none;opacity:.5}
  .corner::before,.corner::after{content:"";position:absolute;background:var(--cyan)}
  .corner::before{width:100%;height:1px}.corner::after{width:1px;height:100%}
  #c1{top:8px;left:8px}.corner::before{top:0}#c1::after{left:0}
  #c2{top:8px;right:8px}#c2::before{top:0}#c2::after{right:0}
  #c3{bottom:8px;left:8px}#c3::before{bottom:0}#c3::after{left:0}
  #c4{bottom:8px;right:8px}#c4::before{bottom:0}#c4::after{right:0}
  #diag{position:fixed;left:-9999px}
  /* ---------- 透射率扫描面板 ---------- */
  .hint{font-size:10px;color:var(--dim);line-height:1.5;flex:1}
  /* ---------- hint 可折叠（R45，用户选定方案 a）----------
     运行时升级（app.js upgradeHints）：原 hint 文本搬进 .hintBody，
     前置 .hintToggle 按钮。默认折叠（长 hint 是面板溢出的元凶，R43
     实测 2D 697px / 3D 1673px / GP 980px）；展开态经 localStorage
     持久化（key = hint 文本摘要，跨内核/面板切换稳定）。 */
  .hintToggle{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--dim);font:inherit;font-size:10px;cursor:pointer;padding:0;margin:0;
    letter-spacing:.05em}
  .hintToggle:hover{color:var(--cyan)}
  .hintToggle:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .hint .hintBody{display:none}
  .hint.open .hintBody{display:block}
  .hint.open .hintToggle{color:var(--cyan);margin-bottom:3px}
  /* ---------- sec 级分区折叠（R48，README「后续方向」a2）----------
     与 hint 折叠（R45）同模式：h3 变切换头（class 驱动显隐），展开态经
     localStorage 持久化（qf.secs.state，key = sec id / h3 摘要）。
     默认折叠：四个扫描面板 sec——R45 实测（1440×900，overflow 口径
     scrollH−clientH）溢出大头正是区块结构：2D 687 / 3D 1403 / GP 813，
     canvas 硬高占其中 820px。与门控正交：syncControls 按内核切 sec 的
     style.display（整区显隐），本折叠切 sec 内部子元素，互不竞争。
     扫描开始（GenericScanner.start → app.expandSecFor）自动展开所在
     sec——用户点了「开始扫描」就应看到 canvas 与状态行。
     特异度注意：规则须带 #panel 前缀——四个扫描 canvas 的 display:block
     规则（ID 选择器 1,0,0）会压过裸 .sec.collapsed > *:not(h3)（0,1,1）
     ⟹ 折叠态 canvas 仍显示（cdp48 首轮实证）。 */
  #panel .sec.collapsed > *:not(h3){display:none}
  .sec > h3{cursor:pointer;user-select:none;-webkit-user-select:none}
  .sec > h3:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .sec > h3::before{content:"▾ ";color:var(--dim);font-weight:400}
  .sec.collapsed > h3::before{content:"▸ "}
  /* R48：range flex item 默认 min-width:auto（Chrome ~129px 固有最小宽）
     ⟹ label64+gap+range129+gap+output44 超出面板内容宽 236px ~31px，
     面板被迫横向滚动（R43 起既有缺陷，R45 溢出台账只记了纵向）。 */
  input[type=range]{min-width:0}
  /* R48 a3：扫描 canvas 统一 width:100%（修复 paramScanCanvas/scanCanvas3/
     slitScanCanvas 三个缺规则 ⟹ 420px attribute 宽在 210px 面板内容区横向
     溢出、面板被迫横向滚动——R45 溢出台账只记了纵向，此项本轮补录）；
     attribute 高 260/300 → 180（_plot 全部按 cv.width/height 自适应绘制，
     内部分辨率 420×180 不变、显示高 210×180/420=90px，展开态每块省 40–60px）。 */
  #scanCanvas,#paramScanCanvas,#scanCanvas3,#slitScanCanvas{width:100%;margin-top:6px;
    border:1px solid var(--line);border-radius:8px;background:rgba(4,8,16,.4);display:block}
  #scanStat{font-size:10px;color:var(--cyan);font-family:var(--mono);flex:1;line-height:1.45}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
  /* ---------- 面板双向收起（R56，「试验场全屏」）----------
     左列 #panel(上) + #desc(下)、右列 #hud(上) + #legend(下) 各为一组，
     整组 transform 滑出屏幕——#gl 本就 position:fixed 全屏，滑出即露全场，
     无需 resize/重绘（画布尺寸不变，只是不再被面板遮挡）。
     边缘拉手 .qf-tab 常驻（z-index 11 压面板 10，只压边框+padding 6px，
     不挡内容）；点击拉手或快捷键 [ / ] 切换；状态经 localStorage
     qf.panels.state = {left,right}（true=展开，缺省/坏值默认全展开）。
     滑出态 pointer-events:none ⟹ 画布交互全程不被残留命中区遮挡。 */
  #panel,#desc,#hud,#legend{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .24s}
  body.qf-hide-left #panel,body.qf-hide-left #desc{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  body.qf-hide-right #hud,body.qf-hide-right #legend{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  .qf-tab{position:fixed;top:50%;transform:translateY(-50%);z-index:11;width:20px;height:60px;
    padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:14px;line-height:1;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:0 10px 10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 4px 16px rgba(0,0,0,.4);transition:color .15s,border-color .15s}
  #tabL{left:0}
  #tabR{right:0;border-radius:10px 0 0 10px}
  .qf-tab:hover{color:var(--cyan);border-color:rgba(103,232,249,.45)}
  @media (max-width:1100px){#legend,#desc{display:none}}
`;

function injectStyles(){
  if (document.getElementById("qf-styles")) return;
  const st = document.createElement("style");
  st.id = "qf-styles";
  st.textContent = CSS;
  document.head.appendChild(st);
}

/* ===== src/core/responsive.js ===== */
/* ============================================================================
 * responsive.js — 全站响应式公共模块（R94 引入）
 *
 * 背景：R90 给 12 个子页各写了一式三份的顶栏渐进收缩（1500/1400/900 三档
 * 媒体查询只换 id 前缀，36 处重复）；小屏更只做到「≤900 隐导航」——导航全隐
 * 等于 12 页互链在窄桌窗/平板/手机上不可达，且左面板（~238px 固定）+ 右 HUD
 * （≥200px）在 390px 竖屏下必重叠。R94 收编 + 补齐：
 *   1. 顶栏三档（1500/1400/900）收归公共类 .qtop——12 页删除本地副本；
 *   2. ≤900 导航改汉堡抽屉：桌面 .qnav 用 display:contents 透明包裹（a 们
 *      仍是 .qtop 的 flex item，布局逐位不变），手机变全屏下拉网格；
 *   3. ≤860 手机段：面板/HUD 转底部全宽 sheet（内联样式覆盖各页 id 规则，
 *      退出时按 dataset.qfRestore 精确还原），stage 内联几何让位顶栏与 dock；
 *   4. 底部 dock 三态（控制/读数/全屏），matchMedia 跨越 860px 自动进出。
 *
 * 各页接入约定（一次性）：
 *   - 顶栏/面板/HUD/stage/hint 容器分别加类 qtop/qpanel/qhud/qstage/qhint；
 *   - mount() 里调用 injectResponsive()（幂等；无这些类的页面静默跳过）。
 * ========================================================================== */

const RESP_CSS = `
  /* ---- 顶栏基础（收编自 12 子页本地规则；.eq i 取主页口径 mag，
       amber 派的 5 页保留本地差异行） ---- */
  .qtop{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:16px;padding:9px 18px;z-index:10;white-space:nowrap}
  .qtop .logo{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.12em;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  .qtop .eq{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .qtop .eq b{color:var(--cyan);font-weight:600}
  .qtop .eq i{color:var(--mag);font-style:italic}
  .qtop a{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;transition:all .15s}
  .qtop a:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  .qtop a.cur{color:var(--mag);border-color:rgba(240,171,252,.45)}
  /* ---- 桌面：.qnav 透明包裹（a 们仍是 .qtop 的直接 flex item） ---- */
  .qnav{display:contents}
  .qburger{display:none}
  /* ---- 顶栏渐进收缩（收编自 R90 的 12 页本地副本，规则逐字保留） ---- */
  /* 特异性：.qtop.qtop（0,2,0）压各页差异行 .qtop[id="xxTop"]（0,2,0）靠
     本 style 后注入（同权重比源码序）；子元素 .qtop.qtop X（0,3,x）压
     .qtop[id="xxTop"] X（0,2,x）。 */
  @media (max-width:1500px){.qtop.qtop{gap:10px;padding:7px 14px}.qtop.qtop .logo{font-size:13px}
    .qtop.qtop a{font-size:10px;padding:2px 7px}}
  @media (max-width:1400px){.qtop.qtop .eq{display:none}.qtop.qtop{gap:8px}
    .qtop.qtop a{font-size:9.5px;padding:2px 6px}}
  /* ---- ≤900：导航收进汉堡抽屉（替代原「隐导航」） ---- */
  @media (max-width:900px){
    /* position:relative + z-index:11：burger 须压在抽屉（z:9）之上。二者同是
       .qtop  stacking context 的子元素，.qtop 的 z:10 只管对外层级——初版漏了
       这条，实测 elementFromPoint 命中 .qnav，真实手指点汉堡位置无效。
       尺寸 40×36：R95 实测 30×26 只过 WCAG 2.5.8 AA（24px），离 44px 舒适线

    .qburger{display:flex;align-items:center;justify-content:center;flex:none;
      position:relative;z-index:11;
      width:40px;height:36px;padding:0;font-size:17px;line-height:1}
    .qnav{display:none;position:fixed;top:0;left:0;right:0;z-index:9;
      grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:7px;
      padding:52px 12px 14px;max-height:100vh;max-height:100dvh;overflow-y:auto;
      background:rgba(4,6,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

    .qtop.open .qnav{display:grid}
    /* !important 收口：抽屉是覆盖层上下文，页面级顶栏规则不得泄漏进来——主页
       id 级 #topbar .navlink（styles.js，11px/3px 8px）与 1400 档 .qtop.qtop a
       （9.5px/2px 6px）特权都高于类选择器（id 赢 (0,3,1)），升维打不过；实测
       抽屉链接曾被压到 20px 高（< WCAG 2.5.8 AA 的 24px）。13×1.25+14×2

  }
  /* ---- ≤860 手机段：底部 dock 三态（控制/读数/全屏；dock 三态常驻，

       媒体状态变化自动生效，无需 JS 监听 orientationchange。

const $ = (s, r = document) => Array.from(r.querySelectorAll(s));
const MQ = '(max-width:860px)';
/* dvh 双声明：移动浏览器工具栏收放时 100vh 按大视口计算 ⟹ stage/sheet 带
   跳动（iOS 经典病）。旧浏览器忽略不认识的 dvh 行、保留 vh 行（CSS 错误
   处理即 fallback，无需 @supports）。dvh 支持：Safari 15.4+/Chrome 108+/
   Firefox 101+，低于本项目 README 地板 Safari 16.4。
   sheet 的 max-height 走 var(--qf-sm)（竖 46vh/横 64vh，见 ≤860 段注释）。 */
const SHEET_G = 'position:fixed;left:6px;right:6px;width:auto;top:auto;bottom:44px;max-height:var(--qf-sm,46vh);z-index:12';
const STAGE_G = 'position:fixed;left:6px;right:6px;width:auto;top:48px;transform:none';

function injectResponsive(){
  /* ---- 样式只注入一次（同步，不等 DOM） ---- */
  if (!document.getElementById('qf-resp')){
    const st = document.createElement('style');
    st.id = 'qf-resp';
    st.textContent = RESP_CSS;
    document.head.appendChild(st);
  }
  if (document.body.dataset.qfResp) return;
  document.body.dataset.qfResp = '1';

  /* ---- DOM 增强推迟到 microtask ----
     各页 mount() 的调用时序是 injectStyles() → injectResponsive() →
     构建 DOM（insertAdjacentHTML / container.innerHTML）——本函数若同步
     增强，.qtop 尚不存在（汉堡/抽屉无从包起），且 body.innerHTML 整体
     重写会把已 append 的 dock 清掉（index/two-body/hubbard 三页实测）。
     mount() 是同步函数 ⟹ microtask 必在其返回后执行：那时 DOM 已就绪，
     三种构建方式（insertAdjacentHTML / innerHTML / buildDOM）均安全。 */
  const enhance = () => {

  /* ---- 1. 顶栏增强：包 .qnav + 注入汉堡（幂等） ---- */
  $('.qtop').forEach(top => {
    if (top.querySelector('.qburger')) return;
    const nav = document.createElement('nav');
    nav.className = 'qnav';
    $('a', top).forEach(a => nav.appendChild(a));
    top.appendChild(nav);
    const b = document.createElement('button');
    b.className = 'qburger';
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', '打开导航');
    b.textContent = '☰';
    /* 开合状态同步 aria-expanded / aria-label（a11y：初版恒为「打开导航」） */
    const setOpen = open => {
      top.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
    };
    b.addEventListener('click', e => { e.stopPropagation(); setOpen(!top.classList.contains('open')); });
    top.insertBefore(b, top.firstChild);
    /* 抽屉内任意点击即收起：点链接本就导航，点 backdrop 现在也能取消
       （初版只认链接 ⟹ 打开后除了导航无法退出，实测确认的死胡同） */
    nav.addEventListener('click', () => setOpen(false));
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.qtop')) $('.qtop.open').forEach(t => t.classList.remove('open'));
  });
  /* Escape 收抽屉 + 焦点回汉堡（键盘用户路径；初版无 Escape） */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    $('.qtop.open').forEach(t => {
      t.classList.remove('open');
      const b = t.querySelector('.qburger');
      if (b){ b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', '打开导航'); b.focus(); }
    });
  });

  /* ---- 2. 底部 dock（三态常驻：默认 off = 舞台优先，dock 退让为半透明） ---- */
  const dock = document.createElement('div');
  dock.className = 'qf-dock';
  dock.innerHTML = '<button type="button" data-tab="controls">⚙ 控制</button>'
    + '<button type="button" data-tab="readout">◫ 读数</button>'
    + '<button type="button" data-tab="off">✕ 全屏</button>';
  document.body.appendChild(dock);
  const syncStage = () => {
    if (!document.documentElement.classList.contains('qf-mobile')) return;
    /* dock 三态常驻 ⟹ 舞台恒让出底部 44px dock 带（off 态不再压缩到 8px） */
    $('.qstage').forEach(el => {
      el.style.height = 'calc(100vh - 48px - 44px)';
      el.style.height = 'calc(100dvh - 48px - 44px)'; /* 旧浏览器忽略此行保留上一行 */
    });
  };
  dock.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.body.classList.remove('qf-m-controls', 'qf-m-readout', 'qf-m-off');
    document.body.classList.add('qf-m-' + b.dataset.tab);
    syncStage();
  });
  document.body.classList.add('qf-m-off');

  /* ---- 3. 手机段几何：内联覆盖各页 id 规则，退出精确还原 ---- */
  const mq = matchMedia(MQ);
  const apply = m => {
    document.documentElement.classList.toggle('qf-mobile', m);
    if (m){
      $('.qpanel,.qhud').forEach(el => {
        if (el.dataset.qfRestore != null) return;
        el.dataset.qfRestore = el.getAttribute('style') || '';
        el.style.cssText += ';' + SHEET_G;
      });
      $('.qstage').forEach(el => {
        if (el.dataset.qfRestore != null) return;
        el.dataset.qfRestore = el.getAttribute('style') || '';
        el.style.cssText += ';' + STAGE_G;
      });
    } else {
      $('.qpanel,.qhud,.qstage').forEach(el => {
        if (el.dataset.qfRestore == null) return;
        el.setAttribute('style', el.dataset.qfRestore);
        delete el.dataset.qfRestore;
      });
    }
    syncStage();
  };
  if (mq.addEventListener) mq.addEventListener('change', ev => apply(ev.matches));
  else if (mq.addListener) mq.addListener(ev => apply(ev.matches)); /* 旧 Safari */
  apply(mq.matches); /* 页面可能直接在手机宽度打开 */

  };
  queueMicrotask(enhance);
}

/* ============================================================================

/** 生成子页顶栏导航 HTML；cur = 当前页 href（打 cur 高亮，自链也在——与 flag/rounds/cycle 一致）。

/* ===== src/physics/qcircuit.js ===== */
/* ============================================================================
 * qcircuit.js — R75 小规模量子线路：态矢模拟器（纯 CPU，n ≤ 12）
 *
 * 约定（页面、测试、文档共用同一套，写错一处就会全盘错位）：
 *   ① 态矢 ψ = Σ_i a_i |i⟩，i ∈ [0, 2^n)；**指数的第 k 位 = 量子比特 k**
 *      （LSB 是 q0）。X 作用在 q_k 上就是翻转指数的第 k 位。
 *   ② 振幅存成两条 Float64Array（re/im），门是 2×2 复矩阵 {a,b,c,d}（各为 [re,im]）。
 *   ③ 受控门：控制位全 1 时才作用；CNOT 的 c=[control]、t=target。
 *   ④ 子系统 A = **低 k_A 位**（q0..q_{k_A−1}），环境 = 高位块；这样 reshape 成
 *      [2^{n−kA}][2^{kA}] 就是连续的，约化密度矩阵直接 Gram 求和。
 *   ⑤ 全局相位不可观测：涉及 Rz/Rx/Ry 的断言一律用保真度 |⟨φ|ψ⟩|² 或概率，
 *      不比振幅本身（相位约定不同不是 bug）。
 *
 * 复杂度：单门 O(2^n)；n=12 时 4096 振幅、单门 ~4096 次复乘（微秒级）。
 * ========================================================================== */

/* ---------- 复数小工具 ---------- */
const cx = (re, im) => ({ re, im });
const cadd = (x, y) => cx(x.re + y.re, x.im + y.im);
const cmul = (x, y) => cx(x.re * y.re - x.im * y.im, x.re * y.im + x.im * y.re);
const cabs2 = x => x.re * x.re + x.im * x.im;
const C0 = cx(0, 0), C1 = cx(1, 0), CI = cx(0, 1);

/* ---------- 门表 ---------- */
/* 每个门：{ name, arity, matrix? }；带参门由工厂生成 */
const S2 = Math.SQRT1_2;

const QC_UNARY = {
  h: { label: 'H', m: [cx(S2, 0), cx(S2, 0), cx(S2, 0), cx(-S2, 0)] },
  x: { label: 'X', m: [C0, C1, C1, C0] },
  y: { label: 'Y', m: [C0, cx(0, -1), cx(0, 1), C0] },
  z: { label: 'Z', m: [C1, C0, C0, cx(-1, 0)] },
  s: { label: 'S', m: [C1, C0, C0, CI] },
  sdg: { label: 'S†', m: [C1, C0, C0, cx(0, -1)] },
  t: { label: 'T', m: [C1, C0, C0, cx(Math.SQRT1_2, Math.SQRT1_2)] },
  tdg: { label: 'T†', m: [C1, C0, C0, cx(Math.SQRT1_2, -Math.SQRT1_2)] },
};

function qcRotation(op, theta){
  const c = Math.cos(theta / 2), s = Math.sin(theta / 2);
  if (op === 'rx') return [cx(c, 0), cx(0, -s), cx(0, -s), cx(c, 0)];
  if (op === 'ry') return [cx(c, 0), cx(-s, 0), cx(s, 0), cx(c, 0)];
  if (op === 'rz') return [cx(Math.cos(theta / 2), -Math.sin(theta / 2)), C0, C0,
                           cx(Math.cos(theta / 2), Math.sin(theta / 2))];
  throw new Error('unknown rotation ' + op);
}

/* ---------- 态 ---------- */
function qcNewState(n){
  const dim = 1 << n;
  const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
  s.re[0] = 1;
  return s;
}
/* 基态 |j⟩（qcNewState 默认给 |0⟩；测试与页面都需要任意基态，别手写 re[j]=1
   ——那会和已有的 re[0]=1 叠加成两个基态的相干和，是本轮踩过的坑）。 */
function qcBasis(n, j){
  const dim = 1 << n;
  const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
  s.re[j & (dim - 1)] = 1;
  return s;
}
function qcClone(s){
  return { n: s.n, dim: s.dim, re: Float64Array.from(s.re), im: Float64Array.from(s.im) };
}
function qcNorm(s){
  let a = 0;
  for (let i = 0; i < s.dim; i++) a += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return a;
}
function qcProbs(s){
  const p = new Float64Array(s.dim);
  for (let i = 0; i < s.dim; i++) p[i] = s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return p;
}
/* 归一化（测量后、数值漂移后） */
function qcRenormalize(s){
  const n2 = qcNorm(s);
  if (n2 <= 0) throw new Error('norm collapsed');
  const k = 1 / Math.sqrt(n2);
  for (let i = 0; i < s.dim; i++){ s.re[i] *= k; s.im[i] *= k; }
  return s;
}

/* ---------- 门作用 ---------- */
/* 单比特矩阵 m 作用在比特 q（就地） */
function applyMatrix(s, m, q){
  const bit = 1 << q;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    if (i & bit) continue;
    const j = i | bit;
    const a0r = re[i], a0i = im[i], a1r = re[j], a1i = im[j];
    /* m = [m00 m01; m10 m11]，逐项展开免临时对象 */
    re[i] = m[0].re * a0r - m[0].im * a0i + m[1].re * a1r - m[1].im * a1i;
    im[i] = m[0].re * a0i + m[0].im * a0r + m[1].re * a1i + m[1].im * a1r;
    re[j] = m[2].re * a0r - m[2].im * a0i + m[3].re * a1r - m[3].im * a1i;
    im[j] = m[2].re * a0i + m[2].im * a0r + m[3].re * a1i + m[3].im * a1r;
  }
}
function ctrlMask(controls){
  let m = 0;
  for (const c of controls || []) m |= 1 << c;
  return m;
}
/* 受控单比特门：控制位全 1 时才对 target 作用。就地实现：逐对扫描后仅处理
   满足控制条件的指数（不做子空间拷贝，n=12 也只有 4096 次判断） */
function applyControlled(s, m, q, controls){
  const mask = ctrlMask(controls);
  if (!mask){ applyMatrix(s, m, q); return; }
  const bit = 1 << q;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    if ((i & mask) !== mask) continue;
    if (i & bit) continue;
    const j = i | bit;
    const a0r = re[i], a0i = im[i], a1r = re[j], a1i = im[j];
    re[i] = m[0].re * a0r - m[0].im * a0i + m[1].re * a1r - m[1].im * a1i;
    im[i] = m[0].re * a0i + m[0].im * a0r + m[1].re * a1i + m[1].im * a1r;
    re[j] = m[2].re * a0r - m[2].im * a0i + m[3].re * a1r - m[3].im * a1i;
    im[j] = m[2].re * a0i + m[2].im * a0r + m[3].re * a1i + m[3].im * a1r;
  }
}
function applySwap(s, a, b){
  const ba = 1 << a, bb = 1 << b;
  if (a === b) return;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    const ia = (i & ba) ? 1 : 0, ib = (i & bb) ? 1 : 0;
    if (ia === ib) continue;
    if (ia === 0) continue;             /* 每对只处理一次（i 的 a 位为 0、b 位为 1） */
    const j = i ^ ba ^ bb;
    const tr = re[i], ti = im[i];
    re[i] = re[j]; im[i] = im[j];
    re[j] = tr; im[j] = ti;
  }
}

/* 展开成统一形式：{ op, q, c, theta } */
function qcApply(s, g){
  const op = g.op;
  if (op === 'cnot'){ applyControlled(s, QC_UNARY.x.m, g.t ?? g.q2, [g.c ?? g.q1]); return s; }
  if (op === 'cz'){ applyControlled(s, QC_UNARY.z.m, g.t ?? g.q2, [g.c ?? g.q1]); return s; }
  if (op === 'swap'){ applySwap(s, g.q1, g.q2); return s; }
  if (op === 'toffoli'){
    applyControlled(s, QC_UNARY.x.m, g.q3, [g.q1, g.q2]); return s;
  }
  if (op === 'rx' || op === 'ry' || op === 'rz'){
    const m = qcRotation(op, g.theta ?? 0);
    if (g.c != null) applyControlled(s, m, g.q, [g.c]);
    else applyMatrix(s, m, g.q);
    return s;
  }
  if (op === 'phase'){
    /* P(φ)=diag(1,e^{iφ})：受控 P 就是标准「受控相位门」diag(1,1,1,e^{iφ})。
       QFT 必须用它而不是受控 Rz——受控 Rz 差一个控制位上的 Rz(φ)，只对
       计算基输入无害，对叠加输入会错（这也是本轮设计时纠正的一处）。 */
    const th = g.theta ?? 0;
    const m = [C1, C0, C0, cx(Math.cos(th), Math.sin(th))];
    if (g.c != null) applyControlled(s, m, g.q, [g.c]);
    else applyMatrix(s, m, g.q);
    return s;
  }
  const u = QC_UNARY[op];
  if (!u) throw new Error('unknown gate ' + op);
  if (g.c != null) applyControlled(s, u.m, g.q, [g.c]);
  else applyMatrix(s, u.m, g.q);
  return s;
}
function qcApplyAll(s, gates){ for (const g of gates) qcApply(s, g); return s; }

/* 稠密矩阵（测试用，n ≤ 3）：把线路作用到每个基矢上拼成列 */
function qcProgramMatrix(n, gates){
  const dim = 1 << n;
  const M = [];
  for (let k = 0; k < dim; k++){
    const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
    s.re[k] = 1;
    qcApplyAll(s, gates);
    M.push(s);
  }
  return M;   /* M[k][j] = 第 k 列的第 j 行 = ⟨j|U|k⟩ */
}

/* ---------- 测量与统计 ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 按 |a|² 抽样一个指数 */
function qcSample(s, rng){
  const p = qcProbs(s);
  const u = rng();
  let acc = 0;
  for (let i = 0; i < s.dim; i++){
    acc += p[i];
    if (u < acc) return i;
  }
  return s.dim - 1;
}
/* 塌缩到指数 i（就地归一化，其余振幅归零） */
function qcCollapse(s, idx){
  for (let i = 0; i < s.dim; i++){ if (i !== idx){ s.re[i] = 0; s.im[i] = 0; } }
  qcRenormalize(s);
  return s;
}
/* 单比特边缘：p0 = P(该位=0) */
function qcMarginal(s, q){
  const bit = 1 << q;
  let p1 = 0;
  for (let i = 0; i < s.dim; i++) if (i & bit) p1 += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return { p0: 1 - p1, p1, z: 1 - 2 * p1 };
}
/* 两体 ZZ 关联 ⟨Z_a Z_b⟩（实；Z 对角） */
function qcZZ(s, a, b){
  const ba = 1 << a, bb = 1 << b;
  let v = 0;
  for (let i = 0; i < s.dim; i++){
    const sa = (i & ba) ? -1 : 1, sb = (i & bb) ? -1 : 1;
    v += sa * sb * (s.re[i] * s.re[i] + s.im[i] * s.im[i]);
  }
  return v;
}
function qcPauliCorr(s, a, pa, b, pb){
  const t = qcClone(s);
  const applyTo = (st, q, p) => {
    if (p === 'x') applyMatrix(st, QC_UNARY.x.m, q);
    else if (p === 'y') applyMatrix(st, QC_UNARY.y.m, q);
    else if (p === 'z'){
      const bit = 1 << q;
      for (let i = 0; i < st.dim; i++) if (i & bit){ st.re[i] = -st.re[i]; st.im[i] = -st.im[i]; }
    }
  };
  /* 先作用在 |ψ⟩ 上得到 P_b|ψ⟩，再与 P_a|ψ⟩ 内积 */
  applyTo(t, b, pb);
  const u = qcClone(s);
  applyTo(u, a, pa);
  let re = 0, im = 0;
  for (let i = 0; i < s.dim; i++){
    re += u.re[i] * t.re[i] + u.im[i] * t.im[i];
    im += u.im[i] * t.re[i] - u.re[i] * t.im[i];
  }
  /* ⟨u|t⟩ 应为实数（对易/反对易都给实数） */
  return re;
}

/* ---------- 任意 Pauli 期望 ⟨P⟩（P 由 x/z 两个比特掩码给出，支持 Y） ----------
   判定用：R81 起「从末态反推」的容错判定、R86 起 qec.js/shor.js 的门噪声
   结局判定都靠它（稳定子期望 + 逻辑期望），故收为此处共享单源
   （原为 flagsynd.js 私有的 fsExpect，R86 提取）。
   算法：P|i⟩ = i^{n_Y}·(−1)^{popcount(z & i)}·|i ⊕ x⟩（各比特独立作用、无次序
   问题），⟨P⟩ = Σ_i ψ_i* · (Pψ)_i；n_Y = popcount(x&z) mod 4 决定整体相位。 */
function qcExpect(s, xm, zm){
  const { re, im, dim } = s;
  let ar = 0, ai = 0;
  for (let i = 0; i < dim; i++){
    const r0 = re[i], i0 = im[i];
    if (r0 === 0 && i0 === 0) continue;
    const j = i ^ xm;
    let c = 0, v = zm & i;
    while (v){ c ^= v & 1; v >>= 1; }
    const sg = c ? -1 : 1;
    const br = re[j] * sg, bi = im[j] * sg;
    ar += r0 * br + i0 * bi;
    ai += r0 * bi - i0 * br;
  }
  let xy = xm & zm, nY = 0;
  while (xy){ nY += xy & 1; xy >>= 1; }
  nY &= 3;
  if (nY === 0) return ar;
  if (nY === 1) return -ai;
  if (nY === 2) return -ar;
  return ai;
}

/* ---------- Pauli 帧（辛表示）：只跟踪错误、忽略相位 ----------
   R86 起 qec.js 的门噪声判定与 flagsynd.js 的容错提取共用（与 qcExpect 同一
   「共享单源」原则：原为 flagsynd.js 私有的 frToggle/frGate）。帧 = {x,z} 两个
   比特掩码（x 位 = 该比特上有 X/Y 分量，z 位 = Z/Y 分量），描述「相对理想线路
   的残差 Pauli」，不含全局相位。
   传播规则（与 qcApply 的门集合一致）：
     CNOT(c,t)：X_c → X_c X_t（前向）；Z_t → Z_c Z_t（后向）；X_t、Z_c 不动。
     H(q)：X_q ↔ Z_q。测量：帧的 X_q 翻转 Z 读数（重置才清帧，本工程线路每个
     ancilla 只用一次，无需重置）。
     x/y/z 门：就地 toggle。ry/rz/rx/phase 在非零帧上出现即抛错（非 Clifford，
     帧语义未定义——flagsynd 与 qec 的制备段都保证帧为零时才过旋转门）。 */
function qcFrToggle(fr, q, t){
  const b = 1 << q;
  if (t === 'x' || t === 'y') fr.x ^= b;
  if (t === 'z' || t === 'y') fr.z ^= b;
}
function qcFrGate(fr, o){
  const op = o.op;
  if (op === 'cnot'){
    const c = o.c ?? o.q1, t = o.t ?? o.q2;
    if ((fr.x >> c) & 1) fr.x ^= 1 << t;
    if ((fr.z >> t) & 1) fr.z ^= 1 << c;
    return;
  }
  if (op === 'h'){
    const b = 1 << o.q, xb = (fr.x & b) ? 1 : 0, zb = (fr.z & b) ? 1 : 0;
    if (zb) fr.x |= b; else fr.x &= ~b;
    if (xb) fr.z |= b; else fr.z &= ~b;
    return;
  }
  if (op === 'x' || op === 'y' || op === 'z'){ qcFrToggle(fr, o.q, op); return; }
  if (op === 'ry' || op === 'rz' || op === 'rx' || op === 'phase'){
    if (fr.x || fr.z) throw new Error('frame: 非 Clifford 门在非零帧上出现 ' + op);
  }
}

/* ---------- 纠缠 ---------- */
/* 约化密度矩阵 ρ_A（A = 低 kA 位）的特征值：Gram 矩阵 ρ[i][j]=Σ_e ψ(i,e)ψ*(j,e)，
   用实嵌入 [[Re,−Im],[Im,Re]] 的 Jacobi（本征值各二重，排序后隔一取、不折半，
   与 R73 熵的修法同一坑）。 */
function jacobiReal(A, m, sweeps = 60){
  const V = [];
  for (let i = 0; i < m; i++){ V.push(new Float64Array(m)); V[i][i] = 1; }
  for (let sw = 0; sw < sweeps; sw++){
    let off = 0;
    for (let p = 0; p < m; p++) for (let q = p + 1; q < m; q++) off += A[p][q] * A[p][q];
    if (off < 1e-30) break;
    for (let p = 0; p < m; p++){
      for (let q = p + 1; q < m; q++){
        const apq = A[p][q];
        if (Math.abs(apq) < 1e-18) continue;
        const theta = (A[q][q] - A[p][p]) / (2 * apq);
        const t = Math.sign(theta || 1) / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
        const c = 1 / Math.sqrt(t * t + 1), sn = t * c;
        for (let k = 0; k < m; k++){
          const akp = A[k][p], akq = A[k][q];
          A[k][p] = c * akp - sn * akq;
          A[k][q] = sn * akp + c * akq;
        }
        for (let k = 0; k < m; k++){
          const apk = A[p][k], aqk = A[q][k];
          A[p][k] = c * apk - sn * aqk;
          A[q][k] = sn * apk + c * aqk;
        }
        for (let k = 0; k < m; k++){
          const vkp = V[k][p], vkq = V[k][q];
          V[k][p] = c * vkp - sn * vkq;
          V[k][q] = sn * vkp + c * vkq;
        }
      }
    }
  }
  const val = [];
  for (let i = 0; i < m; i++) val.push(A[i][i]);
  return { val, vec: V };
}

function qcReducedRho(s, kA){
  const mA = 1 << kA, rest = s.dim / mA;
  const A = [];
  for (let i = 0; i < 2 * mA; i++) A.push(new Float64Array(2 * mA));
  for (let i = 0; i < mA; i++){
    for (let j = 0; j < mA; j++){
      let rr = 0, ii = 0;
      for (let e = 0; e < rest; e++){
        const p = e * mA + i, q = e * mA + j;
        rr += s.re[p] * s.re[q] + s.im[p] * s.im[q];
        ii += s.re[p] * s.im[q] - s.im[p] * s.re[q];
      }
      /* ρ = [[rr, -ii],[ii, rr]] 的实嵌入块 */
      A[i][j] += rr;
      A[i][mA + j] += -ii;
      A[mA + i][j] += ii;
      A[mA + i][mA + j] += rr;
    }
  }
  /* i,j 与 j,i 的实部对称性由上面求和自动满足（ρ 厄米） */
  return A;
}

function qcEntropy(s, kA){
  const mA = 1 << kA, m = 2 * mA;
  const A = qcReducedRho(s, kA);
  const { val } = jacobiReal(A, m, 80);
  const sorted = val.slice().sort((a, b) => b - a);
  const lam = [];
  for (let i = 0; i < m; i += 2){          /* 实嵌入本征值各二重 ⟹ 隔一取 */
    const v = Math.max(0, sorted[i]);
    if (v > 1e-14) lam.push(v);
  }
  const sum = lam.reduce((a, b) => a + b, 0);
  let S = 0;
  for (const v of lam) if (v > 1e-14) S -= v * Math.log(v);
  /* λ=1 的纯态在 float64 里会算出 −0（Σ 干净时 −1·log1 = −0），钳到 0 */
  if (S < 0 && S > -1e-12) S = 0;
  return { S, spectrum: lam, sum, kA, dimA: mA };
}

/* 两比特 concurrence（n=2，A 取 q0）：C = 2|a00 a11 − a01 a10| */
function qcConcurrence(s){
  if (s.n !== 2) return NaN;
  const [a00r, a00i] = [s.re[0], s.im[0]];
  const [a01r, a01i] = [s.re[1], s.im[1]];
  const [a10r, a10i] = [s.re[2], s.im[2]];
  const [a11r, a11i] = [s.re[3], s.im[3]];
  const dr = a00r * a11r - a00i * a11i - (a01r * a10r - a01i * a10i);
  const di = a00r * a11i + a00i * a11r - (a01r * a10i + a01i * a10r);
  return 2 * Math.hypot(dr, di);
}

/* 保真度 |⟨φ|ψ⟩|² */
function qcFidelity(s, t){
  if (s.dim !== t.dim) return NaN;
  let re = 0, im = 0;
  for (let i = 0; i < s.dim; i++){
    re += s.re[i] * t.re[i] + s.im[i] * t.im[i];
    im += s.re[i] * t.im[i] - s.im[i] * t.re[i];
  }
  const d = qcNorm(s) * qcNorm(t);
  return d > 0 ? (re * re + im * im) / d : 0;
}

/* 振幅信息（页面/测试用）：指数、|a|、相位 */
function qcAmplitudes(s){
  const out = [];
  for (let i = 0; i < s.dim; i++){
    const p = s.re[i] * s.re[i] + s.im[i] * s.im[i];
    if (p < 1e-14) continue;
    out.push({ i, re: s.re[i], im: s.im[i], abs: Math.sqrt(p), phase: Math.atan2(s.im[i], s.re[i]) });
  }
  return out;
}
/* 把指数写成 |q_{n-1}…q_0⟩ 的比特串（显示用：最左 = 最高位） */
function qcBits(idx, n){
  let s = '';
  for (let k = n - 1; k >= 0; k--) s += ((idx >> k) & 1) ? '1' : '0';
  return s;
}

/* QFT 线路（n 比特）。**次序是实测定的**（穷举 n=2 的八种变体，只有这一族给出
   2.7e-16 的 DFT 符合）：
     从最高位 j=n−1 往下：H(q_j)，再由每个更低位 q_k（k<j）控制一个
     相位门 φ=π/2^{j−k}，最后把比特顺序整体反转（SWAP 对）。
   为什么不是「从低位往上」：那种写法里相位落在还没做过 H 的高位上，控制位此刻
   还是计算基态，相位永远不起作用——n=2 的输出只剩 ±1/√N 的实数符号（本轮踩过）。
   受控相位门 diag(1,1,1,e^{iφ}) 对控制/目标对称，所以 q_j 与 q_k 的角色互换等价。 */
function qcQftGates(n, inverse = false){
  const g = [];
  for (let j = n - 1; j >= 0; j--){
    g.push({ op: 'h', q: j });
    for (let k = j - 1; k >= 0; k--){
      g.push({ op: 'phase', q: j, c: k, theta: Math.PI / (1 << (j - k)) });
    }
  }
  for (let i = 0; i < (n >> 1); i++) g.push({ op: 'swap', q1: i, q2: n - 1 - i });
  return inverse ? qcInvertGates(g) : g;
}

/* 通用逆线路：逆序 + 每个门取逆（h/x/y/z/swap/cnot/cz/toffoli 自逆；s↔sdg、
   t↔tdg；带参门 θ→−θ）。pot75 用它验证 U†U=I。 */
function qcInvertGates(gates){
  const dual = { s: 'sdg', sdg: 's', t: 'tdg', tdg: 't' };
  return gates.slice().reverse().map(g => {
    if (g.op === 'phase' || g.op === 'rx' || g.op === 'ry' || g.op === 'rz')
      return { ...g, theta: -(g.theta ?? 0) };
    return { ...g, op: dual[g.op] || g.op };
  });
}

function qcPresetGates(name, n){
  if (name === 'qft') return qcQftGates(n ?? 4);
  const p = QC_PRESETS[name];
  if (!p) return [];
  if (name === 'ghz' && n && n !== p.n){
    const g = [{ op: 'h', q: 0 }];
    for (let k = 1; k < n; k++) g.push({ op: 'cnot', c: 0, q2: k });
    return g;
  }
  return p.gates.map(x => ({ ...x }));
}

/* ============================================================================
 * 经典寄存器与「测量-前馈」（R76）
 *
 * R75 的线路是纯酉的：门依次作用，末尾才允许测量。真实的协议（传态、纠错、
 * 迭代相位估计）需要**中途测量 + 用结果控制后面的门**。这里补上两件事：
 *   ① qcMeasureQubit：只测一个比特（投影到该位的 0/1 子空间 + 归一化），
 *      不是把整个态塌到一个基态——传态里测 q0/q1 之后 q2 的叠加必须留着；
 *   ② qcExec：把 {op:'measure'}、{op:'cond'} 与普通门统一成「一步」。
 * ========================================================================== */

function qcNewClassical(nbits){ return new Uint8Array(nbits); }

/* 单比特 Z 基测量：返回 0/1，就地把态投影到对应子空间并归一化 */
function qcMeasureQubit(s, q, rng){
  const bit = 1 << q;
  let p1 = 0;
  for (let i = 0; i < s.dim; i++) if (i & bit) p1 += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  const out = rng() < p1 ? 1 : 0;
  for (let i = 0; i < s.dim; i++){
    const has = (i & bit) ? 1 : 0;
    if (has !== out){ s.re[i] = 0; s.im[i] = 0; }
  }
  qcRenormalize(s);
  return out;
}

/* 执行一步：普通门 / 测量写入经典位 / 条件门 */
function qcExec(s, op, cres, rng){
  if (op.op === 'measure'){
    const bit = qcMeasureQubit(s, op.q, rng);
    if (cres && op.cbit != null) cres[op.cbit] = bit;
    return { kind: 'measure', q: op.q, cbit: op.cbit, bit };
  }
  if (op.op === 'cond'){
    const on = cres ? !!cres[op.cbit] : false;
    if (on) qcApply(s, op.gate);
    return { kind: 'cond', cbit: op.cbit, on };
  }
  qcApply(s, op);
  return { kind: 'gate' };
}

/* 跑一整段（含测量/条件），返回每步的记录 */
function qcRunProgram(s, ops, rng, cres = qcNewClassical(8)){
  const rec = [];
  for (const op of ops) rec.push(qcExec(s, op, cres, rng));
  return { cres, rec };
}

/* 任意比特的约化密度矩阵（2×2，复）：ρ[a][b] = Σ_rest ψ(a,rest) ψ*(b,rest) */
function qcQubitRho(s, q){
  const bit = 1 << q;
  const rr = [[0, 0], [0, 0]], ii = [[0, 0], [0, 0]];
  for (let i = 0; i < s.dim; i++){
    if (i & bit) continue;
    const j = i | bit;
    /* |0⟩⟨0| / |1⟩⟨1| 对角 */
    rr[0][0] += s.re[i] * s.re[i] + s.im[i] * s.im[i];
    rr[1][1] += s.re[j] * s.re[j] + s.im[j] * s.im[j];
    /* 非对角：ψ0 ψ1* = (r0+ii0)(r1−ii1) */
    rr[0][1] += s.re[i] * s.re[j] + s.im[i] * s.im[j];
    ii[0][1] += s.im[i] * s.re[j] - s.re[i] * s.im[j];
  }
  rr[1][0] = rr[0][1];
  ii[1][0] = -ii[0][1];
  return { re: rr, im: ii };
}

/* 纯态 |ψ⟩=α|0⟩+β|1⟩ 与 ρ 的保真度 ⟨ψ|ρ|ψ⟩（α,β 为 [re,im]） */
function qcRhoFidelity(rho, alpha, beta){
  const a = alpha, b = beta;
  const ac = [a[0], -a[1]], bc = [b[0], -b[1]];
  const mul = (x, y) => [x[0]*y[0] - x[1]*y[1], x[0]*y[1] + x[1]*y[0]];
  const add = (x, y) => [x[0]+y[0], x[1]+y[1]];
  /* v = ρ|ψ⟩: v_a = Σ_b ρ_ab ψ_b */
  let v0 = add(mul([rho.re[0][0], rho.im[0][0]], b), [0, 0]);
  v0 = add([0, 0], mul([rho.re[0][0], rho.im[0][0]], b));
  v0 = add(v0, mul([rho.re[0][1], rho.im[0][1]], [0, 0]));
  /* 上面写复杂了，直接逐项算 */
  v0 = add(mul([rho.re[0][0], rho.im[0][0]], a), mul([rho.re[0][1], rho.im[0][1]], b));
  const v1 = add(mul([rho.re[1][0], rho.im[1][0]], a), mul([rho.re[1][1], rho.im[1][1]], b));
  const val = add(mul(ac, v0), mul(bc, v1));
  return val[0];
}

/* 单比特态制备：Ry(θ) 再 Rz(φ) ⟹ cos(θ/2)|0⟩ + e^{iφ} sin(θ/2)|1⟩ */
function qcPrep1q(theta, phi, q = 0){
  return [{ op: 'ry', q, theta }, { op: 'rz', q, theta: phi }];
}

/* |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩ 的振幅（测试/显示用） */
function qcTargetAmps(theta, phi){
  return { alpha: [Math.cos(theta / 2), 0], beta: [Math.sin(theta / 2) * Math.cos(phi), Math.sin(theta / 2) * Math.sin(phi)] };
}

/* 传态线路：q0 载待传态，q1/q2 为 Bell 对，Bell 测量后按 m0→Z、m1→X 修正 q2。
   经典位：cbit 0 = m0（q0 的 H 之后测量），cbit 1 = m1（q1 测量）。 */
function qcTeleportGates(theta = 1.0, phi = 0.4, withFix = true){
  const g = [];
  /* ① 制备待传态到 q0 */
  g.push(...qcPrep1q(theta, phi, 0));
  /* ② Bell 对 (q1,q2) */
  g.push({ op: 'h', q: 1 }, { op: 'cnot', c: 1, q2: 2 });
  /* ③ Bell 测量 */
  g.push({ op: 'cnot', c: 0, q2: 1 }, { op: 'h', q: 0 });
  g.push({ op: 'measure', q: 0, cbit: 0 });
  g.push({ op: 'measure', q: 1, cbit: 1 });
  /* ④ 经典前馈 */
  if (withFix){
    g.push({ op: 'cond', cbit: 1, gate: { op: 'x', q: 2 } });
    g.push({ op: 'cond', cbit: 0, gate: { op: 'z', q: 2 } });
  }
  return g;
}

/* ===== src/physics/codefamily.js ===== */
/* ============================================================================
 * codefamily.js — R85 码族与真阈值：重复码族 × Steane 级联族
 *
 * 这一页要立住的两件事：
 *   ① **真阈值存在**：重复码（仅 X 噪声）的阈值是经典 1/2（闭式可验）；
 *      Steane 级联 L1 ~ O(p²)、L2 ~ O(p⁴)——每级联一层指数压低，
 *      L1/L2 曲线在 p* 交叉就是「码族越大阈值现象越锐」的直接证据。
 *   ② **单次解码有地板**：综合征测量一旦带噪（同 p），最后一次读数的噪声
 *      无法被后续轮次确认 ⟹ 残差综合征 ≠ 0（outside 类）频率 ≈ 1−(1−p)^m，
 *      与码距 d 无关 ⟹ 所有族的曲线被同一条 O(p) 地板压平，**没有阈值**。
 *      这就是 R82/R83「多轮 + 连续一致解码」存在的原因：只有多轮才能把
 *      测量噪声平掉。本页把测量噪声做成开关（默认关），两边曲线同屏对照。
 *
 * 判定口径（与 flagsynd / shor.js 完全一致）：
 *   残差 = 真实错误 ⊕ 解码器修正；失败 ⟺ 残差 ∉ S（稳定子群）。
 *     - perfect：残差 ∈ S（纠回）
 *     - logic ：残差 ∈ N(S)\S（辛乘积为零但不在 S ⟹ 静默逻辑错误）
 *     - outside：残差 ∉ N(S)（综合征非零——测量噪声的主产地）
 *
 * 实现要点：
 *   - 纯 Pauli 帧演算（x/z 两个 0/1 数组，不用态矢）——码族扫描要跑 10⁴ 点次。
 *   - 解码器：重复码 = 相邻差综合征的最小权重解（O(d) DP，两个候选取轻）；
 *     Steane = Hamming[7,4] 综合征查表（3 位 → 唯一权重 ≤1 解，列即全部
 *     非零 3 位向量）。级联解码：先逐块内层 Hamming 解码，块级逻辑错误
 *     （奇偶位）作为外层的 7 位错误向量，再外层 Hamming 解码。
 *   - 精确引擎（画曲线用，MC 在小 p 处没有分辨率）：级联结构可分解——
 *     每层只需子块的 2×2 联合表 Q2(C/L × C/L)（outside 由边际闭式给出），
 *     层间递归 Q2_{k} = pn0²·Σ_{4^7} Π qℓ·[xclass][zclass]，顶层
 *     P(clean) = pn0²·Σ_{4^7} Π Q2·[xc=0][zc=0]。16384 项/层，与 p 无关的
 *     预计算 + O(p) 每点。pot85 用 MC 与穷举双重对账。
 *   - ⚠ 帧面对调陷阱（首版在此处错过，已修）：每帧的综合征取自 **自己**
 *     的逻辑指示向量——X 帧综合征 = H·ℓx（Z 型校验测 X 帧），Z 帧对称
 *     取 H·ℓz（X 型校验测 Z 帧）。辛积 ⟨R, X_L⟩ = r_z·1⁷ 只说「残差
 *     与逻辑 X 的反对易由 Z 帧奇偶决定」——那是逻辑失败判据，不是综合
 *     征来源，不可混用。pot85 以 4^7 穷举 + MC 双重对账逐位验。
 * ========================================================================== */

/* ---------- Steane [[7,1,3]] 的 H（Hamming[7,4] 校验矩阵，3×7）---------- *
 * 列 = 全部 7 个非零 3 位向量：c0=100 c1=010 c2=001 c3=110 c4=101 c5=011 c6=111
 * 行（7 位掩码，bit j = 第 j 列的第 i 位）：
 *   row0 = (1,0,0,1,1,0,1) = 0b1011001 = 89
 *   row1 = (0,1,0,1,0,1,1) = 0b1101010 = 106
 *   row2 = (0,0,1,0,1,1,1) = 0b1110100 = 116
 * 性质（pot85 逐条验）：H·Hᵀ = 0；行空间 = [7,3,4] 单纯形（权重 0/4）；
 *   ker(H) = 行空间 ∪ (1⁷+行空间)（权重 3 的 Fano 线 × 7 + 1⁷）；
 *   X̄_L = Z̄_L = 1⁷（全 1，H·1⁷ = 0 且 ∉ 行空间）。                        */
const STEANE_H = [0b1011001, 0b1101010, 0b1110100];
const STEANE_N = 7;

const popcnt = v => { let c = 0; while (v){ c ^= v & 1; v >>= 1; } return c; };
const hdot = v => (popcnt(v & STEANE_H[0])) | (popcnt(v & STEANE_H[1]) << 1) | (popcnt(v & STEANE_H[2]) << 2);
/* 列 j 的 3 位综合征值 */
const H_COL = Array.from({ length: 7 }, (_, j) =>
  ((STEANE_H[0] >> j) & 1) | (((STEANE_H[1] >> j) & 1) << 1) | (((STEANE_H[2] >> j) & 1) << 2));
/* 综合征 → 修正掩码：0 → 0；非零 → 唯一权重 1 列（Hamming 解码器） */
const HC_TABLE = (() => {
  const t = new Array(8).fill(0);
  for (let j = 0; j < 7; j++) t[H_COL[j]] = 1 << j;
  return t;
})();
function hammingCorrect(syn3){ return HC_TABLE[syn3 & 7]; }
function steaneSyn(v){ return hdot(v); }
/** ker(H) 中「逻辑陪集」判据：综合征 0 且奇偶 1 ⟺ ∈ 1⁷+行空间（Fano 线或 1⁷） */
function isLogicalCoset(v){ return hdot(v) === 0 && (popcnt(v) & 1) === 1; }

/* ---------- 族定义 ---------- */
const CF_FAMILIES = [
  { k: 'rep3', kind: 'rep', d: 3, name: '重复码 d=3', sym: '⌗3' },
  { k: 'rep5', kind: 'rep', d: 5, name: '重复码 d=5', sym: '⌗5' },
  { k: 'rep7', kind: 'rep', d: 7, name: '重复码 d=7', sym: '⌗7' },
  { k: 'rep9', kind: 'rep', d: 9, name: '重复码 d=9', sym: '⌗9' },
  { k: 'st1', kind: 'steane', level: 1, name: 'Steane [[7,1,3]]', sym: '⊗7' },
  { k: 'st2', kind: 'steane', level: 2, name: 'Steane² [[49,1,9]]', sym: '⊗49' },
];
/** L3 = 343 比特：模块级导出（pot85 验证标度），页面不上面板——p=10⁻³ 处
 *  P_L ~ 10⁷·p⁸ ≈ 10⁻¹⁷，任何可行 MC 样本量都测不到（0 事件），画出来只能是噪声。 */
const CF_FAMILY_ST3 = { k: 'st3', kind: 'steane', level: 3, name: 'Steane³ [[343,1,27]]', sym: '⊗343' };
const CF_ALL = [...CF_FAMILIES, CF_FAMILY_ST3];

const CF_DEFAULTS = {
  family: 'st1',
  noise: 'x',        /* 'x' 仅 X（bit-flip 信道）· 'depol' 退极化 X/Y/Z 各 p/3 */
  meas: 0,           /* 0 综合征测量无噪 · 1 每位以 p 翻转（单次解码 ⟹ 地板） */
  p: 0.02,
  trials: 4000,
  seed: 7,
};
const CF_NOISES = [
  { k: 'x', name: '仅 X', desc: '每比特以 p 注入 X（bit-flip 信道，R78 同口径）' },
  { k: 'depol', name: '退极化', desc: '每比特 X/Y/Z 各 p/3——重复码挡不住 Z 类穿透' },
];

/** 族的比特数 / 码距 / 综合征位数（测量地板用）。fam 接受族对象或 'rep3'/'st1' 字符串 key */
function cfNQ(fam){ const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam; return f.kind === 'rep' ? f.d : Math.pow(7, f.level); }
function cfDistance(fam){ const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam; return f.kind === 'rep' ? f.d : Math.pow(3, f.level); }
function cfSynBits(fam){ const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam; return f.kind === 'rep' ? f.d - 1 : Math.pow(7, f.level) - 1; }

/* ============================================================================
 * 精确引擎（无 MC 误差；meas 开关两态都精确）
 * ========================================================================== */

/* ---- 重复码 ---- */
/* X -only + 无测量噪声：多数表决失败 ⟺ 翻转权重 > d/2（d 奇）——闭式 */
function repPLexactX(p, d){
  let PL = 0;
  for (let w = (d + 1) / 2; w <= d; w++) PL += binom(d, w) * Math.pow(p, w) * Math.pow(1 - p, d - w);
  return PL;
}
function binom(n, k){
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}
/* 退极化：枚举 4^d 个 (x,z) 帧对，按受影响比特数 nAff=|x∨z| 与结局分桶
 * （一次性，缓存）。概率权重 = (1−p)^{d−nAff}·(p/3)^{nAff}——Y 错只算一个
 * 受影响比特（曾按 wx+wz 分桶：既与权重公式错配，又越界崩溃）。 */
const REP_TAB = new Map();
function repTable(d){
  if (REP_TAB.has(d)) return REP_TAB.get(d);
  /* counts[nAff][fate]：fate 0=perfect 1=logicX 2=logicZ */
  const counts = Array.from({ length: d + 1 }, () => [0, 0, 0]);
  const rec = (q, x, z, na) => {
    if (q === d){
      /* X 帧：相邻差综合征的最小权重解（DP）。综合征 = diff(x) = [x[i]^x[i+1]]，
       *   e0 递推 e0[i+1] = e0[i] ^ (x[i]^x[i+1])（y[0]=0 的解），另一解为其补 1^d⊕e0。
       * ⚠ 曾误写 e0[i+1] = e0[i] ^ x[i]——那是解 diff(e)=x（前缀异或），残差永远
       *   构不出 1^d，depol 的 X 帧逻辑项整段丢失（P_L 只剩 P(pz)；p=0.2/d=3 处
       *   低估 8%）。pot85 E1 独立穷举对质抓出；MC 路径 repTrial 一向用正确的
       *   x[i]^x[i+1]，两路径口径以此对齐。 */
      const e0 = new Array(d).fill(0);
      for (let i = 0; i < d - 1; i++) e0[i + 1] = e0[i] ^ (x[i] ^ x[i + 1]);
      let w0 = 0; for (const b of e0) w0 += b;
      const w1 = d - w0;
      const corr = w0 <= w1 ? e0 : e0.map(v => 1 - v);
      const rx = x.map((b, i) => b ^ corr[i]);
      const allOne = rx.every(b => b === 1);
      let pz = 0; for (const b of z) pz ^= b;
      const fate = allOne ? 1 : (pz ? 2 : 0);   /* Z 帧无校验 ⟹ 奇偶即逻辑 */
      counts[na][fate]++;
      return;
    }
    rec(q + 1, [...x, 0], [...z, 0], na);
    rec(q + 1, [...x, 1], [...z, 0], na + 1);
    rec(q + 1, [...x, 1], [...z, 1], na + 1);
    rec(q + 1, [...x, 0], [...z, 1], na + 1);
  };
  rec(0, [], [], 0);
  REP_TAB.set(d, counts);
  return counts;
}
/* 退极化 + 无测量噪声的精确 P_L（数据部分；测量噪声由外层闭式叠加） */
function repPLexactDepol(p, d){
  const counts = repTable(d);
  let PL = 0;
  for (let w = 0; w <= d; w++){
    const bad = counts[w][1] + counts[w][2];
    if (!bad) continue;
    PL += bad * Math.pow(1 - p, d - w) * Math.pow(p / 3, w);
  }
  return PL;
}

/* ---- Steane 级联：2×2 块递归 ---- */
const C = 0, L = 1;   /* 子块帧类：clean / logical（outside 走边际闭式） */

/* 层间一步：由子块 2×2 联合表 Q2（C/L × C/L，未归一）算本层 2×2 表。
 *   Q2_k(a,b) = qBothOK⁷·pn0²·Σ_{(u,v)∈4⁷} Π_j qℓ(u_j,v_j)·[xc(u)=a]·[zc(v)=b]
 * 其中 qBothOK = Σ Q2_{k-1}（子块两帧都未 outside 的联合概率），
 *   qℓ = Q2_{k-1}/qBothOK（条件分布）；qBothOK⁷ 不可省——Q2 必须是真实
 *   联合概率，否则层数一高就差 (qBothOK⁷)^level。
 *   xc(u) = parity(u ⊕ hammingCorrect(H·u))（X 帧自身综合征解码后的残差奇偶），
 *   pn0 = 两帧综合征测量都无噪的概率（meas 关：1；开：(1−p)³，3 位各以 p 翻）。 */
function stepQ2(Q2, pn0){
  const tot = Q2[C][C] + Q2[C][L] + Q2[L][C] + Q2[L][L];
  const q = [
    [Q2[C][C] / tot, Q2[C][L] / tot],
    [Q2[L][C] / tot, Q2[L][L] / tot],
  ];
  /* 预计算 128 个 7 位模式的类别：xc(u) = parity(u ⊕ hc(H·u))（X 帧自身综合征） */
  const xc = new Array(128), zc = new Array(128);
  for (let m = 0; m < 128; m++){
    const corr = hammingCorrect(hdot(m));
    xc[m] = popcnt(m ^ corr) & 1;
    zc[m] = xc[m];   /* H 对称，两类同函数（depol 下 q 不同而已） */
  }
  /* Π_j q(u_j,v_j) 对 4^7 个 (u,v) 组合求和，按 (xc(u), zc(v)) 分桶 */
  const J = [[0, 0], [0, 0]];
  for (let u = 0; u < 128; u++){
    for (let v = 0; v < 128; v++){
      let pr = 1;
      for (let j = 0; j < 7; j++) pr *= q[(u >> j) & 1][(v >> j) & 1];
      J[xc[u]][zc[v]] += pr;
    }
  }
  /* q 是条件分布（除掉 qBothOK=tot）；真实联合概率乘回 tot⁷，再乘测量无噪 pn0² */
  const s = Math.pow(tot, 7) * pn0 * pn0;
  return [
    [J[C][C] * s, J[C][L] * s],
    [J[L][C] * s, J[L][L] * s],
  ];
}
/* 顶层：子块联合表 Q2 → logic = Σ_{u,v∈2⁷} Π_j Q2(u_j,v_j)·[xc(u)∨zc(v)]
 * （子块全未 outside 且外层残差奇偶为奇的概率，不含顶层测量因子——由调用方乘 pn0²）。
 * 128×128 按位求积（与 stepQ2 同构，权重用 Q2 而非 q）。 */
function topLogic(Q2){
  const xc = new Array(128), zc = new Array(128);
  for (let m = 0; m < 128; m++){
    const corr = hammingCorrect(hdot(m));
    xc[m] = popcnt(m ^ corr) & 1;
    zc[m] = xc[m];
  }
  let logic = 0;
  for (let u = 0; u < 128; u++){
    for (let v = 0; v < 128; v++){
      if (!xc[u] && !zc[v]) continue;
      let pr = 1;
      for (let j = 0; j < 7; j++) pr *= Q2[(u >> j) & 1][(v >> j) & 1];
      logic += pr;
    }
  }
  return logic;
}
/** Steane 级联 level 层的精确 P_L(p)（noise: 'x' 仅 X / 'depol' 退极化；meas 开/关都精确）。
 *  P_L = P(任一处 outside) + P(全链一致但残差奇偶为奇)
 *      = [1−(1−p)^{7^level−1}] + (1−p)^6·logic   （meas 开：全链共 7^level−1 个综合征位）
 *      = logic                                    （meas 关：综合征全精确，outside 恒 0）
 *  ⚠ outside 项必须走闭式 + expm1：若写成 1−pn0²·tot⁷，meas 关时 tot=1±1e-16，
 *  相消噪声 ~1e-16 会淹没小 p 的 logic（st3 在 p=10⁻⁴ 处 ~10⁻²⁴），曾让 PL 变负、
 *  cfLeadingPower 出 NaN。logic 本身正项直加，无此问题。 */
function steaneExactPL(p, level, meas = 0, noise = 'depol'){
  const pn0 = meas ? Math.pow(1 - p, 3) : 1;
  /* level 0 子块 = 物理量子：(x,z) 四类，never outside。x-only 时 Z 帧恒 C */
  let Q2 = noise === 'x'
    ? [[1 - p, 0], [p, 0]]
    : [[1 - p, p / 3], [p / 3, p / 3]];
  for (let k = 1; k < level; k++) Q2 = stepQ2(Q2, pn0);
  const logic = topLogic(Q2);
  const outside = meas ? -Math.expm1((Math.pow(7, level) - 1) * Math.log1p(-p)) : 0;
  return outside + pn0 * pn0 * logic;
}

/* ============================================================================
 * 统一入口：单点精确 P_L / 扫描 / 交叉点
 * ========================================================================== */
function cfExactPL(p, fam, noise = 'x', meas = 0){
  const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam;
  if (!f) return NaN;
  if (f.kind === 'rep'){
    const data = noise === 'x' ? repPLexactX(p, f.d) : repPLexactDepol(p, f.d);
    /* 测量噪声：任一位综合征被翻 ⟹ outside（与码距无关的 O(p) 地板） */
    const pm = meas ? 1 - Math.pow(1 - p, f.d - 1) : 0;
    return pm + (1 - pm) * data;
  }
  return steaneExactPL(p, f.level, meas, noise);
}
/** 测量地板：至少一位综合征被翻转的概率（P_L 的下界，与码距无关的 O(p) 项） */
function cfFloor(p, fam, meas = 0){
  if (!meas) return 0;
  const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam;
  const m = f.kind === 'rep' ? f.d - 1 : Math.pow(7, f.level) - 1;
  return 1 - Math.pow(1 - p, m);
}

const CF_PS = [0.001, 0.002, 0.005, 0.01, 0.02, 0.03, 0.05, 0.08, 0.12, 0.18, 0.25, 0.35, 0.5];

/** 扫描（页面曲线）：全族精确 P_L(p) + 未编码基线 + 阈值标注 */
function cfSweep(cfg = {}){
  const c = { ...CF_DEFAULTS, ...cfg };
  const ps = c.ps || CF_PS;
  const out = { p: ps.slice(), noise: c.noise, meas: c.meas, fams: {}, floor: {}, uncoded: ps.slice() };
  for (const f of CF_FAMILIES){
    out.fams[f.k] = ps.map(p => cfExactPL(p, f, c.noise, c.meas));
    out.floor[f.k] = ps.map(p => cfFloor(p, f, c.meas));
  }
  /* 交叉点：L1 vs L2（真阈值的证据：两族曲线相交）。
   * ⚠ 必须「粗网格找首个变号 + 区间内 bisect」而不能直接对端点 bisect——
   * x-only 时 p=1/2 是每族 P_L 的平凡不动点（该点 P_L 恒 1/2），直接
   * bisect(1e-5, 0.5) 会撞上 d(0.5)=0 返回端点 0.5，完全错过真交叉
   * （x-only 全阶真值 0.0646，不是领先幂次的 1/21=0.0476——(1−p) 因子
   * 把交叉点推高了；depol 真值 0.0909）。pot85 用自带网格实现逐位对账。 */
  const f1 = p => cfExactPL(p, 'st1', c.noise, c.meas);
  const f2 = p => cfExactPL(p, 'st2', c.noise, c.meas);
  out.cross12 = firstCross(f1, f2, 1e-5, 0.5);
  /* 伪阈值：各族 vs 未编码基线 p。x-only 时 rep 族恰在 1/2（经典阈值），
   * Steane 两族同点（该点 st1=st2≈p）；depol 时 rep 族恰在 3/4——p=3/4 的
   * 退极化信道是 X/Z 两帧独立公平翻转（每位 x,z 各 1/2 独立），于是
   * P(X 帧多数失败)=1/2、P(Z 帧奇偶)=1/2、独立 ⟹ P_L=3/4，与 d/层级无关
   * 的精确不动点（pot85 E4 逐族断言）。搜索上界必须覆盖 3/4（曾取 0.6，
   * 会把该根漏报成 null）。meas 开时 O(p) 地板恒大于 p ⟹ 网格内无变号
   * ⟹ null（页面如实显示「无伪阈值」）。 */
  out.pseudo = {};
  for (const f of CF_FAMILIES){
    const g = p => cfExactPL(p, f, c.noise, c.meas) - p;
    out.pseudo[f.k] = firstCross(g, x => 0, 1e-7, 0.9);
  }
  return out;
}
/** 首个交叉点：粗网格（CROSS_GRID 点）找第一处变号，再在括号区间内 bisect 细化。
 *  区间内无变号（含 meas 开时的地板情景）⟹ null——调用方须如实处理 null。 */
const CROSS_GRID = 512;
function firstCross(f, g, lo, hi){
  const d = x => f(x) - g(x);
  let a = lo, da = d(a);
  if (da === 0) return a;
  for (let i = 1; i <= CROSS_GRID; i++){
    const b = lo + (hi - lo) * i / CROSS_GRID;
    const db = d(b);
    if (db === 0) return b;
    if ((da > 0) !== (db > 0)){
      let xa = a, xb = b;
      for (let k = 0; k < 60; k++){
        const m = (xa + xb) / 2;
        if ((d(m) > 0) === (da > 0)) xa = m; else xb = m;
      }
      return (xa + xb) / 2;
    }
    a = b; da = db;
  }
  return null;
}

/* ============================================================================
 * 蒙特卡洛（页面当前点 + pot85 对账精确引擎）
 * ========================================================================== */
/** 单次试验：返回 { fate, weight, xw, zw }。fate ∈ perfect/logic/outside */
function cfTrial(fam, cfg = {}, rng){
  const c = { ...CF_DEFAULTS, ...cfg };
  const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam;
  const r = rng || mulberry32(c.seed);
  if (f.kind === 'rep') return repTrial(f.d, c, r);
  return steaneTrial(f.level, c, r);
}

function sampleErr(c, r){
  const u = r();
  if (c.noise === 'x') return u < c.p ? [1, 0] : [0, 0];
  if (u < c.p / 3) return [1, 0];
  if (u < 2 * c.p / 3) return [1, 1];
  if (u < c.p) return [0, 1];
  return [0, 0];
}
function noiseBit(c, r){ return c.meas && r() < c.p ? 1 : 0; }

function repTrial(d, c, r){
  const x = [], z = [];
  for (let i = 0; i < d; i++){ const e = sampleErr(c, r); x.push(e[0]); z.push(e[1]); }
  /* X 帧：相邻差综合征（Z 校验 ZiZi+1 测 X），每位可被测量噪声翻转 */
  const syn = [];
  for (let i = 0; i < d - 1; i++) syn.push((x[i] ^ x[i + 1]) ^ noiseBit(c, r));
  /* 最小权重解：两个候选（差分为 syn 的向量 = e0 与 e0+1^d）取轻 */
  const e0 = new Array(d).fill(0);
  for (let i = 0; i < d - 1; i++) e0[i + 1] = e0[i] ^ syn[i];
  let w0 = 0; for (const b of e0) w0 += b;
  const corr = w0 * 2 <= d ? e0 : e0.map(v => 1 - v);
  const rx = x.map((b, i) => b ^ corr[i]);
  /* 残差综合征 = 测量噪声（修正精确消去真实综合征）⟹ outside ⟺ 残差综合征 ≠ 0。
   * ⚠ 勿与 diff(x) 比：diff(rx)=0 恒成立（解码器精确匹配所测综合征），
   * 与 diff(x) 比等于「真实综合征非零即 outside」——单错都会被误判。 */
  let out = false;
  for (let i = 0; i < d - 1; i++) if (rx[i] ^ rx[i + 1]) out = true;
  let pz = 0; for (const b of z) pz ^= b;
  const allOne = rx.every(b => b === 1);
  let fate = 'perfect';
  if (out) fate = 'outside';
  else if (allOne || (c.noise !== 'x' && pz)) fate = 'logic';
  return { fate, xw: x.reduce((a, b) => a + b, 0), zw: z.reduce((a, b) => a + b, 0) };
}

/* Steane 级联 MC：递归解码。块结局 cx/cz ∈ C/L/O（clean/logical/outside） */
function steaneTrial(level, c, r){
  const n = Math.pow(7, level);
  const x = new Array(n), z = new Array(n);
  for (let i = 0; i < n; i++){ const e = sampleErr(c, r); x[i] = e[0]; z[i] = e[1]; }
  const out = decodeBlock(level, x, z, 0, c, r);
  return { fate: out.cx === 'O' || out.cz === 'O' ? 'outside' : (out.cx === 'L' || out.cz === 'L' ? 'logic' : 'perfect'),
    xw: x.reduce((a, b) => a + b, 0), zw: z.reduce((a, b) => a + b, 0) };
}
function decodeBlock(level, x, z, off, c, r){
  if (level === 0){
    const cx = x[off] ? 'L' : 'C', cz = z[off] ? 'L' : 'C';
    return { cx, cz };
  }
  const cn = Math.pow(7, level - 1);
  const lx = new Array(7).fill(0), lz = new Array(7).fill(0);
  let outX = false, outZ = false;
  for (let j = 0; j < 7; j++){
    const ch = decodeBlock(level - 1, x, z, off + j * cn, c, r);
    if (ch.cx === 'O') outX = true; else lx[j] = ch.cx === 'L' ? 1 : 0;
    if (ch.cz === 'O') outZ = true; else lz[j] = ch.cz === 'L' ? 1 : 0;
  }
  /* 外层 X 侧：综合征 = H·ℓx（Z 型校验测 X 帧——本帧自己的向量），噪声 3 位 */
  let sx = 0;
  for (let i = 0; i < 3; i++){ let b = 0; for (let j = 0; j < 7; j++) b ^= lx[j] & ((STEANE_H[i] >> j) & 1); sx |= (b ^ noiseBit(c, r)) << i; }
  const cxOut = sx !== hdotL(lx);
  const corrX = hammingCorrect(sx);
  let parX = 0; for (let j = 0; j < 7; j++) parX ^= (lx[j] ^ ((corrX >> j) & 1));
  /* 外层 Z 侧：综合征 = H·ℓz（X 型校验测 Z 帧） */
  let sz = 0;
  for (let i = 0; i < 3; i++){ let b = 0; for (let j = 0; j < 7; j++) b ^= lz[j] & ((STEANE_H[i] >> j) & 1); sz |= (b ^ noiseBit(c, r)) << i; }
  const czOut = sz !== hdotL(lz);
  const corrZ = hammingCorrect(sz);
  let parZ = 0; for (let j = 0; j < 7; j++) parZ ^= (lz[j] ^ ((corrZ >> j) & 1));
  return {
    cx: outX || cxOut ? 'O' : (parX ? 'L' : 'C'),
    cz: outZ || czOut ? 'O' : (parZ ? 'L' : 'C'),
  };
}
function hdotL(v7){
  let s = 0;
  for (let i = 0; i < 3; i++){ let b = 0; for (let j = 0; j < 7; j++) b ^= v7[j] & ((STEANE_H[i] >> j) & 1); s |= b << i; }
  return s;
}

function cfEnsemble(fam, cfg = {}){
  const c = { ...CF_DEFAULTS, ...cfg };
  const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam;
  const rng = mulberry32(c.seed);
  const n = Math.max(1, c.trials | 0);
  const byFate = { perfect: 0, logic: 0, outside: 0 };
  let wsum = 0;
  for (let k = 0; k < n; k++){
    const t = cfTrial(f, c, rng);
    byFate[t.fate]++;
    wsum += t.xw + t.zw;
  }
  return {
    family: f.k, p: c.p, noise: c.noise, meas: c.meas, trials: n,
    PL: (byFate.logic + byFate.outside) / n,
    byFate, meanFaults: wsum / n,
    exact: cfExactPL(c.p, f, c.noise, c.meas),
  };
}

/* ============================================================================
 * 结构自检（pot85 用）：Steane 上全部 C(7,2) 个权重 2 X 错误必失败
 * （Hamming 解码把双错修成单错，残差是 Fano 线 ⟹ 逻辑）——「距离 3 的码
 *   双错必漏」的代数真相，也是 L1 ~ O(p²) 系数的来源。                      */
function steaneWeight2Check(){
  let fail = 0, tot = 0;
  for (let a = 0; a < 7; a++) for (let b = a + 1; b < 7; b++){
    tot++;
    const x = (1 << a) | (1 << b);
    const corr = hammingCorrect(hdot(x));
    if (isLogicalCoset(x ^ corr)) fail++;
  }
  return { tot, fail };
}
/** 级联标度（小 p 极限，pot85 对照）：
 *   x-only  L1 ≈ 21p²（C(7,2) 个权重 2 全失败）；L2 ≈ C(7,2)·(21p²)² = 9261p⁴。
 *   depol   L1 ≈ 2·C(7,2)·(2p/3)² − C(7,2)·(p/3)² = 49p²/3 —— 并集要扣掉
 *     「同两个 Y 同时打穿两帧」的交集项（首版手推 56p²/3 就是漏了它）；
 *           L2 ≈ 2·C(7,2)·(28p²/3)² − 21·(7p²/3)² ≈ 3544p⁴。
 *   幂次由引擎对数差分给出（rep depol ≈ 1：Z 帧无校验穿透，无阈值）。 */
function cfLeadingPower(fam, noise = 'depol', meas = 0){
  const f = typeof fam === 'string' ? CF_ALL.find(x => x.k === fam) : fam;
  const p = 1e-4;
  const a = cfExactPL(p, f, noise, meas), b = cfExactPL(p / 2, f, noise, meas);
  return { PL: a, power: Math.log2(a / b) };
}

/* ============================================================================
 * family.js（页面）— R85 码族与真阈值：重复码族 × Steane 级联族
 *
 * 物理核心在 src/physics/codefamily.js（精确引擎 + MC，pot85 38/38 对账）。

 *      不动点）、测量地板曲线（meas 开）、当前 p 的精确点 + MC 点。
 *   ② #fmFate   当前点 MC 结局分解（perfect/logic/outside）+ MC↔精确 4σ 对账。
 *   ③ #fmPower  领先幂次 α（P_L ~ c·p^α，p→0）：级联每层 ×2；rep 退极化

 *      无法被后续轮次确认 ⟹ outside = 1−(1−p)^m 的 O(p) 地板与码距无关，

 *      ⟹ P(X 帧多数失败)=1/2、P(Z 帧奇偶)=1/2、独立 ⟹ P_L = 3/4，对一切

 *      不随 d 改善 ⟹ 只是伪阈值意义上的数学交点。
 * ========================================================================== */
