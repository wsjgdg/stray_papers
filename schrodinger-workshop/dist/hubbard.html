<body>
<!-- 纯 CPU（二次量子化固定粒子数基）+ 2D canvas；ES 模块需经 HTTP 访问。
     单文件分发版由 scripts/build-standalone.mjs 生成到 dist/hubbard.html。 -->
<script>
/*! 薛定谔工场 · 单文件分发版（hubbard.html）— 由 scripts/build-standalone.mjs 自动生成，请勿手改。
    源码工程（ES 模块，课程站组件化用）：hubbard.html + src/
    模块拼接序（拓扑序，依赖在前）：
      src/core/styles.js
      src/core/responsive.js
      src/core/nav.js
      src/physics/hubbard.js
      src/hubbard3d.js
      src/hubbard.js
      src/hubbard-main.js
*/

/* ===== src/core/styles.js ===== */
/* 组件样式：挂载时注入 <style id="qf-styles">（多实例只注入一次）。
   R43 修复：本字符串此前**以字面 `<style>` 开头**（自初版 9c397d0 起），
   注入用 textContent ⟹ CSS 解析器把 `<style>` 当 selector 前缀，紧接的
   `:root{…}` 被解析为「`<style> :root`」这一永不匹配的后代选择器的声明块
   ⟹ **:root 内所有 CSS 变量失效**（--txt/--dim/--mono/--panel 全空），
   于是全部 `color:var(--dim)` 等退化为浏览器默认（黑字 + Times New Roman），
   在深色半透明面板上几乎不可读——而 font-size/letter-spacing 等字面值声明
   仍生效，故长期未被察觉（旧注释「视觉零回归」的自评有误）。
   R43 CDP 实测（getComputedStyle 读 CSS 变量全为空 + h3 color=rgb(0,0,0)
   / fontFamily=Times New Roman）定位并删除该标签后，变量与字体恢复。 */
const CSS = `
  :root{
    --bg:#04060c; --panel:rgba(8,12,22,.74); --line:rgba(120,160,220,.14);
    --txt:#e6edf3; --dim:#9aa7bd; --cyan:#67e8f9; --mag:#f0abfc; --amber:#fbbf24;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
  /* ---------- 顶栏 ---------- */
  /* 布局与子元素规则已收编 core/responsive.js 的 .qtop 族；主页差异值保留： */
  .qtop[id="topbar"]{gap:14px;padding:10px 20px}
  .qtop[id="topbar"] .logo{font-size:15px}
  .qtop[id="topbar"] .eq{font-size:12.5px;letter-spacing:.02em}
  #status{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
  /* R72：双粒子构型空间页入口（与 status 同排，flex:none 防被 eq 压缩） */
  #topbar .navlink{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;flex:none;transition:all .15s;letter-spacing:.05em}
  #topbar .navlink:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  /* ---------- 左侧控制面板 ---------- */
  /* R43 修复①：原 max-height:calc(100vh−120px) ⟹ 面板底 = 100vh−44，而左下
     #desc（bottom:52px）顶部随预设描述长度变化（实测 82px 文本 ⟹ 顶 100vh−132；
     GP/Pauli 长文本 177px ⟹ 顶 100vh−229）⟹ 两者在左列重叠（最大 238×80 px）。
     修复：#desc 限高 120px + 内部滚动（高度可控），面板按最坏情况预留
     (76 顶距 + 120 desc + 52 底距 + 8 间隙 = 256) ⟹ 面板底 100vh−180 ≤ desc 顶
     100vh−172，四 viewport × 五内核实测无重叠。 */
  #panel{top:76px;left:14px;width:238px;padding:14px;z-index:10;max-height:calc(100vh - 256px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:2px}
  .sec{margin-bottom:14px}
  .sec:last-child{margin-bottom:0}
  .sec>h3{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  /* R60 势刷轴比三连同控（grid3 单元格内的迷你标签行：名称 + 实时值） */
  .mini{font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between;gap:4px;margin:3px 0 1px;white-space:nowrap}
  .mini b{color:var(--cyan);font-weight:600;font-family:var(--mono)}
  button{font-family:var(--sans);font-size:12px;color:var(--txt);background:rgba(255,255,255,.045);
    border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;transition:all .15s;text-align:center}
  button:hover{background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.4)}
  button.on{background:rgba(103,232,249,.16);border-color:var(--cyan);color:var(--cyan)}
  button.wide{width:100%}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{font-size:11px;color:var(--dim);width:64px;flex:none}
  .row output{font-family:var(--mono);font-size:11px;color:var(--cyan);width:44px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(120,160,220,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 8px rgba(103,232,249,.7);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--cyan);cursor:pointer}
  select{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;outline:none}
  /* ---------- 右侧 HUD ---------- */
  #hud{top:76px;right:14px;padding:12px 14px;z-index:10;min-width:196px;font-family:var(--mono)}
  #hud .hrow{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:3px 0}
  #hud .hrow span:first-child{color:var(--dim)}
  #hud .hrow span:last-child{color:var(--txt)}
  #hud .hrow .ok{color:#4ade80}#hud .hrow .warn{color:var(--amber)}
  #hud hr{border:none;border-top:1px solid var(--line);margin:7px 0}
  /* ---------- 相位图例 ---------- */
  #legend{right:14px;bottom:52px;padding:10px 12px;z-index:10;display:flex;align-items:center;gap:12px}
  #wheel{width:84px;height:84px;border-radius:50%;border:1px solid var(--line)}
  #legend .cap{font-size:10.5px;color:var(--dim);line-height:1.7;max-width:130px}
  #legend .cap b{color:var(--cyan);font-weight:600}
  /* ---------- 底部提示 ---------- */
  #hint{left:50%;bottom:14px;transform:translateX(-50%);padding:8px 18px;z-index:10;
    font-size:11.5px;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
  #hint b{color:var(--txt);font-weight:600}
  #hint .k{font-family:var(--mono);color:var(--cyan);background:rgba(103,232,249,.1);
    border:1px solid rgba(103,232,249,.25);border-radius:4px;padding:0 5px;font-size:10.5px}
  /* ---------- 预设描述 ---------- */
  /* R43 修复②：描述文本长度随内核/预设变化（实测 82–177px 高），高度不可控会
     顶进 #panel 区域 ⟹ 限高 120px + 内部滚动：既压住几何冲突，又保留全文
     （长描述可滚动查看）。 */
  #desc{left:14px;bottom:52px;z-index:10;padding:10px 14px;max-width:340px;font-size:11.5px;
    color:var(--dim);line-height:1.65;max-height:120px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #desc b{color:var(--amber);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
  /* ---------- toast ---------- */
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
    font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.2em;opacity:0;transition:opacity .4s;
    text-shadow:0 0 18px rgba(103,232,249,.8)}
  /* ---------- 笔刷光标预览环 ---------- */
  #brushcursor{position:fixed;border:1px solid rgba(140,190,255,.85);border-radius:50%;pointer-events:none;
    display:none;z-index:15;box-shadow:0 0 10px rgba(80,140,255,.35),inset 0 0 10px rgba(80,140,255,.18)}
  /* ---------- 准星瞄准线 ---------- */
  #aim{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;pointer-events:none;display:none}
  #aim line{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4;filter:drop-shadow(0 0 4px rgba(251,191,36,.8))}
  #aim circle{fill:none;stroke:var(--amber);stroke-width:1;opacity:.7}
  #aim text{fill:var(--amber);font-family:var(--mono);font-size:11px}
  /* ---------- 角标 ---------- */
  .corner{position:fixed;width:22px;height:22px;z-index:4;pointer-events:none;opacity:.5}
  .corner::before,.corner::after{content:"";position:absolute;background:var(--cyan)}
  .corner::before{width:100%;height:1px}.corner::after{width:1px;height:100%}
  #c1{top:8px;left:8px}.corner::before{top:0}#c1::after{left:0}
  #c2{top:8px;right:8px}#c2::before{top:0}#c2::after{right:0}
  #c3{bottom:8px;left:8px}#c3::before{bottom:0}#c3::after{left:0}
  #c4{bottom:8px;right:8px}#c4::before{bottom:0}#c4::after{right:0}
  #diag{position:fixed;left:-9999px}
  /* ---------- 透射率扫描面板 ---------- */
  .hint{font-size:10px;color:var(--dim);line-height:1.5;flex:1}
  /* ---------- hint 可折叠（R45，用户选定方案 a）----------
     运行时升级（app.js upgradeHints）：原 hint 文本搬进 .hintBody，
     前置 .hintToggle 按钮。默认折叠（长 hint 是面板溢出的元凶，R43
     实测 2D 697px / 3D 1673px / GP 980px）；展开态经 localStorage
     持久化（key = hint 文本摘要，跨内核/面板切换稳定）。 */
  .hintToggle{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--dim);font:inherit;font-size:10px;cursor:pointer;padding:0;margin:0;
    letter-spacing:.05em}
  .hintToggle:hover{color:var(--cyan)}
  .hintToggle:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .hint .hintBody{display:none}
  .hint.open .hintBody{display:block}
  .hint.open .hintToggle{color:var(--cyan);margin-bottom:3px}
  /* ---------- sec 级分区折叠（R48，README「后续方向」a2）----------
     与 hint 折叠（R45）同模式：h3 变切换头（class 驱动显隐），展开态经
     localStorage 持久化（qf.secs.state，key = sec id / h3 摘要）。
     默认折叠：四个扫描面板 sec——R45 实测（1440×900，overflow 口径
     scrollH−clientH）溢出大头正是区块结构：2D 687 / 3D 1403 / GP 813，
     canvas 硬高占其中 820px。与门控正交：syncControls 按内核切 sec 的
     style.display（整区显隐），本折叠切 sec 内部子元素，互不竞争。
     扫描开始（GenericScanner.start → app.expandSecFor）自动展开所在
     sec——用户点了「开始扫描」就应看到 canvas 与状态行。
     特异度注意：规则须带 #panel 前缀——四个扫描 canvas 的 display:block
     规则（ID 选择器 1,0,0）会压过裸 .sec.collapsed > *:not(h3)（0,1,1）
     ⟹ 折叠态 canvas 仍显示（cdp48 首轮实证）。 */
  #panel .sec.collapsed > *:not(h3){display:none}
  .sec > h3{cursor:pointer;user-select:none;-webkit-user-select:none}
  .sec > h3:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .sec > h3::before{content:"▾ ";color:var(--dim);font-weight:400}
  .sec.collapsed > h3::before{content:"▸ "}
  /* R48：range flex item 默认 min-width:auto（Chrome ~129px 固有最小宽）
     ⟹ label64+gap+range129+gap+output44 超出面板内容宽 236px ~31px，
     面板被迫横向滚动（R43 起既有缺陷，R45 溢出台账只记了纵向）。 */
  input[type=range]{min-width:0}
  /* R48 a3：扫描 canvas 统一 width:100%（修复 paramScanCanvas/scanCanvas3/
     slitScanCanvas 三个缺规则 ⟹ 420px attribute 宽在 210px 面板内容区横向
     溢出、面板被迫横向滚动——R45 溢出台账只记了纵向，此项本轮补录）；
     attribute 高 260/300 → 180（_plot 全部按 cv.width/height 自适应绘制，
     内部分辨率 420×180 不变、显示高 210×180/420=90px，展开态每块省 40–60px）。 */
  #scanCanvas,#paramScanCanvas,#scanCanvas3,#slitScanCanvas{width:100%;margin-top:6px;
    border:1px solid var(--line);border-radius:8px;background:rgba(4,8,16,.4);display:block}
  #scanStat{font-size:10px;color:var(--cyan);font-family:var(--mono);flex:1;line-height:1.45}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
  /* ---------- 面板双向收起（R56，「试验场全屏」）----------
     左列 #panel(上) + #desc(下)、右列 #hud(上) + #legend(下) 各为一组，
     整组 transform 滑出屏幕——#gl 本就 position:fixed 全屏，滑出即露全场，
     无需 resize/重绘（画布尺寸不变，只是不再被面板遮挡）。
     边缘拉手 .qf-tab 常驻（z-index 11 压面板 10，只压边框+padding 6px，
     不挡内容）；点击拉手或快捷键 [ / ] 切换；状态经 localStorage
     qf.panels.state = {left,right}（true=展开，缺省/坏值默认全展开）。
     滑出态 pointer-events:none ⟹ 画布交互全程不被残留命中区遮挡。 */
  #panel,#desc,#hud,#legend{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .24s}
  body.qf-hide-left #panel,body.qf-hide-left #desc{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  body.qf-hide-right #hud,body.qf-hide-right #legend{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  .qf-tab{position:fixed;top:50%;transform:translateY(-50%);z-index:11;width:20px;height:60px;
    padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:14px;line-height:1;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:0 10px 10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 4px 16px rgba(0,0,0,.4);transition:color .15s,border-color .15s}
  #tabL{left:0}
  #tabR{right:0;border-radius:10px 0 0 10px}
  .qf-tab:hover{color:var(--cyan);border-color:rgba(103,232,249,.45)}
  @media (max-width:1100px){#legend,#desc{display:none}}
`;

function injectStyles(){
  if (document.getElementById("qf-styles")) return;
  const st = document.createElement("style");
  st.id = "qf-styles";
  st.textContent = CSS;
  document.head.appendChild(st);
}

/* ===== src/core/responsive.js ===== */
/* ============================================================================
 * responsive.js — 全站响应式公共模块（R94 引入）
 *
 * 背景：R90 给 12 个子页各写了一式三份的顶栏渐进收缩（1500/1400/900 三档
 * 媒体查询只换 id 前缀，36 处重复）；小屏更只做到「≤900 隐导航」——导航全隐
 * 等于 12 页互链在窄桌窗/平板/手机上不可达，且左面板（~238px 固定）+ 右 HUD
 * （≥200px）在 390px 竖屏下必重叠。R94 收编 + 补齐：
 *   1. 顶栏三档（1500/1400/900）收归公共类 .qtop——12 页删除本地副本；
 *   2. ≤900 导航改汉堡抽屉：桌面 .qnav 用 display:contents 透明包裹（a 们
 *      仍是 .qtop 的 flex item，布局逐位不变），手机变全屏下拉网格；
 *   3. ≤860 手机段：面板/HUD 转底部全宽 sheet（内联样式覆盖各页 id 规则，
 *      退出时按 dataset.qfRestore 精确还原），stage 内联几何让位顶栏与 dock；
 *   4. 底部 dock 三态（控制/读数/全屏），matchMedia 跨越 860px 自动进出。
 *
 * 各页接入约定（一次性）：
 *   - 顶栏/面板/HUD/stage/hint 容器分别加类 qtop/qpanel/qhud/qstage/qhint；
 *   - mount() 里调用 injectResponsive()（幂等；无这些类的页面静默跳过）。
 * ========================================================================== */

const RESP_CSS = `
  /* ---- 顶栏基础（收编自 12 子页本地规则；.eq i 取主页口径 mag，
       amber 派的 5 页保留本地差异行） ---- */
  .qtop{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:16px;padding:9px 18px;z-index:10;white-space:nowrap}
  .qtop .logo{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.12em;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  .qtop .eq{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .qtop .eq b{color:var(--cyan);font-weight:600}
  .qtop .eq i{color:var(--mag);font-style:italic}
  .qtop a{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;transition:all .15s}
  .qtop a:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  .qtop a.cur{color:var(--mag);border-color:rgba(240,171,252,.45)}
  /* ---- 桌面：.qnav 透明包裹（a 们仍是 .qtop 的直接 flex item） ---- */
  .qnav{display:contents}
  .qburger{display:none}
  /* ---- 顶栏渐进收缩（收编自 R90 的 12 页本地副本，规则逐字保留） ---- */
  /* 特异性：.qtop.qtop（0,2,0）压各页差异行 .qtop[id="xxTop"]（0,2,0）靠
     本 style 后注入（同权重比源码序）；子元素 .qtop.qtop X（0,3,x）压
     .qtop[id="xxTop"] X（0,2,x）。 */
  @media (max-width:1500px){.qtop.qtop{gap:10px;padding:7px 14px}.qtop.qtop .logo{font-size:13px}
    .qtop.qtop a{font-size:10px;padding:2px 7px}}
  @media (max-width:1400px){.qtop.qtop .eq{display:none}.qtop.qtop{gap:8px}
    .qtop.qtop a{font-size:9.5px;padding:2px 6px}}
  /* ---- ≤900：导航收进汉堡抽屉（替代原「隐导航」） ---- */
  @media (max-width:900px){
    /* position:relative + z-index:11：burger 须压在抽屉（z:9）之上。二者同是
       .qtop  stacking context 的子元素，.qtop 的 z:10 只管对外层级——初版漏了
       这条，实测 elementFromPoint 命中 .qnav，真实手指点汉堡位置无效。
       尺寸 40×36：R95 实测 30×26 只过 WCAG 2.5.8 AA（24px），离 44px 舒适线
       仍远；顶栏 ≤900 时只剩 burger + logo（eq 已隐），放大不挤位。 */
    .qburger{display:flex;align-items:center;justify-content:center;flex:none;
      position:relative;z-index:11;
      width:40px;height:36px;padding:0;font-size:17px;line-height:1}
    .qnav{display:none;position:fixed;top:0;left:0;right:0;z-index:9;
      grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:7px;
      padding:52px 12px 14px;max-height:100vh;max-height:100dvh;overflow-y:auto;
      background:rgba(4,6,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line)}
    .qtop.open .qnav{display:grid}
    /* !important 收口：抽屉是覆盖层上下文，页面级顶栏规则不得泄漏进来——主页
       id 级 #topbar .navlink（styles.js，11px/3px 8px）与 1400 档 .qtop.qtop a
       （9.5px/2px 6px）特权都高于类选择器（id 赢 (0,3,1)），升维打不过；实测
       抽屉链接曾被压到 20px 高（< WCAG 2.5.8 AA 的 24px）。13×1.25+14×2
       = 44.25px，同时满足 44px 触摸目标。仅 ≤900 生效。 */
    .qnav a{font-size:13px!important;padding:14px 6px!important;line-height:1.25!important;text-align:center}
  }
  /* ---- ≤860 手机段：底部 dock 三态（控制/读数/全屏；dock 三态常驻，
     off 态退让为半透明——曾把 off 态 dock 也 display:none，实测成死胡同：
     默认即全屏且无任何 UI 路径回到控制/读数，只能旋转屏幕或刷新） ---- */
  .qf-dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:none;
    gap:6px;padding:5px 8px;z-index:14;transition:opacity .18s;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  html.qf-mobile .qf-dock{display:flex}
  /* 按钮 padding 5px 10px → 8px 12px：R95 实测 29px 高，放大到 ≈31px（仍不过
     44px 舒适线——再大 dock 总高将顶破 44px 预留带，需连带改 stage/sheet 的
     让位常量，权衡后记为遗留）。dock 总高 43.2 ≤ 44 带不变。 */
  .qf-dock button{font-size:11px;padding:8px 12px;border-radius:6px;white-space:nowrap}
  html.qf-mobile body.qf-m-controls .qhud{display:none}
  html.qf-mobile body.qf-m-readout .qpanel{display:none}
  html.qf-mobile body.qf-m-off .qpanel,html.qf-mobile body.qf-m-off .qhud{display:none}
  html.qf-mobile body.qf-m-off .qf-dock{opacity:.4}
  html.qf-mobile body.qf-m-off .qf-dock:active{opacity:.85}
  /* ---- ≤860 手机段：hint 换行防溢出、给 dock 让位；hud sheet 统一可滚
     （各页 #xxHud 的 overflow 不一致：hubbard/shor 无声明 ⟹ 内容超 46vh
      时静默裁切，实测 shor 已临界 387>386；gatenoise 的 .sfill 在 .strack
      内 top:0;bottom:0，加滚动不裁切——13 页 × 2 视口实测确认） ---- */
  @media (max-width:860px){
    /* sheet 最大高经 CSS 变量下发：竖屏 46vh；横屏（844×390 等）放 64vh——
       R95 实测横屏面板带仅 179px 过小。inline max-height 引用 var()，
       媒体状态变化自动生效，无需 JS 监听 orientationchange。
       注：此处只 vh 不 dvh——max-height 非布局临界尺寸（内容可滚），
       工具栏收放的抖动可接受；stage 高度（关键尺寸）仍保持 dvh 双声明。 */
    :root{--qf-sm:46vh}
    .qhint{white-space:normal;max-width:calc(100vw - 20px);bottom:40px;
      font-size:10.5px;line-height:1.5}
    .qhud{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  }
  @media (max-width:860px) and (orientation:landscape){:root{--qf-sm:64vh}}
  @media (prefers-reduced-motion:reduce){.qf-dock{transition:none}.qtop a{transition:none}}
`;

const $ = (s, r = document) => Array.from(r.querySelectorAll(s));
const MQ = '(max-width:860px)';
/* dvh 双声明：移动浏览器工具栏收放时 100vh 按大视口计算 ⟹ stage/sheet 带
   跳动（iOS 经典病）。旧浏览器忽略不认识的 dvh 行、保留 vh 行（CSS 错误
   处理即 fallback，无需 @supports）。dvh 支持：Safari 15.4+/Chrome 108+/
   Firefox 101+，低于本项目 README 地板 Safari 16.4。
   sheet 的 max-height 走 var(--qf-sm)（竖 46vh/横 64vh，见 ≤860 段注释）。 */
const SHEET_G = 'position:fixed;left:6px;right:6px;width:auto;top:auto;bottom:44px;max-height:var(--qf-sm,46vh);z-index:12';
const STAGE_G = 'position:fixed;left:6px;right:6px;width:auto;top:48px;transform:none';

/* ---- 手机段几何三件套（R98 提为模块级：原为 injectResponsive 内闭包，
   仅覆盖 enhance 时刻存在的元素；QEC hub 切换 mode 是整块换 DOM，需导出
   重放入口给壳调用。行为与原闭包逐字一致） ---- */
function syncStage(){
  if (!document.documentElement.classList.contains('qf-mobile')) return;
  /* dock 三态常驻 ⟹ 舞台恒让出底部 44px dock 带（off 态不再压缩到 8px） */
  $('.qstage').forEach(el => {
    el.style.height = 'calc(100vh - 48px - 44px)';
    el.style.height = 'calc(100dvh - 48px - 44px)'; /* 旧浏览器忽略此行保留上一行 */
  });
}
function sheetify(root = document){
  $('.qpanel,.qhud', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + SHEET_G;
  });
  $('.qstage', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + STAGE_G;
  });
  syncStage();
}
function unsheetify(){
  $('.qpanel,.qhud,.qstage').forEach(el => {
    if (el.dataset.qfRestore == null) return;
    el.setAttribute('style', el.dataset.qfRestore);
    delete el.dataset.qfRestore;
  });
  syncStage();
}

/** R98：hub 切 mode 后，对新插入的 .qpanel/.qhud/.qstage 重放手机段几何
 *  （桌面宽度为空操作；幂等——已带 qfRestore 的元素跳过）。 */
function refreshMobileGeometry(root = document){
  if (!matchMedia(MQ).matches) return;
  sheetify(root);
}

function injectResponsive(){
  /* ---- 样式只注入一次（同步，不等 DOM） ---- */
  if (!document.getElementById('qf-resp')){
    const st = document.createElement('style');
    st.id = 'qf-resp';
    st.textContent = RESP_CSS;
    document.head.appendChild(st);
  }
  if (document.body.dataset.qfResp) return;
  document.body.dataset.qfResp = '1';

  /* ---- DOM 增强推迟到 microtask ----
     各页 mount() 的调用时序是 injectStyles() → injectResponsive() →
     构建 DOM（insertAdjacentHTML / container.innerHTML）——本函数若同步
     增强，.qtop 尚不存在（汉堡/抽屉无从包起），且 body.innerHTML 整体
     重写会把已 append 的 dock 清掉（index/two-body/hubbard 三页实测）。
     mount() 是同步函数 ⟹ microtask 必在其返回后执行：那时 DOM 已就绪，
     三种构建方式（insertAdjacentHTML / innerHTML / buildDOM）均安全。 */
  const enhance = () => {

  /* ---- 1. 顶栏增强：包 .qnav + 注入汉堡（幂等） ---- */
  $('.qtop').forEach(top => {
    if (top.querySelector('.qburger')) return;
    const nav = document.createElement('nav');
    nav.className = 'qnav';
    $('a', top).forEach(a => nav.appendChild(a));
    top.appendChild(nav);
    const b = document.createElement('button');
    b.className = 'qburger';
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', '打开导航');
    b.textContent = '☰';
    /* 开合状态同步 aria-expanded / aria-label（a11y：初版恒为「打开导航」） */
    const setOpen = open => {
      top.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
    };
    b.addEventListener('click', e => { e.stopPropagation(); setOpen(!top.classList.contains('open')); });
    top.insertBefore(b, top.firstChild);
    /* 抽屉内任意点击即收起：点链接本就导航，点 backdrop 现在也能取消
       （初版只认链接 ⟹ 打开后除了导航无法退出，实测确认的死胡同） */
    nav.addEventListener('click', () => setOpen(false));
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.qtop')) $('.qtop.open').forEach(t => t.classList.remove('open'));
  });
  /* Escape 收抽屉 + 焦点回汉堡（键盘用户路径；初版无 Escape） */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    $('.qtop.open').forEach(t => {
      t.classList.remove('open');
      const b = t.querySelector('.qburger');
      if (b){ b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', '打开导航'); b.focus(); }
    });
  });

  /* ---- 2. 底部 dock（三态常驻：默认 off = 舞台优先，dock 退让为半透明） ---- */
  const dock = document.createElement('div');
  dock.className = 'qf-dock';
  dock.innerHTML = '<button type="button" data-tab="controls">⚙ 控制</button>'
    + '<button type="button" data-tab="readout">◫ 读数</button>'
    + '<button type="button" data-tab="off">✕ 全屏</button>';
  document.body.appendChild(dock);
  dock.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.body.classList.remove('qf-m-controls', 'qf-m-readout', 'qf-m-off');
    document.body.classList.add('qf-m-' + b.dataset.tab);
    syncStage();
  });
  document.body.classList.add('qf-m-off');

  /* ---- 3. 手机段几何：内联覆盖各页 id 规则，退出精确还原 ---- */
  const mq = matchMedia(MQ);
  const apply = m => {
    document.documentElement.classList.toggle('qf-mobile', m);
    if (m) sheetify(); else unsheetify();
  };
  if (mq.addEventListener) mq.addEventListener('change', ev => apply(ev.matches));
  else if (mq.addListener) mq.addListener(ev => apply(ev.matches)); /* 旧 Safari */
  apply(mq.matches); /* 页面可能直接在手机宽度打开 */

  };
  queueMicrotask(enhance);
}

/* ============================================================================

 *
 * 背景：R79 加 Shor 页时漏掉了六页的导航链接，R80 后主页顶栏又停了更——
 * 每加一页就要手工同步 12 处硬编码导航，漏一处就是一个「导航洞」

 *
 * 约定：
 *   - NAV = [[href, label], ...] 按站点顺序；当前页由 navHtml(cur) 打 cur 高亮。
 *   - 标签文案全站统一（历史上各页曾有 '← 单粒子主页' / '双粒子 ⟋' 等变体）。
 *   - 新页面只需在 NAV 追加一行 + build-standalone.mjs 的 PAGES 追加一行。
 *   - 主页顶栏（class="navlink" + title 工具提示）走 navLinksHtml()，
 *     标题文案在 NAV_TITLES，与 NAV 同源，不会再漏。
 * ========================================================================== */

/** 主页顶栏各页的 title 工具提示（与 NAV 同序；缺省回退为标签文案） */
const NAV_TITLES = {

  './noise.html': '开放量子系统：T₁ 弛豫 / T₂ 退相位 / 纠缠猝死（R77）',

/** 生成子页顶栏导航 HTML；cur = 当前页 href（打 cur 高亮，自链也在——与 flag/rounds/cycle 一致）。
 *  indent = 每行前导空白（各页模板缩进不同：6/8 空格或 div 版 2 空格）。 */
function navHtml(cur, indent = '        ') {
  return NAV.map(([h, t]) =>
    `${indent}<a href="${h}"${h === cur ? ' class="cur"' : ''}>${t}</a>`).join('\n');

/** 主页顶栏（#topbar）导航：class="navlink" + title；主页自身无链接。 */

    .map(([h, t]) => `${indent}<a class="navlink" href="${h}" title="${NAV_TITLES[h] || t}">${t}</a>`)
    .join('\n');

const NAV_HREFS = NAV.map(([h]) => h);

/* ===== src/physics/hubbard.js ===== */
/* ============================================================================
 * hubbard.js — R73 二次量子化：一维格点费米-哈伯德（固定粒子数基，纯 CPU）
 *
 *   H = −t Σ_{i,σ} (c†_{iσ} c_{i+1,σ} + h.c.) + U Σ_i n_{i↑} n_{i↓} + Σ_i μ_i (n_{i↑}+n_{i↓})
 *
 * 【外场 μ_i】R139 加入：局域势**只进对角项**，不改变基与 CSR 跃迁表 ⟹ 画势时无
 * 需重建扇区（重建 L=10 要 286ms，而 hbSetField 只要 1ms）。矩阵元
 *   ⟨k|Σμ_i n_i|k⟩ = Σ_{i∈mask↑_a} μ_i + Σ_{i∈mask↓_b} μ_i = φ↑[a] + φ↓[b]
 * 先按**单自旋扇区**算 φ（O(dim_spin·L)），再在双自旋索引上做一次加法（O(dim)），
 * 避免 matvec 内循环里每次重算。均匀 μ 只平移能量：ψ 逐位不变、E→E+μN（pot139）。
 *
 * 【基与维度】自旋分部门：↑ 与 ↓ 各自固定粒子数 ⟹ 基 = C(L,N↑)·C(L,N↓)，
 * 而非 2^(2L)。每格每自旋占据数 0/1 —— **同自旋两费米子不能同格点**是基构造
 * 的结构性事实（不是相互作用）；U 只惩罚 ↑↓ 同格（双占）。这正是二次量子化
 * 语言与 R72 实空间反对称化的对应：R72 的对角线恒零 = 这里的「同格 0/1」。
 *
 * 【Jordan–Wigner 符号】最近邻跃迁 c†_{i+1}c_i 的符号 = (−1)^{popcount(mask
 * & ((1<<min(i,i+1))−1))}：沿格点次序把 c_i 移过左侧占据算符的相位。省略它
 * 会得到「硬核玻色子」而非费米子（pot73 用 2 格点解析解与稠密对角化双重校验）。
 *
 * 【存储】跃迁表用 **CSR**（offsets+targets+signs，nnz≈dim×4~8）而非「每态固定
 * 槽位」——后者要 4(L−1) 槽、L=10 时 11MB 且 matvec 满槽扫描；CSR 紧凑且循环
 * 只走真实非零。
 *
 * 【积分器】
 *   - 基态：Lanczos（全重正交、三对角 Jacobi），分帧驱动 `HbGsTask.step(n)`；
 *     固定 (N↑,N↓) 扇区内的最低态。
 *   - 实时：**Krylov 指数** exp(−iHdt)ψ（m 步 Lanczos + 三对角本征分解），
 *     酉到机器精度（pot73 对照 Taylor 参考量化截断）。
 *   - 电荷能隙：Δ=E(N↑+1,N↓)+E(N↑−1,N↓)−2E(N↑,N↓)（两次额外 Lanczos）。
 *
 * 【纠缠熵】半链切分：ρ_L 在 (k↑_L,k↓_L) 上**块对角** ⟹ 逐块 SVD（L=8 每块
 * ≤36×36，L=10 ≤100×100），S=Σ_blocks −Σλlnλ。不做全 2^L 对角化（L=10 是
 * 1024 维，全矩阵 Jacobi 不可行）；块分解精确，因粒子数守恒按块封闭。
 *
 * 【诚实限制】
 *   1. 自旋ful 维度是 C(L,N↑)·C(L,N↓)：L=12 半满 924²=854k（matvec ~0.2s，
 *      只适合离线），本页实际 L=8（4900）/L=10（63504）。README 里
 *      「L=20/N=10 ⟹ 184756」是**单自旋**估计，不适用双自旋。
 *   2. 开边界（跨边界绕行符号不在本轮）。
 *   3. 粒子数固定：μ_i 是**局域势**（每格一个，可在页面上涂），不是化学势——
 *      没有 μN 项就不存在粒子数涨落。
 *   4. Krylov 截断 O(dt^{m+1})，pot73 与 Taylor 参考对账。
 * ========================================================================== */

/* ---------- 基构造 ---------- */
function popcount(x){
  x = x - ((x >> 1) & 0x55555555);
  x = (x & 0x33333333) + ((x >> 2) & 0x33333333);
  x = (x + (x >> 4)) & 0x0f0f0f0f;
  return (x * 0x01010101) >> 24;
}
/* 单自旋扇区：所有 popcount=N 的 L 位掩码（升序）+ 掩码→索引查找表 */
function hbBasis(L, N){
  const size = 1 << L;
  const masks = [];
  for (let m = 0; m < size; m++) if (popcount(m) === N) masks.push(m);
  const index = new Int32Array(size).fill(-1);
  masks.forEach((m, i) => { index[m] = i; });
  return { L, N, dim: masks.length, masks: Int32Array.from(masks), index };
}

/* 双自旋扇区：CSR 跃迁表 + 对角 U 表（↑掩码 & ↓掩码 的 popcount） */
function hbSector(L, Nup, Ndn){
  const bu = hbBasis(L, Nup), bd = hbBasis(L, Ndn);
  const du = bu.dim, dd = bd.dim, dim = du * dd;
  const diagU = new Uint8Array(dim);
  for (let a = 0; a < du; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < dd; b++) diagU[a * dd + b] = popcount(mu & bd.masks[b]);
  }
  /* 【JW 符号】= 把 c_j 移到 c_i 位置时跨过的占据数：**严格介于 i 与 j 之间**的占据位。
     旧版写「低于 min(i,j) 的占据数」——那是最近邻跃迁的等价写法（两者相差一个对角
     规范变换 G，谱完全不变：pot140 用稠密低端谱逐项对账 worst 5e-15），但对任意 (i,j)
     的 c†_i c_j 给出非物理符号：ρ_ij 不再正定（n(k) 出现负值）、J_i 随占据奇偶翻正负。
     改用标准串后：自由费米子基态**精确等于** Slater 行列式（⟨·⟩=1.000000000000），
     n(k) 恢复费米海形状（≥0、Σ=N）。三处 hopOne（扇区 / ρ / 键关联）必须同一约定。 */
  /* 每态跃迁（↑ 与 ↓）：先数再填（CSR 两遍） */
  const hopOne = (mask, i, j) => {
    const bi = 1 << i, bj = 1 << j;
    if (!(mask & bj) || (mask & bi)) return null;
    const lo = Math.min(i, j), hi = Math.max(i, j);
    const mid = ((1 << hi) - 1) ^ ((1 << (lo + 1)) - 1);
    return [mask ^ bi ^ bj, (popcount(mask & mid) % 2) ? -1 : 1];
  };
  /* CSR 两遍构建：先数每态的跃迁数、再回填。
     旧版用 tmp 数组收集 [stateIdx,target,sign] 三元组：L=12 半满要 push 1000 万个数组
     （≈1 GB RSS、4.8 s）。两遍法把内存降到 targets+signs，构建也快一倍。 */
  const offsets = new Int32Array(dim + 1);
  const bond = L - 1;
  for (let a = 0; a < du; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < dd; b++){
      const k = a * dd + b, md = bd.masks[b];
      let c = 0;
      for (let s = 0; s < bond; s++){
        const i0 = s, i1 = s + 1;
        const b0 = 1 << i0, b1 = 1 << i1;
        /* 方向 1：c†_{i0} c_{i1}（i1 占、i0 空） */
        if ((mu & b1) && !(mu & b0)) c++;
        if ((md & b1) && !(md & b0)) c++;
        /* 方向 2：c†_{i1} c_{i0} */
        if ((mu & b0) && !(mu & b1)) c++;
        if ((md & b0) && !(md & b1)) c++;
      }
      offsets[k + 1] = c;
    }
  }
  for (let k = 0; k < dim; k++) offsets[k + 1] += offsets[k];
  const nnz = offsets[dim];
  const targets = new Int32Array(nnz), signs = new Int8Array(nnz);
  const cursor = Int32Array.from(offsets.subarray(0, dim));
  for (let a = 0; a < du; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < dd; b++){
      const k = a * dd + b, md = bd.masks[b];
      let p = cursor[k];
      for (let s = 0; s < bond; s++){
        for (let dir = 0; dir < 2; dir++){
          const i = dir ? s + 1 : s, j = dir ? s : s + 1;
          const hu = hopOne(mu, i, j);
          if (hu){ targets[p] = bu.index[hu[0]] * dd + b; signs[p] = hu[1]; p++; }
          const hd = hopOne(md, i, j);
          if (hd){ targets[p] = a * dd + bd.index[hd[0]]; signs[p] = hd[1]; p++; }
        }
      }
    }
  }
  /* diagPot：外场 Σμ_i(n_i↑+n_i↓) 的对角量（hbSetField 填充，默认全零） */
  const diagPot = new Float64Array(dim);
  return { L, Nup, Ndn, du, dd, dim, bu, bd, diagU, diagPot, offsets, targets, signs, nnz };
}

/* ---------- 外场：把 μ_i 烘进对角项 ----------
   mu 可为 null（清场）或长度 L 的数组。**不重建跃迁表**，只重写 diagPot。 */
function hbSetField(sec, mu){
  const { L, du, dd, diagPot, bu, bd } = sec;
  if (!mu){
    diagPot.fill(0); sec.field = null;
    return diagPot;
  }
  if (mu.length !== L) throw new Error('hbSetField: mu 长度须为 L');
  /* 单自旋扇区上的 φ = Σ_{i∈mask} μ_i：按位迭代，O(占据数) 而非 O(L) */
  const phi = (basis, out) => {
    for (let k = 0; k < basis.dim; k++){
      let m = basis.masks[k], s = 0;
      while (m){ const bit = m & -m; s += mu[31 - Math.clz32(bit)]; m ^= bit; }
      out[k] = s;
    }
  };
  const fu = new Float64Array(du), fd = new Float64Array(dd);
  phi(bu, fu); phi(bd, fd);
  for (let a = 0; a < du; a++){
    const base = a * dd, va = fu[a];
    for (let b = 0; b < dd; b++) diagPot[base + b] = va + fd[b];
  }
  sec.field = Float64Array.from(mu);
  return diagPot;
}

/* 初态：按每格占据码（0=空 1=↑ 2=↓ 3=↑↓）建乘积态 */
function hbProductFromPattern(sec, pattern){
  const up = [], dn = [];
  for (let i = 0; i < sec.L; i++){
    const c = pattern[i] | 0;
    if (c & 1) up.push(i);
    if (c & 2) dn.push(i);
  }
  /* 图案必须落在扇区里：粒子数不符时 bu.index 查不到（-1）⟹ 写进 re[-1] 被丢弃、
     得到一个**全零向量**（画面上表现为「什么都没了」）。这里直接说清楚，不静默。 */
  if (up.length !== sec.Nup || dn.length !== sec.Ndn){
    throw new Error(`hbProductFromPattern: 图案粒子数 (${up.length},${dn.length}) 与扇区 (${sec.Nup},${sec.Ndn}) 不符`);
  }
  const w = hbInitProduct(sec, up, dn);
  return Object.assign(w, { nUp: up.length, nDn: dn.length });
}

/* ---------- H·ψ（re/im 分离；H 实对称 ⟹ 两通道同一算子） ---------- */
function hbMatvec(sec, re, im, outRe, outIm, t, U){
  const { dim, offsets, targets, signs, diagU, diagPot } = sec;
  for (let k = 0; k < dim; k++){
    const d = U * diagU[k] + diagPot[k];
    let sr = d * re[k], si = d * im[k];
    for (let p = offsets[k]; p < offsets[k + 1]; p++){
      const c = -t * signs[p], tg = targets[p];
      sr += c * re[tg]; si += c * im[tg];
    }
    outRe[k] = sr; outIm[k] = si;
  }
}
function hbNorm(re, im){
  let n = 0;
  for (let k = 0; k < re.length; k++) n += re[k] * re[k] + im[k] * im[k];
  return n;
}
function hbDot(ar, ai, br, bi){
  let s = 0;
  for (let k = 0; k < ar.length; k++) s += ar[k] * br[k] + ai[k] * bi[k];
  return s;
}
function hbEnergy(sec, re, im, t, U){
  const hr = new Float64Array(re.length), hi = new Float64Array(im.length);
  hbMatvec(sec, re, im, hr, hi, t, U);
  return hbDot(re, im, hr, hi);
}

/* ---------- 测量：逐格占据 / 双占 ---------- */
function hbMeasure(sec, re, im){
  const { L, bu, bd, dd } = sec;
  const nU = new Float64Array(L), nD = new Float64Array(L), nT = new Float64Array(L);
  const dbl = new Float64Array(L);   /* 逐格 ⟨n_i↑ n_i↓⟩（与 Dtot 独立求和，可互校） */
  let Dtot = 0;
  for (let a = 0; a < bu.dim; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < bd.dim; b++){
      const k = a * dd + b;
      const p = re[k] * re[k] + im[k] * im[k];
      if (p < 1e-30) continue;
      const md = bd.masks[b];
      const both = mu & md;
      Dtot += p * popcount(both);
      for (let i = 0; i < L; i++){
        if (mu & (1 << i)) nU[i] += p;
        if (md & (1 << i)) nD[i] += p;
      }
      let bm = both;   /* 双占逐格累加：只走同时被两自旋占据的位 */
      while (bm){ const bit = bm & -bm; dbl[31 - Math.clz32(bit)] += p; bm ^= bit; }
    }
  }
  for (let i = 0; i < L; i++) nT[i] = nU[i] + nD[i];
  return { nU, nD, nT, dbl, Dtot };
}

/* ---------- 实对称 Jacobi 对角化（循环法，标准旋转；返回本征值/本征向量） ----------
   旋转公式：τ=(a_qq−a_pp)/(2a_pq)、t=sgn(τ)/(|τ|+√(1+τ²))、c=1/√(1+t²)、s=tc；
   对 k≠p,q 更新行列并写回对称位置，然后**显式置零** a_pq（不置零则 off() 不收敛）。 */
function jacobiEigen(Ain, maxSweep = 50){
  const n = Ain.length;
  const A = Ain.map(r => Float64Array.from(r));
  const V = [];
  for (let i = 0; i < n; i++){ const v = new Float64Array(n); v[i] = 1; V.push(v); }
  const off = () => {
    let s = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) s += A[i][j] * A[i][j];
    return Math.sqrt(s);
  };
  for (let sweep = 0; sweep < maxSweep; sweep++){
    if (off() < 1e-13) break;
    for (let p = 0; p < n - 1; p++) for (let q = p + 1; q < n; q++){
      const apq = A[p][q];
      if (Math.abs(apq) < 1e-16) continue;
      const tau = (A[q][q] - A[p][p]) / (2 * apq);
      const tS = (tau >= 0 ? 1 : -1) / (Math.abs(tau) + Math.sqrt(1 + tau * tau));
      const c = 1 / Math.sqrt(1 + tS * tS), s = tS * c;
      for (let k = 0; k < n; k++){
        if (k === p || k === q) continue;
        const akp = A[k][p], akq = A[k][q];
        A[k][p] = c * akp - s * akq; A[p][k] = A[k][p];
        A[k][q] = s * akp + c * akq; A[q][k] = A[k][q];
      }
      A[p][p] -= tS * apq; A[q][q] += tS * apq;
      A[p][q] = 0; A[q][p] = 0;
      for (let k = 0; k < n; k++){
        const vkp = V[k][p], vkq = V[k][q];
        V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq;
      }
    }
  }
  return { val: Float64Array.from({ length: n }, (_, i) => A[i][i]), vec: V };
}

/* ---------- Lanczos 基态（分帧任务；全重正交） ---------- */
class HbGsTask {
  constructor(sec, t, U, opts = {}){
    this.sec = sec; this.t = t; this.U = U;
    /* 内存上限：Lanczos 要存 m 个向量。H 实对称 + 实种子 ⟹ 整个 Krylov 基**恒为实**
       （im≡0），所以只存实部（dim·8 字节）：L=12 的 dim=853776 每向量 6.5 MB，
       m=100 才 650 MB；若按复数存，同样内存只够 m=52（U≥2 明显不收敛）。
       按预算裁 m，并把裁掉的实情暴露给调用方（mMax / mCapped），页面 HUD 与残差一起显示。 */
    const budget = (opts.maxMemMB ?? 640) * 1048576;
    this.mMax = Math.max(8, Math.floor(budget / (sec.dim * 8)));
    this.m = Math.min(opts.m ?? 80, this.mMax);
    this.mCapped = this.m < (opts.m ?? 80);
    const dim = sec.dim;
    const re = new Float64Array(dim), im = new Float64Array(dim);
    let s = opts.seed ?? 12345;
    for (let k = 0; k < dim; k++){ s = (s * 16807) % 2147483647; re[k] = (s / 2147483647) - 0.5; }
    const nn = Math.sqrt(hbNorm(re, im));
    for (let k = 0; k < dim; k++) re[k] /= nn;
    this.re = re; this.im = im;
    this.zeroI = new Float64Array(dim);      /* 实模式下的虚部占位（mb 缓冲，不参与运算） */
    this.V = []; this.alpha = []; this.beta = [];
    this.iter = 0; this.done = false; this.energy = NaN;
  }
  step(n = 1){
    const { sec, t, U, m } = this;
    const dim = sec.dim;
    for (let it = 0; it < n && !this.done; it++){
      /* 实模式：只存实部（虚部恒 0）。H 实数对称 ⟹ 这不是近似。 */
      const vr = this.iter === 0 ? Float64Array.from(this.re) : this._nextR;
      const vi = this.zeroI;
      this.V.push([vr, vi]);
      /* w 必须**每步新分配**：若复用同一个缓冲，下一轮的 matvec 输出会覆盖
         上一轮存下的基向量（别名），多步调用时 beta 爆炸成 1e14/NaN——逐步
         调用因每次新建缓冲而掩盖（R73 首版即此）。 */
      const wR = new Float64Array(dim), wI = new Float64Array(dim);
      hbMatvec(sec, vr, vi, wR, wI, t, U);
      const a = hbDot(vr, vi, wR, wI);
      this.alpha.push(a);
      const prev = this.V.length > 1 ? this.V[this.V.length - 2] : null;
      const bprev = this.beta.length ? this.beta[this.beta.length - 1] : 0;
      for (let k = 0; k < dim; k++){
        wR[k] -= a * vr[k]; wI[k] -= a * vi[k];
        if (prev){ wR[k] -= bprev * prev[0][k]; wI[k] -= bprev * prev[1][k]; }
      }
      /* 两遍 Gram–Schmidt（Lanczos 基失正交通常是小规模 ED 的头号精度杀手） */
      for (let pass = 0; pass < 2; pass++){
        for (const [vjR, vjI] of this.V){
          const c = hbDot(vjR, vjI, wR, wI);
          if (c === 0) continue;
          for (let k = 0; k < dim; k++){ wR[k] -= c * vjR[k]; wI[k] -= c * vjI[k]; }
        }
      }
      const nb = Math.sqrt(hbNorm(wR, wI));
      this.beta.push(nb);
      this.iter++;
      if (nb < 1e-12 || this.iter >= m){
        this.done = true;
        this._extract();
      } else {
        for (let k = 0; k < dim; k++){ wR[k] /= nb; }
        this._nextR = wR; this._nextI = this.zeroI;
      }
    }
    return { iter: this.iter, done: this.done, energy: this.energy };
  }
  _extract(){
    const m = this.alpha.length;
    const T = [];
    for (let i = 0; i < m; i++){ T.push(new Float64Array(m)); T[i][i] = this.alpha[i]; }
    for (let i = 0; i + 1 < m; i++){ T[i][i + 1] = this.beta[i]; T[i + 1][i] = this.beta[i]; }
    const { val, vec } = jacobiEigen(T, 40);
    let imin = 0;
    for (let i = 1; i < m; i++) if (val[i] < val[imin]) imin = i;
    this.energy = val[imin];
    const dim = this.sec.dim;
    const re = new Float64Array(dim);
    for (let j = 0; j < m; j++){
      const c = vec[j][imin];
      if (c === 0) continue;
      const vjR = this.V[j][0];
      for (let k = 0; k < dim; k++) re[k] += c * vjR[k];
    }
    const nn = Math.sqrt(hbNorm(re, this.zeroI));
    for (let k = 0; k < dim; k++) re[k] /= nn;
    this.re = re;
    this.im = new Float64Array(dim);      /* 实模式：虚部恒 0（下游仍拿到一个合法数组） */
  }
}

/* ---------- Krylov 指数：exp(−iH·dt)ψ（m 步 Lanczos + 三对角本征分解） ---------- */
function hbKrylovExp(sec, re, im, t, U, dt, m = 12){
  const dim = sec.dim;
  const nrm = Math.sqrt(hbNorm(re, im));
  if (nrm < 1e-300) return { re: Float64Array.from(re), im: Float64Array.from(im) };
  let curR = Float64Array.from(re, v => v / nrm), curI = Float64Array.from(im, v => v / nrm);
  const Vs = [], Ws = [], alpha = [], beta = [];
  const tmpR = new Float64Array(dim), tmpI = new Float64Array(dim);
  let steps = 0;
  for (let j = 0; j < m; j++){
    Vs.push(curR); Ws.push(curI);
    hbMatvec(sec, curR, curI, tmpR, tmpI, t, U);
    const a = hbDot(curR, curI, tmpR, tmpI);
    alpha.push(a);
    const prevR = j > 0 ? Vs[j - 1] : null, prevI = j > 0 ? Ws[j - 1] : null;
    const bprev = beta.length ? beta[beta.length - 1] : 0;
    for (let k = 0; k < dim; k++){
      tmpR[k] -= a * curR[k]; tmpI[k] -= a * curI[k];
      if (prevR){ tmpR[k] -= bprev * prevR[k]; tmpI[k] -= bprev * prevI[k]; }
    }
    const nb = Math.sqrt(hbNorm(tmpR, tmpI));
    steps = j + 1;
    if (nb < 1e-13) break;                 /* 不变子空间 */
    beta.push(nb);
    curR = new Float64Array(dim); curI = new Float64Array(dim);
    for (let k = 0; k < dim; k++){ curR[k] = tmpR[k] / nb; curI[k] = tmpI[k] / nb; }
  }
  const T = [];
  for (let i = 0; i < steps; i++){ T.push(new Float64Array(steps)); T[i][i] = alpha[i]; }
  for (let i = 0; i + 1 < steps; i++){ T[i][i + 1] = beta[i]; T[i + 1][i] = beta[i]; }
  const { val, vec } = jacobiEigen(T, 40);
  /* c_j = Σ_k V[j][k]·V[0][k]·e^{−iλ_k dt}：V[0][k]=⟨u_k|v_0⟩ 是初态在第 k 个
     本征矢上的投影——漏掉它系数不构成正交变换，范数会指数爆炸（R73 首版
     50 步涨到 1e53，Taylor 对照 maxdiff 2.3）。 */
  const cr = new Float64Array(steps), ci = new Float64Array(steps);
  for (let k = 0; k < steps; k++){
    const ph = -val[k] * dt, cp = Math.cos(ph), sp = Math.sin(ph);
    const w0 = vec[0][k];
    for (let j = 0; j < steps; j++){ const vjk = vec[j][k] * w0; cr[j] += vjk * cp; ci[j] += vjk * sp; }
  }
  const outR = new Float64Array(dim), outI = new Float64Array(dim);
  for (let j = 0; j < steps; j++){
    const wr = nrm * cr[j], wi = nrm * ci[j];
    const vr = Vs[j], vi = Ws[j];
    for (let k = 0; k < dim; k++){
      outR[k] += wr * vr[k] - wi * vi[k];
      outI[k] += wr * vi[k] + wi * vr[k];
    }
  }
  return { re: outR, im: outI };
}

/* ---------- 对称矩阵**特征值**（Householder 三对角化 + 隐式 QL，O(n³/3)） ----------
   熵只需要 Gram 的谱、不需要特征向量，所以走「只求值」路径：比 jacobiEigen（每个 sweep
   都 O(n³)、要 40 个 sweep）快一到两个数量级——这是 L=12 静态档能做出来的前提
   （n=400 的块从 21 s 降到秒级；L=10 中心切点 401 ms → 十几毫秒）。
   算法：EISPACK tred2（不累积变换）+ tql2（不累积特征向量）。返回**未排序**的特征值。 */
function symEigVals(Ain){
  const n = Ain.length;
  const A = Array.from({ length: n }, (_, i) => Float64Array.from(Ain[i]));
  const d = new Float64Array(n), e = new Float64Array(n);
  const v = new Float64Array(n), w = new Float64Array(n);
  /* Householder：逐列把次对角以下清零，相似变换 P A P 保持谱 */
  for (let k = 0; k < n - 2; k++){
    let norm = 0;
    for (let i = k + 1; i < n; i++) norm += A[i][k] * A[i][k];
    norm = Math.sqrt(norm);
    d[k] = A[k][k];
    if (norm === 0){ e[k] = 0; continue; }
    const alpha = A[k + 1][k] >= 0 ? -norm : norm;
    e[k] = alpha;
    v.fill(0, k + 1, n);
    v[k + 1] = 1;
    const den = A[k + 1][k] - alpha;
    for (let i = k + 2; i < n; i++) v[i] = A[i][k] / den;
    let vv = 0;
    for (let i = k + 1; i < n; i++) vv += v[i] * v[i];
    for (let i = k + 1; i < n; i++){
      let acc = 0;
      const Ai = A[i];
      for (let j = k + 1; j < n; j++) acc += Ai[j] * v[j];
      w[i] = acc;
    }
    let vw = 0;
    for (let i = k + 1; i < n; i++) vw += v[i] * w[i];
    const c1 = 2 / vv, c2 = c1 * c1 * vw;
    for (let i = k + 1; i < n; i++){
      const vi = v[i], wi = w[i];
      for (let j = i; j < n; j++){
        const delta = c1 * (vi * w[j] + wi * v[j]) - c2 * vi * v[j];
        const s2 = A[i][j] - delta;
        A[i][j] = s2; A[j][i] = s2;
      }
    }
  }
  if (n >= 2){
    d[n - 2] = A[n - 2][n - 2];
    e[n - 2] = A[n - 1][n - 2];
  }
  d[n - 1] = A[n - 1][n - 1];
  e[n - 1] = 0;
  /* 隐式位移 QL（tql2，只求值）。deflation 判据必须带**矩阵量级**的绝对底：
     只看 |d[m]|+|d[m+1]| 时，零本征值处的 dd=0 ⟹ 判据永真不成立（秩亏 Gram 会死循环到迭代上限）。 */
  let anorm = 0;
  for (let i = 0; i < n; i++) anorm = Math.max(anorm, Math.abs(d[i]), Math.abs(e[i]));
  if (!Number.isFinite(anorm)) throw new Error('symEigVals: 矩阵含 NaN/Inf（多半是态向量与扇区不匹配）');
  const absTol = 1e-16 * (anorm || 1);
  for (let l = 0; l < n; l++){
    let iter = 0, m = l;
    for (;;){
      for (m = l; m < n - 1; m++){
        /* 相对判据 + 绝对底：Gram 是**秩亏**的（Schmidt 块的秩 ≤ 较小侧维数），
           严格判据 |e|+dd===dd 在秩亏块上永不清零 ⟹ 会耗尽迭代次数。 */
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= 1e-16 * dd + absTol) break;
      }
      if (m === l) break;
      if (iter++ === 200) throw new Error('symEigVals: 200 次 QL 迭代未收敛');
      let g = (d[l + 1] - d[l]) / (2 * e[l]);
      let r = Math.hypot(g, 1);
      g = d[m] - d[l] + e[l] / (g + (g >= 0 ? Math.abs(r) : -Math.abs(r)));
      let s = 1, c = 1, p = 0;
      let broke = false;
      for (let i = m - 1; i >= l; i--){
        const f = s * e[i], b = c * e[i];
        r = Math.hypot(f, g); e[i + 1] = r;
        if (r === 0){ d[i + 1] -= p; e[m] = 0; broke = true; break; }
        s = f / r; c = g / r; g = d[i + 1] - p;
        r = (d[i] - g) * s + 2 * c * b;
        p = s * r; d[i + 1] = g + p; g = c * r - b;
      }
      if (broke) continue;
      d[l] -= p; e[l] = g; e[m] = 0;
    }
  }
  return d;
}

/* ---------- 纠缠熵（任意切点，块对角 Schmidt 分解） ----------
   切点 cut 把链分成左 cut 格 / 右 L−cut 格。对 (k↑_L,k↓_L) 每个块：
   A[row=(lU,lD)][col=(rU,rD)]=ψ（Schmidt 矩阵），谱 = √(A A† 的本征值)。
   复矩阵的实嵌入 [[Re,−Im],[Im,Re]] 让每个本征值出现**两次**（排序后隔一取）。
   **取较小的一侧**：cut 偏离中心时对面块更小，AA† 与 A†A 非零谱相同 ⟹ 用
   n=min(nL,nR) 的 Gram 矩阵，靠边切点由数百毫秒降到亚毫秒级（S(x) 剖面靠这条）。
   cut=0 或 L 时有一侧为空 ⟹ S=0。 */
function hbEntropyAt(sec, re, im, cut){
  const { L, bu, bd, dd } = sec;
  if (!(cut > 0 && cut < L)) return { S: 0, spectrum: [], sum: 0 };
  const lowMask = (1 << cut) - 1;
  const blocks = new Map();
  for (let a = 0; a < bu.dim; a++){
    const mu = bu.masks[a], ml = mu & lowMask, mr = mu >> cut;
    for (let b = 0; b < bd.dim; b++){
      const k = a * dd + b;
      const p = re[k] * re[k] + im[k] * im[k];
      if (p < 1e-28) continue;
      const md = bd.masks[b], mdl = md & lowMask, mdr = md >> cut;
      const key = popcount(ml) + ',' + popcount(mdl);
      let blk = blocks.get(key);
      if (!blk){ blk = { lu: new Map(), ld: new Map(), ru: new Map(), rd: new Map(), entries: [] }; blocks.set(key, blk); }
      if (!blk.lu.has(ml)) blk.lu.set(ml, blk.lu.size);
      if (!blk.ld.has(mdl)) blk.ld.set(mdl, blk.ld.size);
      if (!blk.ru.has(mr)) blk.ru.set(mr, blk.ru.size);
      if (!blk.rd.has(mdr)) blk.rd.set(mdr, blk.rd.size);
      blk.entries.push([ml, mdl, mr, mdr, re[k], im[k]]);
    }
  }
  let S = 0;
  let spectrum = [];
  for (const blk of blocks.values()){
    const Lu = blk.lu.size, Ld = blk.ld.size, Ru = blk.ru.size, Rd = blk.rd.size;
    const nL = Lu * Ld, nR = Ru * Rd;
    /* 只在非零行/列上建稠密块（nL,nR ≤ C(L/2,·)²，L=10 时 ≤100） */
    const Ar = Array.from({ length: nL }, () => new Float64Array(nR));
    const Ai = Array.from({ length: nL }, () => new Float64Array(nR));
    for (const [ml, mdl, mr, mdr, ar, ai] of blk.entries){
      Ar[blk.lu.get(ml) * Ld + blk.ld.get(mdl)][blk.ru.get(mr) * Rd + blk.rd.get(mdr)] = ar;
      Ai[blk.lu.get(ml) * Ld + blk.ld.get(mdl)][blk.ru.get(mr) * Rd + blk.rd.get(mdr)] = ai;
    }
    /* Gram 取较小一侧：nL ≤ nR 用 A A†（行×行），否则用 A†A（列×列）。
       两者非零谱完全相同 ⟹ S 不变，cost 从 O(nL²·nR) 降到 O(n²·max(nL,nR))。 */
    const left = nL <= nR;
    const n = left ? nL : nR;
    const n2 = 2 * n;
    const M = Array.from({ length: n2 }, () => new Float64Array(n2));
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
      let rr = 0, ri = 0;
      if (left){
        for (let c = 0; c < nR; c++){
          rr += Ar[i][c] * Ar[j][c] + Ai[i][c] * Ai[j][c];
          ri += Ai[i][c] * Ar[j][c] - Ar[i][c] * Ai[j][c];
        }
      } else {
        for (let c = 0; c < nL; c++){
          rr += Ar[c][i] * Ar[c][j] + Ai[c][i] * Ai[c][j];
          ri += Ar[c][i] * Ai[c][j] - Ai[c][i] * Ar[c][j];
        }
      }
      M[i][j] = rr; M[i][j + n] = -ri; M[i + n][j] = ri; M[i + n][j + n] = rr;
    }
    const val = symEigVals(M);
    /* 只求特征值（不需要特征向量）⟹ symEigVals；实嵌入 [[Re,−Im],[Im,Re]] 的
       本征值 = ρ 的每个本征值**各二重**（不是折半！
       首版 val/2 再取前 nL：乘积态会得 Σλ=0.5、S=0.347 而非 0）。排序后隔一取
       即得物理谱；物理简并（自旋 SU(2)）会给出 4 重，隔一后仍恰为 2 重 ✓。 */
    const vals = Array.from(val).sort((a, b) => b - a);
    for (let i = 0; i < vals.length; i += 2){
      const lam = vals[i];
      if (lam > 1e-13){ S -= lam * Math.log(lam); spectrum.push(lam); }
    }
  }
  spectrum.sort((a, b) => b - a);
  return { S, spectrum: spectrum.slice(0, 12), sum: spectrum.reduce((a, b) => a + b, 0) };
}
/* 半链熵 = cut=L/2 的特例（L 偶数） */
function hbEntropy(sec, re, im){ return hbEntropyAt(sec, re, im, sec.L >> 1); }
/* 整条剖面 S(x)：x=0 与 x=L 没有切分 ⟹ S=0。L=8 全扫 ~40ms、L=10 ~0.6s ⟹ 页面渐进填充 */
function hbEntropyProfile(sec, re, im){
  const L = sec.L, out = new Float64Array(L + 1);
  for (let c = 1; c < L; c++) out[c] = hbEntropyAt(sec, re, im, c).S;
  return out;
}

/* ---------- 密度关联 ⟨n_i n_j⟩（对角观测量，无需跳跃，O(dim·(N↑+N↓)²)） ----------
   n_i = n_i↑+n_i↓ ∈ {0,1,2} ⟹ 对单个基底态 n_i n_j = cnt_i·cnt_j（i≠j），
   多体效应全在求和权重里。注意 ⟨n_i²⟩ = n_i + 2⟨n_i↑n_i↓⟩ ≠ n_i（与单粒子 ρ_ii 的区别）。 */
function hbDensityCorr(sec, re, im){
  const { L, bu, bd, dd } = sec;
  const C = new Float64Array(L * L);
  const cnt = new Int32Array(L);
  for (let a = 0; a < bu.dim; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < bd.dim; b++){
      const k = a * dd + b;
      const p = re[k] * re[k] + im[k] * im[k];
      if (p < 1e-30) continue;
      const md = bd.masks[b];
      let nn = 0;
      for (let i = 0; i < L; i++){
        const c = ((mu >> i) & 1) + ((md >> i) & 1);
        cnt[i] = c;
        if (c) nn++;
      }
      for (let i = 0; i < L; i++){
        const ci = cnt[i];
        if (!ci) continue;
        C[i * L + i] += p * ci * ci;
        for (let j = i + 1; j < L; j++){
          if (!cnt[j]) continue;
          const v = p * ci * cnt[j];
          C[i * L + j] += v; C[j * L + i] += v;
        }
      }
      void nn;
    }
  }
  return C;
}

/* ---------- 动量分布 n(k_m) = (1/L)Σ_ij e^{ik(i−j)}ρ_ij，k = 2πm/L ----------
   求和规则 Σ_m n(k_m) = Σ_i ρ_ii = N（测试用这条钉归一）。 */
function hbMomentumDist(rho, L, m){
  const { Cr, Ci } = rho;
  const k = 2 * Math.PI * m / L;
  let s = 0;
  for (let i = 0; i < L; i++){
    for (let j = 0; j < L; j++){
      const th = k * (i - j), c = Math.cos(th), sn = Math.sin(th);
      s += c * Cr[i][j] - sn * Ci[i][j];
    }
  }
  return s / L;
}

/* ---------- 单粒子密度矩阵 ρ_ij = Σ_σ ⟨c†_{iσ} c_{jσ}⟩（复；对角 = n_i） ----------
   约定：Cr/Ci 表示 ρ_ij = ⟨c†_i c_j⟩（**不是**转置），ρ† = ρ ⟹ Cr 对称、Ci 反对称；
   pot140 用「独立实现参考值 + 厄米性 + U=0 自由费米子解析式」三重校验这条约定。 */
function hbCorrelation(sec, re, im){
  const { L, bu, bd, dd } = sec;
  const Cr = Array.from({ length: L }, () => new Float64Array(L));
  const Ci = Array.from({ length: L }, () => new Float64Array(L));
  const hopOne = (mask, i, j) => {
    const bi = 1 << i, bj = 1 << j;
    if (!(mask & bj) || (mask & bi)) return null;
    const lo = Math.min(i, j), hi = Math.max(i, j);
    const mid = ((1 << hi) - 1) ^ ((1 << (lo + 1)) - 1);
    return [mask ^ bi ^ bj, (popcount(mask & mid) % 2) ? -1 : 1];
  };
  for (let a = 0; a < bu.dim; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < bd.dim; b++){
      const k = a * dd + b;
      const pr = re[k], pi = im[k], p = pr * pr + pi * pi;
      if (p < 1e-30) continue;
      const md = bd.masks[b];
      for (let i = 0; i < L; i++){
        if (mu & (1 << i)) Cr[i][i] += p;
        if (md & (1 << i)) Cr[i][i] += p;
      }
      for (let i = 0; i < L; i++) for (let j = 0; j < L; j++){
        if (i === j) continue;
        const hu = hopOne(mu, i, j);
        if (hu){
          const k2 = bu.index[hu[0]] * dd + b;
          /* ⟨n|c†_i c_j|m⟩ = sign ⟹ 贡献 ψ*_n ψ_m·sign */
          const sg = hu[1] * 1;
          Cr[i][j] += (pr * re[k2] + pi * im[k2]) * sg;
          Ci[i][j] += (pr * im[k2] - pi * re[k2]) * sg;
        }
        const hd = hopOne(md, i, j);
        if (hd){
          const k2 = a * dd + bd.index[hd[0]];
          const sg = hd[1] * 1;
          Cr[i][j] += (pr * re[k2] + pi * im[k2]) * sg;
          Ci[i][j] += (pr * im[k2] - pi * re[k2]) * sg;
        }
      }
    }
  }
  return { Cr, Ci };
}

/* ---------- 初态 ---------- */
/* 指定格点集合上的单一乘积态（左半链填充等） */
function hbInitProduct(sec, sitesU, sitesD){
  const { bu, bd } = sec;
  let mu = 0, md = 0;
  for (const i of sitesU) mu |= 1 << i;
  for (const i of sitesD) md |= 1 << i;
  const a = bu.index[mu], b = bd.index[md];
  const re = new Float64Array(sec.dim), im = new Float64Array(sec.dim);
  if (a < 0 || b < 0) return { re, im, ok: false };
  re[a * sec.dd + b] = 1;
  return { re, im, ok: true };
}

/* ---------- 最近邻键关联 J_i = Σ_σ Re⟨c†_{i+1} c_i⟩（L−1 个；动能分布） ----------
   只算键（而非全 L² 矩阵）：成本 dim×(L−1)×2，L=10 半满 63504 维 ~30–50ms，
   可每 20 帧刷新；全关联矩阵是 O(dim·L²)，L=10 会到 0.3s，本页不提供（诚实标注）。 */
function hbBondCorr(sec, re, im, t){
  const { L, bu, bd, dd } = sec;
  const out = new Float64Array(Math.max(0, L - 1));
  const hopOne = (mask, i, j) => {
    const bi = 1 << i, bj = 1 << j;
    if (!(mask & bj) || (mask & bi)) return null;
    const lo = Math.min(i, j), hi = Math.max(i, j);
    const mid = ((1 << hi) - 1) ^ ((1 << (lo + 1)) - 1);
    return [mask ^ bi ^ bj, (popcount(mask & mid) % 2) ? -1 : 1];
  };
  for (let a = 0; a < bu.dim; a++){
    const mu = bu.masks[a];
    for (let b = 0; b < bd.dim; b++){
      const k = a * dd + b;
      const pr = re[k], pi = im[k], p = pr * pr + pi * pi;
      if (p < 1e-30) continue;
      const md = bd.masks[b];
      for (let s = 0; s < L - 1; s++){
        const hu = hopOne(mu, s, s + 1);
        if (hu){
          const k2 = bu.index[hu[0]] * dd + b;
          out[s] += (pr * re[k2] + pi * im[k2]) * hu[1];
        }
        const hd = hopOne(md, s, s + 1);
        if (hd){
          const k2 = a * dd + bd.index[hd[0]];
          out[s] += (pr * re[k2] + pi * im[k2]) * hd[1];
        }
      }
    }
  }
  /* 关联 J 的符号约定：⟨c†_{i+1}c_i⟩ 的实部；乘 −t 即该键的动能贡献 */
  return out;
}

/* ---------- 残差 ‖Hψ − Eψ‖（收敛自检：L=12 静态档靠它说真话） ---------- */
function hbResidual(sec, re, im, t, U){
  const dim = sec.dim;
  const hr = new Float64Array(dim), hi = new Float64Array(dim);
  hbMatvec(sec, re, im, hr, hi, t, U);
  const E = hbEnergy(sec, re, im, t, U);
  let s = 0;
  for (let k = 0; k < dim; k++){
    const dr = hr[k] - E * re[k], di = hi[k] - E * im[k];
    s += dr * dr + di * di;
  }
  return Math.sqrt(s);
}

/* ---------- 淬变跑者：从乘积态出发按 exp(−iHt) 走，按时间采 S/D/E ----------
   页面「从初态演化」与 U/t 扫描共用同一条代码路径（一处物理，不会被两套实现拉偏）。
   `uOf(t)` 给协议用（U 随时间走）；`muOf(t)` 返回逐格 μ（也用于协议）。
   采样开销：S 走 hbEntropy（L=8 一次 ~50ms、L=10 ~140ms、L=12 ~2.8s）⟹ 采样间隔
   默认 0.5，L≥12 时调用方应把 sample 调大或关掉 S。 */
class HbQuenchRun {
  constructor(sec, re, im, opts = {}){
    this.sec = sec;
    this.re = Float64Array.from(re); this.im = Float64Array.from(im);
    this.t = opts.t ?? 1; this.dt = opts.dt ?? 0.1;
    this.tMax = opts.tMax ?? 10; this.sample = opts.sample ?? 0.5;
    this.U = opts.U ?? 4; this.uOf = opts.uOf || null; this.muOf = opts.muOf || null;
    this.mK = opts.mKrylov ?? 10;
    this.tcur = 0; this.nextT = this.sample; this.done = false;
    this.records = []; this.uNow = this.U; this.steps = 0;
    /* 先把 t=0 的初态记进去：淬变曲线必须包含起点（否则第一点已经是走了一步之后，
       像「奈尔态 D(0)=0.13」这种读数会莫名其妙） */
    this.records.push(this.measure());
  }
  step(n = 1){
    for (let k = 0; k < n && !this.done; k++){
      const U = this.uOf ? this.uOf(this.tcur) : this.U;
      if (this.muOf) hbSetField(this.sec, this.muOf(this.tcur));
      const o = hbKrylovExp(this.sec, this.re, this.im, this.t, U, this.dt, this.mK);
      this.re = o.re; this.im = o.im;
      this.tcur += this.dt; this.steps++; this.uNow = U;
      if (this.tcur + 1e-9 >= this.nextT){
        this.records.push(this.measure());
        this.nextT += this.sample;
      }
      if (this.tcur >= this.tMax - 1e-9)this.done = true;
    }
    return { done: this.done, t: this.tcur, samples: this.records.length };
  }
  measure(){
    const m = hbMeasure(this.sec, this.re, this.im);
    return {
      t: this.tcur, U: this.uNow, D: m.Dtot,
      E: hbEnergy(this.sec, this.re, this.im, this.t, this.uNow),
      S: hbEntropy(this.sec, this.re, this.im).S,
    };
  }
}

/* ---------- U/t 扫描：每个 U 先解基态（给 S_gs/D_gs），再从奈尔态淬变（给 S 饱和值/早窗斜率） ----------
   分片执行（step(budgetMs)），页面在帧里推 ⟹ 扫描期间 UI 不冻。
   诚实口径：早窗斜率 t≤L/3 的线性拟合（小系统很快饱和）；S_sat 取最后 25% 窗口均值。 */
class HbScanTask {
  constructor(sec, opts = {}){
    this.sec = sec;
    this.Us = opts.Us ?? [0, 1, 2, 3, 4, 6, 8];
    this.dt = opts.dt ?? 0.1;
    this.tMax = opts.tMax ?? 10;
    this.sample = opts.sample ?? 0.5;
    this.mK = opts.mKrylov ?? 10;
    this.gsM = opts.gsM ?? 60;
    this.gsMaxMemMB = opts.gsMaxMemMB ?? 640;
    this.idx = 0; this.phase = 'gs'; this.run = null; this.gs = null;
    this.results = []; this.done = this.Us.length === 0; this.ms = 0;
    this.pattern = opts.pattern || Int8Array.from({ length: sec.L }, (_, i) => (i % 2 === 0 ? 1 : 2));
  }
  get progress(){ return { idx: this.idx, n: this.Us.length, phase: this.phase, done: this.done }; }
  step(budgetMs = 20){
    const t0 = Date.now();
    while (!this.done && Date.now() - t0 < budgetMs){
      const U = this.Us[this.idx];
      if (this.phase === 'gs'){
        if (!this.gs){
          this.gs = new HbGsTask(this.sec, 1, U, { m: this.gsM, maxMemMB: this.gsMaxMemMB });
        }
        this.gs.step(4);
        if (this.gs.done){
          const w = { re: this.gs.re, im: this.gs.im };
          const mm = hbMeasure(this.sec, w.re, w.im);
          this.gsVals = {
            E: hbEnergy(this.sec, w.re, w.im, 1, U),
            D: mm.Dtot,
            S: hbEntropy(this.sec, w.re, w.im).S,
            res: hbResidual(this.sec, w.re, w.im, 1, U),
            m: this.gs.iter, mCapped: this.gs.mCapped,
          };
          const prod = hbProductFromPattern(this.sec, this.pattern);
          this.run = new HbQuenchRun(this.sec, prod.re, prod.im,
            { U, dt: this.dt, tMax: this.tMax, sample: this.sample, mKrylov: this.mK });
          this.phase = 'quench';
        }
      } else {
        this.run.step(1);
        if (this.run.done){
          this.results.push(this.reduce(U));
          this.gs = null; this.run = null; this.phase = 'gs'; this.idx++;
          if (this.idx >= this.Us.length) this.done = true;
        }
      }
    }
    return this.progress;
  }
  reduce(U){
    const rec = this.run.records;
    const L = this.sec.L;
    const tMax = rec.length ? rec[rec.length - 1].t : 0;
    const tail = rec.filter(r => r.t >= tMax * 0.75);
    const Ssat = tail.reduce((a, r) => a + r.S, 0) / Math.max(1, tail.length);
    const win = rec.filter(r => r.t <= L / 3);
    let slope = 0;
    if (win.length > 2){
      const n = win.length;
      const mx = win.reduce((a, r) => a + r.t, 0) / n, my = win.reduce((a, r) => a + r.S, 0) / n;
      let sxy = 0, sxx = 0;
      for (const r of win){ sxy += (r.t - mx) * (r.S - my); sxx += (r.t - mx) ** 2; }
      slope = sxx > 0 ? sxy / sxx : 0;
    }
    return {
      U, Ssat, slope,
      D: rec.length ? rec[rec.length - 1].D : NaN,
      E: rec.length ? rec[rec.length - 1].E : NaN,
      curve: rec.map(r => [r.t, r.S]),
      Sgs: this.gsVals.S, Dgs: this.gsVals.D, Egs: this.gsVals.E,
      res: this.gsVals.res, m: this.gsVals.m, mCapped: this.gsVals.mCapped,
    };
  }
}

/* ===== src/hubbard3d.js ===== */
/* hubbard3d.js — 哈伯德链的 3D 透视视图：相机 + 投影 + 拾取（纯数学，无 DOM / 无 canvas）
 *
 * 为什么单独一个模块：3D 的「对不对」是纯几何问题（正交基、透视缩放、深度排序、屏幕拾取），
 * 可以在 Node 里用解析式逐条对账（pot143），不必拖一个浏览器进来。页面只负责把算出来的
 * 屏幕坐标画成珠子/箭头/势刺。
 *
 * 坐标系（右手系）：
 *   x — 链的方向（格点 i 在 x_i 上，已归一化到固定跨度，见 hbSitePositions）
 *   y — 自旋：↑ 指向 +y，↓ 指向 −y
 *   z — 局域势 μ 的「出屏」方向：μ>0 沿 +z 长刺，μ<0 沿 −z（2D 视图里这条信息只能塞进一条色带）
 *
 * 相机：绕 y 轴 yaw、俯仰 pitch、到原点距离 dist。视线恒指原点（靶点在链中心）。
 */

const CAM_DEFAULT = { yaw: -0.62, pitch: 0.34, dist: 7.6 };
/* pitch 钳到 ±76°：再往上 up 向量就从世界 y 轴旁边擦过去，屏幕会翻面 */
const PITCH_LIM = 1.33;
const DIST_MIN = 3.2, DIST_MAX = 20;
/* 链在 3D 里的固定横向跨度（世界单位）：不同 L 都铺满画面宽度，只是格距变密 */
const CHAIN_SPAN = 6.0;

const clamp3 = (v, a, b) => (v < a ? a : (v > b ? b : v));

function hbCamDefault(){ return { ...CAM_DEFAULT }; }
function hbCamReset(){ return hbCamDefault(); }

/* 轨道旋转：dx/dy 是设备像素位移；pitch 钳制，yaw 不钳（2π 周期） */
function hbOrbit(cam, dx, dy, k = 0.0075){
  return {
    yaw: cam.yaw + dx * k,
    pitch: clamp3(cam.pitch + dy * k, -PITCH_LIM, PITCH_LIM),
    dist: cam.dist,
  };
}

/* f>1 拉远、f<1 推近（滚轮 deltaY 换算见页面） */
function hbZoom(cam, f){
  return { yaw: cam.yaw, pitch: cam.pitch, dist: clamp3(cam.dist * f, DIST_MIN, DIST_MAX) };
}

function hbEye(cam){
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return { x: cam.dist * cp * Math.sin(cam.yaw), y: cam.dist * sp, z: cam.dist * cp * Math.cos(cam.yaw) };
}

/* 视空间正交基（靶点 = 原点）：
     f = 视线方向 eye→靶点
     r = normalize(f × up)，up 取世界 +y
     u = r × f（屏幕向上）
   pitch 钳在 ±76° ⟹ |f×up| = cos(pitch) ≥ 0.24，不会退化。 */
function hbCamBasis(cam){
  const eye = hbEye(cam);
  const n = Math.hypot(eye.x, eye.y, eye.z) || 1;
  const f = { x: -eye.x / n, y: -eye.y / n, z: -eye.z / n };
  const rx = -f.z, rz = f.x;                 /* f × (0,1,0) = (−f.z, 0, f.x) */
  const rn = Math.hypot(rx, 0, rz) || 1;
  const r = { x: rx / rn, y: 0, z: rz / rn };
  const u = {                             /* r × f */
    x: r.y * f.z - r.z * f.y,
    y: r.z * f.x - r.x * f.z,
    z: r.x * f.y - r.y * f.x,
  };
  return { f, r, u, eye };
}

/* 焦距：按画布宽度定，保证 CHAIN_SPAN 的链在默认距离下左右各留 ~15% 余量 */
function hbFocal(W){ return 0.85 * W; }

/* 世界点 → 设备像素。k = 焦距/深度，用来缩放珠半径、线宽、箭头（透视缩放的唯一来源）。 */
function hbProject(cam, W, H, p){
  const { f, r, u, eye } = hbCamBasis(cam);
  const dx = p.x - eye.x, dy = p.y - eye.y, dz = p.z - eye.z;
  const depth = dx * f.x + dy * f.y + dz * f.z;
  const focal = hbFocal(W);
  const near = 1e-6;
  const d = Math.abs(depth) < near ? near : depth;
  return {
    x: W / 2 + (dx * r.x + dy * r.y + dz * r.z) / d * focal,
    y: H / 2 - (dx * u.x + dy * u.y + dz * u.z) / d * focal,
    depth: d,
    k: focal / d,
  };
}

/* 格点的世界 x：跨度固定、关于原点对称（mean(x)=0，span = CHAIN_SPAN） */
function hbSitePositions(L, span = CHAIN_SPAN){
  const out = [];
  const d = L > 1 ? span / (L - 1) : 0;
  for (let i = 0; i < L; i++) out.push(-span / 2 + i * d);
  return out;
}

/* 屏幕点 → 格点下标。命中半径内取屏幕距离最近者；等距时取更靠近相机的那颗
   （两颗珠子在屏幕上叠住时，看见的应该是前面那颗）。 */
function hbPick(cam, W, H, xs, sx, sy, rad){
  let best = -1, bd = Infinity, bz = Infinity;
  for (let i = 0; i < xs.length; i++){
    const p = hbProject(cam, W, H, { x: xs[i], y: 0, z: 0 });
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d > rad) continue;
    if (d < bd - 1e-9 || (Math.abs(d - bd) <= 1e-9 && p.depth < bz)){
      best = i; bd = d; bz = p.depth;
    }
  }
  return best;
}

/* 深度雾：把 [最近、最远] 归一化到 [0,1]（1 = 最近），页面用它给远处的珠子降透明度 */
function hbDepthRange(cam, W, H, xs){
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < xs.length; i++){
    const p = hbProject(cam, W, H, { x: xs[i], y: 0, z: 0 });
    if (p.depth < lo) lo = p.depth;
    if (p.depth > hi) hi = p.depth;
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-9) return { lo, hi, nearness: () => 1 };
  return {
    lo, hi,
    nearness: depth => clamp3(1 - (depth - lo) / (hi - lo), 0, 1),
  };
}

/* ============================================================================
 * hubbard.js（页面）— 格点费米-哈伯德**沙盒**：二次量子化 / 莫特 / 纠缠熵
 *
 * 纯 CPU、纯 2D canvas（无 WebGL）：态是固定粒子数基上的复向量。
 *
 * 【三种玩法】本页从「两个预设的演示」改成可直接动手的沙盒，物理量都画在
 * 格点链上，指针操作与主页同源（点=放、拖=画）：
 *   1. 初态工具：点格点循环 空→↑→↓→↑↓（右键反向）。点击立刻把该乘积态设成
 *      当前态并切到演化模式——粒子数变了就重建扇区（L=10 约 0.29s，给 toast）。
 *   2. 势笔刷：在链上横拖给每格写 μ_i（左键=吸引 μ<0、右键=排斥 μ>0）。外场
 *      **只进对角项**，所以画势不重建扇区、可以边拖边看密度流动。
 *   3. 擦除：把该格 μ_i 清零（整段清空用面板「清空场」）。
 *
 * 【两种模式】决定「谁是态」：
 *   gs  基态：H 一改（U/μ/L）就重解最低态，ψ 由求解器给。
 *   evo 演化：ψ 是当前初态，按 exp(−iHt) 自由演化；改 H 立刻生效（不重置 t）。
 * 预设只是「配方」：莫特=gs+U=4，猝变=evo+奈尔态。点初态格子会自动切到 evo，
 * 因为「你刚指定的 Fock 态」不可能是含场的基态。
 *
 * 绘图分层（自上而下）：格点卡片（↑/↓ 占据箭头、双占徽标、n_i）→ μ_i 带 →
 * 键关联 J_i 带 → 格点序号。拖动时被笔刷扫过的格点会高亮。
 *
 * 调试句柄 window.__hb（cdp139 用）：measures/entropy/step/setU/setL/solveNow/
 * gapNow/history/bond + 沙盒侧 clickSite/setTool/paint/mu/pat/mode/spec/applySpec/
 * siteAtX/view —— 全部确定性接口（不依赖 rAF 时序）。

const nf = (x, d = 4) => (Number.isFinite(x) ? x.toFixed(d) : '—');

/* 奈尔填充：偶数格 ↑、奇数格 ↓（↑ 用 1、↓ 用 2 的占据码） */
const neelPattern = L => Int8Array.from({ length: L }, (_, i) => (i % 2 === 0 ? 1 : 2));

class HubbardApp {

    /* Phase-3：协议 / 时间轴检查点 / U 扫描 */
    this.proto = null; this.protoSaved = null; this.protoStart = 0;
    this.cps = []; this.cpNext = 0; this.scrubIdx = -1;
    this.scan = null; this.scanRes = []; this.scanMetric = 'Ssat'; this.scanMs = 0;
    this.residual = null;

    this.container.innerHTML = `

</div>
<div id="hbPanel" class="panel qpanel">
  <div class="sec"><h3>预设</h3><div class="grid2" id="hbPresets">

  </div>
    <div class="grid2" style="margin-top:5px">

  <div class="sec"><h3>U/t 扫描</h3>

    <div class="grid4" style="margin-top:5px">
      ${HB_METRICS.map(m => '<button data-metric="' + m.k + '" class="sm" title="' + m.hint + '">' + m.name + '</button>').join('')}
    </div>
    <div class="row" style="margin-top:5px"><label>U 上限</label><input type="range" id="rUmax" min="2" max="8" step="1" value="${this.state.Umax}"><output id="oUmax">${this.state.Umax}</output></div>
  </div>
  <div class="sec"><h3>格点</h3><div class="grid3">
    <button data-L="8">L = 8</button><button data-L="10">L = 10</button><button data-L="12" class="sm">L = 12</button>
    </div>
    <div class="grid2" style="margin-top:5px">
    ${HB_PROJ.map(v => '<button data-proj="' + v.k + '" class="sm" title="' + v.tip + '">' + v.name + '</button>').join('')}
  </div></div>
  <div class="sec"><h3>参数</h3>
    <div class="row"><label>U / t</label><input type="range" id="rU" min="0" max="8" step="0.25" value="${this.state.U}"><output id="oU">${this.state.U.toFixed(2)}</output></div>
    <div class="row"><label>半链熵</label><span id="hbStat" style="font-size:10px;color:var(--cyan);font-family:var(--mono)">—</span></div>
  </div>
  <div class="sec"><h3>操作</h3><div class="grid2">
    <button id="hbPause">暂停</button><button id="hbStep">单步</button>
    <button id="hbReset">重置</button><button id="hbGap">算能隙</button>
    <button id="hbLink" class="sm">复制链接</button><button id="hbSave" class="sm">导出 JSON</button>
  </div>
    <div class="row" style="margin-top:5px"><label>时间轴</label><span id="hbScrubInfo">—</span></div>
    <div id="hbScrubRow" class="off"><input type="range" id="hbScrub" min="0" max="0" step="1" value="0"></div>
  </div>
</div>
<div id="hbHud" class="panel qhud">
  <div class="hrow"><span>模式</span><span id="hMode">—</span></div>
  <div class="hrow"><span>维度 C(L,N↑)C(L,N↓)</span><span id="hDim">—</span></div>
  <div class="hrow"><span>E / t</span><span id="hE">—</span></div>
  <div class="hrow"><span>势能 Σμ⟨n⟩</span><span id="hPot">—</span></div>
  <div class="hrow"><span>双占 D = Σ⟨n↑n↓⟩</span><span id="hD">—</span></div>
  <div class="hrow"><span>半链熵 S</span><span id="hS">—</span></div>
  <div class="hrow"><span>N↑ / N↓</span><span id="hN">—</span></div>
