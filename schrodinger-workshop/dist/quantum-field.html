uniform float uInvM;
{{UNIFORMS}}
vec4 S(vec2 p){ return texture(uPsi, clamp(p, vec2(0.0), vec2(1.0))); }
void main(){
  vec4 psi = S(vUv);
  /* 4 阶中心差分（与 TPL_REDUCE 的 dxp/dyp 逐字同款，2h 标度 ⟹ snippet 内
     0.5·Im(ψ*Δψ) 即 Im(ψ*∂ψ)，无需额外系数） */
  vec4 dxp = (S(vUv-vec2(2.0*uTexel.x,0.0)) - 8.0*S(vUv-vec2(uTexel.x,0.0))
            + 8.0*S(vUv+vec2(uTexel.x,0.0)) - S(vUv+vec2(2.0*uTexel.x,0.0)))/6.0;
  vec4 dyp = (S(vUv-vec2(0.0,2.0*uTexel.y)) - 8.0*S(vUv-vec2(0.0,uTexel.y))
            + 8.0*S(vUv+vec2(0.0,uTexel.y)) - S(vUv+vec2(0.0,2.0*uTexel.y)))/6.0;
  o = vec4({{CURRENT_X}}, {{CURRENT_Y}}, 0.0, 1.0);
}`;

/* ---------- 概率流归约（R61）：32^2 MRT 三 RGBA32F ----------
   o0：(ΣJx, ΣJy, ΣdivJ, Σρ)
   o1：(左通量, 右通量, 下通量, 上通量)（界面 J·n 求和）
   o2：(max|J|, Σ|J|, 0, 0)
   divJ 用 **2 阶中心差分**（非 4 阶）：4 阶 stencil 的域内求差不望远镜
   （ΣdivJ₄阶 = (1/6)[−13J(0)+J(1)−J(g−2)+13J(g−1)]，恒非零）；2 阶 +
   CLAMP_TO_EDGE 精确望远镜：ΣdivJ ≡ fr−fl+ft−fb（1D 推演
   Σ_i(J(i+1)−J(i−1))/2 = J(g−1)−J(0)）。Gauss 残差
   (ΣdivJ − 边界通量和) 因此为 float 舍入量级——实现自校验锚点。
   墙边界诚实性：顶点 J 的面通量与 Dirichlet 精确 link 流（恒 0）有 O(h)
   差；室内波包两者均≈0（连续性紧密），撞墙时 ΣdivJ 显示瞬时面通量而
   dP/dt≈0——CDP 断言只针对室内波包的紧密连续性。
   分块界守卫：g<256 时 8×8 块会越出格点（vUv*32 映射假设 g=256），
   显式 continue——不继承 TPL_REDUCE 对「钳制读边值≈0」的脆弱依赖。 */
const TPL_JRED = `#version 300 es
precision highp float;
in vec2 vUv;
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
layout(location=2) out vec4 o2;
uniform sampler2D uJ;
uniform sampler2D uPsi;
uniform float uGrid;
{{UNIFORMS}}
void main(){
  vec2 base = floor(vUv*32.0)*8.0;
  float g = uGrid;
  float sjx=0.0, sjy=0.0, sdj=0.0, sp=0.0;
  float fl=0.0, fr=0.0, fb=0.0, ft=0.0;
  float mj=0.0, saj=0.0;
  for(int j=0;j<8;j++){
    for(int i=0;i<8;i++){
      ivec2 ij = ivec2(base)+ivec2(i,j);
      if(ij.x >= int(g) || ij.y >= int(g)) continue;
      vec2 uv = (vec2(ij)+0.5)/g;
      vec2 J = texture(uJ, uv).rg;
      vec4 psi = texture(uPsi, uv);
      float p = {{DENSITY}};   /* 片段引用 psi（2D 内核约定，见 TPL_BOHM_STEP）——
                                     不可包成 den(vec4 c)：c 与片段变量名不符致编译失败 */
      vec2 Jxp = texture(uJ, uv+vec2(1.0/g,0.0)).rg;
      vec2 Jxm = texture(uJ, uv-vec2(1.0/g,0.0)).rg;
      vec2 Jyp = texture(uJ, uv+vec2(0.0,1.0/g)).rg;
      vec2 Jym = texture(uJ, uv-vec2(0.0,1.0/g)).rg;
      float dj = 0.5*(Jxp.x-Jxm.x) + 0.5*(Jyp.y-Jym.y);
      sjx += J.x; sjy += J.y; sdj += dj; sp += p;
      float mag = length(J);
      mj = max(mj, mag); saj += mag;
      if(ij.x==0) fl += J.x;
      if(ij.x==int(g)-1) fr += J.x;
      if(ij.y==0) fb += J.y;
      if(ij.y==int(g)-1) ft += J.y;
    }
  }
  o0 = vec4(sjx,sjy,sdj,sp);
  o1 = vec4(fl,fr,fb,ft);
  o2 = vec4(mj,saj,0.0,0.0);
}`;

/* ---------- Bohm 轨迹步进（R61）：64×1 viewport，RG32F ping-pong ----------
   制导速度 v = J/max(ρ, floor)（Bohm 力学一阶形式；floor 防节点除零——
   节点附近轨迹无定义，钳制后穿节点而过）。步长钳制 uMaxStep（防大 J 跳格）；
   出界 ⟹ 停泊 (−1,−1)（显示侧按 p.x<0 剔除）。
   ψ/J 采样用手动 bilerp（4 NEAREST fetch）——规避 32F 线性滤波对
   OES_texture_float_linear 的依赖。jTex 与 psiTex 同尺寸 ⟹ 共用 uTexel。 */
const TPL_BOHM_STEP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uPos;
uniform sampler2D uJ;
uniform sampler2D uPsi;
uniform vec2 uTexel;
uniform float uInvGrid;  /* 1/g：J 为格点动量通量（v=J/ρ 是格点速度），位置是 uv ⟹ 步长 ×1/g */
uniform float uDt;
uniform float uRhoFloor;
uniform float uMaxStep;
{{UNIFORMS}}
vec4 bilerp(sampler2D t, vec2 uv, vec2 texel){
  vec2 f = fract(uv/texel - 0.5) - 0.5;
  vec2 base = (uv/texel - 0.5 - f)*texel;
  vec4 a = texture(t, base);
  vec4 b = texture(t, base+vec2(texel.x,0.0));
  vec4 c = texture(t, base+vec2(0.0,texel.y));
  vec4 d = texture(t, base+texel);
  return mix(mix(a,b,f.x+0.5), mix(c,d,f.x+0.5), f.y+0.5);
}
void main(){
  float fi = floor(gl_FragCoord.x);
  vec2 p = texture(uPos, vec2((fi+0.5)/64.0, 0.5)).rg;
  if(p.x < 0.0){ o = vec4(p, 0.0, 1.0); return; }
  vec2 J = bilerp(uJ, p, uTexel).rg;
  vec4 psi = bilerp(uPsi, p, uTexel);
  float rho = {{DENSITY}};
  /* v = J/ρ 为格点速度（平面波 ψ=e^{ik·x_t} ⟹ v=k/m）；×uInvGrid 换算 uv */
  vec2 d = J/max(rho, uRhoFloor)*uDt*uInvGrid;
  float dl = length(d);
  if(dl > uMaxStep) d *= uMaxStep/dl;
  vec2 q = p + d;
  if(q.x<0.0||q.x>1.0||q.y<0.0||q.y>1.0) q = vec2(-1.0,-1.0);
  o = vec4(q, 0.0, 1.0);
}`;

/* 默认像素着色：色相 = 相位 arg(ψ)（取第一复分量），亮度 = 概率密度 */
const DEFAULT_PIXEL_COLOR = 'hsv2rgb(vec3(atan(psi.y,psi.x)/6.2831853+0.5,0.80,1.0))';

/* 默认均值动量片段（复标量；dxp/dyp 为 2∂ψ，故 ×0.5 得 Im(ψ*∂ψ)=|ψ|²∂_xφ）：
   pairs=1 取唯一复分量；pairs=2 两复分量求和（总动量）。 */
const DEFAULT_PMEAN = {
  1: { x: '0.5*(psi.x*dxp.y-psi.y*dxp.x)', y: '0.5*(psi.x*dyp.y-psi.y*dyp.x)',
       z: '0.5*(psi.x*dzp.y-psi.y*dzp.x)' },
  2: { x: '0.5*((psi.x*dxp.y-psi.y*dxp.x)+(psi.z*dxp.w-psi.w*dxp.z))',
       y: '0.5*((psi.x*dyp.y-psi.y*dyp.x)+(psi.z*dyp.w-psi.w*dyp.z))',
       z: '0.5*((psi.x*dzp.y-psi.y*dzp.x)+(psi.z*dzp.w-psi.w*dzp.z))' },
};

/* ---------- 基类：给出全部默认值，子类按需覆盖 ---------- */
class PhysicsKernel {
  constructor(){
    this.id = 'base';
    this.name = '量子';
    this.equation = '';
    this.pairs = 1;                 /* 复分量对数：1=RG32F，2=RGBA32F */
    this.spinReadout = false;       /* 自旋读数能力（Pauli）：HUD 自旋区 + __app.spin */
  }
  makeWave(){ throw new Error('kernel.makeWave not implemented'); }
  shaders(){ throw new Error('kernel.shaders not implemented'); }
  presets(){ return {}; }
  defaults(){ return {}; }          /* 并入 state 的内核私有参数（如 NLS 的 g） */
  /* 面板附加控件：{ html, rows:[{id,out,key,fmt,after?}] }；
     签名 extraControls(reinit, refreshParamHud)——引擎注入行为回调，rows 的
     after 按参数语义选用（初相类用 reinit，参数派生 HUD 用 refreshParamHud）。 */
  extraControls(){ return null; }
  setUniforms(gl, prog, state){ /* 内核私有 uniform；program 无此 uniform 时 WebGL 静默 no-op */ }
  applyParams(qp, state){ /* URL 参数扩展 */ }
  eMaxExtra(state){ return 0; }     /* H 特征值上界的附加项（非线性项等） */
  /* 解析能级阶梯（可选）：仅对有解析谱的场景返回，见契约第 5 项 */
  energyLevels(state){ return null; }
  /* 透射率扫描解析模型（可选）：{ T(E,V0,a), convolved(kx,dk,V0,a) }，
     无模型返回 null（引擎隐藏扫描面板）。见契约第 6 项。 */
  transmissionModel(state){ return null; }
  /* 均值动量片段（可选覆盖）：默认复标量 Im(ψ*∂ψ)（pairs 感知，见 DEFAULT_PMEAN）。
       不确定原理 HUD 的 ⟨p⟩ 来源；多分量/耦合内核可改（如相对论性动量）。 */
  pmeanSnippets(){
    const d = DEFAULT_PMEAN[this.pairs] || DEFAULT_PMEAN[1];
    return { pmeanX: d.x, pmeanY: d.y, pmeanZ: d.z };
  }
  /* 概率流密度片段（R61）：J = (1/m)·Im(ψ*∇ψ)（复标量，ℏ=1）。引擎单位制：
     格点坐标 x_t = w·g，∂_{x_t} = dxp/2（dxp 为 2∂_wψ 差分，dxp.y 即 Im 分量），
     PMEANX = ⟨p_x⟩ 密度 = Im(ψ*∂_{x_t}ψ) ⟹ J_x = (1/m)·PMEANX。
     平面波校验：ψ=e^{ik·x_t} ⟹ PMEANX=k、J_x=k/m = 相速度，正确。
     一阶内核（Dirac）覆写为 ψ†σ_kψ 双线性型（无 1/m 因子，见 dirac.js）。 */
  currentSnippets(){
    const pm = this.pmeanSnippets();
    return {
      jx: 'uInvM*(' + pm.pmeanX + ')',
      jy: 'uInvM*(' + pm.pmeanY + ')',
      jz: 'uInvM*(' + pm.pmeanZ + ')',
    };
  }
  cpuDensity(buf, i){ return buf[i]*buf[i] + buf[i+1]*buf[i+1]; } /* 调试句柄用 */
}

/* ---------- 注册表 ---------- */
const registry = new Map();
/* ---------- 对称矩阵 Jacobi 对角化（Lanczos 三对角块用；就地 A）----------
   m 很小（≤120）⟹ 稠密 Jacobi 足够（比 tqli 好调试）。返回本征值 + 本征向量
   （vecs 的第 i 列为第 i 个本征向量，按**原序**，调用方自行排序）。 */
function jacobiSym(A, m){
  const V = new Float64Array(m*m);
  for (let i = 0; i < m; i++) V[i*m + i] = 1;
  for (let sw = 0; sw < 80; sw++){
    let off = 0;
    for (let p = 0; p < m; p++) for (let q = p + 1; q < m; q++) off += A[p*m + q]*A[p*m + q];
    if (off < 1e-26) break;
    for (let p = 0; p < m - 1; p++){
      for (let q = p + 1; q < m; q++){
        const apq = A[p*m + q];
        if (Math.abs(apq) < 1e-300) continue;
        const th = (A[q*m + q] - A[p*m + p])/(2*apq);
        const t = (th >= 0 ? 1 : -1)/(Math.abs(th) + Math.sqrt(th*th + 1));
        const c = 1/Math.sqrt(t*t + 1), s = t*c;
        for (let k = 0; k < m; k++){                 /* 列旋转 */
          const kp = A[k*m + p], kq = A[k*m + q];
          A[k*m + p] = c*kp - s*kq;
          A[k*m + q] = s*kp + c*kq;
        }
        for (let k = 0; k < m; k++){                 /* 行旋转 */
          const pk = A[p*m + k], qk = A[q*m + k];
          A[p*m + k] = c*pk - s*qk;
          A[q*m + k] = s*pk + c*qk;
        }
        for (let k = 0; k < m; k++){                 /* 累积特征向量 */
          const kp = V[k*m + p], kq = V[k*m + q];
          V[k*m + p] = c*kp - s*kq;
          V[k*m + q] = s*kp + c*kq;
        }
      }
    }
  }
  const vals = new Float64Array(m);
  for (let i = 0; i < m; i++) vals[i] = A[i*m + i];
  return { vals, vecs: V };
}

/* ---------- 腔压缩：把腔内格点压成紧凑索引 ----------
   为什么必须压缩（两次实测的教训）：
   ① 直接用「V=1 高墙 + 全 65k 自由度」的 H 做 Lanczos，谱宽被墙能级拉到 0..9，
      而 E₁≈9e-4 ⟹ 条件数 1e4；实测 m=128 时第 16 个 Ritz 值仍差 20 倍
      （0.148 vs 7.9e-3），**完全没收敛**；
   ② 压缩到腔内 + 边界 Dirichlet（邻居越界取 0）后，H 只剩格点动能谱宽 2，
      自由度降到 nc（256² 的 stadium 15792、128² 3960）⟹ 同样的 m 收敛快得多。
   与 V=1 墙的物理差：墙内穿透 e^{−κd}≈1e-5 被显式丢弃——对 E≪1 的低能态无差别。 */
function cavityCompress(n, insideFn){
  const N = n*n;
  const idx = new Int32Array(N).fill(-1);
  let nc = 0;
  for (let y = 0; y < n; y++){
    for (let x = 0; x < n; x++) if (insideFn(x + 0.5, y + 0.5)) idx[y*n + x] = nc++;
  }
  const nb = new Int32Array(nc*4);
  for (let y = 0; y < n; y++){
    for (let x = 0; x < n; x++){
      const a = idx[y*n + x];
      if (a < 0) continue;
      nb[a*4]   = x + 1 < n ? idx[y*n + x + 1] : -1;
      nb[a*4 + 1] = x > 0 ? idx[y*n + x - 1] : -1;
      nb[a*4 + 2] = y + 1 < n ? idx[(y + 1)*n + x] : -1;
      nb[a*4 + 3] = y > 0 ? idx[(y - 1)*n + x] : -1;
    }
  }
  return { idx, nb, nc };
}

/* 共轭梯度解 (H+ε)x=b（H 正定：Dirichlet 动能）。tol 相对 b 的 2 范数。 */
function cgSolve(op, b, x, nc, eps, tol, maxit){
  const r = new Float64Array(nc), p = new Float64Array(nc), Ap = new Float64Array(nc);
  for (let i = 0; i < nc; i++) x[i] = 0;
  op(x, Ap);
  for (let i = 0; i < nc; i++) r[i] = b[i] - Ap[i] - eps*x[i];
  p.set(r);
  let rs = 0, b2 = 0;
  for (let i = 0; i < nc; i++){ rs += r[i]*r[i]; b2 += b[i]*b[i]; }
  const thr = tol*tol*b2;
  let it = 0;
  for (; it < maxit; it++){
    if (rs < thr) break;
    op(p, Ap);
    let pap = 0;
    for (let i = 0; i < nc; i++){ Ap[i] += eps*p[i]; pap += p[i]*Ap[i]; }
    if (!(Math.abs(pap) > 1e-300)) break;
    const al = rs/pap;
    for (let i = 0; i < nc; i++){ x[i] += al*p[i]; r[i] -= al*Ap[i]; }
    let rs2 = 0;
    for (let i = 0; i < nc; i++) rs2 += r[i]*r[i];
    const be = rs2/rs; rs = rs2;
    for (let i = 0; i < nc; i++) p[i] = r[i] + be*p[i];
  }
  return it;
}

/* ---------- shift-invert Lanczos：求 H 最小的 nev 个本征对 ----------
   算子 B=(H+ε)⁻¹ 的**最大**本征值对应 H 的最小本征值，且特征值被拉开
   （λ→1/(λ+ε)）⟹ m≈40 就收敛到 1e-12（直接 Lanczos 要 m≈800）。
   每步一次 CG（约 200 次 H 作用）；两遍全重正交。
   返回 { evals(升序), evecs[压缩空间], resid, mK, cgAvg }。 */
function lanczosShiftInvert(op, nc, nev, mK, eps){
  const Q = new Float64Array(mK*nc), alpha = new Float64Array(mK), beta = new Float64Array(mK);
  const x = new Float64Array(nc), rhs = new Float64Array(nc);
  let seed = 123456789;
  for (let i = 0; i < nc; i++){
    seed = (Math.imul(seed, 1103515245) + 12345) | 0;
    Q[i] = (seed >>> 0)/4294967296 - 0.5;
  }
  let nrm = 0;
  for (let i = 0; i < nc; i++) nrm += Q[i]*Q[i];
  nrm = Math.sqrt(nrm) || 1;
  for (let i = 0; i < nc; i++) Q[i] /= nrm;
  const iters = [];
  let used = 0, cgAvg = 0;
  for (let j = 0; j < mK; j++){
    const jb = j*nc;
    for (let i = 0; i < nc; i++) rhs[i] = Q[jb + i];
    iters.push(cgSolve(op, rhs, x, nc, eps, 1e-11, 4000));
    let a = 0;
    for (let i = 0; i < nc; i++) a += Q[jb + i]*x[i];
    alpha[j] = a;
    for (let i = 0; i < nc; i++) x[i] -= a*Q[jb + i];
    if (j > 0){
      const bm = beta[j-1], pb = (j-1)*nc;
      for (let i = 0; i < nc; i++) x[i] -= bm*Q[pb + i];
    }
    for (let pass = 0; pass < 2; pass++){
      for (let k = 0; k <= j; k++){
        const kb = k*nc;
        let d = 0;
        for (let i = 0; i < nc; i++) d += Q[kb + i]*x[i];
        if (d !== 0) for (let i = 0; i < nc; i++) x[i] -= d*Q[kb + i];
      }
    }
    let bn = 0;
    for (let i = 0; i < nc; i++) bn += x[i]*x[i];
    bn = Math.sqrt(bn);
    beta[j] = bn; used = j + 1;
    if (bn < 1e-12) break;                       /* 不变子空间 */
    const nb2 = (j + 1)*nc;
    for (let i = 0; i < nc; i++) Q[nb2 + i] = x[i]/bn;
  }
  cgAvg = iters.length ? iters.reduce((p, q) => p + q, 0)/iters.length : 0;
  const m = used;
  const T = new Float64Array(m*m);
  for (let i = 0; i < m; i++){
    T[i*m + i] = alpha[i];
    if (i + 1 < m){ T[i*m + i + 1] = beta[i]; T[(i+1)*m + i] = beta[i]; }
  }
  const { vals, vecs } = jacobiSym(T, m);
  /* B 的最大本征值 ⟹ H 的最小本征值（升序取前 nev） */
  const order = Array.from({ length: m }, (_, i) => i).sort((p, q) => vals[q] - vals[p]);
  const nOut = Math.min(nev, m);
  const evals = new Float64Array(nOut), evecs = [], resid = [];
  for (let t = 0; t < nOut; t++){
    const col = order[t];
    const v = new Float64Array(nc);
    for (let j = 0; j < m; j++){
      const c = vecs[j*m + col];
      if (c === 0) continue;
      const jb2 = j*nc;
      for (let i = 0; i < nc; i++) v[i] += c*Q[jb2 + i];
    }
    let nn = 0;
    for (let i = 0; i < nc; i++) nn += v[i]*v[i];
    nn = Math.sqrt(nn) || 1;
    for (let i = 0; i < nc; i++) v[i] /= nn;
    const lam = 1/vals[col] - eps;
    const hv = new Float64Array(nc);
    op(v, hv);
    let rs = 0;
    for (let i = 0; i < nc; i++){ const d = hv[i] - lam*v[i]; rs += d*d; }
    evals[t] = lam; evecs.push(v); resid.push(Math.sqrt(rs));
  }
  return { evals, evecs, resid, mK: m, cgAvg };
}

/* ==========================================================================
 * R64/R65 共享线性谱求解器（引擎层：所有标量内核都能用）
 *
 * why 放这里：R64 弹球的 ⟨r⟩ 与 R65 双阱的 ΔE 都需要「同一离散口径的前几个
 * 本征对」。放在内核里会导致 GP 拿不到（R65 首次实现就踩了：dwSpectrum 调用
 * this.kernel.spectrum，而 spectrum 只定义在薛定谔内核上 ⟹ 静默返回 null）。
 *
 * 算法 = 腔压缩（只保留支撑区，边界 Dirichlet）+ shift-invert Lanczos
 * （B=(H+ε)⁻¹，CG 内解）。两条实测理由见 cavityCompress / lanczosShiftInvert
 * 的注释：直接 Lanczos 在 V=1 全网格上 m=128 仍差 20 倍。
 *
 * 入参：{ n, m, nev, eps, vCut, V? , inside? }
 *   · V：全长 Float64Array(N)，支撑区 = V<vCut（默认 0.5）；
 *   · inside：回调 (x,y)=>bool（texel 中心坐标），与 V 二选一（弹球的解析几何走这条）。
 * 返回 { evals(升序, Float64Array), evecs(全长 N 的 Float64Array 数组), resid, mK, cgAvg, nc }。
 * ========================================================================== */
function linearSpectrum(opts){
  const n = opts.n, N = n*n, m = opts.m, uK = 0.5/m;
  const vCut = opts.vCut === undefined ? 0.5 : opts.vCut;
  let inside = opts.inside, V = opts.V || null;
  if (!inside){
    inside = (x, y) => {
      const i = Math.min(N - 1, Math.floor(y)*n + Math.floor(x));
      return V[i] < vCut;
    };
  }
  const { idx, nb, nc } = cavityCompress(n, inside);
  if (!nc) return { evals: new Float64Array(0), evecs: [], resid: [], mK: 0, cgAvg: 0, nc: 0 };
  let Va = null;
  if (V){
    Va = new Float64Array(nc);
    for (let i = 0; i < N; i++){ const a = idx[i]; if (a >= 0) Va[a] = V[i]; }
  }
  const op = (src, dst) => {
    for (let a = 0; a < nc; a++){
      const i0 = nb[a*4], i1 = nb[a*4 + 1], i2 = nb[a*4 + 2], i3 = nb[a*4 + 3];
      const c = src[a];
      const xp = i0 >= 0 ? src[i0] : 0, xm = i1 >= 0 ? src[i1] : 0;
      const yp = i2 >= 0 ? src[i2] : 0, ym = i3 >= 0 ? src[i3] : 0;
      dst[a] = -uK*(xp + xm + yp + ym - 4*c) + (Va ? Va[a]*c : 0);
    }
  };
  const nev = opts.nev || 10;
  const r = lanczosShiftInvert(op, nc, nev, Math.max(nev*4, 40), opts.eps || 1e-4);
  const evecs = r.evecs.map(v => {
    const full = new Float64Array(N);
    for (let i = 0; i < N; i++){ const a = idx[i]; if (a >= 0) full[i] = v[a]; }
    return full;
  });
  return { evals: r.evals, evecs, resid: r.resid, mK: r.mK, cgAvg: r.cgAvg, nc };
}

function registerKernel(k){ registry.set(k.id, k); }
function getKernel(id){ return registry.get(id) || registry.get('schrodinger'); }
function kernelIds(){ return [...registry.keys()]; }

/* ---------- 着色器装配：模板 + 内核片段 → 三个可编译 program 源码 ---------- */
function buildShaders(kernel){
  const s = kernel.shaders();
  const need = { LOCAL_H: s.localH, DENSITY: s.density, KINETIC: s.kinetic, POTENTIAL: s.potential };
  for (const [k, v] of Object.entries(need)){
    if (typeof v !== 'string' || !v.trim()) throw new Error('kernel "' + kernel.id + '" missing shader snippet: ' + k);
  }
  /* KINETIC_E / KIN_SCALE / HELPERS：可选覆盖（一阶内核 Dirac 用）。
     KINETIC_E = 演化模板的动能项（默认 -uK*lap，即标量拉普拉斯路径逐字不变）；
     KIN_SCALE = reduce 模板动能密度的系数（默认 uK = 1/2m；Dirac 的 α·p 动能
     无 1/2m 因子，覆写为 1.0）；
     HELPERS = TPL_EVOLVE 的函数定义注入点（S/rot4/ang/wrapPi 之后、main 之前，
     可引用全部引擎 helper）——kineticE 需要语句（多采样 + 分支）而不能是单一
     表达式时在此定义函数。默认 ''，标量内核路径零改动。 */
  const opt = { KINETIC_E: s.kineticE || '-uK*lap', KIN_SCALE: s.kinScale || 'uK', HELPERS: s.helpers || '' };
  /* 内核私有 uniform 声明（如 NLS: 'uniform float uG;'）——注入三个模板的 uniform 区，
     由 kernel.setUniforms() 逐帧赋值；program 中未引用时被编译器优化掉，取值返回 null。 */
  const uni = s.uniforms || '';
  const pm = kernel.pmeanSnippets();
  /* R61：概率流片段（默认 (1/m)·PMEAN；Dirac 等一阶内核覆写） */
  const cur = kernel.currentSnippets();
  const fill = (tpl, map) => {
    /* 重复 token 守卫：fill() 是全局替换，模板注释里误写 {{TOKEN}} 会把片段源码
       注入注释、片段内部的注释结束符会提前关闭外层注释，致函数体半沉成活代码
       （R33 CDP 实测：TPL_CN_SWEEP 注释内的 {{CN_LOCAL_SOLVE}} 引发
       'h'/'Bz' undeclared 崩错）。构建期拒绝重复注入位，杜绝该类静默损坏。 */
    const counts = {};
    for (const m of tpl.matchAll(/\{\{(\w+)\}\}/g)) counts[m[1]] = (counts[m[1]] || 0) + 1;
    for (const k in counts) if (counts[k] > 1)
      throw new Error('template token {{' + k + '}} appears ' + counts[k] + ' times (duplicate injection point)');
    return tpl.replace(/\{\{(\w+)\}\}/g, (m, k) => {
      if (!(k in map)) throw new Error('unknown template token: ' + k);
      return map[k];
    });
  };
  const out = {
    evolve: fill(TPL_EVOLVE, { ...need, ...opt, UNIFORMS: uni, LAP_BLOCK: TPL_LAP_BLOCK,
      /* R63 规范帧 ADI 定制分支的动能/局部项 token（TPL_EVOLVE 主路径之外的两个
         注入位；fill() 重复注入位守卫要求一模板内同名 token 仅出现一次 ⟹ 加
         _X/_Y 后缀，取值与主路径的 KINETIC_E/LOCAL_H 完全同源） */
      KINETIC_E_X: opt.KINETIC_E, LOCAL_H_X: s.localH,
      KINETIC_E_Y: opt.KINETIC_E, LOCAL_H_Y: s.localH }),
    display: fill(TPL_DISPLAY, {
      DENSITY: s.density,
      PIXEL_COLOR: s.pixelColor || DEFAULT_PIXEL_COLOR,
      UNIFORMS: uni,
      HSV: SNIP_HSV,
    }),
    reduce: fill(TPL_REDUCE, { ...need, ...opt, UNIFORMS: uni, PMEANX: pm.pmeanX, PMEANY: pm.pmeanY }),
    scale: TPL_SCALE,
    /* R69 纯退相位（T₂）逐 texel 随机相位 pass（γ_φ≠0 时帧末跑）：位置基白噪声，
       无 {{}} token，直接源码。与 scale（T₁ 耗散，改变 |ψ|²）本质不同——
       dephase 只乘单位根 e^{iφ}，|ψ|² 逐点严格不变。 */
    dephase: TPL_DEPHASE,
    /* R61 概率流：jField（ψ → RG32F J 场）+ jRed（通量/散度归约 MRT）+
       bohmStep（64 粒子制导速度步进）。token 唯一性由 fill() 守卫保证。 */
    jField: fill(TPL_JFIELD, { UNIFORMS: uni, CURRENT_X: cur.jx, CURRENT_Y: cur.jy }),
    jRed: fill(TPL_JRED, { UNIFORMS: uni, DENSITY: s.density }),
    bohmStep: fill(TPL_BOHM_STEP, { UNIFORMS: uni, DENSITY: s.density }),
  };
  /* CN 积分器路径（kernel.integrator==='cn'，Dirac/Pauli）：两个额外 program，
     shaders() 返回的对象即 {evolve, display, reduce, scale, cnRhs, cnSweep}。
     app.js 按 sh.cnRhs 是否存在决定编译与 evolveCN 分支。
     cnLocalSolve（必填，缺失即构建失败）：局部块 (I−h·Gloc)⁻¹ 的闭式解——
     注入 TPL_CN_SWEEP 的函数 vec4 cnLocalSolve(vec4 arg, float V)，可引用模板
     uniform（uDtHalf/uK/uTexel）与 {{UNIFORMS}}/{{HELPERS}} 注入的私有内容。
     Dirac 给 βm+V 对角 2×2 块；Pauli 给 σ·B 的 Cayley 全 4×4 块（R33）。 */
  if (kernel.integrator === 'cn'){
    if (typeof s.cnLocalSolve !== 'string' || !s.cnLocalSolve.trim())
      throw new Error('kernel "' + kernel.id + '" (integrator=cn) missing shader snippet: cnLocalSolve');
    out.cnRhs = fill(TPL_CN_RHS, { ...need, ...opt, UNIFORMS: uni, LAP_BLOCK: TPL_LAP_BLOCK });
    out.cnSweep = fill(TPL_CN_SWEEP, { ...need, ...opt, UNIFORMS: uni, LAP_BLOCK: TPL_LAP_BLOCK, CN_LOCAL_SOLVE: s.cnLocalSolve });
  }
  /* 3D 路径（kernel.dim3=true，R34）：evolve3d（7 点拉普拉斯 KDK）+ display3d
     （volume ray-march）+ reduce3d（全卷 GPU 归约）。pot3 = 解析势表达式
     （变量 w=p−0.5 世界坐标）；density3/phase3 = 体积密度/相位（标量默认
     dot(c.xy,c.xy)/atan(c.y,c.x)）；kinetic3 = 3D 动能密度（默认前向链路式，
     与内核 moments3d 的 CPU 口径一致，供双测量对账）。
     app.js 按 sh.evolve3d 是否存在决定编译 3D program 与 evolve3d 分支。 */
  if (kernel.dim3){
    out.evolve3d = fill(TPL_EVOLVE3D, {
      UNIFORMS: uni, POT3: s.pot3 || '0.0', HELPERS: s.helpers || '',
      LAP3D_BLOCK: TPL_LAP3D_BLOCK,
    });
    out.display3d = fill(TPL_DISPLAY3D, {
      UNIFORMS: uni,
      DENSITY3: s.density3 || 'dot(c.xy,c.xy)',
      PHASE3: s.phase3 || 'atan(c.y, c.x)',
      HSV: SNIP_HSV,
    });
    /* R58 3D 耗散缩放 pass（γ≠0 时帧末跑）：无 {{}} token，直接源码。 */
    out.scale3d = TPL_SCALE3D;
    out.reduce3d = fill(TPL_REDUCE3D, {
      UNIFORMS: uni,
      DENSITY3: s.density3 || 'dot(c.xy,c.xy)',
      POT3: s.pot3 || '0.0',
      KINETIC3: s.kinetic3 || 'dot(dxp,dxp)+dot(dyp,dyp)+dot(dzp,dzp)',
      /* HELPERS（R41）：pot3 需函数定义时在此注入——R41 把单槽势抽成
         pot3Slot() 供两槽叠加，reduce3d 的 ⟨V⟩ 归约必须与 evolve3d 同源 */
      HELPERS: s.helpers || '',
    });
    /* 3D CN（R36）：内核提供 cnLocalSolve3 ⟺ 挂载 CN 路径。与 2D CN 的
       kernel.integrator 内核级开关不同，3D 是运行时切换（state.integrator3，
       面板/URL，默认 'kdk'）——故此处按 snippet 存在性装配，app.js 按
       sh.cnRhs3d 是否存在决定编译与 evolveCN3d 分支；无该 snippet 的 dim3
       内核装配结果与 R34/R35 逐字一致（零回归）。 */
    if (typeof s.cnLocalSolve3 === 'string' && s.cnLocalSolve3.trim()){
      out.cnRhs3d = fill(TPL_CN_RHS3D, { UNIFORMS: uni, POT3: s.pot3 || '0.0', HELPERS: s.helpers || '', LAP3D_BLOCK: TPL_LAP3D_BLOCK });
      out.cnSweep3d = fill(TPL_CN_SWEEP3D, { UNIFORMS: uni, POT3: s.pot3 || '0.0', HELPERS: s.helpers || '', CN_LOCAL_SOLVE3: s.cnLocalSolve3, LAP3D_BLOCK: TPL_LAP3D_BLOCK });
    }
    /* R61 3D 概率流：逐层 J 场（RGBA32F）+ 线性分块归约（前向差 divJ 望远镜）。
       2D/3D 共用 currentSnippets() 表达式（dxp 均约定为 2∂）。 */
    out.jField3 = fill(TPL_JFIELD3, { UNIFORMS: uni, CURRENT_X: cur.jx, CURRENT_Y: cur.jy, CURRENT_Z: cur.jz });
    out.jRed3 = fill(TPL_JRED3, { UNIFORMS: uni, DENSITY3: s.density3 || 'dot(c.xy,c.xy)' });
  }
  return out;
}

/* 导出模板仅供测试/文档引用（生产路径经 buildShaders 消费） */
const TEMPLATES = { TPL_EVOLVE, TPL_EVOLVE3D, TPL_CN_RHS3D, TPL_CN_SWEEP3D, TPL_DISPLAY3D, TPL_REDUCE3D, TPL_SCALE3D, TPL_DEPHASE, SNIP_HSV, TPL_CN_RHS, TPL_CN_SWEEP, TPL_DISPLAY, TPL_REDUCE, TPL_SCALE, TPL_LAP_BLOCK, TPL_LAP3D_BLOCK, DEFAULT_PIXEL_COLOR, DEFAULT_PMEAN, TPL_JFIELD, TPL_JRED, TPL_BOHM_STEP, TPL_JFIELD3, TPL_JRED3 };

/* ===== src/physics/barrier3d.js ===== */
/* ============================================================================
 * 球形势垒 s 波透射模型（3D 扫描的解析对照，barrier.js 的 3D 对应物）
 *
 * 物理：l=0（迎头）径向方程 u''+k²u=0（垒外）/ u''+q²u=0（垒内），
 * u=r·R 且 u(0)=0（原点正则）⟹ 球垒的 s 波透射与「全宽 2R 的 1D 势垒
 * 偶宇称 sector」严格同解：
 *     T = 1/(1 + V0²·sin²(q·R)/(4E(E−V0)))          E > V0
 *     T = 1/(1 + V0²·sinh²(κ·R)/(4E(V0−E)))         E < V0（κ=kOf(V0−E)）
 * 共振（T=1）条件 q·R = nπ ⟹ V0_n = E − 2·sin²(nπ/(2R))/m。
 *
 * 色散口径（与引擎逐字一致，R29 既定约定）：
 *     E(k) = 2·sin²(k/2)/m        （5 点/7 点 stencil 沿轴离散色散；
 *                                   3D 7 点沿轴特征值 = 2uK(2−cos k)，同型）
 *     kOf(E) = 2·asin(√(mE/2))    （反解；E≥2/m 时截到带顶 π）
 * uK=0.5/m 由引擎 evolve 路径给出（app.js「const k = 0.5/this.state.m」）。
 *
 * 诚实边界（文档化，不装作精确）：
 *   · 模型是**平面波 s 波**；实测波包有 Δk 轴向展宽（convolved 已按高斯
 *     谱卷积）与**横向动量展宽**（耦合 l≥1 分波，未建模）⟹ 对照目标是
 *     「包络 + 共振峰位置」，不是点值相等。
 *   · 横向展宽使实测峰值低于平面波 T=1，峰位略有偏移——验证判据用
 *     卷积模型的峰位（数值扫描求得），容差按扫描步宽设。
 *   · 横向展宽的**主导效应是「绕球透射」**：碰撞参数 b>R 的波包份额根本不
 *     撞球（经典射线全额透射），使实测 3D T 系统性**高于** s 波曲线，且
 *     V0 越大高出越多（s 波衰减而绕球份额不变）。rayCorrected 给出这一
 *     偏移的经典射线估计（近似，见该函数注）；扫描图叠三条参考曲线。
 * ========================================================================== */
function sphericalBarrierModel3(m){
  /* k(E)：能量→格点波数（离散色散反解；E≤0 为 0，E≥2/m 为带顶 π） */
  const kOf = E => {
    if (!(E > 0)) return 0;
    const s = m*E/2;
    return s >= 1 ? Math.PI : 2*Math.asin(Math.sqrt(s));
  };
  const E = k => 2*Math.sin(k/2)*Math.sin(k/2)/m;
  const T = (Ec, V0, R) => {
    if (!(V0 > 0)) return 1;          /* 无势垒：全透射 */
    if (!(Ec > 0)) return 0;
    const d = V0 - Ec;
    if (Math.abs(d) < 1e-12) return 1/(1 + V0*V0*m*R*R/(2*Ec));
    if (d < 0){
      const q = kOf(Ec - V0);
      return 1/(1 + V0*V0*Math.sin(q*R)*Math.sin(q*R)/(4*Ec*(Ec - V0)));
    }
    const ka = kOf(d);
    return 1/(1 + V0*V0*Math.sinh(ka*R)*Math.sinh(ka*R)/(4*Ec*d));
  };
  /* Δk 卷积期望（Simpson，±5dk，401 点）：轴向谱高斯权重的平均透射率。
     注意：只卷轴向 k；横向展宽的 l≥1 效应不在内（见文件头诚实边界）。 */
  const convolved = (kx, dk, V0, R) => {
    if (!(V0 > 0)) return 1;
    if (!(dk > 0)) return T(E(kx), V0, R);
    const N = 400, span = 5*dk;
    let sum = 0, wsum = 0;
    for (let i = 0; i <= N; i++){
      const k = kx - span + 2*span*i/N;
      const w = Math.exp(-((k - kx)/dk)*((k - kx)/dk)/2);
      const wt = (i === 0 || i === N) ? 1 : (i%2 ? 4 : 2);
      sum += wt*w*T(E(k), V0, R); wsum += wt*w;
    }
    return sum/wsum;
  };
  /* 共振峰位（T=1 的 V0 列表）：q·R = nπ 且 q 在导带内（q ≤ π）。
     返回 [{n, v0, ratio}]（ratio = v0/Ec）。 */
  const resonances = (Ec, R) => {
    const out = [];
    const kTop = kOf(Ec);
    for (let n = 1; n*Math.PI/R <= kTop + 1e-12; n++){
      const q = n*Math.PI/R;
      const v0 = Ec - 2*Math.sin(q/2)*Math.sin(q/2)/m;
      if (v0 > 0) out.push({ n, v0, ratio: v0/Ec });
    }
    return out;
  };
  /* 卷积模型的峰位（数值扫描：在 [lo,hi] 上以 step 分辨率求局部极大）。
     用于验证判据——实测峰应对齐卷积模型的峰（而非平面波 T=1 的理想位），
     因为 Δk 展宽会把峰推离理想位。 */
  const convolvedPeaks = (kx, dk, R, lo, hi, step) => {
    const f = v => convolved(kx, dk, v, R);
    const pts = [];
    for (let v = lo; v <= hi + 1e-12; v += step){
      pts.push({ v, t: f(v) });
      if (pts.length > 2){
        const a = pts[pts.length-3], b = pts[pts.length-2], c = pts[pts.length-1];
        if (b.t >= a.t && b.t >= c.t && b.t > 0.05) pts[pts.length-2].peak = true;
      }
    }
    return pts.filter(p => p.peak).map(p => p.v);
  };
  /* 经典射线修正（R38；**近似模型**，诚实边界见下）：
       T_3d(V0) ≈ f_miss + (1 − f_miss)·T_s_conv(V0)
     物理：入射波包有横向高斯展宽，飞到球垒时横向宽度 σ⊥(t_c)（自由色散
     σ⊥=σ0√(1+(t_c/t_d)²)，t_d=2mσ0²）；碰撞参数 b>R 的份额「绕球」全额
     透射（经典射线），b<R 的份额按 s 波迎头透射。碰撞时刻取波包中心抵达
     垒远面 t_c=(|x0|+R)/v_g（v_g=sin(kx)/m 为 kx 处群速度）。
     诚实边界：经典射线无衍射（球缘半影、grazing 射线的离心抑制不在内）；
     t_c 的取法有 t1..t3（近面/球心/远面）的模糊带；实测还另有「色散尾未
     过门」的小亏量（高 T 端 ~5-8%）。⟹ 用途是解释「实测 3D T 系统性高于
     s 波曲线」的偏移量级并给出包络，不是精确点值。 */
  const rayCorrected = (kx, sigma, V0, R, x0) => {
    if (!(V0 > 0)) return 1;
    const vg = Math.sin(kx) / m;            /* kx 处群速度（世界单位/时间单位） */
    const td = 2 * m * sigma * sigma;       /* 自由色散时标 */
    const tc = (Math.abs(x0) + R) / vg;     /* 中心抵达垒远面 */
    const sPerp = sigma * Math.sqrt(1 + (tc / td) * (tc / td));
    const fMiss = Math.exp(-(R * R) / (2 * sPerp * sPerp));
    const dk = 1 / (Math.SQRT2 * sigma);
    return fMiss + (1 - fMiss) * convolved(kx, dk, V0, R);
  };
  return { T, E, kOf, convolved, resonances, convolvedPeaks, rayCorrected };
}

/* ===== src/physics/schrodinger3d.js ===== */
/* ============================================================================
 * 薛定谔 3D 内核（R34 #34）：iħ∂ψ/∂t = −ħ²/2m ∇²ψ + V(r)ψ，体积求解 + 解析势
 *
 * 与 2D 薛定谔内核（schrodinger.js）的分工：
 *   - 2D 内核的势来自 256² 势场画布纹理（笔刷可画）；3D 无势纹理（笔刷工具
 *     不适用体积），势由本文件经 kernel.shaders().pot3 注入**解析表达式**，
 *     预设（球垒 / 谐振子 / 氢原子 / 双缝墙）即不同的势形 + 初态组合。
 *   - 引擎装配（buildShaders）在 kernel.dim3=true 时生成 evolve3d /
 *     display3d 两个 program（TPL_EVOLVE3D/TPL_DISPLAY3D），引擎走 evolve3d
 *     分支（每子步 3 个全卷 pass × 逐层 draw）与 volume ray-march 显示。
 *   - 2D 片段（localH/density/kinetic/potential）仍须提供——buildShaders
 *     对全部内核一律要求（2D program 也会被编译，dim3 运行时不被引用）。
 *
 * 单位约定（与引擎全路径一致）：格点（texel）单位、ℏ=1、m=state.m。
 *   uK = 1/(2m)；KDK 子步 dt_sub=1.2/sub；simTime 单位为帧时间（dt=1.2/帧）。
 *   3D 7 点拉普拉斯谱半径 12（2D 5 点为 8）⟹ 引擎 eMax = uK·12+1+eMaxExtra。
 *
 * pot3 ↔ pot3JS 镜像契约（重要）：GLSL 解析势 pot3（shaders().pot3）与 CPU
 * 端 pot3JS（moments3d 的 V 期望值用）必须逐分支一致——前者是 GPU 演化用的
 * 势，后者是 HUD/调试读数的能量分解。两者由同一组 uniform（uPotKind/uPotV0/
 * uPotR/uPotW/uPotZ）与同一套分支结构描述；改其一必须同步另一个。势形：
 *   kind 0 自由     ：V = 0
 *   kind 1 球势垒   ：V = |w|<R ? V0 : 0（球心 = 域中心 w=0）
 *   kind 2 谐振子   ：V = ½ω²|w|²（ℏω=ω；基态 σ=1/√ω，ω=1/64 ⟹ σ=8 texel）
 *   kind 3 氢原子   ：V = −Z/max(|w|, 0.5)（软化库仑：r<½ texel 钳位防奇点，
 *                     |V|≤2Z；1s: ψ∝e^{−Zr}, E=−Z²/2；2p_z: ψ∝z·e^{−Zr/2},
 *                     E=−Z²/8）
 *   kind 4 双缝墙（R39）：V = V0 当且仅当 |w.x−x₀|<T/2（墙厚 T，垂直 x 轴、z 向无限）
 *                     且在两条缝外（|w.y∓D/2|>W/2，缝宽 W、缝距 D、对称分布于
 *                     y=±D/2）——物质波双缝干涉的体积版。D=0 退化为单缝（缝宽 W）。
 *                     墙厚内衰减 exp(−2κT)，κ=acosh(1+m(V0−E))；默认 V0=3、
 *                     T=4 ⟹ 漏墙 ~1e-7（不透明）。V0 远高于入射能量时注意
 *                     eMaxExtra 抬子步（dt·E≤2 稳定界）。
 *   w = (p−0.5)·N 为世界坐标（格点单位、居中，p 为纹理坐标）——与
 *   TPL_EVOLVE3D 的 uGrid3 口径逐字一致。
 *   R44 势刷：上述解析势之外，交互放置的势丘与主槽、第二槽三者之和
 *   进入 pot3/pot3JS。
 *   R49 体积连续笔刷：势丘由单丘（R44 的 potBX/BY/BZ/BR/BV0 五字段）
 *   升级为**丘列表** state.potBlobs（≤16 个 {x,y,z,r,v0}）——拖拽连续
 *   涂抹（相邻 stamp 中心距 ≥0.6R 时落新丘，球链重叠 ⟹ 视觉连续），
 *   GLSL blobSum 循环求和、CPU pot3Blobs 逐字镜像。空列表恒 0 ⟹ 与
 *   R44 单丘关闭态逐位一致；融合语义 = 求和（重叠处强度相加）。
 *   R60 形状扩展（椭球 + 高斯软化边）：丘字段扩为
 *   {x,y,z,r,v0,rx,ry,rz,soft}——rx/ry/rz 为椭球三轴半轴（= r·轴比，
 *   相等 ⟹ 球），soft 为高斯软化宽度（0 = 硬边；>0 时归一化椭球距离
 *   dn≤1 内恒 1、dn>1 外按 exp(−(dn−1)²/2soft²) 衰减）。**零回归契约**：
 *   soft=0 且三轴=r 时 GLSL/JS 同构走 R49 逐字硬边判据 ⟹ 逐位一致
 *   （统一 exp 公式在 soft=0 时边界带非逐位等价，故采显式三分支，
 *   详见 pot3Blobs 处注释）。旧存档五字段丘经 normBlob 归为球+硬边。
 *
 * 边界（与 2D 不同，如实标注）：3D 纹理 CLAMP_TO_EDGE ⟹ Neumann 零梯度
 * （波包触壁软反射）；2D 的 S() 越界返回 0 是 Dirichlet。有界势（谐振子/
 * 氢原子）场景 Neumann 更物理；自由传播下波包抵达墙前应已充分衰减
 * （默认预设的 σ/k 组合保证）。
 *
 * 初态（makeWave3d，CPU 端生成，引擎负责归一化）：
 *   kind 'gaussian'  ：env·e^{i(k·d)}（d 为到波包中心的世界位移）
 *   kind 'ground'    ：ψ = e^{−Z·r}（实；1s 近似本征态，验证驻波稳定性）
 *   kind 'orbital2p' ：ψ = z_w·e^{−Z·r/2}（实；z=0 节面，上下瓣相位差 π，
 *                      相位着色下呈互补双色瓣——arg(ψ) 直接可视化的范例）
 *
 * 积分器（R36 #34 backlog ②）：本内核同时提供 KDK（TPL_EVOLVE3D，速度 Verlet）
 * 与 CN（TPL_CN_RHS3D/TPL_CN_SWEEP3D，Crank-Nicolson + block-Jacobi）两条路径，
 * 运行时由 state.integrator3 切换（面板「积分器」下拉 / URL ?int3=，默认 'kdk'）。
 * 标量 3D 的 KDK 并无缺陷（R34 已验证 P/E 守恒）——CN 的价值在于 Cayley 矩阵
 * 严格正交（范数机器精度守恒、无条件稳定），且二者可在同一预设下对照运行
 * （教学演示：积分器离散误差的量级差异）。CN 的局部块闭式解由本文件经
 * shaders().cnLocalSolve3 注入（(1+i·h·V)⁻¹，见下）。
 *
 * 3D 透射率扫描（R38 #34 backlog ④）：s 波球势垒模型 transmissionModel3
 * （barrier3d.js）——与 2D 矩势垒 transmissionModel 平行，引擎据此挂载
 * 3D 扫描面板（secScan3）；共振条件 q·R=nπ 提供峰位验证判据。无自旋读数；
 * CPU 密度取前两通道（pairs=1，基类默认即正确）。
 * ========================================================================== */

/* 势形编号（state.potKind；预设 params 注入，URL/面板可改） */
const POT_FREE = 0, POT_SPHERE = 1, POT_OSC = 2, POT_COULOMB = 3, POT_DOUBLE_SLIT = 4;

/* CPU 端解析势（pot3 的 JS 镜像——镜像契约见文件头）：
   w 为世界坐标（格点单位、居中）；返回 V（格点单位）。
   导出供测试 harness 做「GPU 演化 vs CPU 镜像」对账（R36 起）。

   R41 双槽叠加：pot3Slot 为单槽势（参数显式传入，不读 state），pot3JS 返回
   主槽 + 第二槽之和（总势）。potKind2=0（默认 POT_FREE）时第二槽恒 0 ⟹
   与 R34–R40 逐位一致（零回归）。CPU 与 GLSL pot3Slot 逐分支同构。

   R44/R49/R60 势刷（笔刷势丘）：pot3Blobs 为交互放置的势丘**列表**
   ——丘列表由 3D 视图「势刷」工具拖拽连续涂抹写入 state.potBlobs
   （≤16 个 {x,y,z,r,v0,rx,ry,rz,soft}；R49 由 R44 单丘五字段升级，
   R60 再加椭球三轴 rx/ry/rz 与软化宽度 soft）。与主槽、第二槽三者
   之和（融合语义：丘重叠处强度/权重相加）。空列表恒 0 ⟹ 与
   R34–R44 关闭态逐位一致。强度可负（势阱）或正（势垒）；丘与球势垒
   （kind 1）同构，KDK 无特殊处理。GLSL blobSum 与 CPU pot3Blobs
   逐分支一致（镜像契约见文件头；soft=0 球路径逐字复刻 R49）。 */
function pot3Slot(wx, wy, wz, kind, v0, r, om, z, wallX, wallT, slitW, slitD){
  const r2 = wx*wx + wy*wy + wz*wz;
  if (kind === POT_SPHERE) return r2 < r*r ? v0 : 0;
  if (kind === POT_OSC) return 0.5*om*om*r2;
  if (kind === POT_COULOMB) return -z/Math.max(Math.sqrt(r2), 0.5);
  /* 双缝墙（R39）：墙在 x=wallX（厚 wallT），两条缝 |w.y|=slitD/2
     （各宽 slitW）——与 pot3 GLSL 分支逐字一致（镜像契约见文件头） */
  if (kind === POT_DOUBLE_SLIT){
    if (Math.abs(wx - wallX) < 0.5*wallT &&
        Math.abs(wy - 0.5*slitD) > 0.5*slitW &&
        Math.abs(wy + 0.5*slitD) > 0.5*slitW) return v0;
    return 0;
  }
  return 0;
}

/* 笔刷势丘列表（R44 单丘 → R49 连续涂抹丘列表 ⟹ R60 椭球+软化）：
   丘字段 {x,y,z,r,v0,rx,ry,rz,soft}（世界 texel）：
     r           主半径（面板「势丘半径」滑块，链间距阈值的口径）
     rx/ry/rz    椭球三轴半轴（= r·轴比；相等 ⟹ 球）
     soft        高斯软化宽度（0 = 硬边；>0 时 dn≤1 内恒 1、
                 dn>1 外按 exp(−(dn−1)²/2soft²) 衰减，dn 为归一化
                 椭球距离 sqrt((dx/rx)²+(dy/ry)²+(dz/rz)²)）
   缺字段丘（R49 旧存档/程序化注入）经 normBlob 归一为球+硬边。
   v0=0 的项恒 0（导入容错）。空列表恒 0。GLSL blobSum 与本函数
   逐分支同构（镜像契约见文件头）。

   R60 零回归契约：soft=0 且 rx=ry=rz=r 时走 R49 逐字硬边判据
   dot(d,d)<r*r（内 v0·1.0=v0、外 v0·0.0 加法中性 ⟹ 逐位一致）。
   注意统一公式 exp(−½·max(0,dn−1)²/max(soft²,1e-12)) 在 soft=0 时
   **并非** float 逐位等价：texel 恰在 dn=1（如 (8,0,0) vs r=8）时
   硬边判 64<64 为假（外），而 dn≤1 分支为真（内），且 dn−1 落在
   (3e-10,1e-5) 边界带时 w∈(0,1) 既非 0 亦非 1——故 GLSL/JS 同构
   采三分支显式处理，零回归路径逐字复刻 R49 表达式。 */
const MAX_BLOBS = 16;
/* 丘字段归一（R60）：缺/非正轴回落 r（球）、缺/负软化回落 0（硬边）——
   R49 五字段旧丘与程序化注入的统一入口；stamp/导入/构造三处写边界调用，
   物理读取路径（pot3Blobs/setUniforms）因此可直接读全字段（与 GLSL
   uniform 数组全字段同构，无 JS 侧特判）。 */
function normBlob(b){
  const r = b.r;
  const ax = v => (typeof v === 'number' && isFinite(v) && v > 0) ? v : r;
  return {
    x: b.x, y: b.y, z: b.z, r, v0: b.v0,
    rx: ax(b.rx), ry: ax(b.ry), rz: ax(b.rz),
    soft: (typeof b.soft === 'number' && isFinite(b.soft) && b.soft >= 0) ? b.soft : 0,
  };
}
function pot3Blobs(wx, wy, wz, list){
  let s = 0;
  if (!list) return 0;
  for (let i = 0; i < list.length; i++){
    const b = list[i];
    if (!b || !b.v0) continue;
    const dx = wx - b.x, dy = wy - b.y, dz = wz - b.z;
    let wgt;
    if (b.soft > 0){
      /* 高斯软化边：归一化椭球距离 dn；内（dn≤1）恒 1，外指数衰减 */
      const qx = dx/Math.max(b.rx, 1e-6), qy = dy/Math.max(b.ry, 1e-6), qz = dz/Math.max(b.rz, 1e-6);
      const dn = Math.sqrt(qx*qx + qy*qy + qz*qz);
      const e = Math.max(dn - 1, 0);
      wgt = Math.exp(-0.5*e*e/Math.max(b.soft*b.soft, 1e-12));
    } else if (b.rx === b.r && b.ry === b.r && b.rz === b.r){
      /* R49 逐字硬边球（零回归路径：与 R49 pot3Blobs 同一表达式） */
      wgt = (dx*dx + dy*dy + dz*dz < b.r*b.r) ? 1 : 0;
    } else {
      /* 硬边椭球：归一化平方距离 < 1 */
      const qx = dx/Math.max(b.rx, 1e-6), qy = dy/Math.max(b.ry, 1e-6), qz = dz/Math.max(b.rz, 1e-6);
      wgt = (qx*qx + qy*qy + qz*qz < 1) ? 1 : 0;
    }
    s += b.v0*wgt;
  }
  return s;
}

function pot3JS(wx, wy, wz, st){
  return pot3Slot(wx, wy, wz, st.potKind, st.potV0, st.potR, st.potW, st.potZ,
    st.potWallX, st.potWallT, st.potSlitW, st.potSlitD)
    + pot3Slot(wx, wy, wz, st.potKind2, st.potV02, st.potR2, st.potW2, st.potZ2,
      st.potWallX2, st.potWallT2, st.potSlitW2, st.potSlitD2)
    + pot3Blobs(wx, wy, wz, st.potBlobs);
}

/* 单槽势在域内的 |V| 上界（格点单位）——R41 拆出供两槽求和。
   slot=2 时读第二槽参数（potV02/potR2/…）。叠加势的 |V|max ≤ 两槽上界之和
   （保守上界：只在两槽各自极值同点位时取等；稳定界保守化 ⟹ 子步增加）。 */
function eMaxSlot(kind, st, slot){
  const v0 = slot === 2 ? st.potV02 : st.potV0;
  const r = slot === 2 ? st.potR2 : st.potR;
  const om = slot === 2 ? st.potW2 : st.potW;
  const z = slot === 2 ? st.potZ2 : st.potZ;
  if (kind === POT_SPHERE) return Math.abs(v0 || 0);
  if (kind === POT_OSC){
    /* 域角 |w|max = √3·N/2 ⟹ Vmax = ½ω²·3·(N/2)² */
    return 0.5*(om || 0)*(om || 0)*3*Math.pow(st.grid/2, 2);
  }
  if (kind === POT_COULOMB) return 2*Math.abs(z || 0);   /* 软化核 |V|≤Z/0.5 */
  if (kind === POT_DOUBLE_SLIT) return Math.abs(v0 || 0);  /* 墙全高 V0 */
  return 0;
}

class Schrodinger3dKernel extends PhysicsKernel {
  constructor(){
    super();
    this.id = 'schrodinger3d';
    this.name = '薛定谔 3D';
    this.equation = '<b>SCHRÖDINGER 3D</b> · <i>i</i>ħ ∂ψ/∂t = −ħ²/2m ∇²ψ + V(<b>r</b>)ψ · 体积 ray-march';
    this.pairs = 1;
    this.dim3 = true;                 /* 引擎装配 evolve3d/display3d + 3D 帧路径 */
  }

  /* ---------- 初态：makeWave3d(n, opts) → { data, sum } ----------
     data：n³×2 Float32Array（RG32F：Re/Im 交错，索引 ((z·n+y)·n+x)·2，
     与 texImage3D 的数据布局（x 最快）一致）。
     opts：{ fx,fy,fz（波包中心，世界分数 0..1）, kx,ky,kz（格点单位波数）,
             sigma（gaussian 包宽，texel）, kind（'gaussian'|'ground'|'orbital2p'）,
             z（库仑核电荷，ground/orbital2p 用） }
     sum：原始总范数 Σ|ψ|²（引擎归一化到 1）。 */
  makeWave3d(n, o){
    const kind = o.kind || 'gaussian';
    const sigma = o.sigma === undefined ? 6 : o.sigma;
    const Z = o.z === undefined ? 0.25 : o.z;
    const kx = o.kx || 0, ky = o.ky || 0, kz = o.kz || 0;
    /* 世界坐标（格点单位、居中）：texel (x,y,z) 中心 = (idx+0.5−n/2) */
    const cx = (o.fx === undefined ? 0.3 : o.fx)*n, cy = (o.fy === undefined ? 0.5 : o.fy)*n, cz = (o.fz === undefined ? 0.5 : o.fz)*n;
    const data = new Float32Array(n*n*n*2);
    let sum = 0;
    for (let z=0; z<n; z++){
      const wz0 = z + 0.5 - n/2;                 /* 相对域中心的世界 z */
      for (let y=0; y<n; y++){
        const wy0 = y + 0.5 - n/2;
        for (let x=0; x<n; x++){
          const wx0 = x + 0.5 - n/2;
          const i = ((z*n + y)*n + x)*2;
          let re, im;
          if (kind === 'ground'){
            const r = Math.sqrt(wx0*wx0 + wy0*wy0 + wz0*wz0);
            re = Math.exp(-Z*r); im = 0;          /* 1s：实、球对称 */
          } else if (kind === 'orbital2p'){
            const r = Math.sqrt(wx0*wx0 + wy0*wy0 + wz0*wz0);
            re = wz0*Math.exp(-Z*r/2); im = 0;    /* 2p_z：实、z=0 节面 */
          } else {
            const dx = wx0 - (cx - n/2), dy = wy0 - (cy - n/2), dz = wz0 - (cz - n/2);
            const env = Math.exp(-(dx*dx + dy*dy + dz*dz)/(2*sigma*sigma));
            const ph = kx*dx + ky*dy + kz*dz;
            re = env*Math.cos(ph); im = env*Math.sin(ph);
          }
          data[i] = re; data[i+1] = im;
          sum += re*re + im*im;
        }
      }
    }
    return { data, sum };
  }

  /* ---------- GLSL 注入 ---------- */
  shaders(){
    return {
      /* 2D 片段（dim3 运行时不被引用；buildShaders 一律要求，故与 2D 内核同值） */
      localH: 'V*c',
      density: 'dot(psi.xy,psi.xy)',
      kinetic: '0.25*(dot(dxp,dxp)+dot(dyp,dyp))',
      potential: 'V*p',
      /* R41 双槽势组合 + R49/R60 笔刷势丘列表：pot3Slot 为单槽势函数（HELPERS
         注入位定义，evolve3d/cnRhs3d/cnSweep3d/reduce3d 四处同源），pot3
         取主槽 + 第二槽 + blobSum 三者之和。uPotKind2=0（默认 POT_FREE）
         且 uBlobCount=0（默认无丘）时后两项恒 0 ⟹ 与 R34–R44 逐位一致。
         —— 与 pot3JS/pot3Slot/pot3Blobs（CPU）逐分支一致（镜像契约见文件头） */
      helpers: `#define MAX_BLOBS 16
float pot3Slot(vec3 w, int kind, float v0, float r, float om, float z,
                float wallX, float wallT, float slitW, float slitD){
  if (kind == 1) return (dot(w,w) < r*r) ? v0 : 0.0;
  if (kind == 2) return 0.5*om*om*dot(w,w);
  if (kind == 3) return -z/max(length(w), 0.5);
  if (kind == 4) return (abs(w.x - wallX) < 0.5*wallT
                         && abs(w.y - 0.5*slitD) > 0.5*slitW
                         && abs(w.y + 0.5*slitD) > 0.5*slitW) ? v0 : 0.0;
  return 0.0;
}
/* R60 笔刷势丘列表：椭球 + 高斯软化边（R49 球形硬边之扩展，与 CPU
   pot3Blobs 逐分支同构）。
   uBlobA[i] = (x,y,z,r)（世界 texel），uBlobV[i].x = 强度（0 = 跳过），
   uBlobB[i] = (rx,ry,rz,soft)（三轴半轴与软化宽度；soft=0 = 硬边）。
   循环上界 MAX_BLOBS 为编译期常量；uBlobCount 动态截断（GLSL ES 3.00
   允许循环内 break）。空列表（count=0）恒 0 ⟹ 零回归。
   三分支（与 CPU 同构，注释同 file 头 R60 零回归契约）：
     soft>0            高斯软化：dn=length(d/axes)，内恒 1、外 exp 衰减
     soft=0 且三轴=r    R49 逐字硬边球（零回归路径）
     soft=0 椭球        归一化平方距离 < 1 */
float blobSum(vec3 w){
  float s = 0.0;
  for (int i = 0; i < MAX_BLOBS; i++){
    if (i >= uBlobCount) break;
    vec4 a = uBlobA[i];
    if (uBlobV[i].x == 0.0) continue;
    vec3 d = w - a.xyz;
    vec4 b = uBlobB[i];
    float wgt;
    if (b.w > 0.0){
      vec3 q = d / max(b.xyz, vec3(1e-6));
      float dn = length(q);
      float e = max(dn - 1.0, 0.0);
      wgt = exp(-0.5*e*e/max(b.w*b.w, 1e-12));
    } else if (b.x == a.w && b.y == a.w && b.z == a.w){
      wgt = (dot(d, d) < a.w*a.w) ? 1.0 : 0.0;
    } else {
      vec3 q = d / max(b.xyz, vec3(1e-6));
      wgt = (dot(q, q) < 1.0) ? 1.0 : 0.0;
    }
    s += uBlobV[i].x*wgt;
  }
  return s;
}`,
      pot3: `(pot3Slot(w, uPotKind, uPotV0, uPotR, uPotW, uPotZ,
                uPotWallX, uPotWallT, uPotSlitW, uPotSlitD)
        + pot3Slot(w, uPotKind2, uPotV02, uPotR2, uPotW2, uPotZ2,
                uPotWallX2, uPotWallT2, uPotSlitW2, uPotSlitD2)
        + blobSum(w))`,
      /* 体积密度 / 相位（ray-march 与切片两条显示路径经 den3/ph3 共用） */
      density3: 'dot(c.xy,c.xy)',
      phase3: 'atan(c.y, c.x)',
      /* 3D CN 积分器的局部块闭式解（R36）：标量薛定谔的 Gloc = −i·V（G=−i·M
         的局部部分）⟹ (I−h·Gloc)⁻¹ = (1+i·h·V)⁻¹，即复平面上以 1/(1+(hV)²)
         为模压缩因子的 Cayley 旋转：
           arg/(1+ihV) = arg·(1−ihV)/(1+(hV)²)
                       = ((arg.x+hV·arg.y) + i(arg.y−hV·arg.x))/(1+(hV)²)
         xy/zw 两对通道同构（RG32F 下 zw 恒 0，公式保持 4 宽通用性）。
         |1+i·hV|≥1 ⟹ 局部映射压缩模长 ≤1，Jacobi 迭代不放大；全步 Cayley
         (I−hG)⁻¹(I+hG) 对斜对称 G 严格正交 ⟹ 范数机器精度守恒（精确算术口径；
         GPU float32 长时程残差量级同 2D CN 路径，见 kernel.js CN 节头注）。 */
      cnLocalSolve3: `vec4 cnLocalSolve3(vec4 arg, float V){
  float d = 1.0 + uDtHalf*uDtHalf*V*V;
  return vec4(arg.x + uDtHalf*V*arg.y, arg.y - uDtHalf*V*arg.x,
              arg.z + uDtHalf*V*arg.w, arg.w - uDtHalf*V*arg.w) / d;
}`,
      uniforms: `uniform int   uPotKind;   /* 势形编号（POT_FREE/SPHERE/OSC/COULOMB/DOUBLE_SLIT） */
uniform float uPotV0;     /* 球势垒高度 / 双缝墙高 */
uniform float uPotR;     /* 球势垒半径（texel） */
uniform float uPotW;     /* 谐振子 ω（ℏω=ω；基态 σ=1/√ω） */
uniform float uPotZ;     /* 库仑核电荷 Z（1s: E=−Z²/2；2p_z: E=−Z²/8） */
uniform float uPotWallX; /* 双缝墙心位置 x（世界 texel） */
uniform float uPotWallT; /* 双缝墙厚（texel） */
uniform float uPotSlitW; /* 双缝缝宽（texel） */
uniform float uPotSlitD; /* 双缝缝距（texel；0 = 单缝） */
/* 第二势槽（R41 组合势）：V = pot3Slot(主) + pot3Slot(第二)；uPotKind2=0 无 */
uniform int   uPotKind2;
uniform float uPotV02;
uniform float uPotR2;
uniform float uPotW2;
uniform float uPotZ2;
uniform float uPotWallX2;
uniform float uPotWallT2;
uniform float uPotSlitW2;
uniform float uPotSlitD2;
/* 笔刷势丘列表（R49 丘列表 ⟹ R60 椭球+软化）：uBlobA[i]=(x,y,z,r)、
   uBlobV[i].x=强度、uBlobB[i]=(rx,ry,rz,soft)，uBlobCount=实际丘数
   （0 = 无丘）。与主槽/第二槽独立叠加。 */
uniform int   uBlobCount;
uniform vec4  uBlobA[16];
uniform vec2  uBlobV[16];
uniform vec4  uBlobB[16];`,
    };
  }

  /* 内核私有 uniform 赋值（引擎每帧对 evolve3d/volume 两个 program 调用）。
     注意 program 中未引用的 uniform 位置为 null（被编译器优化掉）——静默跳过。 */
  setUniforms(gl, prog, state){
    const k = gl.getUniformLocation(prog, 'uPotKind'); if (k) gl.uniform1i(k, state.potKind|0);
    const v0 = gl.getUniformLocation(prog, 'uPotV0'); if (v0) gl.uniform1f(v0, state.potV0);
    const r = gl.getUniformLocation(prog, 'uPotR');  if (r)  gl.uniform1f(r, state.potR);
    const w = gl.getUniformLocation(prog, 'uPotW');  if (w)  gl.uniform1f(w, state.potW);
    const z = gl.getUniformLocation(prog, 'uPotZ');  if (z)  gl.uniform1f(z, state.potZ);
    const wx = gl.getUniformLocation(prog, 'uPotWallX'); if (wx) gl.uniform1f(wx, state.potWallX);
    const wt = gl.getUniformLocation(prog, 'uPotWallT'); if (wt) gl.uniform1f(wt, state.potWallT);
    const sw = gl.getUniformLocation(prog, 'uPotSlitW'); if (sw) gl.uniform1f(sw, state.potSlitW);
    const sd = gl.getUniformLocation(prog, 'uPotSlitD'); if (sd) gl.uniform1f(sd, state.potSlitD);
    /* 第二势槽（R41）：state 字段缺失（旧存档/未初始化）时按 0 处理 ⟹ 无叠加 */
    const k2 = gl.getUniformLocation(prog, 'uPotKind2'); if (k2) gl.uniform1i(k2, state.potKind2|0);
    const v02 = gl.getUniformLocation(prog, 'uPotV02'); if (v02) gl.uniform1f(v02, state.potV02 || 0);
    const r2u = gl.getUniformLocation(prog, 'uPotR2'); if (r2u) gl.uniform1f(r2u, state.potR2 || 0);
    const w2 = gl.getUniformLocation(prog, 'uPotW2'); if (w2) gl.uniform1f(w2, state.potW2 || 0);
    const z2 = gl.getUniformLocation(prog, 'uPotZ2'); if (z2) gl.uniform1f(z2, state.potZ2 || 0);
    const wx2 = gl.getUniformLocation(prog, 'uPotWallX2'); if (wx2) gl.uniform1f(wx2, state.potWallX2 || 0);
    const wt2 = gl.getUniformLocation(prog, 'uPotWallT2'); if (wt2) gl.uniform1f(wt2, state.potWallT2 || 0);
    const sw2 = gl.getUniformLocation(prog, 'uPotSlitW2'); if (sw2) gl.uniform1f(sw2, state.potSlitW2 || 0);
    const sd2 = gl.getUniformLocation(prog, 'uPotSlitD2'); if (sd2) gl.uniform1f(sd2, state.potSlitD2 || 0);
    /* 笔刷势丘列表（R49 ⟹ R60 椭球+软化）：state 字段缺失（旧存档/未初始化）
       按空列表处理 ⟹ 无丘。每帧对三个 program 各上传一次（A 64 + V 32 +
       B 64 float，uniform 上传廉价；未引用的 program location 为 null 自然
       跳过——display3d 不注入 pot3/blobSum，三件套 location 均 null）。 */
    const bc = gl.getUniformLocation(prog, 'uBlobCount');
    const ba = gl.getUniformLocation(prog, 'uBlobA[0]');
    const bv = gl.getUniformLocation(prog, 'uBlobV[0]');
    const bb = gl.getUniformLocation(prog, 'uBlobB[0]');
    if (bc) gl.uniform1i(bc, Math.min(state.potBlobs ? state.potBlobs.length : 0, MAX_BLOBS));
    if (ba && bv && bb){
      const A = new Float32Array(64), V = new Float32Array(32), B = new Float32Array(64);
      const list = state.potBlobs || [];
      for (let i = 0; i < Math.min(list.length, MAX_BLOBS); i++){
        const b = list[i];
        A[i*4] = b.x; A[i*4+1] = b.y; A[i*4+2] = b.z; A[i*4+3] = b.r;
        V[i*2] = b.v0;
        B[i*4] = b.rx; B[i*4+1] = b.ry; B[i*4+2] = b.rz; B[i*4+3] = b.soft;
      }
      gl.uniform4fv(ba, A);
      gl.uniform2fv(bv, V);
      gl.uniform4fv(bb, B);
    }
  }

  /* H 特征值上界附加项（引擎 eMax = uK·12 + 1 + 本项）：
     各势形在域内的 |V| 最大值（格点单位）。R49/R60 笔刷丘列表叠加 Σ|v0|
     （保守：所有丘极值同点位时取等——R60 软化权重 ≤1、椭球不越轴包络，
     该上界对椭球/软化丘依然成立，无需改动）。 */
  eMaxExtra(state){
    let blobMax = 0;
    for (const b of (state.potBlobs || [])) blobMax += Math.abs(b.v0 || 0);
    return eMaxSlot(state.potKind, state) + eMaxSlot(state.potKind2, state, 2)
      + blobMax;
  }

  /* 3D 透射率扫描的解析模型（R38）：s 波球势垒。与 2D 的 transmissionModel
     平行但几何是球（势形 potKind=SPHERE 的半径 potR）而非矩垒——扫描器
     TransmissionScanner3 据此挂载。 */
  transmissionModel3(state){
    return sphericalBarrierModel3(state.m);
  }

  /* ---------- CPU 端全卷测量（引擎 probSum3d 的回读后端；HUD P/T/V/E + 调试句柄）----------
     buf：n³×2 Float32Array（RG32F 逐层 readPixels 拼成，索引 ((z·n+y)·n+x)·2）。
     产出（全部为全场积分，非逐粒子期望值——P 即总概率）：
       P    = Σ|ψ|²
       T    = uK·Σ_fwd|Δψ|²（3 前向链路/texel；= ⟨ψ|−lap_d|ψ⟩，与 2D reduce
              的 4 阶差分为光滑极限一致；Neumann 边界由 clamp 自然给出零链路）
       V    = Σ V(w)·|ψ|²（pot3JS 镜像势）
       E    = T + V（KDK 守恒的离散能量；驻波/基态预设下应无长期漂移）
       peak = max|ψ|²
       cx/cy/cz = 概率质心（texel 序号 / n，世界分数 0..1）
     simTime 由调用方附加。 */
  moments3d(buf, n, state){
    const k = 0.5/state.m;
    const half = n/2;
    let P = 0, link = 0, Vsum = 0, peak = 0, sx = 0, sy = 0, sz = 0;
    /* Neumann clamp 采样（与 shader S() 的 clamp(p,0,1) 一致） */
    const at = (x, y, z, c) => {
      const xi = x < 0 ? 0 : (x >= n ? n-1 : x);
      const yi = y < 0 ? 0 : (y >= n ? n-1 : y);
      const zi = z < 0 ? 0 : (z >= n ? n-1 : z);
      return buf[((zi*n + yi)*n + xi)*2 + c];
    };
    for (let z=0; z<n; z++){
      const wz = z + 0.5 - half;
      for (let y=0; y<n; y++){
        const wy = y + 0.5 - half;
        for (let x=0; x<n; x++){
          const wx = x + 0.5 - half;
          const i = ((z*n + y)*n + x)*2;
          const re = buf[i], im = buf[i+1];
          const p = re*re + im*im;
          P += p;
          if (p > peak) peak = p;
          sx += x*p; sy += y*p; sz += z*p;
          Vsum += pot3JS(wx, wy, wz, state)*p;
          /* 3 前向链路（x/y/z 各一）× 2 通道；界外由 clamp 归边（Neumann ⟹ Δ=0） */
          const dxRe = at(x+1,y,z,0) - re, dxIm = at(x+1,y,z,1) - im;
          const dyRe = at(x,y+1,z,0) - re, dyIm = at(x,y+1,z,1) - im;
          const dzRe = at(x,y,z+1,0) - re, dzIm = at(x,y,z+1,1) - im;
          link += dxRe*dxRe + dxIm*dxIm + dyRe*dyRe + dyIm*dyIm + dzRe*dzRe + dzIm*dzIm;
        }
      }
    }
    return { P, T: k*link, V: Vsum, E: k*link + Vsum, peak,
             cx: P > 0 ? sx/P/n : 0.5, cy: P > 0 ? sy/P/n : 0.5, cz: P > 0 ? sz/P/n : 0.5 };
  }

  /* ---------- 解析能级阶梯（HUD「E → 最近能级」对照；单位与引擎一致）----------
     谐振子：E_n = ω·(n+3/2)（n=nx+ny+nz≥0，3D 各向同性简并）。
     氢原子：E_n = −Z²/(2n²)（n=1,2,…；主量子数谱，1s 与 2p_z 同族）。 */
  energyLevels(state){
    const fmtE = v => Math.abs(v) < 1e-3 ? v.toExponential(2) : v.toFixed(6);
    if (state.preset === 'oscillator'){
      const w = state.potW;
      return {
        kind: '3D 谐振子',
        param: 'ℏω=' + fmtE(w),
        nearest(e){
          const n = Math.max(0, Math.round(e/w - 1.5));
          return { label: '' + n, e: (n + 1.5)*w, d: (n + 1.5)*w - e };
        },
      };
    }
    if (state.preset === 'ground' || state.preset === 'orbital2p'){
      const Z = state.potZ;
      const E = n => -Z*Z/(2*n*n);
      return {
        kind: '氢原子能级',
        param: 'Z=' + Z.toFixed(3) + '（E₁=' + fmtE(E(1)) + '）',
        nearest(e){
          let best = null;
          for (let n=1; n<=15; n++){
            const ev = E(n), err = Math.abs(ev - e);
            if (!best || err < best._err) best = { label: 'n=' + n, e: ev, d: ev - e, _err: err };
          }
          return best;
        },
      };
    }
    return null;
  }

  /* ---------- 预设 ----------
     wave3 = [fx,fy,fz,kx,ky,kz]（世界分数中心 + 格点单位波数）；
     kind 见 makeWave3d；params 并入 state（势形编号 + 势参数 + σ）。
     build() 为空——3D 无势场画布（势经 pot3 解析注入）。

     exposure3（曝光）逐预设给定：体渲染的发射-吸收存在「外壳遮挡核心」的权衡，
     最优曝光不是一个常数——密度峰值跨 36×（2p_z 8.7e-5 ↔ 1s 3.1e-3），且弥散态
     （谐振子 σ=8）在过高曝光下外晕先变不透明、反而把亮核挡成暗壳。下表的取值是
     CDP 实测标定（目标 dispA 峰值亮度 0.7–0.9，Chrome+SwiftShader 65³ 默认机位）：
       free3d 3600 → 0.77 / sphere 4800 → 0.71 / oscillator 2400 → 0.86
       ground 1200 → 0.88 / orbital2p 8000 → 0.88
     用户仍可用「曝光」滑块（100–10000）自由调整。 */
  presets(){
    return {
      free3d: { name:'自由传播', kind:'gaussian', wave3:[0.30,0.5,0.5, 0.12,0,0],
                params:{ exposure3:3600 }, build(){},
                text:'高斯波包在无势场中飞行并自然扩散——不确定性原理的体积版。色相表示相位 arg(ψ)，可整束旋转视角观察包络。' },
      sphere: { name:'球形势垒', kind:'gaussian', wave3:[0.15,0.5,0.5, 0.15,0,0],
                params:{ potKind:POT_SPHERE, potV0:0.02, potR:10, sigma:6, exposure3:4800 }, build(){},
                text:'高斯波包撞上高于自身能量的球形势垒（V0=0.02, R=10 texel）：迎头部分反射，边缘衍射，球后浮现散射尾波——三维版的圆散射体。' },
      oscillator: { name:'3D 谐振子', kind:'gaussian', wave3:[0.5,0.5,0.5, 0,0,0],
                params:{ potKind:POT_OSC, potW:1/64, sigma:8, exposure3:2400 }, build(){},
                text:'V = ½ω²r² 抛物势阱。σ=8 的中心波包恰为基态（σ=1/√ω）——严格驻波，密度与能量都不动；调宽 σ 滑块可看到波包周期性呼吸（本征叠加）。' },
      ground: { name:'氢原子 1s', kind:'ground', wave3:[0.5,0.5,0.5, 0,0,0],
                params:{ potKind:POT_COULOMB, potZ:0.25, exposure3:1200 }, build(){},
                text:'氢原子基态：ψ ∝ e^{−Zr} 球对称驻波，E = −Z²/2（HUD 能级阶梯对照 n=1）。软化库仑势 V = −Z/max(r, ½) 防原点奇点。' },
      orbital2p: { name:'氢原子 2p_z', kind:'orbital2p', wave3:[0.5,0.5,0.5, 0,0,0],
                params:{ potKind:POT_COULOMB, potZ:0.25, exposure3:8000 }, build(){},
                text:'2p_z 轨道：ψ ∝ z·e^{−Zr/2}，赤道面 z=0 为节面（密度严格为零）。上下瓣相位差 π——相位着色下呈互补双色瓣，E = −Z²/8（对照 n=2）。' },
      slits3d: { name:'双缝干涉', kind:'gaussian', wave3:[0.5-26/64,0.5,0.5, 1.2,0,0],
                params:{ potKind:POT_DOUBLE_SLIT, potV0:3, potWallX:0, potWallT:4, potSlitW:6, potSlitD:20,
                         sigma:6, exposure3:3600 }, build(){},
                text:'物质波撞上带双缝的不透明墙（V₀=3、厚 4 texel，z 向无限）：每条缝成为柱面波源，两束相干叠加——墙后屏幕方向长出明暗相间、等间距的干涉条纹（缝距 D=20、k=1.2 ⟹ 条纹间距 ≈λL/D≈6.8 texel）。每个粒子抵达屏幕的位置由 |ψ|² 决定——概率幅的自我干涉。' },
      /* 组合势（R41）：主槽双缝墙（slits3d 口径）+ 第二槽球垒（R=6，不遮缝：
         缝内缘 |y|=7 > R，球垒仅占据墙中央的实墙区）。波包先经球垒散射
         （动量重分布）再入射双缝 ⟹ 屏图样被散射调制，与 slits3d 纯墙对照
         即见散射对干涉的影响；可用 SlitScanner（R40）做峰数/峰位定量对比。 */
      slit_sphere3d: { name:'球垒调制双缝', kind:'gaussian', wave3:[0.5-26/64,0.5,0.5, 1.2,0,0],
                params:{ potKind:POT_DOUBLE_SLIT, potV0:3, potWallX:0, potWallT:4, potSlitW:6, potSlitD:20,
                         potKind2:POT_SPHERE, potV02:2, potR2:6,
                         sigma:6, exposure3:3600 }, build(){},
                text:'同一道双缝墙，但墙中央叠了一个球形势垒（R=6、V₀=2，球半径小于缝内缘 |y|=7 故不遮缝）：波包先被球垒散射、动量重分布，再入射双缝——屏上图样是被散射调制的干涉，与「双缝干涉」预设对照即见散射如何改写干涉。势为两槽解析叠加（R41），⟨V⟩ 与稳定界按两槽之和计算。' },
      slit1_3d: { name:'单缝衍射', kind:'gaussian', wave3:[0.5-26/64,0.5,0.5, 1.2,0,0],
                params:{ potKind:POT_DOUBLE_SLIT, potV0:3, potWallX:0, potWallT:4, potSlitW:6, potSlitD:0,
                         sigma:6, exposure3:3600 }, build(){},
                text:'同一道墙只开一条缝（缝距 D=0 退化为单缝，缝宽 6 texel）：屏上得到单缝衍射的宽中央主极大与两侧次级瓣——没有第二条缝可干涉，图样是单柱面波的纯衍射。与「双缝干涉」预设对照即见干涉与衍射的分工。' },
    };
  }

  /* 面板附加控件：无（3D 渲染控件由引擎 3D 面板提供：网格/步数/曝光/σ/势参数/相机） */
  extraControls(){ return null; }

  defaults(){
    return {
      /* 体积网格默认 64³：内存 n³、每全卷 pass = n 次逐层 draw（R34 spike 实测
         64³ 8.8ms/pass、128³ 105.6ms/pass，SwiftShader）。必须显式覆盖引擎默认的
         grid:256——那个值是 2D 场纹理的档位，落到 3D 即 256³（268MB/场、
         每帧 4608 次 draw），直接把交互帧率打到个位数（R34 首轮验证实测踩中）。
         面板下拉与 ?grid= 均限制在 32…128。 */
      grid: 64,
      /* 积分器选择（R36）：'kdk'（默认，速度 Verlet）/ 'cn'（Crank-Nicolson）。
         预设 params 不含该项——用户选择跨预设保留（对照实验不因切预设而重置）。 */
      integrator3: 'kdk',
      potKind: POT_FREE, potV0: 0.02, potR: 10, potW: 1/64, potZ: 0.25,
      /* 双缝墙（R39；仅 potKind=4 生效）——墙心 x、墙厚、缝宽、缝距（世界 texel） */
      potWallX: 0, potWallT: 4, potSlitW: 6, potSlitD: 20,
      /* 第二势槽（R41 组合势）：默认 POT_FREE ⟹ 无叠加（与 R34–R40 逐位一致）。
         预设 params 可注入组合（如 slit_sphere3d：主槽双缝墙 + 第二槽球垒）。 */
      potKind2: POT_FREE, potV02: 0.02, potR2: 10, potW2: 1/64, potZ2: 0.25,
      potWallX2: 0, potWallT2: 4, potSlitW2: 6, potSlitD2: 20,
      /* 笔刷势丘列表（R49 丘列表 ⟹ R60 椭球+软化）：默认空列表 ⟹ 无丘（与
         R34–R44 单丘关闭态逐位一致）。potBlobR/potBlobV0 是「新丘规格」
         （面板滑块，stamp 时快照进每个丘）；potBlobRX/RY/RZ 为三轴**轴比**
         （×R 得半轴，1 = 球；0.2–2.0）、potBlobSoft 为高斯软化宽度（texel，
         0 = 硬边）。轴比全 1 且 soft=0 时新丘 ≡ R49 硬边球（零回归）；
         soft>0 时 dn≤1 内恒 V₀、dn>1 外按 exp(−(dn−1)²/2soft²) 衰减。
         丘数上限 MAX_BLOBS=16，超出 FIFO 淘汰最旧（app.js stampBlob3）。
         负 V0 = 势阱。 */
      potBlobs: [],
      potBlobR: 8, potBlobV0: 0.5,
      potBlobRX: 1, potBlobRY: 1, potBlobRZ: 1, potBlobSoft: 0,
      /* 曝光默认 3600（= free3d 预设值，见预设表的实测标定）；其余预设各自覆盖 */
      steps3: 48, exposure3: 3600, phaseColor: 1, slice3: 0, sliceZ: 0.5,
      /* R70 散射相移面板的入射能量滑块（解析模型参数，与 GPU 波包解耦——
         「取当前波包 E」按钮按 lastWave3 的 kx 反推写入）。默认 0.011 ≈
         sphere 预设 kx=0.15 的离散色散能量 2uK(1−cos 0.15)。 */
      scatE: 0.011,
      sigma: 6,
    };
  }
}

function injectStyles(){
  if (document.getElementById("qf-styles")) return;
  const st = document.createElement("style");
  st.id = "qf-styles";
  st.textContent = CSS;
  document.head.appendChild(st);
}

/* ===== src/core/scan.js ===== */
/* ============================================================================
 * 扫描工具家族（引擎层）—— R46：既有三扫描器迁移 GenericScanner 基座
 *
 * 本文件承载全部参数扫描器，统一为「一个生命周期基类 + 每扫描器一个 SPEC」：
 *
 *   GenericScanner（基类）：start/stop/_restore/_beginPoint/_tick/_measure/
 *     _decide/_record/_finish/_status/_plot 全生命周期——rAF 自驱 + boost
 *     倍频 + 原子快照 + 中止/状态恢复 + 按钮翻转 + 状态行 + 绘图派发。
 *     扫描器之间重复的只有这份骨架；物理（布场/测量/判据/记录/对账/绘图）
 *     全部在 SPEC 钩子里，逐字保留各轮次已验证的逻辑。
 *
 *   SPEC 钩子约定（s = 扫描器实例；除 measure 外全部可选）：
 *     gate(app, s) -> 错误串|null     启动门禁（可顺带缓存 model 等）
 *     prepare(app, o, s)              启动前置：网格切换/σ 冻结/Ec/模型
 *     teardown(app, s)                恢复附加：σ/网格/loadPreset
 *                                       （paused/按钮/syncControls 由基类管）
 *     buildList(o, s) -> 数组         值列表（默认 xs 或 lo/hi/n 线性布点）
 *     afterList(app, o, s)            列表就绪后的扫描级预备（3D 峰预测）
 *     beginPoint(app, x, o, s)        每点布场（默认 loadPreset+paramKey+initExtra）
 *     measure(app, o, frames, s) -> m 原子快照（唯一必需钩子）
 *     onMeasure(m, frames, s)         测量后处理（series 收集/最佳帧竞争）
 *     decide(m, frames, s) -> bool    停止判据（默认 frames>=framesMax）
 *     record(m, s)                    单点记录（默认 series 时间平均聚合）
 *     statusText(final, s) -> 串|null 状态行文本（null=不写）
 *     summarize(results, app, o, s)   偏差汇总
 *     startToast(s)/stopToast(s)/finishToast(s)  三处 toast 文本
 *     plot(cv, results, app, s)       绘图
 *     statKeys                        series 聚合键（默认 record 用）
 *     ids                             {btn, btnStop, stat, canvas} 元素 ID
 *
 * 迁移口径（R46，纯重构）：五个扫描器的公开 API、opts 键、results/summary
 * 字段形状、按钮/状态行/canvas ID、toast 文本全部逐位保留——回归套件
 * cdp29(经 cdp38/39/40/42 内含)/cdp38/39/40/42 全绿是验收标准。
 * ========================================================================== */

/* ============================================================================
 * 2D 矩势垒透射率扫描（R29）
 *
 * 矩势垒透射率 T(V0) 的实测扫描 + 解析对照：对每个 V0 重画势垒、重发波包、
 * 跑完全相互作用后测量「势垒右侧概率 / 总概率」，与内核提供的解析模型
 * （kernel.transmissionModel，薛定谔内核：矩势垒透射 + Δk 卷积）叠图。
 *
 * 与主循环的关系：扫描不新增积分路径——物理推进走 app.evolve()（从 frame()
 * 原样抽出的同一函数），扫描只负责「何时重来、何时测量」。执行期间
 * app.state.paused=true：frame() 跳过物理但照常渲染，用户实时看到波包反复
 * 撞垒；扫描自身的 rAF 循环每 tick 跑 boost 帧物理（倍频，省的是等待）。
 *
 * 停止判据（每 measureEvery 帧一次原子快照：一次 readPixels 同时给出
 * 总概率 P、右侧概率、相互作用区[势垒±bandPad]概率与质心）：
 *   1. 门：帧数 ≥ 30 且相互作用区概率曾 ≥ 1%·P（波包确实撞上了垒）；
 *   2. 清：相互作用区概率 < 0.2%·P（透射/反射两束都已离开垒区）；
 *   3. 稳：右侧概率连续两次变化 < 0.1%·P（测量值已平台化）；
 *   4. 兜底：帧数 ≥ framesMax。
 * 先满足 2+3（或 4）即记录该点。Dirichlet 世界边界的反射在此窗口内回到
 * 左侧/右侧但都在分界线同侧，不污染测量（详见 README「透射率扫描」）。
 *
 * 几何（格点单位，势场画布 256² = 世界坐标；扫描强制 grid=256，势垒在
 * psi 空间是宽度恰为 bw texel 的陡沿——8 位灰度量化到 1/127，实际高度
 * v0q=(round(V0*127+128)-128)/127，记录与理论对照都用 v0q）：
 *   波包 x0=0.25·g、kx（默认 0.3）、σ（默认 18）；势垒 x=120、宽 16、全高。
 * ========================================================================== */

/* 默认扫描参数（opts 可覆盖；v0s 显式列表优先于 v0Lo/v0Hi/v0N） */
const SCAN_DEFAULTS = {
  kx: 0.3, ky: 0, sigma: 18,          /* 入射波包：每 texel 相位动量与宽度 */
  x0: 0.25, y0: 0.5,                  /* 波包起点（世界坐标） */
  bx: 120, bw: 16,                    /* 势垒：势场画布 px（x 起点与宽度） */
  xSplitPad: 6,                       /* 透/反射分界线 = 势垒右缘 + 6 px */
  bandPad: 6,                         /* 相互作用区 = 势垒 ± 6 px */
  boost: 4,                           /* 每 rAF tick 推进的物理帧数 */
  measureEvery: 6,                    /* 每 N 物理帧一次原子快照 */
  framesMax: 900,                     /* 单点帧预算兜底 */
  v0Lo: 0.25, v0Hi: 2.2, v0N: 13,     /* V0/E_c 扫描范围（E_c 为入射中心能量） */
  v0s: null,                          /* 显式 V0 列表（绝对单位）时忽略上面范围 */
};

/* 停止判据常数（模块级只读；理由见文件头） */
const GATE_FRAMES = 30;        /* 波包飞行 ~150 帧才到垒，30 帧内不可能完成相互作用 */
const GATE_BAND = 0.01;        /* 相互作用区概率曾达 1%·P ⟹ 门开 */
const CLEAR_BAND = 0.002;      /* 垒区概率 < 0.2%·P ⟹ 两束已离开 */
const STABLE_D = 0.001;        /* 右侧概率相邻快照变化 < 0.1%·P 计一次「稳」 */
const STABLE_N = 2;            /* 连续两次「稳」⟹ 平台化 */

/* 势场画布上画矩垒（每点重画；R29 原 _paintBarrier，R46 提为模块函数） */
function paintBarrier2d(app, o, v0){
  const v = app.vctx;
  v.globalCompositeOperation = 'source-over';
  v.fillStyle = app.vGray(0); v.fillRect(0, 0, 256, 256);
  v.fillStyle = app.vGray(v0); v.fillRect(o.bx, 0, o.bw, 256);
  app.uploadV();
}

/* 双缝扫描的守恒记录：P 单独取（screenSlice3 不含 P；probSum3d 与测量同帧会
   多一次全卷回读，但每点只补一次、且只用于守恒记录——可接受；R40 原 _lastP） */
function lastPSlit(app){
  return app.probSum3d().P;
}

/* ---------- 2D 矩垒 SPEC（R29 逻辑逐字迁移，R46） ---------- */
const SCAN_SPEC = {
  id: 'scan', label: '透射率扫描',
  defaults: SCAN_DEFAULTS,
  ids: { btn: '#btnScan', btnStop: '#btnScanStop', stat: '#scanStat', canvas: '#scanCanvas' },
  gate(app, s){
    const model = app.kernel.transmissionModel && app.kernel.transmissionModel(app.state);
    if (!model) return '当前内核无透射率模型';
    s.model = model;               /* _finish 的 Δk 卷积对账要用 */
    return null;
  },
  prepare(app, o, s){
    /* 扫描定义在 256²（势垒几何与解析模型均以 256² 格点为单位）；
       非 256 网格先切回（selGrid 同路径：allocGrid 后重载预设） */
    if (app.state.grid !== 256){
      app.state.grid = 256;
      app.q('#selGrid').value = '256';
      app.allocGrid(256);
      app.loadPreset(app.state.preset);
    }
    /* 冻结 σ（initWave 每点用它重发波包） */
    s._savedSigma = app.state.sigma;
    app.state.sigma = o.sigma;
    app.syncControls();
    /* 入射中心能量（离散色散）：默认薛定谔 2sin²(k/2)/m；一阶内核（Dirac）
       经 scanEc 钩子覆写为总能量口径 √(sin²k+m²)（其 T 模型的 E 即总能量） */
    s.Ec = app.kernel.scanEc ? app.kernel.scanEc(app.state, o.kx)
                             : 2 * Math.sin(o.kx/2) * Math.sin(o.kx/2) / app.state.m;
  },
  teardown(app, s){
    app.state.sigma = s._savedSigma;
  },
  buildList(o, s){
    /* V0 列表：显式列表优先；否则按 E_c 线性布点 */
    if (o.v0s){ s.v0s = o.v0s.slice(); return s.v0s; }
    const list = [];
    for (let i = 0; i < o.v0N; i++)
      list.push(o.v0Lo + (o.v0Hi - o.v0Lo) * i / Math.max(1, o.v0N - 1));
    for (let i = 0; i < list.length; i++) list[i] *= s.Ec;
    s.v0s = list;
    return list;
  },
  beginPoint(app, x, o, s){
    s._v0 = x;
    paintBarrier2d(app, o, x);
    app.initWave(o.x0, o.y0, o.kx, o.ky);
    s._bandPeak = 0; s._prevRight = -1; s._stable = 0;
  },
  measure(app, o, frames, s){
    /* 原子快照：一次 readPixels 同时测 P / 右侧概率 / 垒区概率 / 质心
       （与 probSplit 同源；右侧 = x ≥ 分界线，分界线取势垒右缘 + xSplitPad） */
    const gl = app.gl, g = app.state.grid;
    const ch = app.kernel.pairs === 2 ? 4 : 2;
    gl.bindFramebuffer(gl.FRAMEBUFFER, app.psiA.fbo);
    const buf = new Float32Array(g*g*ch);
    gl.readPixels(0, 0, g, g, app.fmt, gl.FLOAT, buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const xs = Math.floor((o.bx + o.bw + o.xSplitPad) / 256 * g);
    const b0 = Math.floor((o.bx - o.bandPad) / 256 * g);
    const b1 = Math.ceil((o.bx + o.bw + o.bandPad) / 256 * g);
    let P = 0, right = 0, band = 0, sx = 0;
    for (let y = 0; y < g; y++){
      const row = y*g;
      for (let x = 0; x < g; x++){
      const i = (row + x)*ch;
      const p = app.kernel.cpuDensity(buf, i);   /* 全分量 |ψ|²（pairs 感知：pairs=2 时四通道，与 probSplit 同源） */
        P += p; sx += x*p;
        if (x >= xs) right += p;
        if (x >= b0 && x < b1) band += p;
      }
    }
    return { P, right, band, comX: P > 0 ? (sx/P)/g : 0 };
  },
  decide(m, frames, s){
    /* 兜底置顶（R38 同构修复）：旧结构把 framesMax 放在末行 return，而
       band-clear 分支提前 return false——band 不清时兜底永不可达（单点会
       跑到远超预算卡死）。置顶后任何分支都不再屏蔽它。 */
    if (frames >= s.opts.framesMax) return true;
    if (m.band > s._bandPeak) s._bandPeak = m.band;
    if (frames < GATE_FRAMES || s._bandPeak < GATE_BAND*m.P) return false;
    if (m.band > CLEAR_BAND*m.P){ s._stable = 0; s._prevRight = m.right; return false; }
    if (s._prevRight >= 0 && Math.abs(m.right - s._prevRight) < STABLE_D*m.P) s._stable++;
    else s._stable = 0;
    s._prevRight = m.right;
    return s._stable >= STABLE_N;
  },
  record(m, s){
    /* v0q：8 位势场量化的实际高度（g=round(V0·127+128)，V=(g−128)/127）——
       记录与理论对照一致口径；灰度量化是引擎势场编码的固有约束 */
    const v0q = (Math.round(Math.max(-1, Math.min(1, s._v0))*127 + 128) - 128)/127;
    s.results.push({
      v0: s._v0, v0q, T: m.right/m.P,
      frames: s._frames, t: s.app.state.simTime, P: m.P,
    });
  },
  statusText(final, s){
    if (s.busy){
      const r = s.results[s.results.length - 1];
      return (s._i + 1) + '/' + s.v0s.length +
        ' · V0=' + s._v0.toFixed(4) + ' (V0/E=' + (s._v0/s.Ec).toFixed(2) + ')' +
        ' · 帧 ' + s._frames + '/' + s.opts.framesMax +
        (r ? ' · 上点 T=' + r.T.toFixed(4) : '');
    }
    if (final && s.results.length){
      const sm = s.summary;
      return '完成 ' + s.results.length + ' 点 · 最大偏差 ×' + sm.maxRatio.toFixed(2) +
        (sm.worst ? ' @V0/E=' + (sm.worst.v0q/s.Ec).toFixed(2) : '');
    }
    return null;
  },
  summarize(results, app, o, s){
    /* 偏差汇总：实测 vs Δk 卷积理论（波包的合理对照目标），取最大倍差 */
    let maxRatio = 0, worst = null;
    for (const r of results){
      const tc = s.model.convolved(o.kx, 1/(Math.SQRT2*o.sigma), r.v0q, o.bw);
      if (tc > 1e-6 && r.T > 1e-6){
        const ratio = Math.max(r.T/tc, tc/r.T);
        if (ratio > maxRatio){ maxRatio = ratio; worst = r; }
      }
    }
    return { maxRatio, worst };
  },
  startToast(s){
    return '透射率扫描开始 · 矩势垒 x=120 w=16 · kx=' + s.opts.kx + ' σ=' + s.opts.sigma;
  },
  stopToast(s){
    return '扫描已中止（' + s.results.length + '/' + s.v0s.length + ' 点）';
  },
  finishToast(s){
    return '扫描完成 · ' + s.results.length + ' 点 · 最大偏差 ×' + s.summary.maxRatio.toFixed(2);
  },
  plot(cv, results, app, s){
    const x = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const L = 36, R = 8, T = 16, B = 22;
    const pw = W - L - R, ph = H - T - B;
    x.clearRect(0, 0, W, H);
    x.fillStyle = 'rgba(4,8,16,.55)'; x.fillRect(0, 0, W, H);
    if (!results.length) return;
    const o = s.opts, Ec = s.Ec;
    const xMin = 0, xMax = Math.max(...results.map(r => r.v0q/Ec)) * 1.08;
    const yMin = -4, yMax = 0;                       /* log10 T ∈ [1e-4, 1] */
    const X = v => L + (v - xMin)/(xMax - xMin)*pw;
    const Y = t => {
      const l = Math.log10(Math.max(1e-4, Math.min(1.02, t)));
      return T + (yMax - l)/(yMax - yMin)*ph;
    };
    /* 网格与刻度 */
    x.font = '9px ui-monospace,monospace';
    x.strokeStyle = 'rgba(120,160,220,.14)'; x.fillStyle = '#9aa7bd'; x.lineWidth = 1;
    for (let d = yMin; d <= yMax; d++){
      const yy = Y(Math.pow(10, d));
      x.beginPath(); x.moveTo(L, yy); x.lineTo(W - R, yy); x.stroke();
      x.textAlign = 'right'; x.fillText('1e' + d, L - 3, yy + 3);
    }
    for (let i = 0; i <= 4; i++){
      const v = xMin + (xMax - xMin)*i/4, xx = X(v);
      x.beginPath(); x.moveTo(xx, T); x.lineTo(xx, T + ph); x.stroke();
      x.textAlign = 'center'; x.fillText(v.toFixed(2), xx, H - 8);
    }
    /* E=V0 分界（<1 隧穿区 / >1 越障区） */
    if (xMax > 1){
      const x1 = X(1);
      x.strokeStyle = 'rgba(251,191,36,.45)'; x.setLineDash([3, 3]);
      x.beginPath(); x.moveTo(x1, T); x.lineTo(x1, T + ph); x.stroke();
      x.setLineDash([]);
      x.fillStyle = '#fbbf24'; x.textAlign = 'left'; x.fillText('E=V0', x1 + 3, T + 9);
    }
    /* 解析曲线：中心 E（灰）与 Δk 卷积（琥珀，波包的合理对照目标） */
    const dk = 1/(Math.SQRT2*o.sigma);
    const curve = (fn, color, width) => {
      x.strokeStyle = color; x.lineWidth = width; x.beginPath();
      let started = false;
      for (let i = 0; i <= 160; i++){
        const v = xMin + (xMax - xMin)*i/160;
        const t = fn(v*Ec);
        if (!(t > 0)){ started = false; continue; }
        const px = X(v), py = Y(t);
        if (!started){ x.moveTo(px, py); started = true; } else x.lineTo(px, py);
      }
      x.stroke();
    };
    curve(v0 => s.model.T(Ec, v0, o.bw), 'rgba(154,167,189,.5)', 1);
    curve(v0 => s.model.convolved(o.kx, dk, v0, o.bw), '#fbbf24', 1.4);
    /* 实测散点 */
    x.fillStyle = '#67e8f9';
    for (const r of results){
      const px = X(r.v0q/Ec), py = Y(r.T);
      x.beginPath(); x.arc(px, py, 2.6, 0, 6.2832); x.fill();
    }
    /* 轴标签与图例 */
    x.fillStyle = '#9aa7bd'; x.textAlign = 'center';
    x.fillText('V0 / E', L + pw/2, H - 1);
    x.save(); x.translate(9, T + ph/2); x.rotate(-Math.PI/2);
    x.fillText('透射率 T', 0, 0); x.restore();
    x.textAlign = 'left';
    x.fillStyle = '#67e8f9'; x.fillText('● 实测', L + 4, T + 10);
    x.fillStyle = '#fbbf24'; x.fillText('— Δk 卷积', L + 44, T + 10);
    x.fillStyle = 'rgba(154,167,189,.8)'; x.fillText('— 中心 E', L + 112, T + 10);
  },
};

/* ============================================================================
 * 3D 透射率扫描（R38 #34 backlog ④）
 *
 * 与 2D 矩垒扫描同一生命周期契约（基类承载），差异全在几何与测量：
 *   · 势：球形势垒（potKind=SPHERE，半径 R 世界单位=texel，全高 V0 逐点扫）
 *   · 入射：高斯波包迎头（kx 沿 +x，中心 y=z=0，起点 x0=−(R+10)）
 *   · 测量：全卷回读（readWave3）后按世界坐标分区域求和——
 *       fwd  = w.x > R+pad（越过前门 = 透射）
 *       back = w.x < −(R+pad)（反射）
 *       band = 壳层 R−pad < |w| < R+pad（相互作用区，门控用）
 *   · 解析对照：s 波球垒模型 barrier3d.js——rayCorrected（含「绕球透射」
 *     经典修正）为 3D 实测的对照目标，Δk 卷积 convolved 保留为 s 波口径；
 *     偏差汇总与峰位判据见 summarize。
 *
 * 停止判据（R38 重设计；2D 的「band 清空 + fwd 双稳」在 3D 小盒内不可达，
 * 详见下）：
 *   1. 兜底：帧数 ≥ framesMax（置顶判断，任何分支不得屏蔽）；
 *   2. 门：帧数 ≥ 30 且 band 曾 ≥ 1%·P（波包确实撞上了垒）；
 *   3. 窗：fwd 自 0 单调升至首程平台（透射波过门），世界边界返回使其自
 *      峰值回落 ≥ 10% ⟹ 首程测量窗关闭，记录峰值 = T。
 * 为何放弃 2D 的 clear+stable：32³/64³ 盒内色散时标 t_d=2mσ²≈15 帧，波包
 * 快速铺开，透射打过右墙反弹、反射波尾迹长期跨越垒区壳层——实测 band 峰后
 * 最低 0.0013@60 即回升 0.03+（v0=0.242@64³），clear 对多数点不可达；fwd
 * 平台仅 ~12 帧宽，双稳窗与 clear 窗不重叠。fwd 的「升→平台→回落」时序由
 * 几何保证：门开时透射波尚未过门（fwd 仍在升），回落只在墙返回后发生，
 * 故峰值即首程透射率。记录 T=fwd 峰值/P，_record 另存停止帧 fwdEnd。
 *
 * 网格策略：**强制 64³**。32³ 物理上不可用：色散时标 t_d=2mσ²≈15 帧，波包
 * 到 66 帧（相互作用完成）时中心已到 x≈+35、σ≈12.7——32³ 盒（半宽 16）装
 * 不下这个过程，透射波在完成前就打右墙返回（实测 v0=0.242@32³：fwd 只爬到
 * 0.27 即被压住，随后永久 sloshing；同点 @64³ 首程平台 0.7478）。64³ 盒
 * （半宽 32）给出 ~12 帧的首程测量余量（完成@66 vs 墙返回到达门@78）。
 * 帧成本：扫描期 paused=true 无体积渲染争用，64³ evolve ~282ms/帧；13 点
 * ×~85 帧实测全程 341s（SwiftShader 软渲染）；真实 GPU 上秒级，可改 grid
 * （物理口径不变，但小于 64 会重现上述盒太小问题）。
 * ========================================================================== */
const SCAN3_DEFAULTS = {
  kx: 0.7, sigma: 3,            /* 入射波包：每 texel 相位动量与宽度（dk/kx≈0.2，与 2D 扫描同量级） */
  R: 6, pad: 3,                 /* 球垒半径与门/相互作用区裕量（世界单位） */
  grid: 64,                     /* 扫描强制网格（见文件头：32³ 盒装不下首程测量窗） */
  boost: 4,                     /* 每 rAF tick 推进的物理帧数 */
  measureEvery: 6,              /* 每 N 物理帧一次原子快照 */
  framesMax: 400,               /* 单点帧预算兜底 */
  v0Lo: 0.1, v0Hi: 1.5, v0N: 13,/* V0/E_c 扫描范围：0.43 共振位（首点即共振透明）
                              → E=V0 过渡（T 跌落）→ 早期隧穿衰减；上限 1.5 而非
                              2.5：ratio>2 后 T<0.001，深隧穿点无信息量（省预算） */
  v0s: null,                    /* 显式 V0 列表（绝对单位）时忽略上面范围 */
};

/* 停止判据常数（R38 重设计；理由见 3D 扫描器文件头） */
const GATE3_FRAMES = 30;        /* 波包飞行 ~16 帧到垒面，30 帧内不可能完成相互作用 */
const GATE3_BAND = 0.01;        /* 垒区概率曾达 1%·P ⟹ 门开（波包确实撞上了垒） */
const DROP3_REL = 0.10;         /* 透射概率自峰值回落 10% ⟹ 墙返回到来，首程窗关闭 */

/* ---------- 3D 球垒 SPEC（R38 逻辑逐字迁移，R46） ---------- */
const SCAN3_SPEC = {
  id: 'scan3', label: '3D 透射率扫描',
  defaults: SCAN3_DEFAULTS,
  ids: { btn: '#btnScan3', btnStop: '#btnScan3Stop', stat: '#scanStat3', canvas: '#scanCanvas3' },
  gate(app, s){
    const model = app.kernel.transmissionModel3 && app.kernel.transmissionModel3(app.state);
    if (!model) return '当前内核无 3D 透射率模型';
    s.model = model;
    return null;
  },
  prepare(app, o, s){
    /* 扫描定义网格：非 o.grid 先切回（allocGrid3d + 重载预设，selGrid3 同路径） */
    s._savedGrid = app.state.grid;
    if (app.state.grid !== o.grid){
      app.state.grid = o.grid;
      const g3 = app.q('#selGrid3'); if (g3) g3.value = String(o.grid);
      app.allocGrid3d(o.grid);
      app.loadPreset(app.state.preset);
    }
    /* 冻结 σ（initWave3d 每点用它重发波包） */
    s._savedSigma = app.state.sigma;
    app.state.sigma = o.sigma;
    /* 入射中心能量（离散色散，与 barrier3d.js 的 E(k) 同口径） */
    s.Ec = s.model.E(o.kx);
  },
  afterList(app, o, s){
    /* 共振预测位（q·R=nπ 的理想位 + Δk 卷积模型的数值峰位） */
    s.resonances = s.model.resonances(s.Ec, o.R);
    s.convPeaks = s.model.convolvedPeaks(o.kx, 1/(Math.SQRT2*o.sigma), o.R,
      Math.min(...s.v0s), Math.max(...s.v0s), s.Ec/200);
  },
  teardown(app, s){
    app.state.sigma = s._savedSigma;
    if (app.state.grid !== s._savedGrid){
      app.state.grid = s._savedGrid;
      const g3 = app.q('#selGrid3'); if (g3) g3.value = String(s._savedGrid);
      app.allocGrid3d(s._savedGrid);
    }
    app.loadPreset(app.state.preset);
  },
  buildList(o, s){
    if (o.v0s){ s.v0s = o.v0s.slice(); return s.v0s; }
    const list = [];
    for (let i = 0; i < o.v0N; i++)
      list.push((o.v0Lo + (o.v0Hi - o.v0Lo) * i / Math.max(1, o.v0N - 1)) * s.Ec);
    s.v0s = list;
    return list;
  },
  beginPoint(app, x, o, s){
    /* 势：球垒（参数级；无画布）——potKind/potR/potV0 直接写 state */
    app.state.potKind = 1;          /* POT_SPHERE */
    app.state.potR = o.R;
    app.state.potV0 = x;
    /* 入射波包：迎头 +x，中心 y=z=0（世界坐标），起点 x0=−(R+10) */
    const x0 = -(o.R + 10);
    app.initWave3d({ wave3: [0.5 + x0/o.grid, 0.5, 0.5, o.kx, 0, 0], kind: 'gaussian' });
    s._bandPeak = 0; s._fwdPeak = 0;
  },
  measure(app, o, frames, s){
    /* 原子快照：全卷回读一次，同时给出 P / 透射（前门）/ 反射（后门）/ 垒区壳层。
       索引布局与 readWave3 一致：((z·n+y)·n+x)·2，(re,im) 交错；
       世界坐标 w.x = x+0.5−n/2（texel 单位，与 pot3JS/shader 的 uGrid3 口径一致）。 */
    const n = app.state.grid;
    const buf = app.readWave3();
    const R = o.R, pad = o.pad, gate = R + pad;
    const gateI = n/2 + gate - 0.5;        /* w.x > gate ⟺ x > gateI */
    const backI = n/2 - gate - 0.5;        /* w.x < −gate ⟺ x < backI */
    const rIn = (R - pad)*(R - pad), rOut = (R + pad)*(R + pad);
    let P = 0, fwd = 0, back = 0, band = 0;
    for (let l = 0; l < n; l++){
      const wz = l + 0.5 - n/2, wz2 = wz*wz;
      for (let y = 0; y < n; y++){
        const wy = y + 0.5 - n/2;
        const row = (l*n + y)*n;
        for (let x = 0; x < n; x++){
          const i = (row + x)*2;
          const p = buf[i]*buf[i] + buf[i+1]*buf[i+1];
          P += p;
          if (x > gateI) fwd += p;
          else if (x < backI) back += p;
          const wx = x + 0.5 - n/2;
          const r2 = wx*wx + wy*wy + wz2;
          if (r2 > rIn && r2 < rOut) band += p;
        }
      }
    }
    return { P, fwd, back, band };
  },
  decide(m, frames, s){
    /* 兜底置顶（R38 修 bug）：旧结构把 framesMax 放在末行 return，而
       band-clear 分支提前 return false——3D 盒内 band 因反射波尾迹反复越界、
       永不持续清空，兜底永不可达（首点曾卡到 1708/400 帧）。 */
    if (frames >= s.opts.framesMax) return true;
    if (m.band > s._bandPeak) s._bandPeak = m.band;
    /* 门：帧数 ≥ 30 且垒区概率曾 ≥ 1%·P（波包确实撞上了垒） */
    if (frames < GATE3_FRAMES || s._bandPeak < GATE3_BAND*m.P) return false;
    /* 首程测量窗（R38 重设计）：fwd 单调升→平台→（墙返回后）回落。
       门开时透射波尚未过门（fwd 仍在升），故「自峰值回落 ≥10%」只可能在
       墙返回后发生——峰值即首程透射率。 */
    if (m.fwd > s._fwdPeak) s._fwdPeak = m.fwd;
    if (s._fwdPeak > 0 && m.fwd < s._fwdPeak*(1 - DROP3_REL)) return true;
    return false;
  },
  record(m, s){
    s.results.push({
      v0: s._x, T: s._fwdPeak/m.P,
      frames: s._frames, P: m.P, fwd: s._fwdPeak, back: m.back,
      fwdEnd: m.fwd,           /* 停止帧的 fwd（回落幅度诊断：fwdEnd/fwdPeak） */
    });
  },
  statusText(final, s){
    if (s.busy){
      const r = s.results[s.results.length - 1];
      return (s._i + 1) + '/' + s.v0s.length +
        ' · V0=' + s._x.toFixed(4) + ' (V0/E=' + (s._x/s.Ec).toFixed(2) + ')' +
        ' · 帧 ' + s._frames + '/' + s.opts.framesMax +
        (r ? ' · 上点 T=' + r.T.toFixed(4) : '');
    }
    if (final && s.results.length){
      const sm = s.summary;
      return '完成 ' + s.results.length + ' 点 · 最大偏差 ×' + sm.maxRatio.toFixed(2) +
        '（vs 射线修正）· s 波 ×' + sm.maxRatioConv.toFixed(2) +
        (sm.worst ? ' @V0/E=' + (sm.worst.v0/s.Ec).toFixed(2) : '') +
        (sm.measPeaks.length ? ' · 实测峰 @V0/E=' + sm.measPeaks.map(p => (p.v0/s.Ec).toFixed(2)).join('/') : '');
    }
    return null;
  },
  summarize(results, app, o, s){
    /* 偏差汇总（双口径，R38）：
       · maxRatio——实测 vs 射线修正模型 rayCorrected（含「绕球透射」修正，
         3D 波包扫描的合理对照目标）；面板/toast 主口径；
       · maxRatioConv——实测 vs Δk 卷积 s 波模型。实测系统性高于 s 波曲线是
         真实物理（绕球透射，b>R 份额不撞球，见 barrier3d.js 文件头），
         如实保留该口径供对照，而非调参掩盖。 */
    let maxRatio = 0, worst = null, maxRatioConv = 0, worstConv = null;
    const dk = 1/(Math.SQRT2*o.sigma);
    const x0 = -(o.R + 10);
    for (const r of results){
      const tr = s.model.rayCorrected(o.kx, o.sigma, r.v0, o.R, x0);
      if (tr > 1e-6 && r.T > 1e-6){
        const ratio = Math.max(r.T/tr, tr/r.T);
        if (ratio > maxRatio){ maxRatio = ratio; worst = r; }
      }
      const tc = s.model.convolved(o.kx, dk, r.v0, o.R);
      if (tc > 1e-6 && r.T > 1e-6){
        const ratio = Math.max(r.T/tc, tc/r.T);
        if (ratio > maxRatioConv){ maxRatioConv = ratio; worstConv = r; }
      }
    }
    /* 实测峰位（局部极大，T>0.15 过滤噪声级抖动） */
    const measPeaks = [];
    for (let i = 1; i < results.length - 1; i++){
      const a = results[i-1].T, b = results[i].T, c = results[i+1].T;
      if (b >= a && b >= c && b > 0.15) measPeaks.push(results[i]);
    }
    return { maxRatio, worst, maxRatioConv, worstConv, measPeaks };
  },
  startToast(s){
    return '3D 透射扫描开始 · 球垒 R=' + s.opts.R + ' · kx=' + s.opts.kx + ' σ=' + s.opts.sigma +
      ' · ' + s.opts.grid + '³' + (s.resonances.length ? ' · 共振预测 ' + s.resonances.length + ' 处' : '');
  },
  stopToast(s){
    return '3D 扫描已中止（' + s.results.length + '/' + s.v0s.length + ' 点）';
  },
  finishToast(s){
    const sm = s.summary;
    return '3D 扫描完成 · ' + s.results.length + ' 点 · 最大偏差 ×' + sm.maxRatio.toFixed(2) +
      '（vs 射线修正）· s 波 ×' + sm.maxRatioConv.toFixed(2) +
      (sm.measPeaks.length ? ' · 实测峰 ' + sm.measPeaks.length + ' 处' : '');
  },
  plot(cv, results, app, s){
    const x = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const L = 36, R = 8, T = 16, B = 22;
    const pw = W - L - R, ph = H - T - B;
    x.clearRect(0, 0, W, H);
    x.fillStyle = 'rgba(4,8,16,.55)'; x.fillRect(0, 0, W, H);
    if (!results.length) return;
    const o = s.opts, Ec = s.Ec;
    const xMax = Math.max(...results.map(r => r.v0/Ec)) * 1.08;
    const xMin = 0, yMin = -4, yMax = 0;                 /* log10 T ∈ [1e-4, 1] */
    const X = v => L + (v - xMin)/(xMax - xMin)*pw;
    const Y = t => {
      const l = Math.log10(Math.max(1e-4, Math.min(1.02, t)));
      return T + (yMax - l)/(yMax - yMin)*ph;
    };
    /* 网格与刻度（同 2D 扫描器样式） */
    x.font = '9px ui-monospace,monospace';
    x.strokeStyle = 'rgba(120,160,220,.14)'; x.fillStyle = '#9aa7bd'; x.lineWidth = 1;
    for (let d = yMin; d <= yMax; d++){
      const yy = Y(Math.pow(10, d));
      x.beginPath(); x.moveTo(L, yy); x.lineTo(W - R, yy); x.stroke();
      x.textAlign = 'right'; x.fillText('1e' + d, L - 3, yy + 3);
    }
    for (let i = 0; i <= 4; i++){
      const v = xMin + (xMax - xMin)*i/4, xx = X(v);
      x.beginPath(); x.moveTo(xx, T); x.lineTo(xx, T + ph); x.stroke();
      x.textAlign = 'center'; x.fillText(v.toFixed(2), xx, H - 8);
    }
    /* E=V0 分界（<1 越障共振区 / >1 隧穿区） */
    if (xMax > 1){
      const x1 = X(1);
      x.strokeStyle = 'rgba(251,191,36,.45)'; x.setLineDash([3, 3]);
      x.beginPath(); x.moveTo(x1, T); x.lineTo(x1, T + ph); x.stroke();
      x.setLineDash([]);
      x.fillStyle = '#fbbf24'; x.textAlign = 'left'; x.fillText('E=V0', x1 + 3, T + 9);
    }
    /* 共振预测位（q·R=nπ 理想位，红色虚线）+ 卷积模型数值峰（紫色点线） */
    for (const r of s.resonances){
      if (r.ratio > xMax) continue;
      const xx = X(r.ratio);
      x.strokeStyle = 'rgba(248,113,113,.55)'; x.setLineDash([4, 3]);
      x.beginPath(); x.moveTo(xx, T); x.lineTo(xx, T + ph); x.stroke();
      x.setLineDash([]);
      x.fillStyle = '#f87171'; x.textAlign = 'left'; x.fillText('n=' + r.n, xx + 2, T + 20);
    }
    /* 解析曲线：s 波中心 E（灰）、Δk 卷积（琥珀）、射线修正（绿，3D 对照目标） */
    const dk = 1/(Math.SQRT2*o.sigma);
    const curve = (fn, color, width) => {
      x.strokeStyle = color; x.lineWidth = width; x.beginPath();
      let started = false;
      for (let i = 0; i <= 160; i++){
        const v = xMin + (xMax - xMin)*i/160;
        const t = fn(v*Ec);
        if (!(t > 0)){ started = false; continue; }
        const px = X(v), py = Y(t);
        if (!started){ x.moveTo(px, py); started = true; } else x.lineTo(px, py);
      }
      x.stroke();
    };
    curve(v => s.model.T(Ec, v, o.R), 'rgba(154,167,189,.5)', 1);
    curve(v => s.model.convolved(o.kx, dk, v, o.R), '#fbbf24', 1.4);
    /* 射线修正（R38）：3D 波包「绕球透射」的经典估计，实测的合理对照目标 */
    curve(v => s.model.rayCorrected(o.kx, o.sigma, v, o.R, -(o.R + 10)), '#86efac', 1.4);
    /* 实测散点 */
    x.fillStyle = '#67e8f9';
    for (const r of results){
      const px = X(r.v0/Ec), py = Y(r.T);
      x.beginPath(); x.arc(px, py, 2.6, 0, 6.2832); x.fill();
    }
    /* 轴标签与图例 */
    x.fillStyle = '#9aa7bd'; x.textAlign = 'center';
    x.fillText('V0 / E', L + pw/2, H - 1);
    x.save(); x.translate(9, T + ph/2); x.rotate(-Math.PI/2);
    x.fillText('透射率 T', 0, 0); x.restore();
    x.textAlign = 'left';
    x.fillStyle = '#67e8f9'; x.fillText('● 实测', L + 4, T + 10);
    x.fillStyle = '#fbbf24'; x.fillText('— Δk 卷积', L + 44, T + 10);
    x.fillStyle = '#86efac'; x.fillText('— 射线修正', L + 112, T + 10);
    x.fillStyle = 'rgba(154,167,189,.8)'; x.fillText('— s 波中心 E', L + 180, T + 10);
  },
};

/* ============================================================================
 * 双缝图样扫描（R40；3D POT_DOUBLE_SLIT 预设的扫描版）
 *
 * 对每个缝距 D 重发同一入射波包（slits3d 口径：kx=1.2、σ=6、x₀=−26、墙
 * V₀=3/wallT/4/slitW=6、屏幕 x=24），演化到波包过屏时刻测屏剖面
 * （screenSlice3 的 z 求和 = |φ_2D|²，R39 可分离性口径），提取峰位/峰数/
 * 间距/可见度。D=0 为单缝退化点（对照）。与 3D 透射扫描同一生命周期契约
 * （基类承载）。
 *
 * 停止判据（固定窗，非自适应）：R39 已验证本几何时间线确定性——入射到屏
 * 的飞行时间只由 kx/σ 决定、与 D 无关（D 只改 y 方向结构）⟹ 每点在测量窗
 * [32, 56] 帧内等间隔测 4 次，取峰数最多帧记录（平手取最早）；framesMax
 * 兜底置顶。放弃「峰数增长即停」类自适应判据的缘由：峰数在窗内非单调
 * （波前到达过程中条纹逐步成形），固定窗 + 最多峰选取对 D 引起的小时序
 * 差异更稳。
 *
 * 参考模型（Fraunhofer 远场近似，仅供定性对照）：λ=2π/k、L=屏幕−墙心，
 * 双缝峰位 y_n=n·λL/D、单缝包络零点 y_m=m·λL/W。本几何 D²/λ≫L 深 Fresnel
 * 区 + 脉冲源时间 smear ⟹ 定量失效（R39 实测双瓣而非等间距条纹），偏差
 * 如实记录进 summary 而非调参掩盖。
 * ========================================================================== */

const SLITSCAN_DEFAULTS = {
  kx: 1.2, sigma: 6,            /* 入射波包（slits3d 预设口径，rad/texel） */
  x0: -26,                      /* 波包起点（世界坐标） */
  screenX: 24,                  /* 屏幕世界 x（R39 口径） */
  grid: 64,                     /* 扫描网格（R39 预设默认） */
  v0: 3, wallT: 4, slitW: 6,    /* 固定墙参数（slits3d 口径；D 为扫描变量） */
  dLo: 0, dHi: 32, dN: 9,       /* D 扫描范围（含 0 单缝退化点；滑块量程 0–32） */
  ds: null,                     /* 显式 D 列表（绝对单位）时忽略上面范围 */
  boost: 4,                     /* 每 rAF tick 推进的物理帧数 */
