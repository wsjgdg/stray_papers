/* ===== src/physics/measure.js ===== */
/* ============================================================================
 * measure.js — 投影测量原语（R68：公理体系唯一空缺的「非酉操作」）
 *
 * 数学契约（与 probSplit / spinSum 同级的「引擎层测量原语」——本文件只做
 * 示性投影、归一化与伯努利采样，不含任何物理模型；app.js 负责读回/上传）：
 *
 *   二值测量（von Neumann 投影公理，理想位置测量）：
 *     投影算符 Π_S = 1_S(x)（区域 S 的示性函数，S = x 向或 y 向条带）。
 *     测得「在 S 内」的概率   p = ⟨ψ|Π_S|ψ⟩ = Σ_{i∈S}|ψ_i|²；
 *     坍缩态                  ψ' = Π_S ψ/√p（命中）/ (1−Π_S)ψ/√(1−p)（未命中）。
 *   幂等性：Π_S² = Π_S ⟹ 对已坍缩态重复同一测量，p=1（或 0）、态不变
 *     （机器精度；残余来自 float32 纹理往返与归一化舍入）。
 *   与 R69 的关系：退相干 T₂ 的「纯退相位」通道复用这里的读回/上传路径，
 *     投影算符推广到密度矩阵（环境指针）——本文件是那条通道的第一步。
 *
 * 单位与布局：buf 为引擎 psiA 的 CPU 镜像（Float32Array，格点交错
 * (re,im[,re2,im2])，ch = pairs*2）；mask 与格点一一对应（Uint8Array）。
 * ==========================================================================*/

/* 条带掩膜：axis 'x' ⟹ 保留 lo≤x/g<hi 的整列；'y' ⟹ 保留 lo≤y/g<hi 的整行。
   世界坐标口径与 probSplit(xSplit) 一致（0..1）。 */
function bandMask(g, axis, lo, hi){
  const mask = new Uint8Array(g*g);
  const i0 = Math.max(0, Math.min(g, Math.floor(lo*g)));
  const i1 = Math.max(0, Math.min(g, Math.ceil(hi*g)));
  if (i1 <= i0) return mask;
  if (axis === 'x'){
    for (let y = 0; y < g; y++)
      for (let x = i0; x < i1; x++) mask[y*g + x] = 1;
  } else {
    for (let y = i0; y < i1; y++)
      for (let x = 0; x < g; x++) mask[y*g + x] = 1;
  }
  return mask;
}

/* 单点全分量密度 Σ|ψ_c|²（ch=2 标量 / ch=4 双分量——RG32F 采样得
   (r,g,0,1)，只对真实存在的 ch 个通道求和）。 */
function densityAt(buf, i, ch){
  let s = 0;
  for (let c = 0; c < ch; c++){ const v = buf[i + c]; s += v*v; }
  return s;
}

/* 带内/总概率（不改场）：pIn = Σ_{i∈S}|ψ_i|² / Σ|ψ_i|²。 */
function bandProb(buf, ch, mask){
  let sIn = 0, sAll = 0;
  const n = mask.length;
  for (let i = 0; i < n; i++){
    const p = densityAt(buf, i*ch, ch);
    sAll += p;
    if (mask[i]) sIn += p;
  }
  return { pIn: sAll > 0 ? sIn/sAll : 0, sIn, P: sAll };
}

/* 就地投影：hit=true 保留带内、清零带外；hit=false 反之。返回保留侧概率
   （归一化前）——von Neumann 的 p 或 1−p。注意：现场会被改写。 */
function projectBand(buf, ch, mask, hit){
  let keep = 0, drop = 0;
  const n = mask.length;
  for (let i = 0; i < n; i++){
    const inside = mask[i] === 1;
    const keepThis = inside === hit;
    if (keepThis) keep += densityAt(buf, i*ch, ch);
    else {
      drop += densityAt(buf, i*ch, ch);
      const j = i*ch;
      for (let c = 0; c < ch; c++) buf[j + c] = 0;
    }
  }
  return { keep, drop, pKeep: (keep + drop) > 0 ? keep/(keep + drop) : 0 };
}

/* 整体归一化到 Σ|ψ|²=1（坍缩后概率不再为 1，必须重标度）。 */
function normalizeBuf(buf, ch){
  let s = 0;
  for (let i = 0; i < buf.length; i += ch) s += densityAt(buf, i, ch);
  if (s <= 0) return 0;
  const f = 1/Math.sqrt(s);
  for (let i = 0; i < buf.length; i++) buf[i] *= f;
  return 1;
}

/* 逐分量最大残差（按峰值归一化）：|ψ_a−ψ_b|∞ / max|ψ_b|。
   幂等验证用：对同一投影算符，ψ₂−ψ₁ 应 ≤ float32 往返量级。 */
function maxResidual(a, b, ch){
  let mx = 0, pk = 0;
  for (let i = 0; i < a.length; i++){
    const d = Math.abs(a[i] - b[i]);
    if (d > mx) mx = d;
    const p = Math.abs(b[i]);
    if (p > pk) pk = p;
  }
  return pk > 0 ? mx/pk : mx;
}

/* 伯努利采样（概率 p 命中）。rng 可注入：单测传确定性序列，
   浏览器传 Math.random。 */
function bernoulli(p, rng){
  const r = rng || Math.random;
  return r() < p;
}

/* ===== src/physics/wkb.js ===== */
/* ============================================================================
 * WKB 透射包络（R70：双势垒 T(E) 曲线的解析对照）
 *
 * 动机：R67 的离散 TMM 给出双垒 T(E) 的「精确数值」（与 GPU 同一 5 点递推），
 * 但曲线上**没有解析参照**——共振峰为什么在那里、包络为什么按那个斜率衰减，
 * 都缺一个闭式答案。WKB 补上这一块：
 *   · E < V0：T_WKB ≈ exp(−4κb)（两片墙各贡献 exp(−2κb)，κ=√(2m(V0−E))）
 *     ——这是「非共振谷底」的包络；精确曲线在谷底附近贴着它，在共振处冲到 1。
 *   · E > V0：领头阶 WKB 无反射 ⟹ T=1；精确曲线在 1 附近振荡（垒内往返相位），
 *     振幅 ~ V0²/(4E(E−V0)) 随 E 衰减 ⟹ 高端「平均」收敛到 1。
 *   · E ≈ V0：**WKB 失效**（两个转向点重合，连接公式的指数衰减假设崩溃）——
 *     如实标注，不把失效区画成可信曲线。
 *
 * 诚实边界（与 README/面板 hint 同款，不装作精确）：
 *   · 领头阶 WKB 不含连接公式的振幅前因子：单垒精确解
 *     T = [1 + V0²sinh²(κa)/(4E(V0−E))]⁻¹ ≈ 16E(V0−E)/V0² · e^{−2κa}
 *     比 e^{−2κa} 多一个前因子 16E(V0−E)/V0²（E≪V0 时 ≪1）。所以收敛性
 *     判据用**不透明度**（=−½ln T，前因子只是可加常数）而非 T 点值：
 *     不透明度_WKB = 2κb（T_WKB=e^{−4κb}）与不透明度_精确在 E≪V0、κb 大时收敛。
 *   · WKB 包络**看不到共振峰**（准束缚结构需要well内相位匹配，超出领头阶）——
 *     这正是「精确 TMM 峰 + WKB 谷底包络」对照的教学价值所在。
 *   · 准能级用 Bohr–Sommerfeld 驻波条件 k·gap = nπ；本模块给**离散色散版**
 *     E_n = 2uK(1−cos(nπ/gap))（R67 的 (nπ/gap)²uK 是其低 k 近似，
 *     n 高时 k→π、离散版显著更低——引擎离散口径的正确答案）。
 * ========================================================================== */

/* 双垒 WKB 模型。单位与引擎一致：格点（texel）、ℏ=1、m 为粒子质量。
   参数：V0 垒高、bw 单片垒宽（texel）、gap 中央阱宽（texel）。 */
function wkbBarrierModel(m){
  const uK = 0.5/m;
  /* 连续衰减常数 κ(E)=√(2m(V0−E))（ℏ=1） */
  const kappa = (E, V0) => (E < V0) ? Math.sqrt(Math.max(0, 2*m*(V0 - E))) : 0;
  /* WKB 双垒透射包络（领头阶）：
     E<V0：exp(−4κb)（谷底）；E>V0：1（无反射领头阶）；E=V0：失效（返回 NaN，
     调用方负责标注——不把失效区画成曲线）。 */
  const envelope = (E, V0, bw, gap) => {
    if (!(V0 > 0)) return 1;
    if (Math.abs(E - V0) < 1e-9) return NaN;      /* 转向点重合：WKB 失效 */
    if (E < V0) return Math.exp(-4*kappa(E, V0)*bw);
    return 1;
  };
  /* WKB 不透明度（=−½ln T；双垒 T_WKB=e^{−4κb} ⟹ 不透明度 = 2κb。
     E>V0 时为 0（领头阶无反射）。注意与「光学深度」−lnT=4κb 的口径差
     2×——本模块统一用 −½lnT（与 TMM 实测 −½lnT 直接可比）。 */
  const opacity = (E, V0, bw) => (E < V0) ? 2*kappa(E, V0)*bw : 0;
  /* Bohr–Sommerfeld 准能级（离散色散）：阱内驻波 k·gap = nπ，
     k = 2·asin(√(mE/2)) 的反演 ⟹ E_n = 2uK(1−cos(nπ/gap))。
     返回 [{n, E, k}]，k=nπ/gap 为离散波数。 */
  const quasiLevels = (V0, gap, nMax, Emax) => {
    const out = [];
    for (let n = 1; n <= nMax; n++){
      const k = n*Math.PI/gap;
      if (k >= Math.PI) break;                    /* 带顶以上无导带 */
      const E = 2*uK*(1 - Math.cos(k));
      if (E < Emax) out.push({ n, E, k });
    }
    return out;
  };
  /* 与 dbCurve 同网格采样的包络点（画布叠加用） */
  const curvePoints = (V0, bw, gap, Emax, nE) => {
    const pts = [];
    for (let i = 0; i < nE; i++){
      const E = 2e-4 + (Emax - 2e-4)*i/(nE - 1);
      pts.push({ E, T: envelope(E, V0, bw, gap) });
    }
    return pts;
  };
  return { uK, kappa, envelope, opacity, quasiLevels, curvePoints };
}

/* ===== src/physics/scatter.js ===== */
/* ============================================================================
 * 球方垒散射：相移 δ_l + 分波截面（R70：解析对照补齐）
 *
 * 物理：半径 R、高 V0 的球形势垒，入射平面波能量 E。分波展开
 *     ψ = Σ_l (2l+1) i^l P_l(cosθ) · R_l(r)
 * 径向约化函数 u_l = r·R_l 满足 u_l'' + [k² − l(l+1)/r² − V(r)]u_l = 0，
 * 渐近 u_l ∝ sin(kr − lπ/2 + δ_l)。相移由 r=R 的对数导数匹配定出：
 *
 *   垒外（E>V0）：u ∝ kr·j_l(kr)，散射解 u ∝ kr[j_l(kr)cos δ − n_l(kr)sin δ]
 *   垒内（E>V0）：u ∝ qr·j_l(qr)，q = √(2m(E−V0))（正则）
 *   垒内（E<V0）：u ∝ κr·i_l(κr)，κ = √(2m(V0−E))（修正球贝塞尔，正则）
 *
 * 匹配 u、u' 连续 ⟹ tan δ_l = (A' − L_in·A)/(B' − L_in·B)
 *     A = j_l(kR), B = n_l(kR), A' = k·j_l'(kR), B' = k·n_l'(kR)
 *     L_in = 垒内对数导数 u'_in(R)/u_in(R)：
 *       E>V0：q·j_l'(qR)/j_l(qR)（节点处 → ±∞，公式自然给出 Dirichlet 极限）
 *       E=V0：u ∝ r^{l+1} ⟹ (l+1)/R（精确极限）
 *       E<V0：κ·i_l'(κR)/i_l(κR)（**标度化**求值防 e^{κR} 上溢，见下）
 *
 * 自检锚点（CPU 验证脚本同款）：硬球 V0→∞ ⟹ δ_0=−kR；自由 V0=0 ⟹ δ_l=0；
 * 低能 δ_l ~ (kR)^{2l+1}；s 波共振 δ_0=π/2 ⟹ σ_0=4π/k²（幺正上限）；
 * 与 1D 全宽 2R 对称垒 TMM 的奇宇称 sector 对应 δ_0=½arg(t−r)。
 *
 * 截面（分波求和）：
 *     σ_tot = (4π/k²) Σ_l (2l+1) sin²δ_l
 *     f(θ) = (1/2ik) Σ_l (2l+1)(e^{2iδ_l}−1) P_l(cosθ)
 *     dσ/dΩ = |f(θ)|²
 *
 * 验证结论（pot70 验证脚本同款，CPU 三层交叉）：
 *   ① 教科书关系机器精度：E<V0 cot(kR+δ)=(κ/k)coth(κR)；
 *      E>V0 tan(kR+δ)=(k/q)tan(qR)（偏差 1e-11~1e-16）。
 *   ② 格点奇宇称直接积分（独立数值实现，原点节点奇初值向右递推）
 *      与 texel 级精确离散界面条件机器精度一致（1e-13~1e-15）：
 *        tan(kR+δ) = tan(k/2)·coth(κ/2)·tanh(κR)   （E<V0）
 *        tan(kR+δ) = tan(k/2)·cot(q/2)·tan(qR)      （E>V0）
 *      连续极限 (k/κ)tanh(κR)、(k/q)tan(qR) ✓ 自洽。
 *   ③ 模型（连续函数形式 + 离散色散）vs 格点精确解残差 0.014~0.04 rad，
 *      与 O(h²) 界面修正解析预测**逐位吻合**：连续式 (k/κ)tanh(κR) 与
 *      离散式 tan(k/2)coth(κ/2)tanh(κR) 之差 = 因子 1+(k²−κ²)/12。
 *      ⟹ 模型在连续极限精确；格点 O(h²) 修正已解析量化（非 bug）。
 *   ④ 离散档湮灭指数必须用负能解析延拓 κ=arccosh(1+m·d)（=2asinh(√(md/2))），
 *      误用传播公式 arccos(1−m·d) 曾造成 0.05 rad 恒定残差（已修）。
 *   ⑤ modSphRatio 连分数修复（R70 收尾轮，pot70 S10/S12）：旧版用种子
 *      (î_L, î_{L+1})=(1,0) 的向下递推，z≫l 时递推混入不衰减的第二解
 *      （交替解 |λ|≈1），z≳16 后比值退化为 ~(−1)^n 震荡垃圾（l=2、
 *      z=1.1e5 时返回 1.3e-3 而非 1+2/z），破坏 l≥1 的 Dirichlet 硬球
 *      极限（δ_2 偏 3.3%）。potR≤20 × V0≳0.35 ⟹ z=κR 可达 28——UI
 *      高端同样踩坑，故必须连分数（全正项、无条件稳定）。修复后经三层
 *      独立参考验证：直接 i 级数 4.9e-16（l=1..8、中 z）；硬球前向
 *      j/n 级数参考（V0=1e8）mod π ≤2.2e-5（残差 = atan((k/κ)tanh κR)
 *      有限 V0 修正，解析可释）；Numerov 端到端（1/x 渐近修正 +
 *      Richardson）l=0..3、E 双侧 ≤8.5e-6。
 *
 * 色散口径（与 barrier3d.js 逐字一致的项目约定）：
 *   · 'continuous'：教科书连续色散 k=√(2mE)（解析球贝塞尔对照的基准）；
 *   · 'discrete'：引擎 5 点/7 点 stencil 沿轴离散色散 k=kOf(E)=2asin(√(mE/2))
 *     （E≥2/m 截到带顶 π）——与 GPU 实测对照时用这一档。
 *   两档差异即格点色散效应，CPU 验证脚本量化（低 k 处应不可分辨）。
 *
 * 诚实边界（文档化，不装作精确）：
 *   · 模型是**球方垒平面波**；GPU 实测是有限宽波包（Δk 展宽 + 横向 l≥1
 *     耦合 + 绕球份额，R38 已量化）⟹ 对照目标是包络与极限，不是点值相等。
 *   · 分波求和按 l 截断（lmax），截断误差由尾部 (2l+1)sin²δ_l 估计。
 *   · 球方垒解析解假设 r<R 内 V 恒为 V0。引擎侧：**3D** 势经 uniform 以
 *     float 注入（uPotV0，无量化，R70 面板直接读 state.potV0/potR）；
 *     **2D** 势纹理 8 位量化（vGray: round(v·127+128)，解码 round(v·127)/127）
 *     ——2D 对照须对齐量化后的 V0（调用方负责）。
 * ========================================================================== */

/* ---- 球贝塞尔（float64）----
   j_l：向下递推（Miller）+ j_0=sin z/z 归一化——对 l>z 也稳定；
   **起始索引必须远在转折区 n≈z+c·z^{1/3} 之上**：L=ceil(z)+12+⌈6·z^{1/3}⌉
   （实证：固定 L=16 在 z≳10 后精度崩塌——z=20 时 69× 错、符号都反；
   potR≤20 × k≤π ⟹ z=kR 可达 63，UI 高端全靠这条规则兜底）。 */
function sphJ(l, z){
  if (l === 0) return Math.abs(z) < 1e-12 ? 1 : Math.sin(z)/z;
  const L = Math.max(l + 12, Math.ceil(z) + 12 + Math.ceil(6*Math.cbrt(z)));
  let jp1 = 0, jp0 = 1, jl = 0;               /* j_{n+1}, j_n；jl 捕获 j_l */
  for (let n = L; n >= 1; n--){
    const jm1 = (2*n + 1)/z*jp0 - jp1;        /* j_{n-1} = (2n+1)/z·j_n − j_{n+1} */
    if (n - 1 === l) jl = jm1;
    jp1 = jp0; jp0 = jm1;
  }
  /* 循环结束后 jp0 = 未归一化 j_0；用精确 j_0 定标度 */
  const j0 = Math.abs(z) < 1e-12 ? 1 : Math.sin(z)/z;
  return jl*(j0/jp0);
}
function sphN(l, z){
  if (l === 0) return -Math.cos(z)/z;
  let nm1 = -Math.cos(z)/z;                   /* n_0 */
  let n0 = -Math.cos(z)/(z*z) - Math.sin(z)/z;/* n_1 */
  if (l === 1) return n0;
  for (let n = 1; n < l; n++){
    const np1 = (2*n + 1)/z*n0 - nm1;         /* n_{n+1} = (2n+1)/z·n_n − n_{n-1} */
    nm1 = n0; n0 = np1;
  }
  return n0;
}
/* 标度化修正球贝塞尔比值 i_{l-1}(z)/i_l(z)（防 e^z 上溢）：
   **连分数递推**（全正项、无条件稳定）。由递推 i_{n-1} = i_{n+1} +
   (2n+1)/z·i_n 除以 i_n：令 ρ_n = i_{n+1}/i_n，则
       ρ_{n-1} = 1/(ρ_n + (2n+1)/z)，  r_l = i_{l-1}/i_l = ρ_l + (2l+1)/z
   自高阶截断 N = max(l+24, ⌈z⌉+24) 起步（ρ_N ≈ z/(2N+3)），截断误差按
   ∏1/a_n²（a_n=(2n+1)/z）指数衰减。l=0 用闭式 coth z。
   历史 bug（已修）：旧版用种子 (î_L, î_{L+1})=(1,0) 的向下递推——z≫l 时
   递推的第二解（交替解 |λ|≈1）不衰减，算出的比值在 z≳16 后变成
   ~(−1)^n 震荡垃圾（l=2、z=1.1e5 时返回 1.3e-3 而非 1+2/z），破坏
   l≥1 的 Dirichlet 硬球极限（δ_2 偏 3.3%）。potR≤20 × V0≳0.35 ⟹
   z=κR 可达 28——UI 高端同样踩坑，故必须连分数。 */
function modSphRatio(l, z){
  if (l === 0) return 1/Math.tanh(z);                  /* i_{-1}/i_0 = coth z（不溢出） */
  if (l < 0) return NaN;
  const N = Math.max(l + 24, Math.ceil(z) + 24);
  let rho = z/(2*N + 3);                              /* 高阶种子 i_{N+1}/i_N ≈ z/(2N+3) */
  for (let n = N; n >= l + 1; n--) rho = 1/(rho + (2*n + 1)/z);
  return rho + (2*l + 1)/z;
}
const dSphJ = (l, z) => (l === 0) ? -sphJ(1, z) : sphJ(l - 1, z) - (l + 1)/z*sphJ(l, z);
const dSphN = (l, z) => (l === 0) ? -sphN(1, z) : sphN(l - 1, z) - (l + 1)/z*sphN(l, z);

/* 引擎离散色散（barrier.js / barrier3d.js 同款反解） */
const kOfD = (E, m) => {
  if (!(E > 0)) return 0;
  const s = m*E/2;
  return s >= 1 ? Math.PI : 2*Math.asin(Math.sqrt(s));
};

function sphericalScatterModel(m){
  /* 垒内对数导数 L_in = u'_in(R)/u_in(R)（数值稳定形式） */
  const logDerivIn = (l, E, V0, R, disp) => {
    const d = V0 - E;
    if (Math.abs(d) < 1e-12) return (l + 1)/R;         /* E=V0：u ∝ r^{l+1} */
    if (d < 0){                                          /* E>V0：导带 */
      const q = disp === 'discrete' ? kOfD(E - V0, m) : Math.sqrt(2*m*(E - V0));
      if (!(q > 1e-9)) return (l + 1)/R;                /* q→0 同 E=V0 极限 */
      const z = q*R;
      const jl = sphJ(l, z);
      if (Math.abs(jl) < 1e-300) return Infinity;       /* 内节点：Dirichlet 极限 */
      /* i_l' = j_{l-1} − (l+1)/z·j_l；l=0 时 j_0' = −j_1 */
      const jlp = (l === 0) ? -sphJ(1, z) : sphJ(l - 1, z) - (l + 1)/z*jl;
      return q*jlp/jl;
    }
    /* E<V0：倏逝（标度化比值防上溢）。
       离散档湮灭指数必须用色散的负能解析延拓 κ=arccosh(1+m·d)，
       而非传播公式 arccos(1−m·d)（asinh/asin 分叉，d~0.3 时相对差 5%，
       曾造成与格点积分的 0.05 rad 恒定残差）。数值稳定式：
       arccosh(1+x) = 2·asinh(√(x/2))（小 x 不损失精度）。 */
    const ka = disp === 'discrete' ? 2*Math.asinh(Math.sqrt(m*d/2)) : Math.sqrt(2*m*d);
    const z = ka*R;
    /* i_l' = i_{l-1} − (l+1)/z·i_l ⟹ L_in = κ·(i_{l-1}/i_l − (l+1)/z) */
    const r = modSphRatio(l, z);
    return ka*(r - (l + 1)/z);
  };
  /* 单分波相移。disp='continuous' | 'discrete'（见文件头）。
     返回 { delta, tan }；E≤0 或 k=0 时 δ=0（无散射）。
     delta 归一化到 (−π/2, π/2]（相移定义 mod π；sin²δ 与 e^{2iδ} 不受
     影响，但避免自由情形 numer≡0 时 atan2(0,<0)=π 的显示伪影）。 */
  const phaseShift = (l, E, V0, R, disp) => {
    if (!(E > 0) || !(R > 0)) return { delta: 0, tan: 0 };
    const k = disp === 'discrete' ? kOfD(E, m) : Math.sqrt(2*m*E);
    if (!(k > 1e-9)) return { delta: 0, tan: 0 };
    const A = sphJ(l, k*R), B = sphN(l, k*R);
    const Ap = k*dSphJ(l, k*R), Bp = k*dSphN(l, k*R);
    const L = logDerivIn(l, E, V0, R, disp);
    const numer = Ap - L*A, denom = Bp - L*B;
    const norm = d => (d > Math.PI/2) ? d - Math.PI : d;
    if (!isFinite(numer) || !isFinite(denom)){
      /* L=±∞（内节点）⟹ Dirichlet 极限 tan δ = A/B */
      if (!isFinite(L)) return { delta: norm(Math.atan2(A, B)), tan: A/B };
      return { delta: 0, tan: 0 };
    }
    return { delta: norm(Math.atan2(numer, denom)), tan: numer/denom };
  };
  /* 分波求和：相移表 + 截面。lmax 截断 + 尾部估计。 */
  const scatter = (E, V0, R, opts) => {
    const o = Object.assign({ disp: 'continuous', lmax: 16 }, opts);
    const k = o.disp === 'discrete' ? kOfD(E, m) : Math.sqrt(2*m*E);
    const deltas = [];
    let sig = 0, tail = 0;
    for (let l = 0; l <= o.lmax; l++){
      const { delta } = phaseShift(l, E, V0, R, o.disp);
      const s2 = Math.sin(delta)*Math.sin(delta);
      const w = (2*l + 1)*s2;
      sig += w;
      if (l >= 4) tail = Math.max(tail, w);   /* 尾部量级估计（粗） */
      deltas.push({ l, delta, s2, w });
    }
    const sigma = k > 1e-9 ? 4*Math.PI/(k*k)*sig : 0;
    return { k, deltas, sigma, tail, lmax: o.lmax };
  };
  /* 散射振幅 f(θ)（复数，分波截断 lmax）与 dσ/dΩ。
     f(θ) = (1/2ik)·Σ_l (2l+1)(e^{2iδ_l}−1)P_l(cosθ)
     令 S = Σ(2l+1)P(e^{2iδ}−1) = Sr + i·Si，则 f = −i·S/(2k)
     ⟹ Re f = Si/(2k)、Im f = −Sr/(2k)（1/i 因子曾漏挂——|f|² 不受影响，
     但 Im f(0)=kσ/4π 光学定理会抓到，见 pot70 S8）。 */
  const amplitude = (E, V0, R, cosT, opts) => {
    const o = Object.assign({ disp: 'continuous', lmax: 16 }, opts);
    const sc = scatter(E, V0, R, o);
    if (!(sc.k > 1e-9)) return { re: 0, im: 0, abs: 0, dsdO: 0 };
    let sr = 0, si = 0;
    for (const d of sc.deltas){
      const e2 = Math.cos(2*d.delta), s2i = Math.sin(2*d.delta);
      /* (e^{2iδ}−1) = (cos2δ−1) + i·sin2δ */
      const cr = e2 - 1, ci = s2i;
      const P = legendre(d.l, cosT);
      const w = (2*d.l + 1)*P/(2*sc.k);
      sr += w*cr; si += w*ci;
    }
    const re = si, im = -sr;               /* f = −i·S/(2k) */
    const abs = Math.hypot(re, im);
    return { re, im, abs, dsdO: abs*abs };
  };
  /* 分波截面 σ_l = (4π/k²)(2l+1)sin²δ_l；s 波幺正上限 4π/k² */
  const partial = (E, V0, R, l, opts) => {
    const o = Object.assign({ disp: 'continuous' }, opts);
    const k = o.disp === 'discrete' ? kOfD(E, m) : Math.sqrt(2*m*E);
    if (!(k > 1e-9)) return 0;
    const { delta } = phaseShift(l, E, V0, R, o.disp);
    return 4*Math.PI/(k*k)*(2*l + 1)*Math.sin(delta)*Math.sin(delta);
  };
  return { phaseShift, scatter, amplitude, partial, logDerivIn, sphJ, sphN };
}

/* Legendre P_l（递推，cosθ∈[−1,1] 稳定） */
function legendre(l, x){
  if (l === 0) return 1;
  if (l === 1) return x;
  let pm = 1, p0 = x;
  for (let n = 1; n < l; n++){
    const p1 = ((2*n + 1)*x*p0 - n*pm)/(n + 1);
    pm = p0; p0 = p1;
  }
  return p0;
}

/* ============================================================================
 * QuantumField —— 量子场演化组件（引擎层）
 *
 * 职责：DOM 构建、GL 资源管理、KDK 积分循环、渲染管线、交互、HUD、
 *       URL 参数、调试句柄（window.__app）。
 * 物理内核（演化算子 / 波包生成 / 预设 / 附加控件）全部来自 PhysicsKernel，
 * 见 ../physics/kernel.js —— 本文件不含任何物理公式。
 *
 * 多实例安全：无模块级可变状态；一页建议只挂一个实例
 * （WebGL 上下文上限约 16，且元素 ID 为全局单例设计）。
 * ========================================================================== */

/* ---------- R52：GP 基态渐进弛豫的每帧步数预算 ----------
   GP 预设「基态（虚时间弛豫）」的虚时间流由帧循环分帧推进：每帧最多
   RELAX_BUDGET 步（实测单步 ~4ms@256² ⟹ 8 步 ≈ 32ms CPU/帧），总步数
   ~212 ⟹ ~27 帧（~0.45s@60fps）完成；弛豫期间 KDK 冻结、场快照逐帧
   上传（收敛过程可见）。数学与步进语义见 physics/gp.js 的 RELAX 注释。 */
const RELAX_BUDGET = 8;

/* ---------- 大数组 base64 助手（R37 3D 现场存档用）----------
   Float32Array ↔ base64（字节序 = 运行平台原生序，x86/ARM 均为小端；
   WebGL readPixels 产出的就是该字节序，round-trip 逐位一致）。
   分块 8192 走 String.fromCharCode.apply / charCodeAt——一次性 apply 整个
   MB 级数组会超调用栈参数上限（V8 ~65535）。 */
function f32ToB64(f32){
  const u8 = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
  let bin = '';
  const CH = 8192;
  for (let i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(bin);
}
function b64ToF32(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  const CH = 8192;
  for (let i = 0; i < bin.length; i += CH){
    const end = Math.min(i + CH, bin.length);
    for (let j = i; j < end; j++) u8[j] = bin.charCodeAt(j);
  }
  return new Float32Array(u8.buffer);
}

/* 合成到屏幕：扫描线 + 微弱噪点 + 亮度曝光（引擎级视觉，无内核注入） */
const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex;
uniform float uTime;
uniform float uBright;   /* 画面亮度（曝光）：扫描线/颗粒之后统一缩放，trail 缓冲不受影响 */
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec3 c = texture(uTex,vUv).rgb;
  c *= 0.97 + 0.03*sin(vUv.y*900.0);
  c += (hash(vUv+uTime)-0.5)*0.012;
  o = vec4(c*uBright,1.0);
}`;

/* ---------- R61 Bohm 轨迹残影管线（引擎级，无内核注入）----------
   双纹理 ping-pong（RGBA16F）：fade 全屏 pass（B = A·uFade）→ blit B→A →
   stamp POINTS + MAX 混合（A = max(A, stamp)）。读写分离避免 FBO↔sampler
   反馈环；MAX 混合对 16F 是 WebGL2 核心能力（32F 才需 EXT_float_blend）。
   stamp 的 VS 无属性输入：gl_VertexID 索引 uPos（64×1 RG32F）⟹ createProgram
   的第三参自定义 VS（gl.js R61 扩展）。停泊粒子 (−1,−1) 的裁剪坐标在
   NDC 外被光栅化丢弃。 */
const VS_BOHM_STAMP = `#version 300 es
uniform sampler2D uPos;      /* 64×1 RG32F：(x,y) uv 世界坐标 */
uniform float uPointSize;
void main(){
  vec2 p = texture(uPos, vec2((float(gl_VertexID)+0.5)/64.0, 0.5)).rg;
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
  gl_PointSize = uPointSize;
}`;
const FS_BOHM_STAMP = `#version 300 es
precision highp float;
uniform vec3 uColor;
out vec4 o;
void main(){
  float r = length(gl_PointCoord-0.5)*2.0;
  o = vec4(uColor*smoothstep(1.0, 0.35, r), 1.0);
}`;
const FS_BOHM_FADE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTrail;
uniform float uFade;
void main(){ o = vec4(texture(uTrail, vUv).rgb*uFade, 1.0); }`;

class QuantumField {
  constructor(container, options = {}){
    this.container = typeof container === 'string' ? document.querySelector(container) : (container || document.body);
    this.options = options;
    const kid = options.kernel || 'schrodinger';
    this.kernel = getKernel(kid);
    this.kernelId = this.kernel.id;
    /* 引擎级默认状态 + 内核私有参数（如 NLS 的 g）+ 调用方覆盖 */
    this.state = {
      grid: 256, m: 1.0, sigma: 7, substeps: 6, brush: 10, vStrength: 0.3,
      decay: 0.97, bright: 1.0, gamma: 0, tool: 'wave', paused: false, simTime: 0,
      driveAmp: 0, driveOmega: 0.1, driveMode: 0,
      /* AB 螺线管（R54 多管）：abSols = [[x,y,φ],...] 世界坐标元组列表
         （≤AB_MAX，放置/删除/选中见 placeSolenoid 一族）；abPhi 为「草稿磁通」——
         无选中管时 Φ 滑块编辑它，放置新管时取用；abSel 为选中管索引
         （-1 = 无选中，UI 态不存档）。abCursor 为 R55 放置预览环的鼠标世界
         坐标（null = 无预览；仅 flux 工具悬停时非空，UI 态不存档）。 */
      abPhi: 0, abSols: [], abSel: -1, abCursor: null,
      preset: null, lastWave: null, waveCount: 1,
      drag: null,
      /* 3D 交互工具（R44）：'cam' 拖拽旋转相机（默认）/ 'pot' 势刷放置 blob */
      tool3: 'cam',
      /* R61 概率流可视化：showJ = J 箭头 overlay（2D，24×24 格阵；3D 为 HUD
         统计读数）；bohmOn = Bohm 轨迹（2D 专属：64 粒子制导速度积分 +
         残影）。默认关——TPL_DISPLAY 新增段全部 uniform 门控，关闭时最终
         行与旧路径逐字等价。bohmFade = 残影每帧衰减系数。 */
      showJ: false, bohmOn: false, bohmFade: 0.985,
      /* R63 均匀磁场 B_z 的**轨道**耦合（Landau 能级）：bOrb 为格点单位的
         B（q=1）⟹ 回旋频率 ω_c=bOrb/m、回旋周期 T=2πm/bOrb、Landau 能级
         E_n=(n+½)ω_c。**与 Pauli 的 bX/bY/bZ 正交**（后者是自旋塞曼项，不含
         轨道耦合）；与 AB 的 abSols 亦正交（点磁通 vs 均匀矢势）。默认 0 ⟹
         uBOn=0 走原 stencil 逐位等价。 */
      bOrb: 0,
      /* R62 光学晶格：latV0（势深，世界单位）/ latA（周期，世界 px）/
         twistX（Bloch 相位 θ_B=k·a，∈[0,π] 覆盖简约 BZ）/ latBand（弛漾目标带
         1|2）。lattice 预设的 params 会注入同名默认值，此处给非 lattice 预设
         下也存在的初值（面板滑块绑定需要 state 有键）。 */
      latV0: 0.1, latA: 32, twistX: 0, latBand: 1,
      /* R64 量子弹球：billKind = 'stadium' | 'circle'（两个预设各注入一个；
         面板下拉可切换并重画硬壁势）。billBand = 当前显示的本征态序号
         （0 起，UI 态，不存档——谱是运行时缓存）。 */
      billKind: 'stadium', billBand: 0,
      /* R65 双势阱：dwZ0 = 初始粒子数差 z0=(N_L−N_R)/N（双高斯幅度 √((1±z0)/2)）、
         dwPhi = 两阱相对相位 φ0（右阱乘 e^{iφ0}）。两者都进 makeWave 的 dw 分支。 */
      dwZ0: 0.6, dwPhi: 0,
      /* R67 一维势谱：双垒（dV0 垒高 / dBw 垒宽 / dGap 阱宽，世界 px）与
         有限深阱（fV0 深度 / fWa 宽度）。fwBand = 当前显示的第几个束缚态。 */
      dV0: 0.2, dBw: 4, dGap: 28,
      fV0: 0.15, fWa: 48, fwBand: 0,
      /* R68 投影测量：measXc/measW = 监视带中心与半宽（世界坐标 0..1，芝诺
         演示默认取双垒中央阱 [0.5±dGap/2/256]，measSetup 时按当前 dGap 同步）；
         measEvery = 芝诺序列的测量间隔（帧，0 = 对照不投影）；measNF = 序列
         总帧数。面板 #measSec 仅薛定谔内核显示（测量公理与内核无关，但非酉
         通道目前只接到 2D 标量路径）。 */
      measXc: 0.25, measW: 0.249, measEvery: 30, measNF: 600,
      /* R69 退相干 T₂（纯退相位）：gammaPhi = γ_φ（位置基纯退相位速率）。
         每帧逐 texel 随机相位 e^{iφ}（φ~N(0,γ_φ·dt)）：不动 |ψ|²、只毁相干
         ⟹ 条纹对比度以 T_φ=1/γ_φ 指数衰减。与 gamma（T₁ 式振幅衰减，改密度）
         是两个独立通道、可同时开。面板 #dephSec 仅薛定谔内核显示（pass 只接
         2D 标量路径；γ_φ=0 跳过该 pass，厄米路径零改动）。 */
      gammaPhi: 0,
      /* R71 Berry 相位（Pauli 绝热循环）：berryTheta = 磁场锥角 θ
         （B(t)=B₀(sinθ cos φ, sinθ sin φ, cos θ)，φ=ωt）；berryOmega = 进动
         角频率 ω（一循环 φ:0→2π，T=2π/ω）；berryB0 = 磁场模长（绝热判据
         ω ≪ 塞曼劈裂 Δ=B₀/m，面板给 ω/Δ 读数）。循环期间逐帧覆写 bX/bY/bZ
         （Pauli 的 uB uniform 每帧从 state 读 ⟹ 零新 shader），bGrad 强制 0
         并在结束时恢复。面板 #berrySec 仅 Pauli 内核显示。 */
      berryTheta: Math.PI/2, berryOmega: 0.01, berryB0: 0.05,
      /* R66 暗孤子：darkV = 速度分数 v/c（|v/c|<1 才是亚声速暗孤子）。 */
      darkV: 0.4,
      ...this.kernel.defaults(),
      ...(options.state || {}),
    };
    /* R60：程序化注入的丘列表（options.state.potBlobs，如课程站嵌入/旧调用方）
       可能缺椭球/软化字段——经 normBlob 归一为球+硬边，与导入迁移同口径 */
    if (Array.isArray(this.state.potBlobs))
      this.state.potBlobs = this.state.potBlobs.map(normBlob);
    this._uloc = new Map();     /* program → uniform name → location 缓存 */
    this._rows = [];            /* 面板滑块行（引擎 + 内核），syncControls 用 */
    this._listeners = [];       /* unmount 时统一移除 */
    /* 帧循环计数与归约基线（原模块级变量，改为实例字段以支持多实例） */
    this._frames = 0; this.fps = 0;
    this._lastFpsT = performance.now(); this._lastReduceF = 0; this._lastSpinF = 0;
    this.baseP0 = 1; this._baseCaptured = false;
    this._readBuf = new Float32Array(32*32*4);
    this._readBuf2 = new Float32Array(32*32*4);   /* MRT 附件 1：世界坐标概率矩 */
    this._readBuf3 = new Float32Array(32*32*4);   /* MRT 附件 2：分轴动能 + 均值动量 */
    this._lastE = null;                            /* 最近一次归约的逐粒子总能（能级对照） */
    this._raf = 0;
    /* 3D 体积渲染轨道相机（kernel.dim3 时由 pointer/wheel 驱动；2D 内核不用） */
    this.cam = { theta: 0.7, phi: 0.35, dist: 2.2, drag: null };
    this.scanner = new TransmissionScanner(this);  /* 透射率扫描工具（内核无模型时面板隐藏） */
    this.scanner3 = new TransmissionScanner3(this);  /* 3D 透射扫描（R38；内核无 transmissionModel3 时面板隐藏） */
    this.scannerSlit = new SlitScanner(this);  /* 3D 双缝图样扫描（R40；内核非 3D 时面板隐藏） */
    /* 非线性内核参数扫描（R42）：GP（g<0 排斥侧，TF 云/涡旋）与 NLS（g>0
       focusing，孤子宽度/自聚焦发散）——共享一套面板 DOM，按内核选实例。 */
    this.scannerGp = new GpScanner(this);
    this.scannerNls = new NlsScanner(this);
    /* R62 Bloch 能带扫描（k 扫描测两带 ⟨E⟩ + Mathieu 解析叠图）；仅薛定谔
       内核的光学晶格预设可用（面板在 buildDOM 后按内核静态门控） */
    this.scannerBloch = new BlochScanner(this);
    /* R63 Landau 回旋周期扫描（bOrb 扫描 + 质心轨迹周期检测 + T₀/T_晶格 叠图）；
       仅薛定谔内核（landauSec 同款门控），与 AB/扭曲边界互斥（gate 层拒绝） */
    this.scannerLandau = new LandauScanner(this);
    /* R65 双势阱扫描（g 扫描 → z_min/自囚禁阈值）；仅 GP 内核 + dw 预设 */
    this.scannerDw = new DwScanner(this);
    /* R69 退相干对比度扫描（γ_φ 扫描 → 双缝条纹对比度 C(t) 衰减曲线族）；
       仅薛定谔内核（dephSec 同款门控，pass 走 2D psiA/psiB 目标） */
    this.scannerDeph = new DephaseScanner(this);
    this._onError = e => {
      const d = this.q('#diag');
      if (d) d.textContent = 'ERR ' + e.message;
      document.title = 'ERR ' + e.message;
    };
    window.addEventListener('error', this._onError);
    this.frame = this.frame.bind(this);
  }

  /* ---------- 工具 ---------- */
  q(s){ return this.container.querySelector(s); }
  on(target, type, fn, opts){
    target.addEventListener(type, fn, opts);
    this._listeners.push([target, type, fn, opts]);
  }
  u(prog, name){
    let m = this._uloc.get(prog);
    if (!m){ m = new Map(); this._uloc.set(prog, m); }
    if (!m.has(name)) m.set(name, this.gl.getUniformLocation(prog, name));
    return m.get(name);
  }

  /* ---------- 挂载 ---------- */
  mount(){
    injectStyles();
    this.buildDOM();
    this.restorePanels();    /* R56：恢复上次的左右面板收起状态（localStorage） */
    this.upgradeHints();   /* R45：hint 折叠升级（DOM 构建后一次；模板零改动） */
    this.upgradeSecs();    /* R48：sec 级分区折叠（同上模式；扫描 sec 默认折） */
    this.canvas = this.q('#gl');
    const { gl, error } = createContext(this.canvas);
    if (!gl){ this.fail(error); return this; }
    this.gl = gl;
    try {
      this.quad = new Quad(gl);
      this.initPrograms();
      this.initTargets();
      this.initPotential();
      this.bindUI();
      this.bootstrap();
      requestAnimationFrame(this.frame);
    } catch (err){
      this.fail((err && err.message) || String(err));
      return this;
    }
    window.__app = this.debugHandle();
    return this;
  }

  fail(msg){
    const d = this.q('#diag');
    if (d) d.textContent = 'ERR ' + msg;
    document.title = 'ERR ' + msg;
  }

  /* ---------- DOM ---------- */
  buildDOM(){
    const k = this.kernel;
    const d3 = !!k.dim3;               /* 3D 内核：隐藏 2D 专属面板区，挂 3D 体积渲染面板 */

       reinit        —— 按 lastWave 重发波包（初相类参数：Pauli 自旋角）
       refreshParamHud —— 参数派生 HUD 刷新（B 场读数等，暂停时拖滑块也即时） */
    const extra = k.extraControls(() => this.reinitWave(), () => this.refreshParamHud());
    const extraHtml = extra ? extra.html : '';
    this.container.innerHTML = `

    <div class="hint" style="margin-top:4px">均匀 B 的**轨道**耦合（最小耦合 p→p−qA，Landau 规范 A=(−B·y,0,0)，q=1）：仅 x 向 link 有 Peierls 相位 e^{±iB·y}（A_x 沿 x 恒定 ⟹ 线积分**精确**，离散 H 严格厄米）。<b>积分器</b>：复数 H 配 KDK 的 Re/Im 拆分<b>不酉</b>（kick 用 Re(Hψ)、drift 用 Im(Hψ)，B≠0 时范数漂移随网格放大直至爆炸）⟹ B≠0 自动切**规范帧 ADI**：x 扫描以 φ=e^{iBxy}ψ 把 x 相位吸收成实 stencil（精确保酉），y 扫描在原帧走裸实 stencil（Landau 规范 y 向本无相位），两方向交替 ⟹ 二阶；CPU float64 镜像已验证保范/二阶/轨道周期（+0.15%）。<b>Landau 能级</b> E_n=(n+½)ℏω_c、<b>回旋频率</b> ω_c=B/m；连续统周期 T₀=2πm/B 是<b>小振幅极限</b>——紧束缚带非抛物 ⟹ 大振幅轨道类单摆拉长（读数实时给 T_晶格；能级间距=ω_c 不受影响，CPU 对角化已验）。B=0 走原 KDK 逐位等价。<b>仅薛定谔内核</b>（NLS/GP 非线性项双重计数、Dirac/Pauli 走 CN、3D 无 B 分支）；<b>与 AB 磁通/扭曲边界互斥</b>（规范帧不兼容，拖 B 前请先清空）；<b>与 Pauli 自旋塞曼滑块正交</b>（那是纯自旋项，无轨道耦合）。</div>
    <div class="grid2" style="margin-top:6px">
      <button id="btnLandauScan">扫描回旋周期</button>
      <button id="btnLandauScanStop" disabled>中止</button>
    </div>
    <div class="row"><label>扫描状态</label><span id="landauScanStat">就绪</span></div>
    <canvas id="landauScanCanvas" width="420" height="180"></canvas>
    <div class="hint" style="margin-top:4px"><b>回旋周期扫描</b>：固定轨道半径（r=30 texel）、逐点扫 B，发高斯包测<b>质心轨迹</b>（Ehrenfest：线性演化下质心严格走经典轨道），按 y/x 两条通道的上升穿越间隔取中位数得周期 T。叠图两条参考曲线：灰虚线 <b>T₀=2πm/B</b>（连续统/谐振极限）与青虚线 <b>T_晶格</b>（紧束缚带的半经典闭式，含非谐）——θ₀=B·r 随 B 线性增长，实测点应贴 T_晶格 而非 1/B 直线。扫描会临时切到「自由传播」场景并强制 256² 网格，结束后恢复原预设与 σ。</div>

    <div class="hint" style="margin-top:4px">V=V₀sin²(πx/a) 周期势。Bloch 定理：ψ(x+a)=e^{ika}ψ(x)，准动量 k 只在简约布里渊区 [0,π/a] 内独立 ⟹ 能量分成能带、带间是能隙。<b>θ 滑块</b>直接设定 Bloch 相位 θ=k·a（0→π 覆盖整个简约 BZ；GPU 侧由 twisted 边界 e^{±iθ} wrap 携带）。<b>Bloch 弛漾</b>：CPU 虚时间流（PR-ADI + twisted 循环三对角）收敛到当前 (k, 带) 的精确本征态——带 2 以带 1 收敛态作 Gram-Schmidt 投影，并每步投影回目标晶体动量块与横向基模（否则会塌到相邻 k 的带 1，见 worklog R62 五轮记录）。</div>

    <div class="hint" style="margin-top:4px">两抛物阱（阱心距 20px、阱宽 44px、垒高 ≈0.052）中的 BEC，初态为双高斯叠加：左/右幅度 √((1±z₀)/2)、右阱带相位 φ₀。<b>Josephson 振荡</b>：z(t)=(N_L−N_R)/N 在两阱间来回（线性极限 z=z₀cos(ΔE·t/ħ)，ΔE 是双阱对称/反对称本征态的能量分裂——点「求 ΔE」用 R64 的谱求解器独立算出，与实测周期对照）。<b>宏观量子自囚禁</b>：相互作用 Λ=N·U/2K 超过 1 且初始不平衡足够大时，z(t) 不再过零、云锁在一侧——扫 g 看 z_min 随 |g| 抬升（实测本几何扫到 |g|=150 时 |z_min| 从 0.35 压到 0.26，趋势明确但**未跨过自囚禁相变**——面板如实标注，不宣称相变）。诚实限制：双高斯初态不是双阱精确基态组合，会额外激发阱内呼吸模（z 上的高频抖动）；两模模型只是近似，Λ 的 U 估计有 ~20% 误差，阈值只报量级。</div>

    <div class="hint" style="margin-top:4px">两片方墙夹出中央阱（墙宽 b、阱宽 a、高 V₀）。经典粒子 E&lt;V₀ 必反射；量子波包在**特定能量**近乎全透射——中央阱里的准束缚驻波与两侧倏逝波相位匹配（Ramsauer–Townsend）。<b>求 T(E)</b> 用离散转移矩阵一次算出整条曲线（与 GPU 同一 5 点递推，色散 E=2uK(1−cos k)）并标出 T=1 的峰；<b>实测当前 k</b> 跑一次真实波包演化，把 GPU 的 T 叠到曲线上。纵轴为 log₁₀T（否则峰谷 5 个数量级的差看不出）。注意：峰宽 Γ∝e^{−2κb}，垒越厚峰越窄——b=8 时第一个峰窄到 1e-7，任何均匀采样都画不出（面板会标「未分辨」）；b=4 是「峰可见」与「垒够厚」的折中。单垒对照：把阱宽 a 调到 0（两墙相邻）⟹ T 单调无峰。<b>实测为什么看不到 T=1</b>：TMM 的 T=1 是<b>单色平面波</b>的结果；σ=14 的波包在 k 空间有 σ_k≈0.05 ⟹ ΔE≈0.02，而峰宽 Γ≈0.002，<b>峰被谱宽稀释十倍</b>（E=0.17 实测 T=0.131，非相干卷积给 0.176）。要逼近单色极限需要 σ≥80（ΔE≤Γ），但 256 网格装不下这么大的包——这是物理限制，不是求解器误差。</div>

    <div class="grid2" style="margin-top:6px">

    </div>
    <div class="row" style="margin-top:6px"><label>测量间隔 N（帧）</label><input type="range" id="rMeasEvery" min="1" max="120" step="1" value="30"><output id="oMeasEvery">30</output></div>
    <div class="grid2" style="margin-top:6px">
      <button id="btnMeasZeno">跑芝诺序列</button>
      <button id="btnMeasFree">跑对照（不投影）</button>
    </div>
    <div class="row"><label>状态</label><span id="measStat">未测量</span></div>
    <canvas id="measCanvas" width="420" height="180"></canvas>
    <div class="hint" style="margin-top:4px"><b>投影测量</b>是量子力学唯一非酉的公理操作：对「粒子是否在监视带 S 内」做一次理想位置测量，测得概率 p=⟨ψ|Π_S|ψ⟩=Σ_S|ψ|²，随后态<b>坍缩</b>为 Π_Sψ/√p（命中）或 (1−Π_S)ψ/√(1−p)（未命中）并重新归一化——画面上能看到波包突然变小（单次测量按钮），统计上重复同样的测量必然得到同一结果（幂等验证：复测确定性=1.000000、残差≤1e-6）。<b>量子芝诺</b>：「跑芝诺序列」自动布置方盒 + 左半弹道波包（v=0.5px/帧，384 帧到右墙），每 N 帧问一次「还在左半吗」——问得越勤，漏到右半越慢（CPU 独立模拟：频率 ×10 逃逸概率降 7.8×，实测曲线画在下方，灰线为不投影对照）。<b>口径说明（重要）</b>：芝诺序列用<b>选择性演化</b>（命中才投影，未命中分支丢弃 = 只追踪「从未逃逸」的轨迹）；「单次测量」按钮是<b>完整 von Neumann</b>（未命中也坍缩到带外）。为什么序列不能用完整语义：方盒两端是墙，未命中一次就把粒子放到对面且后续测量持续确认它在对面——CPU 实测末态呈 0/1 双峰（std≈0.5），是公理操作在该几何下的真实后果，不是求解器误差。<b>哪条路测量</b>：对「粒子在上半平面吗」做一次完整 von Neumann 测量（p≈0.5，与单次测量同一套公理操作，只是监视带取 y 向中线）。GPU 三种投影时机实测：投影<b>瞬间</b>密度完全约束在命中半区（对半概率=0、P=1、质心从 0.50 跳进上半），300 步后整场质心稳定在上缝附近（0.50→0.37）——路径信息的获得是真实的；但<b>条纹并不消失</b>（谐波降幅 ≤1.2×）：透射前投影会被自由演化重新跨中线衍射抵消（300 步后下半概率从 0 回流到 0.19），透射后投影则保留已形成的干涉（双束被中线切割后幅值对称化，谐波反升）。根因：半平面要分离两束需要缝距大于衍射束宽（slits 缝距 56px vs 束宽 ~40px）——这是公理操作在该几何下的真实后果，本面板不承诺做不到的「干涉消除」。<b>物理限制</b>：投影是理想化的公理操作（无限快的测量），真实探测器有有限时间分辨率与不完全量子效率；每次测量会因 float32 纹理往返引入 ~1e-7 舍入（幂等验证即量化这条）。</div>
  </div>

  }

  /* ---------- 面板双向收起（R56，「试验场全屏」）----------
     左列 #panel + #desc、右列 #hud + #legend 各为一组，由 body class
     （qf-hide-left / qf-hide-right）驱动整组 transform 滑出（styles.js）。
     拉手（#tabL/#tabR）与快捷键 [ / ] 触发；状态持久化于
     localStorage qf.panels.state = {left,right}（true = 展开）。
     设计口径：默认全展开（无存档/坏存档都不改行为）；存档只记显式
     false——局部升级（如未来加第三组）不影响旧存档语义。 */
  panelSideOpen(side){ return !document.body.classList.contains('qf-hide-' + side); }
  setPanelSide(side, open, persist = true){
    document.body.classList.toggle('qf-hide-' + side, !open);
    const tab = this.q(side === 'left' ? '#tabL' : '#tabR');
    if (tab){
      const L = side === 'left';
      tab.textContent = L ? (open ? '\u2039' : '\u203a') : (open ? '\u203a' : '\u2039');
      tab.title = (L ? '左' : '右') + '侧面板：' + (open ? '收起' : '展开') +
                  '（快捷键 ' + (L ? '[' : ']') + '）';
    }
    if (persist){
      try {
        localStorage.setItem('qf.panels.state', JSON.stringify({
          left: this.panelSideOpen('left'), right: this.panelSideOpen('right')
        }));
      } catch(_){ /* 隐私模式等写入失败：静默降级为会话内有效 */ }
    }
  }
  togglePanelSide(side){ this.setPanelSide(side, !this.panelSideOpen(side)); }
  restorePanels(){
    let st = null;
    try { st = JSON.parse(localStorage.getItem('qf.panels.state') || 'null'); } catch(_){}
    /* 缺省/坏值 → 全展开；仅显式 false 收起（向后兼容的宽松口径） */
    this.setPanelSide('left', !(st && st.left === false), false);
    this.setPanelSide('right', !(st && st.right === false), false);
  }

  /* ---------- 着色器 / 目标 / 势场 ---------- */
  initPrograms(){
    const gl = this.gl;
    const sh = buildShaders(this.kernel);   /* 模板 + 内核片段装配，契约错误在此抛出 */
    this.sh = sh;                           /* CN 路径探测：sh.cnRhs 存在 ⟺ kernel.integrator='cn' */
    this.progEvolve = createProgram(gl, sh.evolve);
    this.progDisplay = createProgram(gl, sh.display);
    this.progComposite = createProgram(gl, FS_COMPOSITE);
    this.progReduce = createProgram(gl, sh.reduce);
    this.progBlit = createProgram(gl, FS_BLIT);
    this.progScale = createProgram(gl, sh.scale);   /* 耗散帧级衰减 pass */
    this.progDephase = createProgram(gl, sh.dephase);  /* R69 纯退相位（T₂）逐 texel 随机相位 pass */
    /* R61 概率流 program（buildShaders 无条件装配 ⟹ 编译；帧内按 state 开关）：
       jField（ψ → RG32F J 场）+ jRed（通量/散度归约 MRT）+ bohmStep（64 粒子
       制导步进）+ bohmFade（残影衰减全屏）+ bohmStamp（POINTS 盖章，自定义
       VS_BOHM_STAMP——createProgram 第三参）。 */
    if (sh.jField){
      this.progJField = createProgram(gl, sh.jField);
      this.progJRed = createProgram(gl, sh.jRed);
      this.progBohmStep = createProgram(gl, sh.bohmStep);
      this.progBohmFade = createProgram(gl, FS_BOHM_FADE);
      this.progBohmStamp = createProgram(gl, FS_BOHM_STAMP, VS_BOHM_STAMP);
    }
    /* CN 积分器（kernel.integrator='cn'，Dirac/Pauli）：rhs pass + block-Jacobi
       扫掠 pass 两个额外 program（契约见 kernel.js 头注【CN 积分器约定】） */
    if (sh.cnRhs){
      this.progCnRhs = createProgram(gl, sh.cnRhs);
      this.progCnSweep = createProgram(gl, sh.cnSweep);
    }
    /* 3D 体积路径（kernel.dim3=true，R34）：evolve3d（7 点拉普拉斯 KDK，逐层
       draw 全卷）+ volume（ray-march 显示）。2D program 仍编译（dim3 运行时
       不被引用）——buildShaders 对全部内核统一装配，零分支风险。 */
    if (sh.evolve3d){
      this.progEvolve3d = createProgram(gl, sh.evolve3d);
      this.progVolume = createProgram(gl, sh.display3d);
      this.progReduce3d = createProgram(gl, sh.reduce3d);   /* 全卷 GPU 归约（R35） */
      /* 3D CN（R36）：内核提供 cnLocalSolve3 ⟺ sh.cnRhs3d 存在。与 2D CN 的
         内核级开关不同，3D 是运行时切换（state.integrator3）——故只要内核支持
         就编译，evolve() 每帧按 state 分流；KDK 默认路径零改动。 */
      if (sh.cnRhs3d){
        this.progCnRhs3d = createProgram(gl, sh.cnRhs3d);
        this.progCnSweep3d = createProgram(gl, sh.cnSweep3d);
      }
      /* R58 3D 耗散缩放 pass（γ≠0 时帧末跑；与 2D progScale 同义） */
      this.progScale3d = sh.scale3d ? createProgram(gl, sh.scale3d) : null;
      /* R61 3D 概率流：jField3（逐层 J 场 RGBA32F）+ jRed3（线性分块归约） */
      if (sh.jField3){
        this.progJField3 = createProgram(gl, sh.jField3);
        this.progJRed3 = createProgram(gl, sh.jRed3);
      }
    }
  }

  initTargets(){
    const gl = this.gl;
    /* 波函数纹理格式由内核分量数决定：1 对 → RG32F，2 对 → RGBA32F */
    this.fmt = this.kernel.pairs === 2 ? gl.RGBA : gl.RG;
    this.ifmt = this.kernel.pairs === 2 ? gl.RGBA32F : gl.RG32F;
    if (this.kernel.dim3){
      /* 3D：体积 ping-pong（RG32F n³）；2D psiA/psiB 不分配（3D 帧路径不引用，
         2D 调试句柄对 3D 内核调用会诚实地抛错而非返回垃圾） */
      this.allocGrid3d(this.state.grid);
    } else {
      this.allocGrid(this.state.grid);
    }
    this.reduceT = makeReduce(gl);
    /* R61：概率流归约 MRT（与 reduceT 同构：o0=(ΣJx,ΣJy,ΣdivJ,Σρ)、
       o1=界面通量、o2=(max|J|,Σ|J|)）。2D/3D 各一份（3D 的 reduce3d 占用
       reduceT，不能复用）。 */
    this.jRedT = makeReduce(gl);
    if (this.kernel.dim3) this.jRedT3 = makeReduce(gl);
    /* R61 Bohm 粒子位置 ping-pong（64×1 RG32F；(−1,−1) = 停泊/未激活）——
       网格无关，构造期一次分配。 */
    const mkPos = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, 64, 1, 0, gl.RG, gl.FLOAT, null);
      const f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      return { tex: t, fbo: f };
    };
    this.posA = mkPos(); this.posB = mkPos();
    this.ptsVao = gl.createVertexArray();   /* POINTS stamp：无属性（VS 只用 gl_VertexID） */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this._bohmN = 0; this._bohmRow = 0;
    this._jScale = 0; this._j = null; this._j3 = null;
    this._jBuf0 = new Float32Array(32*32*4);   /* jRed MRT 附件 0：(ΣJx,ΣJy,ΣdivJ,Σρ) */
    this._jBuf1 = new Float32Array(32*32*4);   /* 附件 1：界面通量（2D 四下上 / 3D 前四） */
    this._jBuf2 = new Float32Array(32*32*4);   /* 附件 2：(max|J|,Σ|J|[,0,0]) */
  }

  /* 3D 体积 ping-pong 目标（n³ RG32F NEAREST；fbo 不预附着层——evolve3d/回读
     每层 draw/read 前须 framebufferTextureLayer，契约见 gl.js makeTarget3D）。 */
  allocGrid3d(n){
    this.state.grid = n;
    const gl = this.gl;
    if (this.psiA3){
      gl.deleteTexture(this.psiA3.tex); gl.deleteFramebuffer(this.psiA3.fbo);
      gl.deleteTexture(this.psiB3.tex); gl.deleteFramebuffer(this.psiB3.fbo);
    }
    if (this.rhs3){ gl.deleteTexture(this.rhs3.tex); gl.deleteFramebuffer(this.rhs3.fbo); this.rhs3 = null; }
    this.psiA3 = makeTarget3D(gl, n, gl.RG32F, gl.RG, gl.NEAREST);
    this.psiB3 = makeTarget3D(gl, n, gl.RG32F, gl.RG, gl.NEAREST);
    /* CN3D 的 rhs 固定纹理（每子步由 cnRhs3d 重写、12 次扫掠期间只读）——仅在
       内核支持 CN3D 时分配（progCnRhs3d 在 initTargets 前已由 initPrograms 置位）；
       不支持时不占 n³ 显存。 */
    if (this.progCnRhs3d) this.rhs3 = makeTarget3D(gl, n, gl.RG32F, gl.RG, gl.NEAREST);
    /* R61 3D 概率流场（RGBA32F n³：(Jx,Jy,Jz,0)，NEAREST；jField3 逐层写入） */
    if (this.jT3){ gl.deleteTexture(this.jT3.tex); gl.deleteFramebuffer(this.jT3.fbo); }
    this.jT3 = makeTarget3D(gl, n, gl.RGBA32F, gl.RGBA, gl.NEAREST);
  }

  allocGrid(g){
    this.state.grid = g;
    const gl = this.gl;
    if (this.psiA){
      gl.deleteTexture(this.psiA.tex); gl.deleteFramebuffer(this.psiA.fbo);
      gl.deleteTexture(this.psiB.tex); gl.deleteFramebuffer(this.psiB.fbo);
    }
    if (this.rhs){ gl.deleteTexture(this.rhs.tex); gl.deleteFramebuffer(this.rhs.fbo); this.rhs = null; }
    this.psiA = makeTarget(gl, g, g, this.ifmt, this.fmt, gl.NEAREST);
    this.psiB = makeTarget(gl, g, g, this.ifmt, this.fmt, gl.NEAREST);
    /* CN 路径的 rhs 固定纹理（每子步由 cnRhs 重写、12 次扫掠期间只读） */
    if (this.kernel.integrator === 'cn'){
      this.rhs = makeTarget(gl, g, g, this.ifmt, this.fmt, gl.NEAREST);
    }
    /* R61 概率流场（RG32F (Jx,Jy)，与 psi 同尺寸 NEAREST；CLAMP_TO_EDGE
       与 TPL_JFIELD 的界外约定一致）。常驻分配一次，开关时每 evolve 后重算。 */
    if (this.jT){ gl.deleteTexture(this.jT.tex); gl.deleteFramebuffer(this.jT.fbo); }
    this.jT = makeTarget(gl, g, g, gl.RG32F, gl.RG, gl.NEAREST);
  }

  allocDisplay(){
    const gl = this.gl, canvas = this.canvas;
    const w = canvas.width, h = canvas.height;
    const oldA = this.dispA, oldB = this.dispB;
    this.dispA = makeRGBA16F(gl, w, h);
    this.dispB = makeRGBA16F(gl, w, h);
    /* resize 不丢拖尾：旧 dispA 持有历史余晖（max 混合的累积结果），
       blit 进新 dispA（LINEAR 滤波顺便做分辨率缩放），否则窗口尺寸一变拖尾瞬间清空。 */
    if (oldA){
      gl.useProgram(this.progBlit);
      gl.bindVertexArray(this.quad.vao);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.dispA.fbo);
      gl.viewport(0,0,w,h);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, oldA.tex);
      gl.uniform1i(this.u(this.progBlit,'uTex'), 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.deleteTexture(oldA.tex); gl.deleteFramebuffer(oldA.fbo);
    }
    if (oldB){ gl.deleteTexture(oldB.tex); gl.deleteFramebuffer(oldB.fbo); }
    /* R61 Bohm 轨迹残影：RGBA16F 双纹理 ping-pong（与 dispA/dispB 同口径：
       resize blit 保留，不丢轨迹）。fade/stamp 管线见 bohmStamp()。 */
    const oldTA = this.bohmTrailA, oldTB = this.bohmTrailB;
    this.bohmTrailA = makeRGBA16F(gl, w, h);
    this.bohmTrailB = makeRGBA16F(gl, w, h);
    if (oldTA){
      gl.useProgram(this.progBlit);
      gl.bindVertexArray(this.quad.vao);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.bohmTrailA.fbo);
      gl.viewport(0,0,w,h);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, oldTA.tex);
      gl.uniform1i(this.u(this.progBlit,'uTex'), 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.deleteTexture(oldTA.tex); gl.deleteFramebuffer(oldTA.fbo);
    }
    if (oldTB){ gl.deleteTexture(oldTB.tex); gl.deleteFramebuffer(oldTB.fbo); }
  }

  initPotential(){
    const gl = this.gl;
    /* 势场 canvas (256^2) -> R 通道灰度编码 V∈[-1,1] */
    this.vCanvas = document.createElement('canvas'); this.vCanvas.width = this.vCanvas.height = 256;
    this.vctx = this.vCanvas.getContext('2d', { willReadFrequently: true });
    this.vTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.vTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  uploadV(){
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.vTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.vCanvas);
  }

  vGray(v){ const g = Math.round(Math.max(-1, Math.min(1, v))*127+128); return 'rgb('+g+','+g+','+g+')'; }

  /* ---------- 波包（引擎层：归一化 + 等份叠加 + 上传；形状由内核生成） ---------- */
  /* add=true 时不清场：读回当前 ψ 与新波包线性叠加（量子叠加原理——两列物质波相遇自干涉），
     再整体归一化保持总概率 P=1。用于拖拽发射，便于观察多波包干涉。
     预设切换 / 重置 / σ 调整 / URL 参数均为默认 add=false（清除旧场）。
     等份叠加：发射前场上有 n 个波包，新包加入后 n+1 个各占 1/(n+1) 概率
     ——旧场整体 ×√(n/(n+1))、新包 ×√(1/(n+1))，叠加后总概率恰为 1。
     任意连发次数下所有波包份额一致、旧包永不消失（实测 6 连发 7 包列积分相等）。 */
  /* CPU 场数据上传 psiA 纹理（initWave 与 R52 渐进弛豫写回共用）。
     data 为 Float32Array(grid²·pairs·2?)——与 makeWave 返回的交错布局一致。 */
  _uploadPsi(data){
    const gl = this.gl, g = this.state.grid;
    gl.bindTexture(gl.TEXTURE_2D, this.psiA.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, this.ifmt, g, g, 0, this.fmt, gl.FLOAT, data);
  }

  initWave(fx, fy, kx, ky, add){
    const g = this.state.grid, gl = this.gl;
    /* 内核私有初相参数（Pauli 的 spinTheta/spinPhi 等）随 state 透传给 makeWave；
       无此概念的内核忽略多余字段（makeWave 按需读取 p.spinTheta ?? 默认）。
       m=state.m 供一阶内核（Dirac）构造裸质量依赖的正能旋量；标量内核忽略。 */
    const { data, sum: rawSum } = this.kernel.makeWave(g, { fx, fy, kx, ky, sigma: this.state.sigma, m: this.state.m,
                                                              /* R51：g 透传（GP 基态预设的虚时间弛豫需要当前 g；
                                                                 无此概念的内核忽略多余字段——契约允许） */
                                                              g: this.state.g,
                                                              spinTheta: this.state.spinTheta, spinPhi: this.state.spinPhi,
                                                              /* R62：晶格参数透传（lattice 模式的初态是 Bloch
                                                                 平面波 × y 基模，需要 latA 与 twistX；不传则
                                                                 makeWave 拿到 undefined ⟹ NaN 场） */
                                                              latV0: this.state.latV0, latA: this.state.latA,
                                                              twistX: this.state.twistX,
                                                              /* R65 双势阱初态参数（GP 的 dw 分支读；其它内核忽略） */
                                                              dwZ0: this.state.dwZ0, dwPhi: this.state.dwPhi,
                                                              /* R66 暗孤子初态参数（NLS 的 dark 分支读） */
                                                              darkV: this.state.darkV });
    let sum = rawSum;
    /* 新波包先归一化到 Σ|ψ|²=1，再与旧场叠加。
       纹理中的旧场恒满足 Σ|ψ|²=1（初始归一化 + 演化酉守恒，HUD P=1.0000/err=0.000%）。
       若把原始高斯（Σ|ψ|² ≈ 2πσ² ≈ 154，σ=7）直接叠加进已归一化的旧场，
       统一缩放 s = 1/√(1+154) = 0.080 会把旧场振幅压掉 √154 ≈ 12.4 倍（密度 ≈154 倍）
       ——旧波包一次发射即「被清除」。 */
    {
      const s0 = 1/Math.sqrt(sum);
      for (let i=0;i<data.length;i++) data[i] *= s0;
      sum = 1;
    }
    if (add){
      const n = this.state.waveCount;          /* 发射前场上的波包数 */
      this.state.waveCount = n + 1;
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.psiA.fbo);
      const old = new Float32Array(data.length);
      gl.readPixels(0,0,g,g,this.fmt,gl.FLOAT,old);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const sOld = Math.sqrt(n/(n+1)), sNew = Math.sqrt(1/(n+1));
      for (let i=0;i<data.length;i++) data[i] = data[i]*sNew + old[i]*sOld;
      sum = 0;   /* 重算总概率：理论上 n/(n+1)+1/(n+1)=1，重算吸收旧场演化浮点漂移，保持 P 严格归一。
                    全通道求和（pairs=2 时 zw 两通道也是概率，不能只加 xy——旧代码 i+=2
                    只覆盖分量 1，Pauli 双分量下归一化系数错 √2，P 与干涉图样全错）。 */
      for (let i=0;i<data.length;i++) sum += data[i]*data[i];
    } else {
      this.state.waveCount = 1;                /* 清场发射（预设/重置/σ 调整/URL 参数）：场回到单包 */
    }
    const s = 1/Math.sqrt(sum);
    for (let i=0; i<data.length; i++) data[i] *= s;
    this._uploadPsi(data);
    this.state.lastWave = [fx, fy, kx, ky];
    this.state.simTime = 0;
    /* 自旋 HUD 即时刷新：自旋角滑块/重置/预设切换都走 initWave，帧循环节流
       （120ms）在暂停时会停摆——此处直接刷新，暂停态改自旋也立即可见。 */
    if (this.kernel.spinReadout) this.spinHud();
  }

  /* 按 lastWave 原参数重发波包（内核 extraControls 的 after 回调用）：
     自旋角属初相——变更后须重发才生效（演化中的场不会因初相参数改变而变）。 */
  reinitWave(){
    if (this.kernel.dim3){
      const w = this.state.lastWave3;
      if (w) this.initWave3d({ wave3: w.wave3, kind: w.kind });
      return;
    }
    const w = this.state.lastWave;
    if (w) this.initWave(w[0], w[1], w[2], w[3]);
  }

  /* ---------- 3D 初态（引擎层：归一化 + 上传；形状由内核 makeWave3d 生成）----------
     p = 预设对象（wave3:[fx,fy,fz,kx,ky,kz] + kind）或 { wave3, kind } 重发参数。
     与 2D initWave 的差别：无 add 叠加分支（3D 交互是相机轨道，无拖拽发射）、
     无势场画布步骤（势经 pot3 解析注入）。归一化口径与 2D 一致：
     Σ|ψ|²=1（P 基座，HUD 守恒误差以此为基准）。 */
  initWave3d(p){
    const n = this.state.grid, gl = this.gl;
    const w3 = p.wave3 || [0.3, 0.5, 0.5, 0.12, 0, 0];
    const kind = p.kind || 'gaussian';
    const { data, sum } = this.kernel.makeWave3d(n, {
      fx: w3[0], fy: w3[1], fz: w3[2], kx: w3[3], ky: w3[4], kz: w3[5],
      sigma: this.state.sigma, kind, z: this.state.potZ,
    });
    const s0 = 1/Math.sqrt(sum);
    for (let i=0;i<data.length;i++) data[i] *= s0;
    gl.bindTexture(gl.TEXTURE_3D, this.psiA3.tex);
    gl.texImage3D(gl.TEXTURE_3D, 0, gl.RG32F, n, n, n, 0, gl.RG, gl.FLOAT, data);
    this.state.lastWave3 = { wave3: w3, kind };
    this.state.simTime = 0;
    this._baseCaptured = false; this.baseP0 = 1;   /* P 基座重捕（守恒误差口径） */
  }

  /* ---------- 分区域概率（透射率扫描的测量原语；调试句柄同源） ---------- */
  /* 一次 readPixels 直读 psiA，按世界坐标 xSplit 把概率分为左/右两半，
     同时给出质心 x 与总 P——透射/反射测量与停止判据共用同一原子快照，
     无归约节流（120ms）的时间斜偏。xSplit 为世界坐标（0..1）。 */
  probSplit(xSplit){
    const gl = this.gl, g = this.state.grid;
    const ch = this.kernel.pairs === 2 ? 4 : 2;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.psiA.fbo);
    const buf = new Float32Array(g*g*ch);
    gl.readPixels(0,0,g,g,this.fmt,gl.FLOAT,buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const xs = Math.max(0, Math.min(g, Math.floor(xSplit*g)));
    let sL = 0, sR = 0, sx = 0;
    for (let y=0; y<g; y++){
      const row = y*g;
      for (let x=0; x<g; x++){
        const i = (row + x)*ch;
        const p = this.kernel.cpuDensity(buf, i);   /* 全分量 |ψ|²（pairs 感知） */
        if (x < xs) sL += p; else sR += p;
        sx += x*p;
      }
    }
    const P = sL + sR;
    return { left: sL, right: sR, P, T: P > 0 ? sR/P : 0, comX: P > 0 ? (sx/P)/g : 0, simTime: this.state.simTime };
  }

  /* ---------- 自旋测量（Pauli 内核；纯引擎层原始求和，无物理公式） ---------- */
  /* 一次 readPixels 直读 psiA，产出布洛赫向量的原始求和：
       re12 = ΣRe(ψ₁*ψ₂), im12 = ΣIm(ψ₁*ψ₂), n1 = Σ|ψ₁|², n2 = Σ|ψ₂|², P = n1+n2
     物理解释（⟨σx⟩=2re12/P 等）由内核 spinRead(rawSum) 给出——引擎只求和、
     不写公式（架构洁癖：app.js 不含物理）。仅 pairs=2 有意义；pairs=1 时
     ψ₂≡0 ⟹ re12=im12=n2=0（不调用即可）。 */
  spinSum(){
    const gl = this.gl, g = this.state.grid;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.psiA.fbo);
    const buf = new Float32Array(g*g*4);
    gl.readPixels(0,0,g,g,gl.RGBA,gl.FLOAT,buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let re12=0, im12=0, n1=0, n2=0;
    for (let i=0;i<buf.length;i+=4){
      const a=buf[i], b=buf[i+1], c=buf[i+2], d=buf[i+3];
      n1 += a*a + b*b; n2 += c*c + d*d;
      re12 += a*c + b*d;      /* Re(ψ₁*ψ₂) = ac+bd */
      im12 += a*d - b*c;      /* Im(ψ₁*ψ₂) = ad−bc（共轭在左） */
    }
    return { re12, im12, n1, n2, P: n1+n2 };
  }

  /* HUD 自旋区刷新：⟨σx⟩/⟨σy⟩/⟨σz⟩/|⟨σ⟩|（kernel.spinRead 物理解释）。
     调用点：frame() 120ms 节流（与 reduce 同频）+ initWave 末尾（暂停态即时）。 */
  spinHud(){
    if (!this.kernel.spinReadout) return;
    const s = this.kernel.spinRead(this.spinSum());
    this.q('#hSX').textContent = s.sx.toFixed(4);
    this.q('#hSY').textContent = s.sy.toFixed(4);
    this.q('#hSZ').textContent = s.sz.toFixed(4);
    const el = this.q('#hSLen');
    el.textContent = s.len.toFixed(4);
    el.className = s.len > 0.999 && s.len < 1.001 ? 'ok' : '';
  }

  /* ---------- R71 Berry 相位（Pauli 绝热循环）----------
     物理：磁场沿锥面缓慢转一圈 B(t)=B₀(sinθ cos φ, sinθ sin φ, cos θ)（φ=ωt），
     自旋 1/2 绝热跟随瞬时本征态 |+;n̂(t)⟩，回到出发点时积累
         Φ_总 = Φ_动力学 + γ，  γ = −Ω/2 = −π(1−cos θ)
     （Ω=2π(1−cos θ) 为路径张的立体角；符号由取向定：φ 递增（逆时针、绕 +z）
       ⟹ 自旋 + 本征态取负号——布洛赫约定 |+;n̂⟩=(cos(θ/2), e^{iφ}sin(θ/2))
       给出 A_φ=i⟨+|∂_φ|+⟩=−½，∮A·dφ=−π(1−cos θ)）。

     消去动力学相位：反向循环（φ 递减）γ 反号、动力学部分**逐字不变** ⟹
         γ = (Φ⁺ − Φ⁻)/2，  Φ_动力学 = (Φ⁺ + Φ⁻)/2
     这同时消掉空间（动能）相位：均匀 B 下 H = H_空间⊗I + I⊗(−uK σ·B)，
     V 自旋无关 ⟹ 空间与自旋严格可分离，空间因子在正/反两次运行里逐字相同。

     测量：z = ⟨ψ(T)|ψ(0)⟩（一次 readPixels 同时产出自旋期望），
     z = |z|·e^{−iΦ} ⟹ Φ = −arg(z)；|z|<1 为波包扩散的存活振幅（信噪比）。

     **为什么还要跑一次 θ=0 的参考循环（关键，实测定夺）**：
     总相位 Φ_θ ≈ uK·B₀·T + γ + δ（δ = 非绝热泄漏造成的能量偏移，实测
     ∝(ω/Δ)²·sin²θ，ω/Δ=0.1 时可达 γ 的 5–9%）。正/反向相减里 δ 逐字抵消
     （δ 只依赖 |ω| 与 |B|，与转向无关）⟹ 消除法精度高（0.1–0.5%），但它
     给出的只是 **γ mod π**——θ=π/2 时 γ=−π 而两条路径的连续相位恰好相等
     （cosθ=0 ⟹ 旋转参考系里两个方向的 H_rot 本征值相同），消除法返回 0。
     参考循环（θ=0 ⟹ 不张立体角 ⟹ γ=0，实测 Φ_ref ≡ uK·B₀·T 精确）给出连续
     无歧义但带 δ 的 γ_ref ⟹ **用它定分支**：k=round((γ_ref − γ_elim)/π)，
     γ = γ_elim + kπ。实测（ω/Δ=0.1，θ=0.15…2.5 七档）该配方偏差 ≤1%，
     含 θ=π/2 的 ±π 退化点。面板三行读数全部列出，不做取舍隐藏。

     驱动：循环期间逐帧覆写 state.bX/bY/bZ（Pauli 的 uB uniform 每帧从 state
     读 ⟹ 零新 shader、零引擎改动）；bGrad 强制 0（梯度让各 x 走不同大小的锥，
     相位被平均掉），结束时恢复原值。绝热判据 ω ≪ Δ=B₀/m（面板给 ω/Δ）。 */
  /* ref=true ⟹ θ=0 的参考循环（B 恒沿 +z：路径不张立体角 ⟹ γ=0，且初态 |↑⟩
     是精确本征态 ⟹ Φ_ref ≡ uK·B₀·T 无泄漏偏移）。与 θ 循环同 ω、同 |B| ⟹
     同 T、同帧结构，差值即 γ（含 δ，见上）。 */
  berryStart(dir, ref){
    if (this.kernelId !== 'pauli') return false;
    if (this._berry) return false;
    const st = this.state;
    if (st.bGrad !== 0){ this.toast('Berry 循环要求均匀场：B_z 梯度须为 0'); return false; }
    const d = dir < 0 ? -1 : 1;
    const prev = { bX: st.bX, bY: st.bY, bZ: st.bZ, bGrad: st.bGrad,
                   sigma: st.sigma, paused: st.paused,
                   spinTheta: st.spinTheta, spinPhi: st.spinPhi };
    const th = ref ? 0 : st.berryTheta;
    /* 初态：自旋沿 n̂(0)=(sinθ,0,cosθ)（即 |+;n̂(0)⟩，本征态 ⟹ 无初始混合）、
       kx=ky=0（不引入与方向无关的漂移相位，|z| 最大）、σ=24（窄包扩散快 ⟹
       存活振幅小、相位信噪比差）。 */
    st.spinTheta = th; st.spinPhi = 0; st.sigma = 24;
    this.initWave(0.5, 0.5, 0, 0);        /* 含 simTime 归零 ⟹ t0 取 0 */
    this.syncControls();
    /* 采样间隔（解包裹用）：相位速率 ≈ uK·|B₀|（塞曼主导，动能项小两个量级）
       ⟹ 每帧 ΔΦ ≈ uK·B₀·dt；取 S 使单次采样增量 ≈π/5（远小于 π ⟹ 解包裹
       无混叠；maxStep 读数实测校验）。旋量泄漏振荡频率 Δ=B₀/m 同量级，
       幅度小，不主导。 */
    const rate = (0.5/(st.m || 1))*st.berryB0*1.2;
    const S = Math.max(4, Math.min(60, Math.floor((Math.PI/5)/Math.max(rate, 1e-9))));
    this._berry = { dir: d, t0: st.simTime, theta: th, om: st.berryOmega,
                    B0: st.berryB0, prev, snap: this._readPsiFull(), ref: !!ref,
                    name: ref ? '参考(θ=0)' : (d > 0 ? '正向' : '反向'),
                    /* 增量解包裹状态：z(t=0)=1 ⟹ arg=0、cum=0 */
                    sample: S, nf: 0, prevArg: 0, cum: 0, maxStep: 0, nSamp: 0 };
    this._setB(0, th, st.berryB0);
    st.paused = false;                    /* 循环期间必须演化（结束时恢复） */
    this._berryRender();
    return true;
  }

  berryStop(){
    if (!this._berry) return false;
    const st = this.state, r = this._berry;
    st.bX = r.prev.bX; st.bY = r.prev.bY; st.bZ = r.prev.bZ; st.bGrad = r.prev.bGrad;
    st.sigma = r.prev.sigma; st.spinTheta = r.prev.spinTheta; st.spinPhi = r.prev.spinPhi;
    st.paused = r.prev.paused;
    this._berry = null;
    this.syncControls();
    this._berryRender();
    return true;
  }

  /* 帧循环钩子：必须在 evolve 之前（uniform 取帧初 simTime 的场值）。
     暂停时 simTime 冻结 ⟹ φ 不推进，循环自然挂起（结束/中止再恢复暂停态）。 */
  _berryTick(){
    const r = this._berry; if (!r) return;
    const st = this.state;
    const t = st.simTime - r.t0;
    const full = 2*Math.PI;
    /* 到达终点后**还要再演化一帧**（场取 B(±2π)=B(0)）才收尾：否则路径只
       累积到 2π−ω·dt，缺最后一小段（且末帧的动力学相位丢失）。此处
       finishing 标记让本帧先跑完、下一 tick 采样收尾。 */
    if (r.finishing){ this._berryFinish(st.simTime - r.t0); return; }
    let phi = r.dir * r.om * t;
    if (Math.abs(phi) >= full){
      phi = r.dir * full;
      this._setB(phi, r.theta, r.B0);
      r.finishing = true;
      this._berryRender();
      return;
    }
    this._setB(phi, r.theta, r.B0);
    /* 相位解包裹采样（每 r.sample 帧）：Φ 总量含 ~uK·B₀·T 的动力学部分
       （远大于 2π），单次 arg 会混叠 ⟹ 累积逐段增量（每段 <π 即无混叠）。 */
    r.nf++;
    if (r.nf % r.sample === 0) this._berrySample();
    this._berryRender();
  }

  /* 采样一次重叠相位增量（(−π,π] 折叠后累加 ⟹ 连续相位）。返回本次测量
     （含 |z| 与末态自旋期望），终点的那次即循环结果。 */
  _berrySample(){
    const r = this._berry; if (!r) return null;
    const m = this._berryOverlap(r.snap, this._readPsiFull());
    let d = m.arg - r.prevArg;
    while (d > Math.PI) d -= 2*Math.PI;
    while (d <= -Math.PI) d += 2*Math.PI;
    r.cum += d; r.prevArg = m.arg;
    r.maxStep = Math.max(r.maxStep, Math.abs(d)); r.nSamp++;
    return m;
  }

  _setB(phi, th, B0){
    const st = this.state;
    const s = Math.sin(th) * B0;
    st.bX = s*Math.cos(phi); st.bY = s*Math.sin(phi); st.bZ = Math.cos(th)*B0;
    st.bGrad = 0;
  }

  _berryFinish(t){
    const r = this._berry, st = this.state;
    const m = this._berrySample();       /* 终点采样 ⟹ cum 覆盖完整循环 */
    const Phi = -r.cum;                  /* 解包裹后的连续总相位（−arg(z)） */
    const rec = { dir: r.dir, theta: r.theta, om: r.om, B0: r.B0, T: t,
                  Phi, abs: m ? m.abs : 0, spin: m ? m.spin : null, P: m ? m.P : 0,
                  maxStep: r.maxStep, nSamp: r.nSamp, ref: r.ref,
                  pred: -Math.PI*(1 - Math.cos(r.theta)) };
    if (r.ref) this._berryR = rec;
    else if (r.dir > 0) this._berryF = rec; else this._berryB = rec;
    st.bX = r.prev.bX; st.bY = r.prev.bY; st.bZ = r.prev.bZ; st.bGrad = r.prev.bGrad;
    st.sigma = r.prev.sigma; st.paused = r.prev.paused;
    st.spinTheta = r.prev.spinTheta; st.spinPhi = r.prev.spinPhi;
    this._berry = null;
    this.syncControls();
    this._berryRender();
  }

  /* 引擎层测量原语（无物理公式，与 probSplit/spinSum 同族）：
     一次 readPixels 的场与起始快照逐 texel 求 Σ conj(ψ_T)·ψ_0（双分量），
     顺带给出末态自旋期望的原始求和（⟨σ⟩ 的解释由内核 spinRead 给）。 */
  _readPsiFull(){
    const gl = this.gl, g = this.state.grid;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.psiA.fbo);
    const buf = new Float32Array(g*g*4);
    gl.readPixels(0,0,g,g,gl.RGBA,gl.FLOAT,buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return buf;
  }

  _berryOverlap(snap, cur){
    let re = 0, im = 0, n1 = 0, n2 = 0, re12 = 0, im12 = 0;
    for (let i = 0; i < cur.length; i += 4){
      const A = cur[i], B = cur[i+1], C = cur[i+2], D = cur[i+3];       /* ψ(T) */
      const a = snap[i], b = snap[i+1], c = snap[i+2], d = snap[i+3];   /* ψ(0) */
      /* conj(A+iB)·(a+ib) = (A·a + B·b) + i(A·b − B·a) */
      re += A*a + B*b + C*c + D*d;
      im += A*b - B*a + C*d - D*c;
      n1 += A*A + B*B; n2 += C*C + D*D;
      re12 += A*C + B*D; im12 += A*D - B*C;
    }
    const P = n1 + n2;
    const spin = this.kernel.spinRead
      ? this.kernel.spinRead({ re12, im12, n1, n2, P }) : null;
    return { re, im, abs: Math.hypot(re, im)/Math.max(P, 1e-30),
             arg: Math.atan2(im, re), P, spin };
  }

  _berryRender(){
    const st = this.state;
    const set = (id, t) => { const e = this.q(id); if (e) e.textContent = t; };
    if (!this.q('#berryStat')) return;
    const adia = st.berryOmega * st.m / st.berryB0;      /* ω/Δ，Δ=B₀/m */
    set('#berryAdia', (adia).toFixed(3) + '（Δ=B₀/m=' + (st.berryB0/st.m).toFixed(4) +
      '，T=2π/ω=' + (2*Math.PI/st.berryOmega).toFixed(0) + '）');
    const bs = this.q('#btnBerStop'); if (bs) bs.disabled = !this._berry;
    if (this._berry){
      const r = this._berry;
      const phi = r.dir * r.om * (st.simTime - r.t0);
      set('#berryStat', r.name + '循环中 φ=' + phi.toFixed(3) + '/6.283（t=' +
        (st.simTime - r.t0).toFixed(1) + '）');
    } else {
      const f = this._berryF, b = this._berryB, rf = this._berryR;
      const lastN = this._berryB || this._berryF || this._berryR;
      let tag = '正/反/参：' + (f ? '✓' : '—') + '/' + (b ? '✓' : '—') + '/' + (rf ? '✓' : '—');
      if (lastN) tag += ' · 末次 ' + (lastN.ref ? '参考' : (lastN.dir > 0 ? '正向' : '反向')) +
        ' T=' + lastN.T.toFixed(1) + ' |z|=' + lastN.abs.toFixed(3) +
        '（解包裹 ' + lastN.nSamp + ' 段，最大增量 ' + (lastN.maxStep || 0).toFixed(3) + ' rad）';
      set('#berryStat', tag);
    }
    /* 三段式 γ（见 berryStart 头注）：γ_elim=(Φ⁺−Φ⁻)/2 精度高但只给 γ mod π；
       γ_ref=Φ⁺−Φ_ref 连续无歧义但含 δ ⟹ 取 k=round((γ_ref−γ_elim)/π) 定分支。 */
    const f = this._berryF, b = this._berryB, rf = this._berryR;
    const same = (x, y) => x && y && Math.abs(x.theta - y.theta) < 1e-12 &&
      Math.abs(x.om - y.om) < 1e-12 && Math.abs(x.B0 - y.B0) < 1e-12;
    if (same(f, b)){
      const elim = (f.Phi - b.Phi)/2;
      let out = 'γ_消除=(Φ⁺−Φ⁻)/2=' + elim.toFixed(4);
      if (rf && Math.abs(rf.om - f.om) < 1e-12 && Math.abs(rf.B0 - f.B0) < 1e-12){
        const gref = f.Phi - rf.Phi;
        const k = Math.round((gref - elim)/Math.PI);
        const g = elim + k*Math.PI;
        const dev = Math.abs(g - f.pred)/Math.max(Math.abs(f.pred), 1e-9)*100;
        out = 'γ=' + g.toFixed(4) + '（分支 k=' + k + '）· 理论 −π(1−cosθ)=' + f.pred.toFixed(4) +
          ' · 偏差 ' + dev.toFixed(2) + '% · γ_消除=' + elim.toFixed(4) +
          ' · γ_参考相减=' + gref.toFixed(4) + '（含非绝热偏移 δ=' + (gref - g).toFixed(4) + '）';
      } else out += ' · 需再跑「参考循环（θ=0）」定分支';
      set('#berryGamma', out);
    } else if (f || b){
      const r = f || b;
      set('#berryGamma', (f ? '正向' : '反向') + ' Φ=' + r.Phi.toFixed(4) +
        '（|z|=' + r.abs.toFixed(3) + '）⟹ 还需跑另一方向与参考循环');
    } else set('#berryGamma', '—');
    const last = this._berryB || this._berryF;
    if (last && last.spin){
      const n0 = [Math.sin(last.theta), 0, Math.cos(last.theta)];
      const dv = Math.hypot(last.spin.sx - n0[0], last.spin.sy - n0[1], last.spin.sz - n0[2]);
      set('#berrySpin', '(' + last.spin.sx.toFixed(3) + ',' + last.spin.sy.toFixed(3) + ',' +
        last.spin.sz.toFixed(3) + ') |⟨σ⟩|=' + last.spin.len.toFixed(4) +
        ' · 偏离 n̂(0) ' + dv.toFixed(4));
    } else set('#berrySpin', '—');
  }

  /* ---------- 预设 ---------- */
  loadPreset(key){
    const p = this.kernel.presets()[key]; if (!p) return;
    this.state.preset = key;
    if (p.params){
      Object.assign(this.state, p.params);   /* 内核预设参数（σ/g/potKind 等） */
      /* R54：abSols 是数组（元组列表）——预设对象每次 presets() 调用虽重建，
         仍做显式深拷贝，杜绝「调 Φ 改到预设字面量」的共享引用隐患 */
      if (Array.isArray(this.state.abSols))
        this.state.abSols = this.state.abSols.map(s => [s[0], s[1], s[2]]);
      /* R60：丘列表同策——预设若注入 potBlobs（当前无预设含该字段），
         经 normBlob 归一全字段（旧五字段丘 ⟹ 球+硬边），杜绝共享引用 */
      if (Array.isArray(this.state.potBlobs))
        this.state.potBlobs = this.state.potBlobs.map(normBlob);
    }
    this.syncControls();
    if (this.kernel.dim3){
      /* 3D：无势场画布（势经 pot3 解析注入），初态走 initWave3d */
      this.initWave3d(p);
      this.q('#descName').textContent = p.name;
      this.q('#descText').textContent = p.text;
      this.container.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === key));
      this.refreshParamHud();
      this.toast(p.name);
      return;
    }
    this.vctx.globalCompositeOperation = 'source-over';
    this.vctx.fillStyle = this.vGray(0); this.vctx.fillRect(0,0,256,256);
    /* R62：state 透传给 build —— lattice 预设的势重画要读当前 latV0/latA
       （滑块实时调参；不传则 drawLattice 拿到 undefined ⟹ NaN 势场） */
    p.build({ vctx: this.vctx, vGray: v => this.vGray(v), state: this.state });
    this.uploadV();
    this.initWave(p.wave[0], p.wave[1], p.wave[2], p.wave[3]);
    this.q('#descName').textContent = p.name;
    this.q('#descText').textContent = p.text;
    this.container.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === key));
    this.refreshParamHud();   /* 参数派生 HUD（B 场行/透射面板门控）随预设参数刷新 */
    this.toast(p.name);
  }

  /* R62 晶格参数（latV0/latA/twistX）变更后的统一生效路径：
     ① 确保在晶格场景内（preset 非 lattice 时静默进入并 toast——拖 V₀ 就该看到
        晶格，比「滑块无效」直观）；② 按新参数重画势（内核 enterLattice 与
        presets().lattice.build 共用 drawLatticeV，单源真值）；③ 按新 θ 重发初态。
     **不走 loadPreset**：那条路径会用预设 params 把三个参数打回默认值，与
     「拖滑块调参」的语义冲突（loadPreset 的语义是切场景，不是调参）。 */
  applyLatticeParams(){
    const st = this.state;
    if (this.kernelId !== 'schrodinger' || !this.kernel.enterLattice) return;
    if (st.preset !== 'lattice'){
      st.preset = 'lattice';
      const p = this.kernel.presets().lattice;
      if (p){
        this.q('#descName').textContent = p.name;
        this.q('#descText').textContent = p.text;
      }
      this.container.querySelectorAll('[data-preset]').forEach(b =>
        b.classList.toggle('on', b.dataset.preset === 'lattice'));
      this.toast('光学晶格');
    }
    this.kernel.enterLattice({ vctx: this.vctx, state: st });
    this.uploadV();
    this.reinitWave();        /* 初态按新 θ 重发（makeWave 在 lattice 模式读 twistX） */
    this.refreshParamHud();
  }

  /* R62 单次 Bloch 弛漾（面板「Bloch 弛漾」）：起 CPU 虚时间任务，由 frame()
     主循环经 kernel.relaxStep 分帧推进（暂停态也推进——同 R52 GP 基态口径）。
     带 2 需要带 1 收敛态作 Gram-Schmidt 参考 ⟹ 无参考时先跑带 1，_blochQueue
     记录待跑的带 2（在 _onRelaxDone 里接续，与扫描器的 per-point 次序同策）。 */
  startBlochRelax(){
    const st = this.state;
    if (this.kernelId !== 'schrodinger' || !this.kernel.startRelax){ this.toast('当前内核无 Bloch 弛漾'); return; }
    if (st.preset !== 'lattice'){ this.toast('请先切换到「光学晶格」预设'); return; }
    let band = st.latBand === 2 ? 2 : 1;
    this._blochQueue = 0;
    if (band === 2 && !this.kernel._band1Ref){ this._blochQueue = 2; band = 1; }
    this.kernel.startRelax({ grid: st.grid, m: st.m, v0: st.latV0, a: st.latA, theta: st.twistX, band });
    this._blochStat('带 ' + band + ' 弛漾中…');
    this.toast('Bloch 弛漾 · 带 ' + band);
  }

  stopBlochRelax(){
    if (!this.kernel.relaxStep) return;
    this._blochQueue = 0;
    this.kernel._relaxTask = null;      /* 丢弃任务（无副作用：任务态自包含） */
    this._blochStat('已中止');
    this.toast('Bloch 弛漾已中止');
  }

  /* 弛漾完成回调（evolve() 在 r.done 当帧调用）：写状态行 + 接续排队的带 2。
     状态行如实标注：收敛步数、⟨E⟩、本征残差；blockProj=false 时明确提示
     「带 2 数值不可信」（a_t 非整数 ⟹ 块投影关闭），不静默给出错误数值。 */
  _onRelaxDone(info){
    if (!info || this.kernelId !== 'schrodinger') return;
    const fmtE = v => (Math.abs(v) < 1e-3 ? v.toExponential(3) : v.toFixed(6));
    const warn = (info.band === 2 && info.blockProj === false) ? ' · ⚠ 块投影关闭，带2 不可信' : '';
    this._blochStat((info.converged ? '带 ' + info.band + ' 收敛' : '带 ' + info.band + ' 未收敛') +
      ' @' + info.steps + ' 步 · E=' + fmtE(info.energy) + ' · 残差 ' + info.res.toExponential(2) + warn);
    if (this._blochQueue === 2 && info.band === 1 && info.converged){
      this._blochQueue = 0;
      const st = this.state;
      this.kernel.startRelax({ grid: st.grid, m: st.m, v0: st.latV0, a: st.latA, theta: st.twistX, band: 2 });
      this._blochStat('带 2 弛漾中…');
    } else if (this._blochQueue === 2 && info.band === 1){
      this._blochQueue = 0;
      this._blochStat('带 1 未收敛 ⟹ 带 2 已跳过（无可靠参考态）');
    }
  }

  _blochStat(txt){
    const el = this.q('#blochStat');
    if (el) el.textContent = txt;
  }

  /* ---------- R64 量子弹球：求谱 + 显示本征态 ----------
     求谱是**一次性 CPU 计算**（Lanczos，与 GPU 同一离散口径）。强制 256²：
     vctx 恒 256²，1:1 采样才没有插值/缩放的口径差（与 BlochScanner 强制 256
     同策）。求谱与「当前演化中的场」完全解耦——它只读势场、不改 psi 与本征态
     之外的任何 state。 */
  billiardSpectrum(){
    if (this.kernelId !== 'schrodinger' || !this.kernel.spectrum){
      return this.toast('当前内核无弹球谱求解');
    }
    const st = this.state;
    const stat = this.q('#billStat');
    if (stat) stat.textContent = '求解中…（腔压缩 + shift-invert Lanczos）';
    /* 用当前网格（evecs 全长 = grid²，可直接上传显示）。谱按**预设腔体几何**
       计算，忽略用户手绘的势场改动——面板 hint 已注明。 */
    const sp = this.kernel.spectrum({ grid: st.grid, m: st.m, kind: st.billKind,
                                      nev: 10, eps: 1e-4 });
    this._billSpec = sp;
    this._refreshBillStat();
    const r = sp.meanR;
    this.toast('求谱完成 · ' + sp.evals.length + ' 态 · ⟨r⟩=' +
      (isFinite(r.r) ? r.r.toFixed(3) : '—') + ' · ' + (sp.ms/1000).toFixed(2) + 's');
  }

  _refreshBillStat(){
    const sp = this._billSpec, stat = this.q('#billStat');
    if (!stat) return;
    if (!sp){ stat.textContent = '未求解'; return; }
    const r = sp.meanR;
    const rmax = sp.resid.reduce((a, b) => Math.max(a, b), 0);
    stat.textContent = sp.evals.length + ' 态 · ⟨r⟩=' + (isFinite(r.r) ? r.r.toFixed(3) : '—') +
      '（n=' + r.n + ' 间距）· ' + (sp.ms/1000).toFixed(1) + 's · 残差 ' + rmax.toExponential(1) +
      (sp.notConv ? ' ⚠未完全收敛' : '');
    const lv = this.q('#billLevels');
    if (lv) lv.textContent = sp.evals.slice(0, 6).map(v => v.toExponential(2)).join(' · ') + ' …';
  }

  /* ---------- R66 暗孤子：剖面极小位置 / 深度 ----------
     沿 x 把 |ψ|² 对 y 求和（暗带沿 y 均匀），极小值位置即暗带中心；
     背景取剖面中位数（避开 Dirichlet 边缘的下弯与凹陷本身）。 */
  darkProfile(nearX){
    const gl = this.gl, g = this.state.grid;
    const ch = this.kernel.pairs === 2 ? 4 : 2;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.psiA.fbo);
    const buf = new Float32Array(g*g*ch);
    gl.readPixels(0, 0, g, g, this.fmt, gl.FLOAT, buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const prof = new Float64Array(g);
    for (let y = 0; y < g; y++){
      const row = y*g;
      for (let x = 0; x < g; x++) prof[x] += this.kernel.cpuDensity(buf, (row + x)*ch);
    }
    /* nearX 给定 = 只在 ±30 texel 窗口内找极小（**跟踪**已知暗带）：全局最小
       会被背景声波辐射产生的次级涟漪抢走（实测位置在 90↔251 之间乱跳）。 */
    let im;
    if (nearX !== undefined && nearX !== null && nearX >= 0){
      const c0 = Math.round(nearX), lo = Math.max(3, c0 - 30), hi = Math.min(g - 4, c0 + 30);
      im = lo;
      for (let x = lo + 1; x <= hi; x++) if (prof[x] < prof[im]) im = x;
    } else {
      im = 3;
      for (let x = 4; x < g - 4; x++) if (prof[x] < prof[im]) im = x;
    }
    const sorted = Array.from(prof).sort((a, b) => a - b);
    const bg = sorted[g >> 1] || 1;
    return { x: im/g, xi: im, depth: bg > 0 ? 1 - prof[im]/bg : 0, bg,
             simTime: this.state.simTime };
  }

  /* ---------- R65 双势阱：ΔE（R64 谱求解器）+ z(t) 读数 ---------- */
  /* 双阱对称/反对称本征态的能量分裂 ΔE：线性极限下粒子数振荡频率就是 ΔE
     （z(t)=z₀cos(ΔE·t)）。走 R64 的「压缩 + shift-invert」，V 由势场纹理读
     （与 shader 同解码），vCut=0.5 把远处高势排除在支撑区外。 */
  dwSpectrum(){
    if (!this.kernel.spectrum) return this.toast('当前内核无谱求解');
    const st = this.state, g = st.grid, N = g*g;
    const d = this.vctx.getImageData(0, 0, 256, 256).data;
    const S = 256/g;
    const V = new Float64Array(N);
    for (let y = 0; y < g; y++){
      for (let x = 0; x < g; x++){
        const vx = Math.min(255, Math.floor((x + 0.5)*S));
        const vy = Math.min(255, Math.floor((y + 0.5)*S));
        V[y*g + x] = (d[(vy*256 + vx)*4] - 128)/127;
      }
    }
    const sp = this.kernel.spectrum({ grid: g, m: st.m, V, vCut: 0.5, nev: 4, eps: 1e-3 });
    const el = this.q('#dwDE');
    if (!sp.evals.length){ if (el) el.textContent = '求解失败（腔为空？）'; return; }
    const dE = sp.evals[1] - sp.evals[0];
    this._dwSpec = { dE, evals: Array.from(sp.evals), ms: sp.ms, nc: sp.nc };
    const T = dE > 0 ? 2*Math.PI/dE : Infinity;          /* 时间单位 */
    if (el) el.textContent = 'ΔE=' + dE.toExponential(3) + ' · T=2π/ΔE≈' +
      (isFinite(T) ? Math.round(T) + '（' + Math.round(T/1.2) + ' 帧）' : '∞') +
      ' · ' + (sp.ms/1000).toFixed(2) + 's';
    this.toast('ΔE=' + dE.toExponential(3) + ' · 谱 ' + sp.evals.length + ' 态 · ' + (sp.ms/1000).toFixed(2) + 's');
  }

  /* 谱结果快照（面板读数 + CDP 断言共用；无谱返回 null） */
  billInfo(){
    const sp = this._billSpec;
    if (!sp) return null;
    return {
      kind: this.state.billKind, n: sp.evals.length, mK: sp.mK, ms: sp.ms, nc: sp.nc,
      evals: Array.from(sp.evals), r: sp.meanR.r, nR: sp.meanR.n,
      residMax: sp.resid.reduce((a, b) => Math.max(a, b), 0),
      notConv: sp.resid.some(v => v > 1e-6),
      stat: (this.q('#billStat') || {}).textContent,
      levels: (this.q('#billLevels') || {}).textContent,
    };
  }

  /* 把第 idx 个本征向量上传到 psiA（实部，虚部 0）。本征态在演化下只累积
     全局相位 ⟹ 密度图样静止，可直接观察 scar；同时把 lastWave 置为中点零
     动量，避免「重置波包」把画面对回高斯包以外的旧几何。 */
  billiardShowBand(idx){
    const sp = this._billSpec;
    if (!sp || !sp.evecs[idx]) return this.toast('先点「求谱」');
    const g = this.state.grid, N = g*g, x = sp.evecs[idx];
    const data = new Float32Array(N*2);
    for (let i = 0; i < N; i++){ data[i*2] = x[i]; data[i*2+1] = 0; }
    this._uploadPsi(data);
    this.state.waveCount = 1;
    this.state.simTime = 0;
    this.state.lastWave = [0.5, 0.5, 0, 0];
    this.state.billBand = idx;
    this.toast('第 ' + (idx + 1) + ' 个本征态 · E=' + sp.evals[idx].toFixed(6));
  }

  /* ---------- R67 一维势谱：双垒 T(E) + 有限深阱束缚态 ---------- */
  /* 重画当前 R67 势并清空旧结果（滑块改动后调用） */
  _repaint1d(){
    const paint = { vctx: this.vctx, vGray: v => this.vGray(v), state: this.state };
    const p = this.state.preset;
    if (p === 'dbarrier' && this.kernel.paintDb) this.kernel.paintDb(paint);
    else if (p === 'fwell' && this.kernel.paintFw) this.kernel.paintFw(paint);
    else return;
    this.uploadV();
    this._dbCurve = null; this._dbProbe = null; this._fwell = null;
    const cv = this.q('#dbCanvas');
    if (cv){
      const g = cv.getContext('2d');
      g.clearRect(0, 0, cv.width, cv.height);
      g.fillStyle = 'rgba(4,8,16,.55)'; g.fillRect(0, 0, cv.width, cv.height);
    }
    const st = this.q('#dbStat'); if (st) st.textContent = '未求（参数已改）';
    const fs = this.q('#fwStat'); if (fs) fs.textContent = '未求（参数已改）';
    const fl = this.q('#fwLevels'); if (fl) fl.textContent = '—';
  }

  /* T(E) 曲线：x=E、y=log₁₀T（跨 5 个数量级，线性轴会把峰压成贴底的尖刺） */
  _drawDbCurve(c){
    const cv = this.q('#dbCanvas');
    if (!cv || !c) return;
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(4,8,16,.55)'; g.fillRect(0, 0, W, H);
    const L = 44, T = 12, Bm = 22, HP = H - T - Bm;
    const Tmin = 1e-6, lgT = Math.log10(Tmin);
    const X = E => L + (E/c.Emax)*(W - L - 12);
    const Y = t => T + (1 - Math.log10(Math.max(t, Tmin))/lgT)*HP;
    g.font = '9px ui-monospace,monospace';
    g.strokeStyle = 'rgba(120,160,220,.14)'; g.lineWidth = 1;
    for (const t of [1, 1e-2, 1e-4, 1e-6]){
      const yy = Y(t);
      g.beginPath(); g.moveTo(L, yy); g.lineTo(W - 12, yy); g.stroke();
      g.fillStyle = '#9aa7bd'; g.textAlign = 'right';
      g.fillText(t === 1 ? '1' : '1e' + Math.round(Math.log10(t)), L - 4, yy + 3);
    }
    g.strokeStyle = '#67e8f9'; g.lineWidth = 1.3; g.beginPath();
    c.pts.forEach((p, i) => {
      const px = X(p.E), py = Y(p.T);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    });
    g.stroke();
    for (const p of c.peaks){
      const px = X(p.E);
      g.strokeStyle = 'rgba(251,191,36,.65)'; g.setLineDash([2, 2]);
      g.beginPath(); g.moveTo(px, T); g.lineTo(px, T + HP); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#fbbf24';
      g.beginPath(); g.arc(px, Y(p.T), 3, 0, 6.2832); g.fill();
    }
    /* R70：WKB 解析对照叠加（纯渲染，模型在 physics/wkb.js）——
       · 包络（青柠虚线）：E<V0 谷底 exp(−4κb)（κ=√(2m(V0−E))，两片墙）；
         E>V0 领头阶无反射 ⟹ T=1；E=V0 转向点重合 ⟹ WKB 失效，竖红虚线标注。
       · 准能级（青柠点线）：Bohr–Sommerfeld k·a=nπ 的离散色散版
         E_n=2uK(1−cos(nπ/a))——有限高垒会把峰整体压低 ~20%（波函数渗入
         垒区），故准能级线是「峰应在哪」的量级参照，与琥珀精确峰的点位差
         即有限垒修正，不宣称逐峰对应。 */
    const wm = wkbBarrierModel(this.state.m || 1);
    const env = wm.curvePoints(this.state.dV0, this.state.dBw, this.state.dGap, c.Emax, 480);
    g.strokeStyle = 'rgba(163,230,53,.75)'; g.lineWidth = 1.1; g.setLineDash([5, 3]);
    let pen = false;
    for (const p of env){
      if (!isFinite(p.T)){ pen = false; continue; }      /* E=V0 失效区：断开 */
      const px = X(p.E), py = Y(p.T);
      if (!pen){ g.moveTo(px, py); pen = true; } else g.lineTo(px, py);
    }
    g.stroke(); g.setLineDash([]);
    for (const ql of wm.quasiLevels(this.state.dV0, this.state.dGap, 60, c.Emax)){
      const px = X(ql.E);
      g.strokeStyle = 'rgba(163,230,53,.28)'; g.setLineDash([1, 3]);
      g.beginPath(); g.moveTo(px, T); g.lineTo(px, T + HP); g.stroke(); g.setLineDash([]);
    }
    if (this.state.dV0 > 0 && this.state.dV0 < c.Emax){
      const px = X(this.state.dV0);
      g.strokeStyle = 'rgba(248,113,113,.5)'; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(px, T); g.lineTo(px, T + HP); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(248,113,113,.85)'; g.textAlign = 'left';
      g.fillText('E=V₀ · WKB 失效', px + 3, T + 9);
    }
    g.fillStyle = 'rgba(163,230,53,.85)'; g.textAlign = 'left';
    g.fillText('WKB 包络（虚线）/ 准能级（点线）', L, 10);
    const pr = this._dbProbe;
    if (pr && isFinite(pr.E)){
      g.fillStyle = '#f87171';
      g.beginPath(); g.arc(X(pr.E), Y(pr.T), 4, 0, 6.2832); g.fill();
      g.strokeStyle = '#f87171'; g.lineWidth = 1;
      g.beginPath();
      g.moveTo(X(pr.E) - 6, Y(pr.T)); g.lineTo(X(pr.E) + 6, Y(pr.T));
      g.moveTo(X(pr.E), Y(pr.T) - 6); g.lineTo(X(pr.E), Y(pr.T) + 6);
      g.stroke();
    }
    g.fillStyle = '#9aa7bd'; g.textAlign = 'left';
    g.fillText('T(E) · 纵轴 log₁₀', L, 10);
    g.textAlign = 'center';
    g.fillText('E（格点单位，E ≤ V₀）', L + (W - L - 12)/2, H - 6);
  }

  /* 求 T(E)：一次离散 TMM 扫（~0.6s），叠共振峰 */
  dbCurve1d(){
    if (this.kernelId !== 'schrodinger' || !this.kernel.dbCurve)
      return this.toast('当前内核无 TMM');
    const st = this.state;
    const c = this.kernel.dbCurve({ v0: st.dV0, bw: st.dBw, gap: st.dGap,
                                    n: 256, m: st.m, nE: 8000 });
    this._dbCurve = c; this._dbProbe = null;
    this._drawDbCurve(c);
    const el = this.q('#dbStat');
    if (el){
      el.textContent = c.peaks.length
        ? (c.peaks.length + ' 峰 · ' + c.peaks.map(p => p.E.toFixed(4)).join(' / ') +
           '（T=1.000' + (c.peaks.length ? '，峰宽 < 采样步长时只标峰位' : '') + '）')
        : '未分辨出 T>0.5 的峰（垒太厚或量程不对）';
    }
  }

  /* 实测当前 k：跑真实波包演化测右侧概率，与 TMM 同能量点对照。
     轻量异步（rAF 逐帧，不阻塞 UI）：420 帧 ≈ 3–5s（软渲染）。 */
  dbProbe1d(){
    if (this._dbRun) return this.toast('探测进行中');
    if (this.paused) return this.toast('先取消暂停');
    const st = this.state;
    const w = st.lastWave || [0.18, 0.5, 0.55, 0];
    const kx = w[2] || 0;
    const uK = 0.5/st.m;
    const E = 2*uK*(1 - Math.cos(kx));
    this.initWave(0.18, 0.5, kx, 0);
    const nF = 420, run = { i: 0, n: nF, E, kx };
    this._dbRun = run;
    const el = this.q('#dbStat');
    const tick = () => {
      if (this._dbRun !== run) return;
      this.evolve();
      run.i++;
      if (run.i % 30 === 0 && el)
        el.textContent = '探测中 ' + run.i + '/' + nF + ' · E=' + E.toFixed(4);
      if (run.i >= nF){
        const sp = this.probSplit(160/256);
        const T = sp.P > 0 ? sp.right/sp.P : 0;
        const o = { v0: st.dV0, bw: st.dBw, gap: st.dGap, n: 256, m: st.m };
        const tm = this.kernel.dbTmm(E, o);
        /* 与实测**可比**的是波包谱卷积值（单色 TMM 的峰被 Δk 稀释，见 dbConvT 注释） */
        const tc = this.kernel.dbConvT(E, st.sigma, o);
        this._dbProbe = { E, T, Ttmm: tm.T, Tconv: tc, kx, P: sp.P };
        if (el) el.textContent = 'E=' + E.toFixed(4) + ' · 实测 T=' + T.toFixed(4) +
          ' · 单色 TMM=' + tm.T.toFixed(3) + ' · Δk 卷积=' + tc.toFixed(4) +
          (tc > 1e-6 ? ' · 实测/卷积 ' + (T/tc).toFixed(2) : '');
        this._drawDbCurve(this._dbCurve);
        this._dbRun = null;
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* ---------- R70 球势垒散射：相移表 + 截面（解析对照，渲染在 app.js、模型在 physics/scatter.js） ---------- */
  /* 势参数取主槽 potV0/potR（与 GPU 同一球），E 取独立滑块 scatE；
     色散口径 'discrete'（与 GPU 同一离散色散，见 scatter.js 文件头）。 */
  scatterCalc(){
    const sec = this.q('#scatSec');
    if (!sec || sec.style.display === 'none') return null;
    const st = this.state;
    const V0 = st.potV0, R = st.potR, E = st.scatE, m = st.m || 1;
    const M = sphericalScatterModel(m);
    const sc = M.scatter(E, V0, R, { disp: 'discrete', lmax: 8 });
    const uni = sc.k > 1e-9 ? 4*Math.PI/(sc.k*sc.k) : 0;
    this._scat = { E, V0, R, k: sc.k, sigma: sc.sigma, tail: sc.tail, uni, lmax: sc.lmax,
                   deltas: sc.deltas };
    const stat = this.q('#scatStat');
    if (stat){
      stat.textContent = 'k=' + sc.k.toFixed(4) + ' · kR=' + (sc.k*R).toFixed(2) +
        ' · σ=' + sc.sigma.toPrecision(4) + '（幺正上限 ' + uni.toPrecision(3) +
        '，l≤8 尾部 ' + sc.tail.toPrecision(2) + '）';
    }
    const dl = this.q('#scatDeltas');
    if (dl){
      dl.textContent = sc.deltas.map(d =>
        'l=' + d.l + ': ' + (d.delta*180/Math.PI).toFixed(1) + '°(sin²=' + d.s2.toFixed(3) + ')'
      ).join(' ');
    }
    this._drawScatCurve();
    return this._scat;
  }

  /* dσ/dΩ(θ) 画布：纵轴 log₁₀（低 k 截面 ~1/k² 跨数个量级，线性轴不可读），
     红虚线 = s 波幺正上限 dσ/dΩ=1/k²（δ₀=π/2 共振时纯 s 波曲线触及它）。 */
  _drawScatCurve(){
    const cv = this.q('#scatCanvas');
    const s = this._scat;
    if (!cv || !s) return;
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(4,8,16,.55)'; g.fillRect(0, 0, W, H);
    const L = 44, T = 12, Bm = 22, HP = H - T - Bm;
    const X = th => L + (th/Math.PI)*(W - L - 12);
    const lgMin = -9, lgMax = 3;
    const Y = v => T + (1 - (Math.log10(Math.max(v, 1e-9)) - lgMin)/(lgMax - lgMin))*HP;
    g.font = '9px ui-monospace,monospace';
    g.strokeStyle = 'rgba(120,160,220,.14)'; g.lineWidth = 1;
    for (let p = lgMin; p <= lgMax; p += 3){
      const yy = Y(Math.pow(10, p));
      g.beginPath(); g.moveTo(L, yy); g.lineTo(W - 12, yy); g.stroke();
      g.fillStyle = '#9aa7bd'; g.textAlign = 'right';
      g.fillText('1e' + p, L - 4, yy + 3);
    }
    if (s.k > 1e-9){
      const yy = Y(1/(s.k*s.k));
      g.strokeStyle = 'rgba(248,113,113,.6)'; g.setLineDash([4, 3]);
      g.beginPath(); g.moveTo(L, yy); g.lineTo(W - 12, yy); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(248,113,113,.85)'; g.textAlign = 'left';
      g.fillText('s 波幺正 1/k²', L + 4, yy - 3);
    }
    const M = sphericalScatterModel(this.state.m || 1);
    g.strokeStyle = '#67e8f9'; g.lineWidth = 1.3; g.beginPath();
    for (let i = 0; i <= 120; i++){
      const th = Math.PI*i/120;
      const a = M.amplitude(s.E, s.V0, s.R, Math.cos(th), { disp: 'discrete', lmax: s.lmax });
      const px = X(th), py = Y(a.dsdO);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();
    g.fillStyle = '#9aa7bd'; g.textAlign = 'left';
    g.fillText('dσ/dΩ · log₁₀', L, 10);
    g.textAlign = 'center';
    g.fillText('θ（散射角）', L + (W - L - 12)/2, H - 6);
  }

  /* 有限深阱：1D 精确对角化 + 连续超越方程逐项对照 */
  fwellCalc(){
    if (this.kernelId !== 'schrodinger' || !this.kernel.fwellSpectrum)
      return this.toast('当前内核无束缚态求解器');
    const st = this.state;
    const lv = this.kernel.fwellLevels({ v0: st.fV0, a: st.fWa, n: st.grid, m: st.m });
