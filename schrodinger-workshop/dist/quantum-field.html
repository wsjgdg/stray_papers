     弹球走解析几何 inside；其余走 V 数组。返回 { evals, evecs(全长), resid,
     mK, cgAvg, nc, ms, meanR }。 */
  spectrum(opts){
    const n = opts.grid || 128, m = opts.m;
    const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    let r;
    if (opts.V){
      r = linearSpectrum({ n, m, V: opts.V, vCut: opts.vCut, nev: opts.nev, eps: opts.eps });
    } else {
      const kind = opts.kind === 'circle' ? 'circle' : 'stadium';
      const S = 256/n;
      r = linearSpectrum({ n, m, nev: opts.nev, eps: opts.eps,
        inside: (x, y) => billiardInside(x*S, y*S, kind) });
    }
    const ms = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0;
    return Object.assign(r, { ms, meanR: meanR(r.evals), evals: r.evals });
  }

  /* 势场重画（形状下拉 / 预设共用入口；与 drawBilliardV 单源） */
  paintBilliard(paint){
    drawBilliardV(paint, paint.state.billKind === 'circle' ? 'circle' : 'stadium');
  }

  /* R62 Bloch 能带的解析模型（HUD「E → 最近能级」与 BlochScanner 叠图共用，
     单源真值）。返回 mathieuBands 全字段 + 横向基模能量 ey0。
     **口径说明（与实测对账的前提，见 worklog R62「解析对照的口径」）**：
       实测 E = E_x(带,k) + ey0（2D 可分离 + 每步 y 基模投影 ⟹ 严格成立）；
       ey0 = uK·(2−2cos(π/(grid+1)))（Dirichlet y 基模）。
       连续谱对照的有效质量为 m·(grid/256)² ⟹ **只有 grid=256 时 mathieuBands
       的 (m, a) 才与离散系统同一物理系统**；其余网格下二者是不同系统（差
       80%~500%），扫描/HUD 均按 grid=256 口径给出（BlochScanner 强制 256）。 */
  blochModel(state){
    const o = { m: state.m, a: state.latA, V0: state.latV0, kN: 65 };
    const B = mathieuBands(o);
    const ey0 = (0.5/state.m)*(2 - 2*Math.cos(Math.PI/(state.grid + 1)));
    return Object.assign(B, {
      ey0, q: mathieuQ(o), m: o.m, a: o.a, V0: o.V0,
      /* 带 1/2 的「可比对账曲线」= 解析带 + 横向基模能量 */
      ref1: B.band1.map(v => v + ey0), ref2: B.band2.map(v => v + ey0),
    });
  }

  /* 解析能级阶梯（HUD「E → 最近能级」对照）：仅 box/harmonic 两预设返回，
     其余 null（HUD 隐藏该区）。单位与引擎一致：格点（texel）单位、ℏ=1、
     m=state.m。两个势场的解析谱：
       box（世界边界 Dirichlet，格点边长 g）：E(nx,ny)=c·(nx²+ny²)，
         c=(0.5/m)·(π/g)²（离散本征值 2sin²(nπ/2g)/m 的小 n 极限，n≪g 时
         与连续谱一致；预设波包 k≈0.12 ⟹ n≈10，截断误差 O((nπ/g)⁴)≈2e-6 可忽略）；
       harmonic（V=2.2e-5·d²，d 为势场画布像素）：画布恒 256² 且按世界坐标
         采样 ⟹ 格点坐标 V=2.2e-5·(256/g)²·r²，ℏω=√(4.4e-5/m)·256/g，
         E(n)=(n+½)·ℏω（n=nx+ny，2D 各向同性简并）。
     注意：波包是本征态的叠加，⟨E⟩ 与最近能级的差属正常（非守恒量偏差）；
     用户笔刷改动势场后解析模型不再精确——该区仅作预设势场的参照。 */
  energyLevels(state){
    const g = state.grid, m = state.m;
    const fmtE = v => Math.abs(v) < 1e-3 ? v.toExponential(2) : v.toFixed(6);
    if (state.preset === 'box'){
      const c = 0.5/m * Math.pow(Math.PI/g, 2);
      const E = (nx, ny) => c*(nx*nx + ny*ny);
      return {
        kind: '无限深方阱',
        param: 'c=' + fmtE(c),
        nearest(e){
          const tgt = e/c;
          let best = null;
          for (let nx = 1; nx <= 80 && nx*nx <= tgt + 0.25; nx++){
            const r2 = tgt - nx*nx;
            if (r2 < 0.25) break;
            const ny0 = Math.max(1, Math.round(Math.sqrt(r2)));
            for (let d = -1; d <= 1; d++){
              const ny = ny0 + d; if (ny < 1) continue;
              const ev = E(nx, ny), err = Math.abs(ev - e);
              if (!best || err < best._err) best = { label: '(' + nx + ',' + ny + ')', e: ev, d: ev - e, _err: err };
            }
          }
          return best;
        },
      };
    }
    if (state.preset === 'harmonic'){
      const w = Math.sqrt(4.4e-5/m) * 256/g;      /* ℏω（格点单位） */
      const E = n => (n + 0.5)*w;
      return {
        kind: '谐振子势',
        param: 'ℏω=' + fmtE(w),
        nearest(e){
          const n = Math.max(0, Math.round(e/w - 0.5));
          return { label: '' + n, e: E(n), d: E(n) - e };
        },
      };
    }
    if (state.preset === 'lattice'){
      /* R62 Mathieu 能带模型（mathieu.js，scipy 对账锚点）：HUD 显示当前
         k=θ/a 的带 1/带 2 位置与 BZ 边界 gap。k 网格线性插值（kN=65）。 */
      const B = this.blochModel(state);
      const o = { m, a: state.latA, V0: state.latV0 };
      const q = B.q;
      const k = (state.twistX || 0)/o.a;
      const f = Math.max(0, Math.min(1, k/B.kMax))*(B.kN - 1);
      const i0 = Math.floor(f), i1 = Math.min(B.kN - 1, i0 + 1), fr = f - i0;
      const lerp = arr => arr[i0]*(1 - fr) + arr[i1]*fr;
      return {
        kind: '光学晶格 Mathieu',
        param: 'V₀=' + fmtE(o.V0) + ' · a=' + o.a + ' · q=' + fmtE(q) + ' · gap=' + fmtE(B.gap.width),
        nearest(e){
          /* ref1/ref2 = 解析带 + 横向基模能量 ey0 ⟹ 与实测 ⟨E⟩ 同口径可比 */
          const e1 = lerp(B.ref1), e2 = lerp(B.ref2);
          const d1 = e1 - e, d2 = e2 - e;
          return Math.abs(d1) <= Math.abs(d2)
            ? { label: '带1', e: e1, d: d1 }
            : { label: '带2', e: e2, d: d2 };
        },
      };
    }
    return null;
  }

        if (paint && paint.state) paint.state.twistX = 0;
        if (b) b(paint);
      };
    }
    return P;
  }
}

/* 非线性薛定谔 / Gross-Pitaevskii 内核：
     iħ∂ψ/∂t = −ħ²/2m ∇²ψ + [V(x) − g|ψ|²]ψ
   与薛定谔内核的差别只有 localH 多一项 −g|ψ|²ψ 与势能密度的平均场修正
   ——引擎（app.js）零改动，本文件即「新增一个物理内核」的全部成本。
   符号约定（与教科书 focusing NLS 一致）：iψ_t + ∇²ψ/2 + g|ψ|²ψ = 0，
   故 g>0 = focusing（自聚焦/亮孤子），g<0 = defocusing（散焦）。
   物理诚实声明：严格的平面孤子仅在 1D 立方 NLS 稳定；2D 为 L² 临界，
   强 focusing 下会自聚焦塌缩（网格分辨率最终截断奇性）。
   KDK 对线性薛定谔严格酉（P=1.0000 精确）；对非线性系统为辛积分，
   P 有 O(dt²) 漂移（g=6 时约 0.3%，HUD 守恒误差列如实显示，<1% 不告警）。 */

class NLSKernel extends PhysicsKernel {
  constructor(){
    super();
    this.id = 'nls';
    this.name = '非线性薛定谔';
    this.equation = '<b>NONLINEAR SCHRÖDINGER</b> · <i>i</i>ħ ∂ψ/∂t = −ħ²/2m ∇²ψ + V(x)ψ − <i>g</i>|ψ|²ψ';
    this.pairs = 1;
    /* R66 场景模式（presets 的 build 设置）：'free' = 高斯包；'dark' = 暗孤子条带 */
    this._mode = 'free';
  }

  makeWave(grid, p){
    if (this._mode === 'dark') return this._makeDark(grid, p);
    return gaussianWave(grid, p);
  }

  /* R66 暗孤子初态（defocusing NLS，g<0）。
     标准形式 iψ_t = −½ψ_xx + G|ψ|²ψ（G=−g>0）的精确解，背景密度 ρ₀=1/A：
       ψ(x) = √ρ₀·[ i·(v/c) + √(1−v²/c²)·tanh((x−x₀)/ξ) ]
       ξ = 1/√(Gρ₀)（愈合长度）、c = √(Gρ₀)（声速）、v < c
     ⟹ |ψ|² = ρ₀[1 − (1−v²/c²)·sech²]，即背景上的一个暗凹陷（相位在凹陷处跳 π）。
     2D 里沿 y 均匀 = 一条暗带（准 1D 条带近似，与 NLS 的「条带孤子」同口径）。
     **归一化**：背景 ρ₀=1/(grid²)（引擎随后统一归一化，比例不变）。 */
  _makeDark(grid, p){
    const G = -(typeof p.g === 'number' ? p.g : -40);
    const s = 256/grid;
    const rho0 = 1/(grid*grid);
    const c = Math.sqrt(Math.max(1e-12, G*rho0));
    const vRel = typeof p.darkV === 'number' ? Math.max(-0.9, Math.min(0.9, p.darkV)) : 0.4;
    const v = vRel*c;
    const xi = Math.sqrt(2/Math.max(1e-12, G*rho0));   /* -½ψ_xx 约定：ξ=√(2/(Gρ₀)) */
    const amp = Math.sqrt(rho0);
    const sq = Math.sqrt(Math.max(0, 1 - vRel*vRel));
    const x0 = 0.35*grid;                       /* 起始位置（左侧 35%，留出传播空间） */
    const data = new Float32Array(grid*grid*2);
    let sum = 0;
    for (let y = 0; y < grid; y++){
      for (let x = 0; x < grid; x++){
        const X = (x - x0)*s;                   /* 世界 px 偏移（ξ 定义在世界系） */
        const th = Math.tanh(X/xi);
        const re = amp*sq*th, im = amp*vRel;
        const i2 = (y*grid + x)*2;
        data[i2] = re; data[i2+1] = im;
        sum += re*re + im*im;
      }
    }
    return { data, sum };
  }

  /* 暗孤子理论参数（面板读数与验证共用，单源真值） */
  darkModel(state){
    const n = state.grid, G = -state.g;
    if (!(G > 0)) return null;
    const rho0 = 1/(n*n);
    const c = Math.sqrt(G*rho0);
    const vRel = Math.max(-0.9, Math.min(0.9, state.darkV === undefined ? 0.4 : state.darkV));
    return { G, rho0, c, xi: Math.sqrt(2/(G*rho0)), vRel, v: vRel*c,
             depth: 1 - vRel*vRel,                /* 凹陷深度（相对背景） */
             width: 2*Math.acosh(Math.SQRT2)/Math.sqrt(G*rho0/2) };   /* FWHM（sech² 半高全宽） */
  }

  defaults(){ return { g: 2.5 }; }

  shaders(){
    return {
      /* 内核私有 uniform 声明：注入三个模板的 uniform 区 */
      uniforms: 'uniform float uG;',
      /* H·c 局部部分 = (V − g|ψ|²)·c；c.zw 对 RG32F 恒为 (0,1)，点积只取 xy。
         符号约定：g>0 = focusing（方程写作 −g|ψ|²ψ，即教科书 iψ_t+∇²ψ/2+g|ψ|²ψ=0） */
      localH: '(V - uG*dot(c.xy,c.xy))*c',
      density: 'dot(psi.xy,psi.xy)',
      kinetic: '0.25*(dot(dxp,dxp)+dot(dyp,dyp))',
      /* 势能密度 = V|ψ|² − (g/2)|ψ|⁴：平均场能量，HUD「势能/总能」据此正确计量 */
      potential: '(V - 0.5*uG*dot(psi.xy,psi.xy))*p',
    };
  }

  /* 面板附加控件：非线性强度 g（>0 聚焦 / <0 散焦） */
  extraControls(){
    return {
      html: '<div class="row"><label>非线性 g</label><input type="range" id="rG" min="-200" max="10" step="0.5" value="2.5"><output id="oG">2.5</output></div>',
      rows: [ { id:'#rG', out:'#oG', key:'g', fmt: v => v.toFixed(1) } ],
    };
  }

  setUniforms(gl, prog, state){
    const loc = gl.getUniformLocation(prog, 'uG');
    if (loc) gl.uniform1f(loc, state.g);
  }

  /* 稳定性附加项：非线性项等效特征值上界 |g|·peak|ψ|²（peak ≈ 1/2πσ²，留 2× 裕度） */
  eMaxExtra(state){
    return Math.abs(state.g) * 2/(2*Math.PI*state.sigma*state.sigma);
  }

  applyParams(qp, state){
    const g = parseFloat(qp.get('g'));
    if (!isNaN(g)) state.g = Math.max(-6, Math.min(10, g));
  }

  presets(){
    const P = {
      free:     { name:'自由传播',     text:'g=0 退化为线性薛定谔方程：色散使波包自然展宽——作为非线性对照组的基准场景。',
                  build(){} , wave:[0.18,0.5,0.09,0], params:{ g:0 } },
      soliton:  { name:'条带孤子',     text:'focusing 非线性（方程中的 −g|ψ|²ψ，g>0）与色散对抗：波包自聚焦压缩后宽度稳定、整体传播（准一维条带近似）。严格的平面孤子只在 1D 立方 NLS 稳定；2D 为 L² 临界，扰动下会缓慢呼吸。',
                  build(){} , wave:[0.12,0.5,0.10,0], params:{ g:2.5, sigma:5 } },
      focus:    { name:'自聚焦',       text:'强调节：非线性压过色散，波包急剧收缩、峰值飙升——2D 立方 NLS 的 L² 临界塌缩前兆，网格精度最终会截断奇性。拖动 g 滑块可连续调节聚焦强度。',
                  build(){} , wave:[0.30,0.5,0,0], params:{ g:6 } },
      barrier:  { name:'孤子过垒',     text:'孤子撞势垒：线性反射/隧穿与非线性自聚焦的竞争——透射部分变形后重新自聚焦，稳定传播。势垒高度由「V 值」滑块与笔刷控制。',
                  build(paint){ paint.vctx.fillStyle = paint.vGray(0.02); paint.vctx.fillRect(120,30,16,196); }, wave:[0.10,0.5,0.09,0], params:{ g:2.5 } },
      dark:     { name:'暗孤子',       text:'defocusing 非线性（g<0，排斥）的强度解：均匀背景上的一个密度凹陷 |ψ|²=ρ₀[1−(1−v²/c²)sech²]，凹陷处相位跳 π，愈合长度 ξ=1/√(Gρ₀)、声速 c=√(Gρ₀)。它不是静止的——以亚声速 v 沿 x 传播，剖面在传播中保持不变（与亮孤子一样是守恒律保护的非线性本征结构）。与「条带孤子」正好互为补集：亮孤子是密度尖峰（g>0 聚焦），暗孤子是密度空洞（g<0 散焦）。面板给 v/c 滑块与实时位置/深度读数，可对照理论值。注意：2D 里这是沿 y 均匀的暗带（准 1D 条带近似），严格 1D 暗孤子才无条件稳定。',
                  build(){}, wave:[0.5,0.5,0,0], params:{ g:-200, darkV:0.4 } },
    };
    /* R66：_mode 复位（与 R63 修过的 schrodinger 同款）。不这样做的话，从 dark
       切回任何一个旧预设都会继续拿到暗孤子初态（初态忽略 fx/fy/kx/ky，画面却
       「正常」——静默错误）。统一包装：只有 dark 置 'dark'，其余归 'free'。 */
    for (const k in P){
      const b = P[k].build;
      P[k].build = (paint) => {
        this._mode = (k === 'dark') ? 'dark' : 'free';
        /* 暗孤子需要 **x 向周期边界**（常数背景在 Dirichlet 壁前会被压到 0，
           实测 60 帧内背景就崩了）。引擎的周期边界只在 uTwistX≠0 时启用
           （S() 的 wrap 分支），故借用 Bloch 相位开一个 1e-9（相位 e^{±i·8e-9}≈1，
           物理上就是普通周期）；其它预设显式归 0，避免把 x 周期污染给它们。 */
        if (paint && paint.state) paint.state.twistX = (k === 'dark') ? 1e-9 : 0;
        if (b) b(paint);
      };
    }
    return P;
  }
}

registerKernel(new NLSKernel());

/* ===== src/physics/gp.js ===== */
/* Gross-Pitaevskii / BEC（玻色-爱因斯坦凝聚）内核：
     iħ∂ψ/∂t = −ħ²/2m ∇²ψ + V(x)ψ − g|ψ|²ψ
   与 NLS 内核同一方程族（localH/density/kinetic/potential 片段逐字相同）——
   引擎（app.js）零改动，本文件即「新增一个物理内核」的全部成本。
   差别在物理诠释与场景：BEC 的 g ∝ s 波散射长度，招牌现象是
   托马斯-费米密度穹顶、量子化涡旋、时飞行膨胀、集体呼吸模。

   符号约定（与 NLS 内核统一，避免两套记号）：
     方程写作 −g|ψ|²ψ；g<0 = 排斥相互作用（a_s>0，稳定 BEC，默认 −10）；
     g>0 = 吸引相互作用（a_s<0）——2D 为 L² 临界，浓度/质量超过临界值后
     自聚焦塌缩，与 NLS「focus」预设同机制：网格分辨率最终截断奇性，
     HUD 守恒误差列如实显示，不做任何守恒美化。
     （教科书 GP 多写作 +g_BEC|ψ|²ψ 且 g_BEC>0 为排斥，对应本代码 g = −g_BEC。）

   数值约定（重要，决定滑块量程与默认参数）：
     引擎把总概率归一化到 Σ|ψ|²=1。TF 自洽条件 |g| = πμR²/2（μ 化学势、
     R 云半径）给出平衡半径与耦合强度的一一对应：
       R_TF⁴ = 2·TRAP_R²·|g|/π，且 μ_eq/ħω = √(|g|/π)
     g=−10 → TF 平衡半径 ≈ 11px、平衡峰值 ≈ μ/|g| ≈ 5.3e-3（μ/ħω ≈ 1.8，
     弱 TF 区，轮廓介于高斯与抛物穹顶之间）。
     若按 R=16 取自洽 |g|≈45，辛积分 O(dt³) 相误差使 100 sim-time 窗
     P 漂移达 7%（子步 6）/ 2.6%（子步 16），超出教学可接受度——
     故默认取弱耦合 g=−10 + 积分子步 16（UI 上限），180–240 sim-time
     窗漂移 ~1–1.3%，由 HUD 如实显示。
     初态抛物穹顶与真实基态轮廓之差激发不衰减的集体呼吸模。CDP 实测
     （g=−10、子步 16、180–240 sim-time 窗）峰值摆动随 σ 单调减小：
       σ= 8: ×24.8   10: ×9.9   12: ×4.9   14: ×2.9   16: ×2.7   18: ×3.7
     默认 σ=16 取摆动最小点；周期 ≈ 105–115 sim-time（半周 ~70/~40
     交替的非简谐波形），与线性 2ω 模（T/2 = 107）定性一致。
     各 σ 摆动区间均覆盖 TF 平衡峰值 5.3e-3；σ=16 初态峰值 3.1e-3
     低于它，故释放后先收缩——与 TF 图像定性一致。
     σ 滑块（4–18）在本内核中语义为「云半径」（世界 px，势场面布 256²）。
     势阱形制在预设切换时绘制（build），暂无运行时阱频率控件（诚实限制）。

     R47（平滑窗比例化）：makeWave 的 TF 硬边平滑窗由固定 6px 改为
     w=max(2, R/4)（R=σ=R_TF(g)）。诊断（256² 全网格逐点复刻）：固定 6px
     在扫描量程 g=−20…−4（R_TF=13.1…8.75px，窗占半径 46–69%）把
     √3·Rrms 拉偏 16.9–27.6%；R/4 压到 ~6.8% 且全 g 一致、质量保持
     0.54–0.75→~0.91、峰值比 1.000。CDP 演化层复测（cdp42）：P 漂移
     3.10%→2.88%（未恶化）、峰值对账 3.5%→6.4%；**R_TF 半径对账中位偏差
     29.9%→46.0%——归因修正**：该偏差主因是演化推宽（振荡中心被推至初态
     的 1.4–2.2 倍：弱耦合 TF 穹顶宽于精确基态 + 无耗散呼吸模不衰减，
     g=−4 最弱耦合推宽 +118%），6px 窗压窄初态（−17~−28%）恰是部分补偿
     （误差相消）⟹ 比例窗让初态诚实、偏差如实暴露，而非靠窗变形掩盖。 */

/* 世界坐标：势场面布 256²，特征量以世界 px 计。
   谐波阱 V(r) = (r/TRAP_R)²（V(48)=1，阱频率 ω = √2/TRAP_R ≈ 0.0295，
   阱周期 T = 2π/ω ≈ 213 sim-time；引擎每帧推进 dt=1.2 sim-time，
   60fps 下约 3.6s，教学观察尺度内）。
   涡旋愈合层半径 HOLE_RC=4 ≈ ξ = 1/√(|g|·n₀)（n₀ 取 TF 平衡峰值
   ~5.3e-3，自洽）。 */
const TRAP_R = 48;
const HOLE_RC = 4;

/* ---------- R51：虚时间弛豫（构造离散 H 的精确基态）----------
   背景（R50 诊断）：TF 穹顶初态与真实基态的轮廓差激发不衰减的集体呼吸模
   （cdp42 实测半径对账偏差 46.0%，归因为主因）——虚时间流 ∂ψ/∂τ=−(H−μ)ψ
   收敛到离散 H 的基态（Hψ=μψ），呼吸模被弛豫掉：实测 KDK 200 帧窗 Rrms
   呼吸由 60.0% → 0.36%（g=−10，两个数量级），剩余 √3·Rrms vs R_TF 偏差
   +15.6% 是**真实物理**（有限耦合下 TF 近似的系统误差，随 |g| 单调收敛：
   +30.0/−10 → +5.2/−40），不是数值伪影。

   数值方案（诊断期受控实验定标，见 worklog R50/R51）：
     - Strang 分裂：exp(diag·τ/2) → ADI exp(0.5τ·Dx)exp(0.5τ·Dy) → exp(diag·τ/2)，
       diag = μ − V + g|ψ|²（实空间对角显式）；μ = 变分能 ⟨H⟩（归一化梯度流的
       正确拉格朗日乘子，GP 能量泛函变分得 Hψ=μψ）；每步归一化
     - ADI 每行/列解三对角 (I − 0.25τ·D)ψ* = (I + 0.25τ·D)ψ，Thomas 算法（无条件稳定）
     - τ=1.0：ADI 稳定但 τ 越大 Strang 分裂误差越大。实测（生产 V 量化口径）
       τ=0.5/1/2 → 密度峰呼吸 0.457/0.541/0.916%、Rrms 呼吸 0.256/0.361/0.585%、
       步数 400/212/113 ⟹ τ=1 在「<0.6% 呼吸」与「<250 步（~0.7s）」间取平衡
     - V 逐字镜像生产纹理：v = min(1,(r/TRAP_R)²)（势阱封顶，与 presets 的 trap
       绘制同式），vGray(v)=round(v*127+128)，shader 解码 (gray−128)/127 ⟹
       V = round(v*127)/127。若弛豫用平滑 V 而生产用量化 V，阶梯量化的错配会
       残留约 2× 的密度峰呼吸（实测 1.165% vs 0.541%）

   收敛判据：Rrms 连续 5 步相对变化 < 1e-8（上限 RELAX_MAX_STEPS 步；未收敛
   也返回当前态——仍远好于穹顶）。g≥0（吸引侧）无稳定基态（2D L² 临界塌缩），
   直接跳过弛豫保留穹顶（与 NLS focus 同机制，如实不做数值美化）。
   R52（渐进化）：弛豫任务由引擎帧循环分帧推进（relaxStep(budget)），
   makeWave 不再同步阻塞——单步数学与本注释描述逐字相同。 */
const RELAX_TAU = 1.0;
const RELAX_MAX_STEPS = 400;

/* ADI 三对角求解（零 Dirichlet）：(I − a·D)x = rhs，D = tridiag(1,−2,1)，Thomas 算法。
   注意 Y 方向回代读「下一行」(偏移 +n) 而非「下一列」(+1)——诊断期踩过的坑
   （从 X 版复制未改偏移 ⟹ 回代退化、分裂方案不收敛），见 worklog R50。 */
/* ---------- R65 双势阱（Josephson / 自囚禁）---------- */
/* 几何（世界 px，势场面布 256²）：两个抛物阱心相距 DW_SEP，阱宽 DW_R。
   中央垒高 = (DW_SEP/2/DW_R)²（V 在 x=128 处取 min 的两个阱值）。
   sep=20/R=44 ⟹ 垒高 0.0517，对 E~1e-2 的云是「深垒但可隧穿」。 */
const DW_SEP = 14, DW_R = 48, DW_SIG = 6;

function drawDW(paint){
  const img = paint.vctx.getImageData(0, 0, 256, 256);
  const x1 = 128 - DW_SEP/2, x2 = 128 + DW_SEP/2;
  for (let y = 0; y < 256; y++){
    for (let x = 0; x < 256; x++){
      const px = x + 0.5, py = y + 0.5;
      const v1 = ((px - x1)**2 + (py - 128)**2)/(DW_R*DW_R);
      const v2 = ((px - x2)**2 + (py - 128)**2)/(DW_R*DW_R);
      const v = Math.min(1, Math.min(v1, v2));
      const gv = Math.round(v*127 + 128);
      const i2 = (y*256 + x)*4;
      img.data[i2] = gv; img.data[i2+1] = gv; img.data[i2+2] = gv; img.data[i2+3] = 255;
    }
  }
  paint.vctx.putImageData(img, 0, 0);
}

/* 双高斯初态：左/右阱幅度 √((1±z₀)/2)、相对相位 φ₀（右阱乘 e^{iφ₀}）。
   幅度直接给定初始粒子数差 z₀=(N_L−N_R)/N（引擎随后统一归一化，比值不变）。 */
function makeDW(grid, p){
  const s = grid/256;
  const x1 = (128 - DW_SEP/2)*s, x2 = (128 + DW_SEP/2)*s, cy = 128*s;
  const sg = DW_SIG*s;
  const z0 = Math.max(-0.95, Math.min(0.95, typeof p.dwZ0 === 'number' ? p.dwZ0 : 0));
  const phi = typeof p.dwPhi === 'number' ? p.dwPhi : 0;
  const a1 = Math.sqrt((1 + z0)/2), a2 = Math.sqrt((1 - z0)/2);
  const cph = Math.cos(phi), sph = Math.sin(phi);
  const data = new Float32Array(grid*grid*2);
  let sum = 0;
  const inv2 = 1/(2*sg*sg);
  for (let y = 0; y < grid; y++){
    for (let x = 0; x < grid; x++){
      const dy = y - cy;
      const g1 = Math.exp(-(((x - x1)**2 + dy*dy))*inv2);
      const g2 = Math.exp(-(((x - x2)**2 + dy*dy))*inv2);
      const re = a1*g1 + a2*cph*g2, im = a2*sph*g2;
      const i2 = (y*grid + x)*2;
      data[i2] = re; data[i2+1] = im;
      sum += re*re + im*im;
    }
  }
  return { data, sum };
}

function tridiagSolveX(rhs, out, n, a){
  const lo = -a, dg = 1 + 2*a, up = -a;
  const cp = new Float64Array(n), dp = new Float64Array(n);
  for (let y=0; y<n; y++){
    const row = y*n;
    cp[0] = up/dg; dp[0] = rhs[row]/dg;
    for (let x=1; x<n; x++){ const m = dg - lo*cp[x-1]; cp[x] = up/m; dp[x] = (rhs[row+x] - lo*dp[x-1])/m; }
    out[row + n-1] = dp[n-1];
    for (let x=n-2; x>=0; x--) out[row+x] = dp[x] - cp[x]*out[row+x+1];
  }
}
function tridiagSolveY(rhs, out, n, a){
  const lo = -a, dg = 1 + 2*a, up = -a;
  const cp = new Float64Array(n), dp = new Float64Array(n);
  for (let x=0; x<n; x++){
    cp[0] = up/dg; dp[0] = rhs[x]/dg;
    for (let y=1; y<n; y++){ const m = dg - lo*cp[y-1]; cp[y] = up/m; dp[y] = (rhs[y*n+x] - lo*dp[y-1])/m; }
    out[(n-1)*n + x] = dp[n-1];
    for (let y=n-2; y>=0; y--) out[y*n+x] = dp[y] - cp[y]*out[y*n+x+n];
  }
}

class GPKernel extends PhysicsKernel {
  constructor(){
    super();
    this.id = 'gp';
    this.name = 'Gross-Pitaevskii';
    this.equation = '<b>GROSS-PITAEVSKII · BEC</b> · <i>i</i>ħ ∂ψ/∂t = −ħ²/2m ∇²ψ + V(x)ψ − <i>g</i>|ψ|²ψ';
    this.pairs = 1;
    /* 场景模式由 preset.build() 在 initWave 前设置——loadPreset 的调用次序
       是先 build（画势场）后 initWave（生成波函数），故此处标记必先于
       makeWave 生效；拖拽发射沿用上次预设的模式。 */
    this._mode = 'tf';
  }

  /* 初始场：TF 密度穹顶（可选相位绕数涡旋）× 可选动量平面波。
     引擎负责归一化（Σ|ψ|²=1）与等份叠加，这里只给形状。 */
  makeWave(grid, p){
    /* R52：任何重发都取消未完成的弛豫任务（切预设/改 σ/拖拽发射/扫描布点
       都是全新初态；gs 分支会在下方重建任务）⟹ 旧任务不会写到新场上。 */
    this._relaxTask = null;
    if (this._mode === 'dw') return makeDW(grid, p);
    const cx = p.fx*grid, cy = p.fy*grid;
    const s = 256/grid;                          /* 世界 px / 网格 px */
    const R = p.sigma;                           /* 云半径（世界 px，来自 σ 滑块） */
    const mu = (R/TRAP_R)*(R/TRAP_R);            /* 与绘制阱一致的化学势 */
    const vortex = this._mode === 'vortex';
    /* R51 基态模式：虚时间弛豫 ⟹ 离散 H 的精确基态（无呼吸模）。
       g 由引擎透传（initWave 的 p.g；缺省/非有限时退回 −10 的保守值）。 */
    if (this._mode === 'gs'){
      const g = (typeof p.g === 'number' && isFinite(p.g)) ? p.g : -10;
      return this._makeGS(grid, cx, cy, s, R, g);
    }
    const data = new Float32Array(grid*grid*2);
    let sum = 0;
    for (let y=0; y<grid; y++){
      for (let x=0; x<grid; x++){
        const dxw = (x-cx)*s, dyw = (y-cy)*s;     /* 世界 px 偏移 */
        const r = Math.hypot(dxw, dyw);
        const dome = Math.sqrt(Math.max(0, mu - (r/TRAP_R)*(r/TRAP_R)));
        /* TF 硬边的平滑过渡（密度连续，抑制边缘高频衍射）。窗宽随云半径
           缩放 w = max(2, R/4)（R47 诊断修正，原固定 6px）：
           诊断实测（/tmp/gp_smooth/diag_smooth.mjs，256² 全网格逐点复刻
           makeWave，对账口径 √3·Rrms vs 解析 R_TF）——
           固定 6px 在扫描量程 g=−20…−4（R_TF=13.1…8.75px，窗占半径
           46–69%）把 √3·Rrms 拉偏 16.9–27.6%（R42 cdp42 实测半径偏差
           29.9% 的形状层主因；硬边 TF 参考自洽到 0.1%）；比例窗 R/4 把
           偏差压到 ~6.8% 且全 g 一致，质量保持 0.54–0.75 → ~0.91。
           边缘最大梯度随窗窄而升（R/4 ≈ 2px 固定窗档）⟹ 辛积分 P 漂移
           风险回升，cdp42 复测（P 漂移判据 ≤6%）为验收项；下限 2px 保
           g→0 小云不退化。历史记录：2px 硬边时局部强梯度是辛积分 P 漂移
           的主要误差源；6px 过渡 + 默认 16 子步曾把 100 sim-time 窗漂移
           压到 <1%（g=−10 口径，其窗宽实为 0.55·R_TF）。 */
        const w = Math.max(2, R/4);
        const e = Math.max(0, Math.min(1, (R - r)/w));
        const sm = e*e*(3 - 2*e);
        let a = dome*sm, ph = 0;
        if (vortex){
          /* 单量子化涡旋：愈合层内密度 → 0，相位绕核一周 e^{iφ} */
          const hole = 1 - Math.exp(-(r*r)/(2*HOLE_RC*HOLE_RC));
          a *= hole;
          ph = Math.atan2(dyw, dxw);
        }
        /* 动量平面波（与 gaussianWave 同约定：k 以网格 px 计） */
        const pk = p.kx*(x-cx) + p.ky*(y-cy);
        ph += pk;
        const i = (y*grid+x)*2;
        const re = a*Math.cos(ph), im = a*Math.sin(ph);
        data[i] = re; data[i+1] = im;
        sum += re*re + im*im;
      }
    }
    return { data, sum };
  }

  /* ---------- 基态（虚时间弛豫）---------- */
  /* R52（渐进化）：弛豫任务与帧循环解耦——makeWave 只建任务并立即返回穹顶
     初态（不阻塞）；relaxStep(budget) 由引擎帧循环每帧调用推进有限步虚时间
     流，返回本帧场快照 { data, done, info } 供上层上传显示（收敛过程可见），
     无任务返回 null。单步数学与 R51 同步版逐字相同（循环拆分不改浮点轨迹）
     ⟹ 分帧驱动与一次性驱动结果逐位一致（gs52 单测断言）。 */
  get relaxPending(){ return this._relaxTask !== null; }

  /* 变分能 μ = ⟨H⟩（GP 能量泛函变分 ⟹ Hψ=μψ，归一化梯度流的正确乘子）。
     a 实振幅（Float64Array(n²)）；V 须为生产纹理口径。 */
  _energyOf(t){
    const n = t.n, a = t.a, V = t.V, g = t.g, out = t.t1;
    for (let y=0; y<n; y++){
      const y0 = y*n;
      for (let x=0; x<n; x++){
        const l = (x>0? a[y0+x-1] : 0) + (x<n-1? a[y0+x+1] : 0)
                + (y>0? a[y0-n+x] : 0) + (y<n-1? a[y0+n+x] : 0) - 4*a[y0+x];
        out[y0+x] = l;
      }
    }
    let e = 0;
    for (let i=0; i<a.length; i++) e += a[i]*(-0.5*out[i] + (V[i] - g*a[i]*a[i])*a[i]);
    return e;
  }

  /* 单步虚时间流（与 R51 _relaxGS 循环体逐字相同）：
     Strang 分裂 exp(对角·τ/2) → ADI exp(0.5τDx)exp(0.5τDy) → exp(对角·τ/2)，
     ADI 每行/列解三对角 (I−0.25τD)ψ*=(I+0.25τD)ψ（Thomas，无条件稳定）；
     每步归一化；收敛判据 Rrms 连续 5 步相对变化 < 1e-8。 */
  _relaxOnce(t){
    const n = t.n, a = t.a, V = t.V, g = t.g, N = n*n;
    const t1 = t.t1, t2 = t.t2, t3 = t.t3;
    const h = RELAX_TAU/2, aa = 0.25*RELAX_TAU;
    /* 对角半步：a *= exp((μ − V + g·a²)·τ/2) */
    for (let i=0; i<N; i++) a[i] *= Math.exp((t.mu - V[i] + g*a[i]*a[i])*h);
    /* ADI 动能：exp(0.5τ·Dx) 后 exp(0.5τ·Dy) */
    for (let y=0; y<n; y++){
      const row = y*n;
      for (let x=0; x<n; x++){
        const l = (x>0? a[row+x-1] : 0) + (x<n-1? a[row+x+1] : 0) - 2*a[row+x];
        t3[row+x] = a[row+x] + aa*l;
      }
    }
    tridiagSolveX(t3, t2, n, aa);
    for (let x=0; x<n; x++){
      for (let y=0; y<n; y++){
        const ym = y>0? t2[(y-1)*n+x] : 0, yp = y<n-1? t2[(y+1)*n+x] : 0;
        t3[y*n+x] = t2[y*n+x] + aa*(ym + yp - 2*t2[y*n+x]);
      }
    }
    tridiagSolveY(t3, a, n, aa);
    /* 对角半步 + 归一化 */
    for (let i=0; i<N; i++) a[i] *= Math.exp((t.mu - V[i] + g*a[i]*a[i])*h);
    let ss = 0;
    for (let i=0; i<N; i++) ss += a[i]*a[i];
    if (!(ss > 0) || !isFinite(ss)){ t.finished = true; t.diverged = true; return; }
    const inv = 1/Math.sqrt(ss);
    for (let i=0; i<N; i++) a[i] *= inv;
    t.mu = this._energyOf(t);
    if (!isFinite(t.mu)){ t.finished = true; t.diverged = true; return; }
    /* 收敛判据：Rrms（网格坐标，比例无关）连续 5 步相对变化 < 1e-8 */
    let s0 = 0, s2 = 0;
    for (let y=0; y<n; y++){
      const row = y*n, dy = y - 0.5*n;
      for (let x=0; x<n; x++){
        const v = a[row+x], dx = x - 0.5*n;
        s0 += v*v; s2 += v*v*(dx*dx + dy*dy);
      }
    }
    const cur = s0 > 0 ? Math.sqrt(s2/s0) : 0;
    if (Math.abs(cur - t.prev) < 1e-8*cur) t.stable++; else t.stable = 0;
    t.prev = cur;
    if (t.stable >= 5) t.finished = true;
  }

  /* 任务完结出口：构造交错场快照 + 记录 info + 清任务 */
  _relaxFinalize(t){
    const N = t.n*t.n, a = t.a;
    let sum = 0;
    for (let i=0; i<N; i++) sum += a[i]*a[i];
    const norm = sum > 0 ? 1/Math.sqrt(sum) : 0;
    const data = new Float32Array(N*2);
    for (let i=0; i<N; i++) data[i*2] = a[i]*norm;
    const info = { steps: t.steps, converged: t.stable >= 5 && !t.diverged, diverged: !!t.diverged };
    this._relaxTask = null;
    this._lastRelax = info;
    return { data, done: true, info };
  }

  _relaxSnapshot(t){
    const N = t.n*t.n, a = t.a;
    let sum = 0;
    for (let i=0; i<N; i++) sum += a[i]*a[i];
    const norm = sum > 0 ? 1/Math.sqrt(sum) : 0;
    const data = new Float32Array(N*2);
    for (let i=0; i<N; i++) data[i*2] = a[i]*norm;
    return { data, done: false };
  }

  /* 推进最多 budget 步；返回本帧场快照 { data, done, info }（data 供上层上传），
     无任务返回 null。done=true 时任务完结（收敛/上限/发散三种出口同 R51）。 */
  relaxStep(budget){
    const t = this._relaxTask;
    if (!t) return null;
    for (let k=0; k<budget && !t.finished; k++){
      t.steps++;
      this._relaxOnce(t);
    }
    if (t.finished || t.steps >= RELAX_MAX_STEPS) return this._relaxFinalize(t);
    return this._relaxSnapshot(t);
  }

  _makeGS(grid, cx, cy, s, R, g){
    const n = grid, N = n*n;
    /* 生产 V 纹理逐字镜像：v = min(1,(r/48)²)（势阱封顶，与 presets 的 trap
       绘制同式），vGray(v)=round(v*127+128) + shader 解码 (gray−128)/127 */
    const V = new Float64Array(N);
    for (let y=0; y<n; y++){
      const dyw0 = (y - cy)*s;
      for (let x=0; x<n; x++){
        const dxw = (x - cx)*s, dyw = dyw0;
        const r = Math.hypot(dxw, dyw);
        const v = Math.min(1, (r/TRAP_R)*(r/TRAP_R));
        V[y*n+x] = Math.round(v*127)/127;
      }
    }
    /* 起点：TF 穹顶（与 tf 模式同式，R=σ、w=max(2,R/4)）——起点任意，
       收敛态由 g 唯一确定（R50 诊断：σ=16 与 σ=R_TF 起点结果逐位一致） */
    const a = new Float64Array(N);
    const mu = (R/TRAP_R)*(R/TRAP_R), w = Math.max(2, R/4);
    for (let y=0; y<n; y++){
      const dyw0 = (y - cy)*s;
      for (let x=0; x<n; x++){
        const r = Math.hypot((x - cx)*s, dyw0);
        const dome = Math.sqrt(Math.max(0, mu - (r/TRAP_R)*(r/TRAP_R)));
        const e = Math.max(0, Math.min(1, (R - r)/w));
        a[y*n+x] = dome*e*e*(3 - 2*e);
      }
    }
    let s0 = 0;
    for (let i=0; i<N; i++) s0 += a[i]*a[i];
    if (s0 > 0){ const inv = 1/Math.sqrt(s0); for (let i=0; i<N; i++) a[i] *= inv; }
    /* 建弛豫任务（R52：渐进推进）。g≥0（吸引侧）无稳定基态（2D L² 临界
       塌缩）⟹ 不建任务，保留穹顶（与 R51 跳过语义一致）。 */
    if (g < 0){
      const t = { a, n, g, V, mu: 0, prev: 0, stable: 0, steps: 0, finished: false, diverged: false,
                  t1: new Float64Array(N), t2: new Float64Array(N), t3: new Float64Array(N) };
      t.mu = this._energyOf(t);
      this._relaxTask = t;
    }
    /* 立即返回穹顶初态（实场、相位恒 0）；基态由 relaxStep 分帧收敛后写回 */
    let sum = 0;
    for (let i=0; i<N; i++) sum += a[i]*a[i];
    const norm = sum > 0 ? 1/Math.sqrt(sum) : 0;
    const data = new Float32Array(N*2);
    for (let i=0; i<N; i++) data[i*2] = a[i]*norm;
    return { data, sum: 1 };
  }

  defaults(){ return { g: -10, substeps: 16 }; }

  shaders(){
    return {
      /* 与 NLS 逐字相同：本方程族共享 localH/density/kinetic/potential */
      uniforms: 'uniform float uG;',
      localH: '(V - uG*dot(c.xy,c.xy))*c',
      density: 'dot(psi.xy,psi.xy)',
      kinetic: '0.25*(dot(dxp,dxp)+dot(dyp,dyp))',
      /* 势能密度 = V|ψ|² − (g/2)|ψ|⁴：排斥相互作用（g<0）时为 +|g|/2·|ψ|⁴ */
      potential: '(V - 0.5*uG*dot(psi.xy,psi.xy))*p',
    };
  }

  /* 面板附加控件：相互作用强度 g（<0 排斥 / >0 吸引，量程见头部数值约定） */
  extraControls(){
    return {
      html: '<div class="row"><label>相互作用 g</label><input type="range" id="rG" min="-150" max="300" step="5" value="-10"><output id="oG">-10</output></div>',
      rows: [ { id:'#rG', out:'#oG', key:'g', fmt: v => v.toFixed(0) } ],
    };
  }

  setUniforms(gl, prog, state){
    const loc = gl.getUniformLocation(prog, 'uG');

  /* 稳定性附加项：非线性等效特征值上界 |g|·peak|ψ|²。
     TF 穹顶 IC 峰值 ≈ 0.8/σ²（解析 peak = (σ²/48²)/Σ|ψ|²，6px 裙边
     质量保留 60–82% 随 σ 而变）；呼吸收缩实测极值 ≈ 2/σ²（σ=8..16
     CDP 扫描一致），故按 2/σ² 取，覆盖已观测到的动力学峰值，供引擎
     子步自适应兜底（dt_sub·E ≤ 1.5）。吸引侧 g>0 塌缩峰值无界
     （网格截断奇性，见头部约定），本项只覆盖排斥/束缚侧。 */
  eMaxExtra(state){
    return Math.abs(state.g) * 2/(state.sigma*state.sigma);
  }

  applyParams(qp, state){
    const g = parseFloat(qp.get('g'));
    if (!isNaN(g)) state.g = Math.max(-150, Math.min(300, g));
  }

  /* 双阱势重画（扫描器切网格 / 形状下拉共用） */
  paintDW(paint){ drawDW(paint); }

  /* R65 双势阱：线性谱（对称/反对称本征态的能量分裂 ΔE）。
     与弹球共用引擎层求解器（同一离散口径、同一 shift-invert）。 */
  spectrum(opts){
    const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    const r = linearSpectrum({ n: opts.grid || 256, m: opts.m, V: opts.V,
                               vCut: opts.vCut, nev: opts.nev || 4, eps: opts.eps || 1e-3 });
    const ms = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0;
    return Object.assign(r, { ms });
  }

  presets(){
    const self = this;
    /* 谐波阱 V(r) = (r/48)²：径向渐变，每 4 世界 px 一个色标
       （色标过疏会让 V 纹理出现折点、局部梯度跳变；4px 在视觉平滑与

    const trap = (paint) => {

                  build(paint){ self._mode = 'tf'; trap(paint); }, wave:[0.5,0.5,0,0], params:{ g:-10, sigma:16 } },
      vortex:  { name:'量子化涡旋',   text:'TF 云中植入单量子化涡旋：密度空心（愈合层 ~4px ≈ ξ）+ 相位绕核一周（色相 wheel）。相位奇点处 |ψ|→0 是 BEC 的基本拓扑缺陷，阱中涡旋心部受拓扑保护不消失；云整体仍参与集体呼吸。',
                  build(paint){ self._mode = 'vortex'; trap(paint); }, wave:[0.5,0.5,0,0], params:{ g:-10, sigma:16 } },
      tof:     { name:'时飞行膨胀',   text:'时飞行（TOF）：瞬间撤去势阱，平均场排斥能转化为动能——云自由膨胀、峰值下降、动能上升。实验 TOF 成像正是据此反推阱中密度分布。',
                  build(paint){ self._mode = 'tf'; }, wave:[0.5,0.5,0,0], params:{ g:-10, sigma:16 } },
      breather:{ name:'集体呼吸模',   text:'强过压缩初态（R=10，峰值约为默认云 3.4×）释放后云大幅膨胀再回缩：实测峰值摆动 ×9.4–10（最低 ×0.15）、周期 ~107 sim-time，无耗散下长时不衰减——BEC 集体激发的大振幅演示，区别于单粒子薛定谔的量子化能级。',
                  build(paint){ self._mode = 'tf'; trap(paint); }, wave:[0.5,0.5,0,0], params:{ g:-10, sigma:10 } },
      dw:      { name:'双势阱（Josephson）', text:'两个抛物阱（阱心相距 14px、阱宽 48px、中央垒高 ≈0.021）中的 BEC。初态是两个高斯叠加：左/右阱幅度 √((1±z₀)/2)、右阱带相对相位 φ₀ —— 直接给定初始粒子数差 z₀ 与相位差 φ₀。**Josephson 振荡**：g 小时粒子数差在两阱间来回振荡（z(t)=z₀cos(Ωt)，Ω=双阱对称/反对称本征态的能量分裂 ΔE）；**宏观量子自囚禁**：相互作用足够强（Λ=N·U/2K>1）且初始不平衡足够大时，粒子数差不再过零，云被锁在一侧。面板实时显示 z(t)，扫描器逐点扫 g 给出自囚禁阈值。注意：两高斯初态不是双阱的精确基态组合，会额外激发阱内呼吸模（z(t) 上的高频小抖动）。',
                  build(paint){ self._mode = 'dw'; drawDW(paint); }, wave:[0.5,0.5,0,0],
                  params:{ g:-10, sigma:6, dwZ0:0.6, dwPhi:0 } },
      gs:      { name:'基态（虚时间弛豫）', text:'虚时间流 ∂ψ/∂τ = −(H−μ)ψ 收敛到离散哈密顿量的精确基态（Hψ=μψ）：集体呼吸模被弛豫掉，云半径与密度峰在实时间演化中保持平稳（实测 200 帧窗 Rrms 呼吸 0.36%、密度峰呼吸 0.54%，对比 TF 穹顶初态的 60%）。基态由 g 唯一确定——σ 只作弛豫起点（任意起点收敛到同一基态：σ=16 与 σ=R_TF 起点结果逐位一致），故拖动 σ 对稳态无影响。半径对账：√3·Rrms≈12.7 比 TF 公式 R_TF≈11.0 大 15.6%——有限耦合下 TF 近似的真实系统误差（g=−10 时 R_TF/ξ≈2.5，仅中间区），随 |g| 增大收敛到 TF 渐线（g=−40 时 +5.2%）。g≥0（吸引侧）无稳定基态（2D L² 临界塌缩），此时退回穹顶初态。弛豫成本 ~0.7s（τ=1、<250 步），仅在预设切换/重置时执行一次。',
                  build(paint){ self._mode = 'gs'; trap(paint); }, wave:[0.5,0.5,0,0], params:{ g:-10, sigma:11 } },
    };
  }
}

registerKernel(new GPKernel());

/* ===== src/physics/pauli.js ===== */
/* ============================================================================
 * Pauli 自旋内核（spin-1/2）：iℏ∂ψ/∂t = [−ℏ²/2m ∇² + V − (qℏ/2m)·σ·B]·ψ
 *
 * 波函数为二分量旋量 ψ = (ψ₁, ψ₂)（pairs=2，RGBA32F：xy=↑ 分量、zw=↓ 分量）。
 * 这是本引擎第一个多复分量内核——验证 PhysicsKernel 契约对自旋族的支持。
 *
 * 物理模型（诚实声明适用范围）：
 *   哈密顿 H = −uK·∇² + V·I − uK·(σ·B)，uK = 1/2m（引擎 uniform），
 *   塞曼耦合强度取 q=1（即 uB = q/2m = uK；q 固定，质量 m 经滑块调节）。
 *   **只含自旋（塞曼）耦合，不含轨道耦合 (p−qA)²/2m**——对应「中性粒子
 *   （如中子）的磁矩」图像：无电荷即无轨道耦合，塞曼项是全部电磁作用。
 *   均匀 B 下的轨道 Landau 量子化需要拉普拉斯项的 link 相位扩展
 *   （引擎级改动），不在本内核范围——如实标注为已知限制。
 *
 * 磁场（uniform 分量 + x 向梯度，斯特恩-盖拉赫用）：
 *   B(x,y) = (bX, bY, bZ + bGrad·(x−½))，x 为归一化世界坐标 ∈[0,1]
 *   （与 AB 螺线管位置、行波驱动、势场画笔同一坐标系）；bGrad 即全域
 *   Bz 变化量（bZ=0 时屏幕左半 Bz<0、右半 Bz>0）。
 *   梯度只加在 Bz 的 x 向上：σz 本征态受恒力 F_x = ±uK·∂Bz/∂x = ±uK·g，
 *   自旋沿 x 的波包分裂为 ↑/↓ 两束（SG 图像）。
 *
 * 【位移公式的量纲诚实声明】引擎拉普拉斯为 texel 间距 5 点 stencil
 *   （h=1/grid），归一化坐标下 H_kin=−uK·h²·∂²_x ⟹ 有效质量
 *   m_eff = m·grid²（格点单位下 H=−(1/2m)∂²_X，m 即滑块质量）。
 *   故每分量半位移（格点）：
 *     ΔX = ½·(uK·g/m_eff)·t²·grid = uK²·g·t²/(m·grid)   （m=1, grid=256:
 *     ΔX = g·t²/1024；g=0.016 时 t=1080（60fps·15s）→ 每束 18 格）
 *   CDP 实证（R30）：g=0.016 下 ΔX 实测与理论偏差 <1%（t² 律比值 5.86 vs
 *   5.85），自旋转相同步符合 ⟨σx⟩=cos(2·uK·Bz_local·t)。
 *
 * σ·B 的实线性 4×4 作用（列布局 c = (x₁,y₁,x₂,y₂)，ψ₁=x₁+iy₁, ψ₂=x₂+iy₂）：
 *   (σ·B·ψ)₁ = Bz·ψ₁ + (Bx−iBy)·ψ₂
 *   (σ·B·ψ)₂ = (Bx+iBy)·ψ₁ − Bz·ψ₂
 *   ⟹ M 对称（厄米）⟹ 精确流严格守恒 P；KDK 分裂与标量内核同构
 *      （模板实现一阶系统 w' = J·M·w，localH 给 M·c 全通道积）。
 *      【R32 量化 → R33 修复】KDK 的数值守恒仅对 (u|v) 分裂下的**偶**
 *      算符成立：σ_x/σ_z（纯 B_x/B_z）⟹ 两个 2×2 Verlet 块、ρ=1 精确；
 *      σ_y 为**奇**算符（u|v 互换）⟹ kick 自耦合 ⟹ ρ=√(1+φ²)>1
 *      （φ=dt_sub·uK·|B_y|）——慢指数漂移：默认 tilted 预设（|B|=0.02）
 *      实测 +0.122%/900 帧、B_y=0.05 滑块上限 +9.85%/900 帧（R32，numpy
 *      全算符与 CDP 互证）。本内核 R33 起切 CN（integrator='cn'）：Cayley
 *      矩阵严格正交 ⟹ 无条件稳定，σ_y 漂移根治——CDP 复测（9×manualPass
 *      (1800)=1620 sim-time）：tilted+By=0.05 从 KDK 的 +9.941% 降至
 *      −0.0099%（同跨度下 KDK 线性外推 ~+15%，>1500× 改善）。残差 0.01–
 *      0.15% 为 RGBA32F 纹理 float32 舍入积累（算法层 numpy float64 复刻
 *      实测 6.4e-13/16200 子步，Jacobi 截断可忽略——平滑波包高频内容指数
 *      衰减），无系统偏向、交互时标下不可见（详见 worklog R33 与 kernel.js
 *      CN 约定节）。σ·B 局部块闭式解见 shaders().cnLocalSolve。
 *
 * 自旋态布洛赫球约定：|ψ⟩ = cos(θ/2)|↑⟩ + e^{iφ}·sin(θ/2)|↓⟩
 *   θ=0 → ↑（⟨σz⟩=+1）；θ=π/2,φ=0 → +x（⟨σx⟩=+1）；φ 控制赤道面方位。
 *
 * 招牌预设：
 *   larmor          均匀 Bz，自旋→x，kx=0：⟨σ⟩ 绕 z 进动
 *                   ω = 2·uK·Bz = Bz/m（空间/自旋解耦，进动与波包扩散无关）
 *   stern-gerlach   Bz 的 x 向梯度，自旋→x：波包分裂为 ↑/↓ 两束
 *                   （每束半位移 uK²·g·t²/(m·grid)，60fps 下 ~15s 可见分离；
 *                   Bx=By=0 ⟹ 无自旋混合，两束保持纯 ↑/↓ 蓝/橙分色）
 *   tilted          B ∥ (1,1,1)，自旋→z：⟨σ⟩ 绕斜轴锥形进动
 *                   ⟨σz⟩ = ⅓ + ⅔·cos(ωt)（ω = 2·uK·|B|）——可检验签名
 *   free            B=0：自旋态冻结（|⟨σ⟩|=1 恒定），透射率扫描面板可见
 *                   （B=0 时 V 自旋无关，透射率与薛定谔内核逐字一致）
 * ========================================================================== */

class PauliKernel extends PhysicsKernel {
  constructor(){
    super();
    this.id = 'pauli';
    this.name = 'Pauli 自旋';
    this.equation = '<b>PAULI SPIN-1/2</b> · <i>i</i>ℏ ∂ψ/∂t = [−ℏ²/2m ∇² + V − (<i>q</i>ℏ/2m)·σ·B]·ψ';
    this.pairs = 2;
    /* 自旋读数能力标志：引擎据此显示 HUD 自旋区（⟨σx⟩/⟨σy⟩/⟨σz⟩/|⟨σ⟩|）
       与调试句柄 spin。约定：内核提供 spinRead(rawSum) → {sx,sy,sz,len}，
       rawSum 由引擎 spinSum() 从 psiA 纹理直读（纯测量、无物理公式）。 */
    this.spinReadout = true;
    /* R33：切 CN 积分器。KDK 对 σ_y（(u|v) 分裂下的**奇**算符）结构性失效——
       谱半径 ρ=√(1+φ²)>1（φ=dt_sub·uK·|B_y|），慢指数漂移（R32 量化：
       默认 tilted +0.122%/900 帧、B_y=0.05 上限 +9.85%/900 帧）。CN 的
       Cayley 矩阵严格正交 ⟹ 无条件稳定，σ_y 漂移根治（CDP 复测：+9.941%
       → −0.0099%@1620 sim-time；算法层 numpy 复刻 6.4e-13/16200 子步，
       GPU 残差为 float32 纹理舍入 ~0.1% 量级，无系统偏向）；
       σ·B 局部块经 shaders().cnLocalSolve 注入（见下）。代价 ~4.3× GPU
       （13 pass/子步 vs KDK 3）——正确性优先。 */
    this.integrator = 'cn';
  }

  /* 初始旋量波包：高斯包络 × 布洛赫自旋态（θ/φ 经引擎从 state 透传）。
     引擎负责归一化与等份叠加；θ/φ 滑块变更时重发波包即时可见。 */
  makeWave(grid, p){
    const th = p.spinTheta === undefined ? Math.PI/2 : p.spinTheta;
    const ph = p.spinPhi === undefined ? 0 : p.spinPhi;
    const up = Math.cos(th/2), dn = Math.sin(th/2);   /* |↑⟩,|↓⟩ 振幅（up²+dn²=1） */
    const cx = p.fx*grid, cy = p.fy*grid;
    const data = new Float32Array(grid*grid*4);
    let sum = 0;
    for (let y=0; y<grid; y++){
      for (let x=0; x<grid; x++){
        const dx = x-cx, dy = y-cy;
        const env = Math.exp(-(dx*dx+dy*dy)/(2*p.sigma*p.sigma));
        const pk = p.kx*dx + p.ky*dy;                  /* 动量平面波相位（两分量同） */
        const i = (y*grid+x)*4;
        const c = Math.cos(pk), s = Math.sin(pk);
        data[i]   = up*env*c;  data[i+1] = up*env*s;   /* ψ₁ = cos(θ/2)·env·e^{ikr} */
        data[i+2] = dn*env*Math.cos(pk+ph);            /* ψ₂ = e^{iφ}·sin(θ/2)·env·e^{ikr} */
        data[i+3] = dn*env*Math.sin(pk+ph);
        sum += env*env;                                /* up²+dn²=1 ⟹ Σ|ψ|²=Σenv² */
      }
    }
    return { data, sum };
  }

  defaults(){
    return { bX: 0, bY: 0, bZ: 0.02, bGrad: 0,
             spinTheta: Math.PI/2, spinPhi: 0 };
  }

  shaders(){
    return {
      /* 内核私有 uniform + 共用 helper（uniforms 串注入三个模板的全局区，
         函数声明合法；未被引用的 helper 在对应 program 中无副作用）：
         - pauliSigmaB：σ·B 的实线性 4×4 作用（localH 用）
         - pauliPixel：像素着色（display 用；hsv 内核与 TPL_DISPLAY 的
           hsv2rgb 逐字同式——因注入顺序在本段之后才定义 hsv2rgb，故自包含
           重写两行，避免前向声明依赖） */
      uniforms:
        'uniform vec4 uB;   /* 磁场 (Bx, By, Bz, dBz/dx) */\n' +
        'vec4 pauliSigmaB(vec4 c, float Bz){\n' +
        '  return vec4( Bz*c.x + uB.x*c.z + uB.y*c.w,\n' +
        '               Bz*c.y - uB.y*c.z + uB.x*c.w,\n' +
        '               uB.x*c.x - uB.y*c.y - Bz*c.z,\n' +
        '               uB.y*c.x + uB.x*c.y - Bz*c.w );\n' +
        '}\n' +
        'vec3 pauliPixel(vec4 psi, float p){\n' +
        '  vec2 ph = dot(psi.xy,psi.xy) >= dot(psi.zw,psi.zw) ? psi.xy : psi.zw;\n' +
        '  float sz = p > 1e-9 ? (dot(psi.xy,psi.xy)-dot(psi.zw,psi.zw))/p : 0.0;\n' +
        '  float h = atan(ph.y,ph.x)/6.2831853 + 0.5;\n' +
        '  vec3 rgb = clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);\n' +
        '  rgb = rgb*rgb*(3.0-2.0*rgb);\n' +
        '  vec3 hue = mix(vec3(1.0), rgb, 0.80);\n' +
        '  return mix(hue, mix(vec3(1.0,0.45,0.15), vec3(0.30,0.60,1.0), 0.5*(sz+1.0)), 0.55);\n' +
        '}',
      /* H·c 局部部分 = V·c − uK·(σ·B)·c（uK=q/2m 由引擎注入，q=1）。
         Bz 含 x 向梯度：Bz(x) = uB.z + uB.w·(x−½)，x 取 texel 世界坐标 vUv.x。
         4 通道积即 M·c——KDK 模板的一阶系统 w'=J·M·w 对任意实线性 M 成立
         （含 σ_y 耦合，无需引擎模板改动）。 */
      localH: 'V*c - uK*pauliSigmaB(c, uB.z + uB.w*(vUv.x - 0.5))',
      /* CN 局部块 (I−h·Gloc)⁻¹ 闭式解（TPL_CN_SWEEP 的 {{CN_LOCAL_SOLVE}} 注入点）。
         M_loc = V·I − uK·σ·B（2×2 厄米）⟹ 引擎 CN 约定的局部解为 (I+i·h·M_loc)⁻¹：
         记 A=1+ihV、c=h·uK·|B|、n=B/|B|，(n·σ)²=I ⟹
         (A·I − i·c·nσ)⁻¹ = (A·I + i·c·nσ)/(A²+c²)，
         其中 i·c·(nσ)·arg = i·h·uK·(σ·B)·arg（复用 pauliSigmaB——c·n=h·uK·B），
         A·arg 为标量 (1+ihV) 逐通道相乘，分母 A²+c²=(1+c²−h²V²)+i·2hV 做复除。
         B=0 时退化为 arg/(1+ihV)（纯势 Cayley 相位移，与 Dirac 的 V 块同构）；
         局部部分严格保范（Cayley 酉性）⟹ σ_y 奇耦合的 KDK 慢指数漂移
         （R32 量化的 ρ=√(1+φ²)）由此根治。Bz 含 x 向梯度，逐 texel 取值。 */
      cnLocalSolve:
        'vec4 cnLocalSolve(vec4 arg, float V){\n' +
        '  float h = uDtHalf;\n' +
        '  float Bz = uB.z + uB.w*(vUv.x - 0.5);\n' +
        '  vec4 t = pauliSigmaB(arg, Bz);            /* (σ·B)·arg */\n' +
        '  vec4 a = vec4(arg.x - h*V*arg.y, arg.y + h*V*arg.x,\n' +
        '                arg.z - h*V*arg.w, arg.w + h*V*arg.z);   /* A·arg */\n' +
        '  vec4 s = vec4(a.x - h*uK*t.y, a.y + h*uK*t.x,\n' +
        '                a.z - h*uK*t.w, a.w + h*uK*t.z);         /* A·arg + i·h·uK·(σ·B)·arg */\n' +
        '  float c2 = h*h*uK*uK*(uB.x*uB.x + uB.y*uB.y + Bz*Bz);\n' +
        '  float dr = 1.0 + c2 - h*h*V*V, di = 2.0*h*V;           /* A²+c² */\n' +
        '  float inv = 1.0/(dr*dr + di*di);\n' +
        '  return vec4((s.x*dr + s.y*di)*inv, (s.y*dr - s.x*di)*inv,\n' +
        '              (s.z*dr + s.w*di)*inv, (s.w*dr - s.z*di)*inv);\n' +
        '}',
      /* |ψ|² = |ψ₁|²+|ψ₂|²（RGBA32F 四通道全参与） */
      density: 'dot(psi.xy,psi.xy) + dot(psi.zw,psi.zw)',
      /* 动能：两分量拉普拉斯之和（vec4 点积天然覆盖 xy+zw） */
      kinetic: '0.25*(dot(dxp,dxp)+dot(dyp,dyp))',
      /* 势能密度含塞曼自旋能：−uK·⟨ψ|σ·B|ψ⟩（否则 HUD 的 E=⟨T⟩+⟨V⟩
         漏掉自旋项，均匀场下看起来不守恒——把塞曼能并入 ⟨V⟩ 后 E 为
         真实守恒量）。⟨σ·B⟩密度 = Bz·(p₁−p₂) + 2(Bx·Re ψ₁*ψ₂ + By·Im ψ₁*ψ₂)，
         Bz 取该 texel 世界坐标 x（reduce 循环内变量，非 vUv——reduce 的
         vUv 是 32² 归约目标坐标，勿混用）。 */
      potential:
        'V*p - uK*((uB.z + uB.w*(x - 0.5))*(dot(psi.xy,psi.xy) - dot(psi.zw,psi.zw))\n' +
        '          + 2.0*(uB.x*(psi.x*psi.z + psi.y*psi.w) + uB.y*(psi.x*psi.w - psi.y*psi.z)))',
      /* 像素着色：色相 = 优势分量相位；自旋倾向着色——σz>0（偏↑）蓝、
         σz<0（偏↓）橙，与相位色相 55% 混合（SG 分裂后两束蓝/橙分明） */
      pixelColor: 'pauliPixel(psi, p)',
    };
  }

  /* 面板附加控件：磁场三分量 + Bz 梯度 + 自旋极角/方位角。
     引擎注入两个行为回调：
       reinit         —— 自旋角属初相，变更后按新布洛赫方向重发波包；
       refreshParamHud —— B 场滑块变更即时刷新 HUD 磁场行（参数派生读数）。
     磁场 uniform 每帧从 state 读取，演化本身无需重发。 */
  extraControls(reinit, refreshParamHud){
    return {
      html:
        '<div class="row"><label>磁场 B_x</label><input type="range" id="rBX" min="-0.05" max="0.05" step="0.001" value="0"><output id="oBX">0.000</output></div>' +
        '<div class="row"><label>磁场 B_y</label><input type="range" id="rBY" min="-0.05" max="0.05" step="0.001" value="0"><output id="oBY">0.000</output></div>' +
        '<div class="row"><label>磁场 B_z</label><input type="range" id="rBZ" min="-0.05" max="0.05" step="0.001" value="0.02"><output id="oBZ">0.020</output></div>' +
        '<div class="row"><label>B_z 梯度 g</label><input type="range" id="rBGrad" min="0" max="0.05" step="0.001" value="0.016"><output id="oBGrad">0.0160</output></div>' +
        '<div class="row"><label>自旋极角 θ</label><input type="range" id="rSpinT" min="0" max="3.1416" step="0.01" value="1.5708"><output id="oSpinT">1.57</output></div>' +
        '<div class="row"><label>自旋方位角 φ</label><input type="range" id="rSpinP" min="-3.1416" max="3.1416" step="0.01" value="0"><output id="oSpinP">0.00</output></div>',
      rows: [
        { id:'#rBX',    out:'#oBX',    key:'bX',        fmt: v => v.toFixed(3), after: refreshParamHud },
        { id:'#rBY',    out:'#oBY',    key:'bY',        fmt: v => v.toFixed(3), after: refreshParamHud },
        { id:'#rBZ',    out:'#oBZ',    key:'bZ',        fmt: v => v.toFixed(3), after: refreshParamHud },
        { id:'#rBGrad', out:'#oBGrad', key:'bGrad',     fmt: v => v.toFixed(4), after: refreshParamHud },
        { id:'#rSpinT', out:'#oSpinT', key:'spinTheta', fmt: v => v.toFixed(2), after: reinit },
        { id:'#rSpinP', out:'#oSpinP', key:'spinPhi',   fmt: v => v.toFixed(2), after: reinit },
      ],
    };
  }

  setUniforms(gl, prog, state){
    const loc = gl.getUniformLocation(prog, 'uB');
    if (loc) gl.uniform4f(loc, state.bX, state.bY, state.bZ, state.bGrad);
  }

  /* 稳定性附加项：塞曼算符谱半径 uK·|B|max（|B|max 取梯度两端与均匀分量的
     最大模；拉普拉斯 uK·8 与 V∈[−1,1] 已由引擎基线覆盖）。 */
  eMaxExtra(state){
    const g = Math.abs(state.bGrad);
    const bzMax = Math.max(Math.abs(state.bZ + 0.5*g), Math.abs(state.bZ - 0.5*g));
    return (0.5/state.m) * Math.hypot(state.bX, state.bY, bzMax);
  }

  applyParams(qp, state){
    const f = (k, lo, hi) => { const v = parseFloat(qp.get(k)); if (!isNaN(v)) state[k] = Math.max(lo, Math.min(hi, v)); };
    f('bX', -0.05, 0.05); f('bY', -0.05, 0.05); f('bZ', -0.05, 0.05);
    f('bGrad', 0, 0.05); f('spinTheta', 0, Math.PI); f('spinPhi', -Math.PI, Math.PI);
    /* R71 Berry 循环参数（引擎级 state，供 CDP/URL 直设）：
       ?berryTheta=&berryOmega=&berryB0= —— 上下界与面板滑块一致。 */
    f('berryTheta', 0.05, Math.PI); f('berryOmega', 0.002, 0.02); f('berryB0', 0.01, 0.05);
  }

  /* 自旋读数（引擎 spinSum 原始求和 → 布洛赫向量）。
     rawSum = { re12: ΣRe(ψ₁*ψ₂), im12: ΣIm(ψ₁*ψ₂), n1: Σ|ψ₁|², n2: Σ|ψ₂|², P }。
     ⟨σx⟩=2Re(ψ₁*ψ₂)/P, ⟨σy⟩=2Im(ψ₁*ψ₂)/P, ⟨σz⟩=(n1−n2)/P（ℏ=1，σ 本征值 ±1）。 */
  spinRead(s){
    const P = Math.max(s.P, 1e-30);
    const sx = 2*s.re12/P, sy = 2*s.im12/P, sz = (s.n1 - s.n2)/P;
    return { sx, sy, sz, len: Math.hypot(sx, sy, sz) };
  }

  /* CPU 密度（调试/测量句柄用）：双分量求和 */
  cpuDensity(buf, i){ return buf[i]*buf[i] + buf[i+1]*buf[i+1] + buf[i+2]*buf[i+2] + buf[i+3]*buf[i+3]; }

  /* 矩势垒透射模型：仅 B=0 时提供（V 自旋无关 ⟹ 两分量独立演化、透射率与
     薛定谔内核逐字一致；B≠0 时自旋-空间耦合，无简单线性透射公式，返回
     null —— 引擎据此隐藏扫描面板，诚实标注）。 */
  transmissionModel(state){
    if (state.bX !== 0 || state.bY !== 0 || state.bZ !== 0 || state.bGrad !== 0) return null;
    return rectangularBarrierModel(state.m);
  }

  /* R71 Berry 相位（绝热循环）：本内核的 uB uniform **每帧从 state.bX/bY/bZ
     读取**（setUniforms），故 Berry 循环可以让引擎逐帧覆写这三个分量而零
     新 shader（B(t)=B₀(sinθ cosφ, sinθ sinφ, cosθ)、φ=ωt）——这是把几何
     相位做进面板的关键：无需引擎或模板改动。约束：Berry 面板要求 bGrad=0
     （有梯度则不同 x 走不同大小的锥，相位被平均掉），循环期间强制归零、
     结束恢复。σ·B 的局部 Cayley 闭式（cnLocalSolve）对任意方向的 B 成立，
     故锥面路径上的 CN 演化与静态均匀场同一精度。 */
  presets(){
    return {
      larmor: { name:'拉莫尔进动', text:'自旋沿 +x 的波包置于均匀磁场 B_z 中：自旋（布洛赫向量）绕磁场轴进动，频率 ω = qB/m（ℏ=1，q=1）——B_z=0.02、m=1 时周期 ≈ 314 模拟时间 ≈ 4.4 秒。波包取 k=0 静止：空间与自旋解耦（均匀场、无势），进动不受波包扩散干扰。HUD 自旋区实时显示 ⟨σ_x⟩=cos(ωt)、⟨σ_y⟩=−sin(ωt)、⟨σ_z⟩=0，|⟨σ⟩|=1 严格守恒。拖动 B_z 滑块可连续改变进动频率（含反向）。',
                build(){}, wave:[0.5,0.5,0,0],
                params:{ bX:0, bY:0, bZ:0.02, bGrad:0, spinTheta:Math.PI/2, spinPhi:0, sigma:7 } },
      'stern-gerlach': { name:'斯特恩-盖拉赫', text:'磁场 B_z 沿 x 方向线性梯度（g=∂B_z/∂x，全域变化量）：自旋沿 +x 的波包中，↑ 分量受恒力 +uK·g、↓ 分量受 −uK·g——波包分裂为两束，各自偏转相反方向。这正是斯特恩-盖拉赫实验：不均匀磁场把自旋叠加态分解为空间可分的两束（蓝色=↑ / 橙色=↓）。每束半位移 uK²·g·t²/(m·grid)（格点；m_eff=m·grid²，因拉普拉斯为 texel 间距 stencil）——g=0.016 时 60fps 下 ~15s 分离约 2σ，调大 g 滑块可加速。Bx=By=0 ⟹ 无横向场、自旋不混合：两束始终保持纯 ↑/↓（蓝/橙分色）；总 ⟨σ⟩ 随两束空间重叠衰减（SG 即自旋-空间纠缠的产生过程），B_z(x) 的空域变化即偏转力本身。',
                build(){}, wave:[0.32,0.5,0,0],
                params:{ bX:0, bY:0, bZ:0, bGrad:0.016, spinTheta:Math.PI/2, spinPhi:0, sigma:18 } },
      tilted: { name:'斜场进动', text:'磁场沿 (1,1,1) 方向（|B|=0.02），自旋初态沿 +z：布洛赫向量绕斜轴做锥形进动（半锥角即 z 与 B 的夹角 54.7°）。可检验签名：⟨σ_z⟩ = ⅓ + ⅔·cos(ωt)（在 1 与 −⅓ 间振荡），⟨σ_x⟩、⟨σ_y⟩ 同频振荡，|⟨σ⟩|=1 恒定。波包以 k=0.05 漂移，演示「边飞边转」。',
                build(){}, wave:[0.3,0.5,0.05,0],
                params:{ bX:0.0115, bY:0.0115, bZ:0.0115, bGrad:0, spinTheta:0, spinPhi:0, sigma:7 } },
      free: { name:'自由自旋波包', text:'B=0：自旋态冻结（无进动、无受力），波包自由飞行并扩散，⟨σ⟩ 保持初值（|⟨σ⟩|=1）。作为自旋动力学的对照组；此时透射率扫描面板可用——V 自旋无关，势垒透射率与薛定谔内核逐字一致（透射率扫描工具可直查）。',
                build(){}, wave:[0.18,0.5,0.09,0],
                params:{ bX:0, bY:0, bZ:0, bGrad:0, spinTheta:Math.PI/2, spinPhi:0, sigma:7 } },
    };
  }
}

/* ============================================================================
 * Dirac 方程内核（2+1 维）：iℏ ∂ψ/∂t = [α_x·p_x + α_y·p_y + β·m + V]·ψ
 *
 * 波函数为双复分量旋量 ψ=(ψ₁,ψ₂)（pairs=2，RGBA32F：xy=ψ₁、zw=ψ₂）——
 * 与 Pauli 同一纹理布局，但矩阵代数从 σ·B（宇称偶、二阶算符背景）升级为
 * 完整的 Clifford 代数 {α_x,α_y,β}=0、α²=β²=1（一阶方程）。
 *
 * 【表象与实形化】取手征（Weyl）表象 2×2 复矩阵：
 *   β = diag(1,−1)，α_x = σ_x = [[0,1],[1,0]]，α_y = σ_y = [[0,−i],[i,0]]
 *   （α_x、β 实对称，α_y 纯虚对称；三者实线性、两两反对易。）
 * 引擎按 4 实分量布局 c=(x₁,y₁,x₂,y₂)（ψ₁=x₁+iy₁, ψ₂=x₂+iy₂）工作，
 * 实形化后三个矩阵均为 4×4 **实对称**矩阵：
 *   α_x·C = (c.z, c.w, c.x, c.y)             （交换两复分量，即 σ_x 块）
 *   α_y·C = (c.w, −c.z, −c.y, c.x)           （−iψ₂ = y₂−ix₂、iψ₁ = −y₁+ix₁）
 *   β ·C = (c.x, c.y, −c.z, −c.w)
 * ⟹ H_D = α·p + βm + V 为**实线性厄米**算符（α、β、V 实，唯一复源是常数 −i
 * 藏在 p=−i∇ 里）⟹ 总概率严格守恒。
 *
 * 【积分器：CN + block-Jacobi——引擎 KDK 对本内核结构性失效（#33 最重要一条）】
 * 一阶方程 i∂_tψ=Hψ 拆实形 ψ=u+iv 得 w'=J·M·w（引擎交错布局）。薛定谔的
 * M=diag(H,H) 通道对齐 ⟹ KDK 的 kick/drift 两通道投影可分解为逐模态 2×2
 * 旋转，|λ|=1 精确。**Dirac 的 M 混合通道**（α·p 把 ψ₂ 的导数耦合进 ψ₁
 * 的方程）⟹ 本征基非通道对齐，kick/drift 的通道投影剪切不可交换——KDK
 * 映射谱半径实测 ρ=1.0216（1D、dt_sub=0.2、m=1；平面波 400 步放大 1.97e4，
 * dt_sub 扫描 0.05→1.0014 … 1.2→1.6922），与符号/边界细节无关，是结构性
 * 失效（Pauli 的常数 σ·B 是同族但更轻的缺陷：σ_x/σ_z 在 (u|v) 分裂下为
 * 偶算符 ⟹ ρ=1 精确稳定；σ_y 为奇算符（u|v 互换）⟹ kick 自耦合 ⟹
 * ρ=√(1+φ²)（φ=dt_sub·uK·|B_y|）——R32 量化闭环：默认 tilted 预设
 * +0.122%/900 帧、B_y=0.05 滑块上限 +9.85%/900 帧；**R33 起 Pauli 已切
 * CN 路径**（本内核同款 CN_LOCAL_SOLVE 泛化注入，Pauli 侧注入 σ·B 的
 * Cayley 4×4 闭式），该缺陷根治：CDP 复测 tilted+By=0.05 同跨度
 * +9.941%→−0.0099%（详见 pauli.js 头注 R33 段）。
 * ⟹ 本内核走引擎 CN 路径（integrator='cn'）：
 *   (I−h·G)w_{n+1} = (I+h·G)w_n，h=dt_sub/2，G=−J·M 斜对称（M 对称）
 *   ⟹ Cayley 矩阵严格正交：范数机器精度守恒、无条件稳定（无 dt·E_max 极限）。
 *   GPU 求解 = block-Jacobi：对角 2×2 块（βm+V 局部）闭式求逆 + α·p 导数
 *   耦合迭代 x ← (I−h·Gloc)⁻¹(rhs + h·Gkin·x)，12 次扫掠收敛到 ~1e-9
 *   （收缩比 ~0.18/迭代，理论上界 h√2）。时间域验证（klein_td4.py，numpy
 *   同算法）：300 步范数守恒 2e-9、质心=格点群速、连续性方程成立。
 *   引擎交错布局 G=−J·M 的通道排布 ((Mw).y, −(Mw).x, (Mw).w, −(Mw).z)：
 *   α_x p_x 对 u 的作用纯进虚槽（−i·∂_x u 再交换分量）：(Hv)₁ −= ∂_xv₂ …
 *   逐通道展开（记 dxv=½(ψ(x+h)−ψ(x−h)) 为 4 通道 x 向中心差分）：
 *     Hc.x =  dxv.w − dyv.z          （α_x v_x + α_y v_y 的通道 1）
 *     Hc.y = −dxv.z − dyv.w
 *     Hc.z =  dxv.y + dyv.x
 *     Hc.w = −dxv.x + dyv.y          ← w 分量 +Dy(y)：曾误写 −Dy(y)（破坏 M
 *                                   对称性，KDK/CN 双路径受累）；三重验证：
 *                                   复形展开 / 分块对称 / 交换子（R31 记录）
 *   即 −i·α·∂ψ = (∂_xψ₂^I − ∂_yψ₂^R, −∂_xψ₂^R − ∂_yψ₂^I,
 *                 ∂_xψ₁^I + ∂_yψ₁^R, −∂_xψ₁^R − ∂_yψ₁^I)。
 *   局部部分（βm+V，LOCAL_H）：

 *
 * 【离散色散】中心差分 ∂→i·sin k ⟹ 平面波本征关系
 *   H(k)·u = ±√(sin²k_x+sin²k_y+m²)·u， E±(k)=±√(sin²k_x+sin²k_y+m²)
 * 谱半径 ≤ √2 + m + |V|（每轴 |sin k|≤1）⟹ eMaxExtra 补足引擎基线
 * 4/m+1（拉普拉斯路径，Dirac 不用）与 √2+m+1 的差：max(0, √2+m−4/m)
 * ——m 大时基线反而不够（m=4 时 4/m+1=2 < √2+m+1=6.41）。
 *
 * 【正能旋量初态】离散精确正能平面波（E=√(sin²k+m²)）：

 * 负能成分引发 zitterbewegung（颤振）：分量概率以 ~2E≈2m 的频率振荡。
 * 这正是 zitter 预设的展示对象——不是数值误差，是 Dirac 方程的物理内容
 * （连续极限的标准结果；离散格点上频率为 2√(sin²k+m²)）。
 *
 * 【Klein 佯谬与矩势垒透射——格点色散口径】连续解析解（一阶方程界面
 *   ψ 连续即可，无需导数匹配）给出 q·a=nπ 处**精确共振全透射 T=1**，但那是
 *   k,q→0 极限；格点（|sin k|≤1、每区 4 模态含 Nyquist 别名对）的精确解
 *   由 transmissionModel 的 latticeT 给出（界面匹配 8 方程最小二乘，
 *   T+R=1、全场残差 1e-15）。实测对照（m=0.3、k=0.3、V0=0.95）：
 *     a=16：T_latt=0.166（T_cont=0.337）——薄垒连续公式高估一倍
 *     a=14：T_latt=0.995（T_cont=0.858）——格点色散把共振条件修对了
 *           （q_latt·a=6.31≈2π，连续 q·a=6.10 偏 2.9%）
 *   Klein 签名仍在：T 不随 a 指数衰减（同参数薛定谔 ≈e^(−2κa)≈1e-10），
 *   宽坝 T 振荡周期 2π/q_latt≈13.9 格（格点 a 扫描的峰结构）。

 *   ±3%（分区/link 流双测量互证；入射流积分=v_g·P0；连续性方程成立）——
 *   模拟与格点精确解一致，连续公式的偏离是色散离散的物理而非数值缺陷。
 *
 * 【能密度口径】动能（reduce，KIN_SCALE=1.0——α·p 动能无 1/2m 因子）：
 *   E_x = ½(u₁∂_xv₂ − v₁∂_xu₂ + u₂∂_xv₁ − v₂∂_xu₁) = ⟨ψ|α_x p_x|ψ⟩密度
 *   E_y = ½(−u₁∂_yu₂ − v₁∂_yv₂ + u₂∂_yu₁ + v₂∂_yv₁)
 *   （dxp/dyp 为引擎 4 阶中心差分 = 2∂，0.25→½ 因子配套，与 Pauli 同式。）
 * 势能密度：V·p + m·(p₁−p₂)（βm 期望 = m(|ψ₁|²−|ψ₂|²)）。
 * 均值动量用引擎默认 Im(ψ*∂ψ) 两分量和——Dirac 的正则动量（平移生成元）
 * 仍守恒（均匀势下），HUD 不确定原理区口径不变。
 *
 * 【AB link 相位】最小耦合 p→p−A 作用在 α·p 上（不是 βm）——diracD 的
 * 四个邻点采样在 uABOn>0.5 时经 rot4 乘 link 相位（与引擎标量路径同一
 * 精确线积分约定），给出 2+1 维旋量的 AB 效应（规范 U(1) 对旋量的作用）。
 *
 * 【已知限制（诚实声明）】
 *   1. 连续近似：色散/群速公式已内入 sin k（格点精确），但 Klein 的连续 T
 *      公式只是格点解的 k→0 极限（见上节对照）——CDP/扫描工具一律以

 *      误差 ~1e-9/步；子步数沿用引擎 KDK 同公式只为统一时间离散精度。
 *   2. 势场 8 位编码硬上限 ±1（引擎约束）⟹ Klein 区需 m<~0.5（2m<0.95），
 *      预设取 m=0.3；质量滑块范围 0.15–4 内更高势垒不可画（引擎约束，非内核）。
 *   3. 无自旋读数（spinReadout 不设）：Dirac 的 σ_z=β 期望 =(n1−n2)/P 仍
 *      有定义但不是守恒量/进动轴，HUD 自旋区不显示（避免误导）；
 *      CDP 用 spinCom/fieldStats 直读分量。
 *   4. 3D：本内核为 2+1 维（α_x, α_y）；3D Dirac 属 3D 纹理 backlog。
 * ========================================================================== */

class DiracKernel extends PhysicsKernel {
  constructor(){
    super();
    this.id = 'dirac';
    this.name = 'Dirac 相对论';
    this.equation = '<b>DIRAC (2+1 D)</b> · <i>i</i>ℏ ∂ψ/∂t = [α_x·p_x + α_y·p_y + β·m + V]·ψ';
    this.pairs = 2;
    /* CN 积分器：KDK 对 Dirac 结构性失效（通道混合 M，谱半径 ρ=1.0216），
       详见文件头【积分器】节；引擎 app.js 按此标志走 CN 路径。 */
    this.integrator = 'cn';
    /* 不设 spinReadout：见文件头「已知限制」第 3 条。 */
  }

  /* 初始旋量波包：高斯包络 × 离散正能旋量 u(k)（头注【正能旋量初态】）。
     u(k) = (1, (sin k_x + i·sin k_y)/(E+m))，E=√(sin²k_x+sin²k_y+m²)。
     k=0 时 u=(1,0)：纯上分量静止包（zitter 预设的初态）。
     引擎负责归一化与等份叠加；θ/φ 自旋滑块不适用于 Dirac（忽略）。 */
  makeWave(grid, p){
    const m = p.m === undefined ? 1 : p.m;
    const sk = Math.sin(p.kx), tk = Math.sin(p.ky);      /* 离散动量（格点波数→sin k） */
    const E = Math.sqrt(sk*sk + tk*tk + m*m);
    const w2r = sk/(E+m), w2i = tk/(E+m);                /* 下分量 (sin k_x+i·sin k_y)/(E+m) */
    const cx = p.fx*grid, cy = p.fy*grid;
    const data = new Float32Array(grid*grid*4);
    let sum = 0;
    for (let y=0; y<grid; y++){
      for (let x=0; x<grid; x++){
        const dx = x-cx, dy = y-cy;
        const env = Math.exp(-(dx*dx+dy*dy)/(2*p.sigma*p.sigma));
        const pk = p.kx*dx + p.ky*dy;                    /* 平面波相位（两分量同 k） */
        const i = (y*grid+x)*4;
        const c = Math.cos(pk), s = Math.sin(pk);
        data[i]   = env*c;  data[i+1] = env*s;           /* ψ₁ = env·e^{ikr} */
        data[i+2] = env*(w2r*c - w2i*s);                 /* ψ₂ = env·(w2r+iw2i)·e^{ikr} */
        data[i+3] = env*(w2r*s + w2i*c);
        sum += env*env*(1 + w2r*w2r + w2i*w2i);
      }
    }
    return { data, sum };
  }

  /* 矩势垒透射模型（正入射）——**格点色散口径**：T(E,V0,a) = latticeT 的
     界面匹配精确解（每区 4 模态含 Nyquist 别名对、4 界面站点 8 方程最小二乘；
     与连续公式的系统对照见文件头【Klein 佯谬】节）。E 为总能量（ℏ=1、格点
     单位）。convolved 对高斯 k 分布（均值 kx、宽 dk）积分 T(E(k),V0,a)——
     宽波包的合理对照目标（与薛定谔内核同口径；谱平均修正 Klein 曲线的
     k 依赖性——时间域 klein_td4.py 证实 T_sim=T_latt 谱平均 ±3%）。 */
  transmissionModel(state){
    const m = state.m;
    const Eof = k => Math.sqrt(Math.sin(k)*Math.sin(k) + m*m);   /* 离散色散：k→总能量 */
    const T = (E, V0, a) => {
      if (V0 === 0) return 1;                     /* 平坦段：全透射 */
      /* q²=0 转折点（(E−V0)²=m²）：±κ 消失波模态重合、匹配矩阵秩亏——
         取 V0±δ 两侧平均（T 对 V0 光滑，误差 O(δ²)；测度零参数点） */
      if (Math.abs((E-V0)*(E-V0) - m*m) < 1e-9) return 0.5*(T(E, V0+1e-4, a) + T(E, V0-1e-4, a));
      const out = latticeT(E, V0, a, m);          /* sk≥1（无外部传播波）⟹ null → 0 */
      return out === null ? 0 : out.T;
    };
    return {
      T, E: Eof,
      /* Δk 卷积期望（Simpson，±5dk，401 点；与 barrier.js 同模式） */
      convolved(kx, dk, V0, a){
        if (V0 === 0) return 1;
        if (!(dk > 0)) return T(Eof(kx), V0, a);
        const N = 400, span = 5*dk;
        let sum = 0, wsum = 0;
        for (let i = 0; i <= N; i++){
          const k = kx - span + 2*span*i/N;
          const w = Math.exp(-((k - kx)/dk)*((k - kx)/dk)/2);
          const wt = (i === 0 || i === N) ? 1 : (i%2 ? 4 : 2);
          sum += wt*w*T(Eof(k), V0, a); wsum += wt*w;
        }
        return sum/wsum;
      },
    };
  }

/* ============================================================================
 * 格点 Dirac 矩势垒精确透射（transmissionModel 的真值口径；klein5.py 的 JS 移植）
 *
 * 离散递推（引擎同约定：中心差分 ∂→i·sin k、V 能量平移）：
 *   ψ2_{j+1} = ψ2_{j-1} + 2i(E−m−V_j)·ψ1_j
 *   ψ1_{j+1} = ψ1_{j-1} + 2i(E−V_j+m)·ψ2_j
 * 每区模态 e^{ikj}·(1, s(k))，s(k)=sin k/(E−V+m)，色散 sin²k=(E−V)²−m²。
 * sin²k 有 4 解 ⟹ 每区 4 模态 ±k₁、±(π−k1)（Nyquist 别名对，旋量比跟随
 * sin k 符号）；Klein 区（E−V0<0）别名对群速反向；消失波区（(E−V0)²<m²）
 * 无别名（虚 q），仅 2 模态。未知量 r1,r2 | A₁..A₄ | t1,t2；方程 = 4 界面
 * 站点（−1,0,a−1,a）递推残差（8 复数，超定时最小二乘）。
 * T=|t1|²+|t2|²、R=|r1|²+|r2|²（严格 T+R=1；klein5.py 全场残差 1e-15）。
 * sk≥1（外部无传播模态）⟹ null。复数对统一用 [re, im]。
 * ========================================================================== */
const _csub = (a,b) => [a[0]-b[0], a[1]-b[1]];
const _cmul = (a,b) => [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const _cconj = a => [a[0], -a[1]];

/* 复系数线性求解 A·x=b（高斯消元 + 部分主元；A n×n 的 [re,im] 二维数组） */
function _cSolve(A, b){
  const n = b.length;
  for (let col=0; col<n; col++){
    let piv = col, best = A[col][col][0]*A[col][col][0] + A[col][col][1]*A[col][col][1];
    for (let r=col+1; r<n; r++){
      const v = A[r][col][0]*A[r][col][0] + A[r][col][1]*A[r][col][1];
      if (v > best){ best = v; piv = r; }
    }
    if (!(best > 0)) return null;                     /* 秩亏（物理上不出现） */
    if (piv !== col){ const t=A[col]; A[col]=A[piv]; A[piv]=t; const tb=b[col]; b[col]=b[piv]; b[piv]=tb; }
    const d = A[col][col];
    for (let r=col+1; r<n; r++){
      const f = _cmul(A[r][col], [d[0]/(d[0]*d[0]+d[1]*d[1]), -d[1]/(d[0]*d[0]+d[1]*d[1])]);
      for (let c2=col; c2<n; c2++) A[r][c2] = _csub(A[r][c2], _cmul(f, A[col][c2]));
      b[r] = _csub(b[r], _cmul(f, b[col]));
    }
  }
  const x = new Array(n);
  for (let r=n-1; r>=0; r--){
    let s = b[r];
    for (let c2=r+1; c2<n; c2++) s = _csub(s, _cmul(A[r][c2], x[c2]));
    const d = A[r][r];
    x[r] = _cmul(s, [d[0]/(d[0]*d[0]+d[1]*d[1]), -d[1]/(d[0]*d[0]+d[1]*d[1])]);
  }
  return x;
}

/* 超定最小二乘（法方程 M†M·x=M†b；行数≥列数，物理问题良态） */
function _cLstsq(M, b){
  const rows = b.length, n = M[0].length;
  const A = Array.from({length:n}, () => Array.from({length:n}, () => [0,0]));
  const c = Array.from({length:n}, () => [0,0]);
  for (let k=0; k<rows; k++){
    for (let i=0; i<n; i++){
      const mi = _cconj(M[k][i]);
      for (let j=0; j<n; j++) A[i][j] = [A[i][j][0] + _cmul(mi, M[k][j])[0], A[i][j][1] + _cmul(mi, M[k][j])[1]];
      c[i] = [c[i][0] + _cmul(mi, b[k])[0], c[i][1] + _cmul(mi, b[k])[1]];
    }
  }
  return _cSolve(A, c);
}

/* latticeT(E, V0, a, m) → { T, R } | null（sk≥1 无外部传播波）。
   复模态 (q, s)：e^{iqj}·(1, s)；s 为 [re,im]（实 q 时纯实、消失波时纯虚）。 */
function latticeT(E, V0, a, m){
  const sk2 = E*E - m*m;
  if (!(sk2 > 0)) return null;
  const sk = Math.sqrt(sk2);
  if (!(sk < 1)) return null;                          /* 外部无传播模态 */
  const k1 = Math.asin(sk), k2 = Math.PI - k1, k3 = Math.PI + k1;
  const s = sk/(E+m);                                  /* 外部旋量比（实数） */
  const sq2 = (E-V0)*(E-V0) - m*m;
  const modes = [];                                    /* [q, sre, sim] */
  if (sq2 > 1e-14){
    const sq = Math.sqrt(sq2), sp = sq/(E-V0+m);
    const q1 = Math.asin(Math.min(sq, 1)), q2 = Math.PI - q1;
    modes.push([q1, sp, 0], [-q1, -sp, 0], [q2, sp, 0], [-q2, -sp, 0]);
  } else {
    const kap = Math.sqrt(Math.max(-sq2, 0)), d = E-V0+m;
    modes.push([kap, 0, kap/d], [-kap, 0, -kap/d]);    /* 消失波：s=i·κ/d */
  }
  const nA = modes.length;
  const n = 2 + nA + 2;                                /* r1,r2 | A* | t1,t2 */
  const sites = [-1, 0, a-1, a];
  const Vj = j => (j >= 0 && j <= a-1) ? V0 : 0;
  /* 站点 j 的 (ψ1, ψ2)，x=[r1,r2,A...,t1,t2]（复数对），inc=入射幅值 */
  function psi(j, x, inc){
    if (j <= -1){
      const e1 = [Math.cos(k1*j), Math.sin(k1*j)];
      const e2 = [Math.cos(-k1*j), Math.sin(-k1*j)];
      const e3 = [Math.cos(k2*j), Math.sin(k2*j)];
      const p1 = [inc*e1[0] + x[0][0]*e2[0] - x[0][1]*e2[1] + x[1][0]*e3[0] - x[1][1]*e3[1],
                  inc*e1[1] + x[0][0]*e2[1] + x[0][1]*e2[0] + x[1][0]*e3[1] + x[1][1]*e3[0]];
      const p2 = [s*(inc*e1[0] - x[0][0]*e2[0] + x[0][1]*e2[1] + x[1][0]*e3[0] - x[1][1]*e3[1]),
                  s*(inc*e1[1] - x[0][0]*e2[1] - x[0][1]*e2[0] + x[1][0]*e3[1] + x[1][1]*e3[0])];
      return [p1, p2];
    }
    if (j <= a-1){
      let p1 = [0,0], p2 = [0,0];
      for (let i=0; i<nA; i++){
        const [q, sre, sim] = modes[i];
        const e = [Math.cos(q*j), Math.sin(q*j)];
        const A = x[2+i];
        const Ae = _cmul(A, e);
        p1 = [p1[0]+Ae[0], p1[1]+Ae[1]];
        const sAe = _cmul([sre, sim], Ae);
        p2 = [p2[0]+sAe[0], p2[1]+sAe[1]];
      }
      return [p1, p2];
    }
    const ja = j - a;
    const e1 = [Math.cos(k1*ja), Math.sin(k1*ja)];
    const e3 = [Math.cos(k3*ja), Math.sin(k3*ja)];
    const t1 = x[n-2], t2 = x[n-1];
    const p1 = _cmul(t1, e1), p1b = _cmul(t2, e3);
    const p2 = [_cmul(t1, e1)[0] - p1b[0], _cmul(t1, e1)[1] - p1b[1]];
    return [[p1[0]+p1b[0], p1[1]+p1b[1]], [s*p2[0], s*p2[1]]];
  }
  /* 站点递推残差（2 复数方程/站点）：
     Z1 = ψ2_{j+1}−ψ2_{j−1} − 2i(E−m−V_j)·ψ1_j
     Z2 = ψ1_{j+1}−ψ1_{j−1} − 2i(E−V_j+m)·ψ2_j
     2i·c·(zr+izi) = (−2c·zi, 2c·zr) ⟹
     Re Z = Re(ψ_{j+1})−Re(ψ_{j−1}) + 2c·Im(ψ_j)，
     Im Z = Im(ψ_{j+1})−Im(ψ_{j−1}) − 2c·Re(ψ_j) */
  function resid(j, x, inc){
    const [pm1a, pm1b] = psi(j-1, x, inc), [p0a, p0b] = psi(j, x, inc), [pp1a, pp1b] = psi(j+1, x, inc);
    const c1 = E - m - Vj(j), c2 = E - Vj(j) + m;
    return [
      [pp1b[0]-pm1b[0] + 2*c1*p0a[1], pp1b[1]-pm1b[1] - 2*c1*p0a[0]],
      [pp1a[0]-pm1a[0] + 2*c2*p0b[1], pp1a[1]-pm1a[1] - 2*c2*p0b[0]],
    ];
  }
  const M = [], b = [];
  for (let col=0; col<n; col++){
    const x = Array.from({length:n}, () => [0,0]);
    x[col] = [1,0];
    const rows = [];
    for (const j of sites){ const r = resid(j, x, 0); rows.push(r[0], r[1]); }
    M.push(rows);
  }
  {
    const x = Array.from({length:n}, () => [0,0]);
    for (const j of sites){ const r = resid(j, x, 1); b.push([-r[0][0], -r[0][1]], [-r[1][0], -r[1][1]]); }
  }
  /* M 是 n×8（列=未知量、行=方程），转置为 8×n 供 _cLstsq */
  const MT = Array.from({length:8}, (_, r) => M.map(col => col[r]));
  const sol = _cLstsq(MT, b);
  if (!sol) return null;
  const r1 = sol[0], r2 = sol[1], t1 = sol[n-2], t2 = sol[n-1];
  const T = (t1[0]*t1[0]+t1[1]*t1[1]) + (t2[0]*t2[0]+t2[1]*t2[1]);
  const R = (r1[0]*r1[0]+r1[1]*r1[1]) + (r2[0]*r2[0]+r2[1]*r2[1]);
  return { T, R };
}

registerKernel(new DiracKernel());

/* ===== src/main.js ===== */

new QuantumField(document.body, { kernel }).mount();
