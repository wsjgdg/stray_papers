<body>
<!-- 引擎（src/core）+ 物理内核（src/physics/twobody.js）为 ES 模块，需经 HTTP 访问
     （file:// 受 CORS 限制）。单文件分发版由 scripts/build-standalone.mjs 生成到

<script>
/*! 薛定谔工场 · 单文件分发版（two-body.html）— 由 scripts/build-standalone.mjs 自动生成，请勿手改。
    源码工程（ES 模块，课程站组件化用）：two-body.html + src/
    模块拼接序（拓扑序，依赖在前）：
      src/core/styles.js
      src/core/responsive.js
      src/core/nav.js
      src/core/gl.js
      src/physics/twobody.js
      src/two-body.js
      src/two-body-main.js
*/

/* ===== src/core/styles.js ===== */
/* 组件样式：挂载时注入 <style id="qf-styles">（多实例只注入一次）。
   R43 修复：本字符串此前**以字面 `<style>` 开头**（自初版 9c397d0 起），
   注入用 textContent ⟹ CSS 解析器把 `<style>` 当 selector 前缀，紧接的
   `:root{…}` 被解析为「`<style> :root`」这一永不匹配的后代选择器的声明块
   ⟹ **:root 内所有 CSS 变量失效**（--txt/--dim/--mono/--panel 全空），
   于是全部 `color:var(--dim)` 等退化为浏览器默认（黑字 + Times New Roman），
   在深色半透明面板上几乎不可读——而 font-size/letter-spacing 等字面值声明
   仍生效，故长期未被察觉（旧注释「视觉零回归」的自评有误）。
   R43 CDP 实测（getComputedStyle 读 CSS 变量全为空 + h3 color=rgb(0,0,0)
   / fontFamily=Times New Roman）定位并删除该标签后，变量与字体恢复。 */
const CSS = `
  :root{
    --bg:#04060c; --panel:rgba(8,12,22,.74); --line:rgba(120,160,220,.14);
    --txt:#e6edf3; --dim:#9aa7bd; --cyan:#67e8f9; --mag:#f0abfc; --amber:#fbbf24;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
  /* ---------- 顶栏 ---------- */
  /* 布局与子元素规则已收编 core/responsive.js 的 .qtop 族；主页差异值保留： */
  .qtop[id="topbar"]{gap:14px;padding:10px 20px}
  .qtop[id="topbar"] .logo{font-size:15px}
  .qtop[id="topbar"] .eq{font-size:12.5px;letter-spacing:.02em}
  #status{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
  /* R72：双粒子构型空间页入口（与 status 同排，flex:none 防被 eq 压缩） */
  #topbar .navlink{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;flex:none;transition:all .15s;letter-spacing:.05em}
  #topbar .navlink:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  /* ---------- 左侧控制面板 ---------- */
  /* R43 修复①：原 max-height:calc(100vh−120px) ⟹ 面板底 = 100vh−44，而左下
     #desc（bottom:52px）顶部随预设描述长度变化（实测 82px 文本 ⟹ 顶 100vh−132；
     GP/Pauli 长文本 177px ⟹ 顶 100vh−229）⟹ 两者在左列重叠（最大 238×80 px）。
     修复：#desc 限高 120px + 内部滚动（高度可控），面板按最坏情况预留
     (76 顶距 + 120 desc + 52 底距 + 8 间隙 = 256) ⟹ 面板底 100vh−180 ≤ desc 顶
     100vh−172，四 viewport × 五内核实测无重叠。 */
  #panel{top:76px;left:14px;width:238px;padding:14px;z-index:10;max-height:calc(100vh - 256px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:2px}
  .sec{margin-bottom:14px}
  .sec:last-child{margin-bottom:0}
  .sec>h3{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  /* R60 势刷轴比三连同控（grid3 单元格内的迷你标签行：名称 + 实时值） */
  .mini{font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between;gap:4px;margin:3px 0 1px;white-space:nowrap}
  .mini b{color:var(--cyan);font-weight:600;font-family:var(--mono)}
  button{font-family:var(--sans);font-size:12px;color:var(--txt);background:rgba(255,255,255,.045);
    border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;transition:all .15s;text-align:center}
  button:hover{background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.4)}
  button.on{background:rgba(103,232,249,.16);border-color:var(--cyan);color:var(--cyan)}
  button.wide{width:100%}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{font-size:11px;color:var(--dim);width:64px;flex:none}
  .row output{font-family:var(--mono);font-size:11px;color:var(--cyan);width:44px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(120,160,220,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 8px rgba(103,232,249,.7);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--cyan);cursor:pointer}
  select{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;outline:none}
  /* ---------- 右侧 HUD ---------- */
  #hud{top:76px;right:14px;padding:12px 14px;z-index:10;min-width:196px;font-family:var(--mono)}
  #hud .hrow{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:3px 0}
  #hud .hrow span:first-child{color:var(--dim)}
  #hud .hrow span:last-child{color:var(--txt)}
  #hud .hrow .ok{color:#4ade80}#hud .hrow .warn{color:var(--amber)}
  #hud hr{border:none;border-top:1px solid var(--line);margin:7px 0}
  /* ---------- 相位图例 ---------- */
  #legend{right:14px;bottom:52px;padding:10px 12px;z-index:10;display:flex;align-items:center;gap:12px}
  #wheel{width:84px;height:84px;border-radius:50%;border:1px solid var(--line)}
  #legend .cap{font-size:10.5px;color:var(--dim);line-height:1.7;max-width:130px}
  #legend .cap b{color:var(--cyan);font-weight:600}
  /* ---------- 底部提示 ---------- */
  #hint{left:50%;bottom:14px;transform:translateX(-50%);padding:8px 18px;z-index:10;
    font-size:11.5px;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
  #hint b{color:var(--txt);font-weight:600}
  #hint .k{font-family:var(--mono);color:var(--cyan);background:rgba(103,232,249,.1);
    border:1px solid rgba(103,232,249,.25);border-radius:4px;padding:0 5px;font-size:10.5px}
  /* ---------- 预设描述 ---------- */
  /* R43 修复②：描述文本长度随内核/预设变化（实测 82–177px 高），高度不可控会
     顶进 #panel 区域 ⟹ 限高 120px + 内部滚动：既压住几何冲突，又保留全文
     （长描述可滚动查看）。 */
  #desc{left:14px;bottom:52px;z-index:10;padding:10px 14px;max-width:340px;font-size:11.5px;
    color:var(--dim);line-height:1.65;max-height:120px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #desc b{color:var(--amber);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
  /* ---------- toast ---------- */
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
    font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.2em;opacity:0;transition:opacity .4s;
    text-shadow:0 0 18px rgba(103,232,249,.8)}
  /* ---------- 笔刷光标预览环 ---------- */
  #brushcursor{position:fixed;border:1px solid rgba(140,190,255,.85);border-radius:50%;pointer-events:none;
    display:none;z-index:15;box-shadow:0 0 10px rgba(80,140,255,.35),inset 0 0 10px rgba(80,140,255,.18)}
  /* ---------- 准星瞄准线 ---------- */
  #aim{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;pointer-events:none;display:none}
  #aim line{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4;filter:drop-shadow(0 0 4px rgba(251,191,36,.8))}
  #aim circle{fill:none;stroke:var(--amber);stroke-width:1;opacity:.7}
  #aim text{fill:var(--amber);font-family:var(--mono);font-size:11px}
  /* ---------- 角标 ---------- */
  .corner{position:fixed;width:22px;height:22px;z-index:4;pointer-events:none;opacity:.5}
  .corner::before,.corner::after{content:"";position:absolute;background:var(--cyan)}
  .corner::before{width:100%;height:1px}.corner::after{width:1px;height:100%}
  #c1{top:8px;left:8px}.corner::before{top:0}#c1::after{left:0}
  #c2{top:8px;right:8px}#c2::before{top:0}#c2::after{right:0}
  #c3{bottom:8px;left:8px}#c3::before{bottom:0}#c3::after{left:0}
  #c4{bottom:8px;right:8px}#c4::before{bottom:0}#c4::after{right:0}
  #diag{position:fixed;left:-9999px}
  /* ---------- 透射率扫描面板 ---------- */
  .hint{font-size:10px;color:var(--dim);line-height:1.5;flex:1}
  /* ---------- hint 可折叠（R45，用户选定方案 a）----------
     运行时升级（app.js upgradeHints）：原 hint 文本搬进 .hintBody，
     前置 .hintToggle 按钮。默认折叠（长 hint 是面板溢出的元凶，R43
     实测 2D 697px / 3D 1673px / GP 980px）；展开态经 localStorage
     持久化（key = hint 文本摘要，跨内核/面板切换稳定）。 */
  .hintToggle{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--dim);font:inherit;font-size:10px;cursor:pointer;padding:0;margin:0;
    letter-spacing:.05em}
  .hintToggle:hover{color:var(--cyan)}
  .hintToggle:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .hint .hintBody{display:none}
  .hint.open .hintBody{display:block}
  .hint.open .hintToggle{color:var(--cyan);margin-bottom:3px}
  /* ---------- sec 级分区折叠（R48，README「后续方向」a2）----------
     与 hint 折叠（R45）同模式：h3 变切换头（class 驱动显隐），展开态经
     localStorage 持久化（qf.secs.state，key = sec id / h3 摘要）。
     默认折叠：四个扫描面板 sec——R45 实测（1440×900，overflow 口径
     scrollH−clientH）溢出大头正是区块结构：2D 687 / 3D 1403 / GP 813，
     canvas 硬高占其中 820px。与门控正交：syncControls 按内核切 sec 的
     style.display（整区显隐），本折叠切 sec 内部子元素，互不竞争。
     扫描开始（GenericScanner.start → app.expandSecFor）自动展开所在
     sec——用户点了「开始扫描」就应看到 canvas 与状态行。
     特异度注意：规则须带 #panel 前缀——四个扫描 canvas 的 display:block
     规则（ID 选择器 1,0,0）会压过裸 .sec.collapsed > *:not(h3)（0,1,1）
     ⟹ 折叠态 canvas 仍显示（cdp48 首轮实证）。 */
  #panel .sec.collapsed > *:not(h3){display:none}
  .sec > h3{cursor:pointer;user-select:none;-webkit-user-select:none}
  .sec > h3:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .sec > h3::before{content:"▾ ";color:var(--dim);font-weight:400}
  .sec.collapsed > h3::before{content:"▸ "}
  /* R48：range flex item 默认 min-width:auto（Chrome ~129px 固有最小宽）
     ⟹ label64+gap+range129+gap+output44 超出面板内容宽 236px ~31px，
     面板被迫横向滚动（R43 起既有缺陷，R45 溢出台账只记了纵向）。 */
  input[type=range]{min-width:0}
  /* R48 a3：扫描 canvas 统一 width:100%（修复 paramScanCanvas/scanCanvas3/
     slitScanCanvas 三个缺规则 ⟹ 420px attribute 宽在 210px 面板内容区横向
     溢出、面板被迫横向滚动——R45 溢出台账只记了纵向，此项本轮补录）；
     attribute 高 260/300 → 180（_plot 全部按 cv.width/height 自适应绘制，
     内部分辨率 420×180 不变、显示高 210×180/420=90px，展开态每块省 40–60px）。 */
  #scanCanvas,#paramScanCanvas,#scanCanvas3,#slitScanCanvas{width:100%;margin-top:6px;
    border:1px solid var(--line);border-radius:8px;background:rgba(4,8,16,.4);display:block}
  #scanStat{font-size:10px;color:var(--cyan);font-family:var(--mono);flex:1;line-height:1.45}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
  /* ---------- 面板双向收起（R56，「试验场全屏」）----------
     左列 #panel(上) + #desc(下)、右列 #hud(上) + #legend(下) 各为一组，
     整组 transform 滑出屏幕——#gl 本就 position:fixed 全屏，滑出即露全场，
     无需 resize/重绘（画布尺寸不变，只是不再被面板遮挡）。
     边缘拉手 .qf-tab 常驻（z-index 11 压面板 10，只压边框+padding 6px，
     不挡内容）；点击拉手或快捷键 [ / ] 切换；状态经 localStorage
     qf.panels.state = {left,right}（true=展开，缺省/坏值默认全展开）。
     滑出态 pointer-events:none ⟹ 画布交互全程不被残留命中区遮挡。 */
  #panel,#desc,#hud,#legend{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .24s}
  body.qf-hide-left #panel,body.qf-hide-left #desc{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  body.qf-hide-right #hud,body.qf-hide-right #legend{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  .qf-tab{position:fixed;top:50%;transform:translateY(-50%);z-index:11;width:20px;height:60px;
    padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:14px;line-height:1;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:0 10px 10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 4px 16px rgba(0,0,0,.4);transition:color .15s,border-color .15s}
  #tabL{left:0}
  #tabR{right:0;border-radius:10px 0 0 10px}
  .qf-tab:hover{color:var(--cyan);border-color:rgba(103,232,249,.45)}
  @media (max-width:1100px){#legend,#desc{display:none}}
`;

function injectStyles(){
  if (document.getElementById("qf-styles")) return;
  const st = document.createElement("style");
  st.id = "qf-styles";
  st.textContent = CSS;
  document.head.appendChild(st);
}

/* ===== src/core/responsive.js ===== */
/* ============================================================================
 * responsive.js — 全站响应式公共模块（R94 引入）
 *
 * 背景：R90 给 12 个子页各写了一式三份的顶栏渐进收缩（1500/1400/900 三档
 * 媒体查询只换 id 前缀，36 处重复）；小屏更只做到「≤900 隐导航」——导航全隐
 * 等于 12 页互链在窄桌窗/平板/手机上不可达，且左面板（~238px 固定）+ 右 HUD
 * （≥200px）在 390px 竖屏下必重叠。R94 收编 + 补齐：
 *   1. 顶栏三档（1500/1400/900）收归公共类 .qtop——12 页删除本地副本；
 *   2. ≤900 导航改汉堡抽屉：桌面 .qnav 用 display:contents 透明包裹（a 们
 *      仍是 .qtop 的 flex item，布局逐位不变），手机变全屏下拉网格；
 *   3. ≤860 手机段：面板/HUD 转底部全宽 sheet（内联样式覆盖各页 id 规则，
 *      退出时按 dataset.qfRestore 精确还原），stage 内联几何让位顶栏与 dock；
 *   4. 底部 dock 三态（控制/读数/全屏），matchMedia 跨越 860px 自动进出。
 *
 * 各页接入约定（一次性）：
 *   - 顶栏/面板/HUD/stage/hint 容器分别加类 qtop/qpanel/qhud/qstage/qhint；
 *   - mount() 里调用 injectResponsive()（幂等；无这些类的页面静默跳过）。
 * ========================================================================== */

const RESP_CSS = `
  /* ---- 顶栏基础（收编自 12 子页本地规则；.eq i 取主页口径 mag，
       amber 派的 5 页保留本地差异行） ---- */
  .qtop{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:16px;padding:9px 18px;z-index:10;white-space:nowrap}
  .qtop .logo{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.12em;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  .qtop .eq{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .qtop .eq b{color:var(--cyan);font-weight:600}
  .qtop .eq i{color:var(--mag);font-style:italic}
  .qtop a{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;transition:all .15s}
  .qtop a:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  .qtop a.cur{color:var(--mag);border-color:rgba(240,171,252,.45)}
  /* ---- 桌面：.qnav 透明包裹（a 们仍是 .qtop 的直接 flex item） ---- */
  .qnav{display:contents}
  .qburger{display:none}
  /* ---- 顶栏渐进收缩（收编自 R90 的 12 页本地副本，规则逐字保留） ---- */
  /* 特异性：.qtop.qtop（0,2,0）压各页差异行 .qtop[id="xxTop"]（0,2,0）靠
     本 style 后注入（同权重比源码序）；子元素 .qtop.qtop X（0,3,x）压
     .qtop[id="xxTop"] X（0,2,x）。 */
  @media (max-width:1500px){.qtop.qtop{gap:10px;padding:7px 14px}.qtop.qtop .logo{font-size:13px}
    .qtop.qtop a{font-size:10px;padding:2px 7px}}
  @media (max-width:1400px){.qtop.qtop .eq{display:none}.qtop.qtop{gap:8px}
    .qtop.qtop a{font-size:9.5px;padding:2px 6px}}
  /* ---- ≤900：导航收进汉堡抽屉（替代原「隐导航」） ---- */
  @media (max-width:900px){
    /* position:relative + z-index:11：burger 须压在抽屉（z:9）之上。二者同是
       .qtop  stacking context 的子元素，.qtop 的 z:10 只管对外层级——初版漏了
       这条，实测 elementFromPoint 命中 .qnav，真实手指点汉堡位置无效。
       尺寸 40×36：R95 实测 30×26 只过 WCAG 2.5.8 AA（24px），离 44px 舒适线
       仍远；顶栏 ≤900 时只剩 burger + logo（eq 已隐），放大不挤位。 */
    .qburger{display:flex;align-items:center;justify-content:center;flex:none;
      position:relative;z-index:11;
      width:40px;height:36px;padding:0;font-size:17px;line-height:1}
    .qnav{display:none;position:fixed;top:0;left:0;right:0;z-index:9;
      grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:7px;
      padding:52px 12px 14px;max-height:100vh;max-height:100dvh;overflow-y:auto;
      background:rgba(4,6,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line)}
    .qtop.open .qnav{display:grid}
    /* !important 收口：抽屉是覆盖层上下文，页面级顶栏规则不得泄漏进来——主页
       id 级 #topbar .navlink（styles.js，11px/3px 8px）与 1400 档 .qtop.qtop a
       （9.5px/2px 6px）特权都高于类选择器（id 赢 (0,3,1)），升维打不过；实测
       抽屉链接曾被压到 20px 高（< WCAG 2.5.8 AA 的 24px）。13×1.25+14×2
       = 44.25px，同时满足 44px 触摸目标。仅 ≤900 生效。 */
    .qnav a{font-size:13px!important;padding:14px 6px!important;line-height:1.25!important;text-align:center}
  }
  /* ---- ≤860 手机段：底部 dock 三态（控制/读数/全屏；dock 三态常驻，
     off 态退让为半透明——曾把 off 态 dock 也 display:none，实测成死胡同：
     默认即全屏且无任何 UI 路径回到控制/读数，只能旋转屏幕或刷新） ---- */
  .qf-dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:none;
    gap:6px;padding:5px 8px;z-index:14;transition:opacity .18s;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  html.qf-mobile .qf-dock{display:flex}
  /* 按钮 padding 5px 10px → 8px 12px：R95 实测 29px 高，放大到 ≈31px（仍不过
     44px 舒适线——再大 dock 总高将顶破 44px 预留带，需连带改 stage/sheet 的
     让位常量，权衡后记为遗留）。dock 总高 43.2 ≤ 44 带不变。 */
  .qf-dock button{font-size:11px;padding:8px 12px;border-radius:6px;white-space:nowrap}
  html.qf-mobile body.qf-m-controls .qhud{display:none}
  html.qf-mobile body.qf-m-readout .qpanel{display:none}
  html.qf-mobile body.qf-m-off .qpanel,html.qf-mobile body.qf-m-off .qhud{display:none}
  html.qf-mobile body.qf-m-off .qf-dock{opacity:.4}
  html.qf-mobile body.qf-m-off .qf-dock:active{opacity:.85}
  /* ---- ≤860 手机段：hint 换行防溢出、给 dock 让位；hud sheet 统一可滚
     （各页 #xxHud 的 overflow 不一致：hubbard/shor 无声明 ⟹ 内容超 46vh
      时静默裁切，实测 shor 已临界 387>386；gatenoise 的 .sfill 在 .strack
      内 top:0;bottom:0，加滚动不裁切——13 页 × 2 视口实测确认） ---- */
  @media (max-width:860px){
    /* sheet 最大高经 CSS 变量下发：竖屏 46vh；横屏（844×390 等）放 64vh——
       R95 实测横屏面板带仅 179px 过小。inline max-height 引用 var()，
       媒体状态变化自动生效，无需 JS 监听 orientationchange。
       注：此处只 vh 不 dvh——max-height 非布局临界尺寸（内容可滚），
       工具栏收放的抖动可接受；stage 高度（关键尺寸）仍保持 dvh 双声明。 */
    :root{--qf-sm:46vh}
    .qhint{white-space:normal;max-width:calc(100vw - 20px);bottom:40px;
      font-size:10.5px;line-height:1.5}
    .qhud{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  }
  @media (max-width:860px) and (orientation:landscape){:root{--qf-sm:64vh}}
  @media (prefers-reduced-motion:reduce){.qf-dock{transition:none}.qtop a{transition:none}}
`;

const $ = (s, r = document) => Array.from(r.querySelectorAll(s));
const MQ = '(max-width:860px)';
/* dvh 双声明：移动浏览器工具栏收放时 100vh 按大视口计算 ⟹ stage/sheet 带
   跳动（iOS 经典病）。旧浏览器忽略不认识的 dvh 行、保留 vh 行（CSS 错误
   处理即 fallback，无需 @supports）。dvh 支持：Safari 15.4+/Chrome 108+/
   Firefox 101+，低于本项目 README 地板 Safari 16.4。
   sheet 的 max-height 走 var(--qf-sm)（竖 46vh/横 64vh，见 ≤860 段注释）。 */
const SHEET_G = 'position:fixed;left:6px;right:6px;width:auto;top:auto;bottom:44px;max-height:var(--qf-sm,46vh);z-index:12';
const STAGE_G = 'position:fixed;left:6px;right:6px;width:auto;top:48px;transform:none';

/* ---- 手机段几何三件套（R98 提为模块级：原为 injectResponsive 内闭包，
   仅覆盖 enhance 时刻存在的元素；QEC hub 切换 mode 是整块换 DOM，需导出
   重放入口给壳调用。行为与原闭包逐字一致） ---- */
function syncStage(){
  if (!document.documentElement.classList.contains('qf-mobile')) return;
  /* dock 三态常驻 ⟹ 舞台恒让出底部 44px dock 带（off 态不再压缩到 8px） */
  $('.qstage').forEach(el => {
    el.style.height = 'calc(100vh - 48px - 44px)';
    el.style.height = 'calc(100dvh - 48px - 44px)'; /* 旧浏览器忽略此行保留上一行 */
  });
}
function sheetify(root = document){
  $('.qpanel,.qhud', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + SHEET_G;
  });
  $('.qstage', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + STAGE_G;
  });
  syncStage();
}
function unsheetify(){
  $('.qpanel,.qhud,.qstage').forEach(el => {
    if (el.dataset.qfRestore == null) return;
    el.setAttribute('style', el.dataset.qfRestore);
    delete el.dataset.qfRestore;
  });
  syncStage();
}

/** R98：hub 切 mode 后，对新插入的 .qpanel/.qhud/.qstage 重放手机段几何
 *  （桌面宽度为空操作；幂等——已带 qfRestore 的元素跳过）。 */
function refreshMobileGeometry(root = document){
  if (!matchMedia(MQ).matches) return;
  sheetify(root);
}

function injectResponsive(){
  /* ---- 样式只注入一次（同步，不等 DOM） ---- */
  if (!document.getElementById('qf-resp')){
    const st = document.createElement('style');
    st.id = 'qf-resp';
    st.textContent = RESP_CSS;
    document.head.appendChild(st);
  }
  if (document.body.dataset.qfResp) return;
  document.body.dataset.qfResp = '1';

  /* ---- DOM 增强推迟到 microtask ----
     各页 mount() 的调用时序是 injectStyles() → injectResponsive() →
     构建 DOM（insertAdjacentHTML / container.innerHTML）——本函数若同步
     增强，.qtop 尚不存在（汉堡/抽屉无从包起），且 body.innerHTML 整体
     重写会把已 append 的 dock 清掉（index/two-body/hubbard 三页实测）。
     mount() 是同步函数 ⟹ microtask 必在其返回后执行：那时 DOM 已就绪，
     三种构建方式（insertAdjacentHTML / innerHTML / buildDOM）均安全。 */
  const enhance = () => {

  /* ---- 1. 顶栏增强：包 .qnav + 注入汉堡（幂等） ---- */
  $('.qtop').forEach(top => {
    if (top.querySelector('.qburger')) return;
    const nav = document.createElement('nav');
    nav.className = 'qnav';
    $('a', top).forEach(a => nav.appendChild(a));
    top.appendChild(nav);
    const b = document.createElement('button');
    b.className = 'qburger';
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', '打开导航');
    b.textContent = '☰';
    /* 开合状态同步 aria-expanded / aria-label（a11y：初版恒为「打开导航」） */
    const setOpen = open => {
      top.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
    };
    b.addEventListener('click', e => { e.stopPropagation(); setOpen(!top.classList.contains('open')); });
    top.insertBefore(b, top.firstChild);
    /* 抽屉内任意点击即收起：点链接本就导航，点 backdrop 现在也能取消
       （初版只认链接 ⟹ 打开后除了导航无法退出，实测确认的死胡同） */
    nav.addEventListener('click', () => setOpen(false));
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.qtop')) $('.qtop.open').forEach(t => t.classList.remove('open'));
  });
  /* Escape 收抽屉 + 焦点回汉堡（键盘用户路径；初版无 Escape） */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    $('.qtop.open').forEach(t => {
      t.classList.remove('open');
      const b = t.querySelector('.qburger');
      if (b){ b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', '打开导航'); b.focus(); }
    });
  });

  /* ---- 2. 底部 dock（三态常驻：默认 off = 舞台优先，dock 退让为半透明） ---- */
  const dock = document.createElement('div');
  dock.className = 'qf-dock';
  dock.innerHTML = '<button type="button" data-tab="controls">⚙ 控制</button>'
    + '<button type="button" data-tab="readout">◫ 读数</button>'
    + '<button type="button" data-tab="off">✕ 全屏</button>';
  document.body.appendChild(dock);
  dock.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.body.classList.remove('qf-m-controls', 'qf-m-readout', 'qf-m-off');
    document.body.classList.add('qf-m-' + b.dataset.tab);
    syncStage();
  });
  document.body.classList.add('qf-m-off');

  /* ---- 3. 手机段几何：内联覆盖各页 id 规则，退出精确还原 ---- */
  const mq = matchMedia(MQ);
  const apply = m => {
    document.documentElement.classList.toggle('qf-mobile', m);
    if (m) sheetify(); else unsheetify();
  };
  if (mq.addEventListener) mq.addEventListener('change', ev => apply(ev.matches));
  else if (mq.addListener) mq.addListener(ev => apply(ev.matches)); /* 旧 Safari */
  apply(mq.matches); /* 页面可能直接在手机宽度打开 */

  };
  queueMicrotask(enhance);
}

/* ===== src/core/nav.js ===== */
/* ============================================================================
 * nav.js — 全站导航单一数据源（R85 引入）
 *
 * 背景：R79 加 Shor 页时漏掉了六页的导航链接，R80 后主页顶栏又停了更——
 * 每加一页就要手工同步 12 处硬编码导航，漏一处就是一个「导航洞」
 * （cdp74–81 的 nav.length 断言因此腐烂了四轮）。R85 起全站统一从这里取。
 *
 * 约定：
 *   - NAV = [[href, label], ...] 按站点顺序；当前页由 navHtml(cur) 打 cur 高亮。
 *   - 标签文案全站统一（历史上各页曾有 '← 单粒子主页' / '双粒子 ⟋' 等变体）。
 *   - 新页面只需在 NAV 追加一行 + build-standalone.mjs 的 PAGES 追加一行。
 *   - 主页顶栏（class="navlink" + title 工具提示）走 navLinksHtml()，
 *     标题文案在 NAV_TITLES，与 NAV 同源，不会再漏。
 * ========================================================================== */

/* R98：QEC 七页整合为单页 hub（qec.html?mode=rep|shor|gate|flag|rounds|cycle|family），
   NAV 由 13 条收为 7 条；六个旧页名各留跳转桩（根级 + dist），旧书签不 404。 */
const NAV = [
  ['./quantum-field.html', '主页'],
  ['./two-body.html', '双粒子 ⧉'],
  ['./hubbard.html', '哈伯德 ⛓'],
  ['./paths.html', '路径 ∿'],
  ['./qcircuit.html', '线路 ⧉'],
  ['./noise.html', '噪声 ◍'],
  ['./qec.html', '纠错 ◈'],
  ['./spin.html', '自旋链 ⇅'],
].filter(Boolean);

/** 主页顶栏各页的 title 工具提示（与 NAV 同序；缺省回退为标签文案） */
const NAV_TITLES = {
  './two-body.html': '双粒子构型空间：全同粒子 / 交换对称（R72）',
  './hubbard.html': '格点费米-哈伯德：莫特绝缘体 / 纠缠熵（R73）',
  './paths.html': '费曼路径求和：路径族 / 相位 / 双缝条纹（R74）',
  './qcircuit.html': '小规模量子线路：Bell / GHZ / QFT / Grover（R75）',
  './noise.html': '开放量子系统：T₁ 弛豫 / T₂ 退相位 / 纠缠猝死（R77）',
  './qec.html': '量子纠错 hub：重复码 / Shor 9 / 门噪声 / Flag / 多轮 / 循环 / 码族 / 表面码（R78–R85、R98 整合、R128 表面码）',
  './spin.html': '海森堡自旋链：XXZ 各向异性 / 局域场 / 淬变 / 临界纠缠（R144）',
};

/** 生成子页顶栏导航 HTML；cur = 当前页 href（打 cur 高亮，自链也在——与 flag/rounds/cycle 一致）。
 *  indent = 每行前导空白（各页模板缩进不同：6/8 空格或 div 版 2 空格）。 */
function navHtml(cur, indent = '        ') {
  return NAV.map(([h, t]) =>
    `${indent}<a href="${h}"${h === cur ? ' class="cur"' : ''}>${t}</a>`).join('\n');
}

/** 主页顶栏（#topbar）导航：class="navlink" + title；主页自身无链接。 */
function navLinksHtml(indent = '  ') {
  return NAV.filter(([h]) => h !== './quantum-field.html')
    .map(([h, t]) => `${indent}<a class="navlink" href="${h}" title="${NAV_TITLES[h] || t}">${t}</a>`)
    .join('\n');
}

/** 调试用：纯 href 列表（cdp 套件的 navLinks() 走各页自己的实现，这里供对照） */
const NAV_HREFS = NAV.map(([h]) => h);

/* ===== src/core/gl.js ===== */
/* WebGL2 引导、着色器编译、全屏三角形与渲染目标。
   所有函数显式接收 gl 参数——不持有模块级 GL 状态，多实例安全。 */
const VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

/* 纯拷贝 shader：resize 时把旧 dispA（历史余晖）blit 进新 dispA */
const FS_BLIT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex;
void main(){ o = texture(uTex, vUv); }`;

/* 创建 WebGL2 上下文；失败时返回 { gl:null, error } 由调用方展示诊断 */
function createContext(canvas){
  const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance' });
  if (!gl) return { gl:null, error:'no webgl2' };
  if (!gl.getExtension('EXT_color_buffer_float')) return { gl:null, error:'no EXT_color_buffer_float' };
  return { gl, error:null };
}

function compileShader(gl, type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}

/* 编译 program：全屏三角形 VS + 调用方提供的 FS。
   vs 参数可选（R61 Bohm 轨迹 stamp：POINTS 程序需自定义 VS，无属性输入、
   gl_VertexID 索引位置纹理）——缺省逐字等价旧路径。 */
function createProgram(gl, fs, vs){
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vs || VS));
  gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

/* 全屏大三角形（覆盖 NDC，比 quad 少一次插值对角线） */
class Quad {
  constructor(gl){
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
  }
  bind(gl){ gl.bindVertexArray(this.vao); }
  draw(gl){ gl.bindVertexArray(this.vao); gl.drawArrays(gl.TRIANGLES, 0, 3); }
}

/* RG32F / RGBA32F 浮点场目标（量子波函数，NEAREST） */
function makeTarget(gl, w, h, internalFormat, format, filter){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, gl.FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo, w, h };
}

/* 3D 纹理目标（体积求解器 ping-pong；layer 级 FBO 附着由调用方按需重绑）。
   注意：fbo 初始不附着任何层（WebGL2 无默认完整 3D FBO）——绘制前须
   framebufferTextureLayer(FRAMEBUFFER, COLOR_ATTACHMENT0, tex, 0, layer)。 */
function makeTarget3D(gl, n, internalFormat, format, filter){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, tex);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
  gl.texImage3D(gl.TEXTURE_3D, 0, internalFormat, n, n, n, 0, format, gl.FLOAT, null);
  const fbo = gl.createFramebuffer();
  return { tex, fbo, n };
}

/* RGBA16F 显示目标（拖尾历史，LINEAR 兼做 resize 重采样） */
function makeRGBA16F(gl, w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo, w, h };
}

/* 32^2 归约目标（MRT 三附件，各 RGBA32F）：
   tex  (location 0)：(Σp, uK·ΣT, Σp², ΣVp)
   tex2 (location 1)：(Σx·p, Σy·p, Σx²·p, Σy²·p)（世界坐标概率矩，
      供不确定原理 HUD 的 Δx/Δy 与质心使用）。
   tex3 (location 2)：(uK·ΣT_x, uK·ΣT_y, Σ⟨p_x⟩, Σ⟨p_y⟩)（分轴动能 + 梯度版
      均值动量——per-axis 紧致界 Δx·Δk_x ≥ ½；若只给总 Δk，2D 高斯波包单向
      宽度配双向展宽仅得保守界 √2·½=0.707，呈现不出「高斯是不确定原理饱和态」
      这一关键物理；均值 ⟨p⟩ 与 ⟨p²⟩ 同用 4 阶算子，Δk 全 Fourier 一致）。
   调用方须 gl.drawBuffers([COLOR_ATTACHMENT0,1,2]) 后绘制；
   读取时对每个附件分别 gl.readBuffer + readPixels。 */
function makeReduce(gl){
  const mk = () => {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 32, 32, 0, gl.RGBA, gl.FLOAT, null);
    return tex;
  };
  const tex = mk(), tex2 = mk(), tex3 = mk();
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, tex2, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, tex3, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE){
    throw new Error('makeReduce: MRT framebuffer incomplete');
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, tex, tex2, tex3 };
}

/* ===== src/physics/twobody.js ===== */
/* ============================================================================
 * twobody.js — R72 全同粒子 / 交换对称（双粒子构型空间内核）
 *
 * 物理模型（一维双粒子构型空间 ψ(x₁,x₂)，L×L 格点）：
 *   iℏ∂ψ/∂t = Hψ，  H = −uK(∂²/∂x₁² + ∂²/∂x₂²) + V₁(x₁) + V₂(x₂) + U(x₁−x₂)
 *   uK = 1/(2m)（引擎同款 uniform；本页 m=1 ⟹ uK=0.5），ℏ=1，世界坐标 = texel。
 *
 * 为什么开新页而不是并进主页（README R72 行的原定结论）：
 *   构型空间语义与主页的单粒子 x 空间差异过大（坐标轴是两个粒子的位置、
 *   对角线 x₁=x₂ 是「重合线」、交换算符 P 是一等观测对象），面板/HUD/预设
 *   体系都无法复用；但**离散算子与引擎同族**（5 点交叉 stencil、KDK、
 *   CLAMP_TO_EDGE），故共用 src/core/gl.js 与 styles.js，物理与 GPU 实现
 *   收在本文件（CPU 镜像与 GLSL 同源手写平行实现，pot72/cdp72 互为独立通道）。
 *
 * 【交换对称】Pψ(x₁,x₂) = ψ(x₂,x₁)。初态按统计对称化：
 *   ψ₀(x₁,x₂) = [φ_a(x₁)φ_b(x₂) ± φ_b(x₁)φ_a(x₂)]/√2   （+ 玻色 / − 费米）
 *   ⟹ ⟨P⟩ = ⟨ψ|P|ψ⟩ = ±1；反对称态在对角线 x₁=x₂ 上**恒零**
 *   （泡利不相容的直接可视化）；同单粒子态（a=b）的反对称化恒等于 0
 *   （Pauli guard：makeWave 返回 norm≈0，页面拒绝加载并 toast）。
 *
 * 【交换对称何时守恒】[H,P]=0 ⟺ V₁=V₂（粒子全同）。本文件势场：
 *   V₁(x) = trap ? min(½ω²(x−xc)², vcap) : 0
 *   V₂(x) = (1+ε)·V₁(x) + ε·bump(x)          bump = bumpH·exp(−((x−xc)/bumpW)²)
 *   U(x₁−x₂) = g·δ_{x₁=x₂}（格点接触相互作用，仅对对角 texel 生效）
 *   ε=0 ⟹ 全同 ⟹ ⟨P⟩ 严格守恒（H 与 P 对易，KDK 逐通道保持对称性）；
 *   ε>0 ⟹ 粒子 2 的势场不同 ⟹ 可区分 ⟹ ⟨P⟩ 漂离 ±1（物理本身，非 bug），
 *   且一阶边缘密度 n₁(x)=∫|ψ(x,x₂)|²dx₂ 与 n₂ 不再重合（全同时恒等）。
 *
 * 【积分器】KDK（kick-drift-kick，与主页引擎同族的一阶系统 w=(u,v) 分裂，
 *   u=Reψ、v=Imψ；u'=Hv、v'=−Hu）。H 为实对称离散算符（5 点 stencil 含
 *   CLAMP_TO_EDGE Neumann 闭合 + 对角势），故 KDK 保**影子哈密顿量**：
 *   范数漂移有界 O(dt²)（非长期累积），pot72 C4 定量入档。对角接触项
 *   g 只进 kick（势项），无条件稳定。
 *
 * 【验证锚点（pot72/cdp72 共用本文件导出的 CPU 函数）】
 *   - 无相互作用时 H=H₁+H₂ 可分 ⟹ 精确解 = 两个 1D 精确演化的乘积；
 *     1D 精确演化用 Neumann 3 点拉普拉斯的**余弦模**闭式（λ_k=2cos(πk/L)−2，
 *     特征向量 cos(πk(i+½)/L)，机器精度）⟹ KDK 误差 O(dt²) 可标定。
 *   - 谐振子阱：解析 φ₀/φ₁ 反对称化初态 + 虚时间松弛到**离散**本征态
 *     （‖Hψ−Eψ‖ 残差检验，pot72 E2/E3）。
 *   - HBT 接触统计：对角密度 玻色 = 2×可区分、费米 = 0×（pot72 B）。
 *
 * 诚实限制（文档同款，面板 hint 亦标注）：
 *   1. 接触相互作用是**格点 δ**（仅 x₁=x₂ texel），非连续 δ；不给散射长度
 *      公式，只定性展示「费米子不受接触作用影响 / 玻色子被压制」。
 *   2. 边界为 CLAMP_TO_EDGE（Neumann 反射）而非硬墙 Dirichlet；短时演示
 *      无影响，长时边界反射会污染（波包抵达边窗 ≈L/2/v 时间后）。
 *   3. 谐振子阱在 |V|>vcap 处截断（本预设参数下截断点在波包尾部之外，
 *      影响 <1e-4，但严格说阱是截断的）。
 *   4. 离散本征态与解析本征态差 O(h²)——「松弛」按钮的作用即收敛到离散态。
 *   5. 费米子「弹开」是**交换相互作用**（无实作用力时的密度效应），不是
 *      经典碰撞；Tonks–Girardeau 精确映射不在本轮范围。
 * ========================================================================== */

/* ---------- 布局约定（单一真值）----------
   CPU 状态 = 两个 **连续** Float64Array(L²)：re[k]、im[k]，k = idx(L,i,j) = j·L+i
   （i=x₁ 列、j=x₂ 行）。交错只在 GPU 上传/回读边界做（two-body.js upload/splitField）。
   R72 首版 tbMakeWave 用 2·(jL+i) 交错、tbApplyH 用连续索引——两套坐标混用，
   演化读错元素；统一后所有 CPU 函数（MakeWave/ApplyH/Kdk/Measure/Relax/SymErr）
   共用本 idx。 */
const idx = (L, i, j) => j * L + i;

/* 势场（CPU 与 GLSL 同源：GLSL 不重算势，页面把本函数烘焙成 R32F 纹理
   uPot 供 kick/drift 采样——单源真值，改这里即全场生效） */
/* 势阱刷的势：Σ v·exp(−(x−xₖ)²/w²)（共享 1D 轴，两个粒子同形；v<0 为阱、v>0 为垒） */
function tbWellSum(x, P){
  const ws = P && P.wells;
  if (!ws || !ws.length) return 0;
  let v = 0;
  for (let k = 0; k < ws.length; k++){
    const w = ws[k], r = x - w.x;
    v += w.v * Math.exp(-(r * r) / (w.w * w.w));
  }
  return v;
}
function tbPot1(x, P){
  let v = 0;
  if (P.trap){
    const r = x - P.xc;
    v = Math.min(0.5 * P.omega * P.omega * r * r, P.vcap);
  }
  /* 势阱刷与谐振子阱**叠加**（与主页势刷 + 主槽的关系一致）；trap=0 时只有势阱 */
  return v + tbWellSum(x, P);
}
function tbPot2(x, P){
  const r = x - P.xc;
  const bump = P.bumpH * Math.exp(-(r * r) / (P.bumpW * P.bumpW));
  return (1 + P.eps) * tbPot1(x, P) + P.eps * bump;
}
/* 全势 V(x₁,x₂)（含格点接触项 g·δ_{x₁=x₂}） */
function tbV(i, j, P){
  let V = tbPot1(i, P) + tbPot2(j, P);
  if (i === j) V += P.g;
  return V;
}
/* 预计算整张 V 表（L²，float64）：tbApplyH/tbKdkStep/tbRelax/tbEnergy 都可选传，
   避免每 texel 每步调 exp/min（JS 下是数量级差距；物理与 tbV 逐字同值）。 */
function tbMakeVArray(L, P){
  const V = new Float64Array(L * L);
  const p1 = new Float64Array(L), p2 = new Float64Array(L);
  for (let i = 0; i < L; i++){ p1[i] = tbPot1(i, P); p2[i] = tbPot2(i, P); }
  for (let j = 0; j < L; j++) for (let i = 0; i < L; i++)
    V[j * L + i] = p1[i] + p2[j] + (i === j ? P.g : 0);
  return V;
}

/* ---------- H·ψ（5 点交叉 stencil ×2 轴 + 势；CLAMP_TO_EDGE = Neumann 闭合） ----------
   H = −uK·∇² + V（∇² 取 lap = Σ邻居 − 4c）——与引擎 TPL_EVOLVE 的
   kineticE 默认 '-uK*lap' 同号；漏掉负号会让动能变负、谱下界跑到 −4，R72
   首版冒烟（E₀=0.000175 vs 理论 0.04、松弛收敛到 E=−3.98）即由此外露。 */
function tbApplyH(re, im, L, P, outRe, outIm, Varr){
  const uK = P.uK;
  for (let j = 0; j < L; j++){
    const jm = (j > 0 ? j - 1 : 0), jp = (j < L - 1 ? j + 1 : L - 1);
    const row = j * L;
    for (let i = 0; i < L; i++){
      const im0 = (i > 0 ? i - 1 : 0), ip = (i < L - 1 ? i + 1 : L - 1);
      const k = row + i;
      const cr = re[k], ci = im[k];
      const lr = re[row + im0] + re[row + ip] + re[jm * L + i] + re[jp * L + i] - 4 * cr;
      const li = im[row + im0] + im[row + ip] + im[jm * L + i] + im[jp * L + i] - 4 * ci;
      const V = Varr ? Varr[k] : tbV(i, j, P);
      outRe[k] = -uK * lr + V * cr;
      outIm[k] = -uK * li + V * ci;
    }
  }
}

/* ---------- 一步 KDK（状态即 (u,v)=(Reψ,Imψ)，无独立速度；与 GPU 三 pass 逐式同构） ----------
   iψ'=Hψ 拆成 u'=Hv、v'=−Hu 的一阶系统，Strang 分裂（与引擎 TPL_EVOLVE 的
   uUpdateV 序列逐字同构）：
     kick1: v ← v − (dt/2)·H·u      （只改 Im 通道）
     drift: u ← u + dt·H·v          （只改 Re 通道；**左乘 H**，不是 u+dt·v）
     kick2: v ← v − (dt/2)·H·u
   H 为实算符 ⟹ 通道可分：H·u 只依赖 re、H·v 只依赖 im（tbApplyH 同时算两者，
   各取所需）。R72 首版把 (re,im) 之外再挂一对"速度"数组并置零，等于丢掉了
   初态 Imψ 的相位信息——600 子步范数掉到 0.484，冒烟即拦下。 */
function tbKdkStep(re, im, L, P, dt, Varr){
  const h = dt / 2;
  const N = re.length;
  const hRe = new Float64Array(N), hIm = new Float64Array(N);
  /* kick1: im −= h·H·re */
  tbApplyH(re, im, L, P, hRe, hIm, Varr);
  for (let k = 0; k < N; k++) im[k] -= h * hRe[k];
  /* drift: re += dt·H·im */
  tbApplyH(re, im, L, P, hRe, hIm, Varr);
  for (let k = 0; k < N; k++) re[k] += dt * hIm[k];
  /* kick2: im −= h·H·re（新 re） */
  tbApplyH(re, im, L, P, hRe, hIm, Varr);
  for (let k = 0; k < N; k++) im[k] -= h * hRe[k];
}

/* ---------- 初态：单粒子波包 + 对称/反对称化 ---------- */
/* 高斯波包 φ(x)=exp(−(x−x₀)²/2σ²)·e^{ik₀x}（未归一化，调用方统一离散归一化） */
function packet(x, x0, k0, sig){
  const r = x - x0;
  return { re: Math.exp(-(r * r) / (2 * sig * sig)) * Math.cos(k0 * x),
           im: Math.exp(-(r * r) / (2 * sig * sig)) * Math.sin(k0 * x) };
}
/* 谐振子解析本征函数 φₙ(x)（实；NₙHₙ(α(x−xc))e^{−α²(x−xc)²/2}，α=√ω） */
function tbHarmonicEigen(n, L, omega, xc){
  const alpha = Math.sqrt(omega);
  const out = new Float64Array(L);
  const H = [z => 1, z => 2 * z, z => 4 * z * z - 2, z => 8 * z * z * z - 12 * z];
  const norm = Math.pow(alpha / Math.PI, 0.25) / Math.sqrt(Math.pow(2, n) * [1, 1, 2, 6][n]);
  for (let i = 0; i < L; i++){
    const z = alpha * (i + 0.5 - xc);
    out[i] = norm * H[n](z) * Math.exp(-0.5 * z * z);
  }
  return out;
}

/* 初态参数解析 + 钳制（页面滑块与 URL 共用；tbOrbits/tbInitInfo/tbMakeWave 同源）。
   —— σ/k₀/d/r₀ 四个旋钮的合法区间写在这里，不散落在页面里。
   d 的上限按「两侧还留得下 3σ 的尾部」定：d ≤ L−1−6σ（同 fmt 下 σ 大 ⟹ 间距自动收窄），
   下限保证两个包不重叠到分不开（d ≥ 2σ，否则两个包基本是同一团东西）。 */
function tbInitParams(L, presetKey, opts = {}){
  const pr = TB_PRESETS[presetKey] || TB_PRESETS.cross;
  const xc = (L - 1) / 2;
  if (pr.eigen) return { eigen: true, omega: opts.omega ?? pr.omega, sigma: 0, k0: 0, d: 0, r0: 0 };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  if (pr.custom){
    /* 点选口径：中心限制在 [3σ+0.5, L−1−3σ−0.5]（整包留在场内），动量 ±k₀（k₀ 走同一套钳制）。
       两个粒子共用 σ（页面只有一根宽度滑块）；位置各自独立。 */
    const sigma = clamp(opts.sigma ?? pr.sigma, 1.5, Math.max(1.5, (L - 1) / 6));
    const k0 = clamp(opts.k0 ?? pr.k0, 0, 1.5);
    const lo = 3 * sigma + 0.5, hi = (L - 1) - 3 * sigma - 0.5;
    const pos = (v, dflt) => clamp(Number.isFinite(v) ? v : dflt, Math.min(lo, hi), Math.max(lo, hi));
    return {
      custom: true, eigen: false, omega: opts.omega ?? pr.omega, sigma, k0, d: 0, r0: 0,
      xa: pos(opts.xa, pr.customX ?? (xc - pr.d / 2)),
      xb: pos(opts.xb, pr.customY ?? (xc + pr.d / 2)),
      ka: +k0, kb: -k0,
    };
  }
  let sigma = clamp(opts.sigma ?? pr.sigma, 1.5, Math.max(1.5, (L - 1) / 6));
  /* 注：σ > (L−1)/8 时「d ≥ 2σ」与「3σ 尾部留白」无法同时满足 ⟹ margin 必然 < 0，
     页面 HUD 会如实标红（不禁用，让人看见边界截断的代价）。 */
  const r0min = 1, r0max = Math.max(2, xc - 2 - 3 * sigma);
  const r0 = clamp(opts.r0 ?? pr.r0, r0min, r0max);
  const dmin = Math.max(2 * sigma, 2), dmax = Math.max(dmin, (L - 1) - 6 * sigma);
  const d = clamp(opts.d ?? pr.d, dmin, dmax);
  const k0 = clamp(opts.k0 ?? pr.k0, 0, 1.5);
  return { eigen: false, sigma, d, k0, r0, omega: opts.omega ?? pr.omega };
}

/* 两个单粒子轨道（1D，长度 L）：返回 {A:{re,im}, B:{re,im}, xa, xb, ka, kb, sigma,…}。
   makeWave / tbInitInfo / 页面 HUD / Node 套件全部走这里——初态只有一处真值。 */
function tbOrbits(L, presetKey, opts = {}){
  const pr = TB_PRESETS[presetKey] || TB_PRESETS.cross;
  const q = tbInitParams(L, presetKey, opts);
  const stats = opts.stats || 'boson';
  const xc = (L - 1) / 2;
  if (q.eigen){
    /* 玻色 (0,0) 基态（E=ω）；费米 (0,1) 斯莱特态（E=2ω，最低反对称态） */
    const na = 0, nb = stats === 'boson' ? 0 : 1;
    const A = tbHarmonicEigen(na, L, q.omega, xc), B = tbHarmonicEigen(nb, L, q.omega, xc);
    const re = a => ({ re: Float64Array.from(a), im: new Float64Array(L) });
    return { ...q, na, nb, xa: xc, xb: xc, ka: 0, kb: 0, A: re(A), B: re(B) };
  }
  const xa = q.custom ? q.xa : (pr.trap ? xc - q.r0 : xc - q.d / 2);
  const xb = q.custom ? q.xb : (pr.trap ? xc + q.r0 : xc + q.d / 2);
  const ka = q.custom ? q.ka : (pr.trap ? 0 : +q.k0);
  const kb = q.custom ? q.kb : (pr.trap ? 0 : -q.k0);
  const arr = (x0, k) => {
    const o = { re: new Float64Array(L), im: new Float64Array(L) };
    for (let i = 0; i < L; i++){ const p = packet(i + 0.5, x0, k, q.sigma); o.re[i] = p.re; o.im[i] = p.im; }
    return o;
  };
  return { ...q, xa, xb, ka, kb, A: arr(xa, ka), B: arr(xb, kb) };
}

/** 初态元信息（页面 HUD + 套件共用）：
 *    overlap = |⟨a|b⟩|²（离散归一化重叠）
 *    hbt     = 玻色对角质量 / 可区分对角质量 = 2/(1+overlap)（**不是恒为 2**）
 *    margin  = 左包到左边界、右包到右边界两者较小者减去 3σ；<0 ⟹ 尾部被 CLAMP 边界切
 *    sep     = 两包中心距（texel）
 *  这些量全部由 tbOrbits 的**同一份**离散轨道算出（不是另写一套公式）。 */
function tbInitInfo(L, presetKey, opts = {}){
  const o = tbOrbits(L, presetKey, opts);
  const dot = (u, v) => {
    let sr = 0, si = 0, nu = 0, nv = 0;
    for (let i = 0; i < L; i++){
      sr += u.re[i] * v.re[i] + u.im[i] * v.im[i];
      si += u.re[i] * v.im[i] - u.im[i] * v.re[i];
      nu += u.re[i] * u.re[i] + u.im[i] * u.im[i];
      nv += v.re[i] * v.re[i] + v.im[i] * v.im[i];
    }
    const norm = Math.sqrt(Math.max(nu * nv, 1e-300));
    return { re: sr / norm, im: si / norm, nu, nv };
  };
  const c = dot(o.A, o.B);
  const overlap = c.re * c.re + c.im * c.im;
  const out = {
    preset: presetKey, eigen: !!o.eigen, stats: opts.stats || 'boson',
    sigma: o.sigma, k0: o.k0, d: o.d, r0: o.r0, omega: o.omega,
    xa: o.xa, xb: o.xb, ka: o.ka, kb: o.kb,
    overlap, hbt: 2 / (1 + overlap), sep: Math.abs(o.xb - o.xa), margin: null,
  };
  if (!o.eigen){
    /* 对穿预设：左包离左边界、右包离右边界；自由放置（custom）两轨道各自独立，
       取四支里的最小者——否则把两条轨道都放在右半场会得到一个假的「留白」。 */
    out.margin = (o.custom
      ? Math.min(o.xa, o.xb, (L - 1) - o.xa, (L - 1) - o.xb)
      : Math.min(o.xa, (L - 1) - o.xb)) - 3 * o.sigma;
    out.custom = !!o.custom;
  }
  return out;
}

/* makeWave：返回 {re, im, norm}（norm=离散范数；<1e-9 ⟹ 页面应拒绝加载）
   opts: {stats:'boson'|'fermion', g, eps, omega, d, sigma, k0, r0}
   —— g/eps/omega 只影响势场不改变初态（初态与它们无关），此处接收是为了一并
   返回完整参数快照；真正消费它们的是演化循环。 */
function tbMakeWave(L, presetKey, opts = {}){
  const pr = TB_PRESETS[presetKey] || TB_PRESETS.cross;
  const stats = opts.stats || 'boson';
  const re = new Float64Array(L * L), im = new Float64Array(L * L);
  const orb = tbOrbits(L, presetKey, opts);
  const A = orb.A, B = orb.B;
  const fa = i => ({ re: A.re[i], im: A.im[i] });
  const fb = i => ({ re: B.re[i], im: B.im[i] });
  const sgn = stats === 'boson' ? 1 : -1;
  for (let j = 0; j < L; j++) for (let i = 0; i < L; i++){
    const a1 = fa(i), b2 = fb(j), b1 = fb(i), a2 = fa(j);
    const k = idx(L, i, j);
    re[k] = (a1.re * b2.re - a1.im * b2.im + sgn * (b1.re * a2.re - b1.im * a2.im)) / Math.SQRT2;
    im[k] = (a1.re * b2.im + a1.im * b2.re + sgn * (b1.re * a2.im + b1.im * a2.re)) / Math.SQRT2;
  }
  let norm = 0;
  for (let k = 0; k < re.length; k++) norm += re[k] * re[k] + im[k] * im[k];
  if (norm > 1e-18){ const s = 1 / Math.sqrt(norm); for (let k = 0; k < re.length; k++){ re[k] *= s; im[k] *= s; } norm = 1; }
  return { re, im, norm };
}

/* ---------- 测量（readback 后直接消费；返回一阶边缘密度 n₁/n₂） ---------- */
function tbMeasure(re, im, L){
  let norm = 0, exch = 0, diagMass = 0, diagMax = 0, peak = 0;
  const n1 = new Float64Array(L), n2 = new Float64Array(L);
  for (let j = 0; j < L; j++) for (let i = 0; i < L; i++){
    const k = idx(L, i, j), kk = idx(L, j, i);
    const p = re[k] * re[k] + im[k] * im[k];
    norm += p; peak = Math.max(peak, p);
    n1[i] += p; n2[j] += p;
    if (i === j){ diagMass += p; diagMax = Math.max(diagMax, p); }
    /* ⟨P⟩ = Σ Re(ψ*(i,j)·ψ(j,i)) */
    exch += re[k] * re[kk] + im[k] * im[kk];
  }
  let dn = 0;
  for (let i = 0; i < L; i++) dn = Math.max(dn, Math.abs(n1[i] - n2[i]));
  return { norm, exch, diagMass, diagMax, peak, n1, n2, dn12: dn };
}

/* ---------- 能量 ⟨H⟩（实数；H 实对称 ⟹ Im 部分为 0） ---------- */
function tbEnergy(re, im, L, P, Varr){
  const hRe = new Float64Array(re.length), hIm = new Float64Array(im.length);
  tbApplyH(re, im, L, P, hRe, hIm, Varr);
  let E = 0;
  for (let k = 0; k < re.length; k++) E += re[k] * hRe[k] + im[k] * hIm[k];
  return E;
}

/* ---------- 虚时间松弛（∂ψ/∂τ=−Hψ + 归一化 + sector 投影；收敛到 sector 基态） ----------
   【sector 投影必须显式做】τ 流对 H 的多项式作用于 P 对易，精确算术下不混 sector；
   但 float64 舍入种子（~1e-16）里含对称分量，而玻色基态 E≈ω 比反对称基态 E≈2ω
   衰减更快 ⟹ 相对增长 e^{−ω·τ}，约 6000 步后反超（R72 实测：it=6000 resid=1.0e-9，
   it=12000 resid 回退到 5.9e-2、E 跌向 0.0199）。每步投影 ψ←(ψ+sym·Pψ)/2 后
   该泄漏结构性归零（与引擎 Bloch 弛豫「每步投影回目标块」同思路）。
   opts.sym: +1 玻色 / −1 费米 / 缺省 0（不投影，仅用于通用诊断）。 */
function tbRelax(re, im, L, P, opts = {}){
  /* 显式 τ 步稳定界：λ_max(H) ≈ 8uK(动能) + V_max ≤ vcap + g；取 1.7/λ 留安全余量，
     上限 0.15（收敛速率 ∝ dtτ ⟹ 默认取上限，pot72 实测 ~3000 步到残差 1e-10）。
     R72 首版固定 0.05 且 H 符号错，18750 步收敛到 E=−3.98（不可能值）——两处均修。 */
  const dtTau = opts.dtTau ?? Math.min(0.15, 1.7 / (8 * P.uK + P.vcap + P.g + 1e-9));
  const maxIters = opts.maxIters ?? 30000, tol = opts.tol ?? 1e-13;
  const checkEvery = opts.checkEvery ?? 50;   /* 分块调用（页面 30 步/帧）时传 25 */
  const sym = opts.sym ?? 0;
  const tolResid = opts.residual ?? 1e-8;     /* 残差判据（能量判据二次收敛、过早停） */
  const Varr = tbMakeVArray(L, P);
  const hRe = new Float64Array(re.length), hIm = new Float64Array(im.length);
  let E0 = tbEnergy(re, im, L, P, Varr), iters = 0, dE = 1;
  for (; iters < maxIters; iters++){
    tbApplyH(re, im, L, P, hRe, hIm, Varr);
    let nrm = 0;
    for (let k = 0; k < re.length; k++){
      re[k] -= dtTau * hRe[k]; im[k] -= dtTau * hIm[k];
      nrm += re[k] * re[k] + im[k] * im[k];
    }
    const s = 1 / Math.sqrt(nrm);
    for (let k = 0; k < re.length; k++){ re[k] *= s; im[k] *= s; }
    /* sector 投影（i<j 成对处理；费米对角置零） */
    if (sym !== 0){
      for (let j = 0; j < L; j++) for (let i = j; i < L; i++){
        if (i === j){
          if (sym < 0){ const k = idx(L, i, j); re[k] = 0; im[k] = 0; }
          continue;
        }
        const k = idx(L, i, j), kk = idx(L, j, i);
        const ar = 0.5 * (re[k] + sym * re[kk]), ai = 0.5 * (im[k] + sym * im[kk]);
        re[k] = ar; im[k] = ai; re[kk] = sym * ar; im[kk] = sym * ai;
      }
      let n2 = 0;
      for (let k = 0; k < re.length; k++) n2 += re[k] * re[k] + im[k] * im[k];
      const s2 = 1 / Math.sqrt(n2);
      for (let k = 0; k < re.length; k++){ re[k] *= s2; im[k] *= s2; }
    }
    if ((iters + 1) % checkEvery === 0){
      /* 残差判据（与最终返回同口径）：能量判据 E=E∞+gap·c² 是二次的，c=1e-5 时
         dE~1e-11 早已低于 1e-13 阈值而残差仍有 1e-7 ⟹ 单用 dE 会过早停。 */
      tbApplyH(re, im, L, P, hRe, hIm, Varr);
      let E1 = 0;
      for (let k = 0; k < re.length; k++) E1 += re[k] * hRe[k] + im[k] * hIm[k];
      let num = 0, den = 0;
      for (let k = 0; k < re.length; k++){
        const dr = hRe[k] - E1 * re[k], di = hIm[k] - E1 * im[k];
        num += dr * dr + di * di; den += hRe[k] * hRe[k] + hIm[k] * hIm[k];
      }
      const resid = Math.sqrt(num / Math.max(den, 1e-300));
      dE = Math.abs(E1 - E0) / Math.max(Math.abs(E1), 1e-12);
      E0 = E1;
      /* 只认残差：dE 在 c~1e-6 时就已 <1e-13（E=E∞+gap·c² 二次），会把残差
         3e-7 的状态判成收敛（R72 实测 3800 步即停）。 */
      if (resid < tolResid) { iters++; break; }
    }
  }
  /* 本征态残差 ‖Hψ−Eψ‖/‖Hψ‖ */
  const E = tbEnergy(re, im, L, P, Varr);
  tbApplyH(re, im, L, P, hRe, hIm, Varr);
  let num = 0, den = 0;
  for (let k = 0; k < re.length; k++){
    const dr = hRe[k] - E * re[k], di = hIm[k] - E * im[k];
    num += dr * dr + di * di; den += hRe[k] * hRe[k] + hIm[k] * hIm[k];
  }
  return { iters, energy: E, residual: Math.sqrt(num / Math.max(den, 1e-300)) };
}

/* ---------- 1D 精确自由演化（Neumann 3 点拉普拉斯余弦模闭式，机器精度） ----------
   特征向量 v_k(i)=cos(πk(i+½)/L)，特征值 λ_k=2cos(πk/L)−2（含 i=0 的 clamp
   闭合，已代入验证）；H_1D=−uK·lap ⟹ 精确演化 ψ(t)=Σ c_k e^{−i uK λ_k t} v_k。 */
function tbFreeEvolve1D(re, im, L, uK, t){
  const outRe = new Float64Array(L), outIm = new Float64Array(L);
  for (let k = 0; k < L; k++){
    const lam = 2 * Math.cos(Math.PI * k / L) - 2;   /* lap 特征值 ≤0 */
    const ph = uK * lam * t;                          /* E_k=−uK·λ ⟹ e^{−iE_k t}=e^{i uK λ t} */
    const cp = Math.cos(ph), sp = Math.sin(ph);
    let ar = 0, ai = 0, nrm = (k === 0 ? L : L / 2);
    for (let i = 0; i < L; i++){
      const v = Math.cos(Math.PI * k * (i + 0.5) / L);
      ar += v * re[i]; ai += v * im[i];
    }
    ar /= nrm; ai /= nrm;
    for (let i = 0; i < L; i++){
      const v = Math.cos(Math.PI * k * (i + 0.5) / L);
      outRe[i] += v * (ar * cp - ai * sp);
      outIm[i] += v * (ar * sp + ai * cp);
    }
  }
  return { re: outRe, im: outIm };
}

/* ---------- 对称性误差（测试用）：max|ψ(i,j) − sgn·ψ(j,i)| ---------- */
function tbSymErr(re, im, L, sgn){
  let m = 0;
  for (let j = 0; j < L; j++) for (let i = 0; i < L; i++){
    const k = idx(L, i, j), kk = idx(L, j, i);
    m = Math.max(m, Math.abs(re[k] - sgn * re[kk]), Math.abs(im[k] - sgn * im[kk]));
  }
  return m;
}

/* ---------- 场哈希（FNV-1a over float32 比特；GPU↔GPU 确定性比对用） ---------- */
function tbFieldHash(f32){
  const u = new Uint32Array(f32.buffer, f32.byteOffset, Math.floor(f32.byteLength / 4));
  let h = 0x811c9dc5;
  for (let i = 0; i < u.length; i++){ h ^= u[i]; h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}

/* ============================================================================
 * GPU shader（与上方 CPU 函数逐式同源；改任一侧必须同步另一侧并重跑 pot72/cdp72）
 *
 * 势场 V 不在 shader 里重算：页面把 tbPot1/tbPot2 烘焙成 R32F 纹理 uPot
 * （CPU 侧 float64 → 纹理 float32），kick/drift 只采样 —— 单源真值，避免
 * 两段 GLSL 各写一份 trap/bump/接触项 的漂移风险（R72 设计修订）。
 * ========================================================================== */
/* kick：v ← v − (dt/2)·H·u（只改 .y=Im 通道，.x 原样拷贝）；H = −uK·lap + V */
const TB_FS_KICK = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uU;
uniform sampler2D uPot;
uniform vec2 uTexel;
uniform float uDtHalf, uK;
void main(){
  vec2 c  = texture(uU, vUv).xy;
  vec2 xm = texture(uU, vUv - vec2(uTexel.x, 0.0)).xy;
  vec2 xp = texture(uU, vUv + vec2(uTexel.x, 0.0)).xy;
  vec2 ym = texture(uU, vUv - vec2(0.0, uTexel.y)).xy;
  vec2 yp = texture(uU, vUv + vec2(0.0, uTexel.y)).xy;
  vec2 lap = xm + xp + ym + yp - 4.0*c;
  float V = texture(uPot, vUv).r;
  float Hu = -uK*lap.x + V*c.x;
  o = vec4(c.x, c.y - uDtHalf*Hu, 0.0, 1.0);
}`;

/* drift：u ← u + dt·H·v（只改 .x=Re 通道；H 左乘 v，与引擎 uUpdateV=0 逐字同构） */
const TB_FS_DRIFT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uU;
uniform sampler2D uPot;
uniform vec2 uTexel;
uniform float uDt, uK;
void main(){
  vec2 c  = texture(uU, vUv).xy;
  vec2 xm = texture(uU, vUv - vec2(uTexel.x, 0.0)).xy;
  vec2 xp = texture(uU, vUv + vec2(uTexel.x, 0.0)).xy;
  vec2 ym = texture(uU, vUv - vec2(0.0, uTexel.y)).xy;
  vec2 yp = texture(uU, vUv + vec2(0.0, uTexel.y)).xy;
  vec2 lap = xm + xp + ym + yp - 4.0*c;
  float V = texture(uPot, vUv).r;
  float Hv = -uK*lap.y + V*c.y;
  o = vec4(c.x + uDt*Hv, c.y, 0.0, 1.0);
}`;

/* 显示：密度模式（青白辉度）/ 相位模式（色相=argψ，跨对角 π 跳变可见）+
   对角线 x₁=x₂ 琥珀缝 + 边框。bilerp 手工上采样（状态纹理必须 NEAREST，
   stencil 精确性不能让给 LINEAR）。 */
const TB_FS_DRAW = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uU;
uniform vec2 uTexel;
uniform float uScale;
uniform float uMode;
uniform float uDiagOn;
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0/3.0, 1.0/3.0))*6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}
vec4 bilerp(sampler2D t, vec2 uv, vec2 texel){
  vec2 f = fract(uv/texel - 0.5) - 0.5;
  vec2 base = (uv/texel - 0.5 - f)*texel;
  vec4 a = texture(t, base);
  vec4 b = texture(t, base + vec2(texel.x, 0.0));
  vec4 c = texture(t, base + vec2(0.0, texel.y));
  vec4 d = texture(t, base + texel);
  return mix(mix(a,b,f.x+0.5), mix(c,d,f.x+0.5), f.y+0.5);
}
void main(){
  vec2 c = bilerp(uU, vUv, uTexel).xy;
  float p = dot(c, c);
  vec3 col = (uMode > 0.5)
    ? hsv2rgb(vec3(atan(c.y, c.x)/6.28318530718 + 0.5, 0.72, 1.0))
    : vec3(0.36, 0.82, 0.98);
  float lum = 1.0 - exp(-p*uScale);
  vec3 img = col*lum + vec3(0.016, 0.024, 0.045);
  if (uDiagOn > 0.5){
    float d = abs(vUv.x - vUv.y)*0.70710678;
    float w = max(fwidth(d), 1e-5);
    img += vec3(0.98, 0.75, 0.14)*smoothstep(1.6*w, 0.0, d)*0.9;
  }
  vec2 e = min(vUv, 1.0 - vUv);
  float edge = min(e.x, e.y);
  img += vec3(0.13, 0.2, 0.3)*smoothstep(0.004, 0.0, edge)*0.8;
  o = vec4(img, 1.0);
}`;

/* ============================================================================
 * two-body.js — R72 双粒子构型空间页（two-body.html 入口）
 *
 * 与主页（QuantumField）的关系：共用 src/core/gl.js（GL 引导/Program/Quad/
 * RG32F 目标）与 src/core/styles.js（CSS 变量与 reset），物理内核为
 * src/physics/twobody.js（CPU 镜像与 GLSL 同源）。主页顶栏有切换入口。
 *
 * 页面语义：场 = |ψ(x₁,x₂)|²（或相位），x₁ 横轴、x₂ 纵轴；对角线 x₁=x₂
 * 是「重合线」（琥珀缝）——反对称态在其上恒零（泡利不相容可视化）。
 * 一阶边缘密度 n₁(x₁)=∫|ψ|²dx₂（下条）与 n₂(x₂)=∫|ψ|²dx₁（右条）：
 * 全同粒子（ε=0）时两条恒等；可区分（ε>0）时分开。
 *
 * KDK 三 pass 结构（与 twobody.js CPU 逐步同构）：
 *   kick1: u[p],v[q] → v[p]   （v += dt/2·H·u）
 *   drift: u[p],v[p] → u[q]   （u += dt·v）
 *   kick2: u[q],v[p] → v[q]   （v += dt/2·H·u）   ⟹ parity 翻转
 * 四个 RG32F 目标（u×2、v×2）NEAREST（stencil 精确性）；显示 pass 手工
 * bilerp 上采样。
 *
 * 调试句柄 window.__tb（cdp72 专用）：measure/readField/step/mirror
 * （页内 CPU 镜像对比）/compareMirror（GPU vs 页内 CPU，页内算完只回传
 * 摘要）/relaxNow。step/mirror 全部确定性接口（不依赖 rAF 时序）。
 * ========================================================================== */

const nf = (x, d = 4) => (Number.isFinite(x) ? x.toFixed(d) : '—');
const sci = (x, d = 2) => (Number.isFinite(x) ? x.toExponential(d) : '—');

      sigma: num('sigma', pr0.sigma), k0: num('k0', pr0.k0),

      xa: num('xa', NaN), xb: num('xb', NaN),

      wells: [], wellTool: q.get('welltool') === '1',
      wellV: num('wellv', TB_COMMON.wellV),
      simTime: 0, frames: 0,
    };
    if (!TB_PRESETS[this.state.preset]) this.state.preset = 'cross';
    if (!['boson', 'fermion'].includes(this.state.stats)) this.state.stats = 'boson';
    if (!Number.isFinite(this.state.xa)) this.state.xa = (L - 1) / 2 - TB_PRESETS.cross.d / 2;
    if (!Number.isFinite(this.state.xb)) this.state.xb = (L - 1) / 2 + TB_PRESETS.cross.d / 2;

    window.addEventListener('error', this._onError);
    this.frame = this.frame.bind(this);
  }

  q(s){ return this.container.querySelector(s); }
  on(t, type, fn, opts){ t.addEventListener(type, fn, opts); this._listeners.push([t, type, fn, opts]); }
  u(prog, name){
    let m = this._uloc.get(prog);
    if (!m){ m = new Map(); this._uloc.set(prog, m); }
    if (!m.has(name)) m.set(name, this.gl.getUniformLocation(prog, name));
    return m.get(name);
  }
  toast(msg, ms = 2200){
    const t = this.q('#tbToast');
    if (!t) return;
    t.textContent = msg; t.style.opacity = 1;
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => { t.style.opacity = 0; }, ms);
  }

  /* ---------- 挂载 ---------- */
  mount(){
    injectStyles();
    injectResponsive();
    const st = document.createElement('style');
    st.id = 'tb-styles'; st.textContent = TB_CSS;
    document.head.appendChild(st);
    this.buildDOM();
    this.canvas = this.q('#tbField');
    const { gl, error } = createContext(this.canvas);
    if (!gl){ this.fail(error); return this; }
    this.gl = gl;
    try {
      this.quad = new Quad(gl);
      this.initPrograms();
      this.initTargets();
      this.bindUI();
      /* 初次加载沿用 URL 参数（不重置 g/eps/omega），但初态四旋钮要先钳制：
         走 applyInit ⟹ 面板显示的 σ/k₀/d/r₀ 与真正送进引擎的值逐位相同。 */
      this.applyInit();

      this.resize();
      requestAnimationFrame(this.frame);
    } catch (err){
      this.fail((err && err.message) || String(err));
      return this;
    }
    window.__tb = this.debugHandle();
    return this;
  }

  }
