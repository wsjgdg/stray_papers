/* ===== src/core/styles.js ===== */
/* 组件样式：挂载时注入 <style id="qf-styles">（多实例只注入一次）。
   R43 修复：本字符串此前**以字面 `<style>` 开头**（自初版 9c397d0 起），
   注入用 textContent ⟹ CSS 解析器把 `<style>` 当 selector 前缀，紧接的
   `:root{…}` 被解析为「`<style> :root`」这一永不匹配的后代选择器的声明块
   ⟹ **:root 内所有 CSS 变量失效**（--txt/--dim/--mono/--panel 全空），
   于是全部 `color:var(--dim)` 等退化为浏览器默认（黑字 + Times New Roman），
   在深色半透明面板上几乎不可读——而 font-size/letter-spacing 等字面值声明
   仍生效，故长期未被察觉（旧注释「视觉零回归」的自评有误）。
   R43 CDP 实测（getComputedStyle 读 CSS 变量全为空 + h3 color=rgb(0,0,0)
   / fontFamily=Times New Roman）定位并删除该标签后，变量与字体恢复。 */
const CSS = `
  :root{
    --bg:#04060c; --panel:rgba(8,12,22,.74); --line:rgba(120,160,220,.14);
    --txt:#e6edf3; --dim:#9aa7bd; --cyan:#67e8f9; --mag:#f0abfc; --amber:#fbbf24;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
  /* ---------- 顶栏 ---------- */
  /* 布局与子元素规则已收编 core/responsive.js 的 .qtop 族；主页差异值保留： */
  .qtop[id="topbar"]{gap:14px;padding:10px 20px}
  .qtop[id="topbar"] .logo{font-size:15px}
  .qtop[id="topbar"] .eq{font-size:12.5px;letter-spacing:.02em}
  #status{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
  /* R72：双粒子构型空间页入口（与 status 同排，flex:none 防被 eq 压缩） */
  #topbar .navlink{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;flex:none;transition:all .15s;letter-spacing:.05em}
  #topbar .navlink:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  /* ---------- 左侧控制面板 ---------- */
  /* R43 修复①：原 max-height:calc(100vh−120px) ⟹ 面板底 = 100vh−44，而左下
     #desc（bottom:52px）顶部随预设描述长度变化（实测 82px 文本 ⟹ 顶 100vh−132；
     GP/Pauli 长文本 177px ⟹ 顶 100vh−229）⟹ 两者在左列重叠（最大 238×80 px）。
     修复：#desc 限高 120px + 内部滚动（高度可控），面板按最坏情况预留
     (76 顶距 + 120 desc + 52 底距 + 8 间隙 = 256) ⟹ 面板底 100vh−180 ≤ desc 顶
     100vh−172，四 viewport × 五内核实测无重叠。 */
  #panel{top:76px;left:14px;width:238px;padding:14px;z-index:10;max-height:calc(100vh - 256px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #panel::-webkit-scrollbar{width:4px}#panel::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:2px}
  .sec{margin-bottom:14px}
  .sec:last-child{margin-bottom:0}
  .sec>h3{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  /* R60 势刷轴比三连同控（grid3 单元格内的迷你标签行：名称 + 实时值） */
  .mini{font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between;gap:4px;margin:3px 0 1px;white-space:nowrap}
  .mini b{color:var(--cyan);font-weight:600;font-family:var(--mono)}
  button{font-family:var(--sans);font-size:12px;color:var(--txt);background:rgba(255,255,255,.045);
    border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;transition:all .15s;text-align:center}
  button:hover{background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.4)}
  button.on{background:rgba(103,232,249,.16);border-color:var(--cyan);color:var(--cyan)}
  button.wide{width:100%}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row label{font-size:11px;color:var(--dim);width:64px;flex:none}
  .row output{font-family:var(--mono);font-size:11px;color:var(--cyan);width:44px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(120,160,220,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 8px rgba(103,232,249,.7);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--cyan);cursor:pointer}
  select{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;outline:none}
  /* ---------- 右侧 HUD ---------- */
  #hud{top:76px;right:14px;padding:12px 14px;z-index:10;min-width:196px;font-family:var(--mono)}
  #hud .hrow{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:3px 0}
  #hud .hrow span:first-child{color:var(--dim)}
  #hud .hrow span:last-child{color:var(--txt)}
  #hud .hrow .ok{color:#4ade80}#hud .hrow .warn{color:var(--amber)}
  #hud hr{border:none;border-top:1px solid var(--line);margin:7px 0}
  /* ---------- 相位图例 ---------- */
  #legend{right:14px;bottom:52px;padding:10px 12px;z-index:10;display:flex;align-items:center;gap:12px}
  #wheel{width:84px;height:84px;border-radius:50%;border:1px solid var(--line)}
  #legend .cap{font-size:10.5px;color:var(--dim);line-height:1.7;max-width:130px}
  #legend .cap b{color:var(--cyan);font-weight:600}
  /* ---------- 底部提示 ---------- */
  #hint{left:50%;bottom:14px;transform:translateX(-50%);padding:8px 18px;z-index:10;
    font-size:11.5px;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
  #hint b{color:var(--txt);font-weight:600}
  #hint .k{font-family:var(--mono);color:var(--cyan);background:rgba(103,232,249,.1);
    border:1px solid rgba(103,232,249,.25);border-radius:4px;padding:0 5px;font-size:10.5px}
  /* ---------- 预设描述 ---------- */
  /* R43 修复②：描述文本长度随内核/预设变化（实测 82–177px 高），高度不可控会
     顶进 #panel 区域 ⟹ 限高 120px + 内部滚动：既压住几何冲突，又保留全文
     （长描述可滚动查看）。 */
  #desc{left:14px;bottom:52px;z-index:10;padding:10px 14px;max-width:340px;font-size:11.5px;
    color:var(--dim);line-height:1.65;max-height:120px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  #desc b{color:var(--amber);font-weight:600;display:block;margin-bottom:2px;font-size:12px}
  /* ---------- toast ---------- */
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
    font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.2em;opacity:0;transition:opacity .4s;
    text-shadow:0 0 18px rgba(103,232,249,.8)}
  /* ---------- 笔刷光标预览环 ---------- */
  #brushcursor{position:fixed;border:1px solid rgba(140,190,255,.85);border-radius:50%;pointer-events:none;
    display:none;z-index:15;box-shadow:0 0 10px rgba(80,140,255,.35),inset 0 0 10px rgba(80,140,255,.18)}
  /* ---------- 准星瞄准线 ---------- */
  #aim{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;pointer-events:none;display:none}
  #aim line{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4;filter:drop-shadow(0 0 4px rgba(251,191,36,.8))}
  #aim circle{fill:none;stroke:var(--amber);stroke-width:1;opacity:.7}
  #aim text{fill:var(--amber);font-family:var(--mono);font-size:11px}
  /* ---------- 角标 ---------- */
  .corner{position:fixed;width:22px;height:22px;z-index:4;pointer-events:none;opacity:.5}
  .corner::before,.corner::after{content:"";position:absolute;background:var(--cyan)}
  .corner::before{width:100%;height:1px}.corner::after{width:1px;height:100%}
  #c1{top:8px;left:8px}.corner::before{top:0}#c1::after{left:0}
  #c2{top:8px;right:8px}#c2::before{top:0}#c2::after{right:0}
  #c3{bottom:8px;left:8px}#c3::before{bottom:0}#c3::after{left:0}
  #c4{bottom:8px;right:8px}#c4::before{bottom:0}#c4::after{right:0}
  #diag{position:fixed;left:-9999px}
  /* ---------- 透射率扫描面板 ---------- */
  .hint{font-size:10px;color:var(--dim);line-height:1.5;flex:1}
  /* ---------- hint 可折叠（R45，用户选定方案 a）----------
     运行时升级（app.js upgradeHints）：原 hint 文本搬进 .hintBody，
     前置 .hintToggle 按钮。默认折叠（长 hint 是面板溢出的元凶，R43
     实测 2D 697px / 3D 1673px / GP 980px）；展开态经 localStorage
     持久化（key = hint 文本摘要，跨内核/面板切换稳定）。 */
  .hintToggle{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--dim);font:inherit;font-size:10px;cursor:pointer;padding:0;margin:0;
    letter-spacing:.05em}
  .hintToggle:hover{color:var(--cyan)}
  .hintToggle:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .hint .hintBody{display:none}
  .hint.open .hintBody{display:block}
  .hint.open .hintToggle{color:var(--cyan);margin-bottom:3px}
  /* ---------- sec 级分区折叠（R48，README「后续方向」a2）----------
     与 hint 折叠（R45）同模式：h3 变切换头（class 驱动显隐），展开态经
     localStorage 持久化（qf.secs.state，key = sec id / h3 摘要）。
     默认折叠：四个扫描面板 sec——R45 实测（1440×900，overflow 口径
     scrollH−clientH）溢出大头正是区块结构：2D 687 / 3D 1403 / GP 813，
     canvas 硬高占其中 820px。与门控正交：syncControls 按内核切 sec 的
     style.display（整区显隐），本折叠切 sec 内部子元素，互不竞争。
     扫描开始（GenericScanner.start → app.expandSecFor）自动展开所在
     sec——用户点了「开始扫描」就应看到 canvas 与状态行。
     特异度注意：规则须带 #panel 前缀——四个扫描 canvas 的 display:block
     规则（ID 选择器 1,0,0）会压过裸 .sec.collapsed > *:not(h3)（0,1,1）
     ⟹ 折叠态 canvas 仍显示（cdp48 首轮实证）。 */
  #panel .sec.collapsed > *:not(h3){display:none}
  .sec > h3{cursor:pointer;user-select:none;-webkit-user-select:none}
  .sec > h3:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  .sec > h3::before{content:"▾ ";color:var(--dim);font-weight:400}
  .sec.collapsed > h3::before{content:"▸ "}
  /* R48：range flex item 默认 min-width:auto（Chrome ~129px 固有最小宽）
     ⟹ label64+gap+range129+gap+output44 超出面板内容宽 236px ~31px，
     面板被迫横向滚动（R43 起既有缺陷，R45 溢出台账只记了纵向）。 */
  input[type=range]{min-width:0}
  /* R48 a3：扫描 canvas 统一 width:100%（修复 paramScanCanvas/scanCanvas3/
     slitScanCanvas 三个缺规则 ⟹ 420px attribute 宽在 210px 面板内容区横向
     溢出、面板被迫横向滚动——R45 溢出台账只记了纵向，此项本轮补录）；
     attribute 高 260/300 → 180（_plot 全部按 cv.width/height 自适应绘制，
     内部分辨率 420×180 不变、显示高 210×180/420=90px，展开态每块省 40–60px）。 */
  #scanCanvas,#paramScanCanvas,#scanCanvas3,#slitScanCanvas{width:100%;margin-top:6px;
    border:1px solid var(--line);border-radius:8px;background:rgba(4,8,16,.4);display:block}
  #scanStat{font-size:10px;color:var(--cyan);font-family:var(--mono);flex:1;line-height:1.45}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
  /* ---------- 面板双向收起（R56，「试验场全屏」）----------
     左列 #panel(上) + #desc(下)、右列 #hud(上) + #legend(下) 各为一组，
     整组 transform 滑出屏幕——#gl 本就 position:fixed 全屏，滑出即露全场，
     无需 resize/重绘（画布尺寸不变，只是不再被面板遮挡）。
     边缘拉手 .qf-tab 常驻（z-index 11 压面板 10，只压边框+padding 6px，
     不挡内容）；点击拉手或快捷键 [ / ] 切换；状态经 localStorage
     qf.panels.state = {left,right}（true=展开，缺省/坏值默认全展开）。
     滑出态 pointer-events:none ⟹ 画布交互全程不被残留命中区遮挡。 */
  #panel,#desc,#hud,#legend{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .24s}
  body.qf-hide-left #panel,body.qf-hide-left #desc{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  body.qf-hide-right #hud,body.qf-hide-right #legend{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  .qf-tab{position:fixed;top:50%;transform:translateY(-50%);z-index:11;width:20px;height:60px;
    padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:14px;line-height:1;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:0 10px 10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 4px 16px rgba(0,0,0,.4);transition:color .15s,border-color .15s}
  #tabL{left:0}
  #tabR{right:0;border-radius:10px 0 0 10px}
  .qf-tab:hover{color:var(--cyan);border-color:rgba(103,232,249,.45)}
  @media (max-width:1100px){#legend,#desc{display:none}}
`;

function injectStyles(){
  if (document.getElementById("qf-styles")) return;
  const st = document.createElement("style");
  st.id = "qf-styles";
  st.textContent = CSS;
  document.head.appendChild(st);
}

/* ===== src/core/responsive.js ===== */
/* ============================================================================
 * responsive.js — 全站响应式公共模块（R94 引入）
 *
 * 背景：R90 给 12 个子页各写了一式三份的顶栏渐进收缩（1500/1400/900 三档
 * 媒体查询只换 id 前缀，36 处重复）；小屏更只做到「≤900 隐导航」——导航全隐
 * 等于 12 页互链在窄桌窗/平板/手机上不可达，且左面板（~238px 固定）+ 右 HUD
 * （≥200px）在 390px 竖屏下必重叠。R94 收编 + 补齐：
 *   1. 顶栏三档（1500/1400/900）收归公共类 .qtop——12 页删除本地副本；
 *   2. ≤900 导航改汉堡抽屉：桌面 .qnav 用 display:contents 透明包裹（a 们
 *      仍是 .qtop 的 flex item，布局逐位不变），手机变全屏下拉网格；
 *   3. ≤860 手机段：面板/HUD 转底部全宽 sheet（内联样式覆盖各页 id 规则，
 *      退出时按 dataset.qfRestore 精确还原），stage 内联几何让位顶栏与 dock；
 *   4. 底部 dock 三态（控制/读数/全屏），matchMedia 跨越 860px 自动进出。
 *
 * 各页接入约定（一次性）：
 *   - 顶栏/面板/HUD/stage/hint 容器分别加类 qtop/qpanel/qhud/qstage/qhint；
 *   - mount() 里调用 injectResponsive()（幂等；无这些类的页面静默跳过）。
 * ========================================================================== */

const RESP_CSS = `
  /* ---- 顶栏基础（收编自 12 子页本地规则；.eq i 取主页口径 mag，
       amber 派的 5 页保留本地差异行） ---- */
  .qtop{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:16px;padding:9px 18px;z-index:10;white-space:nowrap}
  .qtop .logo{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.12em;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  .qtop .eq{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .qtop .eq b{color:var(--cyan);font-weight:600}
  .qtop .eq i{color:var(--mag);font-style:italic}
  .qtop a{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;transition:all .15s}
  .qtop a:hover{color:var(--cyan);border-color:rgba(103,232,249,.4)}
  .qtop a.cur{color:var(--mag);border-color:rgba(240,171,252,.45)}
  /* ---- 桌面：.qnav 透明包裹（a 们仍是 .qtop 的直接 flex item） ---- */
  .qnav{display:contents}
  .qburger{display:none}
  /* ---- 顶栏渐进收缩（收编自 R90 的 12 页本地副本，规则逐字保留） ---- */
  /* 特异性：.qtop.qtop（0,2,0）压各页差异行 .qtop[id="xxTop"]（0,2,0）靠
     本 style 后注入（同权重比源码序）；子元素 .qtop.qtop X（0,3,x）压
     .qtop[id="xxTop"] X（0,2,x）。 */
  @media (max-width:1500px){.qtop.qtop{gap:10px;padding:7px 14px}.qtop.qtop .logo{font-size:13px}
    .qtop.qtop a{font-size:10px;padding:2px 7px}}
  @media (max-width:1400px){.qtop.qtop .eq{display:none}.qtop.qtop{gap:8px}
    .qtop.qtop a{font-size:9.5px;padding:2px 6px}}
  /* ---- ≤900：导航收进汉堡抽屉（替代原「隐导航」） ---- */
  @media (max-width:900px){
    /* position:relative + z-index:11：burger 须压在抽屉（z:9）之上。二者同是
       .qtop  stacking context 的子元素，.qtop 的 z:10 只管对外层级——初版漏了
       这条，实测 elementFromPoint 命中 .qnav，真实手指点汉堡位置无效。
       尺寸 40×36：R95 实测 30×26 只过 WCAG 2.5.8 AA（24px），离 44px 舒适线
       仍远；顶栏 ≤900 时只剩 burger + logo（eq 已隐），放大不挤位。 */
    .qburger{display:flex;align-items:center;justify-content:center;flex:none;
      position:relative;z-index:11;
      width:40px;height:36px;padding:0;font-size:17px;line-height:1}
    .qnav{display:none;position:fixed;top:0;left:0;right:0;z-index:9;
      grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:7px;
      padding:52px 12px 14px;max-height:100vh;max-height:100dvh;overflow-y:auto;
      background:rgba(4,6,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line)}
    .qtop.open .qnav{display:grid}
    /* !important 收口：抽屉是覆盖层上下文，页面级顶栏规则不得泄漏进来——主页
       id 级 #topbar .navlink（styles.js，11px/3px 8px）与 1400 档 .qtop.qtop a
       （9.5px/2px 6px）特权都高于类选择器（id 赢 (0,3,1)），升维打不过；实测
       抽屉链接曾被压到 20px 高（< WCAG 2.5.8 AA 的 24px）。13×1.25+14×2
       = 44.25px，同时满足 44px 触摸目标。仅 ≤900 生效。 */
    .qnav a{font-size:13px!important;padding:14px 6px!important;line-height:1.25!important;text-align:center}
  }
  /* ---- ≤860 手机段：底部 dock 三态（控制/读数/全屏；dock 三态常驻，
     off 态退让为半透明——曾把 off 态 dock 也 display:none，实测成死胡同：
     默认即全屏且无任何 UI 路径回到控制/读数，只能旋转屏幕或刷新） ---- */
  .qf-dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:none;
    gap:6px;padding:5px 8px;z-index:14;transition:opacity .18s;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  html.qf-mobile .qf-dock{display:flex}
  /* 按钮 padding 5px 10px → 8px 12px：R95 实测 29px 高，放大到 ≈31px（仍不过
     44px 舒适线——再大 dock 总高将顶破 44px 预留带，需连带改 stage/sheet 的
     让位常量，权衡后记为遗留）。dock 总高 43.2 ≤ 44 带不变。 */
  .qf-dock button{font-size:11px;padding:8px 12px;border-radius:6px;white-space:nowrap}
  html.qf-mobile body.qf-m-controls .qhud{display:none}
  html.qf-mobile body.qf-m-readout .qpanel{display:none}
  html.qf-mobile body.qf-m-off .qpanel,html.qf-mobile body.qf-m-off .qhud{display:none}
  html.qf-mobile body.qf-m-off .qf-dock{opacity:.4}
  html.qf-mobile body.qf-m-off .qf-dock:active{opacity:.85}
  /* ---- ≤860 手机段：hint 换行防溢出、给 dock 让位；hud sheet 统一可滚
     （各页 #xxHud 的 overflow 不一致：hubbard/shor 无声明 ⟹ 内容超 46vh
      时静默裁切，实测 shor 已临界 387>386；gatenoise 的 .sfill 在 .strack
      内 top:0;bottom:0，加滚动不裁切——13 页 × 2 视口实测确认） ---- */
  @media (max-width:860px){
    /* sheet 最大高经 CSS 变量下发：竖屏 46vh；横屏（844×390 等）放 64vh——
       R95 实测横屏面板带仅 179px 过小。inline max-height 引用 var()，
       媒体状态变化自动生效，无需 JS 监听 orientationchange。
       注：此处只 vh 不 dvh——max-height 非布局临界尺寸（内容可滚），
       工具栏收放的抖动可接受；stage 高度（关键尺寸）仍保持 dvh 双声明。 */
    :root{--qf-sm:46vh}
    .qhint{white-space:normal;max-width:calc(100vw - 20px);bottom:40px;
      font-size:10.5px;line-height:1.5}
    .qhud{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,160,220,.25) transparent}
  }
  @media (max-width:860px) and (orientation:landscape){:root{--qf-sm:64vh}}
  @media (prefers-reduced-motion:reduce){.qf-dock{transition:none}.qtop a{transition:none}}
`;

const $ = (s, r = document) => Array.from(r.querySelectorAll(s));
const MQ = '(max-width:860px)';
/* dvh 双声明：移动浏览器工具栏收放时 100vh 按大视口计算 ⟹ stage/sheet 带
   跳动（iOS 经典病）。旧浏览器忽略不认识的 dvh 行、保留 vh 行（CSS 错误
   处理即 fallback，无需 @supports）。dvh 支持：Safari 15.4+/Chrome 108+/
   Firefox 101+，低于本项目 README 地板 Safari 16.4。
   sheet 的 max-height 走 var(--qf-sm)（竖 46vh/横 64vh，见 ≤860 段注释）。 */
const SHEET_G = 'position:fixed;left:6px;right:6px;width:auto;top:auto;bottom:44px;max-height:var(--qf-sm,46vh);z-index:12';
const STAGE_G = 'position:fixed;left:6px;right:6px;width:auto;top:48px;transform:none';

/* ---- 手机段几何三件套（R98 提为模块级：原为 injectResponsive 内闭包，
   仅覆盖 enhance 时刻存在的元素；QEC hub 切换 mode 是整块换 DOM，需导出
   重放入口给壳调用。行为与原闭包逐字一致） ---- */
function syncStage(){
  if (!document.documentElement.classList.contains('qf-mobile')) return;
  /* dock 三态常驻 ⟹ 舞台恒让出底部 44px dock 带（off 态不再压缩到 8px） */
  $('.qstage').forEach(el => {
    el.style.height = 'calc(100vh - 48px - 44px)';
    el.style.height = 'calc(100dvh - 48px - 44px)'; /* 旧浏览器忽略此行保留上一行 */
  });
}
function sheetify(root = document){
  $('.qpanel,.qhud', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + SHEET_G;
  });
  $('.qstage', root).forEach(el => {
    if (el.dataset.qfRestore != null) return;
    el.dataset.qfRestore = el.getAttribute('style') || '';
    el.style.cssText += ';' + STAGE_G;
  });
  syncStage();
}
function unsheetify(){
  $('.qpanel,.qhud,.qstage').forEach(el => {
    if (el.dataset.qfRestore == null) return;
    el.setAttribute('style', el.dataset.qfRestore);
    delete el.dataset.qfRestore;
  });
  syncStage();
}

/** R98：hub 切 mode 后，对新插入的 .qpanel/.qhud/.qstage 重放手机段几何
 *  （桌面宽度为空操作；幂等——已带 qfRestore 的元素跳过）。 */
function refreshMobileGeometry(root = document){
  if (!matchMedia(MQ).matches) return;
  sheetify(root);
}

function injectResponsive(){
  /* ---- 样式只注入一次（同步，不等 DOM） ---- */
  if (!document.getElementById('qf-resp')){
    const st = document.createElement('style');
    st.id = 'qf-resp';
    st.textContent = RESP_CSS;
    document.head.appendChild(st);
  }
  if (document.body.dataset.qfResp) return;
  document.body.dataset.qfResp = '1';

  /* ---- DOM 增强推迟到 microtask ----
     各页 mount() 的调用时序是 injectStyles() → injectResponsive() →
     构建 DOM（insertAdjacentHTML / container.innerHTML）——本函数若同步
     增强，.qtop 尚不存在（汉堡/抽屉无从包起），且 body.innerHTML 整体
     重写会把已 append 的 dock 清掉（index/two-body/hubbard 三页实测）。
     mount() 是同步函数 ⟹ microtask 必在其返回后执行：那时 DOM 已就绪，
     三种构建方式（insertAdjacentHTML / innerHTML / buildDOM）均安全。 */
  const enhance = () => {

  /* ---- 1. 顶栏增强：包 .qnav + 注入汉堡（幂等） ---- */
  $('.qtop').forEach(top => {
    if (top.querySelector('.qburger')) return;
    const nav = document.createElement('nav');
    nav.className = 'qnav';
    $('a', top).forEach(a => nav.appendChild(a));
    top.appendChild(nav);
    const b = document.createElement('button');
    b.className = 'qburger';
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', '打开导航');
    b.textContent = '☰';
    /* 开合状态同步 aria-expanded / aria-label（a11y：初版恒为「打开导航」） */
    const setOpen = open => {
      top.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
    };
    b.addEventListener('click', e => { e.stopPropagation(); setOpen(!top.classList.contains('open')); });
    top.insertBefore(b, top.firstChild);
    /* 抽屉内任意点击即收起：点链接本就导航，点 backdrop 现在也能取消
       （初版只认链接 ⟹ 打开后除了导航无法退出，实测确认的死胡同） */
    nav.addEventListener('click', () => setOpen(false));
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.qtop')) $('.qtop.open').forEach(t => t.classList.remove('open'));
  });
  /* Escape 收抽屉 + 焦点回汉堡（键盘用户路径；初版无 Escape） */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    $('.qtop.open').forEach(t => {
      t.classList.remove('open');
      const b = t.querySelector('.qburger');
      if (b){ b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', '打开导航'); b.focus(); }
    });
  });

  /* ---- 2. 底部 dock（三态常驻：默认 off = 舞台优先，dock 退让为半透明） ---- */
  const dock = document.createElement('div');
  dock.className = 'qf-dock';
  dock.innerHTML = '<button type="button" data-tab="controls">⚙ 控制</button>'
    + '<button type="button" data-tab="readout">◫ 读数</button>'
    + '<button type="button" data-tab="off">✕ 全屏</button>';
  document.body.appendChild(dock);
  dock.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.body.classList.remove('qf-m-controls', 'qf-m-readout', 'qf-m-off');
    document.body.classList.add('qf-m-' + b.dataset.tab);
    syncStage();
  });
  document.body.classList.add('qf-m-off');

  /* ---- 3. 手机段几何：内联覆盖各页 id 规则，退出精确还原 ---- */
  const mq = matchMedia(MQ);
  const apply = m => {
    document.documentElement.classList.toggle('qf-mobile', m);
    if (m) sheetify(); else unsheetify();
  };
  if (mq.addEventListener) mq.addEventListener('change', ev => apply(ev.matches));
  else if (mq.addListener) mq.addListener(ev => apply(ev.matches)); /* 旧 Safari */
  apply(mq.matches); /* 页面可能直接在手机宽度打开 */

  };
  queueMicrotask(enhance);
}

/* ===== src/core/nav.js ===== */
/* ============================================================================
 * nav.js — 全站导航单一数据源（R85 引入）
 *
 * 背景：R79 加 Shor 页时漏掉了六页的导航链接，R80 后主页顶栏又停了更——
 * 每加一页就要手工同步 12 处硬编码导航，漏一处就是一个「导航洞」
 * （cdp74–81 的 nav.length 断言因此腐烂了四轮）。R85 起全站统一从这里取。
 *
 * 约定：
 *   - NAV = [[href, label], ...] 按站点顺序；当前页由 navHtml(cur) 打 cur 高亮。
 *   - 标签文案全站统一（历史上各页曾有 '← 单粒子主页' / '双粒子 ⟋' 等变体）。
 *   - 新页面只需在 NAV 追加一行 + build-standalone.mjs 的 PAGES 追加一行。
 *   - 主页顶栏（class="navlink" + title 工具提示）走 navLinksHtml()，
 *     标题文案在 NAV_TITLES，与 NAV 同源，不会再漏。
 * ========================================================================== */

/* R98：QEC 七页整合为单页 hub（qec.html?mode=rep|shor|gate|flag|rounds|cycle|family），
   NAV 由 13 条收为 7 条；六个旧页名各留跳转桩（根级 + dist），旧书签不 404。 */
const NAV = [
  ['./quantum-field.html', '主页'],
  ['./two-body.html', '双粒子 ⧉'],
  ['./hubbard.html', '哈伯德 ⛓'],
  ['./paths.html', '路径 ∿'],
  ['./qcircuit.html', '线路 ⧉'],
  ['./noise.html', '噪声 ◍'],
  ['./qec.html', '纠错 ◈'],
  ['./spin.html', '自旋链 ⇅'],
].filter(Boolean);

/** 主页顶栏各页的 title 工具提示（与 NAV 同序；缺省回退为标签文案） */
const NAV_TITLES = {
  './two-body.html': '双粒子构型空间：全同粒子 / 交换对称（R72）',
  './hubbard.html': '格点费米-哈伯德：莫特绝缘体 / 纠缠熵（R73）',
  './paths.html': '费曼路径求和：路径族 / 相位 / 双缝条纹（R74）',
  './qcircuit.html': '小规模量子线路：Bell / GHZ / QFT / Grover（R75）',
  './noise.html': '开放量子系统：T₁ 弛豫 / T₂ 退相位 / 纠缠猝死（R77）',
  './qec.html': '量子纠错 hub：重复码 / Shor 9 / 门噪声 / Flag / 多轮 / 循环 / 码族 / 表面码（R78–R85、R98 整合、R128 表面码）',
  './spin.html': '海森堡自旋链：XXZ 各向异性 / 局域场 / 淬变 / 临界纠缠（R144）',
};

/** 生成子页顶栏导航 HTML；cur = 当前页 href（打 cur 高亮，自链也在——与 flag/rounds/cycle 一致）。
 *  indent = 每行前导空白（各页模板缩进不同：6/8 空格或 div 版 2 空格）。 */
function navHtml(cur, indent = '        ') {
  return NAV.map(([h, t]) =>
    `${indent}<a href="${h}"${h === cur ? ' class="cur"' : ''}>${t}</a>`).join('\n');
}

/** 主页顶栏（#topbar）导航：class="navlink" + title；主页自身无链接。 */
function navLinksHtml(indent = '  ') {
  return NAV.filter(([h]) => h !== './quantum-field.html')
    .map(([h, t]) => `${indent}<a class="navlink" href="${h}" title="${NAV_TITLES[h] || t}">${t}</a>`)
    .join('\n');
}

/** 调试用：纯 href 列表（cdp 套件的 navLinks() 走各页自己的实现，这里供对照） */
const NAV_HREFS = NAV.map(([h]) => h);

/* ===== src/hubbard3d.js ===== */
/* hubbard3d.js — 哈伯德链的 3D 透视视图：相机 + 投影 + 拾取（纯数学，无 DOM / 无 canvas）
 *
 * 为什么单独一个模块：3D 的「对不对」是纯几何问题（正交基、透视缩放、深度排序、屏幕拾取），
 * 可以在 Node 里用解析式逐条对账（pot143），不必拖一个浏览器进来。页面只负责把算出来的
 * 屏幕坐标画成珠子/箭头/势刺。
 *
 * 坐标系（右手系）：
 *   x — 链的方向（格点 i 在 x_i 上，已归一化到固定跨度，见 hbSitePositions）
 *   y — 自旋：↑ 指向 +y，↓ 指向 −y
 *   z — 局域势 μ 的「出屏」方向：μ>0 沿 +z 长刺，μ<0 沿 −z（2D 视图里这条信息只能塞进一条色带）
 *
 * 相机：绕 y 轴 yaw、俯仰 pitch、到原点距离 dist。视线恒指原点（靶点在链中心）。
 */

const CAM_DEFAULT = { yaw: -0.62, pitch: 0.34, dist: 7.6 };
/* pitch 钳到 ±76°：再往上 up 向量就从世界 y 轴旁边擦过去，屏幕会翻面 */
const PITCH_LIM = 1.33;
const DIST_MIN = 3.2, DIST_MAX = 20;
/* 链在 3D 里的固定横向跨度（世界单位）：不同 L 都铺满画面宽度，只是格距变密 */
const CHAIN_SPAN = 6.0;

const clamp3 = (v, a, b) => (v < a ? a : (v > b ? b : v));

function hbCamDefault(){ return { ...CAM_DEFAULT }; }
function hbCamReset(){ return hbCamDefault(); }

/* 轨道旋转：dx/dy 是设备像素位移；pitch 钳制，yaw 不钳（2π 周期） */
function hbOrbit(cam, dx, dy, k = 0.0075){
  return {
    yaw: cam.yaw + dx * k,
    pitch: clamp3(cam.pitch + dy * k, -PITCH_LIM, PITCH_LIM),
    dist: cam.dist,
  };
}

/* f>1 拉远、f<1 推近（滚轮 deltaY 换算见页面） */
function hbZoom(cam, f){
  return { yaw: cam.yaw, pitch: cam.pitch, dist: clamp3(cam.dist * f, DIST_MIN, DIST_MAX) };
}

function hbEye(cam){
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return { x: cam.dist * cp * Math.sin(cam.yaw), y: cam.dist * sp, z: cam.dist * cp * Math.cos(cam.yaw) };
}

/* 视空间正交基（靶点 = 原点）：
     f = 视线方向 eye→靶点
     r = normalize(f × up)，up 取世界 +y
     u = r × f（屏幕向上）
   pitch 钳在 ±76° ⟹ |f×up| = cos(pitch) ≥ 0.24，不会退化。 */
function hbCamBasis(cam){
  const eye = hbEye(cam);
  const n = Math.hypot(eye.x, eye.y, eye.z) || 1;
  const f = { x: -eye.x / n, y: -eye.y / n, z: -eye.z / n };
  const rx = -f.z, rz = f.x;                 /* f × (0,1,0) = (−f.z, 0, f.x) */
  const rn = Math.hypot(rx, 0, rz) || 1;
  const r = { x: rx / rn, y: 0, z: rz / rn };
  const u = {                             /* r × f */
    x: r.y * f.z - r.z * f.y,
    y: r.z * f.x - r.x * f.z,
    z: r.x * f.y - r.y * f.x,
  };
  return { f, r, u, eye };
}

/* 焦距：按画布宽度定，保证 CHAIN_SPAN 的链在默认距离下左右各留 ~15% 余量 */
function hbFocal(W){ return 0.85 * W; }

/* 世界点 → 设备像素。k = 焦距/深度，用来缩放珠半径、线宽、箭头（透视缩放的唯一来源）。 */
function hbProject(cam, W, H, p){
  const { f, r, u, eye } = hbCamBasis(cam);
  const dx = p.x - eye.x, dy = p.y - eye.y, dz = p.z - eye.z;
  const depth = dx * f.x + dy * f.y + dz * f.z;
  const focal = hbFocal(W);
  const near = 1e-6;
  const d = Math.abs(depth) < near ? near : depth;
  return {
    x: W / 2 + (dx * r.x + dy * r.y + dz * r.z) / d * focal,
    y: H / 2 - (dx * u.x + dy * u.y + dz * u.z) / d * focal,
    depth: d,
    k: focal / d,
  };
}

/* 格点的世界 x：跨度固定、关于原点对称（mean(x)=0，span = CHAIN_SPAN） */
function hbSitePositions(L, span = CHAIN_SPAN){
  const out = [];
  const d = L > 1 ? span / (L - 1) : 0;
  for (let i = 0; i < L; i++) out.push(-span / 2 + i * d);
  return out;
}

/* 屏幕点 → 格点下标。命中半径内取屏幕距离最近者；等距时取更靠近相机的那颗
   （两颗珠子在屏幕上叠住时，看见的应该是前面那颗）。 */
function hbPick(cam, W, H, xs, sx, sy, rad){
  let best = -1, bd = Infinity, bz = Infinity;
  for (let i = 0; i < xs.length; i++){
    const p = hbProject(cam, W, H, { x: xs[i], y: 0, z: 0 });
    const d = Math.hypot(p.x - sx, p.y - sy);
    if (d > rad) continue;
    if (d < bd - 1e-9 || (Math.abs(d - bd) <= 1e-9 && p.depth < bz)){
      best = i; bd = d; bz = p.depth;
    }
  }
  return best;
}

/* 深度雾：把 [最近、最远] 归一化到 [0,1]（1 = 最近），页面用它给远处的珠子降透明度 */
function hbDepthRange(cam, W, H, xs){
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < xs.length; i++){
    const p = hbProject(cam, W, H, { x: xs[i], y: 0, z: 0 });
    if (p.depth < lo) lo = p.depth;
    if (p.depth > hi) hi = p.depth;
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-9) return { lo, hi, nearness: () => 1 };
  return {
    lo, hi,
    nearness: depth => clamp3(1 - (depth - lo) / (hi - lo), 0, 1),
  };
}

/* ===== src/physics/paths.js ===== */
/* ============================================================================
 * paths.js — 费曼路径求和（自由传播 · N 缝 / AB 磁通 / 有限高斯势）
 *
 * 单位制：m=1, ħ=1，且取「以 x 为参数、速度 v_x=1」⟹ 每段飞行时间 T=X。
 *   于是 p=mv=1、λ=2π/k=2π。所有相位都以这个单位制算，页面坐标即世界坐标。
 *
 * 一条路径（单段，从 (0,ya) 到 (X,yb)）用模态展开参数化：
 *   y(τ) = ya + Δy·τ + Σ_n a_n sin(nπτ),  τ = x/X ∈ [0,1]
 * 代入 S=(m/2)∫(ẋ²+ẏ²)dt 得
 *   S = X/2 + Δy²/(2X) + Σ_n a_n² n²π²/(4X)
 * 第一项对所有路径相同（可丢），第二项是直线路径的相对作用量，第三项是
 * 波折的「超出作用量」。∫δ'² 的交叉项因 δ(0)=δ(1)=0 而恒为零——这是模态
 * 展开能给出闭式相位的根据。
 *
 * 关键结构（本模块的核心恒等式，pot74 逐项验证）：
 *   模求和因子 C(X) = Σ_{路径} e^{i·Σ_n a_n²n²π²/(4X)} 只依赖 X，与端点无关
 *   ⟹ 单段振幅 = e^{iΔy²/(2X)}·C(X)。故
 *   **截断模态只改变整体归一化，不改变条纹位置/间距/包络**；绝对幅度的
 *   X 标度不是物理的（等权平测度截断的固有性质，不是数值误差，见文件末）。
 *
 * 与解析传播子的关系：
 *   K(X,Δy) = (2πiX)^{-1/2} e^{iΔy²/(2X)}（1D 自由传播子，m=ħ=1）
 *   路径和 = C(X)·√(2πiX)·K ⟹ 逐点只差一个复常数（页面 HUD 实时显示该比值
 *   的起伏，量级 1e-15）。
 * ========================================================================== */

const PI_LAMBDA = 2 * Math.PI;   /* m=ħ=1、v_x=1 ⟹ 波长 2π */

const PI_DEFAULTS = {
  L1: 160,        /* 源 → 屏 */
  L2: 400,        /* 屏 → 探测面 */
  ys: 0,          /* 源横向位置（世界坐标，页面里再平移到画布中心） */
  d: 40,          /* 缝间距 */
  w: 6,           /* 缝宽 */
  modes: 1,       /* 模态数（1 或 2；对条纹无影响，只影响归一） */
  K: 48,          /* 每个模态的采样区间数（2K+1 个取值） */
  W: 26,          /* 一阶模态最大波折幅度（θ_n 幅度 = W/n） */
  nxi: 5,         /* 缝宽方向的求积点数 */
  nY: 241,        /* 剖面采样点数 */
  yFov: 200,      /* 剖面纵向半宽（世界单位；= 画布可见半高） */
  openA: true, openB: true,
  /* 缝数：2 = 经典双缝（A/B 各自开关）；1 = 单缝置中；≥3 = 等间距光栅（全部开） */
  nslit: 2,
  flux: 0,         /* AB 磁通 α=Φ/Φ₀（路径 Wilson 相位） */
  barrier: 0,       /* 高斯势垒峰值 V₀；0 = 关闭 */
  barrierWidth: 12, /* 横向高斯宽度 σy */
  barrierXWidth: 12,/* 纵向传播宽度 σx */
  /* 哪条路信息强度 ε ∈ [0,1]：0 = 完全相干（幅度相加），1 = 完全可区分（强度相加）。
     **不进默认值表**（不写 eps: 0）：否则「没给 eps」与「eps=0」不可区分，
     旧口径 coherent:false 会被默认值吃掉。取值见 piEps。 */
  coherent: true, /* 兼容旧口径：false ⟺ ε=1 */
};

/* ---------- 单段：相位与模态系数 ---------- */
function piModeCoef(X, n){ return n * n * Math.PI * Math.PI / (4 * X); }

/* 相对作用量（已去掉公共的 X/2）：Δy²/(2X) + Σ a_n²n²π²/(4X) */
function piSegmentPhase(X, dy, amps){
  let ph = dy * dy / (2 * X);
  for (let i = 0; i < amps.length; i++){
    const n = i + 1;
    ph += n * n * Math.PI * Math.PI * amps[i] * amps[i] / (4 * X);
  }
  return ph;
}

/* 直线路径的相对作用量 */
function piStraightPhase(X, dy){ return dy * dy / (2 * X); }

/* 理想 AB 螺线管位于缝平面的一处开缝间隙。以每条路径的连续极角变化 Δθ
   计算 Wilson 相位 φ_AB=−(Φ/Φ₀)Δθ；上下绕行的两路 Δθ 相差 2π，故相位差
   正好是一个磁通量子的 2π。N 为奇数时选中心与上邻缝之间的间隙，偶数时选中央间隙。 */
function piFluxTubeY(cfg){
  const n = Math.max(1, Math.round(cfg.nslit ?? PI_DEFAULTS.nslit));
  const d = cfg.d ?? PI_DEFAULTS.d;
  return n > 2 && (n & 1) ? d / 2 : 0;
}
function unwrapNear(angle, ref){
  while (angle - ref > Math.PI) angle -= 2 * Math.PI;
  while (angle - ref < -Math.PI) angle += 2 * Math.PI;
  return angle;
}
function piABPhase(slit, cfg = {}, Y = 0){
  const flux = cfg.flux ?? PI_DEFAULTS.flux;
  if (!flux || (cfg.nslit ?? PI_DEFAULTS.nslit) === 1) return 0;
  const yTube = piFluxTubeY(cfg), side = slit - yTube;
  if (Math.abs(side) < 1e-12) return 0; /* 路径正穿过螺线管时该缝不可用 */
  const x0 = cfg.L1 ?? PI_DEFAULTS.L1, x2 = cfg.L2 ?? PI_DEFAULTS.L2;
  const ys = cfg.ys ?? PI_DEFAULTS.ys;
  const mid = side > 0 ? Math.PI / 2 : -Math.PI / 2;
  const theta0 = unwrapNear(Math.atan2(ys - yTube, -x0), mid);
  const theta2 = unwrapNear(Math.atan2(Y - yTube, x2), mid);
  return -flux * (theta2 - theta0);
}

/* 有限宽二维高斯标量势：V(x,y)=V₀ exp[-(x−x_b)²/(2σx²)−y²/(2σy²)]，
   x_b 位于屏后自由传播段中点。逐条路径把 U=∫V(x,y(x))dx 加进作用量 S−U；
   这是有限宽标量势的路径积分（不是一片相位屏），弱势时近似忽略反射，强势时
   仍保留相位模型本身，不声称求出了矩形势垒的散射边界条件。 */
const PI_GL16_X = [-0.9894009349916499,-0.9445750230732326,-0.8656312023878318,-0.7554044083550030,
                   -0.6178762444026438,-0.4580167776572274,-0.2816035507792589,-0.09501250983763744,
                    0.09501250983763744, 0.2816035507792589, 0.4580167776572274, 0.6178762444026438,
                    0.7554044083550030, 0.8656312023878318, 0.9445750230732326, 0.9894009349916499];
const PI_GL16_W = [0.027152459411754095,0.06225352393864789,0.09515851168249278,0.12462897125553387,
                   0.14959598881657673,0.16915651939500254,0.1826034150449236,0.1894506104550685,
                   0.1894506104550685,0.1826034150449236,0.16915651939500254,0.14959598881657673,
                   0.12462897125553387,0.09515851168249278,0.06225352393864789,0.027152459411754095];
function piBarrierAction(X, xStart, ya, yb, amps, cfg = {}){
  const V0 = cfg.barrier ?? 0;
  if (!V0 || !(X > 0)) return 0;
  const sx = Math.max(1e-6, cfg.barrierXWidth ?? PI_DEFAULTS.barrierXWidth);
  const sy = Math.max(1e-6, cfg.barrierWidth ?? PI_DEFAULTS.barrierWidth);
  const xb = (cfg.L1 ?? PI_DEFAULTS.L1) + (cfg.L2 ?? PI_DEFAULTS.L2) / 2;
  const lo = Math.max(xStart, xb - 5 * sx), hi = Math.min(xStart + X, xb + 5 * sx);
  if (!(hi > lo)) return 0;
  const mid = (lo + hi) / 2, half = (hi - lo) / 2;
  let action = 0;
  for (let q = 0; q < PI_GL16_X.length; q++){
    const x = mid + half * PI_GL16_X[q], t = (x - xStart) / X;
    let y = ya + (yb - ya) * t;
    for (let m = 0; m < amps.length; m++) y += amps[m] * Math.sin((m + 1) * Math.PI * t);
    const dx = (x - xb) / sx, dy = y / sy;
    action += PI_GL16_W[q] * Math.exp(-0.5 * (dx * dx + dy * dy));
  }
  return V0 * half * action;
}

/* 势垒存在时，端点会影响模态路径上的 ∫Vdt，不能再用 C(X) 的端点无关因式分解。
   对第一弯曲模态作中点求积；若 modes=2，第二模态保留自由因子（不与 V 耦合）。
   主求积阶数随 K 控件映射到 2–8，参照多两阶；无势垒时仍走原自由积分。 */
function piBarrierOrder(c, reference = false){
  const k = Math.max(2, Math.min(8, Math.round((c.K ?? PI_DEFAULTS.K) / 8)));
  return reference ? Math.min(10, k + 2) : k;
}
const PI_POT_MODE2_CACHE = new Map();
function piFreeMode2(X, cfg){
  const key = X + '|' + (cfg.K ?? PI_DEFAULTS.K) + '|' + (cfg.W ?? PI_DEFAULTS.W);
  let v = PI_POT_MODE2_CACHE.get(key);
  if (!v){
    v = piModeSum1D(X, 2, cfg);
    if (PI_POT_MODE2_CACHE.size > 32) PI_POT_MODE2_CACHE.clear();
    PI_POT_MODE2_CACHE.set(key, v);
  }
  return v;
}
function piPotentialSegmentSum(X, ya, yb, xStart, cfg, K, fixedA1 = null){
  const modes = Math.max(1, Math.min(2, cfg.modes ?? PI_DEFAULTS.modes));
  const n = 2 * K, W = cfg.W ?? PI_DEFAULTS.W;
  const c1 = piModeCoef(X, 1), h1 = W / K;
  const n1 = fixedA1 === null ? n : 1;
  let re = 0, im = 0;
  for (let i = 0; i < n1; i++){
    const a1 = fixedA1 === null ? -W + (i + 0.5) * h1 : fixedA1;
    const ph = piStraightPhase(X, yb - ya) + c1 * a1 * a1
      - piBarrierAction(X, xStart, ya, yb, [a1], cfg);
    re += Math.cos(ph); im += Math.sin(ph);
  }
  if (modes > 1){
    const c2 = piFreeMode2(X, cfg);
    const r = re * c2.re - im * c2.im, i = re * c2.im + im * c2.re;
    re = r; im = i;
  }
  return { re, im };
}

/* ---------- 模态族的等权求和 ---------- */
/* 嵌套循环（不用因式分解）：这正是「逐条路径相加」的字面实现，
   pot74 用它和 1D 乘积对照，证明 C(X) 的因式分解成立。 */
function piModeSum(X, opts = {}){
  const K = opts.K ?? PI_DEFAULTS.K;
  const W = opts.W ?? PI_DEFAULTS.W;
  const modes = Math.max(1, Math.min(2, opts.modes ?? PI_DEFAULTS.modes));
  const cs = [];
  for (let n = 1; n <= modes; n++) cs.push(piModeCoef(X, n));
  /* 中点法则：每个模态取 2K 个等距样本（a=(i+½)h−A, h=A/K），不含端点。
     端点法则（含 a=±A）在端点处有半个区间误差，实测收敛是 O(h)；中点法则
     实测 O(h²)（K 加倍误差降 4×，见 pot74 A2）。步长 h 同时作为「测度因子」
     的参考尺度（sum·h ≈ ∫da）。 */
  let re = 0, im = 0, count = 0;
  const rec = (n, ph) => {
    if (n === modes){ re += Math.cos(ph); im += Math.sin(ph); count++; return; }
    const c = cs[n], A = W / (n + 1), h = A / K;
    for (let i = 0; i < 2 * K; i++){
      const a = -A + (i + 0.5) * h;
      rec(n + 1, ph + c * a * a);
    }
  };
  rec(0, 0);
  return { re, im, count, mag: Math.hypot(re, im), h: W / K };
}

/* 单模态求和（因式分解的一侧） */
function piModeSum1D(X, n, opts = {}){
  const K = opts.K ?? PI_DEFAULTS.K, W = opts.W ?? PI_DEFAULTS.W;
  const c = piModeCoef(X, n), A = W / n, h = A / K;
  let re = 0, im = 0;
  for (let i = 0; i < 2 * K; i++){
    const a = -A + (i + 0.5) * h, ph = c * a * a;
    re += Math.cos(ph); im += Math.sin(ph);
  }
  return { re, im, count: 2 * K, mag: Math.hypot(re, im), h };
}

/* ---------- 单段振幅（含端点几何相位） ---------- */
function piSegmentAmp(X, dy, opts = {}){
  const C = piModeSum(X, opts);
  const ph = piStraightPhase(X, dy);
  const cp = Math.cos(ph), sp = Math.sin(ph);
  return { re: cp * C.re - sp * C.im, im: sp * C.re + cp * C.im, mag: C.mag };
}

/* ---------- 解析传播子（对照） ---------- */
/* K = (2πiX)^{-1/2} e^{iΔy²/2X}；实部/虚部显式展开，避免复数库 */
function piAnalyticSegment(X, dy){
  const ph = piStraightPhase(X, dy);
  const pref = 1 / Math.sqrt(2 * Math.PI * X);
  /* (2πiX)^{-1/2} = pref·e^{-iπ/4} */
  const c = Math.SQRT1_2 * pref;
  const cr = Math.cos(ph), ci = Math.sin(ph);
  return { re: c * (cr + ci), im: c * (ci - cr) };
}

/* ---------- 缝位置 ---------- */
function piSlits(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  const n = Math.max(1, Math.min(8, Math.round(c.nslit ?? 2)));
  const out = [];
  if (n === 1){
    /* 单缝：置中（旧的 single 预设就是 d=0，这里直接给 0） */
    out.push(0);
    return out;
  }
  if (n === 2){
    if (c.openA) out.push(+c.d / 2);
    if (c.openB) out.push(-c.d / 2);
    return out;
  }
  /* N ≥ 3：等间距光栅，**关于原点对称**（N 偶：±d/2, ±3d/2…；N 奇：0, ±d…）。
     对称摆放很重要：N 偶时 |y_k| 成对相等 ⟹ 源曲率项 y_k²/(2L₁) 在每对内部是
     公共相位，主极大仍严格落在 Y = m·λL₂/d 上，峰宽 ∝ 1/N。 */
  /* 偶数：±d/2, ±3d/2…；奇数：0, ±d, ±2d…（都关于原点对称） */
  const c0 = (n % 2 === 0) ? 0.5 : 0;
  const half = (n % 2 === 0) ? n / 2 : (n - 1) / 2;
  for (let k = 0; k < n; k++) out.push((k + c0 - half) * c.d);
  out.sort((a, b) => b - a);
  return out;
}

/* ε 的归一化：eps 优先；旧口径 coherent=false ⟺ eps=1 */
function piEps(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  if (c.eps !== undefined && c.eps !== null) return Math.max(0, Math.min(1, +c.eps));
  return c.coherent === false ? 1 : 0;
}

/* ξ 求积点数：跨缝相位变化 ≈ (|Y|/L₂)·w（源曲率项同量级），要求每样本的相位步
   ≤0.5 rad 才不混叠。w=20、yFov=293、L₂=400 时需要 30 点；首版固定 nxi=7 时
   相位步 2.07 rad，单缝剖面被混叠出两个假暗纹（pot74 C3 抓到）。 */
function piNxiFor(w, L2, ymax, base = PI_DEFAULTS.nxi){
  const need = Math.ceil(w * Math.max(1, Math.abs(ymax)) / (0.5 * Math.max(1e-9, L2)));
  return Math.max(base, need);
}

/* ξ 求积点（中点法） */
function piXiSamples(w, n){
  const out = [];
  for (let i = 0; i < n; i++) out.push(-w / 2 + w * (i + 0.5) / n);
  return out;
}

function piPotentialFirstCache(cfg, K){
  const c = { ...PI_DEFAULTS, ...cfg }, slits = piSlits(c);
  const xi = piXiSamples(c.w, Math.max(1, c.nxi | 0));
  return slits.map(s => xi.map(dx => {
    const x = s + dx;
    return piPotentialSegmentSum(c.L1, c.ys, x, 0, c, K);
  }));
}
function piPotentialAmplitudeAt(Y, cfg, K, firstCache = null){
  const c = { ...PI_DEFAULTS, ...cfg };
  const slits = piSlits(c);
  const ni = piNxiFor(c.w, c.L2, Math.abs(Y), Math.max(1, c.nxi | 0));
  const xi = piXiSamples(c.w, c.potentialNxiCap ? Math.min(ni, c.potentialNxiCap) : ni);
  let re = 0, im = 0;
  const per = [];
  for (let si = 0; si < slits.length; si++){
    const slit = slits[si];
    let sr = 0, si2 = 0;
    for (let qi = 0; qi < xi.length; qi++){
      const dx = xi[qi], x = slit + dx;
      const a = firstCache?.[si]?.[qi] || piPotentialSegmentSum(c.L1, c.ys, x, 0, c, K);
      const b = piPotentialSegmentSum(c.L2, x, Y, c.L1, c, K);
      let pr = a.re * b.re - a.im * b.im, pI = a.re * b.im + a.im * b.re;
      const ph = piABPhase(slit, c, Y), cp = Math.cos(ph), sp = Math.sin(ph);
      const tr = pr * cp - pI * sp, ti = pr * sp + pI * cp;
      sr += tr; si2 += ti;
    }
    sr /= Math.max(1, xi.length); si2 /= Math.max(1, xi.length);
    per.push({ slit, re: sr, im: si2, mag: Math.hypot(sr, si2) });
    re += sr; im += si2;
  }
  return { raw: { re, im, mag: Math.hypot(re, im) }, per };
}

/* ---------- 探测点振幅 ---------- */
/* 返回：
 *   raw   路径求和（未归一）
 *   an    解析传播子（同一 ξ 求积）
 *   scale raw/an 的复比值（应逐点恒定）
 *   per   各缝单独振幅（相干/非相干用）
 */
function piAmpAt(Y, cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  if (c.barrier > 0){
    const main = piPotentialAmplitudeAt(Y, c, piBarrierOrder(c));
    const ref = piPotentialAmplitudeAt(Y, c, piBarrierOrder(c, true));
    return { raw: main.raw, an: ref.raw, per: main.per };
  }
  const C1 = piModeSum(c.L1, c), C2 = piModeSum(c.L2, c);
  const slits = piSlits(c);
  const xi = piXiSamples(c.w, piNxiFor(c.w, c.L2, Math.abs(Y), Math.max(1, c.nxi | 0)));
  let re = 0, im = 0, anRe = 0, anIm = 0;
  const per = [];
  for (const s of slits){
    let sr = 0, si = 0, ar = 0, ai = 0;
    for (const dx of xi){
      const x = s + dx;
      const ph = piStraightPhase(c.L1, x - c.ys) + piStraightPhase(c.L2, Y - x)
        + piABPhase(s, c, Y);
      sr += Math.cos(ph); si += Math.sin(ph);
      const k1 = piAnalyticSegment(c.L1, x - c.ys), k2 = piAnalyticSegment(c.L2, Y - x);
      /* 自由解析传播子乘以 AB Wilson 相位 */
      const kr = k1.re * k2.re - k1.im * k2.im;
      const ki = k1.re * k2.im + k1.im * k2.re;
      const extra = piABPhase(s, c, Y);
      ar += kr * Math.cos(extra) - ki * Math.sin(extra);
      ai += kr * Math.sin(extra) + ki * Math.cos(extra);
    }
    const n = xi.length;
    /* 路径和：几何相位 × C1·C2，逐缝。(gr+i·gi)(a+ib)(c+id) 的实部是
       gr·ac − gi·bc − gr·bd − gi·ad —— 第四项是 **−**gr·bd（首版写成 +，
       逐缝振幅的相位因此偏 1.24 rad；剖面走的是 piProfile 里的另一条正确展开，
       所以只有 pot74 的干涉项恒等式把它抓出来）。 */
    const gr = sr / n, gi = si / n;
    const pr = gr * C1.re * C2.re - gi * C1.im * C2.re - gr * C1.im * C2.im - gi * C1.re * C2.im;
    const pi2 = gr * C1.re * C2.im + gr * C1.im * C2.re + gi * C1.re * C2.re - gi * C1.im * C2.im;
    per.push({ slit: s, re: pr, im: pi2, mag: Math.hypot(pr, pi2) });
    re += pr; im += pi2;
    anRe += ar / n; anIm += ai / n;
  }
  return { raw: { re, im, mag: Math.hypot(re, im) }, an: { re: anRe, im: anIm, mag: Math.hypot(anRe, anIm) }, per };
}

/* 单点强度：相干项 (Σ A_k)² 与不相干项 Σ|A_k|² 按 ε 线性混合：
     I(ε) = (1−ε)·|Σ A_k|² + ε·Σ|A_k|²
   ε 的物理含义是「退相干份额」：ε 比例的路径被环境/探测器打掉了相位关系（只能强度相加），
   1−ε 比例的路径仍然相干。这是一个可操作的唯象模型，直接给出
     V(ε) = (1−ε)·V(0)
   （标准二值探测器模型的 V=√(1−D²) 是另一条口径——那里 D 是探测器能区分两路的最小错误概率，
   与这里的 ε 不是同一个量，页面文案按「退相干份额」写，不混用）。
   ε=0 逐位回到旧口径 coherent=true，ε=1 逐位回到 coherent=false。 */
function piIntensity(Y, cfg = {}){
  const A = piAmpAt(Y, cfg);
  const e = piEps(cfg);
  if (e >= 1 - 1e-15){
    let I = 0;
    for (const p of A.per) I += p.mag * p.mag;
    return I;
  }
  const coh = A.raw.mag * A.raw.mag;
  if (e <= 1e-15) return coh;
  let inc = 0;
  for (const p of A.per) inc += p.mag * p.mag;
  return (1 - e) * coh + e * inc;
}

/* ---------- 剖面 ---------- */
function piPotentialProfile(c){
  const needXi = piNxiFor(c.w, c.L2, c.yFov, Math.max(1, c.nxi | 0));
  c = { ...c, nxi: c.potentialNxiCap ? Math.min(needXi, c.potentialNxiCap) : needXi };
  const n = Math.min(c.nY | 0, c._potentialPreview ? 61 : 121), Ys = new Float64Array(n);
  const cohArr = new Float64Array(n), incArr = new Float64Array(n);
  const anCohArr = new Float64Array(n), anIncArr = new Float64Array(n);
  const ymin = -c.yFov, ymax = c.yFov;
  const kMain = piBarrierOrder(c), kRef = piBarrierOrder(c, true);
  const firstMain = piPotentialFirstCache(c, kMain), firstRef = piPotentialFirstCache(c, kRef);
  for (let k = 0; k < n; k++){
    const Y = ymin + (ymax - ymin) * k / (n - 1); Ys[k] = Y;
    const a = piPotentialAmplitudeAt(Y, c, kMain, firstMain);
    cohArr[k] = a.raw.mag * a.raw.mag;
    for (const p of a.per) incArr[k] += p.mag * p.mag;
    /* 收敛参照隔点求一次，再在线性插值到显示网格；主曲线仍逐点求解。 */
    if ((k & 1) === 0 || k === n - 1){
      const b = piPotentialAmplitudeAt(Y, c, kRef, firstRef);
      anCohArr[k] = b.raw.mag * b.raw.mag;
      for (const p of b.per) anIncArr[k] += p.mag * p.mag;
    }
  }
  for (let k = 1; k < n - 1; k += 2){
    const k1 = Math.min(n - 1, k + 1), t = (k - (k - 1)) / Math.max(1, k1 - (k - 1));
    anCohArr[k] = anCohArr[k - 1] * (1 - t) + anCohArr[k1] * t;
    anIncArr[k] = anIncArr[k - 1] * (1 - t) + anIncArr[k1] * t;
  }
  const Ip = new Float64Array(n), Ia = new Float64Array(n), Ii = new Float64Array(n);
  const e = piEps(c), mpC = Math.max(...cohArr), mpI = Math.max(...incArr);
  const maC = Math.max(...anCohArr), maI = Math.max(...anIncArr);
  for (let k = 0; k < n; k++){
    const ch = mpC > 0 ? cohArr[k] / mpC : 0, ic = mpI > 0 ? incArr[k] / mpI : 0;
    const ach = maC > 0 ? anCohArr[k] / maC : 0, aic = maI > 0 ? anIncArr[k] / maI : 0;
    Ip[k] = (1 - e) * ch + e * ic;
    Ia[k] = (1 - e) * ach + e * aic;
    Ii[k] = incArr[k];
  }
  const mp = Math.max(...Ip), ma = Math.max(...Ia);
  let sMin = Infinity, sMax = -Infinity, sSum = 0, nGood = 0;
  for (let k = 0; k < n; k++) if (Ia[k] > 1e-30 * ma && Ip[k] > 1e-30 * mp){
    const r = Ip[k] / Ia[k];
    if (r < sMin) sMin = r;
    if (r > sMax) sMax = r;
    sSum += r; nGood++;
  }
  const sMean = sSum / Math.max(1, nGood);
  return {
    Y: Ys, path: Float64Array.from(Ip, v => v / Math.max(mp, 1e-300)),
    an: Float64Array.from(Ia, v => v / Math.max(ma, 1e-300)), raw: Ip, iAn: Ia, incoh: Ii,
    scale: { min: sMin, max: sMax, mean: sMean, spread: (sMax - sMin) / Math.max(sMean, 1e-300) },
    maxPath: mp, maxAn: ma,
  };
}

/* 用同一模态常数 C1·C2 的快速自由传播剖面；高斯势垒打开时改为有限模态路径积分。 */
function piProfile(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  if (c.barrier > 0) return piPotentialProfile(c);
  const C1 = piModeSum(c.L1, c), C2 = piModeSum(c.L2, c);
  const slits = piSlits(c);
  const xi = piXiSamples(c.w, piNxiFor(c.w, c.L2, c.yFov, Math.max(1, c.nxi | 0)));
  const n = c.nY | 0;
  const yMin = -c.yFov, yMax = c.yFov;   /* 剖面覆盖画布可见的纵向范围 */
  const Ys = new Float64Array(n), Ip = new Float64Array(n), Ia = new Float64Array(n), Ii = new Float64Array(n);
  const cohArr = new Float64Array(n), incArr = new Float64Array(n);
  const anCohArr = new Float64Array(n), anIncArr = new Float64Array(n);
  for (let k = 0; k < n; k++){
    const Y = yMin + (yMax - yMin) * k / (n - 1);
    Ys[k] = Y;
    let re = 0, im = 0, ar = 0, ai = 0, incoh = 0, anIncoh = 0;
    for (const s of slits){
      let sr = 0, si = 0, kr = 0, ki = 0;
      for (const dx of xi){
        const x = s + dx;
        const ph = piStraightPhase(c.L1, x - c.ys) + piStraightPhase(c.L2, Y - x)
          + piABPhase(s, c, Y);
        sr += Math.cos(ph); si += Math.sin(ph);
        const k1 = piAnalyticSegment(c.L1, x - c.ys), k2 = piAnalyticSegment(c.L2, Y - x);
        const qr = k1.re * k2.re - k1.im * k2.im;
        const qi = k1.re * k2.im + k1.im * k2.re;
        const extra = piABPhase(s, c, Y);
        kr += qr * Math.cos(extra) - qi * Math.sin(extra);
        ki += qr * Math.sin(extra) + qi * Math.cos(extra);
      }
      const m = xi.length;
      const gr = sr / m, gi = si / m;
      const pr = (gr * C1.re - gi * C1.im) * C2.re - (gr * C1.im + gi * C1.re) * C2.im;
      const pii = (gr * C1.re - gi * C1.im) * C2.im + (gr * C1.im + gi * C1.re) * C2.re;
      re += pr; im += pii;
      incoh += pr * pr + pii * pii;
      anIncoh += (kr * kr + ki * ki) / (m * m);
      ar += kr / m; ai += ki / m;
    }
    /* 相干 / 不相干两个端点先各算一份，归一之后再按 ε 混合（见循环后的注释）。 */
    cohArr[k] = re * re + im * im;
    incArr[k] = incoh;
    anCohArr[k] = ar * ar + ai * ai;
    anIncArr[k] = anIncoh;
  }
  /* 两个端点各自归一到**自己的峰值**再按 ε 混合：
       I(ε) = (1−ε)·Î_coh + ε·Î_inc,  Î = I/max I
     这样「相干份额」就是画面上的份额（两条曲线都满高）；直接拿未归一的强度混合会被
     两个峰值的比（相干峰 ≈ 2× 不相干峰）偷偷加权，观测到的可见度就不再是干净的
     V(ε) = (1−ε)/(1+ε)。端点 ε=0/1 逐位等于旧口径。 */
  const e = piEps(c);
  const mpC = Math.max(...cohArr), mpI = Math.max(...incArr);
  const maC = Math.max(...anCohArr), maI = Math.max(...anIncArr);
  for (let k = 0; k < n; k++){
    const ch = mpC > 0 ? cohArr[k] / mpC : 0, ic = mpI > 0 ? incArr[k] / mpI : 0;
    const ach = maC > 0 ? anCohArr[k] / maC : 0, aic = maI > 0 ? anIncArr[k] / maI : 0;
    Ip[k] = (1 - e) * ch + e * ic;
    Ia[k] = (1 - e) * ach + e * aic;
    Ii[k] = incArr[k];
  }
  /* 归一 + 比值起伏（验证「只差一个常数」） */
  const mp = Math.max(...Ip), ma = Math.max(...Ia);
  let sMin = Infinity, sMax = -Infinity, sSum = 0;
  for (let k = 0; k < n; k++){
    if (Ia[k] > 1e-30 * ma && Ip[k] > 1e-30 * mp){
      const r = Ip[k] / Ia[k];
      if (r < sMin) sMin = r;
      if (r > sMax) sMax = r;
      sSum += r;
    }
  }
  const sMean = sSum / Math.max(1, n);
  return {
    Y: Ys, path: Float64Array.from(Ip, v => v / mp), an: Float64Array.from(Ia, v => v / ma),
    raw: Ip, iAn: Ia, incoh: Ii,
    scale: { min: sMin, max: sMax, mean: sMean, spread: (sMax - sMin) / Math.max(sMean, 1e-300) },
    maxPath: mp, maxAn: ma,
  };
}

/* ---------- 可视化：路径折线 ---------- */
/* 单段：y(τ) = ya + Δy·τ + Σ a_n sin(nπτ) */
function piPolyline(xa, ya, xb, yb, amps, N = 28){
  const pts = [];
  for (let i = 0; i <= N; i++){
    const t = i / N;
    let y = ya + (yb - ya) * t;
    for (let n = 0; n < amps.length; n++) y += amps[n] * Math.sin((n + 1) * Math.PI * t);
    pts.push([xa + (xb - xa) * t, y]);
  }
  return pts;
}

/* 取一组「能代表整个族」的路径样本（画图用）：两段各在 [-W,W] 上取 nA 个
   等距值 f，构成 nA² 的**子网格**（族本身是 2K×2K 的完整网格，画图只抽子集）。
   注意两段都要有波折——只给段 1 加波折会让画面撒谎（求和时两段都有 C(X)）。 */
function piPathSamples(Y, cfg = {}, nA = 7){
  const c = { ...PI_DEFAULTS, ...cfg };
  const slits = piSlits(c);
  const xi = piXiSamples(c.w, Math.max(1, c.nxi | 0));
  const frac = [];
  for (let i = 0; i < nA; i++) frac.push(-1 + 2 * i / (nA - 1));
  const out = [];
  for (const s of slits){
    for (const dx of xi){
      const x = s + dx;
      for (const f1 of frac){
        for (const f2 of frac){
          const seg1 = [f1 * c.W];
          const seg2 = [f2 * c.W];
          if (c.modes > 1){ seg1.push(f2 * c.W / 2); seg2.push(f1 * c.W / 2); }
          /* 势垒模式的数值振幅只耦合 a₁；a₂（双模态时）仍是自由因子，
             因此路径颜色/相位也只把高斯 action 投影到各段的第一模态。 */
          const barrierAction = piBarrierAction(c.L1, 0, c.ys, x, c.barrier > 0 ? [seg1[0]] : seg1, c)
            + piBarrierAction(c.L2, c.L1, x, Y, c.barrier > 0 ? [seg2[0]] : seg2, c);
          const ph = piSegmentPhase(c.L1, x - c.ys, seg1) + piSegmentPhase(c.L2, Y - x, seg2)
            + piABPhase(s, c, Y) - barrierAction;
          out.push({ slit: s, xi: x, seg1, seg2, phase: ph });
        }
      }
    }
  }
  return out;
}

/* ---------- 数值参考（验证用，页面不用） ---------- */
/* 细网格 Simpson 求 ∫_{-A}^{A} e^{i c a²} da，作为模态和的独立真值 */
function piFresnelRef(A, cCoef, N = 20001){
  const h = 2 * A / N;
  let re = 0, im = 0, wsum = 0;
  for (let i = 0; i <= N; i++){
    const a = -A + i * h;
    const w = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
    const ph = cCoef * a * a;
    re += w * Math.cos(ph); im += w * Math.sin(ph); wsum += w;
  }
  re *= h / 3; im *= h / 3; wsum *= h / 3;
  return { re, im, len: wsum };
}

/* ---------- 派生量 ---------- */
/* N 缝光栅的第一暗纹（相对主极大）= λL₂/(N d)：N 越大主极大越窄（峰宽 ∝ 1/N）。
   N=1 时无意义（返回 Infinity），N=2 时退化为 λL₂/(2d)（双缝中央包络零点）。 */
function piGratingWidth(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  const n = Math.max(1, Math.min(8, Math.round(c.nslit ?? 2)));
  return (c.d > 1e-9 && n > 1) ? PI_LAMBDA * c.L2 / (n * c.d) : Infinity;
}

/* 条纹可见度 V = (I_max − I_min)/(I_max + I_min)，但 max/min 取**同一条纹周期内**
   的相邻极值——不是整窗的最大/最小。为什么：整窗口径把单缝包络的缓降当成了「条纹」，
   可区分（ε=1）时剖面只是一条平滑包络，却会报出 V≈0.26 的假可见度。
   做法：先在 |Y| ≤ sp/2 里找主极大，再在它到 ±0.9·sp 的窗口里找最小。
   ε 混合（两项各自归一）时解析预期 V(ε) = (1−ε)/(1+ε)。 */
function piVisibility(prof, cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  const sp = piFringeSpacing(c);
  if (!Number.isFinite(sp) || sp <= 0) return 0;
  const Y = prof.Y, I = prof.path;
  let kp = -1, vmax = -Infinity;
  for (let k = 0; k < Y.length; k++){
    if (Math.abs(Y[k]) > sp / 2 + 1e-9) continue;
    if (I[k] > vmax){ vmax = I[k]; kp = k; }
  }
  if (kp < 0) return 0;
  let lo = Infinity;
  for (let k = 0; k < Y.length; k++){
    if (Math.abs(Y[k] - Y[kp]) > 0.9 * sp + 1e-9) continue;
    if (I[k] < lo) lo = I[k];
  }
  if (!Number.isFinite(lo) || vmax + lo <= 1e-30) return 0;
  return (vmax - lo) / (vmax + lo);
}

function piFringeSpacing(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  return c.d > 1e-9 ? PI_LAMBDA * c.L2 / c.d : Infinity;   /* λL₂/d */
}
function piEnvelopeZero(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  return c.w > 1e-9 ? PI_LAMBDA * c.L2 / c.w : Infinity;   /* 单缝第一零点 λL₂/w */
}


/* 条纹计数与对比度：数**内部局部极小**（暗纹），深度按两侧较浅的极大算。
   为什么不用「内部极大」：单缝包络的中心极大是真极大，但它是单调下降的起点、
   不是振荡——数极大就会把单缝算成 1 条（pot74 首版的实测）。
   数极小则天然区分：单调包络没有内部极小，双缝每两条明纹之间必有一个。
   返回 {count（暗纹数）, contrast（平均深度）, peaks}。 */
function piFringes(prof){
  const n = prof.path.length;
  const dips = [];
  for (let k = 3; k < n - 3; k++){
    const v = prof.path[k];
    if (!(v <= prof.path[k - 1] && v < prof.path[k + 1])) continue;
    let j = k;
    while (j > 0 && prof.path[j - 1] >= prof.path[j]) j--;
    const lmax = prof.path[j];
    j = k;
    while (j < n - 1 && prof.path[j + 1] >= prof.path[j]) j++;
    const rmax = prof.path[j];
    const shallow = Math.min(lmax, rmax);
    if (shallow < 1e-9) continue;
    const depth = (shallow - v) / shallow;
    if (depth < 0.15) continue;
    dips.push({ Y: prof.Y[k], I: v, contrast: (shallow - v) / (shallow + v), depth });
  }
  const contrast = dips.length ? dips.reduce((a, d) => a + d.contrast, 0) / dips.length : 0;
  return { count: dips.length, contrast, dips };
}

const PI_PRESETS = {
  double: { name: '双缝', text: '两条缝各贡献一个振幅，路径族在此处**分岔**：同一探测点有两条「路径束」，它们的几何相位差 = k·δ（δ 为光程差）⟹ 明暗条纹。逐条路径看相位是乱的，但**沿每条缝**求和后只剩两个宏观振幅——这正是「路径求和 ⟹ 传播子」的可视化。', cfg: { openA: true, openB: true, coherent: true, nslit: 2, eps: 0, flux: 0, barrier: 0, barrierWidth: 12, barrierXWidth: 12, d: 48, w: 8 } },
  single: { name: '单缝', text: '关掉一条缝、并把留下的那条移到轴上（d=0 ⟹ 光束居中）：干涉消失，只剩**单缝衍射包络**（缝宽 w 的 sinc²），远场第一暗纹在 λL₂/w。这一步是「哪条路」信息的判据——只剩一条路时没有第二个振幅可加。', cfg: { openA: true, openB: false, coherent: true, nslit: 1, eps: 0, flux: 0, barrier: 0, barrierWidth: 12, barrierXWidth: 12, d: 0, w: 20 } },
  grating: { name: '光栅', text: '把缝从 2 条加到 N 条（等间距 d）：同一个探测点上有 N 个振幅相加，**主极大位置仍由 λL₂/d 定**，但每个主极大被压窄（宽度 ≈ λL₂/(N·d)），峰间冒出 N−2 个次极大。这就是「多缝 → 光栅」的全部物理，仍然是逐条路径相加，没有新规则。', cfg: { openA: true, openB: true, coherent: true, nslit: 6, eps: 0, flux: 0, barrier: 0, barrierWidth: 12, barrierXWidth: 12, d: 16, w: 4 } },
  incoherent: { name: '可区分', text: '两条缝都开，但**不做幅度相加**（强度相加——等价于「测量了粒子走哪条缝」）。条纹立刻消失，回到两个单缝包络的叠加。面板的「哪条路 ε」滑到 1 就是这件事：两条路变得可区分，干涉项归零。', cfg: { openA: true, openB: true, coherent: false, nslit: 2, eps: 1, flux: 0, barrier: 0, barrierWidth: 12, barrierXWidth: 12, d: 48, w: 8 } },
};

/* ---------- 可视化：一阶模态扫描的累积和（Cornu 型螺旋） ----------
   只扫 a₁（a₂=0），因为二维族（模态数 2）的累积曲线是二维稠密走线，
   看不出螺旋结构；一维扫描才有「越转越快、收敛到极限点」的经典图像。
   返回归一化到 (2K) 的累积点列，页面直接画。

   流式版（R98 P4）：step(count) 逐点推进（含起点共 2K+1 个点），
   result() 出当前进度；piSpiral 为薄封装——同一累加顺序，数值逐位一致。 */
function piSpiralStream(X, opts = {}){
  const K = opts.K ?? PI_DEFAULTS.K, W = opts.W ?? PI_DEFAULTS.W;
  const c = piModeCoef(X, 1), A = W, h = A / K;
  const pts = [[0, 0]];
  let re = 0, im = 0, n = 0;      /* n = 已累加的样本数（0..2K） */
  function one(){
    const a = -A + (n + 0.5) * h, ph = c * a * a;
    re += Math.cos(ph); im += Math.sin(ph);
    pts.push([re, im]);
    n++;
  }
  const total = 2 * K;
  return {
    get total(){ return total + 1; },          /* 含起点的点数 */
    get n(){ return n + 1; },
    step(count){ for (let k = 0, m = Math.max(0, count | 0); k < m && n < total; k++) one(); },
    result(){ return { pts, total: { re, im, mag: Math.hypot(re, im) }, count: n, len: total, h }; },
  };
}

function piSpiral(X, opts = {}){
  const s = piSpiralStream(X, opts);
  s.step(s.total);
  return s.result();
}

/* 当前配置下的完整振幅 a₁ 累积：扫描第一段第一模态 a₁，其余自由度
   （第一段其余模态、第二段所有模态、缝宽 ξ 与全部开缝）按配置求和。
   终点应与 piAmpAt(Y,cfg).raw 一致；N/d/w/L₁/L₂/Y/modes/AB 磁通/高斯势等变化都会改变曲线。
   ε 是强度混合而非路径相位，故不改变这条复振幅曲线（这是物理上的不变量）。 */
function piPotentialSpiralStream(cfg){
  const c = { ...PI_DEFAULTS, ...cfg }, K = piBarrierOrder(c), W = c.W;
  const Y = Number.isFinite(c.Y) ? c.Y : 0;
  const slits = piSlits(c);
  const xi = piXiSamples(c.w, piNxiFor(c.w, c.L2, Math.abs(Y), Math.max(1, c.nxi | 0)));
  const pts = [[0, 0]];
  let re = 0, im = 0, n = 0;
  const total = 2 * K, h = W / K;
  function one(){
    const a1 = -W + (n + 0.5) * h;
    let dr = 0, di = 0;
    for (const slit of slits){
      let sr = 0, si = 0;
      for (const dx of xi){
        const x = slit + dx;
        const a = piPotentialSegmentSum(c.L1, c.ys, x, 0, c, K, a1);
        const b = piPotentialSegmentSum(c.L2, x, Y, c.L1, c, K);
        const qr = a.re * b.re - a.im * b.im, qi = a.re * b.im + a.im * b.re;
        const ph = piABPhase(slit, c, Y), cp = Math.cos(ph), sp = Math.sin(ph);
        sr += qr * cp - qi * sp; si += qr * sp + qi * cp;
      }
      dr += sr / Math.max(1, xi.length); di += si / Math.max(1, xi.length);
    }
    re += dr; im += di; pts.push([re, im]); n++;
  }
  return {
    get total(){ return total + 1; }, get n(){ return n + 1; },
    step(count){ for (let k=0,m=Math.max(0,count|0); k<m&&n<total; k++) one(); },
    result(){ return { pts, total:{ re, im, mag:Math.hypot(re,im) }, count:n, len:total, h }; },
  };
}

function piPathSpiralStream(cfg = {}){
  const c = { ...PI_DEFAULTS, ...cfg };
  if (c.barrier > 0) return piPotentialSpiralStream(c);
  const K = Math.max(1, c.K | 0), W = c.W;
  const Y = Number.isFinite(c.Y) ? c.Y : 0;
  const slits = piSlits(c);
  const xi = piXiSamples(c.w, piNxiFor(c.w, c.L2, Math.abs(Y), Math.max(1, c.nxi | 0)));
  const other1 = c.modes > 1 ? piModeSum1D(c.L1, 2, c) : { re: 1, im: 0 };
  const second = piModeSum(c.L2, c);
  const fac = { re: other1.re * second.re - other1.im * second.im,
                im: other1.re * second.im + other1.im * second.re };
  let baseRe = 0, baseIm = 0;
  for (const slit of slits){
    for (const dx of xi){
      const x = slit + dx;
      const ph = piStraightPhase(c.L1, x - c.ys) + piStraightPhase(c.L2, Y - x)
        + piABPhase(slit, c, Y);
      baseRe += Math.cos(ph); baseIm += Math.sin(ph);
    }
  }
  const invXi = xi.length ? 1 / xi.length : 0;
  const br = (baseRe * fac.re - baseIm * fac.im) * invXi;
  const bi = (baseRe * fac.im + baseIm * fac.re) * invXi;
  const coef = piModeCoef(c.L1, 1), A = W, h = A / K;
  const pts = [[0, 0]];
  let re = 0, im = 0, n = 0;
  const total = 2 * K;
  function one(){
    const a = -A + (n + 0.5) * h, ph = coef * a * a;
    re += br * Math.cos(ph) - bi * Math.sin(ph);
    im += br * Math.sin(ph) + bi * Math.cos(ph);
    pts.push([re, im]); n++;
  }
  return {
    get total(){ return total + 1; },
    get n(){ return n + 1; },
    step(count){ for (let k = 0, m = Math.max(0, count | 0); k < m && n < total; k++) one(); },
    result(){ return { pts, total: { re, im, mag: Math.hypot(re, im) }, count: n, len: total, h }; },
  };
}
function piPathSpiral(cfg = {}){
  const s = piPathSpiralStream(cfg);
  s.step(s.total);
  return s.result();
}

/* ===== src/qec/live.js ===== */
/* ============================================================================
 * live.js（R98 P2 新建）— 共享 LiveDriver：一次性 MC 批 → rAF 分帧演出
 *
 * 背景（用户指令「剩下的能不能都做成实时沙盒类？」）：QEC hub 七个模式的统计
 * 原先都是「参数变 → 同步跑完整批 → 画」（拖动滑块时整页卡顿几百 ms）。P2 把
 * 物理层累加器（qecStream / shorStream / gnStream / fsStream / cfStream）接到
 * 这个共享播放器上：播放时每帧只跑一段试验，统计量随帧增长（trials 计数、
 * P_L、直方图、结局分解全部在动），20fps 节制；跑满目标批自动停；暂停即冻结
 * （累加器保留，再播接着演）；参数变化重置累加器（播放中换新的**立即演一帧**
 * 接着演、暂停时补一个同步全批——与旧行为逐位一致）。noise 页（R98 P3）的
 * nzStream 同款接入。
 *
 * 节拍口径：按**时长**而非固定帧数分配每帧样本量。
 *   want = ceil(total · dt / duration)，dt = 距上一帧的真实时长
 *   ⟹ 快渲染（dt≈50ms）落回 total/60；慢渲染（dt 300–800ms）自动加大每帧样本量，
 *      仍能 ~duration 演满。样本量再夹紧到剩余量 ⟹ 永不越界，trials 精确落在 total。
 *   调度为 rAF + setTimeout 双通道（见 _arm）：rAF 死亡时 timeout 兜底。
 *
 * 契约：
 *   make()  → stream：{ step(count), result(), get total, get n }
 *   onFrame(result, n, total) 每帧回调（mode 侧：存结果 + 渲染）
 *   onState(playing) 播放态变化回调（mode 侧：同步按钮文案/样式）
 *   deactivate 必须 dispose()（停 rAF，切 mode 零泄漏）
 *
 * ?live=1：activate 收尾时 start()（URL 直达即演，与 paused 同款校验）。
 * ========================================================================== */
class LiveDriver {
  /**
   * @param {object}   o
   * @param {() => object} o.make    累加器工厂（每次 sync/重置调用，同 cfg）
   * @param {(r: object, n: number, total: number) => void} o.onFrame
   * @param {(playing: boolean) => void} [o.onState]
   * @param {number}   [o.fps=20]        帧率节制上限（rAF 仍每帧回调，只按时间闸放行）
   * @param {number}   [o.duration=3000] 一批样本的目标演出时长（ms），每帧样本量按时长反推
   */
  constructor({ make, onFrame, onState = null, fps = 20, duration = 3000 } = {}){
    this.make = make;
    this.onFrame = onFrame;
    this.onState = onState;
    this.fps = fps;
    this.duration = Math.max(600, duration | 0);
    this.stream = null;
    this.playing = false;
    this._raf = 0;
    this._last = -1e9;
    this._prev = 0;            /* 上一次 pump 的时刻；0 = 首帧（用名义帧长） */
    this.lastFrameMs = 0;      /* 最近一帧 step() 耗时（mode HUD/调试用） */
  }

  /** 名义每帧样本量（快渲染路径；慢渲染由 pump 内的时长反推接管） */
  get batch(){
    const t = this.stream ? this.stream.total : 3000;
    const frames = Math.max(1, Math.round(this.duration / (1000 / this.fps)));
    return Math.max(1, Math.round(t / frames));
  }

  /** 已跑 / 目标（按钮文案与测试断言用） */
  get progress(){
    return this.stream ? { n: this.stream.n, total: this.stream.total } : { n: 0, total: 0 };
  }

  _setPlaying(v){
    if (this.playing === v) return;
    this.playing = v;
    this.onState?.(v);
  }

  start(){
    if (this.playing) return;
    /* 演满过再播 ⟹ 换新累加器重演（same cfg ⟹ 同 rng 序列，数值可复现） */
    if (!this.stream || this.stream.n >= this.stream.total) this.stream = this.make();
    this._setPlaying(true);
    this._last = -1e9;
    this._prev = 0;
    this.pump();          /* 首帧同步（反馈不等调度器） */
    this._arm();
  }

  stop(){
    this._disarm();
    this._setPlaying(false);
  }

  toggle(){ this.playing ? this.stop() : this.start(); }

  /** recompute 钩子：cfg 变了。播放中 → 换累加器立即演一帧（反馈不等调度器）接着演；
       暂停 → 补全批 + 一帧（旧行为逐位保留） */
  sync(){
    this.stream = this.make();
    this._prev = 0;
    if (this.playing){ this.pump(); return; }
    this.stream.step(this.stream.total);
    this.onFrame(this.stream.result(), this.stream.n, this.stream.total);
  }

  /* 双通道制（R98 P4b）：rAF 保顺滑（vsync 对齐），setTimeout 保存活。
     headless / 后台标签页下 compositor 可能完全不产帧（实测 rAF 回调 0–186ms
     很快，但 12s 只来 4 次，随后彻底停产）⟹ 单靠 rAF 会「播了但不动」。
     timeout 按 fps 间隔兜底：rAF 活着时它总被闸门挡下（rAF 16ms < 50ms 先到），
     rAF 死亡时它独占推进。后台标签页 timeout 被 Chrome 节流到 1s ⟹ 降级为 1fps
     继续演，不冻死。 */
  _arm(){
    this._disarm();
    if (!this.playing) return;
    const fire = () => {
      if (!this.playing) return;
      this._disarm();
      const now = performance.now();
      if (now - this._last >= 1000 / this.fps - 1){ this._last = now; this.pump(); }
      this._arm();
    };
    this._raf = requestAnimationFrame(fire);
    this._to = setTimeout(fire, Math.max(16, Math.round(1000 / this.fps)));
  }

  _disarm(){
    if (this._raf){ cancelAnimationFrame(this._raf); this._raf = 0; }
    if (this._to){ clearTimeout(this._to); this._to = 0; }
  }

  /** 跑一帧（测试也可直接调，不必等调度器） */
  pump(){
    if (!this.stream) this.stream = this.make();
    const total = this.stream.total;
    const now = performance.now();
    /* 时长基准补样本；dt 上限 duration。长延时最多一次补足整批，
       避免后台/无头环境的重节流把三秒演出拖成几十秒。 */
    const dt = this._prev ? Math.min(this.duration, Math.max(0, now - this._prev)) : 1000 / this.fps;
    this._prev = now;
    const want = Math.max(1, Math.ceil(total * dt / this.duration));
    const count = Math.min(want, total - this.stream.n);   /* 永不越界 */
    const t0 = performance.now();
    this.stream.step(count);
    this.lastFrameMs = performance.now() - t0;
    this.onFrame(this.stream.result(), this.stream.n, total);
    if (this.stream.n >= total) this.stop();   /* 演满自动停 */
  }

  dispose(){
    this.stop();
    this.stream = null;
    this.make = null;
    this.onFrame = null;
    this.onState = null;
  }
}

const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const nf = (x, d = 4) => (Number.isFinite(x) ? x.toFixed(d) : '—');
const ex = (x, d = 2) => (Number.isFinite(x) && x !== 0 ? x.toExponential(d) : '0');
function pathCamDefault(){ return { ...hbCamDefault(), pitch: 0.48, dist: 6.8 }; }
function readPathCam(q){
  const d = pathCamDefault(), raw = q.get('cam');
  if (!raw) return d;
  const a = raw.split(',').map(Number);
  if (a.length !== 3 || !a.every(Number.isFinite)) return d;
  return { yaw: a[0], pitch: clamp(a[1], -PITCH_LIM, PITCH_LIM), dist: clamp(a[2], 4.8, 16) };
}

/* 页面侧折线（只画不求值；与 physics 的 piPolyline 同式，避免为了画图 import） */
function visualSamples(Y, cfg, nA = 5, cap = 480){
  const all = piPathSamples(Y, cfg, nA);
  if (all.length <= cap) return all;
  const out = new Array(cap);
  for (let i = 0; i < cap; i++) out[i] = all[Math.floor(i * all.length / cap)];
  return out;
}

function polyline(xa, ya, xb, yb, amps, N){
  const pts = [];
  for (let i = 0; i <= N; i++){
    const t = i / N;
    let y = ya + (yb - ya) * t;
    for (let n = 0; n < amps.length; n++) y += amps[n] * Math.sin((n + 1) * Math.PI * t);
    pts.push([xa + (xb - xa) * t, y]);
  }
  return pts;
}

class PathsApp {
  constructor(container, options = {}){
    this.container = typeof container === 'string' ? document.querySelector(container) : (container || document.body);
    const q = new URLSearchParams(location.search);
    const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
    const preset = q.get('preset') || 'double';
    const pcfg = (PI_PRESETS[preset] || PI_PRESETS.double).cfg;
    /* URL 里的 preset 必须带上它自己的 d/w（单缝是 d=0、w=20）；显式 ?d=/?w= 优先 */
    this.state = {
      preset,
      proj: q.get('proj') === '3d' ? '3d' : '2d',
      L1: num('L1', PI_DEFAULTS.L1), L2: num('L2', PI_DEFAULTS.L2),
      d: num('d', pcfg.d ?? 48), w: num('w', pcfg.w ?? 8), W: num('W', 40),
      flux: clamp(num('flux', pcfg.flux ?? 0), 0, 1),
      barrier: clamp(num('barrier', pcfg.barrier ?? 0), 0, 0.2),
      barrierWidth: clamp(num('bw', pcfg.barrierWidth ?? 12), 4, 80),
      barrierXWidth: clamp(num('bx', pcfg.barrierXWidth ?? 12), 4, 80),
      K: Math.round(num('K', PI_DEFAULTS.K)), modes: Math.round(num('modes', PI_DEFAULTS.modes)),
      nxi: Math.round(num('nxi', 7)), Y: num('Y', 0),
      openA: q.has('A') ? q.get('A') !== '0' : pcfg.openA,
      openB: q.has('B') ? q.get('B') !== '0' : pcfg.openB,
      coherent: q.has('coh') ? q.get('coh') !== '0' : pcfg.coherent,
      /* 缝数（≥3 = 等间距光栅）与「哪条路信息」ε ∈ [0,1] */
      nslit: clamp(Math.round(num('N', pcfg.nslit ?? 2)), 1, 6),
      eps: clamp(q.has('eps') ? parseFloat(q.get('eps')) : (q.has('coh') ? (q.get('coh') === '0' ? 1 : 0) : (pcfg.eps ?? 0)), 0, 1),
      reveal: q.get('reveal') === '0' ? 0 : 1,
      paused: q.get('paused') === '1',
      live: q.get('live') === '1',
    };
    this.cam = readPathCam(q); this._orbit = null;
    this._listeners = []; this._dirty = true; this._dirtyY = false; this._deferSpiral = false;
    this._gestureActive = false; this._lastGesturePaint = -Infinity; this._needDraw = true;
    this._fps = 0; this._fpsFrames = 0; this._lastFpsT = performance.now();
    this.live = null; this._userPaused = false;
    this.view = { sx: 1, yFov: 130, ox: 0, oy: 0, w: 800, h: 520, padT: 22, padB: 26, dpr: 1 };
    this.prof = null; this.samples = []; this.spir = null; this.stats = null;
    this._onError = e => {
      const d = this.q('#pvDiag'); if (d) d.textContent = 'ERR ' + e.message;
      document.title = 'ERR ' + e.message;
    };
    window.addEventListener('error', this._onError);
    this.frame = this.frame.bind(this);
  }

  q(s){ return this.container.querySelector(s); }
  on(t, type, fn, opt){ if (t){ t.addEventListener(type, fn, opt); this._listeners.push([t, type, fn]); } }

  cfg(){
    const s = this.state;
    return {
      L1: s.L1, L2: s.L2, ys: 0, d: s.d, w: s.w,
      flux: s.flux, barrier: s.barrier, barrierWidth: s.barrierWidth, barrierXWidth: s.barrierXWidth,
      modes: s.modes, K: s.K, W: s.W,
      /* ξ 求积点数按跨缝相位步长自适应（piProfile 内部同一条公式）：页面必须
         用同一个有效值报「路径总数」，否则 HUD 少报 */
      nxi: piNxiFor(s.w, s.L2, this.view.yFov, s.nxi),
      nY: 241, yFov: this.view.yFov,
      openA: s.openA, openB: s.openB, coherent: s.coherent,
      nslit: s.nslit, eps: s.eps,
    };
  }

  mount(){
    injectStyles();
    injectResponsive();
    const st = document.createElement('style');
    st.textContent = PV_CSS;
    document.head.appendChild(st);

    this.container.insertAdjacentHTML('beforeend', `

        <div class="chk" style="margin-top:-2px"><span style="font-size:10.5px;color:var(--dim)">AB：理想磁通管置于缝间，沿路累计 Wilson 相位；双缝相差 2πΦ/Φ₀。高斯势场沿路积分 −∫Vdt（非薄屏）</span></div>

        <div id="pvBand">
          <button id="pvDrawerPanel" title="展开/收起控制面板（窄屏）">⚙ 控制</button>
          <button id="pvDrawerHud" title="展开/收起读数（窄屏）">◫ 读数</button>
        </div>
        <canvas id="pvMain"></canvas>
        <canvas id="pvSpiral"></canvas>
        <canvas id="pvProfile"></canvas>
      </div>

      <aside id="pvHud" class="panel qhud">
        <div class="hrow"><span>当前情形</span><span id="hCase">—</span></div>
        <div class="hrow"><span>路径总数</span><span id="hN">—</span></div>
