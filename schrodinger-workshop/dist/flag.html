/* ===== src/physics/qcircuit.js ===== */
/* ============================================================================
 * qcircuit.js — R75 小规模量子线路：态矢模拟器（纯 CPU，n ≤ 12）
 *
 * 约定（页面、测试、文档共用同一套，写错一处就会全盘错位）：
 *   ① 态矢 ψ = Σ_i a_i |i⟩，i ∈ [0, 2^n)；**指数的第 k 位 = 量子比特 k**
 *      （LSB 是 q0）。X 作用在 q_k 上就是翻转指数的第 k 位。
 *   ② 振幅存成两条 Float64Array（re/im），门是 2×2 复矩阵 {a,b,c,d}（各为 [re,im]）。
 *   ③ 受控门：控制位全 1 时才作用；CNOT 的 c=[control]、t=target。
 *   ④ 子系统 A = **低 k_A 位**（q0..q_{k_A−1}），环境 = 高位块；这样 reshape 成
 *      [2^{n−kA}][2^{kA}] 就是连续的，约化密度矩阵直接 Gram 求和。
 *   ⑤ 全局相位不可观测：涉及 Rz/Rx/Ry 的断言一律用保真度 |⟨φ|ψ⟩|² 或概率，
 *      不比振幅本身（相位约定不同不是 bug）。
 *
 * 复杂度：单门 O(2^n)；n=12 时 4096 振幅、单门 ~4096 次复乘（微秒级）。
 * ========================================================================== */

/* ---------- 复数小工具 ---------- */
const cx = (re, im) => ({ re, im });
const cadd = (x, y) => cx(x.re + y.re, x.im + y.im);
const cmul = (x, y) => cx(x.re * y.re - x.im * y.im, x.re * y.im + x.im * y.re);
const cabs2 = x => x.re * x.re + x.im * x.im;
const C0 = cx(0, 0), C1 = cx(1, 0), CI = cx(0, 1);

/* ---------- 门表 ---------- */
/* 每个门：{ name, arity, matrix? }；带参门由工厂生成 */
const S2 = Math.SQRT1_2;

const QC_UNARY = {
  h: { label: 'H', m: [cx(S2, 0), cx(S2, 0), cx(S2, 0), cx(-S2, 0)] },
  x: { label: 'X', m: [C0, C1, C1, C0] },
  y: { label: 'Y', m: [C0, cx(0, -1), cx(0, 1), C0] },
  z: { label: 'Z', m: [C1, C0, C0, cx(-1, 0)] },
  s: { label: 'S', m: [C1, C0, C0, CI] },
  sdg: { label: 'S†', m: [C1, C0, C0, cx(0, -1)] },
  t: { label: 'T', m: [C1, C0, C0, cx(Math.SQRT1_2, Math.SQRT1_2)] },
  tdg: { label: 'T†', m: [C1, C0, C0, cx(Math.SQRT1_2, -Math.SQRT1_2)] },
};

function qcRotation(op, theta){
  const c = Math.cos(theta / 2), s = Math.sin(theta / 2);
  if (op === 'rx') return [cx(c, 0), cx(0, -s), cx(0, -s), cx(c, 0)];
  if (op === 'ry') return [cx(c, 0), cx(-s, 0), cx(s, 0), cx(c, 0)];
  if (op === 'rz') return [cx(Math.cos(theta / 2), -Math.sin(theta / 2)), C0, C0,
                           cx(Math.cos(theta / 2), Math.sin(theta / 2))];
  throw new Error('unknown rotation ' + op);
}

/* ---------- 态 ---------- */
function qcNewState(n){
  const dim = 1 << n;
  const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
  s.re[0] = 1;
  return s;
}
/* 基态 |j⟩（qcNewState 默认给 |0⟩；测试与页面都需要任意基态，别手写 re[j]=1
   ——那会和已有的 re[0]=1 叠加成两个基态的相干和，是本轮踩过的坑）。 */
function qcBasis(n, j){
  const dim = 1 << n;
  const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
  s.re[j & (dim - 1)] = 1;
  return s;
}
function qcClone(s){
  return { n: s.n, dim: s.dim, re: Float64Array.from(s.re), im: Float64Array.from(s.im) };
}
function qcNorm(s){
  let a = 0;
  for (let i = 0; i < s.dim; i++) a += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return a;
}
function qcProbs(s){
  const p = new Float64Array(s.dim);
  for (let i = 0; i < s.dim; i++) p[i] = s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return p;
}
/* 归一化（测量后、数值漂移后） */
function qcRenormalize(s){
  const n2 = qcNorm(s);
  if (n2 <= 0) throw new Error('norm collapsed');
  const k = 1 / Math.sqrt(n2);
  for (let i = 0; i < s.dim; i++){ s.re[i] *= k; s.im[i] *= k; }
  return s;
}

/* ---------- 门作用 ---------- */
/* 单比特矩阵 m 作用在比特 q（就地） */
function applyMatrix(s, m, q){
  const bit = 1 << q;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    if (i & bit) continue;
    const j = i | bit;
    const a0r = re[i], a0i = im[i], a1r = re[j], a1i = im[j];
    /* m = [m00 m01; m10 m11]，逐项展开免临时对象 */
    re[i] = m[0].re * a0r - m[0].im * a0i + m[1].re * a1r - m[1].im * a1i;
    im[i] = m[0].re * a0i + m[0].im * a0r + m[1].re * a1i + m[1].im * a1r;
    re[j] = m[2].re * a0r - m[2].im * a0i + m[3].re * a1r - m[3].im * a1i;
    im[j] = m[2].re * a0i + m[2].im * a0r + m[3].re * a1i + m[3].im * a1r;
  }
}
function ctrlMask(controls){
  let m = 0;
  for (const c of controls || []) m |= 1 << c;
  return m;
}
/* 受控单比特门：控制位全 1 时才对 target 作用。就地实现：逐对扫描后仅处理
   满足控制条件的指数（不做子空间拷贝，n=12 也只有 4096 次判断） */
function applyControlled(s, m, q, controls){
  const mask = ctrlMask(controls);
  if (!mask){ applyMatrix(s, m, q); return; }
  const bit = 1 << q;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    if ((i & mask) !== mask) continue;
    if (i & bit) continue;
    const j = i | bit;
    const a0r = re[i], a0i = im[i], a1r = re[j], a1i = im[j];
    re[i] = m[0].re * a0r - m[0].im * a0i + m[1].re * a1r - m[1].im * a1i;
    im[i] = m[0].re * a0i + m[0].im * a0r + m[1].re * a1i + m[1].im * a1r;
    re[j] = m[2].re * a0r - m[2].im * a0i + m[3].re * a1r - m[3].im * a1i;
    im[j] = m[2].re * a0i + m[2].im * a0r + m[3].re * a1i + m[3].im * a1r;
  }
}
function applySwap(s, a, b){
  const ba = 1 << a, bb = 1 << b;
  if (a === b) return;
  const { re, im } = s;
  for (let i = 0; i < s.dim; i++){
    const ia = (i & ba) ? 1 : 0, ib = (i & bb) ? 1 : 0;
    if (ia === ib) continue;
    if (ia === 0) continue;             /* 每对只处理一次（i 的 a 位为 0、b 位为 1） */
    const j = i ^ ba ^ bb;
    const tr = re[i], ti = im[i];
    re[i] = re[j]; im[i] = im[j];
    re[j] = tr; im[j] = ti;
  }
}

/* 展开成统一形式：{ op, q, c, theta } */
function qcApply(s, g){
  const op = g.op;
  if (op === 'cnot'){ applyControlled(s, QC_UNARY.x.m, g.t ?? g.q2, [g.c ?? g.q1]); return s; }
  if (op === 'cz'){ applyControlled(s, QC_UNARY.z.m, g.t ?? g.q2, [g.c ?? g.q1]); return s; }
  if (op === 'swap'){ applySwap(s, g.q1, g.q2); return s; }
  if (op === 'toffoli'){
    applyControlled(s, QC_UNARY.x.m, g.q3, [g.q1, g.q2]); return s;
  }
  if (op === 'rx' || op === 'ry' || op === 'rz'){
    const m = qcRotation(op, g.theta ?? 0);
    if (g.c != null) applyControlled(s, m, g.q, [g.c]);
    else applyMatrix(s, m, g.q);
    return s;
  }
  if (op === 'phase'){
    /* P(φ)=diag(1,e^{iφ})：受控 P 就是标准「受控相位门」diag(1,1,1,e^{iφ})。
       QFT 必须用它而不是受控 Rz——受控 Rz 差一个控制位上的 Rz(φ)，只对
       计算基输入无害，对叠加输入会错（这也是本轮设计时纠正的一处）。 */
    const th = g.theta ?? 0;
    const m = [C1, C0, C0, cx(Math.cos(th), Math.sin(th))];
    if (g.c != null) applyControlled(s, m, g.q, [g.c]);
    else applyMatrix(s, m, g.q);
    return s;
  }
  const u = QC_UNARY[op];
  if (!u) throw new Error('unknown gate ' + op);
  if (g.c != null) applyControlled(s, u.m, g.q, [g.c]);
  else applyMatrix(s, u.m, g.q);
  return s;
}
function qcApplyAll(s, gates){ for (const g of gates) qcApply(s, g); return s; }

/* 稠密矩阵（测试用，n ≤ 3）：把线路作用到每个基矢上拼成列 */
function qcProgramMatrix(n, gates){
  const dim = 1 << n;
  const M = [];
  for (let k = 0; k < dim; k++){
    const s = { n, dim, re: new Float64Array(dim), im: new Float64Array(dim) };
    s.re[k] = 1;
    qcApplyAll(s, gates);
    M.push(s);
  }
  return M;   /* M[k][j] = 第 k 列的第 j 行 = ⟨j|U|k⟩ */
}

/* ---------- 测量与统计 ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 按 |a|² 抽样一个指数 */
function qcSample(s, rng){
  const p = qcProbs(s);
  const u = rng();
  let acc = 0;
  for (let i = 0; i < s.dim; i++){
    acc += p[i];
    if (u < acc) return i;
  }
  return s.dim - 1;
}
/* 塌缩到指数 i（就地归一化，其余振幅归零） */
function qcCollapse(s, idx){
  for (let i = 0; i < s.dim; i++){ if (i !== idx){ s.re[i] = 0; s.im[i] = 0; } }
  qcRenormalize(s);
  return s;
}
/* 单比特边缘：p0 = P(该位=0) */
function qcMarginal(s, q){
  const bit = 1 << q;
  let p1 = 0;
  for (let i = 0; i < s.dim; i++) if (i & bit) p1 += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  return { p0: 1 - p1, p1, z: 1 - 2 * p1 };
}
/* 两体 ZZ 关联 ⟨Z_a Z_b⟩（实；Z 对角） */
function qcZZ(s, a, b){
  const ba = 1 << a, bb = 1 << b;
  let v = 0;
  for (let i = 0; i < s.dim; i++){
    const sa = (i & ba) ? -1 : 1, sb = (i & bb) ? -1 : 1;
    v += sa * sb * (s.re[i] * s.re[i] + s.im[i] * s.im[i]);
  }
  return v;
}
function qcPauliCorr(s, a, pa, b, pb){
  const t = qcClone(s);
  const applyTo = (st, q, p) => {
    if (p === 'x') applyMatrix(st, QC_UNARY.x.m, q);
    else if (p === 'y') applyMatrix(st, QC_UNARY.y.m, q);
    else if (p === 'z'){
      const bit = 1 << q;
      for (let i = 0; i < st.dim; i++) if (i & bit){ st.re[i] = -st.re[i]; st.im[i] = -st.im[i]; }
    }
  };
  /* 先作用在 |ψ⟩ 上得到 P_b|ψ⟩，再与 P_a|ψ⟩ 内积 */
  applyTo(t, b, pb);
  const u = qcClone(s);
  applyTo(u, a, pa);
  let re = 0, im = 0;
  for (let i = 0; i < s.dim; i++){
    re += u.re[i] * t.re[i] + u.im[i] * t.im[i];
    im += u.im[i] * t.re[i] - u.re[i] * t.im[i];
  }
  /* ⟨u|t⟩ 应为实数（对易/反对易都给实数） */
  return re;
}

/* ---------- 纠缠 ---------- */
/* 约化密度矩阵 ρ_A（A = 低 kA 位）的特征值：Gram 矩阵 ρ[i][j]=Σ_e ψ(i,e)ψ*(j,e)，
   用实嵌入 [[Re,−Im],[Im,Re]] 的 Jacobi（本征值各二重，排序后隔一取、不折半，
   与 R73 熵的修法同一坑）。 */
function jacobiReal(A, m, sweeps = 60){
  const V = [];
  for (let i = 0; i < m; i++){ V.push(new Float64Array(m)); V[i][i] = 1; }
  for (let sw = 0; sw < sweeps; sw++){
    let off = 0;
    for (let p = 0; p < m; p++) for (let q = p + 1; q < m; q++) off += A[p][q] * A[p][q];
    if (off < 1e-30) break;
    for (let p = 0; p < m; p++){
      for (let q = p + 1; q < m; q++){
        const apq = A[p][q];
        if (Math.abs(apq) < 1e-18) continue;
        const theta = (A[q][q] - A[p][p]) / (2 * apq);
        const t = Math.sign(theta || 1) / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
        const c = 1 / Math.sqrt(t * t + 1), sn = t * c;
        for (let k = 0; k < m; k++){
          const akp = A[k][p], akq = A[k][q];
          A[k][p] = c * akp - sn * akq;
          A[k][q] = sn * akp + c * akq;
        }
        for (let k = 0; k < m; k++){
          const apk = A[p][k], aqk = A[q][k];
          A[p][k] = c * apk - sn * aqk;
          A[q][k] = sn * apk + c * aqk;
        }
        for (let k = 0; k < m; k++){
          const vkp = V[k][p], vkq = V[k][q];
          V[k][p] = c * vkp - sn * vkq;
          V[k][q] = sn * vkp + c * vkq;
        }
      }
    }
  }
  const val = [];
  for (let i = 0; i < m; i++) val.push(A[i][i]);
  return { val, vec: V };
}

function qcReducedRho(s, kA){
  const mA = 1 << kA, rest = s.dim / mA;
  const A = [];
  for (let i = 0; i < 2 * mA; i++) A.push(new Float64Array(2 * mA));
  for (let i = 0; i < mA; i++){
    for (let j = 0; j < mA; j++){
      let rr = 0, ii = 0;
      for (let e = 0; e < rest; e++){
        const p = e * mA + i, q = e * mA + j;
        rr += s.re[p] * s.re[q] + s.im[p] * s.im[q];
        ii += s.re[p] * s.im[q] - s.im[p] * s.re[q];
      }
      /* ρ = [[rr, -ii],[ii, rr]] 的实嵌入块 */
      A[i][j] += rr;
      A[i][mA + j] += -ii;
      A[mA + i][j] += ii;
      A[mA + i][mA + j] += rr;
    }
  }
  /* i,j 与 j,i 的实部对称性由上面求和自动满足（ρ 厄米） */
  return A;
}

function qcEntropy(s, kA){
  const mA = 1 << kA, m = 2 * mA;
  const A = qcReducedRho(s, kA);
  const { val } = jacobiReal(A, m, 80);
  const sorted = val.slice().sort((a, b) => b - a);
  const lam = [];
  for (let i = 0; i < m; i += 2){          /* 实嵌入本征值各二重 ⟹ 隔一取 */
    const v = Math.max(0, sorted[i]);
    if (v > 1e-14) lam.push(v);
  }
  const sum = lam.reduce((a, b) => a + b, 0);
  let S = 0;
  for (const v of lam) if (v > 1e-14) S -= v * Math.log(v);
  /* λ=1 的纯态在 float64 里会算出 −0（Σ 干净时 −1·log1 = −0），钳到 0 */
  if (S < 0 && S > -1e-12) S = 0;
  return { S, spectrum: lam, sum, kA, dimA: mA };
}

/* 两比特 concurrence（n=2，A 取 q0）：C = 2|a00 a11 − a01 a10| */
function qcConcurrence(s){
  if (s.n !== 2) return NaN;
  const [a00r, a00i] = [s.re[0], s.im[0]];
  const [a01r, a01i] = [s.re[1], s.im[1]];
  const [a10r, a10i] = [s.re[2], s.im[2]];
  const [a11r, a11i] = [s.re[3], s.im[3]];
  const dr = a00r * a11r - a00i * a11i - (a01r * a10r - a01i * a10i);
  const di = a00r * a11i + a00i * a11r - (a01r * a10i + a01i * a10r);
  return 2 * Math.hypot(dr, di);
}

/* 保真度 |⟨φ|ψ⟩|² */
function qcFidelity(s, t){
  if (s.dim !== t.dim) return NaN;
  let re = 0, im = 0;
  for (let i = 0; i < s.dim; i++){
    re += s.re[i] * t.re[i] + s.im[i] * t.im[i];
    im += s.re[i] * t.im[i] - s.im[i] * t.re[i];
  }
  const d = qcNorm(s) * qcNorm(t);
  return d > 0 ? (re * re + im * im) / d : 0;
}

/* 振幅信息（页面/测试用）：指数、|a|、相位 */
function qcAmplitudes(s){
  const out = [];
  for (let i = 0; i < s.dim; i++){
    const p = s.re[i] * s.re[i] + s.im[i] * s.im[i];
    if (p < 1e-14) continue;
    out.push({ i, re: s.re[i], im: s.im[i], abs: Math.sqrt(p), phase: Math.atan2(s.im[i], s.re[i]) });
  }
  return out;
}
/* 把指数写成 |q_{n-1}…q_0⟩ 的比特串（显示用：最左 = 最高位） */
function qcBits(idx, n){
  let s = '';
  for (let k = n - 1; k >= 0; k--) s += ((idx >> k) & 1) ? '1' : '0';
  return s;
}

/* QFT 线路（n 比特）。**次序是实测定的**（穷举 n=2 的八种变体，只有这一族给出
   2.7e-16 的 DFT 符合）：
     从最高位 j=n−1 往下：H(q_j)，再由每个更低位 q_k（k<j）控制一个
     相位门 φ=π/2^{j−k}，最后把比特顺序整体反转（SWAP 对）。
   为什么不是「从低位往上」：那种写法里相位落在还没做过 H 的高位上，控制位此刻
   还是计算基态，相位永远不起作用——n=2 的输出只剩 ±1/√N 的实数符号（本轮踩过）。
   受控相位门 diag(1,1,1,e^{iφ}) 对控制/目标对称，所以 q_j 与 q_k 的角色互换等价。 */
function qcQftGates(n, inverse = false){
  const g = [];
  for (let j = n - 1; j >= 0; j--){
    g.push({ op: 'h', q: j });
    for (let k = j - 1; k >= 0; k--){
      g.push({ op: 'phase', q: j, c: k, theta: Math.PI / (1 << (j - k)) });
    }
  }
  for (let i = 0; i < (n >> 1); i++) g.push({ op: 'swap', q1: i, q2: n - 1 - i });
  return inverse ? qcInvertGates(g) : g;
}

/* 通用逆线路：逆序 + 每个门取逆（h/x/y/z/swap/cnot/cz/toffoli 自逆；s↔sdg、
   t↔tdg；带参门 θ→−θ）。pot75 用它验证 U†U=I。 */
function qcInvertGates(gates){
  const dual = { s: 'sdg', sdg: 's', t: 'tdg', tdg: 't' };
  return gates.slice().reverse().map(g => {
    if (g.op === 'phase' || g.op === 'rx' || g.op === 'ry' || g.op === 'rz')
      return { ...g, theta: -(g.theta ?? 0) };
    return { ...g, op: dual[g.op] || g.op };
  });
}

function qcPresetGates(name, n){
  if (name === 'qft') return qcQftGates(n ?? 4);
  const p = QC_PRESETS[name];
  if (!p) return [];
  if (name === 'ghz' && n && n !== p.n){
    const g = [{ op: 'h', q: 0 }];
    for (let k = 1; k < n; k++) g.push({ op: 'cnot', c: 0, q2: k });
    return g;
  }
  return p.gates.map(x => ({ ...x }));
}

/* ============================================================================
 * 经典寄存器与「测量-前馈」（R76）
 *
 * R75 的线路是纯酉的：门依次作用，末尾才允许测量。真实的协议（传态、纠错、
 * 迭代相位估计）需要**中途测量 + 用结果控制后面的门**。这里补上两件事：
 *   ① qcMeasureQubit：只测一个比特（投影到该位的 0/1 子空间 + 归一化），
 *      不是把整个态塌到一个基态——传态里测 q0/q1 之后 q2 的叠加必须留着；
 *   ② qcExec：把 {op:'measure'}、{op:'cond'} 与普通门统一成「一步」。
 * ========================================================================== */

function qcNewClassical(nbits){ return new Uint8Array(nbits); }

/* 单比特 Z 基测量：返回 0/1，就地把态投影到对应子空间并归一化 */
function qcMeasureQubit(s, q, rng){
  const bit = 1 << q;
  let p1 = 0;
  for (let i = 0; i < s.dim; i++) if (i & bit) p1 += s.re[i] * s.re[i] + s.im[i] * s.im[i];
  const out = rng() < p1 ? 1 : 0;
  for (let i = 0; i < s.dim; i++){
    const has = (i & bit) ? 1 : 0;
    if (has !== out){ s.re[i] = 0; s.im[i] = 0; }
  }
  qcRenormalize(s);
  return out;
}

/* 执行一步：普通门 / 测量写入经典位 / 条件门 */
function qcExec(s, op, cres, rng){
  if (op.op === 'measure'){
    const bit = qcMeasureQubit(s, op.q, rng);
    if (cres && op.cbit != null) cres[op.cbit] = bit;
    return { kind: 'measure', q: op.q, cbit: op.cbit, bit };
  }
  if (op.op === 'cond'){
    const on = cres ? !!cres[op.cbit] : false;
    if (on) qcApply(s, op.gate);
    return { kind: 'cond', cbit: op.cbit, on };
  }
  qcApply(s, op);
  return { kind: 'gate' };
}

/* 跑一整段（含测量/条件），返回每步的记录 */
function qcRunProgram(s, ops, rng, cres = qcNewClassical(8)){
  const rec = [];
  for (const op of ops) rec.push(qcExec(s, op, cres, rng));
  return { cres, rec };
}

/* 任意比特的约化密度矩阵（2×2，复）：ρ[a][b] = Σ_rest ψ(a,rest) ψ*(b,rest) */
function qcQubitRho(s, q){
  const bit = 1 << q;
  const rr = [[0, 0], [0, 0]], ii = [[0, 0], [0, 0]];
  for (let i = 0; i < s.dim; i++){
    if (i & bit) continue;
    const j = i | bit;
    /* |0⟩⟨0| / |1⟩⟨1| 对角 */
    rr[0][0] += s.re[i] * s.re[i] + s.im[i] * s.im[i];
    rr[1][1] += s.re[j] * s.re[j] + s.im[j] * s.im[j];
    /* 非对角：ψ0 ψ1* = (r0+ii0)(r1−ii1) */
    rr[0][1] += s.re[i] * s.re[j] + s.im[i] * s.im[j];
    ii[0][1] += s.im[i] * s.re[j] - s.re[i] * s.im[j];
  }
  rr[1][0] = rr[0][1];
  ii[1][0] = -ii[0][1];
  return { re: rr, im: ii };
}

/* 纯态 |ψ⟩=α|0⟩+β|1⟩ 与 ρ 的保真度 ⟨ψ|ρ|ψ⟩（α,β 为 [re,im]） */
function qcRhoFidelity(rho, alpha, beta){
  const a = alpha, b = beta;
  const ac = [a[0], -a[1]], bc = [b[0], -b[1]];
  const mul = (x, y) => [x[0]*y[0] - x[1]*y[1], x[0]*y[1] + x[1]*y[0]];
  const add = (x, y) => [x[0]+y[0], x[1]+y[1]];
  /* v = ρ|ψ⟩: v_a = Σ_b ρ_ab ψ_b */
  let v0 = add(mul([rho.re[0][0], rho.im[0][0]], b), [0, 0]);
  v0 = add([0, 0], mul([rho.re[0][0], rho.im[0][0]], b));
  v0 = add(v0, mul([rho.re[0][1], rho.im[0][1]], [0, 0]));
  /* 上面写复杂了，直接逐项算 */
  v0 = add(mul([rho.re[0][0], rho.im[0][0]], a), mul([rho.re[0][1], rho.im[0][1]], b));
  const v1 = add(mul([rho.re[1][0], rho.im[1][0]], a), mul([rho.re[1][1], rho.im[1][1]], b));
  const val = add(mul(ac, v0), mul(bc, v1));
  return val[0];
}

/* 单比特态制备：Ry(θ) 再 Rz(φ) ⟹ cos(θ/2)|0⟩ + e^{iφ} sin(θ/2)|1⟩ */
function qcPrep1q(theta, phi, q = 0){
  return [{ op: 'ry', q, theta }, { op: 'rz', q, theta: phi }];
}

/* |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩ 的振幅（测试/显示用） */
function qcTargetAmps(theta, phi){
  return { alpha: [Math.cos(theta / 2), 0], beta: [Math.sin(theta / 2) * Math.cos(phi), Math.sin(theta / 2) * Math.sin(phi)] };
}

/* 传态线路：q0 载待传态，q1/q2 为 Bell 对，Bell 测量后按 m0→Z、m1→X 修正 q2。
   经典位：cbit 0 = m0（q0 的 H 之后测量），cbit 1 = m1（q1 测量）。 */
function qcTeleportGates(theta = 1.0, phi = 0.4, withFix = true){
  const g = [];
  /* ① 制备待传态到 q0 */
  g.push(...qcPrep1q(theta, phi, 0));
  /* ② Bell 对 (q1,q2) */
  g.push({ op: 'h', q: 1 }, { op: 'cnot', c: 1, q2: 2 });
  /* ③ Bell 测量 */
  g.push({ op: 'cnot', c: 0, q2: 1 }, { op: 'h', q: 0 });
  g.push({ op: 'measure', q: 0, cbit: 0 });
  g.push({ op: 'measure', q: 1, cbit: 1 });
  /* ④ 经典前馈 */
  if (withFix){
    g.push({ op: 'cond', cbit: 1, gate: { op: 'x', q: 2 } });
    g.push({ op: 'cond', cbit: 0, gate: { op: 'z', q: 2 } });
  }
  return g;
}

/* ===== src/physics/shor.js ===== */
/* ============================================================================
 * shor.js — R79 Shor 9 比特码：3×3 级联，纠正**任意**单比特错误
 *
 * 结构（把 R78 的两个 3 比特重复码串起来）：
 *
 *   逻辑 |0⟩ ⟹ [(|000⟩+|111⟩)/√2]⊗3     逻辑 |1⟩ ⟹ [(|000⟩−|111⟩)/√2]⊗3
 *
 *   - 外层（跨 3 个块）管 **Z** 类错误：稳定子 X₀X₁X₂X₃X₄X₅、X₃X₄X₅X₆X₇X₈
 *   - 内层（每块 3 比特）管 **X** 类错误：稳定子 Z₀Z₁、Z₁Z₂、Z₃Z₄、Z₄Z₅、Z₆Z₇、Z₇Z₈
 *   8 个稳定子生成元全部独立 ⟹ 码空间维数 2⁹/2⁸ = 2（正好 1 个逻辑比特）。
 *
 * 关键恒等式（本轮 pot79 逐条验证）：
 *   ① 27 种单比特 Pauli（9 位置 × X/Y/Z）的综合互不相同 ⟹ 单错必纠（态矢 F=1 精确）
 *   ② 码距 = 3：N(S)\S 的最小权重是 3（X_L=X₀X₁X₂ / Z_L=Z₀Z₃Z₆ / Y_L=X_L·Z_L）⟹ 权重 ≤2 无逻辑
 *   ③ 精确 P_L(p)：穷举 3⁹ = 19683 个错误模式，按「最大似然解码（截断到权重 ≤2）」
 *      逐模式判定，得到关 p 的 9 次多项式（10 个整数 fail[0..9] 完全决定）
 *   ④ 与 R78 重复码在**同一** i.i.d. Pauli 信道下对照（repPLexact：Z 类错误穿透）
 *
 * 实现要点：Pauli 用**辛表示**（x/z 两个 9 位掩码，忽略全局相位——相位不影响综合征
 * 与陪集归属）；乘积 = 按位异或；对易子 = 辛内积奇偶。综合征 = 错误与 8 个生成元的
 * 对易向量。态矢真跑用**单个复用 ancilla 顺序测 8 个稳定子**（10 比特，测后重置），
 * 与并行 8-ancilla（17 比特，shorTrialParallel）在同种子下逐位一致——pot79 D 组对账。
 * ========================================================================== */

const SHOR_N = 9;

const SHOR_DEFAULTS = {
  p: 0.05,
  /* 逻辑初态 Ry(θ)Rz(φ)|0⟩。默认 **|+i⟩**（θ=π/2, φ=π/2）——与 R78 同口径：
     X_L|+i⟩=|−i⟩、Z_L|+i⟩=|−i⟩ 都可观测；但 Y_L|+i⟩=|+i⟩ 不可观测（|+i⟩ 是 Y 的
     +1 本征态），所以 pot79 另跑 (θ=0.9, φ=1.3) 参考态覆盖 Y_L，并以穷举代数
 *     判定（shorCoset）作为无参考态依赖的终极判据。 */
  theta: Math.PI / 2, phase: Math.PI / 2,
  trials: 3000,
  seed: 7,
};

/* ---------- Pauli 辛表示 ---------- */
function shorPauli(q, t){
  const b = 1 << q;
  if (t === 'x') return { x: b, z: 0 };
  if (t === 'z') return { x: 0, z: b };
  if (t === 'y') return { x: b, z: b };
  return { x: 0, z: 0 };
}
function shorMul(a, b){ return { x: a.x ^ b.x, z: a.z ^ b.z }; }
const parity = v => { let c = 0; while (v){ c ^= v & 1; v >>= 1; } return c; };
function shorCommutes(a, b){ return (parity(a.x & b.z) + parity(a.z & b.x)) % 2 === 0; }

/* ---------- 稳定子 ---------- */
const SHOR_STABS = [
  { k: 'z', qs: [0, 1], label: 'Z₀Z₁', short: 'Z01' },
  { k: 'z', qs: [1, 2], label: 'Z₁Z₂', short: 'Z12' },
  { k: 'z', qs: [3, 4], label: 'Z₃Z₄', short: 'Z34' },
  { k: 'z', qs: [4, 5], label: 'Z₄Z₅', short: 'Z45' },
  { k: 'z', qs: [6, 7], label: 'Z₆Z₇', short: 'Z67' },
  { k: 'z', qs: [7, 8], label: 'Z₇Z₈', short: 'Z78' },
  { k: 'x', qs: [0, 1, 2, 3, 4, 5], label: 'X₀X₁X₂X₃X₄X₅', short: 'X012345' },
  { k: 'x', qs: [3, 4, 5, 6, 7, 8], label: 'X₃X₄X₅X₆X₇X₈', short: 'X345678' },
];
function shorStabVec(g){
  let x = 0, z = 0;
  for (const q of g.qs){ if (g.k === 'x') x |= 1 << q; else z |= 1 << q; }
  return { x, z };
}
const GENVEC = SHOR_STABS.map(shorStabVec);

/* 逻辑算符（各取最小权重代表，权重都是 3 ⟹ 码距 3）：
   X_L = Z₀Z₃Z₆（每块各翻一个 Z —— 「块级比特翻转」：把 |0_L⟩ 翻成 |1_L⟩）
   Z_L = X₀X₁X₂（一块内全翻 X —— 「块级相位翻转」：|0_L⟩→|0_L⟩、|1_L⟩→−|1_L⟩）
   Y_L = X_L·Z_L = Y₀X₁X₂Z₃Z₆（权重 5；Y 陪集中最小权重代表就是 5——权重 3 的
         Y₀Y₃Y₆ ∉ N(S)（与 Z₀Z₁ 反对易），根本不能当代表，首版在此翻车）
   ⚠ R81 修正：这两个**标签**在 R79 里是对调的（源码与 README 都写成 X_L=X₀X₁X₂、
   Z_L=Z₀Z₃Z₆）。内层是**相位翻转码**（稳定子 Z₀Z₁、Z₁Z₂），对它而言 X₀X₁X₂ 的
   特征值是 (|0_L⟩:+1, |1_L⟩:−1) ⟹ 作用为 Z_L；Z₀Z₃Z₆ 才把 |0_L⟩ 翻成 |1_L⟩ ⟹ X_L。
   判据是编码器数值（pot81 E5）：⟨0_L|X₀X₁X₂|0_L⟩=1、⟨1_L|X₀X₁X₂|1_L⟩=−1。
   陪集**划分**不受影响（同四个陪集、同一分割），只是 1/2 号标签互换；R79 的
   「coset≠0 ⟹ 逻辑失败」结论与全部计数都不变（只是 36/81 的归属对调）。
   ⚠ 历史 bug：首版把 Z_L 误设成 Z₀Z₁Z₂（它与 X₀…X₅ 反对易 ⟹ 不在 N(S)），
   跨块 ZZ 双错的残差 Z₀Z₃Z₆ 被误报 coset=−1。由暴力枚举 N(S) 的 4 陪集抓出。 */
const SHOR_LOGICALS = [
  { name: 'X_L', v: { x: 0, z: 0b001001001 }, label: 'Z₀Z₃Z₆' },
  { name: 'Z_L', v: { x: 0b000000111, z: 0 }, label: 'X₀X₁X₂' },
  { name: 'Y_L', v: { x: 0b000000111, z: 0b001001001 }, label: 'Y₀X₁X₂Z₃Z₆' },
];

/* 稳定子群 S = ⟨8 生成元⟩：2⁸ = 256 个元素（生成元独立性由计数自证） */
const STAB_SPAN = (() => {
  const set = new Set();
  for (let m = 0; m < 256; m++){
    let x = 0, z = 0;
    for (let b = 0; b < 8; b++) if (m & (1 << b)){ x ^= GENVEC[b].x; z ^= GENVEC[b].z; }
    set.add(x * 512 + z);
  }
  return set;
})();
function shorInStabilizer(v){ return STAB_SPAN.has(v.x * 512 + v.z); }
const SHOR_STAB_COUNT = STAB_SPAN.size;

/* 残差落在哪个陪集：0 = S 内（纠回）· 1 = X_L·S · 2 = Z_L·S · 3 = Y_L·S · −1 = 不在 N(S)
   N(S)/S ≅ Z₂×Z₂ 有 4 个元素，四陪集互不相交且并集 = N(S)（pot79 A 组穷举验证）。
   注意判定顺序无关：v ∈ Y_L·S 时 v·X_L 与 v·Z_L 都不在 S（否则陪集会重合）。 */
function shorCoset(v){
  if (shorInStabilizer(v)) return 0;
  for (let i = 0; i < SHOR_LOGICALS.length; i++){
    if (shorInStabilizer(shorMul(v, SHOR_LOGICALS[i].v))) return i + 1;
  }
  return -1;
}

/* 错误模式 [{q,t},...] → 8 位综合征（bit = 与该生成元反对易 = 1，即本征值 −1） */
function shorSyndromeOf(errs){
  const syn = [];
  for (const g of SHOR_STABS){
    let b = 0;
    for (const e of errs){
      if (!g.qs.includes(e.q)) continue;
      if (g.k === 'z'){ if (e.t === 'x' || e.t === 'y') b ^= 1; }
      else { if (e.t === 'z' || e.t === 'y') b ^= 1; }
    }
    syn.push(b);
  }
  return syn;
}

/* ---------- 解码表：综合征 → 修正 Pauli 列表 ----------
   候选按权重分层（恒等 → 27 个单错 → 324 个双错），同综合征取权重最小、再取字典序最小。
   在 i.i.d. 等概信道下 P(单错)=p/3 > P(双错)=(p/3)²（p<3 恒成立）⟹ 这就是截断到
   权重 ≤2 的**最大似然**解码。
   ⚠ 注意一（pot79 A6 留档）：同一综合征的候选**不保证同陪集**——X₂（权重 1）与 X₀X₁
   （权重 2）综合征相同，但残差分别在 S 与 X_L·S。这正是 ML 分层起作用的机制：优先信
   低权重。
   ⚠ 注意二（pot79 A6b 留档，比注意一更强）：同一综合征的**同最小权重**候选也不保证
   同陪集——混合 Pauli 类型下两个权重 2 候选的乘积可以是权重 3 ∈ N(S)\S（此前
   「|s1Δs2| 无奇偶关系 ⟹ 乘积权重 ≥5」的手工论证有误：该奇偶关系只约束 x/z 掩码
   的汉明重量，不约束混合类型乘积）。pot79 实证 18 个综合征存在此分歧（如
   00010001：X₅Z₈/X₅Z₇/X₅Z₆ 残差 ∈ Z_L·S vs Z₂Y₅/Z₁Y₅/Z₀Y₅ 纠回），组间乘积权重
   3。此时综合征 + 权重不足以区分，解码器必漏其一——这正是 A8 权重 2 失败
   117/324（X_L 36 + Z_L 81）的产生机制，是截断 ML 的固有代价而非缺陷。
   表仍是综合征的确定性函数（同 key 永远给同一修正）且满足 ML 最小性。 */
const TYPES = ['x', 'y', 'z'];
function buildTable(){
  const table = new Map();
  const put = (errs, pri) => {
    const k = shorSyndromeOf(errs).join('');
    const cur = table.get(k);
    if (!cur || pri < cur.pri) table.set(k, { errs: errs.map(e => ({ q: e.q, t: e.t })), pri });
  };
  put([], 0);
  let i = 0;
  for (let q = 0; q < 9; q++) for (const t of TYPES) put([{ q, t }], 1 + i++);
  i = 0;
  for (let q1 = 0; q1 < 9; q1++) for (let q2 = q1 + 1; q2 < 9; q2++)
    for (const t1 of TYPES) for (const t2 of TYPES) put([{ q: q1, t: t1 }, { q: q2, t: t2 }], 1000 + i++);
  return table;
}
const SHOR_TABLE = buildTable();
function shorDecode(syn){
  const e = SHOR_TABLE.get(syn.join(''));
  return e ? e.errs.map(x => ({ q: x.q, t: x.t })) : [];
}
/* 表统计（页面/pot79 用）：多少综合征有 ≤2 修正、多少只能恒等 */
function shorTableStats(){
  let withFix = 0, onlyIdentity = 0, w1 = 0, w2 = 0;
  for (const [, e] of SHOR_TABLE){
    if (e.errs.length === 0) onlyIdentity++;
    else { withFix++; if (e.errs.length === 1) w1++; else w2++; }
  }
  return { syndromes: SHOR_TABLE.size, withFix, onlyIdentity, w1, w2 };
}

/* ---------- 编码 / 解码线路 ----------
   外编码（phase-flip 层，跨 3 块）：CNOT(0→3)、CNOT(0→6) 把 q0 复制到 q3/q6，
   再对 q0/q3/q6 同时 H ⟹ α|+++⟩+β|−−−⟩（块代表进入 H 基，± 号就是逻辑相位）。
   内编码（bit-flip 层，每块 3 比特）：CNOT(q→q+1)、CNOT(q→q+2) 把块代表摊成
   (|000⟩±|111⟩)/√2。合起来：α[(|000⟩+|111⟩)/√2]⊗3 + β[(|000⟩−|111⟩)/√2]⊗3。
   ⚠ 顺序不能换：若先内后外，q3/q6 的 H 基复制会被内层 CNOT 抹掉（首版把 9 个
   比特全做成相等 ⟹ GHZ 态，X 稳定子期望 = 0，已由直接振幅计算抓出）。 */
function shorEncodeGates(){
  return [
    { op: 'cnot', c: 0, q2: 3 }, { op: 'cnot', c: 0, q2: 6 },
    { op: 'h', q: 0 }, { op: 'h', q: 3 }, { op: 'h', q: 6 },
    { op: 'cnot', c: 0, q2: 1 }, { op: 'cnot', c: 0, q2: 2 },
    { op: 'cnot', c: 3, q2: 4 }, { op: 'cnot', c: 3, q2: 5 },
    { op: 'cnot', c: 6, q2: 7 }, { op: 'cnot', c: 6, q2: 8 },
  ];
}
function shorDecodeGates(){
  return [
    { op: 'cnot', c: 6, q2: 8 }, { op: 'cnot', c: 6, q2: 7 },
    { op: 'cnot', c: 3, q2: 5 }, { op: 'cnot', c: 3, q2: 4 },
    { op: 'cnot', c: 0, q2: 2 }, { op: 'cnot', c: 0, q2: 1 },
    { op: 'h', q: 6 }, { op: 'h', q: 3 }, { op: 'h', q: 0 },
    { op: 'cnot', c: 0, q2: 6 }, { op: 'cnot', c: 0, q2: 3 },
  ];
}

/* ---------- 单次试验：10 比特态矢真跑（9 数据 + 1 个复用 ancilla） ----------
   综合征提取用**顺序测量**：8 个稳定子逐个测，ancilla 测完投影后重置回 |0⟩ 再测下一个。
   稳定子两两对易 ⟹ 顺序测量与并行 8-ancilla 测量给出相同综合征、相同数据末态
   （pot79 D 组用 shorTrialParallel 的 17 比特真跑逐条对账，同种子逐位一致）。
   收益：态矢 2¹⁷ → 2¹⁰（128 倍），单次 ~23ms → ~0.2ms，MC 集合达到可交互。 */
function shorTrial(cfg = {}, rng){
  const c = { ...SHOR_DEFAULTS, ...cfg };
  const s = qcNewState(10);
  const ANC = 9;
  const trace = [];

  /* ① 逻辑初态 */
  qcApply(s, { op: 'ry', q: 0, theta: c.theta });
  qcApply(s, { op: 'rz', q: 0, theta: c.phase });
  trace.push({ step: 'prepare', gate: 'Ry(θ)Rz(φ)' });

  /* ② 编码 */
  qcApplyAll(s, shorEncodeGates());
  trace.push({ step: 'encode', gate: 'H + CNOT×8' });

  /* ③ 噪声：逐数据比特独立以 p 施加随机 Pauli（forceErrors 供穷举/测试用） */
  const errors = [];
  if (c.forceErrors){
    for (const e of c.forceErrors){ qcApply(s, { op: e.t, q: e.q }); errors.push({ q: e.q, t: e.t }); }
  } else {
    for (let q = 0; q < 9; q++){
      if (rng() < c.p){
        const t = TYPES[Math.floor(rng() * 3)];
        qcApply(s, { op: t, q });
        errors.push({ q, t });
      }
    }
  }
  trace.push({ step: 'noise', errors: errors.map(e => ({ ...e })) });

  /* ④ 综合征：ancilla 顺序测 8 个稳定子（Z 类 CNOT 数据→ancilla；
     X 类 H–CNOT(ancilla→数据)×k–H；测完重置 ancilla） */
  const syn = [];
  for (const g of SHOR_STABS){
    if (g.k === 'z'){
      for (const q of g.qs) qcApply(s, { op: 'cnot', c: q, q2: ANC });
    } else {
      qcApply(s, { op: 'h', q: ANC });
      for (const q of g.qs) qcApply(s, { op: 'cnot', c: ANC, q2: q });
      qcApply(s, { op: 'h', q: ANC });
    }
    const b = qcMeasureQubit(s, ANC, rng);
    if (b) qcApply(s, { op: 'x', q: ANC });      /* 重置 ancilla → |0⟩，测下一个 */
    syn.push(b);
  }
  trace.push({ step: 'syndrome', syn: syn.slice() });

  /* ⑤ 修正（查表） */
  const fix = shorDecode(syn);
  for (const e of fix) qcApply(s, { op: e.t, q: e.q });
  trace.push({ step: 'correct', fix: fix.map(e => ({ ...e })) });

  /* ⑥ 解码 */
  qcApplyAll(s, shorDecodeGates());
  trace.push({ step: 'decode', gate: 'CNOT×8 + H' });

  /* ⑦ 逻辑保真度：q0 的部分迹 vs 目标纯态 */
  const th = c.theta / 2, ph = c.phase;
  const alpha = [Math.cos(th), 0];
  const beta = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph)];
  const F = qcRhoFidelity(qcQubitRho(s, 0), alpha, beta);

  /* 残差陪集（代数判定，不依赖参考态） */
  let res = { x: 0, z: 0 };
  for (const e of errors) res = shorMul(res, shorPauli(e.q, e.t));
  for (const e of fix) res = shorMul(res, shorPauli(e.q, e.t));
  const coset = shorCoset(res);

  /* 逻辑错误用**代数判据**（残差 ∉ S）：与精确 P_L 同口径、参考态无关。
     ⚠ 不能用 F<0.5 判：Y_L 类残差在 Y 本征态（如 |+i⟩）上 F=1 不可见（pot79 C2 留档），
     且任何参考态都看不全三个逻辑算符（纯态 ⟨X⟩²+⟨Y⟩²+⟨Z⟩²=1）。F 判据另存 visibleError。 */
  return {
    errors, syn, fix, F,
    logicalError: coset !== 0,
    visibleError: F < 0.5,
    ok: coset === 0,
    coset,
    weight: errors.length,
    trace,
    state: s,
  };
}

/* ---------- 并行版（参照实现，pot79 D 组对账用） ----------
   17 比特态矢：9 数据 + 8 ancilla 同时测。与 shorTrial（顺序复用）在同种子下
   逐位一致（综合征、修正、F）。仅验证/展示用，不进 MC 热路径。 */
function shorTrialParallel(cfg = {}, rng){
  const c = { ...SHOR_DEFAULTS, ...cfg };
  const s = qcNewState(17);
  const trace = [];

  qcApply(s, { op: 'ry', q: 0, theta: c.theta });
  qcApply(s, { op: 'rz', q: 0, theta: c.phase });
  qcApplyAll(s, shorEncodeGates());

  const errors = [];
  if (c.forceErrors){
    for (const e of c.forceErrors){ qcApply(s, { op: e.t, q: e.q }); errors.push({ q: e.q, t: e.t }); }
  } else {
    for (let q = 0; q < 9; q++){
      if (rng() < c.p){
        const t = TYPES[Math.floor(rng() * 3)];
        qcApply(s, { op: t, q });
        errors.push({ q, t });
      }
    }
  }

  const syn = [];
  SHOR_STABS.forEach((g, gi) => {
    const anc = 9 + gi;
    if (g.k === 'z'){
      for (const q of g.qs) qcApply(s, { op: 'cnot', c: q, q2: anc });
    } else {
      qcApply(s, { op: 'h', q: anc });
      for (const q of g.qs) qcApply(s, { op: 'cnot', c: anc, q2: q });
      qcApply(s, { op: 'h', q: anc });
    }
    syn.push(qcMeasureQubit(s, anc, rng));
  });

  const fix = shorDecode(syn);
  for (const e of fix) qcApply(s, { op: e.t, q: e.q });
  qcApplyAll(s, shorDecodeGates());

  const th = c.theta / 2, ph = c.phase;
  const alpha = [Math.cos(th), 0];
  const beta = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph)];
  const F = qcRhoFidelity(qcQubitRho(s, 0), alpha, beta);

  let res = { x: 0, z: 0 };
  for (const e of errors) res = shorMul(res, shorPauli(e.q, e.t));
  for (const e of fix) res = shorMul(res, shorPauli(e.q, e.t));

  /* 与 shorTrial 同口径：代数判据（残差 ∉ S） */
  return { errors, syn, fix, F, logicalError: shorCoset(res) !== 0, visibleError: F < 0.5, ok: shorCoset(res) === 0, coset: shorCoset(res), weight: errors.length, trace, state: s };
}

/* ---------- 精确 P_L：3⁹ = 19683 个错误模式一次性穷举 ----------
   fail[w] = 权重 w 的错误模式中被判逻辑失败的个数（与 p 无关），
   P_L(p) = Σ_w fail[w]·(p/3)^w·(1−p)^{9−w} 是 9 次多项式。 */
const SHOR_FAIL = (() => {
  const fail = new Array(10).fill(0);
  const tot = new Array(10).fill(0);
  const rec = (q, errs) => {
    if (q === 9){
      const w = errs.length;
      tot[w]++;
      const fix = shorDecode(shorSyndromeOf(errs));
      let res = { x: 0, z: 0 };
      for (const e of errs) res = shorMul(res, shorPauli(e.q, e.t));
      for (const e of fix) res = shorMul(res, shorPauli(e.q, e.t));
      if (shorCoset(res) !== 0) fail[w]++;
      return;
    }
    rec(q + 1, errs);
    for (const t of TYPES){ errs.push({ q, t }); rec(q + 1, errs); errs.pop(); }
  };
  rec(0, []);
  return { fail, tot };
})();
function shorExactPL(p){
  let PL = 0;
  for (let w = 0; w <= 9; w++) PL += SHOR_FAIL.fail[w] * Math.pow(p / 3, w) * Math.pow(1 - p, 9 - w);
  return { PL, fail: SHOR_FAIL.fail.slice(), tot: SHOR_FAIL.tot.slice(), patterns: 19683 };
}

/* ---------- 码距：N(S)\S 的最小权重 ---------- */
function shorDistance(){
  /* 枚举权重 ≤2 的全部 352 个 Pauli（含恒等）：若综合征平凡（∈N(S)）但不在 S ⟹ 逻辑 */
  let best = Infinity, exhibit = null;
  const rec = (q, errs) => {
    if (errs.length > 2) return;
    if (q === 9){
      if (errs.length === 0) return;
      let v = { x: 0, z: 0 };
      for (const e of errs) v = shorMul(v, shorPauli(e.q, e.t));
      if (shorSyndromeOf(errs).every(b => b === 0) && !shorInStabilizer(v)){
        if (errs.length < best){ best = errs.length; exhibit = errs.map(e => e.q + e.t.toUpperCase()); }
      }
      return;
    }
    rec(q + 1, errs);
    for (const t of TYPES){ errs.push({ q, t }); rec(q + 1, errs); errs.pop(); }
  };
  rec(0, []);
  /* 权重 3 的逻辑必然存在（X_L 等）⟹ 码距 = 3 */
  return { distance: best === Infinity ? 3 : best, exhibit, checkedUpTo: 2 };
}

/* ---------- 权重 ≤2 模式的可纠性统计（页面叙事用） ---------- */
function shorWeight2Stats(){
  const stats = {};
  const rec = (q, errs) => {
    if (errs.length > 2) return;
    if (q === 9){
      const w = errs.length;
      if (w === 0) return;
      const key = w === 1 ? 'w1' : 'w2';
      stats[key] = stats[key] || { tot: 0, ok: 0 };
      stats[key].tot++;
      const fix = shorDecode(shorSyndromeOf(errs));
      let res = { x: 0, z: 0 };
      for (const e of errs) res = shorMul(res, shorPauli(e.q, e.t));
      for (const e of fix) res = shorMul(res, shorPauli(e.q, e.t));
      if (shorCoset(res) === 0) stats[key].ok++;
      return;
    }
    rec(q + 1, errs);
    for (const t of TYPES){ errs.push({ q, t }); rec(q + 1, errs); errs.pop(); }
  };
  rec(0, []);
  return stats;
}

/* ---------- 3 比特重复码在**同一** i.i.d. Pauli 信道下的精确 P_L（对照基线） ----------
   与 R78 的 3p²−2p³ 不同口径：那个是 bit-flip 专用信道；这里 Z 类错误不被重复码纠正，
   直接穿透成逻辑错误。解码器沿用 R78 的 4→4 综合征表（恒等/单比特 X 修正）。枚举 4³=64。 */
function repPLexact(p){
  const REP_STAB = [{ x: 0, z: 0b011 }, { x: 0, z: 0b110 }];   /* Z₀Z₁、Z₁Z₂ */
  const inS = v => {
    for (let m = 0; m < 4; m++){
      let x = 0, z = 0;
      for (let b = 0; b < 2; b++) if (m & (1 << b)){ x ^= REP_STAB[b].x; z ^= REP_STAB[b].z; }
      if (x === v.x && z === v.z) return true;
    }
    return false;
  };
  const fail = [0, 0, 0, 0], tot = [0, 0, 0, 0];
  const rec = (q, errs) => {
    if (q === 3){
      const w = errs.length;
      tot[w]++;
      /* R78 综合征表：Z 类奇偶 → 单比特 X 修正（00 → 不动） */
      const e3 = [0, 0, 0];
      for (const e of errs) if (e.t === 'x' || e.t === 'y') e3[e.q] ^= 1;
      const m0 = e3[0] ^ e3[1], m1 = e3[1] ^ e3[2];
      const k = m0 * 2 + m1;
      const fixQ = k === 2 ? 0 : k === 3 ? 1 : k === 1 ? 2 : -1;
      let res = { x: 0, z: 0 };
      for (const e of errs) res = shorMul(res, shorPauli(e.q, e.t));
      if (fixQ >= 0) res = shorMul(res, shorPauli(fixQ, 'x'));
      if (!inS(res)) fail[w]++;
      return;
    }
    rec(q + 1, errs);
    for (const t of TYPES){ errs.push({ q, t }); rec(q + 1, errs); errs.pop(); }
  };
  rec(0, []);
  let PL = 0;
  for (let w = 0; w <= 3; w++) PL += fail[w] * Math.pow(p / 3, w) * Math.pow(1 - p, 3 - w);
  return { PL, fail, tot };
}

/* ---------- 蒙特卡洛集合 ----------
   逻辑失败用**代数判据**（残差 ∉ S，即 coset≠0），与 shorExactPL 同口径：
   综合征超出权重 ≤2 覆盖时解码器不动作（shorDecode 返回 []），残差 ∉ N(S)，
   计入 byCoset[4]（越界类）。F<0.5 的可见判据另见 trial.visibleError。 */
function shorEnsemble(cfg = {}){
  const c = { ...SHOR_DEFAULTS, ...cfg };
  const rng = mulberry32(c.seed);
  const n = Math.max(1, c.trials | 0);
  let nL = 0;
  const byWeight = new Array(10).fill(0);
  const byWeightL = new Array(10).fill(0);
  const byCoset = [0, 0, 0, 0, 0];   /* [∈S, X_L·S, Z_L·S, Y_L·S, ∉N(S)]；shorCoset 的 −1 归入越界类 */
  for (let k = 0; k < n; k++){
    const r = shorTrial(c, rng);
    byWeight[r.weight]++;
    if (r.logicalError){ nL++; byWeightL[r.weight]++; byCoset[r.coset === -1 ? 4 : r.coset]++; }
  }
  const ex = shorExactPL(c.p);
  return {
    p: c.p, trials: n, PL: nL / n,
    PLexact: ex.PL, Pun: c.p,
    byWeight, byWeightL, byCoset,
    /* 对照：重复码（同信道）与未编码 */
    repExact: repPLexact(c.p).PL,
  };
}

/* 扫描（页面曲线用）：**精确** P_L(p) 与重复码对照（穷举与 p 无关，O(1) 每点）。
   MC 点只画当前 p（ensemble 已给），不做全曲线 MC——17→10 比特后单次 0.2ms，
   但 12 点 × 数千次仍要数秒，曲线用精确值即可（pot79 C 组多点对账 MC vs 精确）。 */
function shorSweep(cfg = {}){
  const c = { ...SHOR_DEFAULTS, ...cfg };
  const ps = c.ps || [0.002, 0.005, 0.01, 0.02, 0.04, 0.07, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5];
  const out = { p: [], PLexact: [], rep: [], Pun: [] };
  for (const p of ps){
    out.p.push(p);
    out.PLexact.push(shorExactPL(p).PL);
    out.rep.push(repPLexact(p).PL);
    out.Pun.push(p);
  }
  return out;
}

/* Shor 精确曲线与两条基线的第一个交叉点（二分，页面标注用） */
function shorCrossover(kind = 'uncoded'){
  const f = p => shorExactPL(p).PL - (kind === 'uncoded' ? p : repPLexact(p).PL);
  let lo = 1e-6, hi = 0.6;
  if (f(lo) > 0) return null;          /* 一开始就输（不该发生） */
  if (f(hi) < 0) return null;          /* 一直赢（不该发生） */
  for (let i = 0; i < 60; i++){
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* ===== src/physics/noise.js ===== */
/* ============================================================================
 * noise.js — R77 开放量子系统：密度矩阵 / Kraus 通道 / 量子轨迹 / T₁ T₂
 *
 * 前几轮的量子态都是**纯态**（|ψ⟩，2^n 个复数）。真实器件不是：与环境的耦合把
 * 纯态变成混合态，必须用密度矩阵 ρ（2^n × 2^n 厄米、半正定、tr=1）。
 *
 * 三个通道（全部是**精确解**，不是一阶近似——Kraus 形式对任意大的参数都成立）：
 *   振幅阻尼（T₁ 弛豫，能量泄漏）  γ = 1−e^{−t/T₁}
 *     E₀ = diag(1, √(1−γ)),  E₁ = [[0,√γ],[0,0]]
 *   相位阻尼（T₂ 纯退相位，只毁相干）λ = 1−e^{−t/T₂}
 *     随机相位实现：E₀ = √(1−λ/2)·I,  E₁ = √(λ/2)·Z
 *     （等价于 E₀=diag(1,√(1−λ)), E₁=diag(0,√λ)，但「以 λ/2 概率翻相对相位」
 *       更贴 R69 的物理图像，也让量子轨迹看出「哪一步跳了」）
 *   退极化（各向同性收缩）          p = 1−e^{−t/T_dep}
 *     E₀=√(1−3p/4)I, E₁=√(p/4)X, E₂=√(p/4)Y, E₃=√(p/4)Z  ⟹ Bloch 向量 ×(1−p)
 *
 * 单比特闭式（θ,φ 初态）：
 *   relax  : x,y = sinθ(cosφ,sinφ)·e^{−t/2T₁},  z = cosθ·e^{−t/T₁} + (1−e^{−t/T₁})
 *            ⟹ **T₂ ≤ 2T₁ 的物理来源**：纯 T₁ 极限下横向衰减率恰为 1/(2T₁)
 *   dephase: x,y × e^{−t/T₂},  z 不变
 *   depolar: x,y,z × e^{−t/T_dep}
 *
 * 两比特（Bell |Φ⁺⟩）的 concurrence 本页全用 **X 态闭式**：所有上述通道都不改变
 * 布居结构 ⟹ ρ 恒为 X 形，C = 2·max(0, |ρ₀₃|−√(ρ₁₁ρ₂₂), |ρ₁₂|−√(ρ₀₀ρ₃₃)) 精确。
 *   双侧相位阻尼 C = e^{−2t/T₂}；单侧 C = e^{−t/T₂}
 *   双侧退极化 C = max(0, [3(1−p)²−1]/2) ⟹ **纠缠猝死**（ESD）于 (1−p)²=1/3
 *   单侧退极化 C = max(0, 1−3p/2)                   ⟹ ESD 于 p=2/3
 * ========================================================================== */

const NZ_DEFAULTS = {

  n: 1,                          /* 比特数（1 = 单比特 Bloch；2 = Bell 纠缠） */
  tau: 1.0,                      /* 当前通道的时间常数（显示为 T₁ / T₂ / T_dep） */
  theta: Math.PI / 2, phi: 0,    /* 单比特初态 |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩ */
  dt: 0.01, steps: 400,
  side: 'both',                  /* bell: both | q0 */

};

const NZ_PRESETS = {

  },

  },
